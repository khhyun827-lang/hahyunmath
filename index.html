/* =================== 로그인 (design-v1/17-login) ===================
   **역할: 누구로 들어갈지 고르고 들어간다. 그 이상은 하지 않는다.**

   **문 셋을 동등하게 두지 않았다.** 구버전은 학생·조교·강사를 같은 크기의 탭 셋으로 세웠다.
   그런데 여기 오는 사람은 거의 전부 학생이고, 조교는 계정이 아직 하나도 없고, 강사는 한 명이다.
   → 학생 폼이 곧 화면이고 조교·강사는 아래 작은 글이다. 공개 홈도 이미 같은 비중이다
   (상단바에 「학생 로그인」, 푸터에 「강사 로그인」).

   ⚠ **`<form>`으로 감쌌다.** 구버전은 버튼 onclick뿐이라 **입력칸에서 Enter를 쳐도 아무 일이
   없었다.** 로그인 화면에서 Enter가 안 먹는 것은 그 자체로 결함이다. */
function lgField(o){
  return `<div class="lo-f"><label class="lo-lab" for="${o.id}">${o.label}</label>
    <input class="lo-in" id="${o.id}" type="${o.type||'text'}" placeholder="${o.ph||''}"
      ${o.auto ? `autocomplete="${o.auto}"` : ''} ${o.focus ? 'autofocus' : ''}></div>`;
}
function loginHTML(){
  const mode = state.loginMode || 'student';
  const needsSetup = mode==='teacher' && DATA.teacherPw===null;
  const submit = mode==='student' ? 'doStudentLogin()'
               : mode==='assistant' ? 'doAssistantLogin()' : 'doTeacherLogin()';

  let body;
  if(mode==='teacher'){
    body = `
      ${needsSetup ? `<div class="note" style="margin-bottom:22px;">
        <div class="d">FIRST RUN</div>
        관리자 비밀번호를 정해 주세요. 4자 이상입니다.<br>
        <b style="color:var(--ink);">잊으면 되찾을 수 없습니다</b> — 저장된 곳이 여기 한 곳뿐입니다.
      </div>` : ''}
      ${lgField({id:'login-pw', label:'관리자 비밀번호', type:'password',
                 auto: needsSetup ? 'new-password' : 'current-password', focus:1})}
      ${needsSetup ? lgField({id:'login-pw2', label:'한 번 더', type:'password', auto:'new-password'}) : ''}
      <button class="lo-go" type="submit">${needsSetup ? '설정하고 시작하기' : '로그인'}</button>`;
  } else {
    const who = mode==='assistant' ? '강사에게' : '선생님께';
    body = `
      ${lgField({id:'login-id', label:'아이디', auto:'username', focus:1,
                 ph: mode==='assistant' ? '강사에게 안내받은 아이디' : '학원에서 안내받은 아이디'})}
      ${lgField({id:'login-pw', label:'비밀번호', type:'password', auto:'current-password', ph:'비밀번호'})}
      <button class="lo-go" type="submit">로그인</button>
      <p class="lo-hint">아이디·비밀번호를 잊으셨다면<br>${who} 문의해 주세요.</p>`;
  }

  return `
  <div class="app lo">
    <div class="lo-col">
      <img class="lo-logo" src="${LOGO_H1}" alt="김하현수학연구소 — 홈으로"
           title="홈으로" onclick="goto('home')">

      ${state.loginError ? `<div class="lo-err">${iconSvg('alert',16)}
        <div><b>${escHtml(state.loginError)}</b></div></div>` : ''}

      <form onsubmit="${submit}; return false;">${body}</form>

      ${mode==='student'
        ? `<div class="lo-doors">
             <a onclick="goLoginMode('assistant')">조교로 로그인</a><s>·</s>
             <a onclick="goLoginMode('teacher')">강사로 로그인</a>
           </div>`
        : `<div class="lo-doors">
             <a onclick="goLoginMode('student')">← 학생 로그인으로</a>
           </div>`}
    </div>
  </div>`;
}
/* 문을 옮길 때 오류 메시지를 반드시 지운다 — 남아 있으면 «조교 화면에 학생 오류»가 뜬다. */
function goLoginMode(mode){
  state.loginMode = mode;
  state.loginError = '';
  render();
}

/* =================== 학생 마이페이지 (design-v1/20-student-app) ===================
   **탭 11개를 4개로 묶었다. 기능은 하나도 빼지 않았다.**
   예전에는 홈·데일리퀴즈·진도/과제·오답숙제·강의시청·성적·출석·공지사항·질의응답·
   클리닉 신청·채팅 열한 개가 평평하게 나열돼 있었다. 데스크톱에서는 되지만
   하단 탭바에 들어가는 것은 4~5개가 한계고, 열한 개를 가로로 밀게 하면 뒤쪽은 아무도 안 누른다.

   묶는 기준은 «학생이 지금 뭘 하려는가»다.
     홈   — 오늘 뭐 해야 하지
     학습 — 손을 쓰는 화면 (제출·입력·시청)
     기록 — 읽기만 하는 화면
     소통 — 선생님과 닿는 경로

   **탭 id는 예전 이름을 그대로 쓴다.** state.studentTab이 여전히 «화면 하나»를 가리키고,
   그것이 어느 탭에 속하는지는 STUDENT_TAB_SECTION이 되찾아 준다 (관리자 셸과 같은 장치다).
   그래서 #student/quiz 해시 · goStudentPage('clinic') · 알림 드롭다운의 gotoCode가
   전부 손대지 않고 그대로 동작한다.

   **모바일이 기준이다.** 데일리퀴즈 제출·오답 답 입력·강의 시청·클리닉 신청은
   전부 학생이 집이나 이동 중에 폰으로 하는 일이다. 데스크톱에서 열면 한 칸이 가운데로 모인다. */

const STUDENT_NAV = [
  ['홈',   'home',   'home'],
  ['학습', 'quiz',   'book'],
  ['기록', 'grades', 'chart'],
  ['소통', 'notice', 'chat']
];
/* 탭 안의 갈래. 관리자와 달리 «목록 화면»을 한 겹 더 두지 않는다 —
   넷을 한 줄에 세울 수 있는데 굳이 한 번 더 누르게 할 이유가 없다. */
const STUDENT_SUBNAV = {
  '학습': [['데일리퀴즈','quiz'], ['오답숙제','wronghw'], ['진도·과제','progress'], ['강의','video']],
  '기록': [['성적','grades'], ['출석','attendance']],
  '소통': [['공지','notice'], ['질의응답','qna'], ['클리닉','clinic'], ['채팅','chat']]
};
const STUDENT_TAB_SECTION = {
  home:'홈',
  quiz:'학습', wronghw:'학습', progress:'학습', video:'학습',
  grades:'기록', attendance:'기록',
  notice:'소통', qna:'소통', clinic:'소통', chat:'소통'
};

function goStudentTab(tab){
  state.studentTab = tab;
  state.notifOpen = false;
  render();
  window.scrollTo(0, 0);
}

/* 한 화면이 쓰는 것을 한 곳에서 고른다. 열한 개가 저마다 같은 filter를 되풀이하고 있었다. */
function stuCtx(){
  const sid = state.currentUser.studentId;
  const rec = DATA.records[sid] ||
    {scores:[], attendance:[], assignments:[], progress:{unit:'',percent:0},
     quizAnswers:{}, wrongHomework:[], videoProgress:{}, assignmentsDone:{}};
  const me = DATA.students.find(s=>s.studentId===sid) || {};
  const classId = me.classId;
  return {
    sid, rec, me, classId,
    quizzes:  DATA.quizzes.filter(q=>!q.classId || q.classId===classId),
    homework: DATA.assignments.filter(a=>!a.classId || a.classId===classId),
    videos:   DATA.videos.filter(v=>v.studentId ? v.studentId===sid : (!v.classId || v.classId===classId)),
    exams:    DATA.exams.filter(e=>e.classId===classId),
    qnas:     DATA.qnas.filter(q=>q.studentId===sid),
    clinics:  DATA.clinics.filter(c=>c.studentId===sid)
  };
}

/* 출석률 = 「퇴원」을 뺀 기록 중 「결석」이 아닌 비율. 지각·조퇴는 «온 것»으로 센다.
   명단(rosterStats)이 쓰는 정의와 같은 것이다 — 두 화면이 다른 숫자를 말하면 둘 다 못 믿게 된다.
   (rosterStats는 state.allRecords를 보는데 그건 교사만 싣는다. 규칙만 같이 쓴다.) */
function stuAttRate(rec){
  const counted = (rec.attendance||[]).filter(a=>a.status!=='퇴원');
  if(counted.length===0) return null;
  return Math.round(counted.filter(a=>a.status!=='결석').length / counted.length * 100);
}
/* 시청률 = 대상 영상들의 진도율 평균. studentVideoSummary(교사 화면)와 같은 식이다. */
function stuVideoAvg(c){
  if(c.videos.length===0) return null;
  const sum = c.videos.reduce((n,v)=> n + ((c.rec.videoProgress[v.id]||{}).percent || 0), 0);
  return Math.round(sum / c.videos.length);
}
function stuDday(due){
  if(!due) return null;
  const t = todayStr();
  if(due < t)  return {label:'지남', tone:'no'};
  if(due === t) return {label:'오늘', tone:'no'};
  const days = Math.round((Date.parse(due+'T00:00:00Z') - Date.parse(t+'T00:00:00Z')) / 86400000);
  return {label:'D-'+days, tone: days<=3 ? 'no' : days<=7 ? 'late' : ''};
}
/* ⚠ 이 결과를 .mono 안에 넣지 말 것. JetBrains Mono에는 한글 글리프가 없어서
   브라우저가 «고정폭 한글 글꼴»로 떨어뜨린다 — 「오늘」이 「오 늘」처럼 벌어진다.
   자유 텍스트 시간(「7시~9시」·「저녁 7시」)도 같다. mono는 YYYY-MM-DD·숫자·퍼센트에만 쓴다. */
function stuDateLabel(ymd){
  if(!ymd) return '';
  const t = todayStr();
  if(ymd===t) return '오늘';
  if(ymd===shiftYmd(t,1)) return '내일';
  const [y,m,d] = ymd.split('-').map(Number);
  return `${m}월 ${d}일 (${WEEKDAY_LABEL[new Date(ymd+'T00:00:00').getDay()]})`;
}
/* 다음 수업 — 반 일정에서 오늘 이후 첫 수업일. 시각은 자유 텍스트라 그대로 보여 준다. */
function stuNextSession(classId){
  const cls = DATA.classes.find(x=>x.id===classId);
  if(!cls) return null;
  const days = parseScheduleDays(cls.schedule);
  if(days.length===0) return null;
  const d = new Date();
  for(let i=0; i<14; i++){
    if(days.includes(d.getDay())) return {date: ymdLocal(d), cls};
    d.setDate(d.getDate()+1);
  }
  return null;
}

/* «오늘 뭐 해야 하지»에 답하는 한 줄들. 네 종류가 한 목록에 섞인다 —
   학생에게 «퀴즈 탭에 하나, 과제 탭에 둘»은 의미 없는 구분이다. */
function stuTodo(c){
  const items = [];
  c.quizzes.filter(q=>!c.rec.quizAnswers[q.id]).forEach(q=>items.push({
    icon:'sparkle', bg:'var(--latebg)', fg:'var(--late)',
    title:q.title || '데일리퀴즈', sub:`데일리퀴즈 · ${q.date||''}`,
    tab:'quiz', pre:`state.stuQuizId='${q.id}';`
  }));
  c.rec.wrongHomework.filter(h=>{
    const bank = DATA.problemBank.find(b=>b.id===h.bankId);
    return bank && bank.status==='approved' && !h.done;
  }).forEach(h=>{
    const exam = DATA.exams.find(e=>e.id===h.examId);
    items.push({
      icon:'clipboard', bg:'var(--nobg)', fg:'var(--no)',
      title:`오답숙제 ${h.questionNo}번`, sub:(exam ? exam.title : '시험지') + ' 쌍둥이 문제',
      tab:'wronghw'
    });
  });
  c.homework.filter(a=>!c.rec.assignmentsDone[a.id]).forEach(a=>items.push({
    icon:'document', bg:'var(--bluebg)', fg:'var(--blue)',
    title:a.title, sub:'과제' + (a.dueDate ? ' · '+a.dueDate+'까지' : ''),
    due:a.dueDate || '', dday:stuDday(a.dueDate), tab:'progress'
  }));
  c.videos.filter(v=>!((c.rec.videoProgress[v.id]||{}).completed)).forEach(v=>{
    const p = c.rec.videoProgress[v.id];
    items.push({
      icon:'video', bg:'var(--accent-bg)', fg:'var(--accent)',
      title:v.title, sub:'강의' + (p ? ` · ${p.percent}%까지 봄` : ' · 아직 안 봄'),
      tab:'video', pre:`state.stuVideoId='${v.id}';`
    });
  });
  /* 마감이 가까운 것이 위로 온다. 마감이 없는 것(퀴즈·오답·영상)은 그 아래에 원래 순서대로. */
  return items.sort((a,b)=>{
    if(a.due && b.due) return a.due.localeCompare(b.due);
    return (a.due ? 0 : 1) - (b.due ? 0 : 1);
  });
}

/* ---------- 홈 ---------- */
/* 첫 화면이 답해야 할 질문은 하나다 — «오늘 뭐 해야 하지?»
   예전 홈에는 질문 폼·반 진도 링·빠른 변형 문제 요청·영상 카드가 함께 있었다.
   전부 제 화면이 따로 있는 것들이라 그리로 보냈다. 남은 것은 «할 일»과 그 주변뿐이다. */
function stuHomeHTML(c){
  const todo = stuTodo(c);
  const next = stuNextSession(c.classId);
  const cp = getClassProgress(c.classId);
  const nextUnit = cp.chapters.find(u=>!cp.doneMap[u]);
  const attRate = stuAttRate(c.rec);
  const hwDone = c.homework.filter(a=>c.rec.assignmentsDone[a.id]).length;
  const vidAvg = stuVideoAvg(c);

  return `
  <div class="sap-hi">
    <b>${escHtml(c.me.name || state.currentUser.name)}님</b>
    <span>${[c.me.school, c.me.grade, classNameOf(c.classId)].filter(Boolean).map(escHtml).join(' · ')}</span>
  </div>

  <div class="msec" style="margin-top:22px;">오늘 할 일
    ${todo.length ? `<span style="color:var(--no);">${todo.length}</span>` : ''}</div>
  ${todo.length===0
    ? `<div class="mc"><div class="mrow" style="justify-content:center;font-size:13px;color:var(--dim);">
         지금 밀린 것이 없습니다.</div></div>`
    : todo.slice(0,6).map(t=>`
      <div class="todo" onclick="${t.pre||''} goStudentTab('${t.tab}')" style="cursor:pointer;">
        <span class="ic" style="background:${t.bg};color:${t.fg};">${iconSvg(t.icon,18)}</span>
        <span class="t">
          <b>${escHtml(t.title)}${t.dday?` <span class="badge ${t.dday.tone}">${t.dday.label}</span>`:''}</b>
          <span>${escHtml(t.sub)}</span>
        </span>
        <span class="go">${iconSvg('chevR',16)}</span>
      </div>`).join('')}
  ${todo.length>6 ? `<div style="margin-top:10px;text-align:center;font-size:11.5px;color:var(--dim);">
    외 ${todo.length-6}건은 각 화면에 있습니다</div>` : ''}

  <div class="msec">다음 수업</div>
  ${!next
    ? `<div class="mc"><span style="font-size:12.5px;color:var(--dim);">
         ${c.classId ? '반 일정이 등록되어 있지 않습니다.' : '아직 반에 배정되지 않았습니다.'}</span></div>`
    : `<div class="mc">
        <div class="row b" style="gap:9px;flex-wrap:wrap;">
          <b style="font-size:15px;font-weight:700;">${stuDateLabel(next.date)}
            ${escHtml(sessionTimeText(next.cls.schedule))}</b>
          <span style="font-size:12.5px;color:var(--sub);">${escHtml(next.cls.name)}</span>
        </div>
        ${cp.subject ? `<div style="font-size:12px;color:var(--dim);margin-top:8px;">
          진도 · ${escHtml(cp.subject)}${nextUnit ? ' — '+escHtml(nextUnit) : ' — 모든 단원 완료'}</div>` : ''}
      </div>`}

  <div class="msec">요약</div>
  <div class="kpis">
    <div class="kpi"><div class="k">출석률</div>
      <div class="v">${attRate===null ? '—' : attRate+'<s>%</s>'}</div></div>
    <div class="kpi"><div class="k">과제</div>
      <div class="v">${hwDone}<s>/${c.homework.length}</s></div></div>
    <div class="kpi"><div class="k">시청</div>
      <div class="v ${vidAvg!==null && vidAvg<70 ? 'down' : ''}">${vidAvg===null ? '—' : vidAvg+'<s>%</s>'}</div></div>
  </div>`;
}

/* ---------- 데일리퀴즈 ---------- */
/* 시안은 «10문항 중 3번»을 한 문제씩 푸는 화면이었다. 도메인에는 그런 묶음이 없다 —
   퀴즈 하나가 한 문항이고 날짜별로 따로 선다. 그래서 «지금 풀 회차 하나를 크게»는 그대로 가져오고,
   진행 표시는 지어낸 10문항이 아니라 «제출한 회차 / 전체 회차»로 바꿨다. */
function stuQuizHTML(c){
  const list = c.quizzes;
  if(list.length===0) return `<div class="sap-empty">아직 등록된 데일리퀴즈가 없습니다.</div>`;
  const undone = list.filter(q=>!c.rec.quizAnswers[q.id]);
  const cur = list.find(q=>q.id===state.stuQuizId) || undone[0] || list[0];
  const doneCount = list.length - undone.length;
  const curDone = c.rec.quizAnswers[cur.id];

  return `
  <div class="sap-prog" style="margin:0 0 16px;">
    <span class="bar"><i style="width:${Math.round(doneCount/list.length*100)}%"></i></span>
    <b>${doneCount}/${list.length}</b>
  </div>

  <div class="mc ${curDone ? '' : 'go'}">
    <div class="row" style="gap:7px;">
      <span class="badge ${curDone?'ok':'late'}">${curDone?'제출 완료':'제출 대기'}</span>
      <span class="badge">${escHtml(quizClassLabel(cur.classId))}</span>
      <span class="spacer"></span>
      <span class="mono" style="font-size:10.5px;color:var(--dim);">${escHtml(cur.date||'')}</span>
    </div>
    <div style="font-size:13.5px;font-weight:700;margin-top:11px;">${escHtml(cur.title)}</div>
    <div class="sap-q" style="margin-top:9px;">${escHtml(cur.content)}</div>
    <div style="margin-top:15px;">
      ${curDone
        ? `<div class="mrow" style="min-height:0;gap:8px;">
             <span style="font-size:12px;color:var(--sub);">낸 답</span>
             <b class="mono" style="font-size:15px;">${escHtml(curDone.answer)}</b>
             <span class="spacer"></span>
             <span class="mono" style="font-size:11px;color:var(--dim);">${escHtml(curDone.submittedAt||'')}</span>
           </div>
           <div style="margin-top:9px;font-size:11.5px;color:var(--dim);line-height:1.7;">
             데일리퀴즈에는 정답이 등록되지 않아 자동 채점되지 않습니다. 선생님이 답안을 직접 봅니다.</div>`
        : isMultipleChoice(cur.content)
          ? `${answerInputHTML('qa-'+cur.id)}
             <button class="mbtn p" style="margin-top:11px;" onclick="submitQuizAnswer('${cur.id}','${c.sid}')">제출</button>`
          : `<input id="qa-${cur.id}" class="sap-in" placeholder="답을 입력하세요">
             <button class="mbtn p" style="margin-top:9px;" onclick="submitQuizAnswer('${cur.id}','${c.sid}')">제출</button>`}
    </div>
  </div>

  ${list.length>1 ? `
  <div class="msec">지난 회차</div>
  ${list.filter(q=>q.id!==cur.id).map(q=>{
    const a = c.rec.quizAnswers[q.id];
    return `<div class="mc" onclick="state.stuQuizId='${q.id}'; render(); window.scrollTo(0,0)"
        style="cursor:pointer;${a?'opacity:.7;':''}">
      <div class="mrow" style="min-height:38px;">
        <span style="flex:1;min-width:0;">
          <b style="display:block;font-size:13.5px;font-weight:600;">${escHtml(q.title)}</b>
          <span style="display:block;font-size:11px;color:var(--dim);margin-top:3px;"
            class="mono">${escHtml(q.date||'')}</span>
        </span>
        ${a ? `<span class="badge ok">제출</span>` : `<span class="badge late">대기</span>`}
      </div>
    </div>`;
  }).join('')}` : ''}`;
}

/* ---------- 오답숙제 ---------- */
/* 원본 문항 번호를 반드시 같이 보여 준다. «내가 뭘 틀려서 이걸 푸는지»를 모르면 그냥 새 숙제가 된다.
   시험지별로 묶는 것도 같은 이유다 — 오답숙제는 «어느 시험을 다시 푸는 일»이다. */
function stuWrongHTML(c){
  const hws = c.rec.wrongHomework;
  const byExam = {};
  hws.forEach(h=>{ (byExam[h.examId] = byExam[h.examId] || []).push(h); });
  const examIds = Object.keys(byExam);
  const selectedExam = c.exams.find(e=>e.id===state.wrongExamId);

  const card = hw => {
    const bank = DATA.problemBank.find(b=>b.id===hw.bankId);
    if(!bank) return '';
    if(bank.status!=='approved'){
      return `<div class="mc">
        <div class="row" style="gap:7px;">
          <span class="badge score">원본 ${hw.questionNo}번</span>
          <span class="spacer"></span><span class="badge">검토 중</span>
        </div>
        <div style="font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.7;">
          선생님이 쌍둥이 문제를 검토하고 있습니다. 끝나면 여기에 문제가 뜹니다.</div>
      </div>`;
    }
    if(bank.hasImage && state.pbImageCache[bank.id]===undefined) togglePbImage(bank.id);
    const img = bank.hasImage && state.pbImageCache[bank.id]
      && state.pbImageCache[bank.id]!=='empty' && state.pbImageCache[bank.id]!=='loading'
      ? state.pbImageCache[bank.id] : null;
    const correct = hw.done && hw.studentAnswer.trim()===bank.variantAnswer.trim();
    return `<div class="mc ${hw.done ? '' : 'go'}" style="${hw.done?'opacity:.75;':''}">
      <div class="row" style="gap:7px;">
        <span class="badge score">원본 ${hw.questionNo}번</span>
        <span class="spacer"></span>
        ${hw.done ? `<span class="badge ${correct?'ok':'no'}">${correct?'정답':'오답'}</span>`
                  : `<span class="badge late">풀 차례</span>`}
      </div>
      <div class="sap-q" style="margin-top:11px;">${escHtml(bank.variantContent)}</div>
      ${bank.hasImage ? (img ? `<img class="sap-img" src="${img}">`
                             : `<div style="font-size:11.5px;color:var(--dim);margin-top:9px;">그림 불러오는 중…</div>`) : ''}
      <div style="margin-top:14px;">
        ${hw.done
          ? `<div class="mrow" style="min-height:0;gap:8px;">
               <span style="font-size:12px;color:var(--sub);">낸 답</span>
               <b class="mono" style="font-size:15px;">${escHtml(hw.studentAnswer)}</b>
               ${correct ? '' : `<span class="spacer"></span>
                 <span style="font-size:12px;color:var(--sub);">정답</span>
                 <b class="mono" style="font-size:15px;color:var(--ok);">${escHtml(bank.variantAnswer)}</b>`}
             </div>`
          : isMultipleChoice(bank.variantContent)
            ? `${answerInputHTML('hw-answer-'+bank.id)}
               <button class="mbtn p" style="margin-top:11px;" onclick="submitHomeworkAnswer('${bank.id}')">제출</button>`
            : `<input id="hw-answer-${bank.id}" class="sap-in" placeholder="답을 입력하세요">
               <button class="mbtn p" style="margin-top:9px;" onclick="submitHomeworkAnswer('${bank.id}')">제출</button>`}
      </div>
    </div>`;
  };

  return `
  ${state.stuWrongMode ? `
  <div class="mc hi">
    <div style="font-size:13px;font-weight:700;">틀린 문제 등록</div>
    <div style="font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7;">
      시험지를 고르고 틀린 번호를 모두 누르세요. 같은 단원의 쌍둥이 문제가 숙제로 나갑니다.</div>
    ${c.exams.length===0
      ? `<div style="font-size:12.5px;color:var(--dim);margin-top:12px;">우리 반에 등록된 시험지가 없습니다.</div>`
      : `<div style="margin-top:13px;">
          <div class="sap-lab">시험지</div>
          <select class="sap-in" onchange="state.wrongExamId=this.value; state.wrongChecked={}; render()">
            <option value="">— 선택 —</option>
            ${c.exams.map(e=>`<option value="${e.id}" ${state.wrongExamId===e.id?'selected':''}>${escHtml(e.title)} (${e.date||'-'})</option>`).join('')}
          </select>
        </div>
        ${selectedExam ? `
        <div style="margin-top:14px;">
          <div class="sap-lab">틀린 번호</div>
          <div class="row" style="flex-wrap:wrap;gap:7px;">
            ${selectedExam.questions.map(q=>`<a class="pill ${state.wrongChecked[q.no]?'on':''}"
              onclick="toggleWrongCheck(${q.no})">${q.no}</a>`).join('')}
          </div>
        </div>
        <button class="mbtn p" style="margin-top:14px;" onclick="submitWrongAnswers()">제출하기</button>` : ''}`}
    <button class="mbtn q" style="margin-top:6px;" onclick="state.stuWrongMode=false; render()">닫기</button>
  </div>`
  : `<button class="mbtn" style="margin-bottom:4px;" onclick="state.stuWrongMode=true; render()">${iconSvg('plus',16)} 틀린 문제 등록</button>`}

  ${hws.length===0
    ? `<div class="sap-empty">아직 배정된 오답숙제가 없습니다.<br>시험을 본 뒤 틀린 번호를 등록하면 쌍둥이 문제가 나갑니다.</div>`
    : examIds.map(eid=>{
        const exam = DATA.exams.find(e=>e.id===eid);
        const group = byExam[eid];
        const done = group.filter(h=>h.done).length;
        return `
        <div class="msec">${escHtml(exam ? exam.title : '삭제된 시험지')}</div>
        <div class="sap-prog" style="margin:0 0 11px;">
          <span class="bar"><i style="width:${Math.round(done/group.length*100)}%"></i></span>
          <b>${done}/${group.length}</b>
        </div>
        ${group.map(card).join('')}`;
      }).join('')}`;
}

/* ---------- 진도 · 과제 ---------- */
/* 반 진도와 내 과제를 한 화면에 둔다. «어디까지 나갔는지»와 «내가 뭘 안 냈는지»는
   학생 입장에서 같은 질문이다. */
function stuProgressHTML(c){
  markSeen('homework', c.homework.length);
  const cp = getClassProgress(c.classId);
  const nextUnit = cp.chapters.find(u=>!cp.doneMap[u]);
  const undone = c.homework.filter(a=>!c.rec.assignmentsDone[a.id]);
  const doneCount = c.homework.length - undone.length;
  /* 마감이 가까운 미완료가 위로, 완료는 아래로. */
  const sorted = c.homework.slice().sort((a,b)=>{
    const ad = !!c.rec.assignmentsDone[a.id], bd = !!c.rec.assignmentsDone[b.id];
    if(ad!==bd) return ad ? 1 : -1;
    return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
  });

  return `
  ${!cp.subject
    ? `<div class="mc"><span style="font-size:12.5px;color:var(--dim);">아직 등록된 진도가 없습니다.</span></div>`
    : `<div class="mc">
        <div class="mrow" style="min-height:0;">
          <span style="flex:1;font-size:13.5px;font-weight:700;">${escHtml(cp.subject)}</span>
          <b class="mono" style="font-size:15px;">${cp.percent}%</b>
        </div>
        <div class="bar" style="margin-top:11px;"><i style="width:${cp.percent}%"></i></div>
        <div style="font-size:12px;color:var(--sub);margin-top:11px;">
          ${cp.doneCount} / ${cp.chapters.length}단원 완료</div>
        <div style="font-size:12px;color:var(--dim);margin-top:5px;">
          다음 · ${nextUnit ? escHtml(nextUnit) : '모든 단원을 끝냈습니다'}</div>
      </div>`}

  <div class="msec">과제 <span class="mono" style="color:${undone.length?'var(--late)':'var(--dim)'};">${doneCount}/${c.homework.length}</span></div>
  ${c.homework.length===0
    ? `<div class="mc"><span style="font-size:12.5px;color:var(--dim);">등록된 과제가 없습니다.</span></div>`
    : sorted.map(a=>{
        const on = !!c.rec.assignmentsDone[a.id];
        const dd = on ? null : stuDday(a.dueDate);
        return `<div class="mc" style="${on?'opacity:.65;':''}">
          <div class="mrow" style="min-height:34px;gap:11px;cursor:pointer;"
            onclick="toggleHomeworkDone('${c.sid}','${a.id}')">
            <span style="width:22px;height:22px;border-radius:var(--r-xs);flex-shrink:0;cursor:pointer;
              display:flex;align-items:center;justify-content:center;
              ${on?'background:var(--accent);color:#fff;':'border:1.5px solid #C9C6BB;color:transparent;'}"
              >${iconSvg('check',14)}</span>
            <span style="flex:1;min-width:0;font-size:13.5px;${on?'color:var(--sub);':'font-weight:600;'}">
              ${escHtml(a.title)}</span>
            ${dd ? `<span class="badge ${dd.tone}">${dd.label}</span>`
                 : `<span class="mono" style="font-size:11px;color:var(--dim);">${escHtml(a.dueDate||'')}</span>`}
          </div>
          ${a.description ? `<div style="font-size:12.5px;color:var(--sub);line-height:1.75;
            white-space:pre-wrap;margin-top:4px;padding-left:33px;">${escHtml(a.description)}</div>` : ''}
        </div>`;
      }).join('')}

  ${/* 단원 체크리스트는 «읽는 것»이라 손이 닿는 자리(과제) 아래에 둔다.
       카드를 단원마다 하나씩 세우면 열 줄에 480px을 쓴다 — 한 카드 안의 줄로 접었다. */
    cp.chapters.length ? `
  <div class="msec">단원 <span class="mono">${cp.doneCount}/${cp.chapters.length}</span></div>
  <div class="mc" style="padding:4px 15px;">
    ${cp.chapters.map(u=>{
      const on = !!cp.doneMap[u];
      return `<div class="row" style="gap:10px;padding:10px 0;
        ${cp.chapters[0]===u?'':'border-top:1px solid var(--line2);'}">
        <span style="width:18px;height:18px;border-radius:var(--r-xs);flex-shrink:0;
          display:flex;align-items:center;justify-content:center;
          ${on?'background:var(--accent);color:#fff;':'border:1.5px solid #C9C6BB;color:transparent;'}"
          >${iconSvg('check',12)}</span>
        <span style="flex:1;min-width:0;font-size:12.5px;${on?'':'color:var(--dim);'}">${escHtml(u)}</span>
      </div>`;
    }).join('')}
  </div>` : ''}`;
}

/* ---------- 강의시청 ---------- */
/* 이어보기를 맨 위에 둔다. 중단 지점이 기록돼 있는데 목록 맨 아래에서 찾게 하면 결국 안 본다.
   **한 번에 하나만 임베드한다.** 예전에는 목록 수만큼 iframe이 떠서, 영상이 열 개면
   화면을 열자마자 유튜브를 열 번 불렀다. 누른 것 하나만 붙인다. */
function stuVideoHTML(c){
  markSeen('video', c.videos.length);
  if(c.videos.length===0) return `<div class="sap-empty">등록된 강의가 없습니다.</div>`;
  const pg = id => c.rec.videoProgress[id] || null;
  const resume = c.videos.find(v=>{ const p = pg(v.id); return p && !p.completed; });
  const open = c.videos.find(v=>v.id===state.stuVideoId);

  const embed = v => {
    const vid = extractYouTubeId(v.url);
    if(!vid) return `<div class="note" style="margin-top:11px;">유튜브 링크 형식을 인식하지 못했습니다.
      선생님께 알려 주세요.</div>`;
    const src = 'https://www.youtube-nocookie.com/embed/' + vid +
      '?enablejsapi=1&modestbranding=1&rel=0&iv_load_policy=3&origin=' + encodeURIComponent(location.origin);
    return `<div class="sap-vwrap"><iframe id="yt-frame-${v.id}" class="yt-tracked-frame"
      data-bank-vid="${v.id}" src="${src}" title="${escHtml(v.title)}"
      sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
      <div id="vprog-${v.id}">${videoProgressBlockHTML(c.sid, v.id)}</div>`;
  };

  return `
  ${resume && (!open || open.id!==resume.id) ? `
  <div class="mc go" onclick="state.stuVideoId='${resume.id}'; render()" style="cursor:pointer;">
    <div style="font-size:11.5px;font-weight:700;color:var(--accent);">이어보기</div>
    <div style="font-size:14.5px;font-weight:700;margin-top:7px;">${escHtml(resume.title)}</div>
    <div class="sap-prog">
      <span class="bar"><i style="width:${pg(resume.id).percent}%"></i></span>
      <b>${pg(resume.id).percent}%</b>
    </div>
    <button class="mbtn p" style="margin-top:12px;">${iconSvg('play',17)} 이어서 보기</button>
  </div>` : ''}

  <div class="msec">전체 강의 <span class="mono">${c.videos.length}</span></div>
  ${c.videos.map(v=>{
    const p = pg(v.id);
    const pct = p ? p.percent : 0;
    const isOpen = open && open.id===v.id;
    return `<div class="mc ${isOpen?'go':''}">
      <div onclick="state.stuVideoId=${isOpen?'null':`'${v.id}'`}; render()" style="cursor:pointer;">
        <div class="row" style="gap:8px;">
          <span style="flex:1;min-width:0;font-size:13.5px;font-weight:600;">${escHtml(v.title)}</span>
          ${v.studentId ? '<span class="badge late">개인 배정</span>' : ''}
        </div>
        ${v.unit ? `<div style="font-size:11.5px;color:var(--dim);margin-top:5px;">${escHtml(v.unit)}</div>` : ''}
        ${/* 열려 있으면 진도 표시는 영상 아래 것 하나만 둔다 — 그쪽이 재생 중에 살아 움직인다 */
          isOpen ? '' : `<div class="sap-prog">
          <span class="bar"><i style="width:${pct}%"></i></span>
          <b style="color:${p && p.completed ? 'var(--ok)' : 'var(--dim)'};">${p && p.completed ? '완료' : pct+'%'}</b>
        </div>`}
      </div>
      ${isOpen ? embed(v) : ''}
    </div>`;
  }).join('')}`;
}

/* ---------- 성적 ---------- */
/* 그래프를 크게 쓴다. 폰에서 표는 읽히지 않고, 학생이 알고 싶은 건 «오르고 있나»다.
   **시험마다 만점이 달라 점수를 그대로 이으면 선이 거짓말을 한다** — 100점 환산해서 잇는다
   (명단의 성적 추이 열과 같은 규칙이다).

   **시안의 「반 평균」은 넣지 않았다.** 그 값을 내려면 같은 반 학생 전원의 기록을
   이 학생 브라우저로 내려받아야 한다. 학생 화면이 남의 성적을 싣는 것은
   화면에 안 보여도 이미 유출이다. */
/* 점이 상자 가장자리에 걸리면 반이 잘린다 — 안쪽으로 pad만큼 들여서 그린다.
   (overflow:visible로 밀어내면 «부모 침범»으로 잡힌다.) */
function stuScoreLineSVG(vals, w, h){
  const pad = 5;
  const mn = Math.max(0, Math.min.apply(null, vals) - 6);
  const mx = Math.min(100, Math.max.apply(null, vals) + 6);
  const r = (mx - mn) || 1;
  let d = '', dots = '';
  vals.forEach((v,i)=>{
    const x = vals.length>1 ? (pad + (w-pad*2) * i / (vals.length-1)) : w/2;
    const y = (h-pad) - ((v - mn) / r) * (h-pad*2);
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--accent)"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function stuScoresHTML(c){
  const scores = (c.rec.scores||[]).filter(s=>s.total);
  if(scores.length===0) return `<div class="sap-empty">아직 등록된 성적이 없습니다.</div>`;
  const pts = scores.map(s=>Math.round(s.score/s.total*100));
  const last = pts[pts.length-1], first = pts[0];
  const delta = last - first;

  return `
  <div class="mc">
    <div class="mrow" style="min-height:0;gap:9px;">
      <span style="flex:1;font-size:12.5px;color:var(--sub);">최근 ${pts.length}회 · 100점 환산</span>
      <b class="mono" style="font-size:22px;">${last}</b>
      ${pts.length>1 ? `<span class="mono ${delta<0?'down':'up'}" style="font-size:12px;">
        ${delta<0?'▼':'▲'}${Math.abs(delta)}</span>` : ''}
    </div>
    ${pts.length>1 ? `<div style="margin-top:16px;">${stuScoreLineSVG(pts, 320, 96)}</div>
    <div class="row" style="justify-content:space-between;margin-top:9px;">
      <span class="mono" style="font-size:10px;color:var(--dim);">${escHtml(scores[0].date||'')}</span>
      <span class="mono" style="font-size:10px;color:var(--dim);">${escHtml(scores[scores.length-1].date||'')}</span>
    </div>` : `<div style="font-size:12px;color:var(--dim);margin-top:10px;">
      기록이 하나뿐이라 아직 추이를 그릴 수 없습니다.</div>`}
  </div>

  <div class="msec">시험</div>
  ${scores.slice().reverse().map(s=>{
    const pct = Math.round(s.score/s.total*100);
    return `<div class="mc">
      <div class="mrow" style="min-height:34px;">
        <span style="flex:1;min-width:0;">
          <b style="display:block;font-size:13.5px;font-weight:600;">${escHtml(s.name)}</b>
          <span class="mono" style="display:block;font-size:11px;color:var(--dim);margin-top:3px;">${escHtml(s.date||'')}</span>
        </span>
        <b class="mono" style="font-size:15px;">${s.score}<s style="text-decoration:none;color:var(--dim);font-size:11px;">/${s.total}</s></b>
        <span class="mono" style="font-size:12px;color:var(--sub);width:38px;text-align:right;">${pct}%</span>
      </div>
    </div>`;
  }).join('')}`;
}

/* ---------- 출석 ---------- */
/* 달력이 맞다 — 출결은 «언제»가 핵심이라 목록으로는 결석이 몰린 시기가 안 보인다.
   5상태 색은 관리자와 같은 것을 쓴다.
   시안은 결석에 «사유»를 달았는데 도메인에 사유 필드가 없다. 지어내지 않았다. */
function stuShiftMonth(ym, delta){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0');
}
function stuAttendanceHTML(c){
  const att = (c.rec.attendance||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(att.length===0) return `<div class="sap-empty">아직 출석 기록이 없습니다.</div>`;
  const ym = state.stuAttMonth || todayStr().slice(0,7);
  const [y, m] = ym.split('-').map(Number);
  const byDate = {};
  att.filter(a=>a.date.slice(0,7)===ym).forEach(a=>{ byDate[Number(a.date.slice(8,10))] = a.status; });

  /* 달력 격자 — 1일의 요일만큼 앞을 비운다. 월 길이는 다음 달 0일로 얻는다. */
  const firstDow = new Date(y, m-1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  let cells = WEEKDAY_LABEL.map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0; i<firstDow; i++) cells += '<div class="d off"></div>';
  const today = todayStr();
  for(let d=1; d<=days; d++){
    const ymd = `${ym}-${String(d).padStart(2,'0')}`;
    const st = byDate[d] ? attStatusClass(byDate[d]) : '';
    cells += `<div class="d ${st==='drop'?'':st}${ymd===today?' today':''}">${d}</div>`;
  }

  const cnt = {};
  Object.values(byDate).forEach(s=>{ cnt[s] = (cnt[s]||0) + 1; });
  const flagged = att.filter(a=>a.date.slice(0,7)===ym && a.status!=='출석').reverse();
  const rate = stuAttRate(c.rec);

  return `
  <div class="mc">
    <div class="mrow" style="min-height:0;">
      <button class="sap-navbtn" onclick="state.stuAttMonth='${stuShiftMonth(ym,-1)}'; render()">${iconSvg('chevL',17)}</button>
      <span class="spacer"></span>
      <b style="font-size:14.5px;">${y}년 ${m}월</b>
      <span class="spacer"></span>
      <button class="sap-navbtn" onclick="state.stuAttMonth='${stuShiftMonth(ym,1)}'; render()">${iconSvg('chevR',17)}</button>
    </div>
    <div class="cal" style="margin-top:12px;">${cells}</div>
  </div>

  <div class="msec">이번 달</div>
  <div class="kpis">
    ${/* 0을 상태색으로 칠하지 않는다 — 빨간 「결석 0」은 없는 일을 있는 것처럼 읽힌다 */
      [['출석','ok'],['지각','late'],['조퇴','leave'],['결석','no']].map(s=>
      `<div class="kpi"><div class="k">${s[0]}</div>
        <div class="v" style="color:${cnt[s[0]] ? `var(--${s[1]})` : 'var(--dim)'};">${cnt[s[0]]||0}</div></div>`).join('')}
  </div>
  <div style="font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.7;">
    전체 출석률 <b class="mono" style="color:var(--ink);">${rate===null?'—':rate+'%'}</b>
    — 퇴원 기록을 뺀 전체 중 결석이 아닌 비율입니다. 지각·조퇴는 «온 것»으로 셉니다.</div>

  ${flagged.length ? `
  <div class="msec">결석 · 지각 · 조퇴</div>
  ${flagged.map(a=>`<div class="mc">
    <div class="row" style="gap:8px;">
      <span class="badge ${attStatusClass(a.status)==='drop'?'gone':attStatusClass(a.status)}">${a.status}</span>
      <span style="font-size:12.5px;font-weight:600;">${stuDateLabel(a.date)}</span>
      <span class="spacer"></span>
      <span class="mono" style="font-size:10.5px;color:var(--dim);">${escHtml(a.date)}</span>
    </div>
  </div>`).join('')}` : ''}`;
}

/* ---------- 공지사항 ---------- */
/* 안 읽은 공지에 왼쪽 accent 바를 단다. 관리자 화면에서 «선택»을 뜻하던 그 표시와 같은 모양이다.
   읽음 판정은 «개수»다 (unseenCount) — 공지는 최신순으로 쌓이므로 앞의 n개가 새 것이다.
   개별 읽음 상태를 두려면 학생마다 필드를 더해야 하는데, 이 정도 데이터엔 과하다. */
function stuNoticeHTML(){
  const unread = unseenCount('notice', DATA.notices.length);
  markSeen('notice', DATA.notices.length);
  if(DATA.notices.length===0) return `<div class="sap-empty">등록된 공지가 없습니다.</div>`;
  return DATA.notices.map((n,i)=>`
    <div class="mc" style="${i<unread ? 'border-left:3px solid var(--accent);' : 'opacity:.78;'}">
      <div class="row" style="gap:7px;">
        ${i<unread ? '<span class="badge no">새 공지</span>' : ''}
        <span class="spacer"></span>
        <span class="mono" style="font-size:10.5px;color:var(--dim);">${escHtml(n.date||'')}</span>
      </div>
      <div style="font-size:13.5px;${i<unread?'font-weight:700;':''}margin-top:8px;line-height:1.55;">${escHtml(n.title)}</div>
      ${n.content ? `<div style="font-size:12.5px;color:var(--sub);line-height:1.75;margin-top:8px;
        white-space:pre-wrap;">${escHtml(n.content)}</div>` : ''}
    </div>`).join('');
}

/* ---------- 질의응답 ---------- */
/* 답변이 왔는지 안 왔는지가 목록에서 바로 보여야 한다. 학생이 여러 번 들어와 확인하는 화면이다.
   질문 폼은 접어 둔다 — 이 화면에 오는 이유는 «답이 왔나» 쪽이 더 잦다. */
function stuQnaHTML(c){
  return `
  ${state.stuQnaWriting ? `
  <div class="mc hi">
    <div class="sap-lab">질문 내용</div>
    <textarea id="qna-question" class="sap-in" rows="4"
      placeholder="문제 질문은 물론, 학습 상담 등 무엇이든 편하게 남겨주세요."></textarea>
    <div class="sap-lab" style="margin-top:13px;">사진 (선택)</div>
    ${qnaImageFieldHTML(state.qnaQuestionImage,
      'handleQnaQuestionImage(this.files)', 'removeQnaQuestionImage()', 'qna-q-stu')}
    <button class="mbtn p" style="margin-top:14px;" onclick="submitQuestion()">질문 보내기</button>
    <button class="mbtn q" style="margin-top:6px;" onclick="state.stuQnaWriting=false; render()">닫기</button>
  </div>`
  : `<button class="mbtn" onclick="state.stuQnaWriting=true; render()">${iconSvg('pencil',16)} 질문하기</button>`}

  <div class="msec">내 질문 <span class="mono">${c.qnas.length}</span></div>
  ${c.qnas.length===0
    ? `<div class="sap-empty">아직 등록한 질문이 없습니다.</div>`
    : c.qnas.map(q=>`<div class="mc">
        <div class="row" style="gap:7px;">
          <span class="badge ${q.answer?'ok':'late'}">${q.answer?'답변 완료':'답변 대기'}</span>
          <span class="spacer"></span>
          <span class="mono" style="font-size:10.5px;color:var(--dim);">${escHtml(q.date||'')}</span>
        </div>
        <div style="font-size:13.5px;line-height:1.7;margin-top:9px;white-space:pre-wrap;">${escHtml(q.question)}</div>
        ${imgSrcOf(q.image) ? `<img class="sap-img" src="${imgSrcOf(q.image)}">` : ''}
        ${q.answer
          ? `<div class="note" style="margin-top:12px;">
               <!-- ds.css의 .note .d는 mono다. 「답변」 같은 낱말을 넣으면 글자가 벌어진다. -->
               <div style="font-size:10.5px;color:var(--dim);margin-bottom:5px;">답변
                 <span class="mono">${escHtml(q.answeredAt||'')}</span></div>
               <div style="white-space:pre-wrap;color:var(--ink);">${escHtml(q.answer)}</div>
               ${imgSrcOf(q.answerImage) ? `<img class="sap-img" src="${imgSrcOf(q.answerImage)}">` : ''}
             </div>`
          : `<div style="font-size:11.5px;color:var(--dim);margin-top:11px;">아직 답변이 등록되지 않았습니다.</div>`}
      </div>`).join('')}`;
}

/* ---------- 클리닉 신청 ---------- */
/* 빈 시간을 먼저 보여주고 고르게 한다. 날짜를 적어 신청하고 기다리는 방식이면
   거절될 때마다 처음부터 다시 해야 한다.
   경로는 셋인데 학생이 쓰는 것은 둘이다 — ①열린 시간대에서 고르기 ②희망 시간 직접 제안.
   (③교사 직접 배정은 관리자 화면에 있다.) */
function stuClinicHTML(c){
  const slots = openClinicSlots();
  const mode = state.clinicApplyMode || (slots.length ? 'slot' : 'free');
  const picked = slots.find(s=>s.id===state.stuClinicSlotId);
  const mine = c.clinics;

  return `
  ${mine.length ? `
  <div class="msec">내 신청</div>
  ${mine.map(cl=>`<div class="mc ${cl.status==='대기'?'hi':''}">
    <div class="row" style="gap:8px;flex-wrap:wrap;">
      <span class="badge ${cl.status==='승인'?'ok':cl.status==='대기'?'late':cl.status==='완료'?'':'gone'}">${cl.status}</span>
      <span class="mono" style="font-size:11.5px;">${escHtml(cl.day||'')}</span>
      <span style="font-size:12.5px;font-weight:600;">${escHtml(cl.time||'')}</span>
      ${!cl.slotId ? '<span class="badge">직접 제안</span>' : ''}
    </div>
    <div style="font-size:12.5px;color:var(--sub);margin-top:9px;line-height:1.7;">${escHtml(cl.topic||'')}</div>
    ${cl.status==='대기' ? `<button class="mbtn q" style="margin-top:8px;"
      onclick="cancelClinicRequest('${cl.id}')">신청 취소</button>` : ''}
  </div>`).join('')}` : ''}

  <div class="msec">새로 신청</div>
  <div class="row" style="gap:7px;margin-bottom:12px;">
    <a class="pill ${mode==='slot'?'on':''}" onclick="state.clinicApplyMode='slot'; render()">
      열린 시간대${slots.length?` <b>${slots.length}</b>`:''}</a>
    <a class="pill ${mode==='free'?'on':''}" onclick="state.clinicApplyMode='free'; render()">희망 시간 제안</a>
  </div>

  ${mode==='slot' ? (slots.length===0
    ? `<div class="sap-empty">지금 열려 있는 시간대가 없습니다.<br>「희망 시간 제안」으로 신청해 보세요.</div>`
    : `${slots.map(s=>{
        const left = s.capacity - clinicSlotBookedCount(s.id);
        const on = state.stuClinicSlotId===s.id;
        return `<div class="mc ${on?'go':''}" onclick="state.stuClinicSlotId='${s.id}'; render()" style="cursor:pointer;">
          <div class="mrow" style="min-height:30px;gap:10px;">
            <span class="mono" style="font-size:12.5px;width:86px;flex-shrink:0;">${escHtml(s.date)}</span>
            <b style="font-size:14px;font-weight:700;flex:1;min-width:0;">${escHtml(s.time)}</b>
            <span class="badge ${left<=1?'no':''}">${left}자리</span>
          </div>
        </div>`;
      }).join('')}
      ${picked ? `
      <div class="mc" style="margin-top:12px;">
        <div class="sap-lab">${escHtml(picked.date)} ${escHtml(picked.time)} · 무엇을 묻고 싶나요?</div>
        <input id="clinic-topic" class="sap-in" placeholder="예: 미적분Ⅰ 도함수의 활용">
        <button class="mbtn p" style="margin-top:11px;" onclick="submitClinicRequest(false)">신청하기</button>
      </div>` : `<div style="font-size:11.5px;color:var(--dim);margin-top:11px;text-align:center;">
        시간대를 누르면 신청 칸이 열립니다.</div>`}`)
  : `<div class="mc">
      <div class="sap-row2">
        <div><div class="sap-lab">희망 날짜</div>
          <input id="clinic-free-date" class="sap-in" type="date" min="${todayStr()}" value="${todayStr()}"></div>
        <div><div class="sap-lab">희망 시간</div>
          <input id="clinic-free-time" class="sap-in" placeholder="예: 저녁 7시"></div>
      </div>
      <div class="sap-lab" style="margin-top:13px;">무엇을 묻고 싶나요?</div>
      <input id="clinic-topic" class="sap-in" placeholder="예: 미적분Ⅰ 도함수의 활용">
      <button class="mbtn p" style="margin-top:12px;" onclick="submitClinicRequest(true)">제안하기</button>
      <div style="font-size:11.5px;color:var(--dim);margin-top:11px;line-height:1.7;">
        직접 제안한 시간은 <b style="color:var(--ink);">선생님이 승인해야 확정</b>됩니다.
        열린 시간대에서 고르면 자리가 있는 한 바로 접수돼요.</div>
    </div>`}`;
}

/* ---------- 채팅 ---------- */
/* 관리자 채팅(12-chat)과 같은 말풍선이다. 학생 쪽에서는 선생님 말이 왼쪽, 내 말이 오른쪽에 온다.
   날짜가 바뀌는 자리에 구분선을 넣는다 — 「어제 한 말」과 「오늘 한 말」은 다른 무게를 갖는다. */
function stuChatHTML(c){
  const chat = DATA.chats[c.sid] || [];
  if(!DATA.chats[c.sid]) loadChat(c.sid).then(()=>render());
  let lastDay = '';
  const bubbles = chat.map(m=>{
    const day = (m.at||'').slice(0,10);
    const time = (m.at||'').slice(11,16);
    let sep = '';
    /* ds.css의 .chat-day span은 mono다 — 「오늘」 같은 낱말은 넣지 않고 날짜 그대로 둔다. */
    if(day && day!==lastDay){ lastDay = day; sep = `<div class="chat-day"><span>${escHtml(day)}</span></div>`; }
    return sep + `<div class="bub-row ${m.from==='student'?'me':''}">
      <div class="bub" style="max-width:70%;">${escHtml(m.text)}</div>
      <span class="tm">${escHtml(time)}</span>
    </div>`;
  }).join('');

  return `
  <div class="sap-chat">
    ${chat.length===0
      ? `<div class="sap-empty">아직 주고받은 말이 없습니다.<br>궁금한 것을 편하게 남겨 주세요.</div>`
      : bubbles}
  </div>
  <div class="row" style="gap:8px;">
    <input id="chat-input-student" class="sap-in" placeholder="메시지 입력"
      onkeydown="if(event.key==='Enter') sendChatMessage('${c.sid}','student')">
    <button class="btn p" style="height:46px;flex-shrink:0;"
      onclick="sendChatMessage('${c.sid}','student')">전송</button>
  </div>`;
}

/* ---------- 셸 ---------- */
/* 알림 벨 — 학생·관리자가 같이 쓴다.
   items는 화면마다 다르지만(studentNotifItems / teacherNotifItems) 껍데기는 하나다.
   구버전 notificationBellHTML은 공용 헤더에 붙어 있었는데, 그 헤더가 사라지면서
   각 셸의 상단바로 들어왔다. */
function bellHTML(items){
  const total = items.reduce((n,it)=>n + unseenCount(it.key, it.count), 0);
  const unseen = items.filter(it=>unseenCount(it.key, it.count)>0);
  return `<div class="ds-bell">
    <button onclick="state.notifOpen=!state.notifOpen; render()">${iconSvg('bell',19)}
      ${total>0 ? `<span class="n">${total>9?'9+':total}</span>` : ''}</button>
    ${state.notifOpen ? `<div class="ds-drop">
      ${unseen.length===0 ? '<div class="em">새 알림이 없습니다</div>'
      : unseen.map(it=>`<div class="it" onclick="${it.gotoCode} markSeen('${it.key}', ${it.count});
          state.notifOpen=false; render()">
          <span>${it.label}</span><b>${unseenCount(it.key, it.count)}</b></div>`).join('')}
    </div>` : ''}
  </div>`;
}

function studentTabBodyHTML(c){
  const t = state.studentTab;
  if(t==='home')       return stuHomeHTML(c);
  if(t==='quiz')       return stuQuizHTML(c);
  if(t==='wronghw')    return stuWrongHTML(c);
  if(t==='progress')   return stuProgressHTML(c);
  if(t==='video')      return stuVideoHTML(c);
  if(t==='grades')     return stuScoresHTML(c);
  if(t==='attendance') return stuAttendanceHTML(c);
  if(t==='notice')     return stuNoticeHTML();
  if(t==='qna')        return stuQnaHTML(c);
  if(t==='clinic')     return stuClinicHTML(c);
  if(t==='chat')       return stuChatHTML(c);
  return stuHomeHTML(c);
}

function studentHTML(){
  /* 예전 세션이 없어진 탭 이름을 들고 있으면 홈으로 떨어뜨린다. */
  if(!STUDENT_TAB_SECTION[state.studentTab]) state.studentTab = 'home';
  const c = stuCtx();
  const section = STUDENT_TAB_SECTION[state.studentTab];
  const subs = STUDENT_SUBNAV[section];
  /* 서브내비의 숫자는 «아직 안 한 것»만 센다. 전체 개수는 화면 안에 이미 있다. */
  const counts = {
    quiz:    c.quizzes.filter(q=>!c.rec.quizAnswers[q.id]).length,
    wronghw: c.rec.wrongHomework.filter(h=>{
               const b = DATA.problemBank.find(x=>x.id===h.bankId);
               return b && b.status==='approved' && !h.done;
             }).length,
    progress: c.homework.filter(a=>!c.rec.assignmentsDone[a.id]).length,
    notice:  unseenCount('notice', DATA.notices.length),
    qna:     c.qnas.filter(q=>!q.answer).length
  };

  return `
  <div class="app sap">
    <div class="topbar">
      <div class="bm">김하현수학연구소</div>
      <div class="right">
        ${bellHTML(studentNotifItems(c.sid))}
        <button class="btn sm" onclick="logout()">로그아웃</button>
      </div>
    </div>
    ${subs ? `<div class="subnav">${subs.map(s=>
      `<a class="${state.studentTab===s[1]?'on':''}" onclick="goStudentTab('${s[1]}')">${s[0]}${
        counts[s[1]] ? `<b>${counts[s[1]]}</b>` : ''}</a>`
    ).join('')}</div>` : ''}
    <div class="body">${studentTabBodyHTML(c)}</div>
    <div class="sap-tabs">
      ${STUDENT_NAV.map(n=>`<a class="${n[0]===section?'on':''}" onclick="goStudentTab('${n[1]}')">
        ${iconSvg(n[2],20)}<span>${n[0]}</span></a>`).join('')}
    </div>
  </div>`;
}

function attStatusClass(status){
  return {'출석':'ok', '지각':'late', '조퇴':'leave', '결석':'no', '퇴원':'drop'}[status] || 'no';
}
function attBadge(status){
  const cls = {'출석':'badge-ok', '지각':'badge-late', '조퇴':'badge-leave', '결석':'badge-no', '퇴원':'badge-drop'}[status] || 'badge-no';
  return `<span class="badge ${cls}">${status}</span>`;
}

/* ---------- 강사 대시보드 (사이드바) ---------- */
/* ---------- 조교 대시보드 (담당 반만 접근 가능) ---------- */
/* =================== 조교 (design-v1/18-assistant) ===================
   **따로 만든 화면이 아니라 관리자 화면을 «권한»으로 좁힌 것이다.**
   구버전이 여기 남아 있던 이유는 «DS 학생 상세가 기본정보·삭제까지 열어 두기 때문»이었는데,
   그건 화면의 문제가 아니라 권한의 문제다. 화면을 두 벌로 두면 앞으로 모든 변경을
   두 번 해야 하고 반드시 한쪽만 고쳐진다 (신호 규칙을 signalOf() 하나로 합친 것과 같은 이유).
   → 명단은 .rst-*, 학생 상세는 sdScreenHTML을 그대로 쓰고 «못 하는 것»만 뺀다.

   **상단바에 메뉴가 없다.** 갈 곳이 하나뿐인데 메뉴를 만들면 그게 거짓말이다.
   대신 「조교」 뱃지와 담당 반을 둔다 — 자기가 누구로 있는지가 늘 보여야 한다. */
function assistantHTML(){
  const cu = state.currentUser;
  loadAllRecordsIfNeeded();   // 명단의 수치가 전부 여기서 나온다
  const body = state.studentDetailId
    ? teacherStudentDetailHTML(state.studentDetailId)
    : assistantRosterHTML(cu);
  return `
  <div class="app as">
    <div class="topbar">
      <div class="bm">김하현수학연구소</div>
      <div class="as-who">
        <span class="as-tag">조교</span>
        <span class="as-cls">담당 <b>${escHtml(classNameOf(cu.classId))}</b></span>
      </div>
      <div class="right">
        <span>${escHtml(cu.name||'')} 조교</span>
        <button class="btn sm" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="body">${body}</div>
  </div>`;
}

/* 담당 반 명단 — 01-roster에서 «조교가 손댈 수 없는 열»을 뺐다.
   반·반 진도(반이 하나다) · 신호 등급(05가 전담) · 시청률(영상은 강사가 올린다).
   남은 열은 전부 조교가 «넣는» 것이다. 일괄 작업도 없다. */
function assistantRosterHTML(cu){
  const q = (state.rosterSearchQuery||'').trim().toLowerCase();
  const flag = state.asFlag || '';
  const full = DATA.students.filter(s=>s.classId===cu.classId);

  const rows = full.map(s=>({s, st: rosterStats(s)}))
    .filter(r=>!r.st.withdrawn)                 // 퇴원은 명단에서 뺀다. 섞이면 모든 숫자가 흐려진다
    .filter(r=>!q || (r.s.name||'').toLowerCase().includes(q)
                  || (r.s.studentId||'').toLowerCase().includes(q));

  const hwLeft   = rows.filter(r=>r.st.hwTotal && r.st.hwDone < r.st.hwTotal).length;
  const wrongLeft= rows.filter(r=>r.st.wrongLeft > 0).length;
  const shown = rows.filter(r=>
    flag==='hw'    ? (r.st.hwTotal && r.st.hwDone < r.st.hwTotal)
  : flag==='wrong' ? r.st.wrongLeft > 0
  : true);

  const pill = (id, label, n) => `<a class="pill ${flag===id?'on':''}"
    onclick="state.asFlag='${flag===id?'':id}'; render()">${label} <b>${n}</b></a>`;

  return `
  <div class="rst-screen">
    <div class="rst-head">
      <div class="rst-hrow">
        <h1 class="t-title">${escHtml(classNameOf(cu.classId))}<s>${
          escHtml((DATA.classes.find(c=>c.id===cu.classId)||{}).schedule||'일정 미등록')} · ${rows.length}명</s></h1>
      </div>
      <p class="as-lede">
        <b>성적 · 출결 · 과제 · 오답</b>을 넣을 수 있습니다.
        학생 등록·삭제, 반 이동, 개인정보 수정은 강사만 할 수 있습니다.
      </p>
      <div class="rst-fbar">
        <span class="field rst-selwrap">${iconSvg('search',15)}
          <input id="roster-search" value="${escHtml(state.rosterSearchQuery||'')}" placeholder="이름 · 아이디로 찾기"
            oninput="state.rosterSearchQuery=this.value; render(); const e=document.getElementById('roster-search'); e.focus(); e.setSelectionRange(e.value.length,e.value.length);"></span>
        ${pill('hw', '과제 미완', hwLeft)}
        ${pill('wrong', '오답 미제출', wrongLeft)}
        <span class="rst-cnt">담당 반 <b>${shown.length}</b>명</span>
      </div>
    </div>

    <div class="rst-wrap">
      ${full.length===0
        ? '<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">아직 담당 반에 배정된 학생이 없습니다.</div>'
        : shown.length===0
        ? '<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">해당하는 학생이 없습니다.</div>'
        : `<table class="grid as-narrow">
        <thead><tr>
          <th style="width:236px;">학생</th>
          <th style="width:64px;">학년</th>
          <th class="r" style="width:78px;">출석률</th>
          <th style="width:120px;">최근 8회</th>
          <th class="r" style="width:72px;">과제</th>
          <th class="r" style="width:72px;">오답</th>
          <th style="width:200px;">성적 추이</th>
          <!-- 폭을 비워 두면 남는 자리를 이 열이 흡수한다. 오른쪽 정렬이라 버튼은 끝에 붙고,
               비는 것은 «성적 추이와 버튼 사이»가 되어 여백으로 읽힌다.
               성적 추이에 흡수시키면 스파크라인 옆이 900px 텅 빈다. -->
          <th class="r"></th>
        </tr></thead>
        <tbody>
        ${shown.map(({s, st})=>`
          <tr>
            <td><div class="rst-sig" style="cursor:pointer;" onclick="sdOpen('${s.studentId}')">
              <span class="av">${escHtml((s.name||'?').slice(0,1))}</span>
              <span class="nm" style="min-width:0;overflow:hidden;text-overflow:ellipsis;">${escHtml(s.name)}
                <s>${escHtml(s.studentId)}</s></span></div></td>
            <td>${escHtml(s.grade||'—')}</td>
            <td class="r mono ${st.attPct!==null && st.attPct<85 ? 'warn':''}">${st.attPct===null?'—':st.attPct+'%'}</td>
            <td>${rosterDots(st.att8)}</td>
            <td class="r mono">${st.hwTotal ? st.hwDone+'/'+st.hwTotal : '—'}</td>
            <td class="r mono ${st.wrongLeft?'cau':''}">${st.wrongLeft||0}</td>
            <td>${rosterSpark(st.scores)}</td>
            <td class="r"><button class="btn sm" onclick="sdOpen('${s.studentId}')">기록 넣기</button></td>
          </tr>`).join('')}
        </tbody></table>`}
    </div>
  </div>`;
}

/* ---------- 관리자 셸 ----------
   좌측 사이드바 5그룹을 버리고 상단바 7메뉴 + 서브탭으로 바꿨다.
   메뉴는 여기 한 곳에서만 정의한다 — 화면마다 손으로 적으면 반드시 어긋난다. */
const TEACHER_NAV = [
  ['명단', 'roster'],
  ['신호', 'signals'],
  ['반',   'classhub'],
  ['수업', 'session'],
  ['오답', 'review'],
  ['소통', 'clinic'],
  ['설정', 'settings']
];

/* 서브탭 — [라벨, 탭, 반 관리 내부탭?]
   「학생 명단」은 반의 하위 목록이 아니라 01 명단으로 보낸다.
   반은 거기서 필터일 뿐이고, 같은 곳으로 가는 문을 두 개 만들지 않는다. */
const TEACHER_SUBNAV = {
  '반': [
    ['학생 명단',  'roster'],
    ['수업 기록',  'classhub', 'sessions'],
    ['진도',       'classhub', 'progress'],
    ['데일리퀴즈', 'classhub', 'quiz'],
    ['영상',       'classhub', 'video']
  ],
  /* 「제출 현황」은 시험지 화면의 우측 칸으로 흡수했다 (시안 07). 서브탭에서 뺐다. */
  '오답': [
    ['검토', 'review'], ['시험지', 'exams'], ['보충문제 창고', 'unitbank']
  ],
  '소통': [
    ['클리닉', 'clinic'], ['공지', 'notices'],
    ['질의응답', 'qna'], ['채팅', 'chat']
  ]
};

/* 탭이 어느 상위 메뉴에 속하는지. 명단은 「반」의 서브탭에도 나오지만 제 자리는 「명단」이다. */
const TEACHER_TAB_SECTION = {
  roster:'명단', signals:'신호', home:'신호',
  classhub:'반', session:'수업',
  review:'오답', exams:'오답', unitbank:'오답',
  clinic:'소통', notices:'소통', qna:'소통', chat:'소통',
  settings:'설정'
};


function goTeacherTab(tab, hubTab){
  state.teacherTab = tab;
  state.studentDetailId = null;
  if(hubTab) state.classHubTab = hubTab;
  else if(tab==='classhub') state.classHubId = null;
  render();
}

function teacherTabBodyHTML(){
  /* 「제출 현황」은 시험지 화면으로 흡수됐다. 예전 세션이 그 탭을 들고 있으면
     기본값(반 관리)으로 떨어지므로 흡수된 곳으로 보낸다. */
  if(state.teacherTab==='submissions') state.teacherTab = 'exams';
  const t = state.teacherTab;
  if(t==='roster')      return teacherRosterHTML();
  /* 'home'은 상단바에 없는데도 로그인 직후 기본값이라 «신호»로 모은다.
     TEACHER_TAB_SECTION도 home을 '신호'로 잡고 있어서 그게 원래 의도였다.
     (예전엔 여기 분기가 없어 반 목록으로 떨어졌다 — 메뉴는 신호가 켜진 채로.) */
  if(t==='signals' || t==='home') return teacherSignalsHTML();
  if(t==='session')     return teacherSessionHTML();
  if(t==='classhub')    return teacherClassHubHTML();
  if(t==='clinic')      return teacherClinicHTML();
  if(t==='notices')     return teacherNoticesHTML();
  if(t==='qna')         return teacherQnaHTML();
  if(t==='chat')        return teacherChatHTML();
  if(t==='exams')       return teacherExamsHTML();
  if(t==='review')      return teacherReviewHTML();
  if(t==='unitbank')    return teacherUnitBankHTML();
  if(t==='settings')    return teacherSettingsHTML();
  return teacherClassHubHTML();
}

function teacherHTML(){
  const section = TEACHER_TAB_SECTION[state.teacherTab] || '반';
  const subs = TEACHER_SUBNAV[section];
  const subActive = s => state.teacherTab===s[1] && (!s[2] || state.classHubTab===s[2]);
  const body = teacherTabBodyHTML();

  return `
  <div class="app">
    <div class="topbar">
      <div class="bm">김하현수학연구소</div>
      <nav>${TEACHER_NAV.map(n=>
        `<a class="${n[0]===section?'on':''}" onclick="goTeacherTab('${n[1]}')">${n[0]}</a>`
      ).join('')}</nav>
      <div class="right">
        ${bellHTML(teacherNotifItems())}
        <span class="mono">김하현T</span>
        <button class="btn sm" onclick="logout()">로그아웃</button>
      </div>
    </div>
    ${subs ? `<div class="subnav">${subs.map(s=>
      `<a class="${subActive(s)?'on':''}" onclick="goTeacherTab('${s[1]}'${s[2]?`,'${s[2]}'`:''})">${s[0]}</a>`
    ).join('')}</div>` : ''}
    <div class="body">${body}</div>
  </div>`;
}

/* =================== 명단 (design-v1/01-roster) ===================
   A1의 밀도를 A3의 언어로. 역할은 «전체를 훑고 · 걸러내고 · 한꺼번에 처리한다».

   목업과 다른 점 — 목업은 「고2 미적분Ⅰ」 반 하나를 이미 고른 상태를 그렸다.
   실서비스는 반이 여러 개고 미배정 학생도 있어서 «모집단(뷰)»을 먼저 고르게 했다.
   반을 고르면 「반」·「반 진도」 열은 사라진다 — 행마다 같은 값을 되풀이하지 않는다.

   목업에 있었으나 넣지 않은 것:
     열 선택(15/22) · 사용자 저장 뷰 · 과제 일괄 배포 · 학부모 문자 · 클리닉 배정
   전부 도메인 레이어에 없는 신규 기능이다. 눌러도 아무 일 없는 버튼은 두지 않는다.
   (과제는 반 단위로만 배포되게 돼 있어 «선택한 학생에게»가 데이터 구조상 성립하지 않는다.) */

/* 출석률 = 「퇴원」을 뺀 전체 기록 중 「결석」이 아닌 비율.
   지각·조퇴는 «온 것»으로 센다. 여기서 묻는 것은 «왔는가»이고,
   «얼마나 있었는가»는 학생 상세의 출석 기록이 답한다. */
function rosterStats(s){
  const sid = s.studentId;
  const rec = state.allRecords[sid] || {};

  const att = (rec.attendance || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const counted = att.filter(a=>a.status!=='퇴원');
  const attPct = counted.length
    ? Math.round(counted.filter(a=>a.status!=='결석').length / counted.length * 100) : null;

  // 시험마다 만점이 달라 점수를 그대로 이으면 선이 거짓말을 한다. 100점 환산해서 잇는다.
  const scores = (rec.scores || []).filter(sc=>sc.total).map(sc=>Math.round(sc.score/sc.total*100));
  const drop = scores.length>1 ? scores[0] - scores[scores.length-1] : 0;

  const hws = DATA.assignments.filter(a=>!a.classId || a.classId===s.classId);
  const hwDone = hws.filter(a=>rec.assignmentsDone && rec.assignmentsDone[a.id]).length;

  const wrongLeft = (rec.wrongHomework || []).filter(h=>!h.done).length;

  const vids = DATA.videos.filter(v=>v.studentId ? v.studentId===sid : (!v.classId || v.classId===s.classId));
  const vidPct = vids.length ? Math.round(vids.reduce((sum,v)=>{
    const p = rec.videoProgress && rec.videoProgress[v.id];
    if(!p) return sum;
    return sum + (p.completed ? 100 : Math.max(0, Math.min(100, Math.round(p.percent||0))));
  }, 0) / vids.length) : null;

  return {
    att8: att.slice(-8), attPct, scores, drop,
    hwDone, hwTotal: hws.length, wrongLeft, vidPct,
    withdrawn: isWithdrawnRecord(rec),
    prog: s.classId ? getClassProgress(s.classId) : null
  };
}

/* =================== 신호 규칙 (명단·신호 공용) ===================
   **명단(01)과 신호(05)는 반드시 이 함수 하나만 본다.** 규칙이 두 벌로 갈라지는 순간
   화면끼리 숫자가 어긋나고, 그러면 두 화면 다 못 믿게 된다.

   등급은 셋. 늘리지 않는다 — 사람이 한 번에 판단할 수 있는 층은 셋이 한계다.
     위험 r  «무거운 신호» 2개 이상                → 즉시 연락
     주의 y  무거운 신호 1개 또는 시청률 70% 미만  → 이번 주 안에 개입
     관찰 g  경미한 신호만                        → 추세만 지켜본다

   시안(05-signals)은 위험을 «출석률<80 그리고 시청률<50»으로 못박았는데,
   그러면 결석이 잦아도 영상만 잘 본 학생이 어디에도 안 걸린다.
   실데이터에 맞춰 «무거운 신호 2개 이상»으로 바꿨다.
   임계값은 잠정이다. 규칙 «편집» UI는 없다 — 고치려면 이 함수를 고친다. */

const SIGNAL_GRADE = {
  r: { label:'위험', badge:'no',   todo:'즉시 연락 권장',     cond:'무거운 신호 2개 이상' },
  y: { label:'주의', badge:'late', todo:'이번 주 안에 개입',  cond:'무거운 신호 1개 · 시청률 70% 미만' },
  g: { label:'관찰', badge:'',     todo:'추세만 지켜보는 중', cond:'경미한 신호 하나' }
};

function signalOf(st){
  if(st.withdrawn) return null;              // 퇴원은 트리아지 대상이 아니다
  const rules = [];
  const absent = st.att8.filter(a=>a.status==='결석').length;
  const push = (name, heavy, why) => rules.push({ name, heavy, why });

  if(absent >= 2)                          push('연속 결석',   true,  `최근 ${st.att8.length}회 중 결석 <b>${absent}</b>`);
  if(st.attPct !== null && st.attPct < 80) push('출석률 저조', true,  `출석률 <b>${st.attPct}%</b>`);
  if(st.drop >= 8)                         push('성적 급락',   true,  `성적 <b>${st.scores[0]}→${st.scores[st.scores.length-1]}</b>`);
  if(st.wrongLeft >= 3)                    push('오답 미제출', true,  `오답숙제 <b>${st.wrongLeft}건</b> 미제출`);
  else if(st.wrongLeft > 0)                push('오답 미제출', false, `오답숙제 <b>${st.wrongLeft}건</b> 미제출`);
  if(st.vidPct !== null && st.vidPct < 50)      push('시청률 저조', true,  `강의 시청 <b>${st.vidPct}%</b>`);
  else if(st.vidPct !== null && st.vidPct < 80) push('시청률 저조', false, `강의 시청 <b>${st.vidPct}%</b>`);
  if(st.hwTotal && st.hwDone < st.hwTotal) push('과제 누락',   false, `과제 <b>${st.hwDone}/${st.hwTotal}</b>`);

  if(rules.length === 0) return null;

  const heavy = rules.filter(r=>r.heavy).length;
  const grade = heavy >= 2 ? 'r'
              : (heavy === 1 || (st.vidPct !== null && st.vidPct < 70)) ? 'y' : 'g';

  /* 위험도 점수 — 등급을 «정하는» 값이 아니라 등급 «안에서 줄 세우는» 값이다.
     점수로 등급까지 정하면 임계값이 두 벌이 되고, 어느 쪽이 진짜인지 알 수 없게 된다. */
  let score = 0;
  if(st.attPct !== null) score += Math.max(0, 100 - st.attPct) * 0.8;
  score += absent * 6;
  score += Math.max(0, st.drop) * 2;
  score += st.wrongLeft * 4;
  if(st.vidPct !== null) score += Math.max(0, 80 - st.vidPct) * 0.5;
  if(st.hwTotal) score += (st.hwTotal - st.hwDone) * 3;

  return { grade, rules, score: Math.min(99, Math.round(score)) };
}

/* 명단의 신호 열 — 한 줄(40px)에 들어가야 하므로 규칙 «이름»만 잇는다.
   근거 숫자까지 보려면 신호 화면으로 간다. */
function rosterSignal(st){
  if(st.withdrawn) return ['gone', '퇴원', '출결 기록의 마지막 상태'];
  const sg = signalOf(st);
  if(!sg) return null;
  const g = SIGNAL_GRADE[sg.grade];
  return [g.badge, g.label, sg.rules.map(r=>r.name).join(' · ')];
}

/* ds.js의 spark()/dots()를 옮겨 왔다. ds.js는 예시 학생 22명이 들어 있어 실서비스에 로드하지 않는다. */
function rosterSpark(vals, w, h){
  if(vals.length<2) return '<span class="muted" style="font-size:11px;">—</span>';
  w = w || 56; h = h || 20;
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx-mn) || 1;
  let d = '';
  vals.forEach((v,i)=>{
    const x = (w * i / (vals.length-1)).toFixed(1);
    const y = (h - 2 - ((v-mn)/r) * (h-6)).toFixed(1);
    d += (i ? 'L' : 'M') + x + ' ' + y;
  });
  const down = vals[vals.length-1] < vals[0];
  const last = vals[vals.length-1], delta = Math.abs(last - vals[0]);
  return `<svg width="${w}" height="${h}" style="vertical-align:-6px;"><path d="${d}" fill="none" stroke="${down?'#B03A2E':'#3F7A4D'}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`
    + `<span class="mono" style="font-size:12px;margin-left:5px;">${last}</span>`
    + `<span class="mono ${down?'warn':'up'}" style="font-size:10.5px;margin-left:3px;">${down?'▼':'▲'}${delta}</span>`;
}
function rosterDots(att8){
  if(!att8.length) return '<span class="muted" style="font-size:11px;">—</span>';
  return '<span class="dots">' + att8.map(a=>
    `<i class="${attStatusClass(a.status)}" title="${a.date} ${a.status}"></i>`).join('') + '</span>';
}

/* 화면과 엑셀이 같은 명단을 봐야 한다. 필터·정렬을 두 군데 적으면 반드시 어긋난다. */
function rosterModel(){
  const stats = {};
  DATA.students.forEach(s=>{ stats[s.studentId] = rosterStats(s); });

  const view = state.rosterView || 'all';
  const classId = view.indexOf('class:')===0 ? view.slice(6) : null;

  // 퇴원 학생은 「퇴원」 뷰에서만 보인다. 재원 명단에 섞이면 모든 숫자가 흐려진다.
  const pool = DATA.students.filter(s=>{
    const st = stats[s.studentId];
    if(view==='gone') return st.withdrawn;
    if(st.withdrawn) return false;
    if(view==='unassigned') return !s.classId;
    if(classId) return s.classId===classId;
    return true;
  });

  const f = state.rosterFlags || {};
  const flagged = {
    att:   s => stats[s.studentId].attPct!==null && stats[s.studentId].attPct<90,
    wrong: s => stats[s.studentId].wrongLeft>0,
    hw:    s => stats[s.studentId].hwTotal>0 && stats[s.studentId].hwDone<stats[s.studentId].hwTotal
  };
  const q = (state.rosterQuery||'').trim().toLowerCase();
  let rows = pool.filter(s=>{
    for(const k in flagged){ if(f[k] && !flagged[k](s)) return false; }
    if(!q) return true;
    return (s.name||'').toLowerCase().includes(q)
      || (s.studentId||'').toLowerCase().includes(q)
      || (s.school||'').toLowerCase().includes(q)
      || classNameOf(s.classId).toLowerCase().includes(q);
  });

  const sort = state.rosterSort || 'name';
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'', 'ko');
  // 기록이 없는 학생을 «출석률 0%»로 두면 맨 위로 올라와 실제 위험을 가린다. 뒤로 보낸다.
  const cmp = {
    name:  byName,
    att:   (a,b)=>((stats[a.studentId].attPct ?? 999) - (stats[b.studentId].attPct ?? 999)) || byName(a,b),
    drop:  (a,b)=>(stats[b.studentId].drop - stats[a.studentId].drop) || byName(a,b),
    wrong: (a,b)=>(stats[b.studentId].wrongLeft - stats[a.studentId].wrongLeft) || byName(a,b)
  }[sort] || byName;
  rows = rows.slice().sort(cmp);

  return { stats, view, classId, pool, rows, flagged };
}

function rosterToggleFlag(k){

/* 명단·신호·수업에서 학생을 열 때 쓰던 «탭 이름»을 학생 상세의 새 모델로 옮긴다.
   탭이 사라지고 연대기 + 갈래가 됐으므로, 옛 탭 이름은 «어느 갈래로 열 것인가»가 된다. */
const ROSTER_OPEN_MAP = {
  info:['timeline','all'], attendance:['timeline','att'], grades:['timeline','score'],
  wronghw:['timeline','hw'], homework:['timeline','hw'], clinic:['timeline','qna'],
  chat:['chat','all']
};
function rosterOpen(sid, tab){
  const m = ROSTER_OPEN_MAP[tab||'info'] || ROSTER_OPEN_MAP.info;
  state.studentDetailId = sid;
  state.teacherSelectedStudent = sid;
  state.studentDetailTab = m[0];
  state.sdFilter = m[1];
  render();
}
/* Shift+클릭 범위 선택. 기준은 «지금 보이는 순서»다 — 필터나 정렬이 바뀌면 기준을 버린다. */
function rosterToggle(sid, idx, ev){
  const rows = rosterModel().rows;
  const cur = new Set(state.rosterSelected || []);
  if(ev && ev.shiftKey && state.rosterLastIndex!==null){
    const a = Math.min(state.rosterLastIndex, idx), b = Math.max(state.rosterLastIndex, idx);
    const add = !cur.has(sid);
    for(let i=a; i<=b; i++){
      if(!rows[i]) continue;
      if(add) cur.add(rows[i].studentId); else cur.delete(rows[i].studentId);
    }
  }else{
    if(cur.has(sid)) cur.delete(sid); else cur.add(sid);
  }
  state.rosterSelected = [...cur];
  state.rosterLastIndex = idx;
  render();
}
function rosterToggleAll(){
  const rows = rosterModel().rows;
  const cur = new Set(state.rosterSelected || []);
  const allOn = rows.length>0 && rows.every(s=>cur.has(s.studentId));
  rows.forEach(s=>{ if(allOn) cur.delete(s.studentId); else cur.add(s.studentId); });
  state.rosterSelected = [...cur];
  state.rosterLastIndex = null;
  render();
}

/* 반 이동 — 학생 레코드(성적·출석·오답숙제)는 건드리지 않고 classId만 바꾼다.
   updateStudentInfo와 같은 방식이며, 누가 언제 옮겼는지 감사 로그에 남긴다. */
async function rosterBulkMoveClass(){
  const ids = (state.rosterSelected || []).slice();
  if(ids.length===0) return;
  const box = document.getElementById('rst-move');
  const classId = box ? box.value : '';
  const label = classId ? classNameOf(classId) : '미배정';
  if(!confirm(`선택한 ${ids.length}명을 「${label}」(으)로 옮길까요?`)) return;
  let moved = 0;
  for(const sid of ids){
    const s = DATA.students.find(x=>x.studentId===sid);
    if(!s || s.classId===classId) continue;
    const before = s.classId ? classNameOf(s.classId) : '미배정';
    s.classId = classId;
    await dbSetDoc('students', sid, s);
    await logAudit('반 이동', sid, s.name, `${before} → ${label}`);
    moved++;
  }
  state.rosterSelected = [];
  state.rosterLastIndex = null;
  showToast(moved===0 ? '이미 모두 그 반에 있습니다.' : `${moved}명을 「${label}」(으)로 옮겼습니다.`);
}

/* 명단 엑셀 — «지금 보고 있는 명단»을 화면과 같은 열 구성으로 내보낸다.
   exportClassExcel(반 단위 성적·출결)과는 다른 일을 하므로 따로 둔다. */
async function exportRosterExcel(onlySelected){
  try{
    await ensureXLSXLoaded();
    await loadAllRecordsIfNeeded();
    const m = rosterModel();
    const picked = new Set(state.rosterSelected || []);
    const list = onlySelected ? m.rows.filter(s=>picked.has(s.studentId)) : m.rows;
    if(list.length===0){ showToast('내보낼 학생이 없습니다.'); return; }
    const header = ['아이디','이름','학교','학년','반','신호','근거','출석률(%)','과제 제출','오답 미제출','시청률(%)','최근 점수(%)','학부모 전화번호','학생 전화번호'];
    const body = list.map(s=>{
      const st = m.stats[s.studentId], sg = rosterSignal(st);
      return [
        s.studentId, s.name, s.school||'', s.grade||'',
        s.classId ? classNameOf(s.classId) : '미배정',
        sg ? sg[1] : '', sg ? sg[2] : '',
        st.attPct===null ? '' : st.attPct,
        st.hwTotal ? st.hwDone + '/' + st.hwTotal : '',
        st.wrongLeft,
        st.vidPct===null ? '' : st.vidPct,
        st.scores.length ? st.scores[st.scores.length-1] : '',
        s.parentPhone||'', s.phone||''
      ];
    });
    const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '학생명단');
    XLSX.writeFile(wb, `학생명단_${todayStr()}.xlsx`);
  }catch(e){
    console.error('명단 엑셀 내보내기 실패', e);
    showToast('엑셀 파일을 만들지 못했습니다.');
  }
}

/* =================== 신호 (design-v1/05-signals) ===================
   역할은 «놓치기 전에 먼저 보인다». 규칙은 signalOf() 한 곳에 있고 여기서는 읽기만 한다.

   시안이 A5의 3열 칸반 보드를 버린 이유를 그대로 따랐다 — 카드가 흩어지면
   «놓치지 않는» 화면이 오히려 산만해진다. 등급으로 묶은 한 줄기 세로 목록이라
   읽는 눈이 위에서 아래로 한 번만 움직인다.

   시안에 있었으나 넣지 않은 것: 신호 규칙 설정 UI · 클리닉 배정 · 메모.
   규칙 편집은 아직 signalOf()를 고치는 일이고, 클리닉은 «학생이 신청하고 강사가 승인»하는
   구조라 강사가 배정하는 문이 없다. 메모는 도메인에 아예 없다.
   대신 «해제»는 넣었다 — 지울 수 없는 트리아지 목록은 곧 아무도 안 보게 된다. */

/* 신호 해제 — 새 컬렉션을 만들지 않고 kv 문서 하나에 {학생id: 'YYYY-MM-DD까지'}로 둔다.
   컬렉션을 늘리면 loadAll·마이그레이션까지 건드려야 하는데 이 정도 데이터엔 과하다. */
async function loadSignalMutesIfNeeded(){
  if(state.signalMutesLoaded || state.signalMutesLoading) return;
  state.signalMutesLoading = true;
  const m = await dbGet('signal-mutes', {});
  state.signalMutes = (m && typeof m === 'object') ? m : {};
  state.signalMutesLoading = false;
  state.signalMutesLoaded = true;
  render();
}
function signalMutedUntil(sid){
  const until = (state.signalMutes || {})[sid];
  if(!until) return null;
  return until >= todayStr() ? until : null;   // 지난 것은 저절로 풀린다
}
async function muteSignal(sid, days){
  const until = ymdLocal(new Date(Date.now() + days * 86400000));
  state.signalMutes = Object.assign({}, state.signalMutes, { [sid]: until });
  await dbSet('signal-mutes', state.signalMutes);
  await logAudit('신호 해제', sid, studentNameOf(sid), `${until}까지`);
  showToast(`${studentNameOf(sid)} — ${until}까지 신호에서 감춥니다.`);
}
async function unmuteSignal(sid){
  const next = Object.assign({}, state.signalMutes);
  delete next[sid];
  state.signalMutes = next;
  await dbSet('signal-mutes', next);
  await logAudit('신호 해제 취소', sid, studentNameOf(sid), '');
  showToast(`${studentNameOf(sid)} — 신호를 다시 봅니다.`);
}

const SIGNAL_RULE_NAMES = ['연속 결석', '출석률 저조', '성적 급락', '오답 미제출', '시청률 저조', '과제 누락'];

function signalsModel(){
  const rows = [];
  let muted = 0, clear = 0;
  DATA.students.forEach(s=>{
    const st = rosterStats(s);
    if(st.withdrawn) return;
    const sg = signalOf(st);
    if(!sg){ clear++; return; }
    const until = signalMutedUntil(s.studentId);
    if(until){ muted++; rows.push({ s, st, sg, mutedUntil: until }); return; }
    rows.push({ s, st, sg, mutedUntil: null });
  });

  const classId = state.signalClassId || '';
  const rule = state.signalRule || '';
  const visible = rows.filter(r=>
    !r.mutedUntil &&
    (!classId || r.s.classId === classId) &&
    (!rule || r.sg.rules.some(x=>x.name === rule))
  ).sort((a, b)=> b.sg.score - a.sg.score || (a.s.name||'').localeCompare(b.s.name||'', 'ko'));

  return { rows, visible, muted, clear };
}

function teacherSignalsHTML(){
  if(state.studentDetailId) return teacherStudentDetailHTML(state.studentDetailId);
  loadAllRecordsIfNeeded();
  loadSignalMutesIfNeeded();

  const m = signalsModel();
  const enrolled = DATA.students.filter(s=>!rosterStats(s).withdrawn).length;
  const unmutedAll = m.rows.filter(r=>!r.mutedUntil);
  const byClass = state.signalClassId
    ? unmutedAll.filter(r=>r.s.classId === state.signalClassId) : unmutedAll;

  const head = `
  <div class="rst-head">
    <div class="rst-hrow">
      <h1 class="t-title">신호<s>규칙 기반 자동 트리아지 · 재원 ${enrolled}명 중 ${unmutedAll.length}명</s></h1>
      <div class="spacer"></div>
      <span class="field rst-selwrap" style="width:auto;">${iconSvg('users',13)}
        <select class="rst-sel" onchange="state.signalClassId=this.value; render()">
          <option value="">반: 전체</option>
          ${DATA.classes.map(c=>`<option value="${c.id}" ${state.signalClassId===c.id?'selected':''}>${escHtml(c.name)}</option>`).join('')}
        </select>
      </span>
      ${m.muted ? `<button class="btn sm" onclick="state.signalShowMuted=${!state.signalShowMuted}; render()">${
        state.signalShowMuted ? '해제한 학생 숨기기' : `해제한 학생 ${m.muted}명 보기`}</button>` : ''}

    <div class="rst-fbar">
      <a class="pill ${!state.signalRule?'on':''}" onclick="state.signalRule=''; render()">전체 <b>${byClass.length}</b></a>
      ${SIGNAL_RULE_NAMES.map(name=>{
        const n = byClass.filter(r=>r.sg.rules.some(x=>x.name===name)).length;
        if(n === 0) return '';
        return `<a class="pill ${state.signalRule===name?'on':''}" onclick="state.signalRule='${name}'; render()">${name} <b>${n}</b></a>`;

      ${/* 0명일 때는 아무 말도 하지 않는다 — 「양호 0명은 이 화면에 없습니다」는 뜻이 없다. */''}
      <span class="rst-cnt">${state.allRecordsLoading ? '기록 불러오는 중…'
        : m.clear ? `양호 <b>${m.clear}</b>명은 이 화면에 없습니다` : ''}</span>
    </div>
  </div>`;

  /* 등급별로 묶어 한 줄기로 내려 읽는다. */
  const groups = ['r', 'y', 'g'].map(k=>{
    const g = SIGNAL_GRADE[k];
    const list = m.visible.filter(r=>r.sg.grade === k);
    if(list.length === 0) return '';
    return `
    <div class="sig-ghead"><span class="rk ${k}"></span><b>${g.label}</b>
      <span class="sig-n mono">${list.length}</span>
      <span class="sig-do">· ${g.todo}</span>
      <span class="sig-cond">${g.cond}</span>
    </div>
    ${list.map(r=>signalRowHTML(r, k)).join('')}`;
  }).join('');

  const mutedList = state.signalShowMuted && m.muted ? `
    <div class="sig-ghead"><span class="rk g"></span><b>해제됨</b>

        DATA.students.length === 0 ? '등록된 학생이 없습니다.'

  return `<div class="rst-screen">${head}
    <div class="sig-list">${groups}${mutedList}${empty}</div>
  </div>`;

  const s = r.s, st = r.st, sg = r.sg;
  const badge = SIGNAL_GRADE[k].badge;
  const scoreClass = k === 'r' ? 'warn' : (k === 'y' ? 'cau' : 'muted');
  return `
  <div class="sig-row ${k === 'r' ? 'now' : ''} ${isMuted ? 'off' : ''}">
    <div class="sig-who" onclick="rosterOpen('${s.studentId}','info')">
      <div class="av">${escHtml((s.name || '?').slice(0, 1))}</div>
      <div class="sig-t"><b>${escHtml(s.name)}</b>
        <span>${escHtml(s.school || '—')} ${escHtml(s.grade || '')} · ${escHtml(classNameOf(s.classId))}</span></div>
    </div>
    <div class="sig-mid" onclick="rosterOpen('${s.studentId}','info')">
      <div class="sig-rules">${sg.rules.map(x=>
        `<span class="badge ${x.heavy ? badge : ''}">${x.name}</span>`).join('')}</div>
      <div class="sig-why">${sg.rules.map(x=>x.why).join(' · ')}${
        isMuted ? ` <span class="muted">— ${r.mutedUntil}까지 해제됨</span>` : ''}</div>
    </div>
    <div class="sig-num">
      <div class="sig-sc mono ${scoreClass}">${sg.score}</div>
      ${rosterDots(st.att8)}
