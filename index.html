.hw-shots img{width:74px;height:74px;object-fit:cover;flex-shrink:0;cursor:pointer;
  border-radius:var(--r-sm);border:1px solid var(--line);display:block;}
.hw-shot{position:relative;flex-shrink:0;line-height:0;}
.hw-x{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;
  border:0;background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0;}
.hw-upping{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.62);color:#fff;
  font-size:9.5px;font-weight:400;padding:2px 5px;border-radius:3px;line-height:1.3;}
.hw-up{margin-top:11px;padding-top:11px;border-top:1px solid var(--line2);}
.hw-hint{font-size:11px;color:var(--dim);margin-top:7px;line-height:1.6;}
/* 반려는 «왜»가 본문이다. 사유가 눈에 안 들어오면 학생은 같은 것을 또 낸다. */
.hw-back{margin-top:9px;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--nobg);border:1px solid var(--no);}
.hw-back b{display:block;font-size:11.5px;color:var(--no);margin-bottom:4px;}
.hw-back span{display:block;font-size:12.5px;line-height:1.7;white-space:pre-wrap;}
.hw-back i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:5px;}
.hw-ok,.hw-wait{margin-top:8px;font-size:11.5px;line-height:1.6;}
.hw-ok{color:var(--ok);} .hw-wait{color:var(--sub);}
.hw-ok i{font-style:normal;color:var(--dim);}
/* 「보완 필요」 (2026-09-01 · C-15) — 완료 편이지만 초록으로 두면 «잘했다»로 읽힌다.
   ⚠ 붉게도 두지 않는다. 붉은 것은 «다시 해야 하는 것»(반려)뿐이어야 한다. */
.hw-ok.half{color:var(--leave);}
.hw-ok.half b{font-weight:700;}
.badge.half{background:var(--leavebg);color:var(--leave);}
/* 강사·조교의 «과제 확인» 한 줄. 학생 상세와 반 관리가 같이 쓴다. */
.hw-row{padding:11px 0;border-top:1px solid var(--line2);}
.hw-row:first-of-type{border-top:0;}
.hw-rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
/* ⚠ **이 이름에 `.hw-title`을 같이 붙이고 있었다** (2026-08-25에 고침).
   `.hw-title{flex:1}`이 스타일시트에서 뒤에 나와 같은 특정도로 이겼다 —
   `flex:0 0 auto`가 죽고 **이름이 늘어나 배지가 오른쪽 끝까지 밀렸다.**
   이름과 상태가 화면 양 끝으로 갈라져 짝이 안 읽혔다. 클래스를 하나로 떼어 놨다.
   ⚠ 두 클래스를 다시 겹치지 말 것 — 겹치면 조용히 같은 증상으로 돌아간다. */
.hw-who{font-size:13.5px;font-weight:600;color:var(--ink);min-width:62px;flex:0 0 auto;}
.hw-title{flex:1;min-width:120px;font-size:12.5px;color:var(--ink);text-align:left;}
.hw-when{font-size:11px;color:var(--dim);}
.hw-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
/* 상태별로 묶인 명단에서는 버튼이 이름과 같은 줄 오른쪽에 붙는다 (`tight`). */
.hw-acts.inline{margin:0 0 0 auto;flex-shrink:0;}
.hw-note{font-size:11.5px;color:var(--dim);margin-top:7px;}
.hw-rej{margin-top:9px;}
/* ---------- 과제 확인 명단 — «할 일» 순서로 접는다 (2026-08-25 · H-3) ----------
   강사가 이 화면에서 실제로 하는 일은 «확인 대기를 수락/반려»하는 것 하나다.
   그런데 전에는 명단이 등록 순서로 늘어서 대기 2명을 눈으로 찾아야 했다.
   셋으로 갈라 위계를 준다 — 대기는 펴고, 안 낸 사람은 눕히고, 완료는 접는다. */
.hw-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12.5px;color:var(--sub);padding:1px 0 11px;}
.hw-sum .bar{width:118px;flex-shrink:0;}
.hw-sum b{color:var(--ink);font-weight:600;}
.hw-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:6px;}
.hw-dot.late{background:var(--late);}
.hw-grp{margin-top:13px;}
.hw-grp-h{display:flex;align-items:center;gap:8px;padding-bottom:5px;
  border-bottom:1px solid var(--line2);}
.hw-grp-h b{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--dim);}
.hw-grp-h.late b{color:var(--late);}
.hw-grp-h.no b{color:var(--no);}
.hw-grp-h span{margin-left:auto;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--dim);}
/* 아직 안 낸 사람에게는 «볼 것»이 없다 — 사진도 낸 날짜도 없다. 이름과 버튼뿐이라 눕힌다. */
.hw-mini{display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--line2);font-size:13.5px;}
.hw-mini:last-child{border-bottom:0;}
.hw-mini > b{font-weight:600;color:var(--ink);flex-shrink:0;}
.hw-mini-r{font-size:11.5px;color:var(--dim);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hw-mini .act{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
/* 완료는 볼 일이 없다. 이름만 스치듯 남기고 접어 둔다. */
.hw-fold{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  border:0;background:none;padding:9px 0;cursor:pointer;font:inherit;color:var(--dim);
  border-top:1px solid var(--line2);}
.hw-fold:hover b, .hw-fold:focus-visible b{text-decoration:underline;}
.hw-fold b{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ok);}
.hw-fold .n{font-family:'JetBrains Mono',monospace;font-size:11px;flex-shrink:0;}
.hw-caret{font-size:11px;line-height:1;color:var(--ok);flex-shrink:0;}
/* 접힌 채로도 «누가 냈는지»는 스쳐 읽힌다. 넘치면 잘라 둔다 — 세면 숫자가 옆에 있다. */
.hw-fold .who{flex:1;min-width:0;font-size:11.5px;margin-left:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- 과제 격자 — 행=학생 · 열=과제 (2026-08-25 · H-5) ----------
   **축이 바뀐다.** 여태 이 화면은 「과제 하나를 펴면 그 안에 학생」이라
   **한 번에 한 과제만** 보였다. 사용자가 「한눈에 보고 싶다」며 격자 화면을 가리켰다.
   격자는 «반 전체 × 과제 전체»를 한 판에 올린다 — 명단은 그 다음이다.
   ⚠ 표 골격은 새로 짜지 않는다. `table.grid`(ds.css)를 그대로 쓴다. */
/* ⚠ **표보다 넓어지지 않게 한다** (2026-08-31 · 사용자가 짚었다) — 예전에는 상자가
   화면 끝까지 늘어나 「출석률」 오른쪽에 285px짜리 빈 칸이 생겼다.
   `max-content`로 표를 감싸되 화면을 넘지는 않게 `max-width:100%`를 함께 건다. */
.hwg-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);width:max-content;max-width:100%;}
.hwg{table-layout:fixed;min-width:max-content;}
/* 이름 열은 왼쪽에 못 박는다 — 열을 오른쪽으로 밀다 보면 «누구 줄인지»를 잃는다. */
.hwg th.who, .hwg td.who{position:sticky;left:0;z-index:1;width:158px;
  background:var(--card);border-right:1px solid var(--line);}
.hwg thead th.who{z-index:3;}
.hwg tbody tr:hover td.who{background:var(--hover);}
.hwg thead th{vertical-align:bottom;padding:8px 10px;height:auto;line-height:1.45;}
/* 열 머리 = 과제 하나. 누르면 그 과제의 «미제출 알림»이 오른쪽에서 열린다 (D-1). */
.hwg-col{width:112px;cursor:pointer;user-select:none;}
.hwg-col.on{background:var(--accent-bg);}
.hwg-col b{display:block;font-size:12px;font-weight:600;color:var(--ink);
  white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
/* 과제 열 (2026-09-01 · C-16) — 머리가 «날짜 + 마감»이라 이름 길이와 무관하게 폭이 정해진다.
   🔴 **`max-width`는 그대로 둔다.** `.hwg`는 `table-layout:fixed`인데 `min-width:max-content`를
     같이 지고 있어서, **긴 글이 들어오면 «표 전체»가 그만큼 늘어난다**(열 width는 무시된다).
     지금은 날짜뿐이라 안 늘지만, `createdAt`이 없는 옛 과제는 **이름으로 되돌아간다** —
     그 한 갈래 때문에 이 줄이 여전히 필요하다. 실제로 긴 제목 하나가 열을 200px로 벌렸었다.
   ⚠ 84px는 「마감 08-14」가 안 접히는 최소 폭이다. C-15까지는 이름 때문에 96px였다. */
.app .hg .hwg-col{width:84px;}
.app .hg .hwg-col b{display:block;max-width:64px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset;
  font-family:'JetBrains Mono',monospace;}
/* 요일은 출결 격자와 같은 어법이다 — 날짜 옆에 작게 (C-10).
   ⚠ 요일에 mono를 걸지 말 것. 한글 글리프가 없어 두부가 된다 — 숫자만 감쌌다. */
.app .hg .hwg-col b i{font-style:normal;font-weight:400;font-size:10.5px;
  font-family:inherit;color:var(--dim);margin-left:3px;}
.app .hg .hwg-col.empty b i{color:var(--dim);}
.app .hg .hwg-col .due{max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 아무도 아직 안 낸 과제 — 흐리게. 출결의 «아직 아무도 안 넣은 날»과 같은 어법이다. */
.app .hg .hwg-col.empty b,.app .hg .hwg-col.empty .due{color:var(--dim);font-weight:400;}
/* ⚠ **이 두 줄에 mono를 걸지 말 것** — 「마감」·「완료」·「대기」가 들어간다.
   `.mono`(JetBrains Mono)는 한글 글리프가 없어 두부 상자가 된다.
   숫자만 안쪽 <span class="mono">으로 감싼다. */
.hwg-col .due{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;
  font-weight:400;}
.hwg-col .n{display:block;font-size:10.5px;margin-top:4px;color:var(--sub);
  font-weight:400;}
.hwg-col .n.wait{color:var(--late);font-weight:700;}
.hwg td{padding:0 6px;text-align:center;}
/* ⚠ 한 줄로 못 박는다 — 두 자리 번호(10~13)에서 «1 / 0»으로 줄바꿈되어
   그 행만 키가 커지고 표의 리듬이 깨졌다. */
.hwg td.who{text-align:left;white-space:nowrap;}
.hwg .nm{font-size:12.5px;}
/* 「제출」 열 — 출결의 「출석률」·성적의 「평균」과 같은 자리다 (2026-09-01).
   ⚠ 예전에는 이 숫자가 «이름 칸 안에» float로 붙어 있었다. 표가 화면 끝까지 늘어나면서
     이름과 숫자 사이에 400px짜리 빈 벌판이 생겼다 — 사용자가 「옆으로 길게 늘어진다」고 한 것. */
.app .hg th.hg-done,.app .hg td.hg-done{width:62px;text-align:right;padding-right:12px;
  border-left:1px solid var(--line);background:var(--sunk);}
.app .hg th.hg-done{vertical-align:bottom;}
/* 줄 사이는 출결과 같은 숨결로 — .grid의 40px 고정을 벗은 뒤 줄이 너무 붙었다. */
.app .hg td{padding:5px 4px;}
/* 한 칸 = 한 학생의 한 과제.
   🔴 **여기가 이 화면의 전부다 — 눈이 «확인 대기»에 먼저 가야 한다.**
   처음엔 완료를 초록 배경으로 칠했더니 **다 된 것이 화면을 지배하고 할 일이 묻혔다.**
   그래서 색을 «할 일 순»으로 다시 매겼다 —
   · **확인 대기** — 노란 바탕 + 테두리. 유일하게 «튀는» 칸이다
   · **반려** — 붉은 글자. 학생이 다시 낼 차례라 강사 손은 덜 급하다
   · **완료** — **바탕 없이 흐린 초록 글자.** 끝난 것은 조용해야 한다
   · **미제출** — 가장 흐리게. 셀 필요는 있지만 눈을 끌 이유는 없다
   ⚠ **완료를 다시 칠하지 말 것.** 칠하면 그 순간 격자가 «성적표»가 되고
     「지금 뭘 해야 하나」를 못 읽는 화면으로 돌아간다.

   🔵 **2026-09-01 — 글자를 «작은 표식»에 담는다** (사용자가 「출결표랑 같은 표로 정리」를 시켰다).
   예전에는 글자가 칸 폭을 통째로 먹는 버튼이라 열이 112px, 과제가 두어 건이면 476px까지 벌어졌다.
   🔴 **한 번 «완·대·반» 한 글자까지 줄였다가 되돌렸다 — 사용자가 「대 한글자가 뭘 말하는지
     모르겠다」고 했다.** 출결의 「출·지·조·결」은 관례가 있지만 과제에는 없다.
   **이제 열 폭을 정하는 것은 «칸»이 아니라 «제목»이다(96px).** 그러니 칸에 말을 다 적어도
   표는 한 픽셀도 안 넓어진다 — 「확인 대기」가 11px에서 67px이라 96px 안에 그대로 들어간다.
   ⚠ **색의 순서는 그대로다.** 표식으로 바뀌었다고 완료에 바탕을 칠하지 말 것.
   ⚠ 사진 장수는 «점»으로 알린다(출결의 사유·메모와 같은 어법). 수는 title에 있다. */
.app .hg-m{display:inline-flex;align-items:center;justify-content:center;position:relative;
  min-width:26px;height:24px;padding:0 7px;border:1px solid transparent;border-radius:var(--r-sm);
  font:inherit;font-size:11px;font-weight:700;line-height:1;white-space:nowrap;
  background:transparent;color:var(--dim);cursor:pointer;transition:background var(--t);}
.app .hg-m:hover{background:var(--hover);}
.app .hg-m.ok{color:var(--ok);opacity:.62;font-weight:600;}
.app .hg-m.wait{color:var(--late);background:var(--latebg);border-color:var(--late-line);}
.app .hg-m.no{color:var(--no);}
.app .hg-m.none{color:var(--dim);font-weight:400;}
/* 「보완 필요」 (2026-09-01 · C-15) — «한 것»이라 완료 편이지만 눈에는 남아야 한다.
   ⚠ 바탕은 안 깐다. 바탕을 까는 것은 «확인 대기» 하나뿐이라는 규칙은 그대로다. */
.app .hg-m.half{color:var(--leave);font-weight:700;}
/* 마감이 지난 미제출 — 붉은 글자. 반려와 같은 색이지만 적힌 말이 다르다(「미제출」/「반려」).
   ⚠ 여기에도 바탕을 깔면 «확인 대기»와 다툰다. 강사 손이 먼저 갈 곳은 여전히 확인 대기다. */
.app .hg-m.over{color:var(--no);font-weight:700;}
.app .hg-m.sel{box-shadow:inset 0 0 0 2px var(--accent);opacity:1;}
.app .hg-m .dotmark{position:absolute;right:2px;bottom:2px;width:4px;height:4px;
  border-radius:50%;background:currentColor;opacity:.65;}
/* 격자 위 한 줄 — 「지금 손이 가야 할 것이 몇 건인가」. */
.hwg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12.5px;color:var(--sub);margin:0 0 10px;}
.hwg-top b{color:var(--ink);font-weight:600;}
.hwg-empty{padding:30px 0;text-align:center;color:var(--dim);font-size:12.5px;}
/* 「문항 보기」 판 (2026-09-01 · C-15) — 520px 안에서 오답률 줄이 안 넘치게 접는다.
   폰용 규칙(`.app:not(.sap) .ex-q`)과 같은 어법이다: 단원과 막대가 남는 자리를 나눠 갖는다. */
.app .sgq .ex-q{flex-wrap:wrap;gap:5px 10px;}
.app .sgq .ex-q .unit{width:auto;flex:1 1 80px;min-width:0;}
.app .sgq .ex-q .track{min-width:52px;}
.app .sgq .ex-q .tw{width:auto;}
.app .sgq-kpi{display:flex;gap:18px;flex-wrap:wrap;padding:11px 13px;margin-top:8px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk);
  font-size:12px;color:var(--sub);}
.app .sgq-kpi b{font-size:14px;font-weight:700;color:var(--ink);margin-left:5px;}
.app .sgq-kpi b.down{color:var(--no);}
.app .sgq-kpi s{text-decoration:none;color:var(--dim);font-size:11px;margin-left:5px;}
/* 문항 한 덩이 — 원본만 세로로. 변형문제는 시험지 화면의 일이다. */
.app .sgq-q{padding:10px 0;border-top:1px solid var(--line2);}
.app .sgq-q .h{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.app .sgq-q .no{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--dim);}
.app .sgq-q .ch{font-size:11.5px;color:var(--sub);}
.app .sgq-q .tx{font-size:12.5px;color:var(--ink);line-height:1.8;white-space:pre-wrap;}
.app .sgq-q .ans{margin-top:5px;font-size:11.5px;color:var(--dim);}
.app .sgq-q .ans b{margin-left:6px;color:var(--ok);font-weight:700;}

/* 한 칸을 누르면 오른쪽에서 상세가 나온다 — 격자를 떠나지 않고 처리한다. */
.hwd-back{position:fixed;inset:0;z-index:58;background:rgba(20,18,17,.28);}
.hwd{position:fixed;top:0;right:0;bottom:0;z-index:59;width:min(400px,92vw);
  background:var(--card);border-left:1px solid var(--line);
  box-shadow:-8px 0 32px -12px rgba(20,18,17,.3);
  display:flex;flex-direction:column;}
.hwd-h{flex-shrink:0;padding:16px 18px 13px;border-bottom:1px solid var(--line);}
.hwd-h .t{font-size:14px;font-weight:700;line-height:1.45;}
.hwd-h .m{font-size:11.5px;color:var(--dim);margin-top:4px;}
/* ⚠ `<s>`는 이 프로젝트에서 «가운뎃점 구분자»로 쓴다. 기본 취소선을 지우지 않으면
   점에 줄이 그어져 「–·」처럼 보인다 (`.t-meta s`와 같은 처리). */
.hwd-h .m s{text-decoration:none;color:var(--dim);margin:0 6px;}
.hwd-h .x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;
  background:none;font-size:19px;line-height:1;color:var(--dim);cursor:pointer;
  border-radius:var(--r-sm);}
.hwd-h .x:hover{background:var(--hover);color:var(--ink);}
.hwd-b{flex:1;min-height:0;overflow:auto;padding:4px 18px 18px;}
.hwd-f{flex-shrink:0;padding:12px 18px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px;}
.hwd-f .nav{margin-left:auto;display:flex;gap:6px;}
/* 🔴 **오른쪽 상세를 셋이 같은 껍데기로 쓴다** (2026-08-27 · D-1) —
   ①과제 «칸»(`hwCellDrawerHTML`) ②과제 «열 머리» = 미제출 알림(`hwNoticeDrawerHTML`)
   ③설정 > 학생 «계정 수정»(`studentAccountDrawerHTML`).
   사용자의 말 — **「아래 뜨는게 아니라 … 옆에 새롭게 뜨는것처럼 그렇게 떴으면 좋겠어.
     오른쪽에 공간 많으니까」**. 아래로 펴면 격자와 목록이 밀려 내려가 «보던 자리»를 잃는다.
   ⚠ 폼과 문안이 들어가는 둘은 400px로 좁다 — `.wide`로 넓힌다. */
.hwd.wide{width:min(520px,94vw);}
/* 🔴 **드로어는 «`.app` 안»에서 그려져야 한다** (2026-08-27 · D-1에서 겪었다).
   이 프로젝트의 글자 크기·색·버튼은 **거의 다 `.app`으로 스코프돼 있다**
   (`.app .st-note{font-size:11.5px}` 같은 식). 그런데 화면 셸이 `<div class="app">`이고
   드로어는 그 «형제»로 붙으므로, 감싸지 않으면 그 규칙들이 하나도 안 닿는다.
   실제로 안내 문단이 11.5px가 아니라 상속된 **16px**로 나왔다.
   ⚠ 그래서 `class="app hwd-layer"`로 감싼다 — `.app`의 «배경과 100vh»만 벗겨야 한다.
     안 벗기면 이 층이 종이색으로 화면을 통째로 덮어 뒤가 안 보인다. */
.hwd-layer{background:none;min-height:0;}

/* =================== 월간 리포트 (2026-08-27 · R-1) ===================
   🔴 **`.rp-doc`이 «학부모가 볼 것» 전부다.** 2차에서 인쇄할 때 이 상자만 남기면 되도록,
     쓰는 칸(`.rp-edit`)과 달 고르개(`.rp-bar`)를 일부러 **밖에** 뒀다. */
.rp-wrap{display:flex;flex-direction:column;gap:14px;min-width:0;}
.rp-bar{display:flex;align-items:center;gap:9px;font-size:13px;}
.rp-bar b{font-size:14px;font-weight:700;min-width:96px;text-align:center;}
.rp-doc{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:20px 22px;max-width:620px;}
.rp-h{border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:4px;}
.rp-h .t{font-size:12px;color:var(--dim);letter-spacing:.02em;}
/* ⚠ `<s>`는 이 프로젝트에서 «가운뎃점 구분자»다 — 기본 취소선을 지운다 (8절). */
.rp-h .t s,.rp-h .m s{text-decoration:none;color:var(--dim);margin:0 6px;}
.rp-h .m{font-size:14px;margin-top:6px;color:var(--sub);}
.rp-h .m b{color:var(--ink);font-weight:700;font-size:15px;}
.rp-row{display:flex;align-items:baseline;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:13px;}
.rp-row:last-child{border-bottom:0;}
/* 라벨 폭을 고정한다 — 값이 줄마다 다른 자리에서 시작하면 세로로 훑을 수가 없다 (W-2와 같은 이유). */
.rp-row .k{flex-shrink:0;width:74px;color:var(--dim);font-size:12px;}
.rp-row .v{color:var(--ink);line-height:1.65;}
.rp-row .v b{font-weight:700;}
.rp-row .v s{text-decoration:none;color:var(--dim);font-size:11.5px;margin-left:8px;}
.rp-none{padding:24px 0;text-align:center;color:var(--dim);font-size:12.5px;}
.rp-say{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.rp-say-t{font-size:12px;color:var(--dim);margin-bottom:7px;}
.rp-say p{margin:0;font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--ink);}
/* ---------- 눈금 줄 · 표 · 글귀 (2026-08-27 · R-1b) ----------
   사용자가 요청했다 — **「%나 표 등을 이용하여 있어보이도록」**.
   🔴 **% 옆에 «몇 건 중 몇 건»을 반드시 함께 둔다** — 「50%」는 2건 중 1건일 때도
     20건 중 10건일 때도 같은 얼굴이라, 크기를 모르면 학부모가 잘못 읽는다. */
.rp-m{display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:12.5px;}
.rp-m:last-child{border-bottom:0;}
/* 라벨과 %는 폭을 고정한다 — 줄마다 다른 자리에서 시작하면 세로로 훑을 수가 없다 (W-2와 같은 이유). */
.rp-m .k{flex-shrink:0;width:66px;color:var(--dim);font-size:12px;}
.rp-m .bar{flex-shrink:0;width:96px;height:6px;border-radius:99px;background:var(--line);
  overflow:hidden;display:block;}
.rp-m .bar i{display:block;height:100%;border-radius:99px;background:var(--ink);}
.rp-m .p{flex-shrink:0;width:38px;text-align:right;font-weight:700;color:var(--ink);}
.rp-m .x{color:var(--sub);line-height:1.6;min-width:0;}
/* ⚠ `<s>`는 이 프로젝트에서 «곁들이는 말»이다 — 기본 취소선을 지운다 (8절). */
.rp-m .x s{text-decoration:none;color:var(--dim);font-size:11.5px;margin-left:6px;}

/* 부족한 줄에 색을 준다 (2026-08-27 · R-1c) — 사용자가 요청했다:
   **「부족한 것이나 미비한 것은 신호판과 비슷하게 붉은색이나 노란색을 이용해서 표시」**.
   🔴 **색은 «막대와 %»에만 준다.** 줄 전체를 물들이면 학부모 문서가 경고장처럼 보인다 —
     이것은 한 달을 돌아보는 자료지 통보문이 아니다.
   ⚠ 왼쪽 띠는 «어느 줄인지» 짚어 주는 정도로만 얇게 둔다. */
.rp-m{position:relative;padding-left:0;}
.rp-m.r .bar i{background:var(--no);}
.rp-m.y .bar i{background:var(--late);}
.rp-m.r .p{color:var(--no);}
.rp-m.y .p{color:var(--late);}
.rp-m.r .bar{background:var(--nobg);}
.rp-m.y .bar{background:var(--latebg);}
.rp-m.r .k,.rp-m.y .k{color:var(--sub);}

/* 특강 구역 (2026-09-01 · E-1b). 🔴 **정규 눈금과 «다른 옷»을 입힌다** — 같은 옷이면
   위아래가 한 덩어리로 읽혀 「출석 92%」가 어느 반 것인지 알 수 없어진다.
   ⚠ 그렇다고 상자를 세게 그리지 않는다. 이것은 곁들이는 이야기지 따로 온 통보문이 아니다. */
.rp-ex{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
.rp-ex-t{font-size:12px;color:var(--dim);margin-bottom:10px;}
.rp-ex-c{padding:11px 0;border-bottom:1px solid var(--line2);}
.rp-ex-c:last-child{border-bottom:0;padding-bottom:0;}
.rp-ex-h{font-size:13px;font-weight:700;color:var(--ink);}
.rp-ex-h s{text-decoration:none;color:var(--dim);font-weight:400;font-size:11.5px;margin-left:7px;}
.rp-ex-b{margin-top:6px;display:flex;flex-direction:column;gap:4px;}
.rp-ex-r{display:flex;gap:11px;align-items:baseline;font-size:12.5px;}
.rp-ex-r .k{flex-shrink:0;width:38px;color:var(--dim);font-size:11.5px;}
.rp-ex-r .x{color:var(--sub);line-height:1.6;min-width:0;}
.rp-ex-r .x .sm{font-size:11px;color:var(--dim);}

/* 범례 — 색의 뜻을 «학부모 말»로 적는다. 「위험」·「주의」는 쓰지 않는다. */
.rp-leg{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);}
.rp-leg span{display:inline-flex;align-items:center;gap:6px;}
.rp-leg i{width:9px;height:9px;border-radius:99px;display:inline-block;flex-shrink:0;}
.rp-leg i.r{background:var(--no);}
.rp-leg i.y{background:var(--late);}
.rp-sec{margin:18px 0 8px;font-size:12px;color:var(--dim);}
.rp-tb{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:18px;}
.rp-tb th{text-align:left;font-weight:400;font-size:11.5px;color:var(--dim);
  padding:0 10px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
.rp-tb td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);
  vertical-align:top;color:var(--sub);}
.rp-tb tr:last-child td{border-bottom:0;}
.rp-tb .nm{color:var(--ink);font-weight:600;}
.rp-tb .nm s{display:block;text-decoration:none;color:var(--dim);
  font-weight:400;font-size:11px;margin-top:3px;}
.rp-tb td s{text-decoration:none;color:var(--dim);font-size:11px;margin-left:5px;}
.rp-tb .sm{font-size:11px;color:var(--dim);}
.rp-tb .pc{margin-left:7px;color:var(--sub);}
.rp-tb .dash{color:var(--line);}

/* 가져다 쓸 글귀 — 🔴 **누르면 «입력칸에 들어갈 뿐»이다.** 저장은 선생님이 따로 누른다.
   그래서 버튼처럼 보이되 «확정»으로 읽히지 않게 옅게 둔다. */
.rp-ph{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
.rp-ph-list{display:flex;flex-direction:column;gap:6px;}
.rp-ph-b{text-align:left;font-family:inherit;font-size:12.5px;line-height:1.65;
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);color:var(--sub);cursor:pointer;}
.rp-ph-b:hover{border-color:var(--ink);color:var(--ink);background:var(--card);}
.rp-edit{max-width:620px;}
.rp-edit .sd-note{min-height:92px;}
/* 드로어 안에서는 알림 패널의 «상자»를 벗긴다 — 드로어가 이미 상자라 테두리가 이중이 된다. */
.hwd .hw-npanel{border:0;padding:0;margin:0;max-width:none;min-width:0;background:none;}
.hwd .hw-nmsg{max-width:none;}
.hwd .st-form{margin:0;}
.hwd .st-note{max-width:none;}
/* 미제출 알림 (2026-08-24 · N-1). 펼친 과제의 «맨 위»에 붙는다 —
   학생 줄을 다 내려간 뒤에 나오면 「누가 안 냈나」를 보고 나서 또 올라와야 한다. */
/* ⚠ 폭을 묶는다. 반 관리에서는 이 자리가 «본문 칸 전체»라 1200px까지 늘어나는데,
   이름 두 글자와 전화번호 하나가 화면 양 끝으로 갈라져 짝이 안 읽힌다. */

/* ⚠ 밑줄을 뺐다 (2026-08-25) — 바로 아래 묶음 머리가 자기 밑줄을 갖게 되면서
   가로줄 둘이 20px 사이로 겹쳐 보였다. 사이를 띄우는 것으로 갈음한다. */
.hw-nbar{display:flex;align-items:center;gap:9px;padding:9px 0 4px;max-width:560px;
  min-width:280px;}
.hw-nbar .sub{font-size:12.5px;color:var(--sub);}
.hw-nbar .sub b{color:var(--ink);}
.hw-npanel{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:13px 14px;margin:10px 0 4px;max-width:560px;min-width:280px;}
.hw-nlist{display:flex;flex-direction:column;gap:1px;}
.hw-nlist.off{opacity:.6;}
.hw-nrow{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--line2);font-size:12.5px;}
.hw-nrow:last-child{border-bottom:0;}
.hw-nrow b{font-weight:600;min-width:72px;}
.hw-nrow .mono{color:var(--sub);font-size:12px;}
.hw-nnone{font-size:12.5px;color:var(--sub);line-height:1.7;}
/* 문안은 «나갈 그대로»를 보여 준다 — 줄바꿈까지 살려야 심사에 넣을 문장이 된다. */
.hw-nmsg{white-space:pre-wrap;font-size:12.5px;line-height:1.75;color:var(--ink);
  background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 13px;}
.hw-nact{display:flex;align-items:center;gap:11px;margin-top:14px;flex-wrap:wrap;}
.hw-nact .muted{font-size:11.5px;line-height:1.6;flex:1;min-width:180px;}
/* 수업 화면에서 과제 한 줄을 펴면 그 아래로 학생들이 붙는다. */
.sess-hw{padding:2px 14px 10px;margin:-4px 0 10px;border:1px solid var(--line);
  border-top:0;border-radius:0 0 var(--r-sm) var(--r-sm);background:var(--sunk);}
.hw-rej textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:8px 10px;font-family:inherit;font-size:12.5px;
  line-height:1.7;resize:vertical;}
/* 사진 크게 보기 — 화면을 덮는다. 아무 데나 눌러 닫는다.
   ⚠ «아무 데나»는 처음 여는 사람에게 안 보인다. 그래서 ×를 따로 세운다 (ESC도 듣는다). */
/* ---------- 비밀번호 변경 (2026-08-25 · P-1) ----------
   **학생과 조교가 «같은 것»을 쓴다.** 두 벌로 두면 다음에 한쪽만 고쳐진다.
   ⚠ 학생 앱은 폰 우선이라 아래에서 위로 올라오는 모양이 자연스럽지만,
     조교는 데스크톱이다. 가운데에 두고 폰에서만 아래로 붙인다. */
.pwm-back{position:fixed;inset:0;z-index:61;background:rgba(20,18,17,.38);
  display:flex;align-items:center;justify-content:center;padding:20px;}
.pwm{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  width:min(380px,100%);max-height:100%;overflow:auto;
  box-shadow:0 18px 48px -18px rgba(20,18,17,.45);position:relative;}
.pwm-h{padding:17px 19px 13px;border-bottom:1px solid var(--line);}
/* ⚠ **직계 자식만 잡는다.** 그냥 `.pwm-h b`로 두면 아래 줄 안에 넣은 «아이디»의 `<b>`까지
   제목 크기(14.5px·block)가 되어 아이디만 한 줄로 튀어나온다. 실제로 한 번 그렇게 나왔다. */
.pwm-h > b{display:block;font-size:14.5px;font-weight:700;}
.pwm-h > span{display:block;font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.6;}
.pwm-h .x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;
  background:none;font-size:19px;line-height:1;color:var(--dim);cursor:pointer;
  border-radius:var(--r-sm);}
.pwm-h .x:hover{background:var(--hover);color:var(--ink);}
.pwm-b{padding:16px 19px 19px;display:flex;flex-direction:column;gap:12px;}
.pwm-b label{display:flex;flex-direction:column;gap:5px;}
.pwm-b label span{font-size:11.5px;color:var(--sub);font-weight:500;}
.pwm-b input{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--ink);width:100%;}
.pwm-b input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
/* 「•••• [보기]」 — 강사 화면에서만 쓴다 (P-3). 학생 기본정보와 조교 목록이 같이 쓴다.
   ⚠ 값 자리를 «가린 상태에서도» 같은 너비로 두면 눌러 보기 전에도 길이가 새어 나간다.
     그래서 점은 최대 12개까지만 찍는다. */
.pwr{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;max-width:100%;}
/* ⚠ 좁은 칸에서는 **밀고 나가지 말고 잘린다.** 설정 화면이 폰에서 본문 74px까지
   짜부라지던 시절(M-2d)에 이 줄이 칸 밖으로 나가 버렸다.
   **M-2d는 2026-08-26에 풀렸다**(본문 369px). 그래도 이 규칙은 그대로 둔다 —
   칸이 좁아지는 자리는 또 생기고, 잘리는 편이 밀고 나가는 것보다 언제나 낫다. */
.pwr .v{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);
  letter-spacing:.06em;min-width:0;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pwr button{flex-shrink:0;}
.pwr .v.on{color:var(--ink);background:var(--sunk);border:1px solid var(--line2);
  border-radius:var(--r-xs);padding:2px 7px;letter-spacing:0;}
.pwm-err{font-size:12px;color:var(--no);background:var(--nobg);border-radius:var(--r-sm);
  padding:9px 11px;line-height:1.6;}
.pwm-f{display:flex;gap:7px;margin-top:3px;}
.pwm-f .btn{flex:1;justify-content:center;}
@media (max-width:560px){
  .pwm-back{align-items:flex-end;padding:0;}
  .pwm{width:100%;border-radius:var(--r-md) var(--r-md) 0 0;border-bottom:0;max-height:92vh;}
}
.hw-view{position:fixed;inset:0;z-index:60;background:rgba(20,18,17,.86);
  display:flex;align-items:center;justify-content:center;padding:22px;cursor:zoom-out;}
.hw-view img{max-width:100%;max-height:100%;border-radius:var(--r-sm);display:block;}
.hw-view .hw-close{position:absolute;top:14px;right:14px;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid rgba(255,255,255,.28);border-radius:50%;
  background:rgba(20,18,17,.55);color:#fff;font-size:20px;line-height:1;padding:0;}
.hw-view .hw-close:hover{background:rgba(255,255,255,.16);}

.app .actbar{position:fixed;z-index:6;flex-wrap:wrap;}
/* 고정된 액션바가 마지막 행을 가리지 않게, 스크롤 영역 «안»에 여백을 둔다. */
.app .rst-pad{height:64px;flex-shrink:0;}

/* ============================================================
   학생 마이페이지 (design-v1/20-student-app) — 접두사 sap-
   목업은 390×812 «폰 액자»(.ph/.ph-body/.ph-tabs) 안에 그려져 있다.
   실서비스는 진짜 폰이므로 액자를 벗기고 그 자리에 뷰포트를 넣는다.
   데스크톱에서 열면 한 칸짜리 열이 가운데로 모인다 — 시안이 못박아 둔 대로다.
   ds.css의 모바일 부품(.mc/.mrow/.msec/.mbtn/.todo/.cal/.bar/.bub-row)은
   여기서 다시 정의하지 않는다. 이 블록에 있는 것은 «셸»뿐이다.
   ============================================================ */
/* ⚠ **열 폭은 `--sap-w` 한 곳에서만 정한다.** 셸(.app.sap)과 하단 탭바(.sap-tabs)가
   같은 폭이어야 하는데, 두 곳에 숫자를 따로 적어 두면 한쪽만 고치는 날 탭바가 본문과
   어긋난다. 탭바는 position:fixed라 흐름에서 빠지지만 **.app.sap의 자손**이므로
   커스텀 속성이 그대로 상속된다.

   태블릿으로 보는 학생이 있어 폭을 단계로 푼다 (2026-08-12). 기기는 섞여 있어
   «아이패드 몇 인치»가 아니라 **폭 구간**으로 가른다 —
     폰 480 · 태블릿 세로(≥760) 620 · 가로(≥1100) 680.
   ⚠ **전용 레이아웃(좌측 레일 + 본문)은 만들지 않는다.** 화면이 11개라 유지비가 두 배인데
     얻는 것이 그만큼 크지 않다. **한 열은 그대로 두고 폭만 넓힌다.** */
.app.sap{--sap-w:480px;
  max-width:var(--sap-w);margin:0 auto;min-height:100vh;position:relative;
  background:var(--paper);box-shadow:0 0 0 1px var(--line);}
@media (min-width:760px){ .app.sap{--sap-w:620px;} }
@media (min-width:1100px){ .app.sap{--sap-w:680px;} }
@media (max-width:520px){ .app.sap{box-shadow:none;} }
/* 상단바·서브내비는 ds.css 것을 그대로 쓴다. 학생이라고 다른 상단바를 만들지 않는다. */
.app.sap .topbar{padding:0 16px;gap:10px;}
.app.sap .topbar .bm{font-size:13px;}
.app.sap .subnav{padding:0 6px;}
.app.sap .subnav a{padding:0 11px;font-size:12.5px;}
/* 하단 탭바가 마지막 줄을 가리지 않도록 본문 아래에 그만큼 비워 둔다. */
.app.sap .body{padding:16px 16px 78px;}

/* 하단 탭 — 엄지가 닿는 자리. 뷰포트에 고정하되 폭은 앱 열에 맞춘다.
   ds.css의 .ph-tabs는 폰 액자 «안»의 것이라 position이 다르다. */
.sap-tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:var(--sap-w);height:58px;display:flex;z-index:7;
  background:var(--card);border-top:1px solid var(--line);}
.sap-tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--dim);font-size:10.5px;cursor:pointer;
  transition:color var(--t);}
.sap-tabs a.on{color:var(--accent);font-weight:700;}

/* 알림 벨 — 학생·관리자 상단바가 같이 쓴다 */
.ds-bell{position:relative;display:flex;}
.ds-bell>button{width:32px;height:32px;border:0;background:transparent;color:var(--sub);
  border-radius:var(--r-md);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ds-bell>button:hover{background:var(--hover);}
.ds-bell .n{position:absolute;top:1px;right:0;min-width:15px;height:15px;padding:0 3px;
  border-radius:8px;background:var(--no);color:#fff;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.ds-drop{position:absolute;top:38px;right:0;width:210px;z-index:9;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 8px 24px rgba(0,0,0,.1);overflow:hidden;}
.ds-drop .it{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:12.5px;cursor:pointer;}
.ds-drop .it+.it{border-top:1px solid var(--line2);}
.ds-drop .it:hover{background:var(--hover);}
.ds-drop .it b{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--no);}
.ds-drop .em{padding:14px;font-size:12px;color:var(--dim);text-align:center;}

/* 화면 머리 — 「누구의 화면인가」. serif는 학생 이름에만 쓴다 (시스템 규칙) */
.sap-hi b{display:block;font-family:'Noto Serif KR',serif;font-size:21px;font-weight:600;
  letter-spacing:-.02em;}
.sap-hi span{display:block;font-size:12.5px;color:var(--dim);margin-top:5px;}

/* 화면 안내문 — 「여기서 무엇을 하는가」 한 줄 */
.sap-lede{font-size:12px;color:var(--sub);line-height:1.7;margin:0 0 14px;}

/* 입력 — .cls-form은 데스크톱 밀도(12.5px)라 엄지로 쓰기엔 작다 */
.sap-in{width:100%;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:12px 13px;font-family:inherit;font-size:14px;color:var(--ink);outline:none;resize:vertical;}
.sap-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.sap-in::placeholder{color:var(--dim);}
.sap-lab{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.04em;margin-bottom:6px;}
.sap-row2{display:flex;gap:9px;}
.sap-row2>*{flex:1;min-width:0;}

/* 보기 버튼 ①~⑤ — selectChoice()가 부모의 .mc-choice-btn을 찾으므로 이름은 그대로 쓴다 */
.sap .mc-choice-group{display:flex;gap:8px;}
.sap .mc-choice-btn{flex:1;height:46px;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r-md);font-family:inherit;font-size:17px;color:var(--sub);cursor:pointer;
  transition:all var(--t);}
.sap .mc-choice-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

/* 문제 본문 — 수식이 섞이므로 줄 간격을 넉넉히 */
.sap-q{font-size:15px;line-height:1.85;white-space:pre-wrap;}

/* 스크롤 상자에는 반드시 position:relative를 같이 준다 (KaTeX .katex-mathml 때문).
   시험지 화면에서 문서가 3736px 늘어났던 사고와 같은 것이다. */
.sap-chat{position:relative;height:calc(100vh - 250px);min-height:280px;overflow-y:auto;
  padding:2px;margin-bottom:12px;}

/* 오답숙제·성적처럼 «수치를 세는» 곳의 작은 진행 표시 */
.sap-prog{display:flex;align-items:center;gap:10px;margin-top:11px;}
.sap-prog .bar{flex:1;}
.sap-prog b{font-family:'JetBrains Mono',monospace;font-size:12px;}

/* 달 넘김 같은 «작은 화살표»도 엄지로 누른다. ds.css의 .btn.icon(32px)은 마우스 치수다. */
.sap-navbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--sunk);
  border-radius:var(--r-md);color:var(--sub);cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.sap-navbtn:hover{background:var(--hover);color:var(--ink);}

.sap-empty{padding:36px 0;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.8;}
/* 지금 시험 범위 — «왜 이 문제만 나오나»를 학생이 알아야 납득한다 */
.sap-range{display:flex;align-items:center;gap:6px;margin:0 0 12px;font-size:11.5px;color:var(--sub);
  background:var(--note);border:1px solid var(--note-line);border-radius:var(--r);padding:7px 11px;}
.sap-range s{text-decoration:none;color:var(--dim);}
.sap-img{max-width:100%;border:1px solid var(--line);border-radius:var(--r-md);display:block;margin-top:10px;}

/* 강의 임베드 — 16:9 비율 상자 */
.sap-vwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-md);
  overflow:hidden;background:#000;margin-top:11px;}
.sap-vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

/* ============================================================
   출석 도장 — 접두사 gm-  (2026-08-21 · 시안 design-v1/21-checkin.html)
   ⚠ **이것은 출결이 아니다.** 강사가 「수업 > 출결」에 넣는 출석·지각·조퇴·결석은
     그대로 두고, 이 도장은 «앱을 연 날»에만 찍히는 **다른 줄**이다.
     출석률에 한 숫자도 섞이지 않는다. 그래서 이름도 「출석 체크」가 아니라 「출석 도장」이다.
   ⚠ **이름을 전부 gm- 으로 연다.** ds.css 와 한 글자도 겹치지 않게 —
     예전에 .field 가 겹쳐 폼 102곳이 무너진 적이 있다.
   ============================================================ */
.gm-head{display:flex;align-items:baseline;gap:8px;}
.gm-head .st{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:600;letter-spacing:-.03em;
  line-height:1;}
.gm-head .st em{font-style:normal;font-size:13px;font-weight:400;color:var(--dim);margin-left:3px;}
.gm-head .best{margin-left:auto;font-size:11px;color:var(--dim);}
.gm-head .best b{font-family:'JetBrains Mono',monospace;color:var(--sub);}

/* 일곱 칸 — 이번 주 */
.gm-weekwrap{padding-bottom:20px;}
.gm-week{display:flex;gap:6px;margin-top:14px;}
.gm-day{flex:1;aspect-ratio:1;border-radius:50%;border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;
  font-size:10.5px;color:var(--dim);background:var(--sunk);}
/* ⚠ 도장 자체가 원이라 찍힌 칸은 테두리 원을 지운다 — 안 그러면 원이 두 겹이 된다 */
.gm-day.on{border-color:transparent;background:transparent;}
.gm-day.today{border-color:var(--accent);border-style:solid;}
.gm-day .lb{position:absolute;bottom:-17px;left:0;right:0;text-align:center;
  font-size:9.5px;color:var(--dim);}
.gm-day .stmp{width:104%;height:104%;object-fit:contain;display:block;}

/* 「오늘의 게임」 줄 */
.gm-run{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;
  border:1px solid var(--accent-line);background:var(--accent-bg);border-radius:var(--r-lg);
  cursor:pointer;transition:background var(--t);}
.gm-run:hover{background:#E3DFDA;}
.gm-run .ic{width:34px;height:34px;border-radius:var(--r-md);flex-shrink:0;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:17px;}
.gm-run .ic img{width:32px;height:32px;object-fit:contain;display:block;}
.gm-run .t{flex:1;min-width:0;}
.gm-run .t b{display:block;font-size:13.5px;font-weight:700;}
.gm-run .t span{display:block;font-size:11.5px;color:var(--sub);margin-top:3px;}
.gm-run .go{color:var(--accent);flex-shrink:0;}
/* 오늘 것을 다 쓴 자리 — «눌러도 안 되는 버튼»이 아니라 «닫힌 자리»로 보여야 한다 */
.gm-run.off{border-color:var(--line);background:var(--sunk);cursor:default;}
.gm-run.off:hover{background:var(--sunk);}
.gm-run.off .ic{background:transparent;}
.gm-run.off .t b{color:var(--sub);}

/* 이번 주 순위 — 학원 전체 · 상위 5명 */
.gm-rank{margin-top:14px;padding-top:13px;border-top:1px solid var(--line2);}
.gm-rank .hd{display:flex;align-items:baseline;gap:7px;margin-bottom:9px;}
.gm-rank .hd b{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.06em;}
.gm-rank .hd s{text-decoration:none;margin-left:auto;font-size:10.5px;color:var(--dim);
  font-family:'JetBrains Mono',monospace;}
.gm-rk{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px;}
.gm-rk .n{width:15px;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  color:var(--dim);text-align:center;}
/* 1위만 브랜드색을 준다. 셋을 다 칠하면 «등수»가 아니라 «장식»이 된다 */
.gm-rk.top .n{color:var(--brand);font-weight:700;}
.gm-rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 전체를 한 판에 세우면 이름만으로는 누군지 모른다 — 반을 작게 덧붙인다 */
.gm-rk .nm i{font-style:normal;font-size:10.5px;color:var(--dim);margin-left:6px;}
.gm-rk .sc{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub);
  font-variant-numeric:tabular-nums;}
.gm-rk.me{background:var(--accent-bg);border-radius:var(--r);margin:0 -7px;padding:4px 7px;}
.gm-rk.me .nm{font-weight:700;}
.gm-rk.me .nm em{font-style:normal;font-size:10.5px;color:var(--accent);margin-left:5px;}
/* ⚠ 5위 밖일 때 «몇 등»인지는 말하지 않는다 —
   매일 열 때마다 자기 이름이 아래쪽에 있는 것을 보면 그만두게 된다 */
.gm-rank .yet{margin-top:8px;font-size:11px;color:var(--dim);line-height:1.6;}
.gm-rank .yet b{color:var(--sub);}

/* ============================================================
   게임 — 화면을 덮는다
   ⚠ **캔버스는 `#app` 밖에 있어야 한다.** render() 가 app.innerHTML 을 통째로
     갈아치우므로 안에 두면 렌더 한 번에 캔버스가 사라진다.
     그래서 덮개는 body 의 #gamehost 에 붙인다.
   ============================================================ */
.gm-over{position:fixed;inset:0;z-index:55;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;}
/* 🔵 **점수판을 캔버스 «위»로 띄운다** (2026-09-02 · S-D-11 · 사용자가 시켰다).
   예전에는 위에 52px 막대를 «칸으로» 두고 남는 데를 게임에 줬다. 폰에서 그만큼이
   깎이니 게임이 납작해지고, 그 납작한 화면에서 하늘이 3분의 1을 먹으니
   「게임 위에 빈 공간이 너무 넓다」가 됐다.
   이제 **캔버스가 화면을 다 쓰고** 닫기·점수·최고가 그 위에 뜬다 — 요즘 폰 게임의 어법이다.
   ⚠ 막대는 pointer-events:none 이어야 한다. 안 그러면 위쪽에서 손가락이 안 먹는다.
     닫기 단추만 다시 켜 준다. */
.gm-shell{--gw:480px;width:100%;max-width:var(--gw);height:100%;position:relative;}
@media (min-width:760px){ .gm-shell{--gw:560px;} }
@media (min-width:1100px){ .gm-shell{--gw:600px;} }
.gm-bar{position:absolute;top:0;left:0;right:0;z-index:2;
  height:calc(48px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 10px 0;
  display:flex;align-items:center;gap:10px;pointer-events:none;
  background:linear-gradient(180deg,rgba(250,249,246,.85) 0%,rgba(250,249,246,0) 100%);}
.gm-x{width:36px;height:36px;border:0;background:transparent;color:var(--sub);cursor:pointer;
  border-radius:var(--r-md);font-size:16px;font-family:inherit;pointer-events:auto;}
.gm-x:hover{background:var(--hover);}
.gm-bar .sc{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.gm-bar .bs{font-size:11px;color:var(--dim);}
.gm-stage{position:absolute;inset:0;}
/* ⚠ touch-action:none 이 없으면 끄는 손가락이 페이지를 스크롤한다 */
.gm-stage canvas{display:block;touch-action:none;}

/* 결과 — 캔버스 위에 얹는다 */
.gm-res{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(250,249,246,.93);overflow-y:auto;}
.gm-res .in{width:82%;max-width:360px;text-align:center;padding:18px 0;}
.gm-res .big{font-family:'Noto Serif KR',serif;font-size:40px;font-weight:600;letter-spacing:-.03em;
  line-height:1;}
.gm-res .sub2{font-size:12px;color:var(--dim);margin-top:8px;}
/* 도장 — 판이 끝나면 «쿵» 하고 내려앉는다.
   ⚠ 글로 「도장을 찍었습니다」라고 쓰는 것과 실제로 찍히는 것은 다른 일이다.
     이 0.45초가 이 기능의 보상이다. */
.gm-res .stamp{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.gm-res .stamp img{width:132px;height:auto;display:block;
  animation:gmStampDrop .45s cubic-bezier(.2,1.5,.4,1) both;}
.gm-res .stamp .day{font-size:12.5px;font-weight:700;color:var(--brand-d);
  animation:gmFadeUp .3s ease .34s both;}
@keyframes gmStampDrop{
  0%{transform:scale(2.4) rotate(-15deg);opacity:0;}
  55%{transform:scale(.92) rotate(4deg);opacity:1;}
  100%{transform:scale(1) rotate(0);opacity:1;}
}
@keyframes gmFadeUp{ from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:none;} }
.gm-res .one{margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.6;}
.gm-res .btns{display:flex;gap:8px;margin-top:14px;}
.gm-res .btns button{flex:1;height:46px;border-radius:var(--r-md);font-family:inherit;
  font-size:13.5px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);
  color:#fff;font-weight:700;}
@media (prefers-reduced-motion:reduce){
  .gm-res .stamp img,.gm-res .stamp .day{animation:none;}
}

/* ============================================================
   설정 · 목록 — 접두사 st-
   **카드를 쓰지 않는다.** 시안(13-settings)이 정한 언어는 «구역 + 줄»이다 —
   제목 아래 실선 하나로 구역을 가르고, 그 안은 얇은 선으로 나눈 줄이 쌓인다.
   흰 상자를 종이 위에 띄우는 것은 구버전(.lg-panel)의 어법이었다.
   한 화면에 상자가 서넛 뜨면 «무엇이 무엇 안에 있는지»가 흐려진다.
   ============================================================ */
.app .st-wrap{max-width:840px;}
.app .st-sec{margin-bottom:30px;}
.app .st-sec:last-child{margin-bottom:0;}
.app .st-h{display:flex;align-items:baseline;gap:10px;padding-bottom:11px;
  border-bottom:1px solid var(--line);}
.app .st-h b{font-size:14px;font-weight:700;}
.app .st-h span{font-size:12px;color:var(--dim);}
.app .st-h .r{margin-left:auto;display:flex;align-items:center;gap:6px;align-self:center;}

/* 한 줄 = 한 가지. 라벨과 설명을 붙여 둔다 —
   설명 없는 줄은 «건드리면 뭐가 되는지» 몰라서 결국 아무도 안 건드린다. */
.app .st-row{display:flex;align-items:center;gap:16px;padding:13px 2px;
  border-bottom:1px solid var(--line2);}
.app .st-row:hover{background:var(--hover);}
.app .st-row .t{flex:1;min-width:0;}
/* ⚠ 직계 자식만 블록으로 만든다. 후손 전체에 걸면 줄 안에 넣은 <span class="mono">까지
   블록이 되어 「test11」과 「· 테스트반」이 두 줄로 갈라진다. */
.app .st-row .t > b{display:block;font-size:13px;font-weight:600;}
.app .st-row .t > span{display:block;font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.6;}
.app .st-row .t s{text-decoration:none;color:var(--line);margin:0 6px;}
.app .st-row .v{flex-shrink:0;display:flex;align-items:center;gap:6px;}
.app .st-empty{padding:30px 2px;font-size:12.5px;color:var(--dim);line-height:1.8;}

/* 변경 이력 한 줄 — 시안이 그린 그대로. 표가 아니라 줄이다.
   표는 «비교»하는 것이고 로그는 «훑는» 것이라, 열 머리가 필요 없다. */
.app .st-log{display:flex;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--line2);font-size:12px;}
.app .st-log .tm{width:104px;flex-shrink:0;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--dim);white-space:nowrap;}
.app .st-log .ac{width:84px;flex-shrink:0;}
.app .st-log .x{flex:1;min-width:0;color:var(--sub);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.app .st-log .by{width:74px;flex-shrink:0;text-align:right;font-size:11.5px;color:var(--dim);}

/* 접히는 입력 — 「추가」를 눌러야 열린다.
   상시 펼쳐 둔 폼은 화면에서 제일 큰 자리를 차지하면서 제일 가끔 쓰인다.
   (시험지 「새 시험지」· 창고 「문항 추가」· 학생앱 「틀린 문제 등록」과 같은 장치다.) */
.app .st-form{padding:16px 0 6px;border-bottom:1px solid var(--line2);}
.app .st-form .cls-form{margin-top:0;}
/* 조교의 담당 반 고르개 — 반이 여럿이라 select가 아니라 체크상자를 편다 (2026-08-11).
   .edit는 줄 «아래»에 붙는 판이라 어느 줄에 딸린 것인지 보이게 왼쪽에 선을 세운다. */
.app .ta-cls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px;}
.app .ta-cls.edit{margin:0;padding:13px 15px;background:var(--note);
  border-left:3px solid var(--accent-line);border-bottom:1px solid var(--line2);}
.app .ta-cls .lb{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.02em;}
.app .ta-cls .lb s{text-decoration:none;font-weight:400;color:var(--line);margin-left:7px;}
.app .ta-cbx{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--paper);font-size:12.5px;cursor:pointer;}
.app .ta-cbx:hover{border-color:var(--accent-line);}
.app .ta-cbx input{margin:0;cursor:pointer;}
.app .ta-none{font-size:11.5px;color:var(--dim);}
.app .st-note{margin:12px 0 0;font-size:11.5px;color:var(--dim);line-height:1.75;}
.app .st-note b{color:var(--ink);font-weight:700;}

/* 신호 규칙 — 줄 끝에 서는 «숫자 하나». 접두사 sr-
   ⚠ mono는 숫자 칸에만. 「회 이상」·「무거움」 같은 낱말은 밖으로 뺀다 (8절). */
.app .sr-v{gap:5px;font-size:11.5px;color:var(--dim);flex-wrap:wrap;justify-content:flex-end;}
.app .sr-num{width:62px;height:30px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:0 6px;font-size:12.5px;color:var(--ink);text-align:right;
  outline:none;transition:border-color var(--t),box-shadow var(--t);}
.app .sr-num:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.app .sr-u{min-width:60px;}
.app .sr-pre{margin-left:6px;}
.app .sr-pre:first-child{margin-left:0;}
.app .sr-fixed{color:var(--dim);}

/* ============================================================
   폼 · 표 — 구버전 스타일이 쥐고 있던 마지막 조각들이 온 자리다. 접두사 fm-
   화면이 아니라 «부품»이라 화면별 접두사를 붙이지 않는다.
   시험지 등록 · 창고 추가 · 설정 6갈래 · 수업 기록 상세가 이걸 같이 쓴다.
   ============================================================ */
.app .fm-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 22px;margin-bottom:16px;}
.app .fm-panel h3{margin:0 0 16px;font-family:'Noto Serif KR',serif;font-size:16px;
  font-weight:600;letter-spacing:-.02em;}
.app .fm-panel h4{margin:22px 0 10px;font-size:13px;font-weight:700;}

.app .fm-field{margin-bottom:14px;}
.app .fm-field label{display:block;font-size:11px;font-weight:700;color:var(--dim);
  letter-spacing:.02em;margin-bottom:6px;}
.app .fm-field input,.app .fm-field select,.app .fm-field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;
  transition:border-color var(--t),box-shadow var(--t);}
.app .fm-field input:focus,.app .fm-field select:focus,.app .fm-field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.app .fm-field textarea{min-height:78px;resize:vertical;}
.app .fm-field input[type=file]{padding:6px;background:var(--card);}

.app .fm-hint{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:11px;}
/* .fm-field 밖에 홀로 선 드롭다운 — 여기 없으면 브라우저 기본 모양이 그대로 나온다 */
.app .fm-sel{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--sunk);padding:0 8px;font-family:inherit;font-size:12.5px;color:var(--ink);
  outline:none;cursor:pointer;}
.app .fm-sel:focus{border-color:var(--accent);}
/* 가로로 늘어놓는 입력 줄 — 구버전 .inline-form */
.app .fm-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.app .fm-row .fm-field{margin-bottom:0;min-width:140px;flex:1;}
/* 막지는 않고 «이렇게 됩니다»를 말해 주는 자리 */
.app .fm-warn{background:var(--latebg);border:1px solid var(--late);border-radius:var(--r);
  padding:9px 12px;font-size:12px;line-height:1.7;color:var(--ink);}
.app .fm-empty{padding:34px 0;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.8;}
.app .fm-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.app .fm-head h3{margin:0;font-size:15px;}
.app .fm-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:10px;}
.app .fm-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.app .fm-acts button{margin:0;}

/* 표 — 구버전 .ledger(위 2px 잉크선 + 아래 얇은 선)가 여기로 왔다.
   ds.css의 table.grid와 같은 리듬이되, 폼 패널 안이라 조금 낮다. */
.app .fm-panel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.app .fm-panel thead th,.app .fm-panel tr:first-child th{height:32px;text-align:left;
  font-size:11px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);
  padding:0 8px;white-space:nowrap;}
.app .fm-panel td{height:38px;padding:0 8px;border-bottom:1px solid var(--line2);
  font-size:12.5px;vertical-align:middle;}
.app .fm-panel tbody tr:hover td,.app .fm-panel tr:hover td{background:var(--hover);}
.app .fm-nm{font-weight:600;}
.app .fm-sub{color:var(--dim);font-size:11.5px;}

/* 채팅 — 학생 화면과 같은 말풍선(ds.css .bub-row)을 쓴다.
   ⚠ 스크롤 상자에는 position:relative를 같이 준다 (KaTeX .katex-mathml 때문). */
.app .fm-chat{position:relative;height:340px;overflow-y:auto;padding:4px 2px;margin-bottom:12px;}

/* 문항 한 줄 — 시험지 등록의 «번호 + 입력들» */
.app .fm-q{display:flex;gap:9px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid var(--line2);}
.app .fm-q .qno{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent);
  flex:0 0 32px;padding-top:9px;font-size:12.5px;}
.app .fm-q .qf{flex:1;display:flex;gap:8px;flex-wrap:wrap;}
.app .fm-q .qf textarea{flex:2;min-width:200px;min-height:44px;}
.app .fm-q .qf input{flex:1;min-width:100px;}
/* 입력칸 옆의 «보이는 판». textarea 안의 $…$는 KaTeX가 못 건드리므로(입력칸이다)
   단원을 판단하려면 그려진 것을 따로 보여 줘야 한다. */
.app .fm-eqprev{flex:1 1 100%;min-width:0;background:var(--note);
  border:1px solid var(--note-line);border-radius:var(--r-sm);padding:9px 11px;
  font-size:13px;line-height:1.9;white-space:pre-wrap;overflow-x:auto;position:relative;}
.app .fm-eqprev:empty::before{content:'문제를 입력하면 수식이 여기에 그려집니다';color:var(--dim);font-size:11.5px;}
.app .fm-eqprev .lb{display:block;font-size:10.5px;color:var(--dim);margin-bottom:3px;}
.app .fm-q .qf input,.app .fm-q .qf textarea,.app .fm-q .qf select{
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;resize:vertical;}
.app .fm-q .qf input:focus,.app .fm-q .qf textarea:focus{border-color:var(--accent);}

/* 출석 표 — 상태 버튼은 ds.css의 .seg를 그대로 쓴다.
   🔴 **이 표는 제 서식을 스스로 지녀야 한다** (2026-08-31 · 사용자가 짚었다) —
     예전에는 `.fm-panel` 안에만 있어서 거기 표 규칙(테두리 합침·왼쪽 정렬·패딩)을
     빌려 쓰고 있었다. C-6에서 «출결 격자 아래»(`.ag-edit`)로 옮기면서 그 규칙이 끊겼고,
     **브라우저 기본 표**가 됐다 — th는 가운데 정렬, 패딩 1px, border-spacing 2px.
     그래서 «이름·상태» 머리말이 아래 칸과 어긋나 보였다.
   ⚠ 화면을 옮길 때는 **그 부품이 «빌려 쓰던 서식»이 따라오는지** 볼 것. */
.app .fm-att{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.app .fm-att th{height:32px;text-align:left;font-size:11px;font-weight:600;color:var(--dim);
  border-bottom:1px solid var(--line);padding:0 10px;}
.app .fm-att td{padding:9px 10px;font-size:12.5px;vertical-align:middle;}
.app .fm-att td,.app .fm-att th{white-space:nowrap;}
/* 학생 한 명은 «두 줄»이다 — 위는 상태, 아래는 적는 칸. 금은 두 줄 아래에만 긋는다. */
.app .fm-att tr:not(.fm-att-sub) td{padding-bottom:4px;}
.app .fm-att .fm-att-sub td{padding-top:0;padding-bottom:12px;border-bottom:1px solid var(--line2);}
.app .fm-att .fm-nm{font-weight:600;font-size:13px;}
/* 「출석 상태 변경」 열이 남는 폭을 다 가져간다 — 이름·상태는 제 폭만 쓴다. */
.app .fm-att th:last-child,.app .fm-att td:last-child{width:100%;}
.app .fm-att th:first-child,.app .fm-att td:first-child{width:34px;}
.app .fm-att input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:6px 9px;font-family:inherit;font-size:12px;color:var(--ink);outline:none;}
.app .fm-att input:focus{border-color:var(--accent);}

/* ============================================================
   로그인 (design-v1/17-login) — 접두사 lo-
   폰과 데스크톱이 «같은 한 칸»이다. 캔버스를 씌우지 않고 가운데 세운다.
   ============================================================ */
.app.lo{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:clamp(44px,11vh,116px) 20px 64px;}
.lo-col{width:100%;max-width:396px;}
/* 로고가 홈으로 가는 문이다. 상단 헤더가 없으므로 여기 하나뿐이다. */
.lo-logo{width:196px;height:auto;display:block;margin:0 auto 34px;cursor:pointer;}
.lo-lab{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 7px;letter-spacing:-.01em;}
.lo-in{width:100%;height:48px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);padding:0 14px;font-family:inherit;font-size:14.5px;color:var(--ink);
  outline:none;transition:border-color var(--t),box-shadow var(--t);}
.lo-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.lo-in::placeholder{color:var(--dim);}
.lo-f+.lo-f{margin-top:16px;}
.lo-go{display:flex;align-items:center;justify-content:center;width:100%;height:50px;
  background:var(--accent);border:1px solid var(--accent);border-radius:var(--r-md);
  color:#fff;font-family:inherit;font-size:15px;font-weight:700;margin-top:24px;cursor:pointer;
  transition:background var(--t);}
.lo-go:hover{background:var(--accent-d);}
.lo-hint{margin:16px 0 0;font-size:12px;color:var(--dim);line-height:1.75;text-align:center;}
/* 다른 문 — 오는 사람은 거의 전부 학생이라 조교·강사는 «아래 작은 글»이다 */
.lo-doors{margin-top:32px;padding-top:20px;border-top:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;gap:13px;
  font-size:12.5px;color:var(--sub);}
.lo-doors a{text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
.lo-doors a:hover{color:var(--ink);}
.lo-doors s{text-decoration:none;color:var(--line);}
/* 오류는 «다시 입력하기 전»에 읽혀야 하므로 칸 위에 온다.
   구버전은 버튼 아래에 뒀는데, 고치려고 위로 올라가면 화면 밖으로 나갔다. */
.lo-err{display:flex;align-items:flex-start;gap:9px;margin-bottom:20px;padding:12px 14px;
  background:var(--nobg);border:1px solid var(--no-line);border-radius:var(--r-md);
  font-size:12.5px;line-height:1.7;color:var(--no);}
.lo-err svg{flex-shrink:0;margin-top:1px;}
.lo-err b{display:block;font-weight:700;}
.lo-err span{color:#8E4A40;}

/* ============================================================
   조교 (design-v1/18-assistant) — 접두사 as-
   **따로 만든 화면이 아니라 관리자 화면을 «권한»으로 좁힌 것이다.**
   그래서 명단은 .rst-*, 학생 상세는 .sd-*를 그대로 쓴다. 여기 있는 것은
   «조교라는 사실»을 말하는 부품뿐이다.
   ============================================================ */
.app.as .topbar{gap:10px;}
.as-who{display:flex;align-items:center;gap:9px;margin-left:12px;}
.as-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-xs);
  background:var(--accent);color:#fff;letter-spacing:.02em;flex-shrink:0;}
.as-cls{font-size:12.5px;color:var(--sub);white-space:nowrap;}
.as-cls b{color:var(--ink);font-weight:700;}
/* 권한을 화면이 먼저 말한다 — 눌러 보고 나서야 «안 되는구나»를 알게 하지 않는다 */
.as-lede{margin:11px 0 0;font-size:12.5px;color:var(--sub);line-height:1.75;max-width:78ch;}
.as-lede b{color:var(--ink);font-weight:700;}
/* 조교의 표는 열이 여덟이라 명단(1418px)보다 좁다. 그대로 두면 괜히 가로 스크롤이 남는다. */
.app .rst-wrap table.grid.as-narrow{min-width:1050px;}

/* ---------- 시험 달력 (설정 > 시험 일정) ----------
   학생 마이페이지의 출석 달력(.cal)은 ds.css의 «모바일 부품»이라 폰 크기다.
   여기는 강사 화면이라 칸이 훨씬 크고 안에 학교 딱지가 들어간다 — 그래서 따로 세운다.
   접두사 exc- (exam calendar). ds.css 이름을 다시 정의하지 않는다. */
.app .exc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
.app .exc .dh{background:var(--hover);padding:9px 0;text-align:center;
  font-size:11.5px;font-weight:700;color:var(--dim);}
/* ⚠ 좌우 7px는 «띠를 칸 가장자리까지 늘리는» 규칙(.exc-chip의 margin −7 · padding 13)과
   짝이다. 세로만 줄인다 — 좌우를 건드리면 저기도 같이 고쳐야 한다.
   min-height는 «줄이 없는 주»의 바닥이다. 줄이 차면 어차피 넘어서 자란다. */
.app .exc .d{background:var(--card);min-height:88px;padding:6px 7px 7px;}
.app .exc .d.off{background:var(--sunk);}
.app .exc .d .n{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--sub);}
.app .exc .d.sat .n{color:var(--blue);}
.app .exc .d.sun .n{color:var(--no);}
/* 오늘은 «칠하지» 않고 번호만 감싼다 — 칸을 통째로 칠하면 그날의 딱지가 안 읽힌다 */
.app .exc .d.today .n{background:var(--accent);color:#fff;border-radius:9px;padding:1px 7px;}
/* 시험기간은 «한 덩어리»로 읽혀야 한다 — 날마다 둥근 알약이 따로 서면
   닷새가 다섯 조각이 되어 «이어지는 기간»이 아니라 «매일 뭔가 있음»으로 보인다.
   그래서 ① 칸의 좌우 패딩(7px)만큼 늘려 격자선까지 닿게 하고,
        ② 모서리는 «첫날 왼쪽 · 마지막날 오른쪽»만 둥글리고,
        ③ 첫날과 기간 중의 색을 나누지 않는다 — 시작은 모서리와 이름이 알려 준다.
   ⚠ 글자 왼쪽 자리를 13px로 맞추려고 padding-left가 둘로 갈린다.
      늘어난 쪽은 margin이 -7이라 padding 13, 막힌 쪽은 margin 0이라 padding 6이다. */
.app .exc-chip{display:block;margin:3px -7px 0;padding:2px 6px 2px 13px;border-radius:0;
  font-size:11px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--accent-bg);color:var(--sub);}
.app .exc-chip.capL{margin-left:0;padding-left:6px;border-radius:5px 0 0 5px;}
.app .exc-chip.capR{margin-right:0;border-radius:0 5px 5px 0;}
.app .exc-chip.capL.capR{border-radius:5px;}
/* 주 경계에서는 양쪽 다 각진 채로 둔다 — 그래야 «다음 줄로 이어진다»가 보인다 */
/* 수학 시험일 — 이 화면에서 가장 중요한 하루라 브랜드 와인을 여기에만 쓴다.
   모서리는 «기간 안의 위치»가 정하므로 띠 한가운데면 각진 채로 색만 바뀐다 */
.app .exc-chip.math{background:var(--brand);color:#fff;font-weight:700;}
/* 그 학교가 «그 줄에 없는 날»의 빈 자리. 이게 없으면 아랫줄이 위로 당겨져
   학교마다 높이가 어긋난다 — 딱지와 같은 높이를 차지하되 보이지는 않는다 */
.app .exc-chip.void{background:transparent;}
.app .exc-more{display:block;margin-top:4px;font-size:10.5px;color:var(--dim);}

/* ============================================================
   공개 홈 — 랜딩 「생각의 흐름」 (2026-08-13 전면 재구성)
   주인공은 시스템이 아니라 **수학강사 김하현**이다.
   원칙 셋(개념 · 떠올리는 순서 · 반복)이 페이지의 뼈대이고,
   교재 · 오답 · 변형문항 · 데일리퀴즈는 전부 «원칙 03의 도구»로 뒤에 선다.

   토큰은 전부 ds.css(:root). 여기에는 «배치»만 둔다.
   클래스는 전부 l- 접두사 — ds.css와 이름이 겹치면 조용히 망가진다.
   («.stage / .ev / .tag / .row»로 이미 세 번 당했다.)

   시안은 제 문서라 html·body에 직접 글꼴과 배경을 걸었다.
   실서비스는 한 문서 안에 관리자·학생·랜딩이 함께 있으므로 .lp가 그 자리를 맡는다.
   ⚠ 시안의 body{overflow-x:hidden}은 옮기지 않았다 — .lp에 걸면 그 상자가
   새 스크롤포트가 되어 페이지 스크롤이 통째로 안쪽으로 들어간다 (명단에서 겪은 그 사고다).
   가로 넘침은 감추는 대신 «만들지 않는» 쪽으로 잡았다.
   ============================================================ */
.lp{background:var(--paper);color:var(--ink);
  font-family:'Pretendard',-apple-system,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
.lp a{color:inherit;}
.lp :focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:2px;}

.lp .l-skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;
  padding:12px 18px;z-index:100;border-radius:0 0 8px 0;text-decoration:none;}
.lp .l-skip:focus{left:0;}

/* 공통 배치 — 시각 열 / 척추 / 본문 열.
   척추는 페이지 전체를 관통한다. 「원칙 01 → 02 → 03이 한 학생 안에서 이어진다」가
   이 선의 뜻이라, 원칙 구간(차콜)에서도 끊기지 않는다. */
.lp .l-wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.lp .l-rail{position:relative;}
.lp .l-spine{position:absolute;left:132px;top:0;bottom:0;width:1px;background:var(--line);
  transform-origin:top;}
.lp .l-dot{position:absolute;left:128px;width:9px;height:9px;border-radius:50%;
  background:var(--brand);border:2px solid var(--paper);}
.lp .l-col{padding-left:164px;}

/* 눈금 — 섹션이 무엇인지 한 낱말로. mono라 한글을 넣지 않는다(자간이 벌어진다). */
.lp .l-k{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);}
.lp .l-hk{font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--dim);}

/* ---------- 상단 바 : 히어로를 지나면 나타난다 ---------- */
.lp .l-bar{position:fixed;left:0;right:0;top:0;height:62px;z-index:50;
  display:flex;align-items:center;gap:16px;padding:0 28px;
  background:rgba(250,249,246,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  transform:translateY(-100%);transition:transform .32s cubic-bezier(.4,0,.2,1);}
.lp .l-bar.on{transform:translateY(0);}
.lp .l-bar .l-inner{max-width:1180px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;}
.lp .l-bar img{height:26px;width:auto;display:block;}
.lp .l-bar .l-sp{margin-left:auto;}

.lp .l-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--r-md);
  padding:11px 20px;font-family:inherit;font-size:14px;font-weight:700;text-decoration:none;
  cursor:pointer;white-space:nowrap;
  transition:background var(--t),border-color var(--t);}
.lp .l-btn:hover{background:var(--accent-d);border-color:var(--accent-d);}
.lp .l-btn.l-sm{padding:8px 15px;font-size:13px;}
.lp .l-btn.l-lg{padding:17px 30px;font-size:16.5px;border-radius:var(--r-lg);}
.lp .l-btn.l-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.lp .l-btn.l-ghost:hover{background:var(--hover);border-color:#D9D6CC;}

/* ============ 1. 도착 — 얼굴과 방식이 «같은 화면»에 ============
   개인 브랜딩 페이지라 사람이 먼저다. 그런데 얼굴만 있으면 인물 포트폴리오가 되고
   (랜딩 5안 03이 그래서 기각됐다), 문장만 있으면 누구 말인지 모른다.
   그래서 둘을 한 화면에 나란히 세운다. */
.lp .l-hero{min-height:calc(100vh - 118px);min-height:calc(100svh - 118px);
  display:flex;flex-direction:column;justify-content:center;padding:104px 0 40px;position:relative;}
/* ⚠ .l-wrap의 margin:0 auto는 «세로 플렉스»의 가로축에서 stretch를 끈다.
   그래서 히어로 안에서만 wrap이 내용 크기로 줄어들고 척추가 아래 본문과 어긋난다.
   2026-08-07에 겪은 사고라 이 한 줄을 반드시 남긴다. */
.lp .l-hero .l-wrap{width:100%;}
.lp .l-hero .l-in{display:grid;grid-template-columns:minmax(0,1fr) 342px;gap:56px;align-items:center;}
.lp .l-hero .l-logo{max-width:290px;width:62%;min-width:210px;height:auto;display:block;}
.lp .l-name{margin-top:26px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.lp .l-name b{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.lp .l-name span{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase;}
.lp .l-lead{margin:22px 0 0;font-size:44px;line-height:1.24;letter-spacing:-.045em;
  font-weight:800;max-width:15ch;}
.lp .l-lead em{font-style:normal;color:var(--brand);}
.lp .l-sub{margin:20px 0 0;font-size:17px;line-height:1.75;color:var(--sub);max-width:34ch;}
.lp .l-heroimg{position:relative;}
.lp .l-heroimg img{width:100%;height:auto;display:block;}
/* 컷아웃 사진이라 바닥이 없다. 옅은 판을 깔아 인물이 «떠 있지» 않게 한다. */
.lp .l-heroimg::before{content:'';position:absolute;left:6%;right:6%;bottom:0;height:62%;
  background:var(--accent-bg);border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:0;}
.lp .l-heroimg picture{position:relative;z-index:1;display:block;}

/* ============ 2. 사람 ============ */
.lp .l-me{padding:118px 0 0;}
.lp .l-me .l-mt{margin:22px 0 0;font-size:23px;line-height:1.68;letter-spacing:-.035em;
  font-weight:750;max-width:30ch;}
.lp .l-me .l-mx{margin:22px 0 0;font-size:16.5px;line-height:1.85;color:var(--sub);max-width:46ch;}
.lp .l-me .l-mx b{color:var(--ink);font-weight:700;}

/* ============ 3. 원칙 셋 ============
   페이지에서 유일하게 큰 소리. 로고 차콜을 «면»으로 쓰는 단 한 번이다.
   척추가 색 위로도 이어진다 — 선이 장식이 아니라 구조라는 걸 보여주는 지점. */
.lp .l-prin{margin-top:118px;background:var(--accent);color:#F3F1EE;padding:104px 0 108px;}
.lp .l-prin .l-spine{background:rgba(243,241,238,.22);}
.lp .l-prin .l-dot{border-color:var(--accent);}
.lp .l-prin .l-hk{color:#A8A4A4;}
.lp .l-p{position:relative;padding:44px 0 0;}
/* ⚠ 번호만 mono다. JetBrains Mono에 한글이 없어 「원칙」·「개념」을 그대로 넣으면
   폴백 글꼴에 mono의 자간이 얹혀 「개 념」으로 벌어진다 —
   랜딩 합류 때 「금요일」이 「금 요 일」이 됐던 것과 같은 함정이다. */
.lp .l-p .l-pn{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--brand);}
.lp .l-p .l-pn em{font-family:'JetBrains Mono',monospace;font-style:normal;
  font-size:11px;letter-spacing:.16em;margin-right:11px;}
.lp .l-p h2{margin:14px 0 0;font-size:37px;line-height:1.32;letter-spacing:-.045em;
  font-weight:800;max-width:20ch;color:#FBFAF6;}
.lp .l-p p{margin:16px 0 0;font-size:16.5px;line-height:1.85;color:#C6C1C3;max-width:44ch;}
.lp .l-p p b{color:#FBFAF6;font-weight:700;}

/* ============ 4. 시연 — 원칙 02를 말하지 말고 보여준다 ============ */
.lp .l-flow{padding:112px 0 0;}
.lp .l-fq{margin:26px 0 0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:26px 30px;max-width:52ch;}
.lp .l-fq .l-fqk{font-size:11.5px;font-weight:700;letter-spacing:.2em;color:var(--dim);}
.lp .l-fq p{margin:12px 0 0;font-size:19px;line-height:1.7;letter-spacing:-.02em;font-weight:600;}
.lp .l-steps{margin:8px 0 0;padding:0;list-style:none;}
.lp .l-step{position:relative;display:flex;align-items:flex-start;padding:26px 0 0;}
.lp .l-step .l-sn{width:132px;flex-shrink:0;text-align:right;padding:3px 30px 0 0;
  font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--dim);}
.lp .l-step .l-sb{padding-left:32px;flex:1;min-width:0;}
.lp .l-step .l-see{font-size:14px;color:var(--dim);letter-spacing:-.01em;}
.lp .l-step .l-think{margin:7px 0 0;font-size:20px;line-height:1.6;letter-spacing:-.03em;
  font-weight:700;}
.lp .l-step .l-think b{color:var(--brand-d);}
/* 갈래를 «지우는» 단계. 이 페이지에서 제일 중요한 한 칸이라 종이색으로 따로 세운다 —
   답을 고르는 것이 아니라 아닌 것을 지우는 것이 이 수업의 핵심이기 때문이다. */
.lp .l-step.l-cut{padding-top:22px;}
.lp .l-step.l-cut .l-sb{background:var(--note);border:1px solid var(--note-line);
  border-radius:var(--r-md);margin-left:32px;padding:16px 22px;max-width:56ch;}
.lp .l-fend{margin:40px 0 0;padding:26px 30px;background:var(--accent-bg);
  border-radius:var(--r-lg);max-width:52ch;}
.lp .l-fend p{margin:0;font-size:18px;line-height:1.72;letter-spacing:-.03em;font-weight:700;}
.lp .l-fend span{display:block;margin-top:10px;font-size:15px;font-weight:400;
  line-height:1.75;color:var(--sub);letter-spacing:0;}

/* ============ 5. 교재 ============
   교재가 셋이라 사진이 넓어야 제목이 읽힌다. 그래서 이 섹션만 «넓은 사진 한 장 + 아래 3열»이다.
   사진의 배경은 --paper로 구워져 있어 페이지에 그대로 스며든다 — 테두리를 두르지 않는다. */
.lp .l-book{padding:118px 0 0;}
.lp .l-book h2{margin:22px 0 0;font-size:31px;line-height:1.34;letter-spacing:-.04em;font-weight:800;max-width:18ch;}
.lp .l-book .l-blead{margin:18px 0 0;font-size:17px;line-height:1.82;color:var(--sub);max-width:46ch;}
.lp .l-bimg{margin:34px 0 0;}
.lp .l-bimg img{width:100%;height:auto;display:block;}
.lp .l-bcap{margin-top:10px;font-size:12.5px;color:var(--dim);line-height:1.7;}
.lp .l-why{margin:26px 0 0;padding:0;list-style:none;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 36px;}
.lp .l-why li{padding:20px 0 0;border-top:1px solid var(--line);}
.lp .l-why b{display:block;font-size:16.5px;letter-spacing:-.025em;font-weight:750;}
.lp .l-why span{display:block;margin-top:8px;font-size:14.5px;line-height:1.75;color:var(--sub);}

/* ============ 6. 장치 — 시스템은 여기서 처음 나온다 ============ */
.lp .l-sys{padding:118px 0 0;}
.lp .l-sys h2{margin:22px 0 0;font-size:31px;line-height:1.34;letter-spacing:-.04em;
  font-weight:800;max-width:22ch;}
.lp .l-sys .l-slead{margin:18px 0 0;font-size:17px;line-height:1.82;color:var(--sub);max-width:44ch;}
.lp .l-sl{margin:34px 0 0;padding:0;list-style:none;}
.lp .l-sl li{position:relative;padding:16px 0 16px 30px;border-top:1px solid var(--line);
  font-size:16.5px;line-height:1.72;letter-spacing:-.02em;}
.lp .l-sl li:last-child{border-bottom:1px solid var(--line);}
.lp .l-sl li::before{content:'';position:absolute;left:6px;top:26px;width:5px;height:5px;
  border-radius:50%;background:var(--accent-line);}
.lp .l-sl li b{font-weight:750;}
.lp .l-sl li.l-lock{background:var(--note);border-radius:var(--r-md);padding-left:30px;
  border-top-color:var(--note-line);}
.lp .l-sl li.l-lock::before{background:var(--brand);}
.lp .l-sl li.l-lock + li{border-top-color:var(--line);}

/* ============ 7. 들은 말 ============
   구버전은 아홉 개를 가로로 흘리는 마퀴였다. 흐르는 글은 읽으려면 기다려야 하고
   멈출 수도 없었다(prefers-reduced-motion 대응도 없었다). 넷을 세우고 나머지는 눌러서 편다. */
.lp .l-heard{padding:118px 0 0;}
.lp .l-heard .l-grid{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.lp .l-q{background:var(--note);border:1px solid var(--note-line);border-radius:var(--r-lg);
  padding:24px 26px;}
.lp .l-q p{margin:0;font-size:16.5px;line-height:1.75;letter-spacing:-.02em;}
.lp .l-q .l-who{margin-top:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:13px;color:var(--sub);}
.lp .l-q .l-medal{background:var(--accent);color:#fff;border-radius:var(--r-pill);
  padding:3px 10px;font-size:11.5px;font-weight:700;}
.lp .l-heard .l-x{display:none;}
.lp .l-heard.l-open .l-x{display:block;}
.lp .l-more{margin-top:24px;}

/* ============ 8. 기록 (경력 · 성과) ============ */
.lp .l-rec{padding:118px 0 0;}
.lp .l-cred{position:relative;display:flex;align-items:flex-start;padding:30px 0 0;}
.lp .l-cred .l-t{width:132px;flex-shrink:0;text-align:right;padding:2px 30px 0 0;
  font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.02em;}
.lp .l-cred .l-b{padding-left:32px;flex:1;min-width:0;}
.lp .l-cred ul{margin:0;padding:0;list-style:none;}
.lp .l-cred li{padding:9px 0;font-size:16.5px;letter-spacing:-.02em;border-bottom:1px solid var(--line2);}
.lp .l-cred li:last-child{border-bottom:none;}
.lp .l-cred li b{display:inline-block;min-width:78px;font-weight:750;}
.lp .l-cred li.l-now::after{content:'현재';margin-left:10px;font-size:11.5px;font-weight:700;
  color:var(--brand);letter-spacing:.06em;vertical-align:1px;}

/* 공지는 이 페이지에 없다 (2026-08-13에 뺐다) — 재원생에게 자주 내보내는 글이라
   브랜드 페이지의 흐름을 끊는다. 학생은 마이페이지에서 본다. */

/* ============ 9. 상담 ============ */
.lp .l-act{margin-top:118px;background:var(--card);border-top:1px solid var(--line);
  padding:104px 0 112px;}
.lp .l-act .l-inner{display:grid;grid-template-columns:minmax(0,1fr) 396px;gap:60px;align-items:start;}
.lp .l-act h2{margin:22px 0 0;font-size:33px;line-height:1.32;letter-spacing:-.04em;
  font-weight:800;max-width:16ch;}

/* ---------- 리포트 PDF 묶음 (2026-09-01 · R-3) ----------
   🔴 **«그리는 자리»는 화면 밖에 두되 «보이게» 둔다.** `display:none`이면 폭도 높이도 0이라
     html2canvas가 빈 그림을 그린다. 그래서 왼쪽으로 멀리 밀어낸다.
   ⚠ 폭 703px은 **A4 본문 폭(210−12−12=186mm)을 96dpi로 옮긴 값**이다. 이 폭으로 그려야
     PDF에 넣을 때 늘리거나 줄이지 않아 글자가 안 뭉갠다. */

/* =================== 인쇄 — 월간 리포트 (2026-09-01 · R-2) ===================
   🔴 **나가는 것은 `#rp-doc` 하나다.** R-1에서 달 고르개(`.rp-bar`)와 쓰는 칸(`.rp-edit`)을
     일부러 문서 «밖»에 둔 것이 여기서 값을 한다 — 고를 것이 없다.

   🔴 **껍질을 벗기는 것이 절반이다.** 셸은 `.app{min-height:100vh}` · `.sd-screen{height:calc(100vh-92px)}` ·
     `.sd-doc{flex;min-height:0}`로 «한 화면»을 전제한다. 그대로 인쇄하면 **첫 장 뒤가 통째로 잘린다.**
     그래서 조상 넷의 높이·넘침·flex를 전부 풀어 놓는다.

   🔴 **`print-color-adjust:exact`가 없으면 막대 색이 날아간다.** 이 문서에서 색은 꾸밈이 아니라
     «함께 챙겨 주시면 좋은 부분»이라는 **뜻**이고, 범례가 그 색을 가리킨다 —
     색이 빠지면 범례가 없는 것을 가리키게 된다. 그래서 필수다.

   ⚠ **`:has()`로 «리포트가 떠 있을 때»만 걷어낸다.** 안 그러면 다른 화면에서 Ctrl+P를 눌렀을 때
     빈 종이가 나온다. 못 알아듣는 브라우저에서는 이 규칙만 통째로 버려지고 (덜 예쁠 뿐) 인쇄는 된다.
   ⚠ 자동화에서 `window.print()`를 부르지 말 것 — 대화상자가 세션을 막는다. 누르는 것은 사람이다. */
@media print{
  @page{ size:A4; margin:14mm 12mm; }

  /* ① 문서 말고는 아무것도 안 나간다. 겹쳐 뜬 것들(토스트·드로어·모달·사진 확대)은
       position:fixed라 자리를 안 먹으므로 이 한 줄로 전부 사라진다 — 하나씩 세어 둘 필요가 없다. */
  body:has(#rp-doc) *{ visibility:hidden !important; }
  body:has(#rp-doc) #rp-doc, body:has(#rp-doc) #rp-doc *{ visibility:visible !important; }

  /* ② 자리를 먹는 «흐름 속» 껍질은 visibility로는 안 된다 — 빈 칸이 그대로 남는다. 지운다.
       ⚠ `.sd-dh`(학생 이름 머리)도 지운다 — `.rp-h`가 이미 이름·학교·반을 적는다. 두 번 적힌다. */
  .app .topbar, .app .subnav, .app .sd-list, .app .sd-ctx, .app .sd-dh,
  .rp-bar, .rp-edit, .rp-wrap > .st-note, .sd-doc > .note.pin,
  .rpb-stage{ display:none !important; }

  /* ③ 껍질의 높이·넘침·flex를 푼다. 이것이 «둘째 장»을 만든다. */
  html, body{ background:#fff !important; height:auto !important; overflow:visible !important; }
  #app, .app, .app .body, .app .sd-screen, .app .sd-doc, .rp-wrap{
    display:block !important; height:auto !important; max-height:none !important;
    min-height:0 !important; overflow:visible !important;
    margin:0 !important; padding:0 !important; background:#fff !important; border:0 !important; }

  /* ④ 종이 위에서는 문서가 곧 지면이다 — 화면용 상자(테두리·모서리·620px)를 벗긴다. */
  .rp-doc{ max-width:none !important; width:auto !important;
    border:0 !important; border-radius:0 !important; padding:0 !important;
    background:#fff !important; }

  /* ⑤ 색은 뜻이다. 지우지 말 것 (위 주석). */
  #rp-doc, #rp-doc *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }

  /* ⑥ 줄과 표가 장 사이에서 반으로 갈리지 않게. 표는 길어지면 넘겨야 하므로 표 «자체»는 푼다. */
  .rp-m, .rp-tb tr, .rp-leg, .rp-say{ break-inside:avoid !important; page-break-inside:avoid !important; }
  .rp-tb{ break-inside:auto !important; page-break-inside:auto !important; }
  .rp-tb thead{ display:table-header-group; }   /* 넘어간 장에도 열 머리가 다시 선다 */
  .rp-h{ break-after:avoid !important; page-break-after:avoid !important; }
}
