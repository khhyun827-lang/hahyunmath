<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김하현수학연구소 | 고등수학 전문</title>
<meta name="description" content="기록하는 수학 학원. 출결·진도·오답·질문이 모두 남고, 틀린 문항은 쌍둥이 문항이 되어 다시 돌아옵니다.">
<meta property="og:title" content="김하현수학연구소">
<meta property="og:description" content="기록하는 수학 학원. 출결·진도·오답·질문이 모두 남습니다.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 구버전(Noto Sans KR·Serif 900)과 ds.css(Serif 600·Mono 500)가 쓰는 굵기를 한 요청에 합쳤다.
     이행이 끝나 구버전 화면이 사라지면 Noto Sans KR과 Serif 900은 빼면 된다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="ds.css">

<style>
/* ============================================================
   실서비스 셸 — «배치»만 둔다. 색·서체·반경·간격은 ds.css 토큰을 쓴다.
   목업은 1440×900 캔버스 안에서 절대배치라 .topbar/.subnav가 absolute이고
   .body가 top:52px로 떠 있다. 실제 앱은 «스크롤하는 문서»라 그대로 쓸 수 없다.
   여기서 바꾸는 것은 position 뿐이다.
   ============================================================ */
.app{background:var(--paper);color:var(--ink);min-height:100vh;
  font-family:'Pretendard',-apple-system,sans-serif;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
.app .topbar{position:sticky;top:0;}
.app .subnav{position:sticky;top:52px;}
/* .body는 ds.css에서 absolute·top:52px다. 스크롤 문서에서는 그냥 흐르게 둔다. */
.app .body{position:static;padding:20px;}
.app .topbar .bm{display:flex;align-items:center;gap:9px;}
.app .topbar .bm img{height:22px;width:auto;display:block;}
.app .topbar nav a{cursor:pointer;}
.app .subnav a{cursor:pointer;}

/* ---------- 폰 세로에서 강사·조교 셸 (2026-08-24) ----------
   강사 화면은 처음부터 데스크톱 전용으로 지었다. 폰(410px)에서 재 보니 **13개 탭이
   똑같이 223px씩 넘쳤는데, 원인은 내용이 아니라 상단바 하나였다** —
   브랜드 + 메뉴 7개 + (벨·이름·로그아웃)이 줄바꿈 없는 한 줄이라 **633px**가 필요했다.
   그래서 「소통·설정」과 오른쪽 블록이 화면 밖으로 잘리고 페이지가 통째로 옆으로 밀렸다.

   ⚠ **상단바 높이는 절대 늘리지 않는다.** `.subnav`가 `top:52px`에 붙어 있고
     화면들이 `height:calc(100vh - 92px)` · `- 134px`로 그 숫자를 박아 쓰고 있다.
     두 줄로 만들면 그 계산이 전부 어긋난다 → **높이는 두고 «안에서» 접는다.**
   ⚠ **`.app.sap`(학생 앱)은 건드리지 않는다.** 학생 쪽은 이미 폰 우선으로 풀려 있다
     (`--sap-w` 620/680). 그래서 선택자를 `.app:not(.sap)`로 좁혔다.
   ⚠ **`overflow-x:hidden`으로 덮지 않았다.** 그건 넘침을 «안 보이게» 할 뿐이라
     잘린 메뉴에 영영 손이 닿지 않는다. 넘치는 것은 그 자리에서 «밀 수 있게» 만든다. */
@media (max-width:560px){
  /* 브랜드 글자를 접는다 — 앱 «안»에 이미 들어와 있는 사람에게 학원 이름은 길잡이가 아니다.
     여기서 100px 가까이 나오고, 그게 메뉴가 숨 쉴 자리가 된다. */
  .app:not(.sap) .topbar .bm{display:none;}
  .app:not(.sap) .topbar{padding:0 12px;gap:8px;}

  /* 메뉴는 «가로로 미는» 띠가 된다. 일곱 개를 다 보여주려 줄이면 글자가 못 읽게 된다. */
  .app:not(.sap) .topbar nav{margin-left:0;flex:1;min-width:0;
    overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;}
  .app:not(.sap) .topbar nav::-webkit-scrollbar{display:none;}
  .app:not(.sap) .topbar nav a{flex:none;white-space:nowrap;padding:6px 10px;}

  /* 오른쪽 블록에서 «이름»만 접는다. 벨과 로그아웃은 누를 것이라 남긴다 —
     누구로 있는지는 화면 안에서도 알 수 있지만, 벨은 여기 말고 다른 문이 없다. */
  .app:not(.sap) .topbar .right{gap:6px;flex:none;}
  .app:not(.sap) .topbar .right .who{display:none;}
  /* 조교의 .as-who(「조교 · 담당 ○○반」)는 접지 않는다 — 코드에 «자기가 누구로 있는지가
     늘 보여야 한다»고 못박아 둔 자리다. 줄어들 수 있게만 해 준다. */
  .app:not(.sap) .topbar .as-who{min-width:0;overflow:hidden;}
  .app:not(.sap) .topbar .as-who .as-cls{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* 서브탭도 같은 어법으로 민다 (소통은 다섯 갈래라 410px에 안 들어간다). */
  .app:not(.sap) .subnav{padding:0 12px;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
  .app:not(.sap) .subnav::-webkit-scrollbar{display:none;}
  .app:not(.sap) .subnav a{flex:none;white-space:nowrap;padding:0 10px;}

  /* 본문 여백은 20 → 13. 폰에서 좌우 40px는 표 한 열만큼이다. */
  .app:not(.sap) .body{padding:13px;}

  /* 같은 «두 쪽짜리 화면» 식구에 건다. 전부 `display:flex` + `height:calc(100vh - …)` 이고
     안에 제 스크롤러를 갖고 있다. 공지(532px) · 질의응답(509) · 시험지(453)가 여기 걸렸고,
     나머지는 지금도 안 넘치므로 이 규칙이 아무것도 바꾸지 않는다.
     ⚠ **`overflow-y:hidden`을 같이 적는다.** 한 축만 `auto`로 두면 다른 축의 `visible`이
       «auto»로 계산돼 세로 스크롤바가 한 겹 더 생긴다. 안쪽 스크롤러가 이미 있으므로 막는다.
     ⚠ **`.cls-screen`(수업)은 여기서 뺐다** — 아래에서 «위아래로 푸는» 쪽으로 제대로 고쳤다.
       거기서는 `height:auto`가 되므로 `overflow-y:hidden`이 남아 있으면 본문이 잘린다.
     ⚠ **`.chub-screen`(반 관리)도 2026-08-25에 뺐다** — 같은 이유다. 아래에서 푼다.
     ⚠ **`.ex-screen`(설정·시험지·창고)도 2026-08-26에 뺐다** — 같은 이유다(M-2d). */
  .app:not(.sap) .rv-screen,
  .app:not(.sap) .qn-screen,
  .app:not(.sap) .nt-screen,
  .app:not(.sap) .co-screen{overflow-x:auto;overflow-y:hidden;}

  /* ---------- 반 관리를 폰용으로 푼다 (2026-08-25 · M-2c) ----------
     M-2 노트에 「반 관리는 폰에서 원래 짜부라져 있다」고 적어 둔 화면이다.
     실제로 재 보니 **어느 탭이든 본문이 152px밖에 없었다** — 반 목록이 250px를 먹고
     남은 것을 본문이 갖는 구조라, 반 이름 「명덕여고 2차시」가 **한 글자씩 세로로 쌓였다.**
     과제 격자를 여기 넣은 이상 그대로 둘 수 없다 — 152px에서는 새 화면이 죽는다.

     **수업(M-2a)과 같은 어법으로 위아래로 푼다** — 반 목록이 위, 본문이 아래.
     ⚠ **`height:auto`가 되므로 위의 «가둠» 목록에서 `.chub-screen`을 뺐다.**
       빼지 않으면 `overflow-y:hidden`이 남아 본문이 잘린다 (M-1이 남긴 함정 그대로다).
     ⚠ 반 목록은 **높이를 묶어 둔다** — 반이 열 개면 목록만으로 화면이 차서
       정작 보러 온 본문이 스크롤 두 번 아래로 밀려난다. */
  .app:not(.sap) .chub-screen{display:block;height:auto;overflow:visible;}
  .app:not(.sap) .chub-side{width:auto;padding-right:0;border-right:0;
    border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px;}
  .app:not(.sap) .chub-lbody{max-height:196px;}
  .app:not(.sap) .chub-main{padding-left:0;}
  /* 반 이름과 오른쪽 버튼 묶음이 한 줄에 안 들어간다. 이름을 온전히 읽는 쪽을 택한다. */
  .app:not(.sap) .chub-mh{flex-wrap:wrap;}
  .app:not(.sap) .chub-mh > .r{width:100%;flex-wrap:wrap;}
  .app:not(.sap) .chub-body{overflow:visible;margin-top:14px;}

  /* ---------- 설정·시험지·창고를 폰용으로 푼다 (2026-08-26 · M-2d) ----------
     셋이 `.ex-screen` 한 골격을 나눠 쓴다 — 설정(갈래 목록) · 시험지(시험지 목록) ·
     창고(단원 목록). 왼쪽 칸이 262px를 먹고 남은 것을 본문이 갖는 구조라
     **폰에서 본문이 122px밖에 없었다** — M-2c 전의 반 관리와 같은 병이다.
     🔴 **08-26에 급해졌다** — 계정 관리(비밀번호·정보·삭제)가 설정으로 옮겨 왔다.
       그전까지 설정은 «가끔 여는 곳»이라 미뤄 둘 수 있었지만, 이제 폰에서 못 쓰면
       **폰으로는 비밀번호를 못 바꾼다.**

     **반 관리(M-2c)와 같은 어법으로 위아래로 푼다** — 왼쪽 칸이 위, 본문이 아래.
     ⚠ **`height:auto`가 되므로 위의 «가둠» 목록에서 `.ex-screen`을 뺐다.**
       빼지 않으면 `overflow-y:hidden`이 남아 본문이 잘린다 (M-1이 남긴 함정 그대로다).
     ⚠ **`.ex-nosub`도 같이 풀어야 한다** — 설정이 그것을 쓴다. `.ex-screen`만 풀면
       뒤에 오는 `.ex-nosub{height:calc(...)}`가 높이를 다시 못 박는다.
     ⚠ 목록은 **높이를 묶는다** — 시험지·단원은 개수가 정해져 있지 않다.
       안 묶으면 목록만으로 화면이 차서 정작 보러 온 본문이 스크롤 밖으로 밀린다.
       (반 목록 196px과 같은 판단. 여기는 항목이 더 촘촘해 190px로 뒀다) */
  .app:not(.sap) .ex-screen,
  .app:not(.sap) .ex-screen.ex-nosub{display:block;height:auto;overflow:visible;}
  .app:not(.sap) .ex-list{width:auto;padding-right:0;margin-right:0;border-right:0;
    border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px;}
  .app:not(.sap) .ex-lbody{max-height:190px;margin-right:0;padding-right:0;}
  .app:not(.sap) .ex-body{overflow:visible;margin-top:14px;}

  /* ---------- KPI도 폰에서 접는다 (2026-08-30 · C-2) ----------
     🔴 **다섯이 한 줄에 서면 폰에서 칸이 73px이 된다** — 「오답 올린 학생」이 세 줄로 접히고
       「본 학생 4명 · 2개 반」은 넉 줄이 된다. 숫자를 보러 온 자리인데 라벨이 자리를 다 먹는다.
     ⚠ 넘치는 대신 **아래로 내린다** — 가로 스크롤로 두면 뒤쪽 KPI가 있는지조차 모른다.
     `min-width:46%`라 한 줄에 둘씩 서고, 마지막 하나는 남는 폭을 다 쓴다.
     ⚠ `.kpi`의 오른쪽 금은 «한 줄일 때»의 것이라 접히면 아래쪽 금이 필요하다. */
  .app:not(.sap) .kpis{flex-wrap:wrap;}
  .app:not(.sap) .kpi{min-width:46%;border-bottom:1px solid var(--line2);}
  .app:not(.sap) .kpi .k{white-space:normal;}

  /* 문항별 오답률 한 줄 — 고정폭 다섯이 430px을 요구해서 폰에서 50px이 넘쳤다.
     ⚠ **전에는 `.ex-screen`의 `overflow-x:auto`가 이걸 가리고 있었다.** 가둠을 풀었으니
       여기서 제대로 접는다 — M-1이 「옆으로 미는 임시 처방」을 걷어낼 때마다 나오는 일이다.
     단원 이름과 막대가 남는 자리를 나눠 갖게 하고, 나머지는 제 폭만 쓴다.
     `flex-wrap`은 안전줄이다 — 단원 이름이 길어도 넘치는 대신 아래로 내려간다. */
  .app:not(.sap) .ex-q{flex-wrap:wrap;gap:5px 10px;}
  .app:not(.sap) .ex-q .unit{width:auto;flex:1 1 80px;min-width:0;}
  .app:not(.sap) .ex-q .track{min-width:52px;}
  .app:not(.sap) .ex-q .tw{width:auto;}

  /* ---------- 목록 한 줄도 폰에서 접는다 (2026-08-25 · P-3) ----------
     `.st-row`는 「내용 … 오른쪽 버튼들」 한 줄이라 폰에서 오른쪽이 통째로 잘렸다.
     조교 목록의 「담당 반 변경 · 비밀번호 재설정 · 삭제」가 **화면 밖 522~569px**에 있었다.
     `.st-h`(H-5)와 같은 어법으로 버튼 줄을 아래로 내린다. */
  .app:not(.sap) .st-row{flex-wrap:wrap;gap:9px 12px;}
  .app:not(.sap) .st-row > .v{width:100%;justify-content:flex-end;flex-wrap:wrap;}

  /* ---------- 구역 머리를 폰에서 접는다 (2026-08-25 · H-5) ----------
     `.st-h`는 「제목 · 숫자 … 오른쪽 버튼들」 한 줄이라 폰에서 오른쪽이 잘렸다.
     🔴 **「과제 등록」 버튼이 폰에서 «없는 기능»이었다** — 화면 밖 505px에 놓여 있었다.
     신호 탭의 hover 버튼과 같은 종류의 사고다(M-2b). 아래로 접어 준다. */
  .app:not(.sap) .st-h{flex-wrap:wrap;}
  .app:not(.sap) .st-h .r{margin-left:0;width:100%;justify-content:flex-end;}

  /* ---------- 수업 «만» 폰용으로 제대로 푼다 (2026-08-24 · M-2a) ----------
     사용자가 「모바일로 이용한다면 수업 탭을 그때그때 쓸 가능성이 제일 높다」고 했다.
     그래서 여기만 «옆으로 미는» 임시 처방을 걷어내고 **위아래로 푼다.**

     ⚠ **순서를 바꾼다 — 이게 이 화면의 핵심이다.**
       데스크톱은 왼쪽에 「오늘의 수업 + 오늘 남은 일」, 오른쪽에 작업 칸이다.
       그대로 세로로 쌓으면 **출결을 찍으러 올 때마다 「오늘 남은 일」 200px를 지나쳐야 한다.**
       수업 중에 폰을 꺼내는 이유는 출결이지 «남은 일 훑기»가 아니다.
       → **수업 고르기(1) → 작업 칸(2) → 오늘 남은 일(3)**
     ⚠ **`display:contents`로 aside를 «녹인다».** 그래야 그 아이들이 `.cls-screen`의
       직접 항목이 되어 `order`가 먹는다. 부모를 넘나드는 재배치는 이 방법뿐이다.
       (aside의 width:270px · border-right · overflow-y도 같이 사라진다 — 폰에서는 다 방해물이다) */
  .app:not(.sap) .cls-screen{flex-direction:column;height:auto;}
  .app:not(.sap) .cls-side{display:contents;}
  .app:not(.sap) .cls-main{order:2;padding-left:0;margin-top:18px;}

  /* aside 끝의 64px 여백은 데스크톱에서 «왼쪽 칸 바닥»을 띄우려던 것이다.
     세로로 쌓으면 수업 목록과 작업 칸 사이에 빈 구멍이 된다. */
  .app:not(.sap) .cls-side > .rst-pad{display:none;}

  /* ⚠ **안쪽 스크롤러를 푼다.** 데스크톱은 «머리말 고정 + 본문만 스크롤»이지만,
       폰에서 화면 안에 또 스크롤 영역이 있으면 손가락이 어느 쪽을 미는지 알 수 없다.
       페이지 하나만 스크롤하게 둔다. */
  .app:not(.sap) .cls-body{overflow:visible;min-height:0;margin-top:14px;}

  /* 학생 타일은 한 줄에 하나. 1180px에서 이미 3→2로 줄여 뒀고 폰은 1이다. */
  .app:not(.sap) .cls-tiles{grid-template-columns:1fr;}

  /* 단계 막대(지난 수업·출결·진도·과제·메모)는 `.s{flex:1}`이라 다섯이 폭을 나눠 갖는다.
     384px에서는 한 칸이 77px이 되어 «출 결»처럼 글자가 접힌다.
     → 나눠 갖기를 그만두고 **가로로 미는 띠**로 바꾼다. 상단바와 같은 어법이다. */
  .app:not(.sap) .steps{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;}
  .app:not(.sap) .steps::-webkit-scrollbar{display:none;}
  .app:not(.sap) .steps .s{flex:none;white-space:nowrap;}

  /* ⚠ `.actbar`는 `position:fixed; bottom:0` 이고 폰에서는 줄바꿈까지 해서 더 두꺼워진다.
       화면이 이제 «페이지 스크롤»이므로 마지막 학생 타일이 그 아래 깔린다.
       → 바닥에 그만큼 자리를 비워 둔다. */
  .app:not(.sap) .cls-screen{padding-bottom:96px;}

  /* ---------- 신호 — 한 줄을 «카드»로 접는다 (2026-08-24 · M-2b) ----------
     `.sig-row`는 네 칸짜리 가로줄인데 셋이 `flex-shrink:0`이다 —
     who 198 + num 104 + act 250 + 간격 39 = **591px를 요구한다.** 폭은 369px뿐이라
     남은 몫을 다 가져가는 `.sig-mid`가 **폭 0**이 되고, 근거 문장이 세로로 서서
     **학생 한 명이 763px**가 됐다. 그래서 화면에 학생이 한 명밖에 안 들어왔다.
     → 가로로 욱여넣기를 그만두고 **세 줄짜리 카드**로 접는다.
        ① 이름·학교 + 점수   ② 배지 + 근거 문장   ③ 조치 버튼
     DOM 순서가 who → mid → num → act 라 num을 첫 줄로 올리려면 `order`가 필요하다.

     🔴 **`.sig-act{opacity:0}`은 폰에서 «기능이 없는 것»과 같다.**
        조치 버튼은 `:hover`에서만 나타난다. 폰에는 hover가 없으니
        위험(`.now`)·해제(`.off`) 등급을 뺀 **주의·양호 학생에게는 손이 닿지 않았다.**
        연락·출결·오답·7일 해제가 통째로 막혀 있었던 것이다 → 폰에서는 늘 보인다.
        ⚠ 데스크톱의 «hover에서만 뜬다»는 의도된 절제다. 거기는 건드리지 않는다. */
  .app:not(.sap) .sig-row{flex-wrap:wrap;align-items:flex-start;gap:9px 10px;padding:14px 2px;}
  .app:not(.sap) .sig-who{width:auto;flex:1 1 auto;min-width:0;order:0;}
  .app:not(.sap) .sig-num{width:auto;flex:none;order:1;}
  .app:not(.sap) .sig-num .dots{margin-top:4px;}
  .app:not(.sap) .sig-mid{flex:1 1 100%;order:2;}
  .app:not(.sap) .sig-act{width:100%;flex:1 1 100%;order:3;
    justify-content:flex-start;opacity:1;}

  /* 등급 머리(「위험 1 · 즉시 연락 권장」 + 「무거운 신호 2개 이상」)도 한 줄에 안 들어간다.
     `.sig-cond`는 `margin-left:auto`로 오른쪽 끝에 붙는 조건 설명이라 접히면 그만이다. */
  .app:not(.sap) .sig-ghead{flex-wrap:wrap;gap:4px 9px;}
}

/* ---------- 명단 (design-v1/01-roster) ----------
   목업은 .main을 absolute로 잡고 액션바를 캔버스 바닥(bottom:0)에 붙인다.
   실서비스는 스크롤하는 문서라 «흐르는 표 + 뷰포트에 고정된 액션바»가 된다.
   ds.css의 클래스 이름은 여기서 다시 정의하지 않는다 — 전부 rst- 접두사다.
   (.actbar의 position만 예외다. 위 규칙대로 position만 바꾼다.) */
.app .rst-hrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.app .rst-views{display:flex;align-items:center;gap:7px;margin-top:16px;flex-wrap:wrap;}
.app .rst-fbar{display:flex;align-items:center;gap:8px;margin-top:13px;padding-bottom:13px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;}
.app .rst-fbar .field{width:262px;}
.app .rst-fbar .field input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:inherit;font-size:12.5px;color:var(--ink);}
/* 설정 > 학생의 검색 줄 (2026-08-26).
   ⚠ **바로 위 `.rst-fbar .field input` 규칙은 «명단» 전용이다** — 설정은 `.ex-screen` 안이라
     안 걸린다. 안 세우면 input이 브라우저 기본 테두리(2px·흰 바탕)를 그대로 써서
     둥근 `.field` 안에 «상자 속 상자»가 그려진다. 실제로 그렇게 나왔다.
   ⚠ 폭은 `.rst-fbar`의 262px 고정과 달리 늘어나게 둔다 — 설정 본문이 명단보다 넓다. */
.app .st-fbar .field{flex:1;min-width:200px;}
.app .st-fbar .field input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:inherit;font-size:12.5px;color:var(--ink);}
/* 설정 > 학생 — 한 줄에 열을 맞춘 계정 목록 (2026-08-26 · W-2).
   🔴 **폭은 «고정»이 아니라 «기준»이다** — `flex:0 1 <폭>`이라 좁아지면 줄어든다.
     `flex-shrink:0`으로 못 박으면 폰에서 줄이 통째로 밀려 나간다(M-1이 세 번 잡은 그 사고).
   ⚠ 이름만 `min-width`를 준다 — 다른 칸은 잘려도 읽히지만 이름이 잘리면 누구인지 모른다. */
.app .stu-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;width:100%;}
/* ⚠ **글꼴을 여기서 못 박는다** — 예전에는 `.st-row .t > b`가 먹였는데, 이름이
     `.stu-line` 안으로 한 단계 들어가면서 그 규칙(직계 자식 선택자)이 더는 안 걸린다.
     안 적으면 이름만 조용히 작아진다. */
.app .stu-line .nm{flex:0 1 96px;min-width:64px;font-size:13px;font-weight:600;}
.app .stu-line .id{flex:0 1 78px;font-weight:400;font-size:12px;color:var(--sub);}
.app .stu-line .sch{flex:0 1 148px;font-size:12.5px;color:var(--sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .stu-line .cls{flex:0 1 116px;font-size:12.5px;color:var(--sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 퇴원 줄은 «있지만 지금 사람은 아니다». 흐리게 두되 읽히기는 해야 한다 —
   너무 흐리면 되돌리러 온 사람이 이름을 못 읽는다. */
.app .stu-row.gone .nm, .app .stu-row.gone .id{color:var(--dim);}
/* 재원과 퇴원 사이의 금. 「퇴원 n명」을 선 위에 얹어 어디부터인지 한눈에 말한다. */
.app .stu-sep{display:flex;align-items:center;gap:10px;margin:14px 0 4px;
  font-size:11.5px;color:var(--dim);}
.app .stu-sep::after{content:'';flex:1;height:1px;background:var(--line);}
.app .stu-sep span{flex-shrink:0;}

/* 학적 상자 — 퇴원과 삭제가 나란히 사는 곳 (2026-08-26 · W-1).
   ⚠ **테두리로 «따로 떼어» 둔다.** 위의 이름·비밀번호와 같은 평면에 두면
     저장하러 왔다가 삭제를 누르는 자리가 된다. */
.app .stu-life{margin-top:16px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--note);}
.app .stu-life-now{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;}
/* 삭제만 한 번 더 가른다 — 이 상자 안에서도 «되돌릴 수 없는 것»은 이것뿐이다. */
.app .stu-life-danger{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  margin-top:13px;padding-top:12px;border-top:1px solid var(--line);}
.app .stu-life-danger span{font-size:11.5px;color:var(--dim);line-height:1.7;flex:1;min-width:180px;}
/* 검색 어법 한 줄 (2026-09-01 · C-14). ⚠ `.rst-cnt b`는 JetBrains Mono라 한글이 두부가 된다 —
   여기 `<b>`는 제 글꼴을 따로 세운다. */
.app .rst-tip{margin-left:auto;font-size:11.5px;color:var(--dim);}
.app .rst-tip b{font-family:inherit;font-weight:700;color:var(--sub);}
.app .rst-tip + .rst-cnt{margin-left:14px;}
/* ⚠ 폰에서는 감춘다 — 거르개 줄이 이미 석 줄로 접히는 폭이고, 이 문장이 그 사이에 끼면
   잘린 채로 남는다(실제로 426px에서 그렇게 나왔다). 있으면 좋은 안내지 꼭 있어야 할 것은 아니다. */
@media (max-width:760px){ .app .rst-tip{display:none;} }
.app .rst-cnt{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap;}
.app .rst-cnt b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600;}
.app .rst-selwrap{padding-right:6px;}
.app .rst-sel{border:0;background:transparent;outline:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink);}

/* 머리말은 고정하고 표«만» 스크롤한다 — 목업의 .main / .tablewrap과 같은 구조다.
   문서 스크롤에 맡기고 th를 top:52px로 붙이는 방법은 쓸 수 없다.
   가로 스크롤 때문에 .rst-wrap이 overflow:auto가 되는 순간 그 안이 새 스크롤포트가 되어
   sticky 기준이 뷰포트가 아니라 이 상자로 바뀌고, 헤더가 52px 내려와 첫 행을 덮는다.
   높이 92px = 상단바 52 + .body 상하 패딩 20+20. (서브탭 있는 화면으로 옮길 땐 +42) */
/* ⚠ 스크롤 상자는 반드시 position:relative여야 한다.
   KaTeX가 수식마다 position:absolute인 .katex-mathml을 넣는데, 조상 중에 위치 지정된 것이 없으면
   그 요소의 기준이 «문서»가 되어 overflow:auto가 잡아 주지 못한다.
   실제로 시험지 화면에서 문서가 3736px 세로로 늘어났다 (수식이 상자 밖에 «있는» 것으로 계산된다).
   세로로 스크롤하는 상자를 새로 만들 때마다 이 줄을 같이 넣을 것. */
.app .rst-wrap, .app .sig-list, .app .cls-body, .app .chub-body, .app .chub-lbody,
.app .rv-body, .app .rv-lbody, .app .sd-tl, .app .sd-lbody, .app .sd-ctx,
.app .co-body, .app .co-sbody, .app .ch-lbody, .app .ch-win,
.app .ex-body, .app .ex-lbody, .app .vd-main{position:relative;}

.app .rst-screen{display:flex;flex-direction:column;height:calc(100vh - 92px);}
.app .rst-head{flex-shrink:0;}
.app .rst-wrap{flex:1;min-height:0;overflow:auto;margin-top:2px;}
.app .rst-wrap table.grid thead th{position:sticky;top:0;z-index:2;}
/* 행 높이는 40px로 고정한다. 한 행이라도 두 줄이 되면 표의 리듬이 깨진다.
   그래서 table-layout:fixed로 열 너비를 못 박고, 넘치는 글자는 …로 자른다.
   1440 캔버스를 전제로 그린 표다. 그보다 좁은 화면에서는 표«만» 가로로 스크롤한다
   (문서 전체가 밀리면 상단바까지 따라 움직여서 어디에 있는지 알 수 없게 된다). */
.app .rst-wrap table.grid{table-layout:fixed;min-width:1464px;}
/* 반을 고르면 「반」·「반 진도」 두 열이 빠진다. 그만큼 최소 너비도 줄여야
   좁은 화면에서 괜히 가로 스크롤이 남는다. */
.app .rst-wrap table.grid.narrow{min-width:1260px;}
.app .rst-wrap td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app .rst-wrap .cb{cursor:pointer;}

.app .rst-sig{display:flex;align-items:center;gap:6px;min-width:0;}
.app .rst-sig .why{flex:1;min-width:0;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;}
.app .rst-act{display:flex;gap:5px;justify-content:flex-end;opacity:0;transition:opacity var(--t);}
.app .rst-wrap tbody tr:hover .rst-act,
.app .rst-act:focus-within{opacity:1;}

/* ---------- 신호 (design-v1/05-signals) ----------
   등급으로 묶은 한 줄기 세로 목록. 명단의 .rst-screen 골격을 그대로 쓴다. */
.app .sig-list{flex:1;min-height:0;overflow:auto;}
/* 등급 머리 — 연대기의 날짜 자리와 같은 역할이라 스크롤에 붙여 둔다 */
.app .sig-ghead{display:flex;align-items:center;gap:9px;padding:22px 2px 9px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;}
.app .sig-ghead b{font-size:13px;font-weight:700;}
.app .sig-n{font-size:12px;font-weight:600;color:var(--dim);}
.app .sig-do{font-size:12px;color:var(--sub);}
.app .sig-cond{margin-left:auto;font-size:11px;color:var(--dim);}

/* 한 줄 = 한 학생. 근거 문장이 주인공이다 — 뱃지만 있으면 «위험하다»만 알고 아무 것도 못 한다. */
.app .sig-row{display:flex;align-items:center;gap:13px;padding:12px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .sig-row:hover{background:var(--hover);}
.app .sig-row.off{opacity:.5;}
.app .sig-who{width:198px;flex-shrink:0;display:flex;align-items:center;gap:10px;cursor:pointer;}
.app .sig-t{min-width:0;}
.app .sig-t b{display:block;font-size:13.5px;font-weight:600;}
.app .sig-t span{display:block;font-size:11.5px;color:var(--dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .sig-mid{flex:1;min-width:0;cursor:pointer;}
.app .sig-rules{display:flex;gap:5px;flex-wrap:wrap;}
.app .sig-why{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.55;}
.app .sig-why b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);}
.app .sig-num{width:104px;flex-shrink:0;text-align:right;}
.app .sig-sc{font-size:15px;font-weight:600;letter-spacing:-.02em;}
.app .sig-num .dots{justify-content:flex-end;margin-top:6px;}
.app .sig-act{width:250px;flex-shrink:0;display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;
  opacity:0;transition:opacity var(--t);}
.app .sig-row:hover .sig-act,
.app .sig-act:focus-within{opacity:1;}
/* 위험은 미루면 안 된다. 이 등급만 조치 버튼을 상시 노출한다 —
   장식이 아니라 등급 차이를 «행동»으로 드러내는 유일한 지점이다. */
.app .sig-row.now .sig-act,
.app .sig-row.off .sig-act{opacity:1;}

/* ---------- 수업 (design-v1/02-class) ----------
   목업은 좌측 사이드바를 캔버스에 absolute로 붙였다. 실서비스는 그냥 두 칸 플렉스다.
   ds.css의 .steps / .tile / .seg / .actbar 는 그대로 쓴다 — 여기서 다시 정의하지 않는다. */
.app .cls-screen{display:flex;height:calc(100vh - 92px);}
.app .cls-side{width:270px;flex-shrink:0;padding-right:18px;border-right:1px solid var(--line);
  overflow-y:auto;}
.app .cls-main{flex:1;min-width:0;padding-left:24px;display:flex;flex-direction:column;}
.app .cls-mh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;flex-shrink:0;}
.app .cls-nav{display:flex;align-items:center;gap:8px;}
.app .cls-day{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
  white-space:nowrap;}
/* 🔵 **날짜 고르개가 왼쪽 칸 맨 위에 산다** (2026-09-01 · C-18 · 사용자가 시켰다).
   270px 안이라 「◀ 2026-09-01 화 ▶ 오늘」이 한 줄에 빠듯하다 — 접히게 두고,
   날짜가 가운데에서 남는 자리를 차지하게 한다. 아래 수업 목록과 한 덩이로 읽혀야 하므로
   금(border-bottom)으로 «언제»와 «어느 반»을 가른다. */
.app .cls-side > .cls-nav{padding-bottom:13px;margin-bottom:2px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);}
.app .cls-side > .cls-nav .cls-day{flex:1;min-width:0;text-align:center;font-size:13.5px;}
.app .cls-side > .cls-nav .btn.sm{margin-left:auto;}

/* 오늘의 수업 — 시간이 1차 축이다. 반을 고르는 것이 아니라 «지금 하는 수업»을 고른다. */
.app .cls-sess{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 15px;margin-bottom:9px;position:relative;cursor:pointer;
  transition:border-color var(--t),background var(--t);}
.app .cls-sess:hover{background:var(--hover);}
.app .cls-sess.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(63,53,55,.1);}
.app .cls-sess .t{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);font-weight:600;}
.app .cls-sess .n{font-size:14px;font-weight:700;margin-top:5px;letter-spacing:-.02em;}
.app .cls-sess .m{font-size:11.5px;color:var(--sub);margin-top:5px;}
.app .cls-sess .st{position:absolute;right:13px;top:13px;}


/* 단계 본문«만» 스크롤한다. 머리말·단계 막대는 늘 보여야 어디까지 했는지 안다. */
.app .cls-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* align-items:start — 사유 칸이 붙어 커진 타일에 같은 행의 멀쩡한 타일까지 끌려가지 않게 한다.
   높이가 들쭉날쭉해지지만, 그 차이가 곧 «여기 손볼 게 남았다»는 신호라 오히려 읽기 쉽다. */
.app .cls-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  align-content:start;align-items:start;}
@media (max-width:1180px){ .app .cls-tiles{grid-template-columns:repeat(2,1fr);} }
/* 사유·보충영상 칸이 붙는 타일은 세로로 자란다. ds.css의 .tile은 64px 고정이라 여기서 푼다. */
.app .cls-tiles .tile{height:auto;min-height:64px;flex-wrap:wrap;padding:11px 13px;}
.app .cls-tiles .tile .seg{margin-left:auto;}
.app .cls-sub{flex:0 0 100%;display:flex;gap:6px;margin-top:9px;}
.app .cls-sub input{flex:1;min-width:0;height:30px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--paper);padding:0 9px;
  font-family:inherit;font-size:12px;color:var(--ink);outline:none;}
.app .cls-sub input:focus{border-color:var(--accent-line);}

/* ---------- 수업에서 «한 번 눌러 정하는» 칸들 (2026-09-01 · C-19) ----------
   🔵 사용자의 말 — 「수업하면서 빠르게 체크하고 입력하고 넘어가야하는 것들이라 복잡하지
     않았으면 좋겠고 … 출결쪽처럼 학생별로 큼직하게 직관적이게 선택하면서 갈 수 있으면 좋겠어」.
   그래서 과제 검사도 출결과 같은 `.seg`를 쓴다. 다만 글자가 「제출·보완 필요·미제출」이라
   34px 고정으로는 안 들어간다 — 이 갈래만 폭을 푼다. */
.app .seg.wide button{width:auto;min-width:44px;padding:0 11px;font-size:12.5px;font-weight:600;}
/* 점수 칸 — 맞은 개수를 치면 옆에서 환산이 따라 움직인다(sessionScoreEcho). */
.app .cls-score{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.app .cls-score input{width:66px;height:36px;text-align:center;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--ink);
  outline:none;transition:border-color var(--t);}
.app .cls-score input:focus{border-color:var(--accent);}
.app .cls-score s{text-decoration:none;font-size:11.5px;color:var(--dim);white-space:nowrap;
  font-family:'JetBrains Mono',monospace;}
.app .cls-score s.over{color:var(--no);font-weight:700;}
/* 반 › 상담의 지난 기록 한 덩이 (2026-09-01 · C-22). */
.app .cs-item{padding:11px 0;border-top:1px solid var(--line2);}
.app .cs-item .h{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.app .cs-item .h b{font-size:12.5px;font-weight:600;}
.app .cs-item .tx{font-size:12.5px;color:var(--sub);line-height:1.8;white-space:pre-wrap;}
/* ⚠ `.sg-tot`의 폭은 `.app .sg .sg-tot`에 걸려 있어 «성적 격자 안»에서만 선다.
   수업 화면에서 그대로 쓰면 칸이 남는 자리를 통째로 먹는다 — 실제로 150px까지 늘어났다. */
.app .cls-body .sg-tot{width:56px;height:26px;padding:0 6px;text-align:center;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);
  color:var(--ink);font-size:12px;outline:none;}
.app .cls-body .sg-tot:focus{border-color:var(--accent);}

/* ---------- 수업의 «적는 카드» (2026-09-01 · C-18) ----------
   🔵 사용자가 「이 수업 메뉴의 메인 디자인은 출결 부분인 것 같은데 이와 비슷한 형태로」라고
     짚었다. 그래서 과제·시험 입력도 **출결과 같은 .tile** 위에 세운다.
     예전에는 .cls-hw 카드 안에 .cls-form을 구겨 넣어 이 화면만 다른 결이었다.
   ⚠ .tile은 display:flex + align-items:center라 폼이 가로로 늘어선다 — 세로로 푼다. */
.app .cls-new{display:block;padding:15px 16px 13px;}
.app .cls-new-row{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:11px;}
.app .cls-new-row:last-of-type{margin-bottom:0;}
.app .cls-new-row label{display:flex;flex-direction:column;gap:5px;min-width:150px;}
.app .cls-new-row label.wide{flex:1;min-width:220px;}
.app .cls-new-row label span{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.02em;}
.app .cls-new-row input,.app .cls-new-row textarea{
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:0 11px;height:36px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;
  transition:border-color var(--t);}
.app .cls-new-row textarea{height:auto;padding:9px 11px;line-height:1.7;resize:vertical;}
.app .cls-new-row input:focus,.app .cls-new-row textarea:focus{border-color:var(--accent);}
.app .cls-new-note{margin:11px 0 0;font-size:11.5px;color:var(--dim);line-height:1.8;}
.app .cls-new-note b{font-weight:700;color:var(--sub);}
/* ⚠ 적는 카드는 화면 끝까지 늘리지 않는다 — 1100px짜리 입력칸은 «이만큼 적으라»로 읽힌다.
   눈이 한 줄을 훑을 수 있는 만큼이면 된다(출결의 «적는 칸»과 같은 판단). */
.app .cls-new{max-width:900px;}
/* 타일 아랫줄(마감·날짜·문항수)은 한 줄로 못 박는다.
   🔴 **ds.css의 `.tile .who span{display:block}`이 «안쪽» span까지 잡는다** —
     날짜를 `<span class="mono">`으로 감싸는 순간 그것이 제 줄을 차지해
     「마감」과 「2026-09-01」이 두 값처럼 갈라졌다. 실제로 그렇게 나왔다.
     그래서 ① 바깥 한 겹만 자식 결합자로 집고 ② 안쪽은 inline으로 되돌린다. */
.app .cls-tiles .tile .who > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app .cls-tiles .tile .who > span span{display:inline;}
/* 지금 펴 놓은 과제 줄은 표가 나야 한다 — 아래 명단이 그 과제의 것이기 때문이다. */
.app .cls-hw.on{border-color:var(--accent-line);background:var(--accent-bg);}

.app .cls-form{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-top:11px;}
.app .cls-form label{display:flex;flex-direction:column;gap:5px;}
.app .cls-form label span{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.02em;}
.app .cls-form input,.app .cls-form textarea{border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);
  outline:none;width:100%;resize:vertical;}
.app .cls-form input:focus,.app .cls-form textarea:focus{border-color:var(--accent-line);}

.app .cls-memo{width:100%;min-height:220px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--note);padding:15px 17px;font-family:inherit;font-size:13.5px;line-height:1.75;
  color:var(--ink);outline:none;resize:vertical;}
.app .cls-memo:focus{border-color:var(--accent-line);}

.app .cls-chaps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.app .cls-chap{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;font-size:13px;
  cursor:pointer;transition:background var(--t),border-color var(--t);}
.app .cls-chap:hover{background:var(--hover);}
.app .cls-chap.on{background:var(--accent-bg);border-color:var(--accent-line);font-weight:600;}

.app .cls-hw{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 16px;margin-bottom:9px;display:flex;align-items:center;gap:14px;}
.app .cls-hw .n{flex:1;min-width:0;font-size:13.5px;font-weight:600;}
.app .cls-hw .n s{display:block;text-decoration:none;font-size:11.5px;font-weight:400;color:var(--dim);margin-top:3px;}

/* ---------- 반 관리 (design-v1/06-classes 외) ----------
   시안의 핵심은 «좌측 반 목록이 네 화면 공통»이라는 것이다. 예전에는 목록 화면과 상세 화면이
   따로여서 반을 바꿀 때마다 «← 반 목록으로»를 눌러 돌아가야 했다. 목록을 늘 띄워 두면 그 왕복이 사라진다.
   높이 134px = 상단바 52 + 서브탭 42 + .body 상하 패딩 40. */
.app .chub-screen{display:flex;height:calc(100vh - 134px);}
.app .chub-side{width:250px;flex-shrink:0;padding-right:16px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;}
.app .chub-lh{display:flex;align-items:center;flex-shrink:0;padding-bottom:10px;}
.app .chub-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
/* 반 하나 = 한 항목. 진도 막대를 항목 안에 두면 목록만 봐도 어디가 밀렸는지 보인다. */
.app .chub-cl{padding:10px 12px;border-left:3px solid transparent;border-radius:0 var(--r-md) var(--r-md) 0;
  cursor:pointer;transition:background var(--t);}
.app .chub-cl:hover{background:var(--hover);}
.app .chub-cl.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .chub-cl .n{font-size:13.5px;font-weight:600;}
.app .chub-cl .m{font-size:11.5px;color:var(--dim);margin-top:3px;}
.app .chub-cl .p{display:flex;align-items:center;gap:8px;margin-top:8px;}
.app .chub-cl .p .bar{flex:1;}
.app .chub-cl .p span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}
.app .chub-cl.off .n{color:var(--dim);font-weight:500;}

.app .chub-main{flex:1;min-width:0;padding-left:24px;display:flex;flex-direction:column;}
.app .chub-mh{display:flex;align-items:flex-start;gap:14px;flex-shrink:0;}
.app .chub-mh .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.app .chub-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* 아직 DS로 안 옮긴 서브탭은 이 안에서 구버전 스타일 그대로 그린다. */

/* 단원 체크리스트 — 표가 아니라 «목록»이다. 열이 많은 표는 훑는 데 좋고,
   순서가 있는 것은 목록이 낫다. 진도는 순서가 전부다. */
/* 반 › 진도의 «교재» (2026-09-01 · T-1). 여러 권을 나란히 두므로 알약 모양이다 —
   한 줄 입력칸이면 「개념서 · 워크북」처럼 손으로 구분자를 넣게 되고, 그러면 한 권을
   빼는 일이 «글자 지우기»가 된다. */
.app .cb-list{display:flex;flex-wrap:wrap;gap:8px;}
.app .cb-item{display:inline-flex;align-items:center;gap:9px;padding:7px 9px 7px 13px;
  border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);font-size:12.5px;}
.app .cb-item .t{color:var(--ink);}
.app .cb-item .x{border:0;background:none;color:var(--dim);cursor:pointer;
  font-size:15px;line-height:1;padding:0 2px;font-family:inherit;}
.app .cb-item .x:hover{color:var(--no);}
.app .cb-none{font-size:12.5px;color:var(--dim);}
.app .chub-u{display:flex;align-items:center;gap:13px;padding:11px 2px;
  border-bottom:1px solid var(--line2);cursor:pointer;transition:background var(--t);}
.app .chub-u:hover{background:var(--hover);}
.app .chub-u .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid #C9C6BB;
  background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:11px;font-weight:700;transition:all var(--t);}
.app .chub-u.done .ck{background:var(--accent);border-color:var(--accent);color:#fff;}
.app .chub-u.now .ck{border-color:var(--accent);border-style:dashed;}
.app .chub-u .no{width:22px;flex-shrink:0;font-family:'JetBrains Mono',monospace;
  font-size:11.5px;color:var(--dim);}
.app .chub-u .t{flex:1;min-width:0;font-size:13.5px;}
.app .chub-u.done .t{color:var(--sub);}
.app .chub-u.wait .t{color:var(--dim);}
.app .chub-u .st{flex-shrink:0;}

/* 수업 기록 (design-v1/14-log) — 한 행이 한 번의 수업. 그날 남은 것이 전부 그 행 안에 있다. */
.app .chub-fbar{display:flex;align-items:center;gap:7px;padding-bottom:13px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);flex-shrink:0;}
/* 달이 바뀌는 자리의 머리 (시안 14). 훑는 목록이라 «언제 이야기인지»가 스크롤 중에도 남아야 한다. */
.app .chub-mhead{display:flex;align-items:baseline;gap:9px;padding:18px 2px 7px;
  border-bottom:1px solid var(--line);}
.app .chub-mhead:first-child{padding-top:4px;}
.app .chub-mhead b{font-size:12px;font-weight:700;}
.app .chub-mhead span{font-size:11.5px;color:var(--dim);}
.app .chub-mhead .r{margin-left:auto;}
.app .chub-sess{display:flex;gap:18px;padding:15px 2px;border-bottom:1px solid var(--line2);
  cursor:pointer;transition:background var(--t);}
.app .chub-sess:hover{background:var(--hover);}
.app .chub-sess .when{width:104px;flex-shrink:0;}
.app .chub-sess .when .d{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;}
.app .chub-sess .when .w{font-size:11px;color:var(--dim);margin-top:4px;}
.app .chub-sess .mid{flex:1;min-width:0;}
.app .chub-sess .att{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.app .chub-sess .att .sum{font-size:12.5px;color:var(--sub);}
.app .chub-sess .att .sum b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);}
.app .chub-sess .memo{margin-top:10px;background:var(--note);border:1px solid var(--note-line);
  border-radius:var(--r-md);padding:9px 12px;font-size:12.5px;color:var(--sub);line-height:1.7;
  white-space:pre-wrap;}
.app .chub-sess .tags{width:186px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;
  align-items:flex-end;font-size:11.5px;color:var(--dim);text-align:right;}
/* ---------- 반 > 출결 격자 (2026-08-30 · C-6) ----------
   과제·성적 격자(.hwg)의 뼈대를 그대로 쓴다. 셋이 같은 모양이어야 «반의 한 학기»가 한 눈이 된다. */
.app .ag-col{width:60px;cursor:pointer;}
.app .ag-col.on{background:var(--accent-bg);}
.app .ag td.on{background:var(--accent-bg);}
.app .ag td{padding:5px 4px;}
/* 상태 한 글자 — 뱃지보다 작고 조밀하다. 20회 × 20명이 한 판에 들어와야 한다. */
.app .ag-m{display:inline-flex;align-items:center;justify-content:center;position:relative;
  width:26px;height:24px;border-radius:var(--r-sm);font-size:12px;font-weight:700;
  border:1px solid transparent;}
.app .ag-m.ok{background:var(--okbg);border-color:var(--ok-line);color:var(--ok);}
.app .ag-m.late,.app .ag-m.leave{background:var(--latebg);border-color:var(--late-line);color:var(--late);}
.app .ag-m.no{background:var(--nobg);border-color:var(--no-line);color:var(--no);}
.app .ag-m.drop{background:var(--gonebg);border-color:var(--line);color:var(--gone);}
.app .ag-m.none{color:var(--dim);font-weight:400;}
/* 사유·메모·보충영상이 달린 칸은 «점»으로 알린다 — 열어 보기 전에는 알 길이 없었다. */
.app .ag-m .dotmark{position:absolute;right:2px;bottom:2px;width:4px;height:4px;border-radius:50%;
  background:currentColor;opacity:.65;}
.app .ag th.ag-rate,.app .ag td.ag-rate{width:66px;text-align:right;padding-right:12px;
  border-left:1px solid var(--line);background:var(--sunk);}
.app .ag th.ag-rate{vertical-align:bottom;}
/* 열 머리는 한 줄이다 (2026-09-01) — .hwg-col b의 두 줄 클램프를 풀고 날짜·요일을 나란히 놓는다. */
.app .ag-col b{display:block;white-space:nowrap;overflow:visible;-webkit-line-clamp:unset;
  font-size:12px;font-weight:600;color:var(--ink);}
.app .ag-col b i{font-style:normal;font-weight:400;font-size:10.5px;color:var(--dim);margin-left:3px;}
.app .ag-col b i.td{color:var(--ink);font-weight:700;}
/* 아직 아무도 안 넣은 날 — 흐리게. 「미입력」 넉 자가 하던 일을 색이 대신한다. */
.app .ag-col.empty b, .app .ag-col.empty b i{color:var(--dim);font-weight:400;}
.app .ag .down{color:var(--no);font-weight:700;}
/* 🔵 **날짜를 눌러 여는 «고치는 판»은 오른쪽 드로어다** (2026-09-01 · 사용자가 시켰다).
   격자 아래로 펴던 `.ag-edit`은 사라졌다 — 과제 격자와 같은 자리에서 열려야 한 화면으로 읽힌다.
   타일은 «수업» 화면이 쓰는 ds.css의 `.tile`·`.seg` 그대로다. 좁은 폭에 맞춰 세로로만 푼다. */
.app .att-d{display:flex;flex-direction:column;gap:9px;padding:12px 0 4px;}
.app .att-d .tile{height:auto;min-height:56px;flex-wrap:wrap;padding:11px 13px;}
.app .att-d .tile .seg{margin-left:auto;}
.app .att-d .tile .att-fields{flex-basis:100%;max-width:none;padding:9px 0 0;margin-top:9px;
  border-top:1px solid var(--line2);}
.app .att-d .tile .att-fields label{min-width:100%;}
.app .att-d .tile .att-fields span{width:56px;}
/* 이 판의 발판은 두 줄이 될 수 있다 — 「전체 출석」·일괄 고르개와 「저장」이 같이 선다. */
.app .hwd-f.att-f{flex-wrap:wrap;}
.app .hwd-f.att-f .fm-sel{height:30px;font-size:12px;}

/* ---------- 출결 입력의 «적는 칸» 줄 (2026-08-30 · C-6) ----------
   🔴 사유·보충영상·메모가 이름표 없이 두 칸에 흩어져 있었다. 한 줄로 내리고 이름을 붙인다. */
/* ⚠ 폭을 잡아 둔다 — 안 잡으면 메모 한 칸이 1170px까지 늘어나 «적을 것이 이만큼인가» 싶어진다.
   적는 칸은 눈이 한 줄을 훑을 수 있는 만큼이면 된다. */
.app .att-fields{display:flex;gap:10px;flex-wrap:wrap;padding:0 0 10px;max-width:820px;}
.app .att-fields label{display:flex;align-items:center;gap:8px;flex:1;min-width:190px;}
.app .att-fields label.wide{flex:2;min-width:220px;}
.app .att-fields span{flex-shrink:0;font-size:11px;font-weight:700;color:var(--dim);
  letter-spacing:.02em;width:52px;}
.app .att-fields input{flex:1;min-width:0;}

/* ---------- 수업 기록에서 펴 놓은 «그날» (2026-08-30 · C-6) ---------- */
.app .chub-day{padding:18px 20px 20px;margin:0 0 6px;background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r-lg);}
.app .chub-day-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media (max-width:900px){ .app .chub-day-grid{grid-template-columns:1fr;} }
.app .chub-day .t-sec{margin-top:0;}

/* 달 고르개 줄 (2026-08-31 · C-8) — 출결·성적·과제·수업 기록 넷이 같은 줄을 쓴다.
   화면 맨 위, 본문보다 앞에 선다 — «지금 몇 월을 보고 있나»가 첫 글자여야 한다. */
.app .chub-mbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;
  margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.app .chub-mbar b{font-size:15px;font-weight:600;min-width:88px;text-align:center;}
.app .chub-mbar .btn[disabled]{opacity:.35;cursor:default;}
.app .chub-mbar .mb-x{margin-left:auto;font-size:12px;color:var(--dim);}
.app .chub-mbar .mb-x b{font-family:JetBrains Mono,monospace;font-size:12px;font-weight:600;
  color:var(--sub);min-width:0;}
/* 지금 보고 있는 날짜는 목록에서도 표가 나야 한다 — 안 그러면 위아래가 따로 논다. */
.app .chub-sess.on{background:var(--accent-bg);}
.app .chub-sess.on .when .d{color:var(--accent);}

/* 데일리퀴즈 (design-v1/15-quiz) — 1차 축은 문항이 아니라 «회차의 흐름»이다. */
.app .qz-strip{padding:16px 18px 12px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--card);flex-shrink:0;}
.app .qz-sh{display:flex;align-items:baseline;gap:10px;margin-bottom:24px;}
.app .qz-sh b{font-size:12.5px;font-weight:700;}
.app .qz-sh span{font-size:11.5px;color:var(--dim);}
/* ⚠ 여기에 mono를 걸면 안 된다 — 담기는 글이 「재원 3명 기준」이라 한글이 「재 원  기 준」으로
   벌어진다. 숫자만 자릿수 정렬하면 충분하다 (mono 안의 한글, 2026-08-08에 아홉 곳을 고쳤다). */
.app .qz-sh .r{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
.app .qz-bars{display:flex;align-items:flex-end;gap:6px;height:92px;border-bottom:1px solid var(--line);}
.app .qz-b{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  height:100%;cursor:pointer;min-width:0;}
.app .qz-b i{display:block;width:100%;background:#CFCBC2;border-radius:4px 4px 0 0;
  transition:background var(--t);min-height:2px;}
/* 순서가 곧 우선순위다. «낮음»보다 «지금 보고 있는 것»이 위여야 한다 —
   .low를 뒤에 두면 선택된 막대가 노란색에 덮여 어느 회차를 보고 있는지 알 수 없다. */
.app .qz-b.low i{background:var(--late);}
.app .qz-b.on i{background:var(--accent);}
.app .qz-b:hover i{background:var(--accent-d);}
/* 값은 선택된 회차와 가장 낮은 회차에만 붙인다 — 전부 붙이면 읽히지 않는다 */
.app .qz-b .v{position:absolute;top:-17px;left:0;right:0;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--ink);}
.app .qz-xax{display:flex;gap:6px;margin-top:7px;}
.app .qz-xax span{flex:1;min-width:0;text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--dim);overflow:hidden;white-space:nowrap;}

.app .qz-body{display:flex;gap:22px;margin-top:18px;align-items:flex-start;flex-wrap:wrap;}
.app .qz-q{flex:1;min-width:280px;}
.app .qz-qbox{background:var(--note);border:1px solid var(--note-line);border-radius:var(--r-lg);
  padding:14px 16px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;}
/* 330px 고정이던 자리다. 담기는 것이 «제출한 답 한 글자»에서 «수식이 든 문제 전문»으로
   바뀌면서 그 폭으로는 min-content를 못 이겨 통째로 아래로 접혔다. 반씩 나눠 쓴다. */
.app .qz-subs{flex:1;min-width:360px;}
.app .qz-sr{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2);}
.app .qz-sr .t{flex:1;min-width:0;font-size:12.5px;}
.app .qz-sr .t span{display:block;font-size:11px;color:var(--dim);margin-top:1px;}
.app .qz-sr .a{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
  max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 1080이던 중단점을 낮췄다. 두 단이 서려면 360+360+22=742가 필요한데 반 관리의 본문은
   뷰포트 1080에서 786이라 충분하다 — 1080 화면(실제로 쓰는 크기다)이 이유 없이 접히고 있었다. */
@media (max-width:1000px){ .app .qz-subs{min-width:100%;} }

/* 영상 (design-v1/16-videos) — 역할은 «시청률»이 아니라 «어디서 멈췄나»다. */
/* ⚠ 영상 목록만은 «창 가장자리까지»가 안 된다 — 반 관리 본문 «안»의 칸이고 그 위에
   「영상 등록」 줄이 하나 더 있다. `min-height:100%`를 줘 봤더니 그 줄 높이(38px)만큼
   본문에 빈 스크롤이 생겼다. 흰 면은 두 열 중 긴 쪽 높이까지만 간다. */
.app .vd-screen{display:flex;gap:0;}
.app .vd-list{width:264px;flex-shrink:0;border-right:1px solid var(--line);
  padding-right:14px;margin-right:18px;}
.app .vd-item{padding:12px;border-left:3px solid transparent;border-bottom:1px solid var(--line2);
  border-radius:0 var(--r-md) var(--r-md) 0;cursor:pointer;transition:background var(--t);}
.app .vd-item:hover{background:var(--hover);}
.app .vd-item.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .vd-item .t{font-size:13px;font-weight:600;line-height:1.5;}
.app .vd-item .m{display:flex;align-items:center;gap:8px;margin-top:7px;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);}
.app .vd-item .p{display:flex;align-items:center;gap:9px;margin-top:8px;}
.app .vd-item .p .bar{flex:1;}
.app .vd-item .p b{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;}
.app .vd-main{flex:1;min-width:0;}

/* 이탈 지점 — 학생이 «어디까지 보고 멈췄는가»의 분포. 10구간 + 완주 칸. */
.app .vd-drop{padding:16px 18px 12px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--card);}
.app .vd-dh{display:flex;align-items:baseline;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.app .vd-dh b{font-size:12.5px;font-weight:700;}
.app .vd-dh span{font-size:11.5px;color:var(--dim);}
.app .vd-dh .r{margin-left:auto;font-size:11px;color:var(--dim);}
.app .vd-bars{display:flex;align-items:flex-end;gap:4px;height:74px;border-bottom:1px solid var(--line);}
.app .vd-bars .b{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  height:100%;min-width:0;}
.app .vd-bars .b i{display:block;width:100%;background:#DEDAD1;border-radius:4px 4px 0 0;min-height:1px;}
.app .vd-bars .b.peak i{background:var(--no);}
.app .vd-bars .b.end i{background:var(--ok);}
/* 시안은 left/right를 -14px로 빼 라벨을 막대보다 넓게 잡았는데, 실서비스에서는 그만큼
   .vd-bars의 scrollWidth가 커져 가로 넘침으로 잡힌다. 막대 폭이 충분하므로 제 박스 안에 둔다
   (퀴즈 스트립도 같은 방식이다). */
.app .vd-bars .b .v{position:absolute;top:-17px;left:0;right:0;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;}
.app .vd-dax{display:flex;gap:4px;margin-top:7px;}
.app .vd-dax span{flex:1;min-width:0;text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--dim);}

.app .vd-sv{display:flex;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .vd-sv:hover{background:var(--hover);}
.app .vd-sv .who{width:150px;flex-shrink:0;display:flex;align-items:center;gap:9px;min-width:0;}
.app .vd-sv .who b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .vd-sv .track{flex:1;min-width:0;height:16px;background:var(--line2);border-radius:4px;overflow:hidden;}
.app .vd-sv .track i{display:block;height:100%;border-radius:4px;background:#CFCBC2;}
.app .vd-sv.done .track i{background:var(--ok);}
.app .vd-sv.low .track i{background:var(--no);}
.app .vd-sv .pct{width:46px;flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;}
.app .vd-sv .st{width:64px;flex-shrink:0;text-align:right;}
@media (max-width:1000px){
  .app .vd-screen{flex-direction:column;}
  .app .vd-list{width:100%;border-right:0;border-bottom:1px solid var(--line);
    padding-right:0;margin-right:0;margin-bottom:16px;}
}

/* ---------- 오답 검토 (design-v1/04-review) ----------
   시안이 A4에서 흡수한 것 셋 — 큐 · 2열 비교 · 키보드. 다크 테마는 버렸다.
   높이 134px = 상단바 52 + 서브탭 42 + .body 상하 패딩 40. */
.app .rv-screen{display:flex;height:calc(100vh - 134px);}
/* 큐는 시안대로 종이색이지만 **경계선은 흰 면과 같은 높이로** 서야 한다.
   위아래 패딩만큼 짧으면 선이 중간에서 끊기고, 목록과 16px 떠 있으면 선이 어디에도 안 붙는다. */
.app .rv-queues{width:196px;flex-shrink:0;padding-right:14px;border-right:1px solid var(--line);
  overflow-y:auto;margin:-20px 0 -20px -20px;padding-left:20px;padding-top:20px;padding-bottom:20px;}
.app .rv-qn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-md);
  font-size:12.5px;color:var(--sub);cursor:pointer;transition:background var(--t),color var(--t);}
.app .rv-qn:hover{background:var(--hover);color:var(--ink);}
.app .rv-qn.on{background:var(--accent-bg);color:var(--accent);font-weight:700;}
.app .rv-qn b{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;}

/* min-height:0이 없으면 플렉스 항목의 최소 높이가 «내용 크기»가 되어, 안에 든 KaTeX 수식이
   상자를 밀어낸다. 화면 높이는 고정인데 문서가 그만큼 세로로 스크롤됐다. */
/* 흰 면은 큐의 경계선에 «붙어» 시작한다 (시안 04: .list{left:216px} — 큐 폭과 정확히 같다).
   margin-left로 띄우면 선과 면 사이에 종이색 띠가 생겨 선이 떠 보인다. 안쪽 여백으로 바꿨다. */
.app .rv-list{width:292px;flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;padding-left:16px;padding-right:14px;}
.app .rv-lh{display:flex;align-items:center;gap:8px;padding-bottom:11px;
  border-bottom:1px solid var(--line);flex-shrink:0;}
.app .rv-lbody{flex:1;min-height:0;overflow-y:auto;}
.app .rv-item{padding:12px 11px;border-left:3px solid transparent;border-bottom:1px solid var(--line2);
  border-radius:0 var(--r-md) var(--r-md) 0;cursor:pointer;transition:background var(--t);}
.app .rv-item:hover{background:var(--hover);}
.app .rv-item.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .rv-item .t{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;}
.app .rv-item .t s{text-decoration:none;margin-left:auto;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:500;color:var(--dim);}
.app .rv-item .m{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

.app .rv-work{flex:1;min-width:0;min-height:0;padding-left:22px;display:flex;flex-direction:column;}
.app .rv-wh{flex-shrink:0;}
.app .rv-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* 편집칸은 비교 상자 «안»에 둔다 — 원본을 보면서 고쳐야 하므로 자리를 옮기지 않는다. */
.app .rv-edit{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:9px 11px;font-family:inherit;font-size:13px;line-height:1.7;
  color:var(--ink);outline:none;resize:vertical;}
.app .rv-edit:focus{border-color:var(--accent-line);}
.app .rv-edit.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;}
/* AI 풀이는 접어 둔다 — 검토자가 먼저 판단하고 나서 펼치도록. */
.app .rv-fold{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);}
.app .rv-fh{display:flex;align-items:center;gap:8px;padding:11px 15px;font-size:12.5px;
  color:var(--sub);cursor:pointer;}
.app .rv-fh .sp{margin-left:auto;font-size:11px;color:var(--dim);}
.app .rv-fb{padding:12px 15px 14px;font-size:12.5px;color:var(--sub);line-height:1.85;
  border-top:1px solid var(--line2);white-space:pre-wrap;}
.app .rv-warn{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 13px;
  border:1px solid var(--no-line);border-left-width:3px;border-radius:var(--r-md);
  background:var(--nobg);color:var(--no);}
.app .rv-warn b{display:block;font-size:12.5px;margin-bottom:3px;}
.app .rv-warn span{display:block;font-size:11.5px;line-height:1.6;color:var(--sub);}
/* 문항 코드 띠 (2026-09-03 · I-2). 접두사 ic- 는 ds.css 에도 이 파일에도 없던 이름이다
   — 여섯 번 데인 «클래스 이름 겹침»을 피하려고 먼저 찾아봤다. */
.app .ic-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;
  padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk);}
.app .ic-strip.on{background:var(--accent-bg);border-color:var(--accent-line);}
.app .ic-k{font-size:11px;color:var(--dim);letter-spacing:.04em;}
.app .ic-code{font-size:13px;font-weight:700;color:var(--ink);}
.app .ic-meta{font-size:11.5px;color:var(--sub);}
.app .ic-meta.warn{color:var(--no);font-weight:600;}
.app .ic-in{width:150px;height:28px;padding:0 8px;font-size:12.5px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);}
.app .ic-hint{font-size:11px;color:var(--dim);line-height:1.5;}
.app .ic-load{font-size:11.5px;color:var(--dim);}
.app .ic-have{font-size:12px;color:var(--ok);font-weight:600;}
.app .ic-none{font-size:11.5px;color:var(--dim);}
.app .ic-kind{font-size:11px;color:var(--sub);padding:1px 7px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--card);}
.app .ic-list{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);overflow:hidden;}
.app .ic-row{display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--line2);font-size:12px;}
.app .ic-row:last-child{border-bottom:0;}
.app .ic-txt{flex:1;min-width:0;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .ic-a{color:var(--ink);font-weight:700;}
.app .ic-save{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;
  padding:8px 12px;border:1px dashed var(--note-dash);border-radius:var(--r-md);background:var(--note);}
.app .ic-save span{font-size:11.5px;color:var(--sub);}
/* «다음 번호» 표 — 이 화면의 주인공이라 코드를 크게 세운다 */
.app .ic-next{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);overflow:hidden;}
.app .ic-nrow{display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-bottom:1px solid var(--line2);}
.app .ic-nrow:last-child{border-bottom:0;}
.app .ic-nlab{min-width:58px;font-size:12.5px;font-weight:600;color:var(--ink);}
.app .ic-ncnt{font-size:11.5px;color:var(--dim);min-width:64px;}
.app .ic-ncode{font-size:14px;font-weight:700;color:var(--brand);}
.app .ic-nhint{flex:1;font-size:11px;color:var(--dim);}
/* 문항 카드 — 코드 하나에 붙은 것을 다 모아 보인다 */
.app .ic-card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  overflow:hidden;}
.app .ic-ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;
  background:var(--accent-bg);border-bottom:1px solid var(--accent-line);}
.app .ic-ch > b{font-size:15px;font-weight:700;color:var(--ink);}
.app .ic-ct{font-size:12.5px;color:var(--sub);}
.app .ic-ct s{color:var(--dim);text-decoration:none;}
.app .ic-cw{font-size:12px;color:var(--no);font-weight:600;}
.app .ic-cb{padding:4px 16px 10px;}
.app .ic-crow{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--line2);
  font-size:12.5px;line-height:1.65;}
.app .ic-crow:last-child{border-bottom:0;}
.app .ic-cl{flex:0 0 84px;color:var(--dim);font-size:11.5px;padding-top:1px;}
.app .ic-cs{color:var(--dim);font-size:11px;text-decoration:none;margin-left:6px;}
.app .ic-cq{color:var(--sub);}
/* «그림을 직접 그려야 하는 변형»의 작업대. 아직 안 그린 것은 붉게, 붙은 것은 가라앉힌다 —
   이 상자가 곧 «공개를 막고 있는 것»이라 눈에 띄어야 한다. */
.app .rv-fig{margin-top:11px;padding:11px 13px;border-radius:var(--r-md);
  border:1px solid var(--no-line);border-left-width:3px;background:var(--nobg);}
.app .rv-fig.on{border-color:var(--line);border-left-color:var(--line);background:var(--note);}
.app .rv-fig > b{display:block;font-size:12px;color:var(--no);margin-bottom:4px;}
.app .rv-fig.on > b{color:var(--sub);}
.app .rv-fig .hx{font-size:11px;line-height:1.7;color:var(--sub);}
.app .rv-figact{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;}
/* 그리는 지침. 워커가 줄바꿈으로 네 줄을 보내므로 그대로 살린다. */
.app .rv-spec{margin-top:9px;padding:9px 11px;border-radius:var(--r-sm);background:var(--paper);
  border:1px solid var(--line2);font-size:11.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;}
.app .rv-fignote{font-size:11px;color:var(--sub);margin-top:9px;line-height:1.7;}
/* 기계가 그린 초안. **아직 붙지 않은 것**이라 작업대 안에서 한 겹 더 들어가 보여야 한다 —
   검산을 통과했는지(초록)와 걸렸는지(붉음)를 테두리로 가른다. */
.app .rv-draft{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line2);background:var(--paper);}
.app .rv-draft.ok{border-color:var(--ok-line,var(--line));border-left:3px solid var(--ok,#2c6b3f);}
.app .rv-draft.no{border-color:var(--no-line);border-left:3px solid var(--no);}
.app .rv-draft > b{display:block;font-size:12px;margin-bottom:3px;}
.app .rv-draft.ok > b{color:var(--ok,#2c6b3f);}
.app .rv-draft.no > b{color:var(--no);}
.app .rv-draftfail{margin:6px 0 0;padding-left:17px;font-size:11.5px;line-height:1.8;color:var(--no);}
@media (max-width:1240px){ .app .rv-queues{display:none;} }

/* ============================================================
   화면의 «면» — 목록·문맥 칸은 종이 위에 뜬 흰 면이다 (2026-08-08)
   ============================================================
   시안은 거의 모든 화면에서 좌측 목록과 우측 문맥 칸을 `background:var(--card)`로 그렸다.
   이식할 때 «배치»만 옮기고 이 한 줄을 빠뜨린 것이 첫 화면에서 굳어 아홉 화면까지 갔다.
   경계선 하나만으로는 «칸»이 아니라 «여백을 띄운 목록»으로 읽힌다.

   ⚠ 「카드를 쓰지 않는다」와 부딪히지 않는다. 그 규칙은 본문 한가운데에 흰 상자를 띄우던
      구버전 `.lg-panel` 얘기다. 화면 가장자리의 «면»은 시안이 처음부터 흰색으로 그렸다.
   ⚠ **시안이 종이색으로 둔 칸은 그대로 둔다** — 수업(02)의 시간표(`.cls-side`)와
      오답 검토(04)의 큐(`.rv-queues`). 전부 칠하면 «면»이라는 구분 자체가 없어진다.

   시안은 1440 캔버스에 `position:absolute`라 칸이 화면 가장자리에 닿았다. 여기는 스크롤
   문서이므로 본문 패딩(`.app .body{padding:20px}`)을 **음수 마진으로 되먹여** 같은 자리를 만든다. */
.app .sd-list, .app .sd-ctx, .app .rv-list, .app .chub-side, .app .ex-list,
.app .co-side, .app .nt-list, .app .ch-list, .app .vd-list, .app .qn-list{background:var(--card);}

/* 세로는 본문 위아래 패딩까지 채운다 — 칸이 상단바 밑에서 창 아래까지 이어진다.
   `.vd-list`는 빠진다: 반 관리 «본문 안»에 있는 칸이라 여기서 재면 엉뚱한 자리를 먹는다. */
.app .sd-list, .app .sd-ctx, .app .rv-list, .app .chub-side, .app .ex-list,
.app .co-side, .app .nt-list, .app .ch-list, .app .qn-list{
  margin-top:-20px;margin-bottom:-20px;padding-top:20px;padding-bottom:20px;}
/* 가로는 창 가장자리에 닿는 칸만 그쪽 패딩을 먹는다 (`.rv-list`는 큐 다음의 «가운데» 칸이다) */
.app .sd-list, .app .chub-side, .app .ex-list, .app .nt-list, .app .ch-list, .app .qn-list{
  margin-left:-20px;padding-left:20px;}
.app .sd-ctx, .app .co-side{margin-right:-20px;padding-right:20px;}

/* ---------- 학생 상세 (design-v1/03-student) — 디자인 시스템의 기준 화면 ---------- */
.app .sd-screen{display:flex;height:calc(100vh - 92px);}
.app .sd-list{width:258px;flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;padding-right:14px;}
.app .sd-lh{flex-shrink:0;padding-bottom:10px;}
.app .sd-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
.app .sd-doc{flex:1;min-width:0;min-height:0;padding:0 24px;display:flex;flex-direction:column;}
.app .sd-dh{display:flex;align-items:flex-start;gap:16px;flex-shrink:0;}
.app .sd-dh .tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
/* 신호 — 별도 보드를 만들지 않고 학생 화면 안에 «근거 문장»으로 앉힌다 (A5에서 흡수). */
.app .sd-sig{display:flex;align-items:center;gap:11px;margin-top:12px;padding:10px 14px;
  border-radius:var(--r-md);flex-shrink:0;flex-wrap:wrap;}
.app .sd-sig.r{background:var(--nobg);border:1px solid var(--no-line);}
.app .sd-sig.y{background:var(--latebg);border:1px solid var(--late-line);}
.app .sd-sig.g{background:var(--sunk);border:1px solid var(--line);}
.app .sd-sig .x{flex:1;min-width:180px;font-size:12.5px;color:var(--sub);line-height:1.55;}
.app .sd-sig .x b{font-weight:700;color:var(--ink);font-family:'JetBrains Mono',monospace;}
.app .sd-tf{display:flex;align-items:center;gap:6px;margin-top:18px;flex-shrink:0;flex-wrap:wrap;}
.app .sd-tf .r{margin-left:auto;font-size:12px;color:var(--dim);}
.app .sd-tl{flex:1;min-height:0;margin-top:14px;overflow-y:auto;}
/* 연대기 — 하루가 한 덩어리, 그 안에 그날 있었던 일이 종류를 가리지 않고 쌓인다. */
.app .sd-day{display:flex;align-items:center;gap:9px;padding:18px 2px 7px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;}
.app .sd-day b{font-size:12px;font-weight:700;}
.app .sd-day span{font-size:11.5px;color:var(--dim);}
/* 시안의 세로 레일과 점을 그대로 가져왔다 (ds.css의 `.tl::before`·`.ev::before`).
   다른 것은 «날짜의 자리» 하나다 — 시안은 레일 왼쪽 108px 밖에 날짜를 세웠는데,
   그 여백은 1440 고정 캔버스에서만 성립한다. 여기서는 날짜가 이미 sticky 머리줄로 있고,
   스크롤하는 목록에서는 «지금 보고 있는 날»이 위에 붙어 있는 쪽이 더 잘 읽힌다.

   레일은 항목마다 제 몫을 그린다 — 스크롤 상자에 `position:absolute`로 한 줄을 세우면
   그 줄이 «보이는 높이»만큼만 생겨 첫 화면을 지나면 끊긴다. */
.app .sd-ev{position:relative;display:flex;align-items:flex-start;gap:12px;padding:11px 2px 11px 24px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .sd-ev::after{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line);}
.app .sd-ev::before{content:'';position:absolute;left:4.5px;top:16px;width:9px;height:9px;z-index:1;
  border-radius:50%;background:#CFCEC6;border:2px solid var(--paper);}
/* 점 색은 «종류»가 아니라 «그날 무슨 일이 있었나»를 말한다 — 시안이 넷에만 색을 물린 것과 같다.
   과제·오답·퀴즈·질문까지 칠하면 한 화면이 통째로 알록달록해져 아무것도 눈에 안 띈다.
   그 항목들의 상태는 오른쪽 뱃지가 이미 말하고 있다. */
.app .sd-ev.k-ok::before{background:var(--ok);}
.app .sd-ev.k-late::before{background:var(--late);}
.app .sd-ev.k-no::before{background:var(--no);}
.app .sd-ev.k-score::before{background:var(--blue);}
.app .sd-ev.k-consult::before{background:var(--accent);}
.app .sd-ev:hover{background:var(--hover);}
.app .sd-ev .kind{width:52px;flex-shrink:0;font-size:11px;color:var(--dim);padding-top:4px;}
/* ⚠ 여기는 `.body`였다 — 앱 셸의 `.app .body{padding:20px}`에 그대로 걸려 줄마다 20px이 붙었다.
   종류와 제목이 어긋나 보이고 행 높이가 83px(제 높이의 1.6배)이 돼 있었다.
   ds.css가 아니라 «이 파일 안»의 클래스와 부딪힌 여섯 번째 사고다 (8절). */
.app .sd-ev .tx{flex:1;min-width:0;}
.app .sd-ev .ti{font-size:13.5px;font-weight:600;}
.app .sd-ev .de{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.6;}
.app .sd-ev .de b{font-family:'JetBrains Mono',monospace;color:var(--ink);font-weight:600;}
.app .sd-ev .st{flex-shrink:0;}

.app .sd-ctx{width:296px;flex-shrink:0;border-left:1px solid var(--line);padding-left:20px;
  overflow-y:auto;min-height:0;}
.app .sd-crow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:6px 0;font-size:12.5px;}
.app .sd-crow span{color:var(--dim);flex-shrink:0;}
.app .sd-crow b{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .sd-crow b.m{font-family:'JetBrains Mono',monospace;font-weight:600;}
.app .sd-qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.app .sd-qa .btn{width:100%;}
/* 고정 메모 — ds.css의 `.note.pin`(점선 메모지)과 같은 옷이지만 «쓰는» 칸이라 textarea다.
   글자마다 render()가 돌지 않으므로(초안만 담는다) 커서도 한글 조합도 안전하다. */
.app .sd-note{width:100%;margin-top:8px;min-height:96px;resize:vertical;
  background:var(--note);border:1px dashed var(--note-dash);border-radius:var(--r-md);
  padding:9px 12px;font-family:inherit;font-size:12.5px;line-height:1.7;color:var(--ink);
  outline:none;transition:border-color var(--t);}
.app .sd-note::placeholder{color:var(--dim);}
.app .sd-note:focus{border-color:var(--accent-line);border-style:solid;}
.app .sd-note-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:7px;font-size:11px;color:var(--dim);}
.app .sd-note-at{font-family:'JetBrains Mono',monospace;}
/* 입력 폼은 연대기 «위»에 붙는다 — 지금 보고 있는 갈래에 무엇을 더할지가 분명해진다. */
.app .sd-form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 15px;margin-top:14px;flex-shrink:0;}
@media (max-width:1280px){ .app .sd-ctx{display:none;} }
@media (max-width:1020px){ .app .sd-list{display:none;} }

/* ---------- 소통 4종 (design-v1/09~12) ----------
   네 화면이 성격이 다르다. 통일해야 하는 것은 색·서체·간격·버튼이지 «형태»가 아니다 —
   질의응답은 세로 스택, 채팅은 말풍선, 클리닉은 시간 판, 공지는 목록이다. */
.app .co-screen{display:flex;height:calc(100vh - 134px);}
.app .co-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;}
.app .co-body{flex:1;min-height:0;overflow-y:auto;margin-top:16px;}
.app .co-side{width:320px;flex-shrink:0;border-left:1px solid var(--line);padding-left:18px;
  margin-left:20px;display:flex;flex-direction:column;min-height:0;}
.app .co-sbody{flex:1;min-height:0;overflow-y:auto;margin-top:12px;}

/* 클리닉 — 시간이 자원이다. 목록만으로는 «어디가 비었나»가 안 보인다. */
.app .cn-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:start;}
.app .cn-col{min-width:0;}
.app .cn-ch{text-align:center;font-size:11.5px;font-weight:700;color:var(--sub);padding-bottom:8px;
  border-bottom:1px solid var(--line);margin-bottom:8px;}
.app .cn-ch s{text-decoration:none;display:block;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;color:var(--dim);font-weight:500;margin-top:2px;}
.app .cn-ch.today{color:var(--accent);}
.app .cn-slot{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:8px 9px;margin-bottom:6px;transition:border-color var(--t);}
.app .cn-slot.free{background:var(--sunk);border-style:dashed;}
.app .cn-slot.full{background:var(--okbg);border-color:var(--ok-line);}
.app .cn-slot .t{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;}
.app .cn-slot .u{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5;}
.app .cn-none{font-size:11px;color:var(--dim);text-align:center;padding:10px 0;}
/* 날짜 열 아래의 «그날에 시간대 추가» — 평소에는 조용히 있다가 열에 손을 올리면 드러난다 */
.app .cn-add{width:100%;margin-top:6px;padding:7px 0;border:1px dashed var(--line);
  border-radius:var(--r-md);background:transparent;font-family:inherit;font-size:11px;
  color:var(--dim);cursor:pointer;opacity:.55;transition:opacity var(--t),background var(--t),color var(--t);}
.app .cn-col:hover .cn-add{opacity:1;}
.app .cn-add:hover{background:var(--hover);color:var(--accent);border-color:var(--accent-line);}
.app .cn-rq{padding:12px 2px;border-bottom:1px solid var(--line2);}
.app .cn-rq .h{display:flex;align-items:center;gap:8px;}
.app .cn-rq .h b{font-size:13px;font-weight:600;}
.app .cn-rq .h .ago{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);}
.app .cn-rq .w{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6;}
.app .cn-rq .a{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}

/* 질의응답 — 세로 스택. 질문 하나가 한 덩어리고 답이 그 아래 붙는다. */
/* 질의응답 — 시안 11 그대로 «좌 목록 + 우 하나» 두 단이다 (2026-08-08에 다시 짰다).
   예전에는 카드를 세로로 쌓았다. 그런데 수학 질문은 길고 사진이 붙어서, 하나를 읽는 동안
   다음 질문이 화면 밖으로 나갔다. **답하는 화면은 «다음 것으로 넘어가는» 화면이라
   목록이 늘 옆에 있어야 한다** — 오답 검토에서 내린 것과 같은 판단이다. */
.app .qn-screen{display:flex;height:calc(100vh - 134px);}
.app .qn-list{width:326px;flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;}
.app .qn-lh{display:flex;align-items:center;gap:6px;padding:0 14px 12px 0;flex-shrink:0;flex-wrap:wrap;}
.app .qn-lbody{flex:1;min-height:0;overflow-y:auto;position:relative;padding-right:14px;}

.app .qn-doc{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 4px 0 26px;}
.app .qn-dh{flex-shrink:0;padding-bottom:14px;border-bottom:1px solid var(--line);}
.app .qn-thread{flex:1;min-height:0;overflow-y:auto;position:relative;padding:16px 0 8px;}
/* 질문과 답변을 좌우로 벌리지 않는다 — 수학 질문은 길고 수식이 들어가서
   말풍선으로 만들면 폭이 좁아 읽기 어렵다. 세로로 쌓고 «누가 썼는지»를 머리에 붙인다. */
.app .qn-msg{padding:16px 18px;border-radius:var(--r-lg);border:1px solid var(--line);
  background:var(--card);margin-bottom:12px;}
.app .qn-msg.me{background:var(--accent-bg);border-color:var(--accent-line);}
.app .qn-msg .h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.app .qn-msg .h b{font-size:12.5px;font-weight:700;}
.app .qn-msg .h .t{margin-left:auto;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;color:var(--dim);}
.app .qn-msg .x{font-size:13.5px;line-height:1.9;white-space:pre-wrap;}
.app .qn-comp{flex-shrink:0;border-top:1px solid var(--line);padding:14px 0 4px;}
.app .qn-img{max-width:260px;max-height:260px;margin-top:10px;border:1px solid var(--line);
  border-radius:var(--r-md);display:block;}
@media (max-width:1080px){ .app .qn-list{width:250px;} }

/* 공지 — 읽히는 순서가 곧 최신 순이다. */
/* ---------- 공지 (design-v1/10-notice) ----------
   시안대로 «목록 + 본문» 두 단이다. 카드를 세로로 나열하면 긴 공지 하나가
   나머지를 전부 화면 밖으로 밀어낸다 — 공지는 «하나를 읽는» 것이다.
   ⚠ 시안의 세 번째 칸 「읽음 현황」은 만들 수 없다 — 아래 nt-doc 주석 참고. */
/* ⚠ 92가 아니라 134다 — 공지는 「소통」 서브탭 아래에 있다 (52 상단바 + 42 서브탭 + 40 패딩).
   92로 잡혀 있어 화면이 42px 길었는데, 칸에 배경이 깔리기 전에는 눈에 띄지 않았다. */
.app .nt-screen{display:flex;height:calc(100vh - 134px);}
.app .nt-list{width:290px;flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;}
.app .nt-lh{display:flex;align-items:center;gap:8px;padding:0 14px 12px 0;flex-shrink:0;}
.app .nt-lbody{flex:1;min-height:0;overflow-y:auto;position:relative;padding-right:14px;}
.app .nt-item{padding:12px 14px;border-left:3px solid transparent;border-bottom:1px solid var(--line2);
  cursor:pointer;transition:background var(--t);}
.app .nt-item:hover{background:var(--hover);}
.app .nt-item.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .nt-item .d{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);}
.app .nt-item .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.5;}
.app .nt-item .m{font-size:11.5px;color:var(--dim);margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .nt-doc{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 4px 0 26px;}
.app .nt-dh{display:flex;align-items:baseline;gap:12px;flex-shrink:0;padding-bottom:14px;
  border-bottom:1px solid var(--line);}
.app .nt-dh h2{margin:0;font-family:'Noto Serif KR',serif;font-size:22px;font-weight:600;
  letter-spacing:-.02em;}
.app .nt-dbody{flex:1;min-height:0;overflow-y:auto;position:relative;padding:20px 0 0;}

/* ---------- 서식 있는 본문 ----------
   .app과 .lp 양쪽에서 쓰므로 스코프를 걸지 않는다 (.mono와 같은 «내용» 클래스다).
   저장되는 것은 언제나 평문이고, 여기서 표시할 때만 태그로 바꾼다 — 아래 noticeBodyHTML 참고. */
.ntx{font-size:13.5px;line-height:1.9;color:var(--sub);}
.ntx > *:first-child{margin-top:0;}
.ntx p{margin:0 0 14px;}
.ntx h4{margin:22px 0 10px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
.ntx ul{margin:0 0 14px;padding-left:19px;}
.ntx li{margin-bottom:6px;}
.ntx b{color:var(--ink);font-weight:700;}
.ntx .big{font-size:16px;color:var(--ink);}

.app .nt-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
  padding:14px 16px;margin-bottom:10px;}
.app .nt-h{display:flex;align-items:baseline;gap:10px;}
.app .nt-h b{font-size:14px;font-weight:700;}
.app .nt-h s{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);}
.app .nt-b{font-size:13px;line-height:1.75;margin-top:8px;white-space:pre-wrap;color:var(--sub);}

/* 채팅 — 말풍선. 왼쪽에 학생, 오른쪽에 대화. */
/* 목록과 대화 사이는 «선 하나»가 아니라 여백까지 있어야 갈라져 보인다.
   padding-right만 주면 선에 제목과 말풍선이 붙는다. */
.app .ch-list{width:240px;flex-shrink:0;border-right:1px solid var(--line);
  padding-right:16px;margin-right:24px;
  display:flex;flex-direction:column;min-height:0;}
.app .ch-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
.app .ch-win{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding:16px 2px;}
.app .ch-b{max-width:72%;padding:9px 13px;border-radius:var(--r-lg);font-size:13px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;}
.app .ch-b.from-student{align-self:flex-start;background:var(--card);border:1px solid var(--line);}
.app .ch-b.from-teacher{align-self:flex-end;background:var(--accent);color:#fff;}
.app .ch-b .at{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;
  opacity:.6;margin-top:5px;}
.app .ch-in{display:flex;gap:8px;flex-shrink:0;padding-top:12px;border-top:1px solid var(--line);}
.app .ch-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--paper);padding:9px 12px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;}
.app .ch-in input:focus{border-color:var(--accent-line);}
@media (max-width:1180px){ .app .co-side{display:none;} }

/* ---------- 시험지 (design-v1/07-exams) ----------
   역할은 «어느 문항이 무너졌는지 본다». 오답 파이프라인의 입구다. */
.app .ex-screen{display:flex;height:calc(100vh - 134px);}
/* 설정은 서브탭이 없다 — 왼쪽 갈래 목록이 그 일을 한다. 그래서 42px을 돌려받는다.
   («칸»에 배경이 깔리기 전에는 아래쪽 빈자리로만 보여 눈에 띄지 않았다.) */
.app .ex-screen.ex-nosub{height:calc(100vh - 92px);}
.app .ex-list{width:262px;flex-shrink:0;border-right:1px solid var(--line);
  padding-right:14px;margin-right:20px;display:flex;flex-direction:column;min-height:0;}
.app .ex-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
/* 시안 07의 `.ex` 그대로 — 항목 사이에 선을 넣지 않는다. 선이 있으면 «표»로 읽혀서
   두세 줄짜리 항목이 서로 붙어 보인다. 구분은 여백과 hover가 한다. */
.app .ex-item{padding:12px 16px;border-left:3px solid transparent;
  cursor:pointer;transition:background var(--t);}
.app .ex-item:hover{background:var(--hover);}
.app .ex-item.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .ex-item .n{font-size:13px;font-weight:600;}
/* 갈래를 «고르는» 목록(설정·창고)은 카드가 아니라 내비게이션이다 — 시안 13의 `.sn` 알약.
   같은 부품으로 그리면 「시험지 하나」와 「설정 갈래」가 같은 무게로 보인다. */
.app .ex-list.ex-nav .ex-item{padding:8px 10px;border-left:0;border-radius:var(--r-md);
  color:var(--sub);transition:background var(--t),color var(--t);}
.app .ex-list.ex-nav .ex-item:hover{color:var(--ink);}
.app .ex-list.ex-nav .ex-item.on{background:var(--accent-bg);color:var(--accent);}
.app .ex-list.ex-nav .ex-item .n{font-size:12.5px;font-weight:600;}
.app .ex-list.ex-nav .ex-item.on .n{font-weight:700;}
.app .ex-list.ex-nav .ex-item .m{margin-top:2px;}
.app .ex-item .m{font-size:11.5px;color:var(--dim);margin-top:4px;}
.app .ex-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;}
.app .ex-body{flex:1;min-height:0;overflow-y:auto;margin-top:16px;}
/* 문항별 오답률 — 막대를 세우지 않고 «행»으로 눕힌다. 20문항이면 세로 막대엔 라벨이 안 들어간다. */
.app .ex-q{display:flex;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .ex-q:hover{background:var(--hover);}
.app .ex-q .no{width:34px;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;
  font-weight:600;color:var(--sub);}
.app .ex-q .unit{width:150px;flex-shrink:0;font-size:12px;color:var(--sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .ex-q .track{flex:1;min-width:60px;height:18px;background:var(--line2);border-radius:4px;overflow:hidden;}
.app .ex-q .track i{display:block;height:100%;border-radius:4px;background:#D9D6CC;}
.app .ex-q.mid .track i{background:var(--late);}
.app .ex-q.hi .track i{background:var(--no);}
.app .ex-q .pct{width:46px;flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;}
.app .ex-q .tw{width:92px;flex-shrink:0;text-align:right;}
/* 과목 폴더 (2026-08-30 · C-2) — 왼쪽은 «과목 > 시험지» 두 층뿐이다.
   머리는 button으로 둔다. div+onclick이면 키보드로 접었다 펼 수 없다. */
.app .ex-fold{margin-bottom:2px;}
.app .ex-foldh{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;
  background:none;border:0;border-radius:var(--r-md);cursor:pointer;text-align:left;
  font-family:inherit;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;}
.app .ex-foldh:hover{background:var(--hover);color:var(--ink);}
.app .ex-foldh .cv{display:flex;flex-shrink:0;opacity:.65;}
.app .ex-foldh .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .ex-foldh .ct{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-weight:600;
  font-size:10.5px;letter-spacing:0;}
.app .ex-fold .ex-item{margin-left:9px;}

/* 반 보기의 «창고 한 줄» — 여기 있던 문항·변형문제를 「전체」로 옮기고 남긴 이정표다.
   ⚠ 그냥 없애면 «사라졌다»고 읽힌다. 어디로 가면 있는지를 이 줄이 진다. */
.app .ex-bankline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:12px;padding:9px 13px;flex-shrink:0;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--note);
  font-size:12px;color:var(--sub);}
.app .ex-bankline s{text-decoration:none;color:var(--dim);margin-left:7px;font-size:11.5px;}

/* 성적 격자 (2026-08-30 · C-4) — 과제 격자(.hwg)의 뼈대를 그대로 쓴다.
   다른 것은 칸이 «읽는 것»이 아니라 «치는 것»이라는 점뿐이다.
   ⚠ 열 머리에 만점 입력칸이 들어가므로 .hwg-col보다 조금 넓다. */
.app .sg-col{width:124px;}
.app .sg .sg-tot{width:52px;height:22px;padding:0 5px;text-align:right;
  border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);
  font-size:11px;font-weight:600;}
.app .sg .sg-in{width:100%;height:30px;padding:0 8px;text-align:center;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);
  font-size:12.5px;font-weight:600;}
.app .sg .sg-in:focus,.app .sg .sg-tot:focus{outline:none;border-color:var(--accent);}
.app .sg .sg-in::placeholder{color:var(--dim);font-weight:400;}
.app .sg td{padding:4px 6px;}
/* 열 머리의 작은 단추 — 점수만 있는 시험은 «지우기», 문항이 있으면 «문항 보기»로 간다. */
.app .sg .sg-x{margin-top:5px;padding:1px 7px;border:1px solid var(--line);border-radius:4px;
  background:var(--sunk);color:var(--dim);cursor:pointer;font-family:inherit;font-size:10.5px;
  font-weight:500;line-height:1.6;}
.app .sg .sg-x:hover{background:var(--hover);color:var(--ink);}
.app .sg .sg-x.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:700;}
/* 칸 아래 곁줄 — «몇 점 · 몇 틀림 · 오답 몇/몇». 숫자를 보러 온 자리라 작게 눌러 담는다. */
.app .sg .sg-sub{display:block;margin-top:3px;font-size:10px;line-height:1.5;color:var(--dim);
  font-family:JetBrains Mono,monospace;font-variant-numeric:tabular-nums;}
.app .sg .sg-sub b{font-weight:700;color:var(--sub);}
.app .sg .sg-sub.wait{color:var(--late);font-weight:600;}
.app .sg .sg-sub.ok{color:var(--ok);}
/* 곁줄이 붙으면서 칸이 세로로 길어진다 — 열 폭도 조금 넓혀야 «12틀림»이 안 접힌다. */
.app .sg-col{width:132px;}
/* ⚠ `.hwg-col b{display:block}`가 `.n` 안까지 닿아 「문항」과 「20」을 갈라놓고 있었다
   (2026-09-01 · C-15). 이 줄들은 인라인이어야 «20문항»이 한 덩이로 읽힌다. */
.app .sg-col .n .mono{display:inline;font-size:11px;font-weight:700;color:var(--sub);}
.app .sg-col .n .sg-tot{display:inline-block;margin-right:2px;}
/* 오른쪽 끝 «평균» 열 — 이름 열과 짝을 이뤄 표를 닫는다. */
.app .sg th.sg-avg,.app .sg td.sg-avg{width:74px;text-align:right;padding-right:12px;
  border-left:1px solid var(--line);background:var(--sunk);}
.app .sg th.sg-avg{vertical-align:bottom;}

/* 「시험 본 반과 날짜」 칩 — 왼쪽 목록에서 덜어 낸 것이 여기로 왔다.
   ⚠ 가로로 넘치면 «줄바꿈»한다. 가로 스크롤로 두면 뒤쪽 반이 있는지조차 모른다. */
.app .ex-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  margin-top:12px;flex-shrink:0;}
.app .ex-chip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--sub);transition:all var(--t);}
.app .ex-chip:hover{background:var(--hover);color:var(--ink);}
.app .ex-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.app .ex-chip s{text-decoration:none;font-size:11px;font-weight:400;color:var(--dim);}
.app .ex-chip.on s{color:rgba(255,255,255,.72);}

@media (max-width:1240px){ .app .ex-side{display:none;} }

/* 시험 성적판 (2026-08-29) — 표 서식은 .fm-panel 안에만 살아 있어서 여기서는 맨 표가 된다.
   같은 결로 한 벌 따로 둔다. 여기 표는 «칠 수 있는 칸»이라 줄 높이를 조금 넉넉히 준다. */
/* ⚠ 폭을 잡아 둔다 — 표를 화면 끝까지 늘리면 이름과 점수 칸이 멀리 떨어져
   «누구의 점수를 치고 있는지»가 안 보인다. 치는 표는 좁아야 한다. */
.app .es-tb{width:100%;max-width:560px;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.app .es-tb td:last-child,.app .es-tb th:last-child{width:74px;color:var(--dim);}
.app .es-tb th{height:30px;text-align:left;font-size:11px;font-weight:600;color:var(--dim);
  border-bottom:1px solid var(--line);padding:0 8px;white-space:nowrap;}
.app .es-tb td{height:40px;padding:0 8px;border-bottom:1px solid var(--line2);font-size:12.5px;}
.app .es-tb tr:hover td{background:var(--hover);}
.app .es-tb input{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12.5px;}
.app .es-tb input:focus{outline:none;border-color:var(--accent);}
/* 머리말 줄 — 「전체 저장」을 오른쪽 끝이 아니라 만점 바로 옆에 둔다. 둘은 한 동작이다. */
.app .es-head{display:flex;align-items:center;gap:10px;}

/* 문항 내용 — 원본과 변형을 «좌우»로 세운다.
   세로로 이어 붙이면 어디서 문항이 끝나고 다음이 시작하는지 안 보이고,
   무엇보다 «이 변형이 저 원본의 쌍둥이가 맞나»를 보려면 둘이 나란해야 한다
   (오답 검토 화면에서 2열로 간 것과 같은 이유다). */
.app .exq{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
  margin-bottom:12px;overflow:hidden;}
.app .exq-h{display:flex;align-items:center;gap:9px;padding:10px 14px;
  background:var(--note);border-bottom:1px solid var(--line);}
.app .exq-h .no{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--accent);}
.app .exq-h .ch{font-size:11.5px;color:var(--sub);}
.app .exq-b{display:flex;align-items:stretch;}
.app .exq-c{flex:1;min-width:0;padding:13px 15px;position:relative;}
/* 가운데 선. 세로로 접히면(좁은 화면) 가로선으로 바뀐다. */
.app .exq-c + .exq-c{border-left:1px solid var(--line);}
.app .exq-c .lb{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);
  margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em;}
.app .exq-c .tx{font-size:13px;line-height:1.85;white-space:pre-wrap;}
.app .exq-c .ans{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--sub);}
.app .exq-c .ans b{font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--ink);margin-left:5px;}
.app .exq-c.none{display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:12px;text-align:center;line-height:1.7;background:var(--paper);}
@media (max-width:900px){
  .app .exq-b{flex-direction:column;}
  .app .exq-c + .exq-c{border-left:0;border-top:1px solid var(--line);}
}
/* 문항에 딸린 그림. 시험지 탭과 검토 탭이 같은 모양으로 그린다 (pbImageHTML). */
.app .pb-fig{max-width:100%;max-height:260px;margin-top:10px;display:block;
  border:1px solid var(--line);border-radius:var(--r-md);}
/* figure.js가 그린 SVG. 사진과 달리 **벡터라 늘려도 안 뭉갠다** — 높이를 묶지 않는다.
   교사·학생 화면이 같이 쓰므로 .app 안에 가두지 않는다. currentColor를 쓰니 색은 글자색을 따른다. */
.pb-svg{margin-top:10px;padding:6px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--paper);overflow-x:auto;}
/* ⚠ 이 요소는 `.pb-fig pb-svg`로 같이 붙는다. 거기 걸린 `max-height:260px`를 풀어야 하는데,
   **`.pb-svg`(0,1,0)는 `.app .pb-fig`(0,2,0)를 못 이긴다** — 실제로 배포본에서 그림이
   260px로 잘려 나왔다. 선택자 무게를 맞춰서 «뒤에 온 쪽이 이기게» 한다.
   사진에 높이를 묶는 이유는 «원본이 얼마나 클지 모르기» 때문인데, 여기는 우리가 그린 것이다. */
.app .pb-svg{max-height:none;}
/* ⚠ `max-width:100%`만 두면 **열이 넓어져도 그림은 560px에서 멈춘다** (SVG의 width 속성).
   벡터라 늘려도 안 뭉개지므로 열을 채우게 한다 — 태블릿에서 이게 실제로 보이는 차이다. */
.pb-svg svg{width:100%;height:auto;display:block;margin:0 auto;color:var(--ink);}

/* 문제 안에 되살린 표 (problemHTML). 교사 화면과 학생 화면이 같이 쓴다 —
   그래서 .app 안에 가두지 않는다.

   ⚠ **머리줄을 칠하지 않는다.** 첫 행이 머리인지 알 방법이 없다 —
   조건 (가)(나)(다) 상자의 첫 줄까지 색이 들어가 «그 줄만 특별한 것»처럼 보였다.
   ⚠ **줄바꿈을 막지 않는다.** nowrap이면 긴 칸 하나가 가로로 쭉 늘어난다
   (증명 상자 한 칸에 361자가 든 문항이 그랬다). 폭에 맞춰 접는다. */
.pb-tbl{border-collapse:collapse;margin:9px 0;font-size:12.5px;max-width:100%;}
.pb-tbl td{padding:6px 11px;text-align:left;vertical-align:top;
  white-space:normal;word-break:break-word;line-height:1.75;}
/* 열이 하나뿐인 «상자»(조건·증명 상자)는 바깥 테두리만 두른다 — 줄마다 선을 그으면
   한 덩어리인 글이 표처럼 잘려 보인다. 폭을 채워야 긴 글이 제 자리에서 접힌다. */
.pb-tbl.box{width:100%;table-layout:fixed;border:1px solid var(--line);border-radius:var(--r-sm);}
.pb-tbl.box td{border:0;}
.pb-tbl.box tr + tr td{padding-top:0;}
/* 열이 둘 이상인 진짜 격자만 칸을 그린다 */
.pb-tbl.grid td{border:1px solid var(--line);}

/* ---------- 과제 제출 (학생앱 · 강사 검토 공용) ----------
   사진은 «증거»라 큰 것이 필요 없다. 줄로 세워 두고 누르면 크게 본다.
   폰에서도 좁아지지 않게 고정 크기 + 가로 스크롤로 둔다 — 접으면 줄 수가 들쭉날쭉해진다. */
.hw-shots{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:2px;}
