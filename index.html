<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김하현수학연구소 | 고등수학 전문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --paper:#F5F1EB;
    --paper-line:#EFE1E0;
    --ink:#3D3335;
    --ink-soft:#7D7274;
    --blue-deep:#AE4B53;
    --blue-deep-dark:#7C333A;
    --red-pen:#6E2A2F;
    --green-ok:#3F7A4D;
    --card-border:#E7DED9;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Noto Sans KR', sans-serif;
    line-height:1.6;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  h1,h2,h3,.serif{font-family:'Noto Serif KR', serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app{max-width:1080px;margin:0 auto;padding:0 24px 80px;}

  /* ---------- HEADER ---------- */
  .site-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0;border-bottom:2px solid var(--ink);
    flex-wrap:wrap;gap:12px;
  }
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo img{height:38px;width:auto;display:block;}
  .logo .sub{font-size:12px;color:var(--ink-soft);letter-spacing:.05em;border-left:1px solid var(--card-border);padding-left:10px;}
  nav.main-nav{display:flex;gap:22px;font-size:14px;font-weight:500;}
  nav.main-nav a{padding-bottom:2px;border-bottom:2px solid transparent;text-decoration:none;}
  nav.main-nav a:hover{border-color:var(--red-pen);}
  .header-actions{display:flex;gap:8px;align-items:center;}
  .notif-bell{position:relative;}
  .notif-bell-btn{position:relative;background:none;border:none;padding:4px;font-size:21px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red-pen);color:#fff;font-size:10px;font-weight:700;border-radius:20px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:'JetBrains Mono',monospace;}
  .notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--white);border:1px solid var(--card-border);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);min-width:220px;padding:6px;z-index:100;}
  .notif-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;}
  .notif-item:hover{background:#F6EFEE;}
  .notif-item-count{background:var(--red-pen);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px;font-family:'JetBrains Mono',monospace;}
  .notif-empty{padding:14px 10px;color:var(--ink-soft);font-size:13px;text-align:center;}
  .btn{
    border:1.5px solid var(--ink);background:var(--white);color:var(--ink);
    padding:9px 16px;font-size:13px;font-weight:700;border-radius:2px;
    transition:all .15s ease;
  }
  .btn:hover{background:var(--ink);color:var(--white);}
  .btn-primary{background:var(--blue-deep);border-color:var(--blue-deep);color:var(--white);}
  .btn-primary:hover{background:var(--blue-deep-dark);}
  .btn-red{border-color:var(--red-pen);color:var(--red-pen);}
  .btn-red:hover{background:var(--red-pen);color:var(--white);}
  .btn-small{padding:5px 10px;font-size:12px;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--card-border);color:var(--ink);}

  /* ---------- HERO ---------- */
  .hero{padding:64px 0 40px;display:flex;gap:40px;align-items:center;flex-wrap:wrap;}
  .hero-text{flex:1 1 380px;}
  .eyebrow{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;
    color:var(--red-pen);border:1px solid var(--red-pen);padding:3px 10px;border-radius:20px;
    margin-bottom:18px;
  }
  .hero h1{font-size:44px;line-height:1.3;margin:0 0 18px;font-weight:900;}
  .hero h1 .accent{color:var(--blue-deep);}
  .hero p.desc{color:var(--ink-soft);font-size:16px;max-width:480px;margin-bottom:26px;}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-visual{flex:1 1 320px;min-width:280px;}

  .hero-v2{
    background:var(--blue-deep);border-radius:14px;overflow:hidden;
    display:flex;align-items:stretch;min-height:440px;margin:28px 0 8px;
  }
  .hero-v2-text{flex:1 1 380px;padding:52px 44px;display:flex;flex-direction:column;justify-content:center;color:#fff;}
  .hero-v2-text .eyebrow{border-color:rgba(255,255,255,.35);color:#F0D2D0;}
  .hero-v2-text h1{color:#fff;font-size:38px;line-height:1.4;margin:0 0 20px;font-weight:900;}
  .hero-v2-text h1 .tag{background:var(--blue-deep);padding:2px 12px;border-radius:6px;display:inline-block;}
  .hero-v2-text p.desc{color:#C7C0C1;font-size:15px;max-width:420px;margin-bottom:28px;}
  .hero-v2-photo{flex:1 1 360px;min-width:260px;position:relative;background:var(--blue-deep);}
  .hero-v2-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
  .hero-v2-photo::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg, var(--blue-deep) 0%, rgba(174,75,83,0) 18%);
  }
  @media (max-width:760px){
    .hero-v2{flex-direction:column;min-height:0;}
    .hero-v2-photo{height:320px;order:-1;}
    .hero-v2-text{padding:32px 26px;}
    .hero-v2-text h1{font-size:30px;}
  }

  /* ---------- CHAPTER LABEL ---------- */
  .chapter{padding:70px 0;border-top:1px solid var(--card-border);}
  .chapter-label{
    display:flex;align-items:center;gap:14px;margin-bottom:8px;
  }
  .chapter-num{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;
    color:var(--white);background:var(--ink);padding:4px 10px;border-radius:2px;
  }
  .chapter-title-en{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .chapter h2{font-size:30px;margin:6px 0 34px;}

  /* ---------- ABOUT ---------- */
  .about-grid{display:flex;gap:36px;flex-wrap:wrap;}
  .about-photo{
    flex:0 0 220px;height:270px;background:var(--blue-deep);border-radius:4px;
    overflow:hidden;position:relative;
  }
  .about-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .career-list{list-style:none;padding:0;margin:22px 0 0;font-size:13px;color:var(--ink-soft);}
  .career-list li{padding:7px 0 7px 20px;border-left:2px solid var(--card-border);position:relative;}
  .career-list li::before{content:'';position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--blue-deep);}
  .career-list li.current{color:var(--ink);font-weight:700;}
  .career-list li.current::before{background:var(--red-pen);}
  .achieve-box{margin-top:22px;background:#FBF3F2;border:1px solid var(--card-border);border-radius:4px;padding:18px 20px;}
  .achieve-box h4{margin:0 0 10px;font-size:13px;color:var(--red-pen);font-family:'JetBrains Mono',monospace;letter-spacing:.03em;}
  .achieve-box ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink);}
  .achieve-box li{margin-bottom:5px;}
  .about-body{flex:1 1 320px;}
  .about-body p{margin:0 0 14px;}
  .stat-row{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap;}
  .stat{border-left:3px solid var(--red-pen);padding-left:12px;}
  .stat .num{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--blue-deep);}
  .stat .label{font-size:12px;color:var(--ink-soft);}

  /* ---------- CURRICULUM ---------- */
  .curri-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;}
  .curri-card{
    background:var(--white);border:1px solid var(--card-border);border-radius:4px;
    padding:22px;border-top:4px solid var(--blue-deep);
  }
  .curri-card h3{margin:0 0 8px;font-size:18px;}
  .curri-card .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--red-pen);}
  .curri-card ul{padding-left:18px;margin:12px 0 0;font-size:14px;color:var(--ink-soft);}

  /* ---------- SYSTEM PROMO ---------- */
  .system-box{
    background:var(--blue-deep);color:#fff;border-radius:6px;padding:40px;
    display:flex;gap:30px;flex-wrap:wrap;align-items:center;
  }
  .system-box .left{flex:1 1 320px;}
  .system-box h3{margin:0 0 12px;font-size:24px;}
  .system-box p{color:#F3DEDD;margin:0 0 20px;}
  .system-features{flex:1 1 280px;display:grid;gap:10px;font-size:14px;}
  .system-features div{display:flex;gap:8px;align-items:flex-start;}
  .system-features .dot{color:#FFCFC9;font-family:'JetBrains Mono',monospace;}

  /* ---------- REVIEWS ---------- */
  .review-marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);}
  .review-track{display:flex;gap:18px;width:max-content;animation:review-scroll 44s linear infinite;}
  .review-marquee:hover .review-track{animation-play-state:paused;}
  .review-track .review-card{flex:0 0 280px;}
  @keyframes review-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .review-card{background:var(--white);border:1px solid var(--card-border);padding:20px;border-radius:4px;position:relative;}
  .review-card .quote-mark{position:absolute;top:10px;right:16px;font-size:34px;color:var(--card-border);font-family:'Noto Serif KR',serif;}
  .review-card p{font-size:14px;margin:0 0 14px;}
  .review-card .who{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:8px;}
  .review-card .medal{background:var(--red-pen);color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;font-family:'Noto Sans KR',sans-serif;font-weight:700;}

  /* ---------- CONTACT ---------- */
  .contact-grid{display:flex;gap:40px;flex-wrap:wrap;}
  .contact-info{flex:1 1 260px;font-size:14px;color:var(--ink-soft);}
  .contact-info div{margin-bottom:10px;}
  .contact-info b{color:var(--ink);}
  .form-box{flex:1 1 340px;background:var(--white);border:1px solid var(--card-border);padding:24px;border-radius:4px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink-soft);}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--card-border);border-radius:3px;
    font-family:inherit;font-size:14px;background:#fff;
  }
  .field textarea{min-height:80px;resize:vertical;}

  footer{border-top:2px solid var(--ink);padding:28px 0;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  /* ---------- LOGIN ---------- */
  .login-wrap{max-width:420px;margin:60px auto;background:var(--white);border:1px solid var(--card-border);border-radius:16px;padding:36px;box-shadow:0 1px 3px rgba(61,51,53,.07),0 1px 2px rgba(61,51,53,.04);}
  .login-tabs{display:flex;border-bottom:1px solid var(--card-border);margin-bottom:24px;}
  .login-tab{flex:1;text-align:center;padding:10px;font-weight:700;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .login-tab.active{color:var(--blue-deep);border-color:var(--blue-deep);}
  .error-msg{color:var(--red-pen);font-size:13px;margin-top:10px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:14px;}

  /* ---------- DASHBOARD ---------- */
  .tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px;border-bottom:1px solid var(--card-border);padding-bottom:10px;}
  .tab-btn{
    border:1px solid var(--card-border);background:var(--white);padding:8px 14px;font-size:13px;
    border-radius:20px;font-weight:500;
  }
  .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .panel{background:var(--white);border:1px solid var(--card-border);border-radius:16px;padding:26px;margin-bottom:20px;box-shadow:0 1px 3px rgba(61,51,53,.07),0 1px 2px rgba(61,51,53,.04);}
  .panel h3{margin:0 0 18px;font-size:17px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid var(--card-border);padding:11px 14px;}
  table td{padding:13px 14px;border-bottom:1px solid #F0EEE7;}
  table tr:last-child td{border-bottom:none;}
  table tr:hover td{background:#FBFAF8;}
  .progress-outer{background:#EDEBE3;border-radius:20px;height:14px;overflow:hidden;margin:8px 0;}
  .progress-inner{background:var(--blue-deep);height:100%;border-radius:20px;}
  .video-gauge{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .video-gauge-emoji{font-size:17px;flex-shrink:0;}
  .video-gauge-bar{flex:1;height:10px;background:#EDEBE3;border-radius:20px;overflow:hidden;}
  .video-gauge-fill{height:100%;background:linear-gradient(90deg,#FFC97A,var(--blue-deep));border-radius:20px;transition:width .3s;}
  .video-gauge-pct{font-size:11.5px;color:var(--ink-soft);min-width:32px;text-align:right;flex-shrink:0;}
  .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;}
  .badge-ok{background:#E6F1E8;color:var(--green-ok);}
  .badge-no{background:#FBE9E7;color:var(--red-pen);}
  .badge-late{background:#FFF3D6;color:#9A7000;}
  .inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
  .inline-form .field{margin-bottom:0;min-width:110px;flex:1;}
  .empty{color:var(--ink-soft);font-size:13px;padding:14px 0;text-align:center;}
  .row-actions button{margin-right:4px;}
  select{cursor:pointer;}

  /* ---------- 상단 드롭다운 (학생 메뉴) ---------- */
  .nav-item{position:relative;}
  .nav-dropdown{
    display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);
    background:var(--white);border:1px solid var(--card-border);border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);padding:6px;min-width:170px;z-index:50;margin-top:10px;
  }
  .nav-item:hover .nav-dropdown{display:block;}
  .nav-dropdown a{
    display:block;padding:9px 12px;font-size:13px;border-radius:4px;white-space:nowrap;text-decoration:none;
  }
  .nav-dropdown a:hover{background:#F6EFEE;color:var(--blue-deep);}

  /* ---------- 강사(관리자) 사이드바 레이아웃 ---------- */
  .teacher-layout{display:flex;gap:0;align-items:flex-start;}
  .teacher-sidebar{
    width:168px;flex-shrink:0;background:var(--ink);border-radius:16px 0 0 16px;
    padding:14px 0;position:sticky;top:20px;
  }
  .side-btn{
    display:block;width:100%;text-align:left;background:none;border:none;color:#CFC6C7;
    padding:11px 20px;font-size:13px;cursor:pointer;font-family:inherit;border-left:3px solid transparent;
  }
  .side-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .side-btn.active{background:rgba(174,75,83,.25);color:#fff;font-weight:700;border-left-color:var(--blue-deep);}
  .side-group-label{font-size:10px;color:#8A8384;text-transform:uppercase;letter-spacing:.08em;padding:14px 20px 4px;font-family:'JetBrains Mono',monospace;}
  .teacher-main{flex:1;min-width:0;background:transparent;padding:0 0 0 20px;}
  @media (max-width:800px){
    .teacher-layout{flex-direction:column;}
    .teacher-sidebar{width:100%;border-radius:16px;position:static;display:flex;flex-wrap:wrap;padding:8px;}
    .side-btn{width:auto;border-left:none;border-radius:20px;padding:7px 14px;}
    .side-btn.active{border-left:none;}
    .teacher-main{padding:20px 0 0;}
  }

  /* ---------- 학생 상세 (성적/진도/출석 드릴다운) ---------- */
  .student-detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .subtab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .subtab-btn{border:1px solid var(--card-border);background:var(--white);padding:6px 12px;font-size:12px;border-radius:16px;}
  .subtab-btn.active{background:var(--blue-deep);color:#fff;border-color:var(--blue-deep);}

  /* ---------- 데일리퀴즈 ---------- */
  .quiz-card{border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:12px;background:#FBFAF8;box-shadow:0 1px 3px rgba(61,51,53,.07),0 1px 2px rgba(61,51,53,.04);}
  .quiz-card .quiz-meta{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
  .quiz-card .quiz-title{font-weight:700;margin-bottom:6px;}
  .quiz-card .quiz-content{font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;}
  .quiz-answer-box{margin-top:10px;padding-top:10px;border-top:1px dashed var(--card-border);}

  /* ---------- 클리닉 ---------- */
  .clinic-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F0EEE7;gap:10px;flex-wrap:wrap;}
  .status-pill{font-size:11px;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;}
  .status-대기{background:#FFF3D6;color:#9A7000;}
  .status-승인{background:#E6F1E8;color:var(--green-ok);}
  .status-완료{background:#EDEBE3;color:var(--ink-soft);}

  /* ---------- 질의응답 ---------- */
  .qna-card{border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(61,51,53,.07),0 1px 2px rgba(61,51,53,.04);}
  .qna-q{font-weight:700;margin-bottom:4px;}
  .qna-meta{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-bottom:8px;}
  .qna-answer{margin-top:10px;padding:10px 12px;background:#FBF3F2;border-radius:4px;font-size:13.5px;}
  .qna-answer .label{font-size:11px;color:var(--red-pen);font-weight:700;margin-bottom:4px;font-family:'JetBrains Mono',monospace;}
  .qna-noanswer{margin-top:10px;font-size:12.5px;color:var(--ink-soft);font-style:italic;}

  /* ---------- 채팅 ---------- */
  .chat-window{border:1px solid var(--card-border);border-radius:4px;height:340px;overflow-y:auto;padding:14px;background:#FBFAF8;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
  .chat-bubble{max-width:70%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;}
  .chat-bubble.from-teacher{background:var(--blue-deep);color:#fff;align-self:flex-start;border-bottom-left-radius:2px;}
  .chat-bubble.from-student{background:#fff;border:1px solid var(--card-border);align-self:flex-end;border-bottom-right-radius:2px;}
  .chat-bubble .chat-time{display:block;font-size:10px;opacity:.7;margin-top:3px;font-family:'JetBrains Mono',monospace;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;}

  /* ---------- 영상 ---------- */
  .video-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0EEE7;gap:10px;flex-wrap:wrap;}
  .video-row .vtitle{font-weight:700;font-size:14px;}
  .video-row .vunit{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}

  /* ---------- 영상 임베드 ---------- */
  .video-embed-card{border:1px solid var(--card-border);border-radius:16px;padding:14px;margin-bottom:16px;background:#FBFAF8;box-shadow:0 1px 3px rgba(61,51,53,.07),0 1px 2px rgba(61,51,53,.04);}
  .video-embed-card .vtitle{font-weight:700;margin-bottom:2px;}
  .video-embed-card .vunit{margin-bottom:10px;}
  .video-embed-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:4px;overflow:hidden;background:#000;}
  .video-embed-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .video-embed-warn{font-size:12px;color:var(--red-pen);padding:10px;background:#FBF3F2;border-radius:4px;}

  /* ---------- 시험지 관리 ---------- */
  .qrow{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F0EEE7;}

<script>
/* =================== 저장소 유틸 (Firebase Firestore) =================== */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
async function dbGet(key, fallback){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
    if(res.status === 404) return fallback;
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    return JSON.parse(doc.fields.value.stringValue);
  }catch(e){ console.error('불러오기 실패', key, e); return fallback; }
}
async function dbSet(key, value){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(value) } } })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    return true;
  }
  catch(e){ console.error('저장 실패', key, e); return null; }
}
async function dbDelete(key){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', key, e); }
}

/* =================== AI 쌍둥이 문제 생성 (일 20건 한도) =================== */
function todayStr(){ return new Date().toISOString().slice(0,10); }
async function getAIQuotaUsed(){
  const q = await dbGet('ai-quota', { date: todayStr(), count: 0 });
  if(q.date !== todayStr()) return 0;
  return q.count;
}
async function bumpAIQuotaUsed(){
  const used = await getAIQuotaUsed();
  await dbSet('ai-quota', { date: todayStr(), count: used + 1 });
}
async function loadAIQuotaIfNeeded(){
  if(state.aiQuotaUsed !== null) return;
  state.aiQuotaUsed = await getAIQuotaUsed();
  render();
}
async function regenerateOneWithAI(bankId){
  if(state.aiProcessing){ showToast('다른 AI 작업이 진행 중입니다. 끝난 뒤 다시 시도해주세요.'); return; }
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b) return;
  const used = await getAIQuotaUsed();
  if(used >= AI_DAILY_LIMIT){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  state.aiProcessing = true;
  state.aiRegeneratingId = bankId;
  render();
  const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
  const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
  if(twin){
    b.variantContent = twin.content;
    b.variantAnswer = twin.answer;
    b.aiSolution = twin.solution;
    b.status = 'pending';
    await dbSet('problem-bank', DATA.problemBank);
    await bumpAIQuotaUsed();
    state.aiQuotaUsed = null;
    showToast('다시 생성했습니다. 검토 상태가 초기화됐어요.');
  } else {
    showToast('생성에 실패했습니다. 잠시 후 다시 시도해주세요.');
  }
  state.aiProcessing = false;
  state.aiRegeneratingId = null;
  render();
}
async function processAIQueue(){
  if(state.aiProcessing) return;
  const needsAI = DATA.problemBank.filter(b=>!b.variantContent && !b.variantAnswer);
  if(needsAI.length===0){ showToast('생성할 문항이 없습니다.'); return; }
  const used = await getAIQuotaUsed();
  const remaining = AI_DAILY_LIMIT - used;
  if(remaining<=0){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  const batch = needsAI.slice(0, remaining);
  state.aiProcessing = true;
  state.aiProgress = { done:0, total: batch.length };
  render();
  let ok = 0;
  for(let i=0;i<batch.length;i++){
    const b = batch[i];
    const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
    const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
    if(twin){
      b.variantContent = twin.content;
      b.variantAnswer = twin.answer;
      b.aiSolution = twin.solution;
      await bumpAIQuotaUsed();
      ok++;
    }
    await dbSet('problem-bank', DATA.problemBank);
    state.aiProgress = { done:i+1, total: batch.length };
    render();
    if(i < batch.length-1) await new Promise(r=>setTimeout(r, 13000));
  }
  state.aiProcessing = false;
  state.aiProgress = null;
  state.aiQuotaUsed = null;
  const leftover = needsAI.length - batch.length;
  showToast(ok + '개 쌍둥이 문제가 생성되었습니다. 검토 후 공개해주세요.' + (leftover>0 ? ` (남은 ${leftover}개는 내일 한도 초기화 후 처리해주세요)` : ''));
  render();
}
// AI가 프롬프트 지시를 놓쳐서 "times"/"le"/"ge" 같은 영단어를 LaTeX 명령어 대신 그대로
// 쓰는 경우가 있어서(프롬프트 개선과 별개로) 이중 안전장치로 한 번 더 다듬는다.
function sanitizeAiMathText(s){
  if(!s) return s;
  return s
    .replace(/(?<!\\)\btimes\b/gi, '\\times')
    .replace(/(?<!\\)\bLEQ\b/gi, '\\leq')
    .replace(/(?<!\\)\bGEQ\b/gi, '\\geq');
}
async function generateTwinViaAI(content, answer, image){
  try{
    const res = await withTimeout(fetch(AI_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Site-Token': AI_SITE_TOKEN },
      body: JSON.stringify({ content, answer, image: image || undefined })
    }), 30000);
    if(!res.ok) throw new Error('worker http ' + res.status);
    const data = await res.json();
    if(!data.content || !data.answer) throw new Error('incomplete AI result');
    return {
      content: sanitizeAiMathText(data.content),
      answer: sanitizeAiMathText(data.answer),
      solution: data.solution || ''
    };
  }catch(e){
    console.error('AI 쌍둥이 생성 실패', e);
    return null;
  }
}

/* =================== Firestore 컬렉션(문서 여러 개) 헬퍼 =================== */
/* kv 방식(단일 문서에 큰 JSON 저장)은 대량 데이터에는 안 맞아서, 문항 창고처럼
   개수가 많이 늘어날 수 있는 데이터는 문서를 하나씩 따로 저장하는 이 방식을 쓴다. */
function toFirestoreFields(obj){
  const fields = {};
  for(const k in obj){ fields[k] = { stringValue: String(obj[k] ?? '') }; }
  return fields;
}
function fromFirestoreDoc(doc){
  const obj = { id: doc.name.split('/').pop() };
  const fields = doc.fields || {};
  for(const k in fields){ obj[k] = fields[k].stringValue ?? ''; }
  return obj;
}
async function collectionAdd(collectionName, data){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: toFirestoreFields(data) })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    return fromFirestoreDoc(doc);
  }catch(e){ console.error('추가 실패', collectionName, e); return null; }
}
async function collectionListAll(collectionName){
  const out = [];
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    let pageToken = '';
    do{
      const url = FIRESTORE_ROOT + '/' + collectionName + '?pageSize=300' + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await withTimeout(fetch(url, { headers: { Authorization: 'Bearer ' + token } }), 8000);
      if(!res.ok) throw new Error('firestore http ' + res.status);
      const data = await res.json();
      (data.documents || []).forEach(doc => out.push(fromFirestoreDoc(doc)));
      pageToken = data.nextPageToken || '';
    } while(pageToken);
  }catch(e){ console.error('목록 조회 실패', collectionName, e); }
  return out;
}
async function collectionDelete(collectionName, id){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName + '/' + id, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', collectionName, e); }
}

const SESSION_KEY = 'khm-session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(state.currentUser)); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
async function restoreSession(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ saved = null; }
  if(!saved || !saved.type) return;
  if(saved.type==='teacher'){
    state.currentUser = {type:'teacher'};
    state.view = 'teacher';
  } else if(saved.type==='student'){
    const found = DATA.students.find(s=>s.studentId===saved.studentId);
    if(!found){ clearSession(); return; }
    state.currentUser = {type:'student', studentId:found.studentId, name:found.name};
    state.view = 'student';
    await loadRecord(found.studentId);
  }
}

/* =================== 영상 (부교재 해설강의) =================== */
function extractYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/watch\?[^#]*v=([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{6,15})/
  ];
  for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
  return null;
}
// 유튜브 iframe에 sandbox를 걸어서(allow-popups/allow-top-navigation 없음) 제목표시줄/로고를
// 눌러도 유튜브로 이동하지 못하게 막는다. enablejsapi=1을 켜서 시청 진도율 추적에도 쓴다.
function videoEmbedHTML(v, forStudent){
  const vid = extractYouTubeId(v.url);
  const iframeId = 'yt-frame-' + v.id;
  let player;
  if(vid){
    const src = 'https://www.youtube-nocookie.com/embed/' + vid +
      '?enablejsapi=1&modestbranding=1&rel=0&iv_load_policy=3&origin=' + encodeURIComponent(location.origin);
    player = `<div class="video-embed-wrap"><iframe id="${iframeId}" class="yt-tracked-frame" data-bank-vid="${v.id}" src="${src}" title="${escHtml(v.title)}"
      sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
  } else {
    player = `<div class="video-embed-warn">유튜브 링크 형식을 인식하지 못했습니다. youtube.com 또는 youtu.be 링크인지 확인해주세요.</div>`;
  }
  return `<div class="video-embed-card">
    <div class="vtitle">${escHtml(v.title)}</div>

    ${forStudent && vid ? `<div id="vprog-${v.id}">${videoProgressBlockHTML(forStudent, v.id)}</div>` : ''}

}
/* ---------- 유튜브 시청 진도율 추적 ---------- */
// render()가 app.innerHTML을 통째로 새로 그리기 때문에, 재생 중 다른 이유로 render()가
// 다시 호출되면 iframe이 새로 만들어지면서 재생 위치가 초기화된다. 진도율 저장 자체는
// render()를 부르지 않도록 해서(=재생 화면을 다시 그리지 않도록) 이 문제를 최대한 피한다.
let ytApiLoading = false;
function ensureYouTubeAPI(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  if(!state.ytReadyCallbacks) state.ytReadyCallbacks = [];
  state.ytReadyCallbacks.push(cb);
  if(ytApiLoading) return;
  ytApiLoading = true;
  window.onYouTubeIframeAPIReady = function(){
    (state.ytReadyCallbacks||[]).forEach(fn=>fn());
    state.ytReadyCallbacks = [];
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
// 재생바 위치(getCurrentTime)가 아니라 "실제로 재생 상태였던 시간(벽시계 기준)"을 누적한다.
// 재생바 위치만 보면 끝부분으로 스킵만 해도 시청 완료로 잡히기 때문에, PLAYING 상태로
// 실제 흘러간 시간만 더하는 방식으로 바꿨다 — 스킵/탐색 자체는 시간을 늘리지 않는다.
async function noteVideoWatchTime(studentId, videoId, addSeconds, duration, ended){
  if(!duration || duration<=0) return;
  const rec = await loadRecord(studentId);
  const prev = rec.videoProgress[videoId] || {watchedSeconds:0, duration:0, percent:0, completed:false};
  const prevWatched = prev.watchedSeconds!==undefined ? prev.watchedSeconds : (prev.maxSeconds||0);
  const watchedSeconds = Math.min(duration, prevWatched + Math.max(0, addSeconds));
  const percent = Math.min(100, Math.round(watchedSeconds/duration*150));
  rec.videoProgress[videoId] = {
    watchedSeconds, duration, percent,
    completed: prev.completed || ended || percent>=95,
    updatedAt: new Date().toISOString()
  };
  await saveRecord(studentId);
  const label = document.getElementById('vprog-'+videoId);
  if(label) label.innerHTML = videoProgressBlockHTML(studentId, videoId);
}
function videoProgressGaugeHTML(percent, completed){
  const pct = Math.max(0, Math.min(100, percent||0));
  const milestone = completed || pct>=100 ? '🎉' : pct>=75 ? '⭐' : pct>=50 ? '🔥' : pct>=25 ? '🌿' : '🌱';
  return `<div class="video-gauge">
    <span class="video-gauge-emoji">${milestone}</span>
    <div class="video-gauge-bar"><div class="video-gauge-fill" style="width:${pct}%;"></div></div>
    <span class="video-gauge-pct mono">${pct}%</span>
  </div>`;
}
function videoProgressBlockHTML(studentId, videoId){
  const rec = DATA.records[studentId];
  const p = rec && rec.videoProgress && rec.videoProgress[videoId];
  if(!p) return '<div class="hint" style="margin-top:6px;">아직 시청 기록이 없습니다.</div>';
  const caption = (p.completed ? '시청 완료' : '시청 중') + ' · 최근 시청 ' + (p.updatedAt||'').slice(0,10);
  return videoProgressGaugeHTML(p.percent, p.completed) + `<div class="mono" style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${caption}</div>`;
}
// 재생 중이던 구간의 벽시계 경과 시간을 정산해서 누적한다(멈춤/종료/화면전환 시 남은 조각까지 반영).
function flushWatchTick(entry, studentId, videoId, player, ended){
  if(entry.lastTick==null) return;
  const now = Date.now();
  const elapsed = Math.min(20, Math.max(0, (now-entry.lastTick)/1000)); // 백그라운드 탭 등으로 타이머가 밀려도 과도하게 잡히지 않도록 상한
  entry.lastTick = null;
  try{
    const dur = player.getDuration();
    noteVideoWatchTime(studentId, videoId, elapsed, dur, ended);
  }catch(err){}
}
// 학생이 '부교재 해설강의' 탭에 있을 때만 실제 유튜브 플레이어를 붙여서 재생 상태를 감시한다.
function mountVideoTrackers(studentId){
  const frames = document.querySelectorAll('.yt-tracked-frame[data-bank-vid]');
  if(frames.length===0) return;
  ensureYouTubeAPI(() => {
    if(!state.ytPlayers) state.ytPlayers = {};
    frames.forEach(frame => {
      const videoId = frame.dataset.bankVid;
      if(state.ytPlayers[videoId]) return; // 이미 이 화면에서 연결됨
      let player;
      try{
        player = new YT.Player(frame.id, {
          events: {
            onStateChange: (e) => {
              const entry = state.ytPlayers[videoId];
              if(!entry) return;
              if(e.data === YT.PlayerState.PLAYING){
                entry.lastTick = Date.now();
                if(entry.timer) clearInterval(entry.timer);
                entry.timer = setInterval(() => {
                  const now = Date.now();
                  const elapsed = Math.min(10, Math.max(0, (now-entry.lastTick)/1000));
                  entry.lastTick = now;
                  try{
                    const dur = player.getDuration();
                    noteVideoWatchTime(studentId, videoId, elapsed, dur, false);
                  }catch(err){}
                }, 5000);
              } else {
                if(entry.timer){ clearInterval(entry.timer); entry.timer = null; }
                flushWatchTick(entry, studentId, videoId, player, e.data===YT.PlayerState.ENDED);
              }
            }
          }
        });
      }catch(err){ return; }
      state.ytPlayers[videoId] = { player, timer: null };
    });
  });
}

let examDraft = { classId:'', title:'', date:'', questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };

function compressImageToBase64(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}

          ${statusLabel ? `<span class="review-status review-status-${bank.status}">${statusLabel}</span>` : ''}</div>
        <div style="font-size:13.5px;white-space:pre-wrap;margin-top:4px;">${escHtml(q.content)}</div>
        <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-top:4px;">정답: ${escHtml(q.answer)}</div>
        ${bank && (bank.variantContent||bank.variantAnswer) ? `<div class="exam-variant-box">
          <div class="mono" style="font-size:11px;color:var(--red-pen);margin-bottom:4px;">변형 문제</div>
          <div style="font-size:13px;white-space:pre-wrap;">${escHtml(bank.variantContent||'')}</div>

}

function syncExamDraftFromDOM(){
  const cEl = document.getElementById('exam-class');
  const tEl = document.getElementById('exam-title');
  const dEl = document.getElementById('exam-date');
  if(cEl) examDraft.classId = cEl.value;
  if(tEl) examDraft.title = tEl.value;
  if(dEl) examDraft.date = dEl.value;
  examDraft.questions.forEach((q,i)=>{
    const c = document.getElementById('eq-content-'+i);
    const a = document.getElementById('eq-answer-'+i);
    const u = document.getElementById('eq-unit-'+i);
    if(c) q.content = c.value;
    if(a) q.answer = a.value;

async function saveExam(){
  syncExamDraftFromDOM();
  if(!examDraft.title || !examDraft.classId){ showToast('반과 시험명을 입력해주세요.'); return; }
  const validQuestions = examDraft.questions.filter(q=>q.content.trim() && q.answer.trim());
  if(validQuestions.length===0){ showToast('문항을 최소 1개 이상 입력해주세요.'); return; }
  const totalPageChars = examDraft.pages.reduce((sum,p)=>sum+p.length, 0);
  if(totalPageChars > 900000){
    showToast('첨부한 이미지 용량이 너무 큽니다. 장수를 줄이거나 더 작은 사진으로 다시 첨부해주세요.');
    return;
  }
  // exams/problem-bank는 계속 누적되는 단일 문서라 이미지를 그대로 넣으면 용량
  // 제한에 걸릴 수 있다. 문항 이미지는 problem-bank 항목마다 별도 문서(pbimg:id)로 저장하고,
  // 본 배열에는 hasImage 표시만 남긴다.
  const questions = validQuestions.map((q,i)=>({no:i+1, content:q.content.trim(), answer:q.answer.trim(), unit:q.unit||''}));
  const examId = 'ex'+Date.now();
  DATA.exams.unshift({id:examId, classId:examDraft.classId, title:examDraft.title, date:examDraft.date, questions, hasFiles:examDraft.pages.length>0});
  await dbSet('exams', DATA.exams);
  if(examDraft.pages.length>0){
    await dbSet('examfiles:'+examId, examDraft.pages);
  }
  for(let i=0;i<questions.length;i++){
    const q = questions[i];
    const srcImage = validQuestions[i].image;
    const bankId = 'pb'+Date.now()+'_'+q.no;
    DATA.problemBank.push({
      id:bankId, examId, questionNo:q.no,
      originalContent:q.content, originalAnswer:q.answer,
      variantContent:'', variantAnswer:'', status:'pending',
      hasImage: !!srcImage
    });
    if(srcImage) await dbSet('pbimg:'+bankId, srcImage);
  }
  await dbSet('problem-bank', DATA.problemBank);
  examDraft = { classId:'', title:'', date:'', questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };
  showToast('시험지가 등록되었습니다. 오답 문제 검토 탭에서 AI 쌍둥이 문제를 생성해보세요.');
  render();
}
async function deleteExam(examId){
  if(!confirm('이 시험지를 삭제할까요? 관련 오답 문제 DB는 유지됩니다.')) return;
  DATA.exams = DATA.exams.filter(e=>e.id!==examId);

/* =================== 학생 오답 제출 =================== */
// 시험 선택 + 틀린 문항 체크 + 제출 위젯. "오답숙제" 탭과 홈 화면의 "빠른 변형 문제 요청" 카드에서 공용으로 쓴다.
function wrongSubmitWidgetHTML(myExams){
  const selectedExam = myExams.find(e=>e.id===state.wrongExamId);

  return `
    <div class="field" style="max-width:320px;">

      <select onchange="state.wrongExamId=this.value; state.wrongChecked={}; render()">
        <option value="">-- 선택 --</option>
        ${myExams.map(e=>`<option value="${e.id}" ${state.wrongExamId===e.id?'selected':''}>${escHtml(e.title)} (${e.date||'-'})</option>`).join('')}
      </select>
    </div>
    ${selectedExam ? `
    <p class="hint">틀린 문제 번호를 모두 선택해주세요.</p>
    <div class="wrong-check-grid">
      ${selectedExam.questions.map(q=>`
        <label class="wrong-check-item ${state.wrongChecked[q.no]?'checked':''}" onclick="event.preventDefault(); toggleWrongCheck(${q.no})">

        </label>`).join('')}

    ` : ''}

function toggleWrongCheck(no){
  state.wrongChecked[no] = !state.wrongChecked[no];
  render();
}
async function submitWrongAnswers(){
  const examId = state.wrongExamId;
  const exam = DATA.exams.find(e=>e.id===examId);
  if(!exam){ showToast('시험지를 선택해주세요.'); return; }
  const wrongNos = Object.keys(state.wrongChecked).filter(k=>state.wrongChecked[k]).map(k=>parseInt(k));
  if(wrongNos.length===0){ showToast('틀린 문제 번호를 선택해주세요.'); return; }
  await loadUnitBankIfNeeded();
  const sid = state.currentUser.studentId;
  const rec = await loadRecord(sid);
  let matchedFromBank = 0, newlyRequested = 0;
  for(const no of wrongNos){
    let bank = findBankEntry(examId, no);
    if(!bank){
      const q = exam.questions.find(q=>q.no===no);
      if(!q) continue;
      const candidates = q.unit ? DATA.unitBank.filter(u=>u.unit===q.unit) : [];
      const match = candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : null;
      if(match){
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: match.content, variantAnswer: match.answer,
          status:'approved', source:'unitbank', unitBankId: match.id
        };
        matchedFromBank++;
      } else {
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: '', variantAnswer: '',
          status:'pending'
        };
        newlyRequested++;
      }
      DATA.problemBank.push(bank);
      await dbSet('problem-bank', DATA.problemBank);
    }
    if(!rec.wrongHomework.some(h=>h.bankId===bank.id)){
      rec.wrongHomework.push({bankId:bank.id, examId, questionNo:no, assignedAt:new Date().toISOString().slice(0,10), done:false, studentAnswer:''});
    }
  }
  await saveRecord(sid);
  state.wrongChecked = {};
  let msg = '제출되었습니다.';
  if(matchedFromBank>0 && newlyRequested>0) msg = `제출되었습니다. ${matchedFromBank}개는 바로 숙제로 나갔고, ${newlyRequested}개는 선생님이 등록하면 나갑니다.`;
  else if(matchedFromBank>0) msg = '제출되었습니다. 문항 창고에서 바로 숙제로 나갔습니다.';
  else if(newlyRequested>0) msg = '제출되었습니다. 선생님이 쌍둥이 문제를 등록하면 숙제로 나갑니다.';
  showToast(msg);
  render();
}
async function submitHomeworkAnswer(bankId){
  const sid = state.currentUser.studentId;
  const rec = await loadRecord(sid);
  const hw = rec.wrongHomework.find(h=>h.bankId===bankId);
  if(!hw) return;
  const val = document.getElementById('hw-answer-'+bankId).value.trim();
  if(!val){ showToast('답을 입력해주세요.'); return; }
  hw.studentAnswer = val;
  hw.done = true;
  await saveRecord(sid);
  render();
}

async function loadAllRecordsIfNeeded(){

// 문항 하나를 몇 명의 학생이 오답으로 제출했는지 센다 (제출 현황/검토 화면에서 재사용).
function bankRequesterCount(bankId){
  let n = 0;
  for(const sid in state.allRecords){
    if((state.allRecords[sid].wrongHomework||[]).some(h=>h.bankId===bankId)) n++;
  }
  return n;

      <div class="field"><label>반 필터</label><select onchange="state.submissionsFilter=this.value; render()">
        <option value="">전체</option>

      </select></div>

    ${rows.length===0 ? '<div class="empty">아직 오답 숙제를 제출한 학생이 없습니다.</div>' : `
    <table>
      <tr><th>학생</th><th>반</th><th>배정</th><th>제출</th><th>정답</th><th></th></tr>
      ${rows.map(r=>`<tr>
        <td>${r.student.name}</td>

        <td>${r.done} / ${r.total}</td>
        <td>${r.correct} / ${r.done}</td>
        <td><button class="btn btn-small" onclick="state.submissionDetailId = state.submissionDetailId==='${r.student.studentId}' ? null : '${r.student.studentId}'; render()">${state.submissionDetailId===r.student.studentId?'닫기':'상세보기'}</button></td>
      </tr>

// 문제/답안/후기 등 사용자가 입력한 텍스트를 그대로 innerHTML에 넣으면 "<", ">"가
// 태그로 해석되어 레이아웃이 깨진다 (예: 부등식 "g(x)<f(x)<0"). HTML로 렌더링되기 전에
// 항상 이 함수를 거쳐서 특수문자를 이스케이프한다.
function escHtml(s){
  if(s===null || s===undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const HP_NS = 'http://www.hancom.co.kr/hwpml/2011/paragraph';
// 한글 수식 스크립트를 KaTeX가 그릴 수 있는 LaTeX로 변환하고 $..$ 로 감싼다.
// (완벽한 변환기는 아니고, 고등수학에서 자주 쓰는 패턴 위주로 처리한다)
// 문자열에서 openIdx가 가리키는 '{'와 짝이 맞는 ')'를 중첩까지 고려해서 찾는다.
// (예: sqrt{ ( x ^{2} ) ^{2} }처럼 안에 또 중괄호가 있는 경우 단순 정규식으론 못 잡음)
function findMatchingBrace(s, openIdx){
  let depth = 0;
  for(let i=openIdx;i<s.length;i++){
    if(s[i]==='{') depth++;
    else if(s[i]==='}'){ depth--; if(depth===0) return i; }
  }
  return -1;
}
// keyword 뒤의 "{...}"를 중첩 중괄호까지 포함해서 통째로 찾아 wrap(inner)로 치환한다.
function replaceBalancedKeyword(s, keyword, wrap){
  const re = new RegExp('\\b'+keyword+'\\s*\\{','g');
  let result = '', lastIndex = 0, m;
  while((m = re.exec(s))){
    const openIdx = m.index + m[0].length - 1;
    const closeIdx = findMatchingBrace(s, openIdx);
    if(closeIdx===-1) continue;
    const inner = s.slice(openIdx+1, closeIdx);
    result += s.slice(lastIndex, m.index) + wrap(inner);
    lastIndex = closeIdx+1;
    re.lastIndex = closeIdx+1;
  }
  result += s.slice(lastIndex);
  return result;
}
// "{분자} over {분모}"를 \frac{}{}로 바꾼다. 분자/분모 안에 또 중괄호(예: 지수)가 있어도
// 괄호 짝을 직접 세어가며 찾기 때문에 중첩된 경우도 정확히 처리되고, 재귀적으로 안쪽도 변환한다.
function convertOverToFrac(s){
  let result = '', i = 0;
  while(i < s.length){
    if(s[i]==='{'){
      const close1 = findMatchingBrace(s, i);
      if(close1!==-1){
        let j = close1+1;
        while(s[j]===' ') j++;
        if(s.slice(j,j+4)==='over'){
          let k = j+4;
          while(s[k]===' ') k++;
          if(s[k]==='{'){
            const close2 = findMatchingBrace(s, k);
            if(close2!==-1){
              const num = convertOverToFrac(s.slice(i+1, close1));
              const den = convertOverToFrac(s.slice(k+1, close2));
              result += '\\frac{'+num+'}{'+den+'}';
              i = close2+1;
              continue;
            }
          }
        }
      }
    }
    result += s[i];
    i++;
  }
  return result;
}
function convertHwpEq(script){
  let s = script || '';
  if(!s.trim()) return '';
  s = s.replace(/`/g, '');
  s = s.replace(/\brm\s*/g, '');
  // "it"(이탤릭 지정)은 rm과 같은 서체 지정 명령이라 내용만 남기고 지운다.
  // "it2r+3"(공백 없음), "it r ^{2}"(공백 있음) 둘 다 나오므로 뒤 공백까지 함께 지운다.
  s = s.replace(/\bit\s*(?=[0-9a-zA-Z(])/g, '');
  s = replaceBalancedKeyword(s, 'pmatrix', inner => '\\begin{pmatrix}' + inner.replace(/#/g,'\\\\') + '\\end{pmatrix}');
  s = replaceBalancedKeyword(s, 'cases', inner => '\\begin{cases}' + inner.replace(/#/g,'\\\\') + '\\end{cases}');
  const greek = {alpha:'\\alpha',beta:'\\beta',gamma:'\\gamma',delta:'\\delta',theta:'\\theta',pi:'\\pi',lambda:'\\lambda',mu:'\\mu',sigma:'\\sigma',phi:'\\phi',omega:'\\omega'};
  for(const k in greek) s = s.replace(new RegExp('\\b'+k+'\\b','g'), greek[k]);
  // le/ge/LEQ 등은 it과 마찬가지로 뒤에 공백 없이 숫자가 바로 붙는 경우(le5)가 있어
  // 뒤쪽 \b는 안 쓰고 시작 위치만 단어 경계로 확인한다. 방금 만든 "\leq"의 "le"를
  // 다시 건드리지 않도록(무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = s.replace(/(?<!\\)\bLEQ/gi, '\\leq').replace(/(?<!\\)\bGEQ/gi, '\\geq').replace(/(?<!\\)\bNEQ/gi, '\\neq');
  s = s.replace(/(?<!\\)\ble/g, '\\leq').replace(/(?<!\\)\bge/g, '\\geq');
  s = s.replace(/\bTIMES\b/gi, '\\times');
  // angle/bar는 "angle{BAD}"(중괄호), "angle BAD"(공백), "angleBAD"(붙여쓰기) 세 가지 형태가
  // 모두 나오므로 각각 처리한다. 방금 만든 "\angle"/"\overline"을 다시 건드리지 않도록
  // (무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = replaceBalancedKeyword(s, 'angle', inner => '\\angle ' + inner);
  s = s.replace(/(?<!\\)\bangle\s+([A-Za-z]+)\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle([A-Z]{1,3})\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle\b/g, '\\angle');
  s = replaceBalancedKeyword(s, 'bar', inner => '\\overline{' + inner + '}');
  s = s.replace(/(?<!\\)\bbar\s+([A-Za-z]+)\b/g, '\\overline{$1}');
  s = s.replace(/(?<!\\)\bbar([A-Z]{1,3})\b/g, '\\overline{$1}');
  s = s.replace(/LEFT\s*\(/g, '\\left(').replace(/RIGHT\s*\)/g, '\\right)');
  s = convertOverToFrac(s);
  s = replaceBalancedKeyword(s, 'sqrt', inner => '\\sqrt{' + inner + '}');
  // 첨자가 여러 글자인데 중괄호 없이 붙어있으면(a_11 등) LaTeX에서 첫 글자만
  // 첨자로 처리되어 깨지므로, 중괄호로 다시 감싸준다.
  s = s.replace(/([_^])(?!\{)([0-9a-zA-Z]+)/g, '$1{$2}');
  s = s.replace(/\s+/g, ' ').trim();
  return s ? '$' + s + '$' : '';
}
// 수식 개체가 아니라 그냥 평문(<hp:t>)으로 "barAD", "angleBAD"처럼 붙여 쓴 경우를 정리한다.
function cleanHwpPlainText(t){
  if(!t) return t;
  return t
    .replace(/\bbar([A-Z]{1,3})\b/g, '$\\overline{$1}$')
    .replace(/\bangle([A-Z]{1,3})\b/g, '$\\angle $1$');
}
const HWP_CORE_NS = 'http://www.hancom.co.kr/hwpml/2011/core';
const HWP_WATERMARK_PATTERNS = [/족보닷컴/, /zocbo\.com/i];
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
function hwpWalkParagraphs(paras, tokens){
  for(const p of paras){
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType !== 1) continue;
        const local = child.localName;
        if(local === 't'){
          tokens.push({type:'text', v: cleanHwpPlainText(child.textContent||'')});
        } else if(local === 'equation'){
          const scriptEl = child.getElementsByTagNameNS(HP_NS,'script')[0];
          tokens.push({type:'eq', v: convertHwpEq(scriptEl?scriptEl.textContent:'')});
        } else if(local === 'pic'){
          const imgEl = child.getElementsByTagNameNS(HWP_CORE_NS,'img')[0];
          const ref = imgEl ? imgEl.getAttribute('binaryItemIDRef') : null;
          if(ref) tokens.push({type:'pic', v: ref});
        } else if(local === 'tbl'){
          // 보기(①②③④⑤) 같은 작은 표는 같은 행 안에서는 줄바꿈 없이 공백으로만
          // 구분해서, 세로로 한 줄씩 쌓이지 않고 가로로 나열되게 한다.
          const trs = Array.from(child.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
          for(const tr of trs){
            const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
            for(const tc of tcs){
              const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
              if(subList){
                const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
                const cellTokens = [];
                hwpWalkParagraphs(cellParas, cellTokens);
                while(cellTokens.length && cellTokens[cellTokens.length-1].type==='break') cellTokens.pop();
                if(cellTokens.length){
                  tokens.push(...cellTokens);
                  tokens.push({type:'text', v:' '});
                }
              }
            }
          }
          tokens.push({type:'break'});
        } else if(local === 'ctrl'){
          const endNoteEl = child.getElementsByTagNameNS(HP_NS,'endNote')[0];
          if(endNoteEl){
            tokens.push({type:'endnote', v: hwpEndnoteText(endNoteEl)});
          } else if(child.getElementsByTagNameNS(HP_NS,'autoNum')[0]?.getAttribute('numType')==='ENDNOTE'){
            // 문서 맨 뒤 "빠른정답" 요약처럼 진짜 hp:endNote가 아닌 평문 목록을 만나면
            // 문항 구간이 끝난 것으로 보고 멈춘다.
            tokens.push({type:'stop'});
          }
        }
      }
    }
    tokens.push({type:'break'});
  }
}
function hwpEndnoteText(endNoteEl){
  const subList = endNoteEl.getElementsByTagNameNS(HP_NS,'subList')[0];
  const innerParas = subList ? Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p') : [];
  const innerTokens = [];
  hwpWalkParagraphs(innerParas, innerTokens);
  let ans = '';
  for(const it of innerTokens){ if(it.type==='text'||it.type==='eq') ans += it.v; }
  // "[정답]" 라벨과, 일부 문서에서 수식 앞에 자동으로 붙는 "수식입니다." 안내 문구를 제거한다.
  return ans.replace(/^\s*\[정답\]\s*/,'').replace(/수식입니다\.?/g,'').trim();
}
// 표의 셀 하나를 문제 하나로 취급해서 텍스트/그림/(있다면) 정답을 뽑는다.
// 표 기반 시험지는 "번호 인식"을 미주 등장 시점에 의존하면 정답이 없는 문항에서
// 여러 문제가 한 덩어리로 뭉쳐버리는 문제가 있어서, 셀 경계를 기준으로 삼는 게 훨씬 안정적이다.
function hwpCellToBlock(cellParas){
  const tokens = [];
  hwpWalkParagraphs(cellParas, tokens);
  let text = '', answer = null, pics = [];
  for(const tok of tokens){
    if(tok.type === 'endnote') answer = tok.v;
    else if(tok.type === 'text' || tok.type === 'eq') text += tok.v;
    else if(tok.type === 'pic') pics.push(tok.v);
    else if(tok.type === 'break') text += '\n';
  }
  return { text, answer, pics };
}
function hwpParseBlocks(topParas){
  const blocks = [];
  let plainTokens = [];
  let stopped = false;
  function flushPlain(){
    if(plainTokens.length===0) return;
    let cur = { text:'', answer:null, pics:[] };
    for(const tok of plainTokens){
      if(tok.type === 'stop'){ stopped = true; break; }
      if(tok.type === 'endnote'){
        if(cur.text.trim()) blocks.push(cur);
        cur = { text:'', answer: tok.v, pics:[] };
      } else if(tok.type === 'text') cur.text += tok.v;
      else if(tok.type === 'eq') cur.text += tok.v;
      else if(tok.type === 'pic') cur.pics.push(tok.v);
      else if(tok.type === 'break') cur.text += '\n';
    }
    if(cur.text.trim()) blocks.push(cur);
    plainTokens = [];
  }
  for(const p of topParas){
    if(stopped) break;
    // 이 문단 바로 아래에 최상위 표(문항 박스 레이아웃)가 있는지 찾는다.
    let foundTable = null;
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType===1 && child.localName==='tbl') foundTable = child;
      }
    }
    if(foundTable){
      flushPlain();
      const trs = Array.from(foundTable.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
      for(const tr of trs){
        const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
        for(const tc of tcs){
          const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
          if(subList){
            const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
            const b = hwpCellToBlock(cellParas);
            if(b.text.trim()) blocks.push(b);
          }
        }
      }
    } else {
      hwpWalkParagraphs([p], plainTokens);
    }
  }
  flushPlain();
  return blocks;
}
async function parseHwpxToProblems(file){
  await ensureJSZipLoaded();
  const zip = await JSZip.loadAsync(file);
  const sectionFile = zip.file('Contents/section0.xml');
  if(!sectionFile) throw new Error('올바른 hwpx 파일이 아닙니다.');
  const xmlText = await sectionFile.async('string');
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const sec = doc.documentElement;
  const topParas = Array.from(sec.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');

  const blocks = hwpParseBlocks(topParas);

  // 문제 칸 안에서 정답을 못 찾은 문항이 있으면(정답이 문제와 분리된 별도 표에
  // 순서대로 나열된 문서 양식), 문서 전체의 미주를 등장 순서대로 모아 같은 순번끼리 매칭한다.
  const missingCount = blocks.filter(b=>!b.answer).length;
  if(missingCount > 0){
    const allEndnotes = Array.from(doc.getElementsByTagNameNS(HP_NS,'endNote'));
    const orderedAnswers = allEndnotes.map(hwpEndnoteText);
    if(orderedAnswers.length === blocks.length){
      blocks.forEach((b,i)=>{ if(!b.answer) b.answer = orderedAnswers[i]; });
    }
  }

  // 저작권 보호 워터마크(예: 족보닷컴)가 문제나 정답에 섞인 문항은 자동 인식에서 제외한다.
  let watermarked = 0;
  const clean = blocks.filter(b=>{
    const hay = b.text + ' ' + (b.answer||'');
    if(HWP_WATERMARK_PATTERNS.some(re=>re.test(hay))){ watermarked++; return false; }
    return true;
  });

  // 문항에 딸린 그림이 있으면 hwpx 안의 실제 이미지 파일을 꺼내 압축해 첨부한다.
  let idToHref = {};
  const hpfFile = zip.file('Contents/content.hpf');
  if(hpfFile){
    const hpfText = await hpfFile.async('string');
    const hpfDoc = new DOMParser().parseFromString(hpfText, 'text/xml');
    const items = hpfDoc.getElementsByTagName('opf:item');
    for(const it of Array.from(items)){
      const id = it.getAttribute('id'), href = it.getAttribute('href');
      if(id && href) idToHref[id] = href;
    }
  }
  const problems = [];
  for(const b of clean){
    const problem = { content: b.text.trim(), answer: (b.answer||'').trim(), image: null };
    const ref = b.pics[0];
    if(ref && idToHref[ref]){
      const imgFile = zip.file(idToHref[ref]);
      if(imgFile){
        try{
          const blob = await imgFile.async('blob');
          problem.image = await compressImageToBase64(blob, 1000, 0.6);
        }catch(e){ console.error('그림 추출 실패', ref, e); }
      }
    }
    problems.push(problem);
  }
  problems.watermarkedCount = watermarked;
  return problems;
}
async function handleUnitBankHwpxFile(fileList){
  const file = (fileList||[])[0];
  if(!file) return;
  const unit = document.getElementById('ub-hwpx-unit').value;
  try{
    showToast('hwpx 파일을 분석하는 중입니다...');

    state.unitImportPreview = problems.map(p => ({ unit, content: p.content, answer: p.answer, image: p.image }));
    render();
    const noAnswer = problems.filter(p=>!p.answer).length;
    const wm = problems.watermarkedCount || 0;
    showToast(problems.length + '개 문항을 인식했습니다.'
      + (noAnswer>0 ? ` (정답 비어있는 ${noAnswer}개는 확인해주세요)` : '')
      + (wm>0 ? ` (저작권 보호 자료로 보이는 ${wm}개는 제외됨)` : ''));
  }catch(e){
    console.error('hwpx 처리 실패', e);
    showToast('hwpx 파일을 처리하지 못했습니다: ' + e.message);
  }
}

async function handleUnitBankExcelFile(fileList){
  const file = (fileList || [])[0];
  if(!file) return;
  try{
    await ensureXLSXLoaded();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    const parsed = rows.map(r => ({
      unit: String(r['단원'] ?? r['unit'] ?? '').trim(),
      content: String(r['문제'] ?? r['내용'] ?? r['content'] ?? '').trim(),
      answer: String(r['정답'] ?? r['answer'] ?? '').trim()
    })).filter(r => r.content && r.answer);
    if(parsed.length === 0){
      showToast('읽을 수 있는 문항이 없습니다. "단원/문제/정답" 열 이름을 확인해주세요.');
      return;
    }
    state.unitImportPreview = parsed;
    render();
  }catch(e){
    console.error('엑셀 처리 실패', e);
    showToast('엑셀 파일을 읽지 못했습니다.');
  }
}
function syncUnitImportPreviewFromDOM(){
  const rows = state.unitImportPreview;
  if(!rows) return;
  rows.slice(0,30).forEach((r,i)=>{
    const u = document.getElementById('uip-unit-'+i);
    const c = document.getElementById('uip-content-'+i);
    const a = document.getElementById('uip-answer-'+i);
    if(u) r.unit = u.value;
    if(c) r.content = c.value;
    if(a) r.answer = a.value;
  });
}
async function confirmUnitBankImport(){
  syncUnitImportPreviewFromDOM();
  const rows = state.unitImportPreview;
  if(!rows || rows.length===0) return;
  const CONCURRENCY = 15;
  const today = new Date().toISOString().slice(0,10);
  let ok = 0, done = 0;
  state.importProgress = { done: 0, total: rows.length };
  render();
  for(let i=0; i<rows.length; i+=CONCURRENCY){
    const chunk = rows.slice(i, i+CONCURRENCY);
    const results = await Promise.all(chunk.map(r => collectionAdd('unitbank', { ...r, createdAt: today })));
    results.forEach(doc => { if(doc){ DATA.unitBank.unshift(doc); ok++; } });
    done += chunk.length;
    state.importProgress = { done, total: rows.length };
    render();
  }
  state.importProgress = null;
  state.unitImportPreview = null;
  showToast(ok + '개 문항이 창고에 추가되었습니다.' + (ok<rows.length ? ` (${rows.length-ok}건 실패)` : ''));
  render();
}
function cancelUnitBankImport(){
  state.unitImportPreview = null;
  render();
}

// 홈 화면의 "이달의 진도 성취도" 원형 그래프.
function progressRingSVG(percent){
  const size=120, stroke=10, r=(size-stroke)/2, c=2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c * (1 - pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EDEBE3" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--red-pen)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--ink)" font-family="'JetBrains Mono',monospace">${Math.round(pct)}%</text>
  </svg>`;
}
function renderScoreChart(scores){
  if(!scores || scores.length===0) return '<div class="empty">등록된 성적이 없습니다.</div>';
  const w=560,h=180,pad=30;
  const pts = scores.map(s=> Math.round((s.score/s.total)*100));
  const n = pts.length;
  const stepX = n>1 ? (w-pad*2)/(n-1) : 0;
  const coords = pts.map((p,i)=>{
    const x = pad + stepX*i;
    const y = h-pad - (p/100)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>
    '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="4" fill="#6E2A2F"></circle>'+
    '<text x="'+c[0].toFixed(1)+'" y="'+(c[1]-10).toFixed(1)+'" font-size="11" fill="#3D3335" text-anchor="middle" font-family="JetBrains Mono, monospace">'+pts[i]+'%</text>'
  ).join('');
  const gridLines = [0,25,50,75,100].map(v=>{
    const y = h-pad-(v/100)*(h-pad*2);
    return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#E7DED9" stroke-width="1"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#7D7274" font-family=\'JetBrains Mono, monospace\'>'+v+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:600px;height:auto;">'+gridLines+
    '<path d="'+path+'" fill="none" stroke="#AE4B53" stroke-width="2.5"/>'+dots+'</svg>';
}

let lastSyncedHash = null;
function syncHistory(){
  const newHash = buildHashFromState();
  if(newHash === lastSyncedHash) return;
  const snap = {view:state.view, teacherTab:state.teacherTab, studentTab:state.studentTab};
  if(lastSyncedHash===null) history.replaceState(snap, '', newHash); // 첫 렌더는 기록을 새로 안 쌓고 지금 자리를 교체만
  else history.pushState(snap, '', newHash);
  lastSyncedHash = newHash;
}

function render(){
  const app = document.getElementById('app');
  // 탭 렌더 함수들이 내부에서 markSeen()을 호출해 알림을 "확인함" 처리하는 경우가 있어서,
  // 알림 뱃지를 그리는 headerHTML()보다 본문을 먼저 계산해야 뱃지가 한 렌더 늦게 갱신되지 않는다.
  let bodyHtml = '';
  if(state.view==='home') bodyHtml = homeHTML();
  else if(state.view==='login') bodyHtml = loginHTML();
  else if(state.view==='student') bodyHtml = studentHTML();
  else if(state.view==='teacher') bodyHtml = teacherHTML();
  let html = headerHTML() + bodyHtml;
  html += footerHTML();
  if(state.toast) html += `<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B1B1D;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;">${state.toast}</div>`;
  app.innerHTML = html;
  if(window.renderMathInElement){
    try{
      renderMathInElement(app, {
        delimiters: [{left:'$', right:'$', display:false}],
        throwOnError: false
      });
    }catch(e){ console.error('수식 렌더링 실패', e); }
  }
  if(state.view==='student' && state.studentTab==='video' && state.currentUser){
    mountVideoTrackers(state.currentUser.studentId);
  }
  syncHistory();
}

/* ---------- 학생 대시보드 ---------- */
function studentHTML(){
  const sid = state.currentUser.studentId;
  const rec = DATA.records[sid] || {scores:[],attendance:[],assignments:[],progress:{unit:'',percent:0},quizAnswers:{},wrongHomework:[],videoProgress:{},assignmentsDone:{}};
  const tabs = [['home','홈'],['quiz','데일리퀴즈'],['progress','진도/과제'],['wronghw','오답숙제'],['video','강의시청'],['clinic','클리닉 신청'],['chat','선생님과 채팅']];
  let body='';
  if(state.studentTab==='home'){
    const me = DATA.students.find(s=>s.studentId===sid) || {};
    const myClassIdH = me.classId;
    const myQuizzesH = DATA.quizzes.filter(q=>!q.classId || q.classId===myClassIdH);
    const myHomeworkH = DATA.assignments.filter(a=>!a.classId || a.classId===myClassIdH);
    const myVideosH = DATA.videos.filter(v=>v.studentId ? v.studentId===sid : (!v.classId || v.classId===myClassIdH));
    const myExamsH = DATA.exams.filter(e=>e.classId===myClassIdH);

    // "오늘의 할 일": 퀴즈/과제/영상/오답숙제 중 아직 안 끝낸 것들을 한 리스트로 모은다.
    const todoItems = [];
    myQuizzesH.filter(q=>!rec.quizAnswers[q.id]).forEach(q=>todoItems.push({tag:'퀴즈', cls:'tag-quiz', title:q.title, status:'제출요망', tab:'quiz'}));
    myHomeworkH.filter(a=>!rec.assignmentsDone[a.id]).forEach(a=>todoItems.push({tag:'과제', cls:'tag-hw', title:a.title, status:'제출요망', tab:'progress'}));
    myVideosH.filter(v=>!(rec.videoProgress[v.id] && rec.videoProgress[v.id].completed)).forEach(v=>todoItems.push({tag:'강의', cls:'tag-video', title:v.title, status:'미수강', tab:'video'}));
    rec.wrongHomework.filter(h=>{
      const bank = DATA.problemBank.find(b=>b.id===h.bankId);
      return bank && bank.status==='approved' && !h.done;
    }).forEach(h=>{
      const exam = DATA.exams.find(e=>e.id===h.examId);
      todoItems.push({tag:'오답', cls:'tag-wrong', title:(exam?exam.title+' ':'')+h.questionNo+'번', status:'제출요망', tab:'wronghw'});
    });

    // "최근 시청 중인 강의": 진도율이 있지만 아직 다 안 본 영상을 우선으로 보여준다.
    const inProgressVideo = myVideosH.find(v=>rec.videoProgress[v.id] && !rec.videoProgress[v.id].completed);
    const featuredVideo = inProgressVideo || myVideosH.find(v=>!(rec.videoProgress[v.id] && rec.videoProgress[v.id].completed)) || myVideosH[0];
    const featuredProgress = featuredVideo ? rec.videoProgress[featuredVideo.id] : null;
    const featuredVid = featuredVideo ? extractYouTubeId(featuredVideo.url) : null;
    const clsProgressH = getClassProgress(myClassIdH);

    body = `
    <div class="home-header-row">
      <div class="home-greeting">
        <h2>${escHtml(me.name||state.currentUser.name)}님, 오늘도 화이팅! 🚀</h2>
        <p>${classNameOf(myClassIdH)}${clsProgressH.subject?' · 현재 진도 '+escHtml(clsProgressH.subject):''}</p>
      </div>
      <div class="home-user-badge">👤 ${escHtml(me.name||state.currentUser.name)}${me.school?` (${escHtml(me.school)} ${escHtml(me.grade||'')})`:me.grade?` (${escHtml(me.grade)})`:''}</div>
    </div>
    <div class="home-grid-3">
      <div class="home-card">
        <h4>📌 오늘의 할 일</h4>
        ${todoItems.length===0 ? '<div class="empty">오늘 할 일을 모두 끝냈어요! 🎉</div>' :
          `<div class="home-todo-list">${todoItems.slice(0,6).map(t=>`
          <div class="home-todo-row" onclick="state.studentTab='${t.tab}'; render()">
            <span><span class="home-tag ${t.cls}">${t.tag}</span> ${escHtml(t.title)}</span>
            <span class="badge badge-no">${t.status}</span>
          </div>`).join('')}</div>`}
      </div>
      <div class="home-card" style="text-align:center;">
        <h4 style="justify-content:center;">🏆 반 진도 성취도</h4>
        <div class="home-ring-wrap">${progressRingSVG(clsProgressH.percent)}</div>
        <p class="hint" style="margin-top:10px;">${clsProgressH.subject?escHtml(clsProgressH.subject):'아직 등록된 진도가 없습니다.'}</p>
      </div>
      <div class="home-card">
        <h4>💬 무엇이든 물어보세요</h4>
        <div class="field"><textarea id="qna-question" placeholder="문제 질문은 물론, 학습 상담 등 무엇이든 편하게 남겨주세요!" style="min-height:70px;"></textarea></div>
        ${qnaImageFieldHTML(state.qnaQuestionImage, 'handleQnaQuestionImage(this.files)', 'removeQnaQuestionImage()')}
        <button class="btn btn-primary" style="width:100%;" onclick="submitQuestion()">질문 보내기</button>
      </div>
    </div>
    <div class="home-grid-2">
      <div class="home-card home-video-feature" ${featuredVideo?`onclick="state.studentTab='video'; render()"`:''}>
        ${!featuredVideo ? '<div class="empty">등록된 영상이 없습니다.</div>' : `
        <div class="home-video-thumb" style="${featuredVid?`background-image:url('https://img.youtube.com/vi/${featuredVid}/hqdefault.jpg')`:''}"><div class="home-video-play">▶</div></div>
        <div class="home-video-info">
          <div class="mono" style="font-size:11px;color:var(--ink-soft);">${featuredProgress?'최근 시청 중인 강의':'강의시청'}</div>
          <div style="font-weight:700;margin:4px 0;">${escHtml(featuredVideo.title)}</div>
          ${featuredProgress ? videoProgressGaugeHTML(featuredProgress.percent, featuredProgress.completed) : '<div style="font-size:12.5px;color:var(--ink-soft);">아직 시청 기록이 없습니다</div>'}
          <button class="btn btn-primary btn-small" style="margin-top:10px;">이어보기</button>
        </div>`}
      </div>
      <div class="home-card">
        <h4>⚡ 빠른 변형 문제 요청</h4>
        ${wrongSubmitWidgetHTML(myExamsH)}
      </div>
    </div>
    <div class="panel">
      <div class="home-icon-row">
        <button class="home-icon-link" onclick="state.studentTab='grades'; render()"><span class="emoji">📊</span>성적</button>
        <button class="home-icon-link" onclick="state.studentTab='attendance'; render()"><span class="emoji">🗓️</span>출석</button>
        <button class="home-icon-link" onclick="state.studentTab='notice'; render()"><span class="emoji">📢</span>공지사항</button>
        <button class="home-icon-link" onclick="state.studentTab='qna'; render()"><span class="emoji">💬</span>질의응답</button>
      </div>
    </div>`;
  } else if(state.studentTab==='grades'){
    body = `<div class="panel"><h3>성적 추이</h3>${renderScoreChart(rec.scores)}</div>
    <div class="panel"><h3>시험 기록</h3>
      ${rec.scores.length===0?'<div class="empty">등록된 성적이 없습니다.</div>':`
      <table><tr><th>날짜</th><th>시험명</th><th>점수</th><th>비율</th></tr>
      ${rec.scores.map(s=>`<tr><td>${s.date}</td><td>${s.name}</td><td>${s.score}/${s.total}</td><td>${Math.round(s.score/s.total*100)}%</td></tr>`).join('')}
      </table>`}
    </div>`;
  } else if(state.studentTab==='progress'){
    const myClassIdP = (DATA.students.find(s=>s.studentId===sid)||{}).classId;
    const myHomework = DATA.assignments.filter(a=>!a.classId || a.classId===myClassIdP);
    markSeen('homework', myHomework.length);
    const cpP = getClassProgress(myClassIdP);
    body = `<div class="panel"><h3>현재 진도</h3>
      ${!cpP.subject ? '<div class="empty">아직 등록된 진도가 없습니다.</div>' : `
      <p>${escHtml(cpP.subject)}</p>
      <div class="progress-outer"><div class="progress-inner" style="width:${cpP.percent}%;"></div></div>
      <div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">${cpP.doneCount} / ${cpP.chapters.length}단원 완료 · ${cpP.percent}%</div>
      <div class="unit-check-list">
        ${cpP.chapters.map(u=>`<div class="unit-check-item ${cpP.doneMap[u]?'checked':''}">${cpP.doneMap[u]?'✅':'⬜'} ${escHtml(u)}</div>`).join('')}
      </div>`}
    </div>
    <div class="panel"><h3>과제</h3>
      ${myHomework.length===0?'<div class="empty">등록된 과제가 없습니다.</div>':
      myHomework.map(a=>{
        const done = !!rec.assignmentsDone[a.id];
        return `<div class="homework-card">
          <div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">${a.dueDate?'마감 '+a.dueDate:'마감일 없음'}</div>
          <div style="font-weight:700;">${escHtml(a.title)}</div>
          ${a.description ? `<div style="font-size:13px;white-space:pre-wrap;margin-top:4px;">${escHtml(a.description)}</div>` : ''}
          <div style="margin-top:8px;">
            <span class="badge ${done?'badge-ok':'badge-no'}">${done?'완료':'미완료'}</span>
            <button class="btn btn-small" style="margin-left:8px;" onclick="toggleHomeworkDone('${sid}','${a.id}')">${done?'미완료로 표시':'완료로 표시'}</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  } else if(state.studentTab==='attendance'){
    body = `<div class="panel"><h3>출석 기록</h3>
      ${rec.attendance.length===0?'<div class="empty">기록이 없습니다.</div>':`
      <table><tr><th>날짜</th><th>상태</th></tr>
      ${rec.attendance.map(a=>`<tr><td>${a.date}</td><td>${attBadge(a.status)}</td></tr>`).join('')}
      </table>`}
    </div>`;
  } else if(state.studentTab==='notice'){
    markSeen('notice', DATA.notices.length);
    body = `<div class="panel"><h3>공지사항</h3>
      ${DATA.notices.length===0?'<div class="empty">등록된 공지가 없습니다.</div>':
      DATA.notices.map(n=>`<div style="padding:12px 0;border-bottom:1px solid #F0EEE7;"><div style="font-weight:700;">${escHtml(n.title)} <span class="mono" style="font-size:11px;color:var(--ink-soft);font-weight:400;">${escHtml(n.date)}</span></div><div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">${escHtml(n.content)}</div></div>`).join('')}
    </div>`;
  } else if(state.studentTab==='quiz'){
    const myClassId = (DATA.students.find(s=>s.studentId===sid)||{}).classId;
    const myQuizzes = DATA.quizzes.filter(q=>!q.classId || q.classId===myClassId);
    body = `<div class="panel"><h3>데일리퀴즈</h3>
      ${myQuizzes.length===0?'<div class="empty">등록된 퀴즈가 없습니다.</div>':
      myQuizzes.map(q=>{
        const done = rec.quizAnswers[q.id];
        return `<div class="quiz-card">
          <div class="quiz-meta">${escHtml(q.date)} · ${quizClassLabel(q.classId)}</div>
          <div class="quiz-title">${escHtml(q.title)}</div>
          <div class="quiz-content">${escHtml(q.content)}</div>
          <div class="quiz-answer-box">
            ${done ? `<span class="badge badge-ok">제출완료</span> <span class="mono" style="font-size:11px;color:var(--ink-soft);">${escHtml(done.answer)} (${done.submittedAt})</span>`
            : isMultipleChoice(q.content)
              ? `<div class="inline-form">${answerInputHTML('qa-'+q.id)}<button class="btn btn-primary btn-small" onclick="submitQuizAnswer('${q.id}','${sid}')">제출</button></div>`
              : `<div class="inline-form"><div class="field" style="flex:1;"><input id="qa-${q.id}" placeholder="답안 입력"></div><button class="btn btn-primary btn-small" onclick="submitQuizAnswer('${q.id}','${sid}')">제출</button></div>`}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  } else if(state.studentTab==='wronghw'){
    const myClassIdW = (DATA.students.find(s=>s.studentId===sid)||{}).classId;
    const myExams = DATA.exams.filter(e=>e.classId===myClassIdW);
    body = `<div class="panel">
      <h3>시험 오답 제출</h3>
      ${wrongSubmitWidgetHTML(myExams)}
    </div>
    <div class="panel">
      <h3>내 오답 숙제</h3>
      ${rec.wrongHomework.length===0?'<div class="empty">아직 배정된 오답 숙제가 없습니다.</div>':
      rec.wrongHomework.map(hw=>{
        const bank = DATA.problemBank.find(b=>b.id===hw.bankId);
        const exam = DATA.exams.find(e=>e.id===hw.examId);
        if(!bank) return '';
        if(bank.status!=='approved'){
          return `<div class="homework-card"><div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">${exam?escHtml(exam.title):''} · ${hw.questionNo}번 오답</div><div class="homework-pending">선생님이 문제를 검토 중입니다. 검토가 끝나면 이곳에 문제가 표시됩니다.</div></div>`;
        }
        if(bank.hasImage && state.pbImageCache[bank.id]===undefined) togglePbImage(bank.id);
        const correct = hw.done && hw.studentAnswer.trim()===bank.variantAnswer.trim();
        const img = bank.hasImage && state.pbImageCache[bank.id] && state.pbImageCache[bank.id]!=='empty' && state.pbImageCache[bank.id]!=='loading' ? state.pbImageCache[bank.id] : null;
        return `<div class="homework-card">
          <div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">${exam?escHtml(exam.title):''} · ${hw.questionNo}번 오답 · 쌍둥이 문제</div>

          ${bank.hasImage ? (img ? `<img src="${img}" style="max-width:240px;max-height:240px;margin-bottom:10px;border:1px solid var(--card-border);border-radius:4px;display:block;">` : '<div class="empty">그림 불러오는 중...</div>') : ''}
          ${hw.done
            ? `<span class="badge ${correct?'badge-ok':'badge-no'}">${correct?'정답':'오답'}</span> <span class="mono" style="font-size:12px;">내 답안: ${escHtml(hw.studentAnswer)}</span>`
            : isMultipleChoice(bank.variantContent)
              ? `<div class="inline-form">${answerInputHTML('hw-answer-'+bank.id)}<button class="btn btn-primary btn-small" onclick="submitHomeworkAnswer('${bank.id}')">제출</button></div>`
              : `<div class="inline-form"><div class="field" style="flex:1;"><input id="hw-answer-${bank.id}" placeholder="답안 입력"></div><button class="btn btn-primary btn-small" onclick="submitHomeworkAnswer('${bank.id}')">제출</button></div>`}
        </div>`;

    </div>
    <div class="panel"><h3>내 신청 내역</h3>
      ${mine.length===0?'<div class="empty">신청 내역이 없습니다.</div>':
      mine.map(c=>`<div class="clinic-row"><div><b>${c.day}</b> ${c.time||''} · ${c.topic}</div><span class="status-pill status-${c.status}">${c.status}</span></div>`).join('')}

// 반의 현재 진도(과목+완료 단원)를 계산한다. 학생 홈/진도탭에서도 재사용.
function getClassProgress(classId){
  const c = DATA.classes.find(x=>x.id===classId);
  const subject = c && c.progress ? c.progress.subject : '';
  const chapters = UNIT_CHAPTERS[subject] || [];
  const doneMap = (c && c.progress && c.progress.unitsBySubject && c.progress.unitsBySubject[subject]) || {};
  const doneCount = chapters.filter(u=>doneMap[u]).length;
  const percent = chapters.length ? Math.round(doneCount/chapters.length*100) : 0;
  return { subject, chapters, doneMap, doneCount, percent };
}
async function setClassProgressSubject(classId, subject){
  const c = DATA.classes.find(x=>x.id===classId);
  if(!c) return;
  if(!c.progress) c.progress = { subject:'', unitsBySubject:{} };
  c.progress.subject = subject;
  await dbSet('classes', DATA.classes);
  render();
}
async function toggleClassProgressUnit(classId, unit, checked){
  const c = DATA.classes.find(x=>x.id===classId);
  if(!c || !c.progress || !c.progress.subject) return;
  const subject = c.progress.subject;
  if(!c.progress.unitsBySubject[subject]) c.progress.unitsBySubject[subject] = {};
  c.progress.unitsBySubject[subject][unit] = checked;
  await dbSet('classes', DATA.classes);
  render();
}
function teacherClassProgressHTML(classId){
  const { subject, chapters, doneMap, doneCount, percent } = getClassProgress(classId);
  return `<div class="panel">
    <h3>진도 관리</h3>
    <div class="field" style="max-width:260px;">
      <label>과목</label>
      <select onchange="setClassProgressSubject('${classId}', this.value)">
        <option value="">-- 과목 선택 --</option>
        ${UNITS.map(u=>`<option value="${u}" ${subject===u?'selected':''}>${u}</option>`).join('')}
      </select>
    </div>
    ${!subject ? '<div class="empty">과목을 선택해주세요.</div>' : `
    <div class="progress-outer" style="margin:14px 0;"><div class="progress-inner" style="width:${percent}%;"></div></div>
    <div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">${doneCount} / ${chapters.length}단원 완료 · ${percent}%</div>
    <div class="unit-check-list">
      ${chapters.map(u=>`<label class="unit-check-item ${doneMap[u]?'checked':''}">
        <input type="checkbox" ${doneMap[u]?'checked':''} onchange="toggleClassProgressUnit('${classId}','${escHtml(u)}',this.checked)">${escHtml(u)}
      </label>`).join('')}
    </div>`}
  </div>`;
}
