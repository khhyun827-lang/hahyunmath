/* =================== 클리닉 신청 (선생님이 만든 시간대에서만 신청 가능) =================== */
// 슬롯 하나를 채우고 있는(취소되지 않은) 신청 건수 — 정원 초과 여부를 이걸로 판단한다.
function clinicSlotBookedCount(slotId){
  return DATA.clinics.filter(c=>c.slotId===slotId && c.status!=='취소').length;
}
// 오늘 이후이면서 정원이 남은 슬롯만 학생에게 신청 가능한 시간대로 보여준다.
function openClinicSlots(){
  const today = todayStr();
  return DATA.clinicSlots
    .filter(s=>s.date>=today)
    .filter(s=>clinicSlotBookedCount(s.id) < s.capacity)
    .sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
}
async function addClinicSlot(){
  const date = document.getElementById('slot-date').value;
  const time = document.getElementById('slot-time').value.trim();
  const capacity = parseInt(document.getElementById('slot-capacity').value) || 1;
  if(!date || !time){ showToast('날짜와 시간을 입력해주세요.'); return; }
  const slot = {id:'cs'+Date.now(), date, time, capacity};
  DATA.clinicSlots.push(slot);
  DATA.clinicSlots.sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
  await dbSetDoc('clinicslots', slot.id, slot);
  document.getElementById('slot-date').value='';
  document.getElementById('slot-time').value='';
  document.getElementById('slot-capacity').value='';
  showToast('시간대가 추가되었습니다.');
  render();
}
async function deleteClinicSlot(slotId){
  const booked = clinicSlotBookedCount(slotId);
  if(booked>0 && !confirm(`이 시간대에 이미 ${booked}건의 신청이 있습니다. 시간대를 삭제해도 신청 내역은 남습니다. 삭제할까요?`)) return;
  if(booked===0 && !confirm('이 시간대를 삭제할까요?')) return;
  DATA.clinicSlots = DATA.clinicSlots.filter(s=>s.id!==slotId);
  await dbDeleteDoc('clinicslots', slotId);
  showToast('삭제되었습니다.');
  render();
}
/* 신청 경로는 둘이다.
     ① 시간대에서 고르기 — 교사가 열어 둔 슬롯. 정원이 차면 막힌다
     ② 직접 제안하기   — 열린 슬롯에 맞는 시간이 없을 때 학생이 날짜·시간을 적어 낸다.
                        슬롯이 없으므로 slotId는 빈 문자열이고 정원 개념도 없다.
                        교사가 승인해야 확정된다 — 그래서 «제안»이지 «예약»이 아니다.
   두 경우 모두 같은 clinic 레코드에 담긴다 (day·time이 이미 있다). 컬렉션을 늘리지 않았다. */
async function submitClinicRequest(freeform){
  const sid = state.currentUser.studentId;
  const topic = document.getElementById('clinic-topic').value.trim();
  if(!topic){ showToast('질문/요청 내용을 입력해주세요.'); return; }

  let slotId = '', day = '', time = '';
  if(freeform){
    day  = document.getElementById('clinic-free-date').value;
    time = document.getElementById('clinic-free-time').value.trim();
    if(!day || !time){ showToast('희망 날짜와 시간을 입력해주세요.'); return; }
    if(day < todayStr()){ showToast('지난 날짜로는 신청할 수 없습니다.'); return; }
    if(DATA.clinics.some(c=>c.studentId===sid && c.day===day && c.time===time && c.status!=='취소')){
      showToast('이미 같은 날짜·시간으로 신청하셨습니다.'); return;
    }
    /* 승인된 제안은 그 시간에 슬롯을 만들어 잠근다. 그 자리가 꽉 찼으면 다른 학생이
       같은 시간을 또 제안하지 못하게 여기서 막는다 — 안 막으면 승인이 겹친다. */
    const taken = DATA.clinicSlots.find(s=>s.date===day && (s.time||'').trim()===time);
    if(taken && clinicSlotBookedCount(taken.id) >= taken.capacity){
      showToast('그 시간은 이미 찼습니다. 다른 시간을 적어 주세요.'); return;
    }
  } else {
    /* 예전에는 드롭다운 하나(#clinic-slot)였다. 학생 화면이 시간대를 «목록에서 눌러» 고르게 되면서
       고른 값은 state가 들고 있다 — 빈 자리를 먼저 보여주고 고르게 하는 편이,
       날짜를 적어 내고 거절되면 처음부터 다시 하는 것보다 낫다. */
    slotId = state.stuClinicSlotId || '';
    if(!slotId){ showToast('희망 시간대를 선택해주세요.'); return; }
    const slot = DATA.clinicSlots.find(s=>s.id===slotId);
    if(!slot){ showToast('선택한 시간대를 찾을 수 없습니다. 다시 선택해주세요.'); render(); return; }
    if(clinicSlotBookedCount(slotId) >= slot.capacity){ showToast('죄송해요, 방금 정원이 찼습니다. 다른 시간대를 선택해주세요.'); render(); return; }
    if(DATA.clinics.some(c=>c.studentId===sid && c.slotId===slotId && c.status!=='취소')){ showToast('이미 같은 시간대에 신청하셨습니다.'); return; }
    day = slot.date; time = slot.time;
  }

  const clinic = {id:'cl'+Date.now(), studentId:sid, name:state.currentUser.name, topic, slotId,
                  day, time, status:'대기', requestedAt:todayStr()};
  DATA.clinics.unshift(clinic);
  await dbSetDoc('clinics', clinic.id, clinic);
  state.stuClinicSlotId = null;
  showToast(freeform ? '희망 시간을 제안했습니다. 선생님 승인 후 확정됩니다.' : '클리닉 신청이 접수되었습니다.');
  render();   // 입력칸은 지우지 않고 다시 그린다 — 전체 재렌더링이라 어차피 새 칸이 온다
}

/* 교사가 학생을 직접 앉힌다. 슬롯을 고르면 그 슬롯에 배정되고(정원에 반영된다),
   고르지 않으면 날짜·시간을 직접 적어 슬롯 없이 잡는다. 교사가 넣는 것이므로 바로 «승인»이다. */
async function assignClinic(){
  const sid = document.getElementById('cn-assign-student').value;
  let slotId = document.getElementById('cn-assign-slot').value;   // 직접 입력이면 아래에서 슬롯을 만들어 채운다
  const topic = document.getElementById('cn-assign-topic').value.trim();
  let day = document.getElementById('cn-assign-date').value;
  let time = document.getElementById('cn-assign-time').value.trim();
  if(!sid){ showToast('학생을 선택해주세요.'); return; }
  if(slotId){
    const slot = DATA.clinicSlots.find(s=>s.id===slotId);
    if(!slot){ showToast('시간대를 찾을 수 없습니다.'); return; }
    day = slot.date; time = slot.time;
  } else if(!day || !time){
    showToast('시간대를 고르거나 날짜·시간을 직접 입력해주세요.'); return;
  } else {
    /* 직접 입력이어도 슬롯을 만들어 붙인다 — 승인된 클리닉은 슬롯을 갖는다는 규칙을 여기서도 지킨다. */
    const slot = await ensureClinicSlot(day, time);
    const booked = clinicSlotBookedCount(slot.id);
    if(booked >= slot.capacity){ slot.capacity = booked + 1; await dbSetDoc('clinicslots', slot.id, slot); }
    slotId = slot.id;
  }
  const clinic = {id:'cl'+Date.now(), studentId:sid, name:studentNameOf(sid), topic:topic||'클리닉',
                  slotId, day, time, status:'승인', requestedAt:todayStr()};
  DATA.clinics.unshift(clinic);
  await dbSetDoc('clinics', clinic.id, clinic);
  await logAudit('클리닉 배정', sid, studentNameOf(sid), `${day} ${time}`);
  document.getElementById('cn-assign-topic').value='';
  document.getElementById('cn-assign-time').value='';
  showToast(`${studentNameOf(sid)} — ${day} ${time}에 배정했습니다.`);
  render();
}
/* 같은 날짜·시간의 슬롯을 찾고, 없으면 만든다.
   ⚠ time이 자유 텍스트라 «저녁 7시»와 «저녁7시»는 다른 시간으로 본다.
   형식을 강제하는 곳이 없어서 정규화하려 들면 오히려 엉뚱한 것을 합친다 — 문자열 그대로 맞춘다. */
async function ensureClinicSlot(day, time){
  const t = (time||'').trim();
  const found = DATA.clinicSlots.find(s=>s.date===day && (s.time||'').trim()===t);
  if(found) return found;
  const slot = {id:'cs'+Date.now(), date:day, time:t, capacity:1};
  DATA.clinicSlots.push(slot);
  DATA.clinicSlots.sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
  await dbSetDoc('clinicslots', slot.id, slot);
  return slot;
}

/* **승인된 클리닉은 슬롯을 갖는다.** 학생이 직접 제안한 시간(slotId 없음)을 승인하면
   그 자리에 시간대를 만들어 붙인다 — 안 그러면 다른 학생이 같은 시간에 또 제안할 수 있고,
   주간 판에서도 점선(「시간대 밖」)으로만 떠서 자리가 잡힌 것으로 안 읽힌다.
   새로 만드는 슬롯의 정원은 1이다. 한 사람의 제안을 받아 준 자리이므로 그 사람으로 찬다. */
async function updateClinicStatus(cid, status){
  const c = DATA.clinics.find(c=>c.id===cid);
  if(!c) return;
  let note = '';
  if(status==='승인' && !c.slotId && c.day && c.time){
    const slot = await ensureClinicSlot(c.day, c.time);
    const booked = clinicSlotBookedCount(slot.id);
    if(booked >= slot.capacity){
      /* 이미 있던 시간대가 꽉 찼는데 교사가 승인했다 — 승인을 무르지 않고 정원을 한 자리 늘린다.
         조용히 넘기면 «승인했는데 왜 안 들어가 있지»가 된다. 늘렸다는 사실을 말해 준다. */
      slot.capacity = booked + 1;
      await dbSetDoc('clinicslots', slot.id, slot);
      note = ` (정원이 차 있어 ${slot.capacity}명으로 늘렸습니다)`;
    } else {
      note = ` · ${c.day} ${c.time} 시간대를 만들어 자리를 잡았습니다`;
    }
    c.slotId = slot.id;
  }
  c.status = status;
  await dbSetDoc('clinics', c.id, c);
  if(note) showToast(`${c.name} 승인${note}`);
  render();
}

/* =================== 영상 (부교재 해설강의) =================== */
function extractYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/watch\?[^#]*v=([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{6,15})/
  ];
  for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
  return null;
}
/* videoEmbedHTML(카드 + iframe + 진도 한 벌)은 지웠다 — 학생 강의 화면(stuVideoHTML)이
   목록 카드를 이미 그리고, 거기서 «누른 하나»에만 iframe을 붙인다.
   유튜브 iframe에 sandbox를 거는 것(allow-popups/allow-top-navigation 없음)과
   enablejsapi=1로 시청 진도율을 추적하는 것은 그 함수로 그대로 옮겼다. */
/* ---------- 유튜브 시청 진도율 추적 ---------- */
// render()가 app.innerHTML을 통째로 새로 그리기 때문에, 재생 중 다른 이유로 render()가
// 다시 호출되면 iframe이 새로 만들어지면서 재생 위치가 초기화된다. 진도율 저장 자체는
// render()를 부르지 않도록 해서(=재생 화면을 다시 그리지 않도록) 이 문제를 최대한 피한다.
let ytApiLoading = false;
function ensureYouTubeAPI(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  if(!state.ytReadyCallbacks) state.ytReadyCallbacks = [];
  state.ytReadyCallbacks.push(cb);
  if(ytApiLoading) return;
  ytApiLoading = true;
  window.onYouTubeIframeAPIReady = function(){
    (state.ytReadyCallbacks||[]).forEach(fn=>fn());
    state.ytReadyCallbacks = [];
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
// 재생바 위치(getCurrentTime)가 아니라 "실제로 재생 상태였던 시간(벽시계 기준)"을 누적한다.
// 재생바 위치만 보면 끝부분으로 스킵만 해도 시청 완료로 잡히기 때문에, PLAYING 상태로
// 실제 흘러간 시간만 더하는 방식으로 바꿨다 — 스킵/탐색 자체는 시간을 늘리지 않는다.
async function noteVideoWatchTime(studentId, videoId, addSeconds, duration, ended){
  if(!duration || duration<=0) return;
  const rec = await loadRecord(studentId);
  const prev = rec.videoProgress[videoId] || {watchedSeconds:0, duration:0, percent:0, completed:false};
  const prevWatched = prev.watchedSeconds!==undefined ? prev.watchedSeconds : (prev.maxSeconds||0);
  const watchedSeconds = Math.min(duration, prevWatched + Math.max(0, addSeconds));
  const percent = Math.min(100, Math.round(watchedSeconds/duration*150));
  rec.videoProgress[videoId] = {
    watchedSeconds, duration, percent,
    completed: prev.completed || ended || percent>=95,
    updatedAt: new Date().toISOString()
  };
  await saveRecord(studentId);
  const label = document.getElementById('vprog-'+videoId);
  if(label) label.innerHTML = videoProgressBlockHTML(studentId, videoId);
}
/* 재생 중에 이 자리만 다시 그린다 (render()를 부르면 iframe이 새로 생겨 재생이 끊긴다).
   그래서 여기서 나오는 것은 DS 조각이어야 한다 — 구버전 .video-gauge는 이제 없다.
   이모지 마일스톤(🌱🌿🔥⭐🎉)은 뺐다. 이 시스템은 이모지를 아이콘으로 쓰지 않는다. */
function videoProgressBlockHTML(studentId, videoId){
  const rec = DATA.records[studentId];
  const p = rec && rec.videoProgress && rec.videoProgress[videoId];
  if(!p) return '<div style="font-size:11.5px;color:var(--dim);margin-top:10px;">아직 시청 기록이 없습니다.</div>';
  const pct = Math.max(0, Math.min(100, p.percent||0));
  return `<div class="sap-prog">
      <span class="bar"><i style="width:${pct}%"></i></span>
      <b style="color:${p.completed?'var(--ok)':'var(--dim)'};">${p.completed?'완료':pct+'%'}</b>
    </div>
    <div style="font-size:11px;color:var(--dim);margin-top:6px;">${
      p.completed ? '시청 완료' : '시청 중'} · 최근 <span class="mono">${(p.updatedAt||'').slice(0,10)}</span></div>`;
}
// 재생 중이던 구간의 벽시계 경과 시간을 정산해서 누적한다(멈춤/종료/화면전환 시 남은 조각까지 반영).
function flushWatchTick(entry, studentId, videoId, player, ended){
  if(entry.lastTick==null) return;
  const now = Date.now();
  const elapsed = Math.min(20, Math.max(0, (now-entry.lastTick)/1000)); // 백그라운드 탭 등으로 타이머가 밀려도 과도하게 잡히지 않도록 상한
  entry.lastTick = null;
  try{
    const dur = player.getDuration();
    noteVideoWatchTime(studentId, videoId, elapsed, dur, ended);
  }catch(err){}
}
// 학생이 '부교재 해설강의' 탭에 있을 때만 실제 유튜브 플레이어를 붙여서 재생 상태를 감시한다.
function mountVideoTrackers(studentId){
  const frames = document.querySelectorAll('.yt-tracked-frame[data-bank-vid]');
  if(frames.length===0) return;
  ensureYouTubeAPI(() => {
    if(!state.ytPlayers) state.ytPlayers = {};
    frames.forEach(frame => {
      const videoId = frame.dataset.bankVid;
      const prev = state.ytPlayers[videoId];
      if(prev && prev.el === frame) return;   // 같은 iframe에 이미 붙어 있다
      /* ⚠ render()가 app.innerHTML을 통째로 갈면 예전 iframe은 사라지는데,
         여기 남아 있는 플레이어는 그 죽은 iframe을 가리킨다. 예전에는 «id가 있으면 건너뛴다»라
         새 iframe에 다시 붙지 못했다 — 화면을 한 번 다시 그린 뒤부터 시청 시간이 조용히
         기록되지 않았다. 학생 화면이 영상을 하나씩 열고 닫게 되면서 매번 걸리는 길이 됐다. */
      if(prev){
        if(prev.timer) clearInterval(prev.timer);
        flushWatchTick(prev, studentId, videoId, prev.player, false);
        try{ prev.player.destroy(); }catch(err){}
        delete state.ytPlayers[videoId];
      }
      let player;
      try{
        player = new YT.Player(frame.id, {
          events: {
            onStateChange: (e) => {
              const entry = state.ytPlayers[videoId];
              if(!entry) return;
              if(e.data === YT.PlayerState.PLAYING){
                entry.lastTick = Date.now();
                if(entry.timer) clearInterval(entry.timer);
                entry.timer = setInterval(() => {
                  const now = Date.now();
                  const elapsed = Math.min(10, Math.max(0, (now-entry.lastTick)/1000));
                  entry.lastTick = now;
                  try{
                    const dur = player.getDuration();
                    noteVideoWatchTime(studentId, videoId, elapsed, dur, false);
                  }catch(err){}
                }, 5000);
              } else {
                if(entry.timer){ clearInterval(entry.timer); entry.timer = null; }
                flushWatchTick(entry, studentId, videoId, player, e.data===YT.PlayerState.ENDED);
              }
            }
          }
        });
      }catch(err){ return; }
      state.ytPlayers[videoId] = { player, timer: null, el: frame };
    });
  });
}

let examDraft = { classId:'', title:'', date:'', questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };

function compressImageToBase64(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}
function compressImageToBlob(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('이미지 압축에 실패했습니다.')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}
const DRIVE_UPLOAD_TIMEOUT_MS = 55000;
async function uploadImageToDrive(file){
  const blob = await compressImageToBlob(file);
  const fd = new FormData();
  fd.append('file', blob, 'img_' + Date.now() + '.jpg');
  const token = await withTimeout(getAuthToken(), 8000);
  /* FormData다 — Content-Type을 직접 넣으면 안 된다. 브라우저가 boundary까지 붙여야 한다. */
  const res = await withTimeout(fetch(AI_WORKER_URL + '/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  }), DRIVE_UPLOAD_TIMEOUT_MS);
  if(!res.ok) throw new Error('upload http ' + res.status);
  return res.json(); // {url, fileId}
}
/* 토큰을 받아 오려면 await가 필요해서 async가 됐다. 부르는 쪽 8곳은 전부 결과를 기다리지 않는
   «보내 놓고 잊는» 호출이라 그대로 둔다 — 실패는 여기서 삼키므로 미처리 거부도 생기지 않는다. */
async function deleteFromDrive(fileId){
  if(!fileId) return;
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await fetch(AI_WORKER_URL + '/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ fileId })
    });
  }catch(e){ console.error('드라이브 파일 삭제 실패', e); }
}
function dataUrlToBlob(dataUrl){
  const m = dataUrl.match(/^data:([^;]+);base64,(.*)$/s);
  if(!m) throw new Error('잘못된 이미지 데이터입니다.');
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: m[1] });
}
// hwpx 임포트 등으로 이미 base64 data URL 형태로 메모리에 있는 이미지를 드라이브에 올릴 때 사용
async function uploadDataUrlToDrive(dataUrl){
  const blob = dataUrlToBlob(dataUrl);
  const fd = new FormData();
  fd.append('file', blob, 'img_' + Date.now() + '.jpg');
  const token = await withTimeout(getAuthToken(), 8000);
  const res = await withTimeout(fetch(AI_WORKER_URL + '/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  }), DRIVE_UPLOAD_TIMEOUT_MS);
  if(!res.ok) throw new Error('upload http ' + res.status);
  return res.json(); // {url, fileId}
}
// 레거시(base64 문자열) 레코드와 신규({url,fileId}) 레코드를 모두 렌더링할 수 있게 흡수하는 헬퍼
function imgSrcOf(v){
  if(!v) return null;
  return typeof v === 'string' ? v : (v.previewUrl || v.url || null);
}
function imgFileIdOf(v){
  return (v && typeof v === 'object') ? (v.fileId || null) : null;
}
async function handleExamFileSelect(fileList){
  syncExamDraftFromDOM();
  const files = Array.from(fileList || []);
  const entries = files.map(f => ({ uploading:true, previewUrl: URL.createObjectURL(f), file:f }));
  entries.forEach(e => examDraft.pages.push(e));
  render();
  let failed = 0;
  for(const entry of entries){
    try{
      const { url, fileId } = await uploadImageToDrive(entry.file);
      entry.uploading = false; entry.url = url; entry.fileId = fileId;
      URL.revokeObjectURL(entry.previewUrl);
      delete entry.file; delete entry.previewUrl;
    }catch(e){
      console.error('시험지 이미지 업로드 실패', entry.file && entry.file.name, e);
      URL.revokeObjectURL(entry.previewUrl);
      const idx = examDraft.pages.indexOf(entry);
      if(idx>=0) examDraft.pages.splice(idx,1);
      failed++;
    }
    render();
  }
  if(failed>0) showToast(failed + '개 이미지 업로드에 실패했습니다. 다시 시도해주세요.');
}

async function saveExam(){
  syncExamDraftFromDOM();
  if(!examDraft.title || !examDraft.classId){ showToast('반과 시험명을 입력해주세요.'); return; }
  const validQuestions = examDraft.questions.filter(q=>q.content.trim() && q.answer.trim());
  if(validQuestions.length===0){ showToast('문항을 최소 1개 이상 입력해주세요.'); return; }
  if(examDraft.pages.some(p=>p.uploading)){ showToast('이미지 업로드가 끝난 후 다시 시도해주세요.'); return; }
  const readyPages = examDraft.pages.filter(p=>p.url);
  // 문항 이미지는 problem-bank 항목마다 별도 문서(pbimg:id)로, 스캔 페이지는 구글 드라이브에
  // 올리고 링크만 저장한다. Firestore에는 짧은 URL/ID만 남아 문서 용량 제한에서 자유롭다.
  const questions = validQuestions.map((q,i)=>({no:i+1, content:q.content.trim(), answer:q.answer.trim(), unit:q.unit||''}));
  const examId = 'ex'+Date.now();
  const newExam = {id:examId, classId:examDraft.classId, title:examDraft.title, date:examDraft.date, questions, hasFiles:readyPages.length>0};
  DATA.exams.unshift(newExam);
  await dbSetDoc('exams', newExam.id, newExam);
  if(readyPages.length>0){
    await dbSet('examfiles:'+examId, readyPages);
  }
  for(let i=0;i<questions.length;i++){
    const q = questions[i];
    const srcImage = validQuestions[i].image;
    const bankId = 'pb'+Date.now()+'_'+q.no;
    let imgResult = null;
    if(srcImage){
      try{ imgResult = await uploadDataUrlToDrive(srcImage); }
      catch(e){ console.error('문항 이미지 업로드 실패', e); showToast(q.no+'번 문항 이미지 업로드에 실패했습니다.'); }
    }
    const bankEntry = {
      id:bankId, examId, questionNo:q.no,
      originalContent:q.content, originalAnswer:q.answer,
      variantContent:'', variantAnswer:'', status:'pending',
      hasImage: !!imgResult
    };
    DATA.problemBank.push(bankEntry);
    await dbSetDoc('problembank', bankEntry.id, bankEntry);
    if(imgResult) await dbSet('pbimg:'+bankId, imgResult);
  }
  examDraft = { classId:'', title:'', date:'', questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };
  /* 저장했으면 등록 모드에서 나와 방금 만든 시험지를 보여 준다 — 폼에 남아 있으면 또 만들 것처럼 보인다. */
  state.examMode = ''; state.examSelectedId = examId;
  showToast('시험지가 등록되었습니다. 오답 검토에서 AI 쌍둥이 문제를 생성해보세요.');
  render();
}

   state.wrongExamId·wrongChecked를 공유하니 한쪽에서 고른 것이 다른 쪽에 비쳤다.
   지금은 오답숙제의 「틀린 문제 등록」 하나뿐이다 (stuWrongHTML). */
function toggleWrongCheck(no){

async function submitWrongAnswers(){
  const examId = state.wrongExamId;
  const exam = DATA.exams.find(e=>e.id===examId);
  if(!exam){ showToast('시험지를 선택해주세요.'); return; }
  const wrongNos = Object.keys(state.wrongChecked).filter(k=>state.wrongChecked[k]).map(k=>parseInt(k));
  if(wrongNos.length===0){ showToast('틀린 문제 번호를 선택해주세요.'); return; }
  await loadUnitBankIfNeeded();
  const sid = state.currentUser.studentId;
  const rec = await loadRecord(sid);
  let matchedFromBank = 0, newlyRequested = 0;
  for(const no of wrongNos){
    let bank = findBankEntry(examId, no);
    if(!bank){
      const q = exam.questions.find(q=>q.no===no);
      if(!q) continue;
      const candidates = q.unit ? DATA.unitBank.filter(u=>u.unit===q.unit) : [];
      const match = candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : null;
      if(match){
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: match.content, variantAnswer: match.answer,
          status:'approved', source:'unitbank', unitBankId: match.id
        };
        matchedFromBank++;
      } else {
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: '', variantAnswer: '',
          status:'pending'
        };
        newlyRequested++;
      }
      DATA.problemBank.push(bank);
      await dbSetDoc('problembank', bank.id, bank);
    }
    if(!rec.wrongHomework.some(h=>h.bankId===bank.id)){
      rec.wrongHomework.push({bankId:bank.id, examId, questionNo:no, assignedAt:todayStr(), done:false, studentAnswer:''});
    }
  }
  await saveRecord(sid);
  state.wrongChecked = {};
  let msg = '제출되었습니다.';
  if(matchedFromBank>0 && newlyRequested>0) msg = `제출되었습니다. ${matchedFromBank}개는 바로 숙제로 나갔고, ${newlyRequested}개는 선생님이 등록하면 나갑니다.`;
  else if(matchedFromBank>0) msg = '제출되었습니다. 문항 창고에서 바로 숙제로 나갔습니다.';
  else if(newlyRequested>0) msg = '제출되었습니다. 선생님이 쌍둥이 문제를 등록하면 숙제로 나갑니다.';
  showToast(msg);
  render();
}

    .replace(/'/g, '&#39;');
}

const HP_NS = 'http://www.hancom.co.kr/hwpml/2011/paragraph';
// 한글 수식 스크립트를 KaTeX가 그릴 수 있는 LaTeX로 변환하고 $..$ 로 감싼다.
// (완벽한 변환기는 아니고, 고등수학에서 자주 쓰는 패턴 위주로 처리한다)
// 문자열에서 openIdx가 가리키는 '{'와 짝이 맞는 ')'를 중첩까지 고려해서 찾는다.
// (예: sqrt{ ( x ^{2} ) ^{2} }처럼 안에 또 중괄호가 있는 경우 단순 정규식으론 못 잡음)
function findMatchingBrace(s, openIdx){
  let depth = 0;
  for(let i=openIdx;i<s.length;i++){
    if(s[i]==='{') depth++;
    else if(s[i]==='}'){ depth--; if(depth===0) return i; }
  }
  return -1;
}
// keyword 뒤의 "{...}"를 중첩 중괄호까지 포함해서 통째로 찾아 wrap(inner)로 치환한다.
function replaceBalancedKeyword(s, keyword, wrap){
  const re = new RegExp('\\b'+keyword+'\\s*\\{','g');
  let result = '', lastIndex = 0, m;
  while((m = re.exec(s))){
    const openIdx = m.index + m[0].length - 1;
    const closeIdx = findMatchingBrace(s, openIdx);
    if(closeIdx===-1) continue;
    const inner = s.slice(openIdx+1, closeIdx);
    result += s.slice(lastIndex, m.index) + wrap(inner);
    lastIndex = closeIdx+1;
    re.lastIndex = closeIdx+1;
  }
  result += s.slice(lastIndex);
  return result;
}
// "{분자} over {분모}"를 \frac{}{}로 바꾼다. 분자/분모 안에 또 중괄호(예: 지수)가 있어도
// 괄호 짝을 직접 세어가며 찾기 때문에 중첩된 경우도 정확히 처리되고, 재귀적으로 안쪽도 변환한다.
function convertOverToFrac(s){
  let result = '', i = 0;
  while(i < s.length){
    if(s[i]==='{'){
      const close1 = findMatchingBrace(s, i);
      if(close1!==-1){
        let j = close1+1;
        while(s[j]===' ') j++;
        if(s.slice(j,j+4)==='over'){
          let k = j+4;
          while(s[k]===' ') k++;
          if(s[k]==='{'){
            const close2 = findMatchingBrace(s, k);
            if(close2!==-1){
              const num = convertOverToFrac(s.slice(i+1, close1));
              const den = convertOverToFrac(s.slice(k+1, close2));
              result += '\\frac{'+num+'}{'+den+'}';
              i = close2+1;
              continue;
            }
          }
        }
      }
    }
    result += s[i];
    i++;
  }
  return result;
}
function convertHwpEq(script){
  let s = script || '';
  if(!s.trim()) return '';
  s = s.replace(/`/g, '');
  s = s.replace(/\brm\s*/g, '');
  // "it"(이탤릭 지정)은 rm과 같은 서체 지정 명령이라 내용만 남기고 지운다.
  // "it2r+3"(공백 없음), "it r ^{2}"(공백 있음) 둘 다 나오므로 뒤 공백까지 함께 지운다.
  s = s.replace(/\bit\s*(?=[0-9a-zA-Z(])/g, '');
  s = replaceBalancedKeyword(s, 'pmatrix', inner => '\\begin{pmatrix}' + inner.replace(/#/g,'\\\\') + '\\end{pmatrix}');
  s = replaceBalancedKeyword(s, 'cases', inner => '\\begin{cases}' + inner.replace(/#/g,'\\\\') + '\\end{cases}');
  const greek = {alpha:'\\alpha',beta:'\\beta',gamma:'\\gamma',delta:'\\delta',theta:'\\theta',pi:'\\pi',lambda:'\\lambda',mu:'\\mu',sigma:'\\sigma',phi:'\\phi',omega:'\\omega'};
  for(const k in greek) s = s.replace(new RegExp('\\b'+k+'\\b','g'), greek[k]);
  // le/ge/LEQ 등은 it과 마찬가지로 뒤에 공백 없이 숫자가 바로 붙는 경우(le5)가 있어
  // 뒤쪽 \b는 안 쓰고 시작 위치만 단어 경계로 확인한다. 방금 만든 "\leq"의 "le"를
  // 다시 건드리지 않도록(무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = s.replace(/(?<!\\)\bLEQ/gi, '\\leq').replace(/(?<!\\)\bGEQ/gi, '\\geq').replace(/(?<!\\)\bNEQ/gi, '\\neq');
  s = s.replace(/(?<!\\)\ble/g, '\\leq').replace(/(?<!\\)\bge/g, '\\geq');
  s = s.replace(/\bTIMES\b/gi, '\\times');
  // angle/bar는 "angle{BAD}"(중괄호), "angle BAD"(공백), "angleBAD"(붙여쓰기) 세 가지 형태가
  // 모두 나오므로 각각 처리한다. 방금 만든 "\angle"/"\overline"을 다시 건드리지 않도록
  // (무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = replaceBalancedKeyword(s, 'angle', inner => '\\angle ' + inner);
  s = s.replace(/(?<!\\)\bangle\s+([A-Za-z]+)\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle([A-Z]{1,3})\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle\b/g, '\\angle');
  s = replaceBalancedKeyword(s, 'bar', inner => '\\overline{' + inner + '}');
  s = s.replace(/(?<!\\)\bbar\s+([A-Za-z]+)\b/g, '\\overline{$1}');
  s = s.replace(/(?<!\\)\bbar([A-Z]{1,3})\b/g, '\\overline{$1}');
  s = s.replace(/LEFT\s*\(/g, '\\left(').replace(/RIGHT\s*\)/g, '\\right)');
  s = convertOverToFrac(s);
  s = replaceBalancedKeyword(s, 'sqrt', inner => '\\sqrt{' + inner + '}');
  // 첨자가 여러 글자인데 중괄호 없이 붙어있으면(a_11 등) LaTeX에서 첫 글자만
  // 첨자로 처리되어 깨지므로, 중괄호로 다시 감싸준다.
  s = s.replace(/([_^])(?!\{)([0-9a-zA-Z]+)/g, '$1{$2}');
  s = s.replace(/\s+/g, ' ').trim();
  return s ? '$' + s + '$' : '';
}
// 수식 개체가 아니라 그냥 평문(<hp:t>)으로 "barAD", "angleBAD"처럼 붙여 쓴 경우를 정리한다.
function cleanHwpPlainText(t){
  if(!t) return t;
  return t
    .replace(/\bbar([A-Z]{1,3})\b/g, '$\\overline{$1}$')
    .replace(/\bangle([A-Z]{1,3})\b/g, '$\\angle $1$');
}
const HWP_CORE_NS = 'http://www.hancom.co.kr/hwpml/2011/core';
const HWP_WATERMARK_PATTERNS = [/족보닷컴/, /zocbo\.com/i];
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
function hwpWalkParagraphs(paras, tokens){
  for(const p of paras){
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType !== 1) continue;
        const local = child.localName;
        if(local === 't'){
          tokens.push({type:'text', v: cleanHwpPlainText(child.textContent||'')});
        } else if(local === 'equation'){
          const scriptEl = child.getElementsByTagNameNS(HP_NS,'script')[0];
          tokens.push({type:'eq', v: convertHwpEq(scriptEl?scriptEl.textContent:'')});
        } else if(local === 'pic'){
          const imgEl = child.getElementsByTagNameNS(HWP_CORE_NS,'img')[0];
          const ref = imgEl ? imgEl.getAttribute('binaryItemIDRef') : null;
          if(ref) tokens.push({type:'pic', v: ref});
        } else if(local === 'tbl'){
          // 보기(①②③④⑤) 같은 작은 표는 같은 행 안에서는 줄바꿈 없이 공백으로만
          // 구분해서, 세로로 한 줄씩 쌓이지 않고 가로로 나열되게 한다.
          const trs = Array.from(child.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
          for(const tr of trs){
            const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
            for(const tc of tcs){
              const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
              if(subList){
                const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
                const cellTokens = [];
                hwpWalkParagraphs(cellParas, cellTokens);
                while(cellTokens.length && cellTokens[cellTokens.length-1].type==='break') cellTokens.pop();
                if(cellTokens.length){
                  tokens.push(...cellTokens);
                  tokens.push({type:'text', v:' '});
                }
              }
            }
          }
          tokens.push({type:'break'});
        } else if(local === 'ctrl'){
          const endNoteEl = child.getElementsByTagNameNS(HP_NS,'endNote')[0];
          if(endNoteEl){
            tokens.push({type:'endnote', v: hwpEndnoteText(endNoteEl)});
          } else if(child.getElementsByTagNameNS(HP_NS,'autoNum')[0]?.getAttribute('numType')==='ENDNOTE'){
            // 문서 맨 뒤 "빠른정답" 요약처럼 진짜 hp:endNote가 아닌 평문 목록을 만나면
            // 문항 구간이 끝난 것으로 보고 멈춘다.
            tokens.push({type:'stop'});
          }
        }
      }
    }
    tokens.push({type:'break'});
  }
}
function hwpEndnoteText(endNoteEl){
  const subList = endNoteEl.getElementsByTagNameNS(HP_NS,'subList')[0];
  const innerParas = subList ? Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p') : [];
  const innerTokens = [];
  hwpWalkParagraphs(innerParas, innerTokens);
  let ans = '';
  for(const it of innerTokens){ if(it.type==='text'||it.type==='eq') ans += it.v; }
  // "[정답]" 라벨과, 일부 문서에서 수식 앞에 자동으로 붙는 "수식입니다." 안내 문구를 제거한다.
  return ans.replace(/^\s*\[정답\]\s*/,'').replace(/수식입니다\.?/g,'').trim();
}
// 표의 셀 하나를 문제 하나로 취급해서 텍스트/그림/(있다면) 정답을 뽑는다.
// 표 기반 시험지는 "번호 인식"을 미주 등장 시점에 의존하면 정답이 없는 문항에서
// 여러 문제가 한 덩어리로 뭉쳐버리는 문제가 있어서, 셀 경계를 기준으로 삼는 게 훨씬 안정적이다.
function hwpCellToBlock(cellParas){
  const tokens = [];
  hwpWalkParagraphs(cellParas, tokens);
  let text = '', answer = null, pics = [];
  for(const tok of tokens){
    if(tok.type === 'endnote') answer = tok.v;
    else if(tok.type === 'text' || tok.type === 'eq') text += tok.v;
    else if(tok.type === 'pic') pics.push(tok.v);
    else if(tok.type === 'break') text += '\n';
  }
  return { text, answer, pics };
}
function hwpParseBlocks(topParas){
  const blocks = [];
  let plainTokens = [];
  let stopped = false;
  function flushPlain(){
    if(plainTokens.length===0) return;
    let cur = { text:'', answer:null, pics:[] };
    for(const tok of plainTokens){
      if(tok.type === 'stop'){ stopped = true; break; }
      if(tok.type === 'endnote'){
        if(cur.text.trim()) blocks.push(cur);
        cur = { text:'', answer: tok.v, pics:[] };
      } else if(tok.type === 'text') cur.text += tok.v;
      else if(tok.type === 'eq') cur.text += tok.v;
      else if(tok.type === 'pic') cur.pics.push(tok.v);
      else if(tok.type === 'break') cur.text += '\n';
    }
    if(cur.text.trim()) blocks.push(cur);
    plainTokens = [];
  }
  for(const p of topParas){
    if(stopped) break;
    // 이 문단 바로 아래에 최상위 표(문항 박스 레이아웃)가 있는지 찾는다.
    let foundTable = null;
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType===1 && child.localName==='tbl') foundTable = child;
      }
    }
    if(foundTable){
      flushPlain();
      const trs = Array.from(foundTable.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
      for(const tr of trs){
        const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
        for(const tc of tcs){
          const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
          if(subList){
            const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
            const b = hwpCellToBlock(cellParas);
            if(b.text.trim()) blocks.push(b);
          }
        }
      }
    } else {
      hwpWalkParagraphs([p], plainTokens);
    }
  }
  flushPlain();
  return blocks;
}
async function parseHwpxToProblems(file){
  await ensureJSZipLoaded();
  const zip = await JSZip.loadAsync(file);
  const sectionFile = zip.file('Contents/section0.xml');
  if(!sectionFile) throw new Error('올바른 hwpx 파일이 아닙니다.');
  const xmlText = await sectionFile.async('string');
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const sec = doc.documentElement;
  const topParas = Array.from(sec.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');

  const blocks = hwpParseBlocks(topParas);

  // 문제 칸 안에서 정답을 못 찾은 문항이 있으면(정답이 문제와 분리된 별도 표에
  // 순서대로 나열된 문서 양식), 문서 전체의 미주를 등장 순서대로 모아 같은 순번끼리 매칭한다.
  const missingCount = blocks.filter(b=>!b.answer).length;
  if(missingCount > 0){
    const allEndnotes = Array.from(doc.getElementsByTagNameNS(HP_NS,'endNote'));
    const orderedAnswers = allEndnotes.map(hwpEndnoteText);
    if(orderedAnswers.length === blocks.length){
      blocks.forEach((b,i)=>{ if(!b.answer) b.answer = orderedAnswers[i]; });
    }
  }

  // 저작권 보호 워터마크(예: 족보닷컴)가 문제나 정답에 섞인 문항은 자동 인식에서 제외한다.
  let watermarked = 0;
  const clean = blocks.filter(b=>{
    const hay = b.text + ' ' + (b.answer||'');
    if(HWP_WATERMARK_PATTERNS.some(re=>re.test(hay))){ watermarked++; return false; }
    return true;
  });

  // 문항에 딸린 그림이 있으면 hwpx 안의 실제 이미지 파일을 꺼내 압축해 첨부한다.
  let idToHref = {};
  const hpfFile = zip.file('Contents/content.hpf');
  if(hpfFile){
    const hpfText = await hpfFile.async('string');
    const hpfDoc = new DOMParser().parseFromString(hpfText, 'text/xml');
    const items = hpfDoc.getElementsByTagName('opf:item');
    for(const it of Array.from(items)){
      const id = it.getAttribute('id'), href = it.getAttribute('href');
      if(id && href) idToHref[id] = href;
    }
  }
  const problems = [];
  for(const b of clean){
    const problem = { content: b.text.trim(), answer: (b.answer||'').trim(), image: null };
    const ref = b.pics[0];
    if(ref && idToHref[ref]){
      const imgFile = zip.file(idToHref[ref]);
      if(imgFile){
        try{
          const blob = await imgFile.async('blob');
          problem.image = await compressImageToBase64(blob, 1000, 0.6);
        }catch(e){ console.error('그림 추출 실패', ref, e); }
      }
    }
    problems.push(problem);
  }
  problems.watermarkedCount = watermarked;
  return problems;
}

async function confirmUnitBankImport(){
  syncUnitImportPreviewFromDOM();
  const rows = state.unitImportPreview;
  if(!rows || rows.length===0) return;
  const CONCURRENCY = 15;
  const today = todayStr();
  let ok = 0, done = 0;
  state.importProgress = { done: 0, total: rows.length };
  render();
  for(let i=0; i<rows.length; i+=CONCURRENCY){
    const chunk = rows.slice(i, i+CONCURRENCY);
    const results = await Promise.all(chunk.map(async r => {
      let image = '', imageFileId = '';
      if(r.image){
        try{
          const up = await uploadDataUrlToDrive(r.image);
          image = up.url; imageFileId = up.fileId;
        }catch(e){ console.error('단원문항 이미지 업로드 실패', e); }
      }
      const { image:_drop, ...rest } = r;
      return collectionAdd('unitbank', { ...rest, image, imageFileId, createdAt: today });
    }));
    results.forEach(doc => { if(doc){ DATA.unitBank.unshift(doc); ok++; } });
    done += chunk.length;
    state.importProgress = { done, total: rows.length };
    render();
  }
  state.importProgress = null;
  state.unitImportPreview = null;
  showToast(ok + '개 문항이 창고에 추가되었습니다.' + (ok<rows.length ? ` (${rows.length-ok}건 실패)` : ''));
  render();
}

}

// 홈 화면의 "이달의 진도 성취도" 원형 그래프.
/* progressRingSVG(반 진도 도넛)은 지웠다 — 학생 홈에만 있던 것이고,
   진도는 제 화면(학습 > 진도·과제)에서 바(.bar)와 단원 목록으로 말한다.
   같은 값을 두 곳에서 다른 모양으로 말할 이유가 없다. */
function renderScoreChart(scores){
  if(!scores || scores.length===0) return '<div class="empty">등록된 성적이 없습니다.</div>';
  const w=560,h=180,pad=30;
  const pts = scores.map(s=> Math.round((s.score/s.total)*100));
  const n = pts.length;
  const stepX = n>1 ? (w-pad*2)/(n-1) : 0;
  const coords = pts.map((p,i)=>{
    // 점이 1개뿐일 땐 왼쪽 끝에 붙이지 않고 가운데 배치 — 안 그러면 차트 대부분이 텅 비어 보임.
    const x = n>1 ? (pad + stepX*i) : (w/2);
    const y = h-pad - (p/100)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>
    '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="4" fill="#6E2A2F"></circle>'+
    '<text x="'+c[0].toFixed(1)+'" y="'+(c[1]-10).toFixed(1)+'" font-size="11" fill="#3D3335" text-anchor="middle" font-family="JetBrains Mono, monospace">'+pts[i]+'%</text>'
  ).join('');
  const gridLines = [0,25,50,75,100].map(v=>{
    const y = h-pad-(v/100)*(h-pad*2);
    return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#E7DED9" stroke-width="1"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#7D7274" font-family=\'JetBrains Mono, monospace\'>'+v+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:600px;height:auto;">'+gridLines+
    '<path d="'+path+'" fill="none" stroke="#AE4B53" stroke-width="2.5"/>'+dots+'</svg>';
}

let lastSyncedHash = null;
function syncHistory(){
  const newHash = buildHashFromState();
  if(newHash === lastSyncedHash) return;
  const snap = {view:state.view, teacherTab:state.teacherTab, studentTab:state.studentTab, assistantTab:state.assistantTab};
  if(lastSyncedHash===null) history.replaceState(snap, '', newHash); // 첫 렌더는 기록을 새로 안 쌓고 지금 자리를 교체만
  else history.pushState(snap, '', newHash);
  lastSyncedHash = newHash;
}

function render(){
  const app = document.getElementById('app');
  // 탭 렌더 함수들이 내부에서 markSeen()을 호출해 알림을 "확인함" 처리하는 경우가 있어서,
  // 알림 뱃지를 그리는 headerHTML()보다 본문을 먼저 계산해야 뱃지가 한 렌더 늦게 갱신되지 않는다.
  let bodyHtml = '';
  if(state.view==='home') bodyHtml = homeHTML();
  else if(state.view==='login') bodyHtml = loginHTML();
  else if(state.view==='student') bodyHtml = studentHTML();
  else if(state.view==='teacher') bodyHtml = teacherHTML();
  else if(state.view==='assistant') bodyHtml = assistantHTML();
  /* 모든 화면이 자기 셸(상단바·푸터)을 스스로 갖는다. 덧씌우는 공용 껍데기는 없다. */
  let html = bodyHtml;
  if(state.toast) html += `<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B1B1D;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;">${state.toast}</div>`;
  app.innerHTML = html;
  if(window.renderMathInElement){
    try{
      renderMathInElement(app, {
        delimiters: [{left:'$', right:'$', display:false}],
        throwOnError: false
      });
    }catch(e){ console.error('수식 렌더링 실패', e); }
  }
  if(state.view==='student' && state.studentTab==='video' && state.currentUser){
    mountVideoTrackers(state.currentUser.studentId);
  }
  /* 채팅은 «마지막 말»이 있는 곳에서 열려야 한다. 전체 재렌더링이라 매번 위로 되돌아간다. */
  const chatBox = app.querySelector('.sap-chat, .ch-win, .fm-chat');
  if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
  /* 랜딩의 등장·상단바. 시안의 <script>는 innerHTML로 들어가면 실행되지 않는다. */
  if(state.view==='home') mountLanding();

/* headerHTML() · footerHTML()은 지웠다.
   공개 사이트용 헤더(로고 + 학생 메뉴 + 로그인 버튼)와 푸터를 render()가 덧씌우던 것인데,
   이제 **모든 화면이 자기 셸을 스스로 갖는다** — 공개 홈은 .l-bar/.l-foot,
   관리자·조교·학생은 .topbar, 로그인은 로고 하나. 덧씌우면 상단바가 두 겹이 됐다.
   notificationBellHTML도 함께 지웠다 — 학생은 bellHTML, 관리자는 상단바가 맡는다. */


/* =================== 공개 홈 — 랜딩 「하루」 (landing-v2/index.html) ===================
   **이 학원이 일하는 하루를 방문자가 목격한다.**
   기존 5안이 전부 «수학»을 소재로 썼다면 이번은 «서비스»를 소재로 쓴다.
   컨셉과 기각 사유는 CLAUDE.md 6-B에 있다.

   콘텐츠는 전부 아래 상수에 모여 있다. 레이아웃은 콘텐츠를 모른다 —
   문자열만 갈면 페이지가 그대로 돌아간다.

   **시안에 없던 것을 셋 붙였다.** 시안은 개념 페이지라 다섯 장면(도착·하루·전환·사람·행동)뿐인데,
   실서비스 홈은 진짜 내용을 싣고 있었다. 없애면 안 되는 것만 골라 «하루»의 언어로 옮겼다.
     들은 말 — 수강생 후기 9개. 마퀴(자동으로 흐르던 띠)를 버리고 메모 종이로 세웠다.
                시스템에서 «사람이 적은 것»은 전부 이 종이색이고, 후기는 학생이 적은 것이다.
                (마퀴는 prefers-reduced-motion 대응도 없었다 — 9절 7번)
     기록     — 경력·성과. 시안이 CONTENT.credits로 «자리»만 잡아 둔 칸이 바로 여기다
     공지     — 실데이터. 헤더 메뉴(scrollToId('sec-notice'))가 걸려 있다

   **커리큘럼(고1/고2/고3 카드 3개)은 뺐다.** 고등수학 어디나 같은 내용이라 브랜드가 없다 —
   랜딩 5안을 기각한 이유(「아무 수학 강사나 쓸 수 있는 소재」)에 그대로 걸린다.
   필요하면 상담에서 말한다.

   ⚠ 시안의 <script>는 그대로 못 옮긴다. render()가 innerHTML로 넣는 문자열이라
   그 안의 <script>는 실행되지 않는다. 등장·상단바는 mountLanding()이 맡는다. */

const HOME_CONTENT = {
  /* 실제 반 시간표에서 나온 값이다. 지어낸 시각이 아니다.
     수치를 쓰지 않는다 — 공개 페이지의 숫자는 방문자가 사실로 읽는다. */

/* 등장과 상단바. render()가 문자열을 innerHTML로 넣기 때문에 시안의 <script>는 실행되지 않는다 —
   그 몫을 여기서 한다. 관찰자는 렌더마다 새로 만들므로 «이전 것»을 반드시 끊는다. */
let lpObservers = [];
function mountLanding(){
  lpObservers.forEach(o=>o.disconnect());
  lpObservers = [];
  const root = document.querySelector('.lp');
  if(!root) return;

  const rises = root.querySelectorAll('.l-rise, .l-draw');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 한 번 드러난 뒤에는 다시 흐려지지 않는다. 전체 재렌더링 구조라 토스트 하나에도
     페이지가 통째로 다시 페이드인하면 어지럽다.
     ⚠ IntersectionObserver가 없으면 «전부 보이게» 떨어져야 한다 — .l-rise는 opacity:0이라
     관찰자가 안 붙으면 공개 페이지가 통째로 백지가 된다. 감출 바에 안 움직이는 편이 낫다. */
  if(reduce || state.lpRevealed || !window.IntersectionObserver){
    rises.forEach(el=>el.classList.add('in'));
  } else {
    const spine = root.querySelector('#lp-spine');
    if(spine) spine.classList.add('in');
    /* 히어로는 스크롤을 기다리지 않고 순서대로 들어온다 */
    root.querySelectorAll('.l-hero .l-rise').forEach((el,i)=>
      setTimeout(()=>el.classList.add('in'), 260 + i*170));
    const io = new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(!e.isIntersecting) return;
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, {threshold:.18, rootMargin:'0px 0px -8% 0px'});
    rises.forEach(el=>{ if(!el.closest('.l-hero')) io.observe(el); });
    lpObservers.push(io);
    state.lpRevealed = true;
  }

  const bar = root.querySelector('#lp-bar');
  const hero = root.querySelector('.l-hero');
  if(bar && hero){
    const bio = new IntersectionObserver(es=>{
      bar.classList.toggle('on', !es[0].isIntersecting);
    }, {threshold:0, rootMargin:'-72px 0px 0px 0px'});
    bio.observe(hero);
    lpObservers.push(bio);
  }
}
