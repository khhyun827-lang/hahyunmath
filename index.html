/* =================== 데일리퀴즈 — 학생별 오답 간격 반복 ===================
   예전에는 «교사가 문제를 하나 써서 반에 낸다»였다 (`quizzes` 컬렉션).
   그 구조에는 정답 필드가 없어 채점이라는 개념 자체가 없었고, 반이 전부 같은 문제를 풀었다.

   지금은 **학생이 틀린 것에서 뽑는다.** 풀(pool)은 그 학생의 `wrongHomework`이고,
   한 문항이 카드 둘을 낳는다 — «원본»(그때 틀린 그 문제)과 «변형»(AI 쌍둥이).
   둘 다 problembank에 정답이 이미 있으므로 **자동 채점된다.**
   («데일리퀴즈 정답률은 못 만든다»가 이걸로 풀린다 — 없던 것은 정답이었지 채점 능력이 아니었다.)

   컬렉션을 늘리지 않았다 — 수업 메모·학생 메모와 같은 판단이다.
   상태는 `kv/record:{학생id}`의 `dailyQuiz` 필드 하나에 들어간다. */
const DQ_PER_DAY = 3;
/* 맞힌 횟수별 «다음에 다시 나오기까지»의 일수. 다 지나면 은퇴한다.
   틀리면 streak가 0으로 돌아가 다음날 다시 나온다 — 틀린 것을 오래 묵히지 않는 것이 이 화면의 일이다. */
const DQ_STEPS = [3, 7, 14];

function dqState(rec){
  if(!rec.dailyQuiz) rec.dailyQuiz = {day:'', picks:[], cards:{}, log:[]};
  const d = rec.dailyQuiz;
  if(!d.picks) d.picks = [];
  if(!d.cards) d.cards = {};
  if(!d.log)   d.log = [];
  return d;
}

/* ⚠ 학생이 «입력칸에 그대로 칠 수 있는» 답인가. 아니면 그 문제는 아예 내지 않는다.
   채점이 문자열 비교(===)라, 못 치는 답을 가진 문제를 내면 **영원히 오답**이 된다.
   그리고 오답은 다음날 다시 나오므로 그 카드가 로테이션을 통째로 막아 버린다.
   실제로 시험지에 `$0 \leq a <1$ 또는 $3<a \leq 5$` 같은 정답이 들어 있었다.

   answerFormProblem()과 다른 함수인 이유 — 저쪽은 AI에게 시킨 «999 이하» 약속이
   지켜졌는지 보는 «검수»용이다. 여기서 묻는 것은 «칠 수 있는가»뿐이라 더 느슨하다:
   정답 1512는 검수에선 걸리지만 학생은 칠 수 있다. 통과하면 «정규화된 답»을 돌려준다. */
function dqAnswerable(content, answer){
  const a = normalizeTwinAnswer(answer);          // hwpx·AI가 숫자에도 $를 두른다
  if(!a) return null;
  if(isMultipleChoice(content)) return CHOICE_SYMBOLS.includes(a) ? a : null;
  return /^-?[0-9]+(\.[0-9]+)?$/.test(a) ? a : null;
}

/* =================== 오답숙제를 읽는 두 가지 문 ===================
   ⚠ **문항이 사라져도 학생 기록의 숙제는 남는다.** 시험지 삭제(`deleteExam`)는 딸린 숙제까지
      털지만, 그 길을 «타지 않고» 문항이 없어지는 경우가 있다 — 컬렉션을 손으로 비웠거나,
      지우다 중간에 끊겼거나. 그러면 `bankId`가 아무 데도 닿지 않는 숙제가 남는다.
      실제로 그런 숙제 15건이 테스트학생 기록에 남아 **거짓 「위험」 신호**를 만들고 있었고,
      학생 화면에는 「삭제된 시험지 0/15」짜리 **유령 구획**이 떴다.
   그래서 «읽는 쪽»에서 막는다. 지우는 쪽을 아무리 조여도 이미 남은 것은 못 지운다. */
function liveWrongHomework(rec){
  return (rec && rec.wrongHomework || []).filter(h => DATA.problemBank.some(b => b.id === h.bankId));
}
/* «아직 해야 할» 오답숙제 — 살아 있고 · 공개됐고 · 아직 안 낸 것.
   ⚠ 같은 조건이 네 곳(할 일 줄 · 서브내비 숫자 · 퀴즈 빈 화면 · 신호)에 필요하다.
      복제해 두었더니 **신호 한 곳만 조건이 빠져** 이 사달이 났다. 한 곳에서만 정한다. */
function wrongHomeworkLeft(rec){
  return (rec && rec.wrongHomework || []).filter(h => {
    const b = DATA.problemBank.find(x => x.id === h.bankId);
    return b && b.status === 'approved' && !h.done;
  });
}

/* =================== 과제 제출 · 승인 ===================
   과제는 오래 «학생이 스스로 누르는 참/거짓» 하나였다. 이제 흐름이 생겼다 —
   학생이 **사진을 올려 제출**하면 강사·조교가 보고 **수락**하거나 **반려**한다.
   온라인으로 안 낸 학생도 현장에서 보여 주면 그 자리에서 **현장 확인**으로 완료가 된다.

   ⚠ **옛 기록은 마이그레이션하지 않는다.** `assignmentsDone[id] === true`로 저장된 것이
      이미 있는데, 기록을 통째로 다시 쓰는 일은 이 앱에서 제일 위험한 작업이다
      (2026-08-12에 그렇게 한 학생의 기록을 날렸다). **읽는 쪽에서 흡수한다** —
      참이면 «수락됨»으로 읽는다. 그러면 옛 기록도 새 화면에서 그대로 완료로 보인다.

   ⚠ **읽는 문을 처음부터 하나로 둔다.** 오늘 오답숙제 신호 버그가 «같은 조건문 네 벌 중
      한 곳만 빠져서» 났다. 과제 상태를 보는 곳은 그보다 많다 — 전부 아래 셋만 부른다. */
/* 🔵 **「보완 필요」를 더했다** (2026-09-01 · C-15 · 사용자가 시켰다).
   사용자의 말 — 「**과제가 하긴 하는데 미비한 학생들이 있어서 완료, 미제출 제외하고도
     미흡?미비?와 같은 선택지도 있으면 좋겠어**」.
   🔴 **«한 것»으로 센다 — 사용자가 그렇게 정했다.** `hwIsDone`이 참이고 `hwNeedsAction`이 거짓이다.
     그러니 제출률·리포트·신호(과제 누락)에 **완료와 똑같이** 들어가고, 학생은 다시 안 내도 된다.
     ⚠ **반려와 헷갈리지 말 것** — 반려는 «다시 해라»(할 일이 남는다), 보완 필요는
       «통과시키되 미비했다고 적어 둔다»(할 일이 없다). 사유를 안 받는 이유도 그것이다.
   ⚠ **옛 기록에는 이 값이 없다** — `hwState`가 모르는 값을 HW_NONE으로 떨구지 않는지 보라.
     지금은 `v.status || HW_NONE`이라 저장된 문자열을 그대로 쓴다. 안전하다. */
const HW_NONE = 'none', HW_SUBMITTED = 'submitted', HW_APPROVED = 'approved',
      HW_REJECTED = 'rejected', HW_PARTIAL = 'partial';
function hwState(rec, hwId){
  const v = rec && rec.assignmentsDone ? rec.assignmentsDone[hwId] : null;
  if(v === true)  return { status: HW_APPROVED, photos: [], legacy: true };   // 옛 기록
  if(!v || typeof v !== 'object') return { status: HW_NONE, photos: [] };
  /* 드라이브 주소가 있는 것만 사진으로 친다 — 올리다 만 칸이 기록에 남아 있어도
     («blob:…» previewUrl만 든 것) 화면에서 깨진 그림으로 뜨지 않는다. */
  return { ...v, status: v.status || HW_NONE, photos: (v.photos || []).filter(p=>p && p.url) };
}
/* «완료»는 오직 수락된 것이다. 제출만 해 둔 것은 아직 아니다 —
   그걸 완료로 세면 강사가 보기도 전에 숫자가 차서 검토할 이유가 사라진다. */
/* ⚠ **「보완 필요」도 «한 것»이다** (2026-09-01 · C-15) — 여기 한 줄이 제출률·리포트·신호를
   전부 정한다. 이 판정을 바꾸면 그 셋이 한꺼번에 움직인다. */
function hwIsDone(rec, hwId){
  const s = hwState(rec, hwId).status;
  return s === HW_APPROVED || s === HW_PARTIAL;
}
/* 학생이 손댈 일이 남았는가 — 안 냈거나(none) 반려됐거나(rejected).
   제출해 둔 것은 «기다리는 중»이라 할 일이 아니다. */
function hwNeedsAction(rec, hwId){
  const s = hwState(rec, hwId).status;
  return s === HW_NONE || s === HW_REJECTED;
}

/* 이 학생이 풀 수 있는 카드 전부. 순수 계산이라 렌더 중에 불러도 안전하다.

   ⚠ **오답숙제를 끝낸 문항만 들어온다** (`h.done`). 두 화면의 역할을 갈라 두는 선이다 —
   오답숙제는 «틀린 것을 한 번 제대로 푸는 곳»이고, 데일리퀴즈는 «그 뒤에 잊지 않게 하는 곳»이다.
   이 선이 없으면 아직 손도 안 댄 숙제가 퀴즈로 먼저 나와 학생 눈에 같은 문제가 두 곳에 뜬다.
   («숙제를 끝냈다»는 곧 그 변형을 실제로 제출했다는 뜻이라, 낼 수 없는 문항은 자연히 빠진다.) */
function dqPool(rec){
  const out = [];
  (rec.wrongHomework||[]).forEach(h=>{
    if(!h.done) return;
    const b = DATA.problemBank.find(x=>x.id===h.bankId);
    if(!b) return;
    const base = {bankId:b.id, no:h.questionNo, examId:h.examId,
                  chapter:b.chapter||'', subject:b.subject||''};
    /* 원본은 검토 상태와 무관하다 — 교사가 시험지에 직접 넣은 문제다.
       변형만 approved를 본다. 검토 중인 쌍둥이가 나가면 학생이 못 푸는 문제가 뜬다. */
    const oa = b.originalContent ? dqAnswerable(b.originalContent, b.originalAnswer) : null;
    if(oa) out.push({...base, id:b.id+':orig', kind:'orig', content:b.originalContent, answer:oa,
                     imgKind: b.hasImage ? 'orig' : null});
    const va = (b.status==='approved' && b.variantContent)
      ? dqAnswerable(b.variantContent, b.variantAnswer) : null;
    /* ⚠ 그림은 카드마다 다르다. 원본은 늘 자기 그림을 쓰고, 변형은 variantImgKind()가 정한다. */
    if(va) out.push({...base, id:b.id+':var', kind:'var', content:b.variantContent, answer:va,
                     imgKind: variantImgKind(b)});
  });
  return out;
}
function dqCardById(rec, cardId){ return dqPool(rec).find(c=>c.id===cardId); }

/* 변형 카드가 쓸 그림이 무엇인가. 오답숙제·데일리퀴즈·시험지 탭이 전부 이 함수 하나만 본다 —
   규칙이 두 벌이면 화면마다 다른 그림이 뜬다.
     'var'  (B) 강사가 새로 그려 붙인 것
     null   (A) «그림 없이 푸는 문제»로 새로 썼다. 또는 (B)인데 아직 안 그려진 것
            (그건 애초에 공개되지 않으므로 학생에게는 안 간다)
     'orig' (C) 그림이 배경이라 원본 것을 그대로 쓴다 — 지도·배치도·대진표.
            2026-08-10 이전에 만든 옛 쌍둥이도 여기로 온다. 그때는 «도형 문제의 쌍둥이는
            같은 그림을 쓴다»가 규칙이었으므로 그 약속을 그대로 지킨다 */
function variantImgKind(b){
  if(b.hasVariantImage) return 'var';
  if(b.variantReuseFigure) return b.hasImage ? 'orig' : null;
  if(b.variantFigureFree || b.variantNeedsFigure) return null;
  return b.hasImage ? 'orig' : null;
}

/* ---------- 지금 시험 범위 안인가 ----------
   범위를 모르면(반이 과목을 안 정했거나 프리셋이 없으면) 거르지 않는다 —
   모른다고 다 막으면 화면이 통째로 비어 «고장난 줄» 알게 된다.
   단원이 없는 문항은 어느 범위에도 안 든다. 등록 화면이 그 사실을 미리 말해 준다. */
function dqInRange(card, range){
  if(!range) return true;
  return !!card.chapter && range.has(card.chapter);
}
/* 오늘 낼 후보 — 범위 안 · 한 번도 안 나온 것 + 복습 날짜가 된 것. 은퇴한 것은 빠진다. */
function dqDueCards(rec, today, range){
  const cards = dqState(rec).cards;
  return dqPool(rec).filter(c=>{
    if(!dqInRange(c, range)) return false;
    const st = cards[c.id];
    if(!st) return true;
    if(!st.due) return false;
    return st.due <= today;
  });
}

/* 오늘 것을 «한 번만» 뽑아 기록에 박아 둔다.
   render()가 전체 재렌더링이라, 뽑기를 그릴 때마다 하면 화면을 그릴 때마다 문제가 바뀐다. */
function dqRoll(rec, today, range){
  const d = dqState(rec);
  /* ⚠ **범위 밖에서는 복습 시계를 멈춘다.** 안 그러면 시즌이 넘어가 있던 동안에도
     due가 계속 흘러, 방학에 범위를 다시 열 때 수십 장이 한꺼번에 밀린 상태로 쏟아진다.
     그러면 «3일 뒤»였던 것과 «14일 뒤»였던 것이 구분되지 않아 간격 반복이 무너진다.
     마지막으로 뽑은 날(d.day)이 있으므로 그 사이 지난 만큼 밀어 주면 된다. */
  const gap = d.day ? Math.round(
    (new Date(today+'T00:00:00Z') - new Date(d.day+'T00:00:00Z')) / 86400000) : 0;
  if(gap > 0){
    dqPool(rec).forEach(c=>{
      const st = d.cards[c.id];
      if(st && st.due && !dqInRange(c, range)) st.due = shiftYmd(st.due, gap);
    });
  }
  const due = dqDueCards(rec, today, range);
  for(let i=due.length-1; i>0; i--){            // Fisher-Yates
    const j = Math.floor(Math.random()*(i+1));
    [due[i], due[j]] = [due[j], due[i]];
  }
  /* 같은 문항의 원본과 변형이 같은 날 나란히 나오지 않게 한다 — 답이 비슷해 복습이 안 된다.
     서로 다른 문항으로 채우지 못할 때만 남은 것에서 채운다. */
  const picks = [], rest = [], usedBank = new Set();
  due.forEach(c=>{
    if(picks.length < DQ_PER_DAY && !usedBank.has(c.bankId)){ picks.push(c); usedBank.add(c.bankId); }
    else rest.push(c);
  });
  for(const c of rest){ if(picks.length >= DQ_PER_DAY) break; picks.push(c); }
  d.day = today;
  d.picks = picks.map(c=>c.id);
}
/* 화면이 그려지기 «전»에 오늘 것이 정해져 있어야 한다. 저장은 비동기로 던진다 —
   기록은 이미 오늘 것을 들고 있으므로 화면은 기다릴 필요가 없다. */
function dqEnsureToday(sid, rec){
  const d = dqState(rec);
  const today = todayStr();
  if(d.day === today) return;
  dqRoll(rec, today, studentRange(sid));
  if(DATA.records[sid]) saveRecord(sid);
}
/* 오늘 낼 카드들 (풀에서 사라진 것은 조용히 뺀다 — 교사가 시험지를 지웠을 수 있다) */
function dqTodayCards(rec){
  const pool = dqPool(rec);
  return dqState(rec).picks.map(id=>pool.find(c=>c.id===id)).filter(Boolean);
}
function dqDoneToday(rec, cardId){
  const st = dqState(rec).cards[cardId];
  return st && st.at === todayStr() ? st : null;
}
/* «다음에 언제 또 나오나»를 사람 말로. 복습이라는 것을 학생이 알아야 반복이 납득된다. */
function dqNextLabel(st){
  if(!st) return '';
  if(!st.due) return '다 익혔습니다 — 이제 안 나옵니다';
  const days = Math.round((new Date(st.due+'T00:00:00Z') - new Date(todayStr()+'T00:00:00Z')) / 86400000);
  if(days <= 0) return '다음에 또 나옵니다';
  return days === 1 ? '내일 다시 나옵니다' : `${days}일 뒤에 다시 나옵니다`;
}

async function submitDailyQuiz(cardId){
  const sid = state.currentUser.studentId;
  const rec = await loadRecord(sid);
  const card = dqCardById(rec, cardId);
  if(!card) return;
  const el = document.getElementById('dq-ans-'+cardId);
  const val = (el ? el.value : '').trim();
  if(!val){ showToast('답을 입력해주세요.'); return; }

  const today = todayStr();
  const d = dqState(rec);
  const st = d.cards[cardId] || {streak:0, n:0, okN:0};
  const ok = val === card.answer;
  st.n++; if(ok) st.okN++;
  st.ans = val; st.at = today; st.correct = ok;
  if(ok){
    st.streak++;
    st.due = st.streak > DQ_STEPS.length ? null : shiftYmd(today, DQ_STEPS[st.streak-1]);
  } else {
    st.streak = 0;
    st.due = shiftYmd(today, 1);
  }
  d.cards[cardId] = st;
  /* 날짜별 정답률을 그리려면 «언제 무엇을 맞고 틀렸나»가 남아야 한다.
     카드 상태에는 마지막 제출만 남으므로 이력을 따로 둔다. 무한정 쌓지 않도록 상한을 건다. */
  d.log.push({d:today, id:cardId, ok});
  if(d.log.length > 200) d.log = d.log.slice(-200);
  await saveRecord(sid);
  showToast(ok ? '정답입니다.' : '틀렸습니다 — 내일 다시 나옵니다.');
  render();
}
// 객관식(①~⑤가 포함된) 문제인지 판별 — 맞으면 텍스트 입력 대신 보기 버튼을 보여준다.
// 채점이 문자열 비교라서, 학생이 "3"이라고 타이핑하면 정답 "③"과 안 맞아 오답 처리되던 문제를 해결.
function isMultipleChoice(content){
  return /①/.test(content||'');
}

/* =================== 학생이 «입력할 수 있는» 정답인가 ===================
   답안 입력칸이 받는 것은 둘뿐이다 — 숫자 입력 아니면 ①~⑤ 보기 버튼(answerInputHTML).
   분수·무리수·음수·문자식이 정답이면 학생은 풀고도 제출할 방법이 없다.
   그래서 AI 프롬프트에 «999 이하 자연수 아니면 객관식»을 못박아 뒀고(worker/gemini-proxy.js),
   여기서는 그 약속이 지켜졌는지 «받는 쪽»에서 한 번 더 확인한다.
   생성 모델은 규칙을 어길 수 있고, 어긴 문항이 조용히 학생에게 가면 아무도 못 푼다. */
const CHOICE_SYMBOLS = ['①','②','③','④','⑤'];
function isPlainNaturalAnswer(a){
  return /^[1-9][0-9]{0,2}$/.test(String(a==null?'':a).trim());   // 1~999
}
/* AI는 formatRule("수식은 $로 감싸라") 때문에 숫자 정답에도 $를 두른다 — 실제로 «$155$»가 나왔다.
   채점이 문자열 비교라 학생이 155를 내면 오답이 된다. 받는 쪽에서 벗겨 둔다.
   벗긴 결과가 999 이하 자연수일 때«만» 벗긴다 — $\frac{1}{2}$ 같은 것은 그대로 둬야
   검토 화면에서 선생님이 진짜 형태를 본다. */
function normalizeTwinAnswer(a){
  const s = String(a==null?'':a).trim();
  const m = s.match(/^\$\s*([0-9]{1,3})\s*\$$/);
  return (m && isPlainNaturalAnswer(m[1])) ? m[1] : s;
}
/* 문제 없으면 null, 있으면 «사람이 읽을 이유»를 돌려준다. */
function answerFormProblem(content, answer){
  const a = String(answer==null?'':answer).trim();
  const mc = isMultipleChoice(content);
  if(!a) return '정답이 비어 있습니다.';
  if(CHOICE_SYMBOLS.includes(a)){
    return mc ? null : '정답이 보기 기호(' + a + ')인데 문제에 ①~⑤ 보기가 없습니다.';
  }
  if(mc) return '문제에 ①~⑤ 보기가 있는데 정답이 보기 기호가 아닙니다 (지금: ' + a + ').';
  if(isPlainNaturalAnswer(a)) return null;
  return '정답이 999 이하 자연수가 아니고 객관식도 아닙니다 (지금: ' + a + '). 학생이 입력할 수 없습니다.';
}
function answerInputHTML(inputId){
  return `<input type="hidden" id="${inputId}">
    <div class="mc-choice-group">
      ${['①','②','③','④','⑤'].map(sym=>`<button type="button" class="mc-choice-btn" onclick="selectChoice('${inputId}','${sym}',this)">${sym}</button>`).join('')}
    </div>`;
}
function selectChoice(inputId, symbol, btnEl){
  const input = document.getElementById(inputId);
  if(input) input.value = symbol;
  const group = btnEl.parentElement;
  group.querySelectorAll('.mc-choice-btn').forEach(b=>b.classList.remove('active'));
  btnEl.classList.add('active');
}
/* submitQuizAnswer(교사가 낸 회차에 답을 낸다)는 지웠다 — submitDailyQuiz가 대신한다.
   저 함수에는 채점이 없었다. 정답이 없는 문제를 받아 적기만 했다. */

/* =================== 클리닉 신청 (선생님이 만든 시간대에서만 신청 가능) =================== */
// 슬롯 하나를 채우고 있는(취소되지 않은) 신청 건수 — 정원 초과 여부를 이걸로 판단한다.
/* 이 시간대에 몇 자리가 찼나.
   ⚠ **`slotId`만 믿으면 안 된다.** 승인이 시간대를 «따로» 만들어 붙였다가 그것이 지워지면
      (중복으로 보여서 지우는 일이 실제로 있었다) 승인된 학생이 **어느 자리에도 안 앉아 있게**
      되고, 정작 그 시각의 시간대는 0/20으로 남아 거짓말을 한다.
      그래서 «확정된 것»(승인·완료)은 가리키는 자리가 사라졌으면 **날짜·시각으로 이 자리에 센다.**
      대기 중인 제안은 세지 않는다 — 아직 자리를 차지한 것이 아니다. */
/* 신청 하나가 **여러 자리**를 차지할 수 있다 — 클리닉은 한 시간만 하는 것이 아니다.
   옛 기록은 `slotId` 하나뿐이라 둘 다 본다. */
function clinicSlotIds(c){
  const many = c.slotIds || [];
  return many.length ? many : (c.slotId ? [c.slotId] : []);
}
function clinicSlotBookedCount(slotId){
  const slot = DATA.clinicSlots.find(s=>s.id===slotId);
  return DATA.clinics.filter(c=>{
    if(c.status==='취소') return false;
    const ids = clinicSlotIds(c);
    if(ids.includes(slotId)) return true;
    if(!slot || (c.status!=='승인' && c.status!=='완료')) return false;
    /* 살아 있는 자리를 이미 붙들고 있으면 여기 것이 아니다. */
    if(ids.some(id=>DATA.clinicSlots.some(s=>s.id===id))) return false;
    /* 가리키던 자리가 사라진 «확정»은 날짜·시각으로 이 자리에 센다.
       범위로 잡은 것이면 시작~마지막 사이에 이 자리가 들면 센다. */
    if(c.day !== slot.date) return false;
    const k = slotTimeKey(slot.time), a = slotTimeKey(c.time), b = slotTimeKey(c.timeEnd || c.time);
    return k >= a && k <= b;
  }).length;
}
/* 화면에 쓰는 «언제». 여러 자리면 처음~끝을 한 줄로 보여 준다. */
function clinicWhenLabel(c){
  const ids = clinicSlotIds(c);
  const times = ids.map(id=>(DATA.clinicSlots.find(s=>s.id===id)||{}).time).filter(Boolean);
  if(times.length > 1){
    const sorted = times.slice().sort((x,y)=>slotTimeKey(x).localeCompare(slotTimeKey(y)));
    return `${slotTimeLabel(sorted[0])} ~ ${slotTimeLabel(sorted[sorted.length-1])} · ${times.length}개`;
  }
  if(c.timeEnd && slotTimeKey(c.timeEnd) !== slotTimeKey(c.time)){
    return `${slotTimeLabel(c.time)} ~ ${slotTimeLabel(c.timeEnd)}`;
  }
  return slotTimeLabel(times[0] || c.time);
}
/* =================== 클리닉 시간대 — 고르고, 한꺼번에 연다 ===================
   시간은 오래 «자유 문장»이었다(「저녁 7시」). 사람이 매번 타이핑해야 했고,
   ⚠ **문자열로 정렬돼서 「오후 10시」가 「오후 2시」보다 앞에 섰다.**
   이제 고르는 값은 `HH:MM`으로 담는다. 옛 자료는 문장 그대로 남으므로 둘 다 읽는다. */
function slotTimeLabel(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t||'').trim());
  if(!m) return String(t||'');                      // 옛 자유 문장은 그대로 보여 준다
  const h = +m[1], mi = +m[2];
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h < 12 ? '오전' : '오후'} ${h12}시${mi ? ' ' + mi + '분' : ''}`;
}
/* 정렬용 키. 옛 문장도 «오후 7시»까지는 읽어 준다 — 못 읽으면 맨 뒤로 보낸다. */
function slotTimeKey(t){
  const s = String(t||'').trim();
  const hm = /^(\d{1,2}):(\d{2})$/.exec(s);
  if(hm) return String(+hm[1]).padStart(2,'0') + hm[2];
  const k = /(오전|아침|오후|점심|저녁|밤)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분)?/.exec(s);
  if(!k) return '9999' + s;
  let h = +k[2];
  if(/오후|점심|저녁|밤/.test(k[1] || '') && h < 12) h += 12;
  return String(h).padStart(2,'0') + String(k[3] || 0).padStart(2,'0');
}
function slotCmp(a, b){
  return a.date === b.date
    ? slotTimeKey(a.time).localeCompare(slotTimeKey(b.time))
    : a.date.localeCompare(b.date);
}
// 오늘 이후이면서 정원이 남은 슬롯만 학생에게 신청 가능한 시간대로 보여준다.
function openClinicSlots(){
  const today = todayStr();
  return DATA.clinicSlots
    .filter(s=>s.date>=today)
    .filter(s=>clinicSlotBookedCount(s.id) < s.capacity)
    .sort(slotCmp);
}
/* 주간 판의 날짜 열에서 곧장 시간대를 연다 — 그 날짜를 폼에 미리 채워 둔다.
   시간 칸에 커서를 놓아 주므로 «날짜를 다시 고르는» 걸음이 없다. */
function clinicAddSlotOn(date){
  state.clinicSlotDate = date;
  state.clinicPanel = 'slot';
  render();
  const el = document.getElementById('slot-from');
  if(el) el.focus();
}

/* 시간대를 «범위»로 연다. 예전에는 한 칸에 「오후 2시」를 쳐 넣고 추가를 누르는 일을
   시간마다 되풀이해야 했다 — 2시부터 10시까지면 아홉 번이다.
   이제 시작·마지막·간격을 고르면 한 번에 선다.
   ⚠ 「마지막」은 **그 시각에 시간대가 하나 선다**는 뜻이다 (끝나는 시각이 아니다).
      말이 갈리는 자리라 화면에도 그렇게 적어 둔다. */
const SLOT_HHMM = t => String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
async function addClinicSlots(){
  const date = document.getElementById('slot-date').value;
  const from = document.getElementById('slot-from').value;
  const to   = document.getElementById('slot-to').value;
  const step = parseInt(document.getElementById('slot-step').value) || 60;
  const capacity = Math.max(1, parseInt(document.getElementById('slot-capacity').value) || 1);
  if(!date || !from){ showToast('날짜와 시작 시각을 골라주세요.'); return; }
  const mins = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t||''); return m ? +m[1]*60 + +m[2] : null; };
  const a = mins(from);
  const b = to ? mins(to) : a;                 // 마지막을 비우면 한 개만 연다
  if(b === null || b < a){ showToast('마지막 시각이 시작 시각보다 빠릅니다.'); return; }

  const times = [];
  for(let t = a; t <= b; t += step) times.push(SLOT_HHMM(t));
  /* 같은 날 같은 시각이 이미 열려 있으면 건너뛴다 — 두 번 누르면 정원이 갈라진다. */
  const fresh = times.filter(t => !DATA.clinicSlots.some(s => s.date===date && (s.time||'').trim()===t));
  const dup = times.length - fresh.length;
  if(fresh.length === 0){ showToast('그 시간대는 이미 열려 있습니다.'); return; }
  if(fresh.length > 1 && !confirm(
      `${date}에 시간대 ${fresh.length}개를 엽니다.\n\n`
      + fresh.map(slotTimeLabel).join(' · ')
      + `\n\n각 정원 ${capacity}명.`
      + (dup ? `\n(이미 열려 있는 ${dup}개는 건너뜁니다.)` : '')
      + `\n\n만들까요?`)) return;

  const base = Date.now();
  const made = fresh.map((time, i) => ({ id:'cs'+base+'_'+i, date, time, capacity }));
  DATA.clinicSlots.push(...made);
  DATA.clinicSlots.sort(slotCmp);
  for(const s of made) await dbSetDoc('clinicslots', s.id, s);
  /* 날짜는 비우지 않는다 — 같은 날을 이어서 손보는 일이 흔하다. */
  state.clinicSlotDate = date;
  showToast(`${date}에 시간대 ${made.length}개를 열었습니다.`
    + (dup ? ` (${dup}개는 이미 있어 건너뛰었습니다.)` : ''));
  render();
}
async function deleteClinicSlot(slotId){
  const booked = clinicSlotBookedCount(slotId);
  if(booked>0 && !confirm(`이 시간대에 이미 ${booked}건의 신청이 있습니다. 시간대를 삭제해도 신청 내역은 남습니다. 삭제할까요?`)) return;
  if(booked===0 && !confirm('이 시간대를 삭제할까요?')) return;
  DATA.clinicSlots = DATA.clinicSlots.filter(s=>s.id!==slotId);
  await dbDeleteDoc('clinicslots', slotId);
  showToast('삭제되었습니다.');
  render();
}
/* 신청 경로는 둘이다.
     ① 시간대에서 고르기 — 교사가 열어 둔 슬롯. 정원이 차면 막힌다
     ② 직접 제안하기   — 열린 슬롯에 맞는 시간이 없을 때 학생이 날짜·시간을 적어 낸다.
                        슬롯이 없으므로 slotId는 빈 문자열이고 정원 개념도 없다.
                        교사가 승인해야 확정된다 — 그래서 «제안»이지 «예약»이 아니다.
   두 경우 모두 같은 clinic 레코드에 담긴다 (day·time이 이미 있다). 컬렉션을 늘리지 않았다. */
async function submitClinicRequest(freeform){
  const sid = state.currentUser.studentId;
  const topic = document.getElementById('clinic-topic').value.trim();
  if(!topic){ showToast('질문/요청 내용을 입력해주세요.'); return; }

  let slotIds = [], day = '', time = '', timeEnd = '';
  if(freeform){
    day  = document.getElementById('clinic-free-date').value;
    time = document.getElementById('clinic-free-time').value.trim();
    timeEnd = (document.getElementById('clinic-free-end')||{}).value || '';
    if(!day || !time){ showToast('희망 날짜와 시작 시각을 골라주세요.'); return; }
    if(day < todayStr()){ showToast('지난 날짜로는 신청할 수 없습니다.'); return; }
    /* 「마지막」은 열린 시간대와 같은 뜻이다 — 그 시각에도 한 자리가 선다. */
    if(timeEnd && slotTimeKey(timeEnd) < slotTimeKey(time)){
      showToast('마지막 시각이 시작 시각보다 빠릅니다.'); return;
    }
    if(!timeEnd || slotTimeKey(timeEnd)===slotTimeKey(time)) timeEnd = '';
    const a = slotTimeKey(time), b = slotTimeKey(timeEnd || time);
    /* 이미 신청한 시간과 «겹치는지»를 본다 — 붙여서 두 번 내면 같은 자리를 두 번 잡는다. */
    if(DATA.clinics.some(c=>{
        if(c.studentId!==sid || c.day!==day || c.status==='취소') return false;
        return slotTimeKey(c.timeEnd || c.time) >= a && slotTimeKey(c.time) <= b;
      })){ showToast('이미 그 시간과 겹치는 신청이 있습니다.'); return; }
    /* 열려 있는 자리 중 꽉 찬 것이 범위 안에 있으면 막는다 — 승인이 겹친다. */
    const full = DATA.clinicSlots.filter(s=>s.date===day)
      .filter(s=>{ const k=slotTimeKey(s.time); return k>=a && k<=b; })
      .find(s=>clinicSlotBookedCount(s.id) >= s.capacity);
    if(full){ showToast(`${slotTimeLabel(full.time)}는 이미 찼습니다. 다른 시간을 골라 주세요.`); return; }
  } else {
    /* 고른 값은 state가 들고 있다. **여러 개를 고를 수 있다** — 클리닉을 두세 시간
       이어서 하는 일이 흔한데, 예전에는 하나만 골라져서 한 시간씩 따로 내야 했다. */
    const ids = (state.stuClinicSlotIds || []);
    if(ids.length===0){ showToast('희망 시간대를 선택해주세요.'); return; }
    const picked = ids.map(id=>DATA.clinicSlots.find(s=>s.id===id)).filter(Boolean);
    if(picked.length !== ids.length){ showToast('선택한 시간대를 찾을 수 없습니다. 다시 선택해주세요.'); state.stuClinicSlotIds=[]; render(); return; }
    const full = picked.find(s=>clinicSlotBookedCount(s.id) >= s.capacity);
    if(full){ showToast(`${slotTimeLabel(full.time)}는 방금 정원이 찼습니다. 다시 골라 주세요.`); render(); return; }
    const dup = picked.find(s=>DATA.clinics.some(c=>c.studentId===sid && c.status!=='취소' && clinicSlotIds(c).includes(s.id)));
    if(dup){ showToast(`${slotTimeLabel(dup.time)}는 이미 신청하셨습니다.`); return; }
    picked.sort(slotCmp);
    slotIds = picked.map(s=>s.id);
    day = picked[0].date;
    time = picked[0].time;
    timeEnd = picked.length>1 ? picked[picked.length-1].time : '';
  }

  const clinic = {id:'cl'+Date.now(), studentId:sid, name:state.currentUser.name, topic,
                  slotId: slotIds[0] || '', slotIds,
                  day, time, timeEnd, status:'대기', requestedAt:todayStr()};
  DATA.clinics.unshift(clinic);
  await dbSetDoc('clinics', clinic.id, clinic);
  state.stuClinicSlotIds = [];
  showToast(freeform ? '희망 시간을 제안했습니다. 선생님 승인 후 확정됩니다.'
    : `클리닉 신청이 접수되었습니다.${slotIds.length>1?` (${slotIds.length}개 시간대)`:''}`);
  render();   // 입력칸은 지우지 않고 다시 그린다 — 전체 재렌더링이라 어차피 새 칸이 온다
}

/* 교사가 학생을 직접 앉힌다. 슬롯을 고르면 그 슬롯에 배정되고(정원에 반영된다),
   고르지 않으면 날짜·시간을 직접 적어 슬롯 없이 잡는다. 교사가 넣는 것이므로 바로 «승인»이다. */
async function assignClinic(){
  const sid = document.getElementById('cn-assign-student').value;
  let slotId = document.getElementById('cn-assign-slot').value;   // 직접 입력이면 아래에서 슬롯을 만들어 채운다
  const topic = document.getElementById('cn-assign-topic').value.trim();
  let day = document.getElementById('cn-assign-date').value;
  let time = document.getElementById('cn-assign-time').value.trim();
  if(!sid){ showToast('학생을 선택해주세요.'); return; }
  if(slotId){
    const slot = DATA.clinicSlots.find(s=>s.id===slotId);
    if(!slot){ showToast('시간대를 찾을 수 없습니다.'); return; }
    day = slot.date; time = slot.time;
  } else if(!day || !time){
    showToast('시간대를 고르거나 날짜·시간을 직접 입력해주세요.'); return;
  } else {
    /* 직접 입력이어도 슬롯을 만들어 붙인다 — 승인된 클리닉은 슬롯을 갖는다는 규칙을 여기서도 지킨다. */
    const slot = await ensureClinicSlot(day, time);
    const booked = clinicSlotBookedCount(slot.id);
    if(booked >= slot.capacity){ slot.capacity = booked + 1; await dbSetDoc('clinicslots', slot.id, slot); }
    slotId = slot.id;
  }
  const clinic = {id:'cl'+Date.now(), studentId:sid, name:studentNameOf(sid), topic:topic||'클리닉',
                  slotId, slotIds:[slotId], day, time, timeEnd:'', status:'승인', requestedAt:todayStr()};
  DATA.clinics.unshift(clinic);
  await dbSetDoc('clinics', clinic.id, clinic);
  await logAudit('클리닉 배정', sid, studentNameOf(sid), `${day} ${time}`);
  document.getElementById('cn-assign-topic').value='';
  document.getElementById('cn-assign-time').value='';
  state.clinicAssignSid = '';   // 미리 골라 준 것은 한 번만 쓴다. 남겨 두면 다음 배정이 엉뚱한 학생으로 열린다
  showToast(`${studentNameOf(sid)} — ${day} ${time}에 배정했습니다.`);
  render();
}
/* 같은 날짜·시각의 슬롯을 찾는다. **문자열이 아니라 «시각»으로 맞춘다.**
   ⚠ 예전에는 문자열을 그대로 비교했다. 그때는 형식을 강제하는 곳이 없어서
      «정규화하면 엉뚱한 것을 합친다»는 판단이 맞았다. 그런데 열린 시간대가
      `HH:MM`으로 바뀌면서 **학생이 제안한 「오후 4시」가 그 자리의 `16:00`과
      다른 것으로 읽혀**, 승인해도 원래 시간대의 정원이 안 줄고 정원 1짜리
      슬롯이 하나 더 생겼다. 실제로 그렇게 어긋난 것을 봤다.
      지금은 slotTimeKey()가 둘 다 「1600」으로 읽는다.
      («저녁 7시»처럼 못 읽는 문장은 예전대로 문자열이 같아야만 같은 것으로 본다.) */
function findClinicSlot(day, time){
  const k = slotTimeKey(time);
  return DATA.clinicSlots.find(s=>s.date===day && slotTimeKey(s.time)===k);
}
async function ensureClinicSlot(day, time){
  const t = (time||'').trim();
  const found = findClinicSlot(day, t);
  if(found) return found;
  /* 새로 만들 때는 읽을 수 있으면 `HH:MM`으로 담는다 — 다음부터 어긋나지 않는다. */
  const key = slotTimeKey(t);
  const norm = /^\d{4}$/.test(key) ? key.slice(0,2) + ':' + key.slice(2) : t;
  /* ⚠ id에 `Date.now()`만 쓰면 안 된다. 범위를 승인할 때 이 함수가 **한 밀리초 안에
     여러 번** 불려 id가 겹쳤고, 그러면 find()가 늘 첫 번째 것을 돌려줘서
     세 시간을 잡았는데 전부 같은 자리로 붙었다. 실제로 그렇게 만들었다가 잡았다. */
  const slot = {id:'cs'+Date.now()+'_'+Math.random().toString(36).slice(2,7), date:day, time:norm, capacity:1};
  DATA.clinicSlots.push(slot);
  DATA.clinicSlots.sort(slotCmp);
  await dbSetDoc('clinicslots', slot.id, slot);
  return slot;
}

/* **승인된 클리닉은 슬롯을 갖는다.** 학생이 직접 제안한 시간(slotId 없음)을 승인하면
   그 자리에 시간대를 만들어 붙인다 — 안 그러면 다른 학생이 같은 시간에 또 제안할 수 있고,
   주간 판에서도 점선(「시간대 밖」)으로만 떠서 자리가 잡힌 것으로 안 읽힌다.
   새로 만드는 슬롯의 정원은 1이다. 한 사람의 제안을 받아 준 자리이므로 그 사람으로 찬다. */
async function updateClinicStatus(cid, status){
  const c = DATA.clinics.find(c=>c.id===cid);
  if(!c) return;
  let note = '';
  if(status==='승인' && clinicSlotIds(c).length===0 && c.day && c.time){
    /* 제안이 «범위»일 수 있다 (2시~4시). 그 사이 시각마다 자리를 하나씩 잡는다.
       한 시간짜리면 한 자리다. 간격은 1시간으로 본다 — 열린 시간대의 기본과 같다. */
    const toMin = t => { const k = slotTimeKey(t); return /^\d{4}$/.test(k) ? +k.slice(0,2)*60 + +k.slice(2) : null; };
    const a = toMin(c.time), b = toMin(c.timeEnd || c.time);
    const times = (a===null || b===null || b<a) ? [c.time]
      : Array.from({length: Math.floor((b-a)/60)+1}, (_,i)=>SLOT_HHMM(a + i*60));
    const ids = [], madeNew = [], grew = [];
    for(const t of times){
      /* 이미 열어 둔 시간대가 있으면 «거기 앉힌다». 학생이 그 자리가 열린 줄 모르고
         직접 제안하는 일이 흔하다 — 그때 새 자리를 또 만들면 같은 시각이 둘로 갈린다. */
      const existed = findClinicSlot(c.day, t);
      const slot = existed || await ensureClinicSlot(c.day, t);
      const booked = clinicSlotBookedCount(slot.id);
      if(booked >= slot.capacity){
        /* 이미 있던 시간대가 꽉 찼는데 교사가 승인했다 — 승인을 무르지 않고 정원을 한 자리 늘린다.
           조용히 넘기면 «승인했는데 왜 안 들어가 있지»가 된다. 늘렸다는 사실을 말해 준다. */
        slot.capacity = booked + 1;
        await dbSetDoc('clinicslots', slot.id, slot);
        grew.push(slotTimeLabel(slot.time));
      } else if(!existed) madeNew.push(slotTimeLabel(slot.time));
      ids.push(slot.id);
    }
    c.slotIds = ids;
    c.slotId = ids[0] || '';
    note = ` · ${c.day} ${clinicWhenLabel(c)} 자리를 잡았습니다`
      + (madeNew.length ? ` (${madeNew.join(' · ')}는 새로 열었습니다)` : '')
      + (grew.length ? ` (${grew.join(' · ')}는 정원이 차 있어 한 자리 늘렸습니다)` : '');
  }
  c.status = status;
  await dbSetDoc('clinics', c.id, c);
  if(note) showToast(`${c.name} 승인${note}`);
  render();
}
async function cancelClinicRequest(cid){
  if(!confirm('신청을 취소할까요? 취소하면 다른 학생이 그 시간대에 신청할 수 있게 됩니다.')) return;
  const c = DATA.clinics.find(c=>c.id===cid);
  if(!c) return;
  c.status = '취소';
  await dbSetDoc('clinics', c.id, c);
  showToast('신청이 취소되었습니다.');
  render();
}
async function deleteClinic(cid){
  if(!confirm('이 클리닉 신청을 삭제할까요?')) return;
  DATA.clinics = DATA.clinics.filter(c=>c.id!==cid);

/* =================== 과제 사진 (여러 장) ===================
   질의응답은 한 장이라 `state.qnaQuestionImage` 하나로 됐지만, 과제는 노트 여러 쪽을
   찍어 올린다. 그래서 «올리는 중»인 것과 «다 올라간» 것이 한 줄에 섞인다 —
   목록 하나로 두고 각 칸이 자기 상태를 들고 있게 한다.
   ⚠ 제출 «전»의 사진은 state에만 있다. 그래도 드라이브에는 이미 올라가 있으므로,
     빼기(×)를 누르면 그 자리에서 드라이브에서도 지운다. */
const HW_PHOTO_MAX = 6;
function hwPhotoList(hwId){ return (state.hwPhotos && state.hwPhotos[hwId]) || []; }
async function handleHwPhotos(hwId, fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return;
  state.hwPhotos = state.hwPhotos || {};
  const list = state.hwPhotos[hwId] = hwPhotoList(hwId).slice();
  const room = HW_PHOTO_MAX - list.length;
  if(room <= 0){ showToast(`사진은 ${HW_PHOTO_MAX}장까지 올릴 수 있습니다.`); return; }
  if(files.length > room) showToast(`${HW_PHOTO_MAX}장까지만 올라갑니다.`);
  /* 한 장씩 순서대로 올린다. 한꺼번에 던지면 느린 회선에서 전부 타임아웃으로 죽는다. */
  for(const f of files.slice(0, room)){
    const previewUrl = URL.createObjectURL(f);
    const slot = { uploading:true, previewUrl };
    list.push(slot); render();
    try{
      const { url, fileId } = await uploadImageToDrive(f);
      Object.assign(slot, { url, fileId, uploading:false });
    }catch(e){
      console.error('과제 사진 업로드 실패', e);
      showToast('사진 업로드에 실패했습니다. 다시 시도해주세요.');
      const i = list.indexOf(slot); if(i>=0) list.splice(i,1);
    }
    URL.revokeObjectURL(previewUrl);
    render();
  }
}
function removeHwPhoto(hwId, idx){
  const list = hwPhotoList(hwId).slice();
  const [gone] = list.splice(idx, 1);
  if(gone && gone.fileId) deleteFromDrive(gone.fileId);
  state.hwPhotos = state.hwPhotos || {};
  state.hwPhotos[hwId] = list;
  render();
}

/* 🔴 **한글 조합을 끝내는 Enter는 «전송»이 아니다** (2026-09-01 · T-2).
   「안녕하세」까지 치고 조합을 확정하려고 누르는 그 Enter도 keydown 을 쏜다.
   막지 않으면 **반쯤 친 말이 그대로 나간다** — 되돌릴 수 없는 자리라 더 나쁘다.
   ⚠ **영문만 쳐 보면 절대 안 걸린다.** 교재 칸(T-1)에서 같은 덫을 만나 막았는데,
     그때 채팅 세 곳에 같은 것이 남아 있는 것을 보고도 미뤘다 — 이제 막는다.
   ⚠ Shift+Enter 는 줄바꿈이다. 전송으로 세지 않는다.
   🔵 판단을 여기 하나로 모은다. 칸이 셋(학생 · 강사 상세 · 강사 채팅 탭)인데
     각자 조건을 들고 있으면 한 곳만 고쳐지는 날이 온다. */
function chatSendKey(ev){
  if(!ev || ev.key !== 'Enter') return false;
  if(ev.isComposing || ev.keyCode === 229) return false;   // 조합 중 (229는 옛 브라우저)
  if(ev.shiftKey) return false;
  ev.preventDefault();
  return true;
}

/* =================== 영상 (부교재 해설강의) =================== */
function extractYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/watch\?[^#]*v=([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{6,15})/
  ];
  for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
  return null;
}
/* videoEmbedHTML(카드 + iframe + 진도 한 벌)은 지웠다 — 학생 강의 화면(stuVideoHTML)이
   목록 카드를 이미 그리고, 거기서 «누른 하나»에만 iframe을 붙인다.
   유튜브 iframe에 sandbox를 거는 것(allow-popups/allow-top-navigation 없음)과
   enablejsapi=1로 시청 진도율을 추적하는 것은 그 함수로 그대로 옮겼다. */
/* ---------- 유튜브 시청 진도율 추적 ---------- */
// render()가 app.innerHTML을 통째로 새로 그리기 때문에, 재생 중 다른 이유로 render()가
// 다시 호출되면 iframe이 새로 만들어지면서 재생 위치가 초기화된다. 진도율 저장 자체는
// render()를 부르지 않도록 해서(=재생 화면을 다시 그리지 않도록) 이 문제를 최대한 피한다.
let ytApiLoading = false;
function ensureYouTubeAPI(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  if(!state.ytReadyCallbacks) state.ytReadyCallbacks = [];
  state.ytReadyCallbacks.push(cb);
  if(ytApiLoading) return;
  ytApiLoading = true;
  window.onYouTubeIframeAPIReady = function(){
    (state.ytReadyCallbacks||[]).forEach(fn=>fn());
    state.ytReadyCallbacks = [];
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
// 재생바 위치(getCurrentTime)가 아니라 "실제로 재생 상태였던 시간(벽시계 기준)"을 누적한다.
// 재생바 위치만 보면 끝부분으로 스킵만 해도 시청 완료로 잡히기 때문에, PLAYING 상태로
// 실제 흘러간 시간만 더하는 방식으로 바꿨다 — 스킵/탐색 자체는 시간을 늘리지 않는다.
async function noteVideoWatchTime(studentId, videoId, addSeconds, duration, ended){
  if(!duration || duration<=0) return;
  const rec = await loadRecord(studentId);
  const prev = rec.videoProgress[videoId] || {watchedSeconds:0, duration:0, percent:0, completed:false};
  const prevWatched = prev.watchedSeconds!==undefined ? prev.watchedSeconds : (prev.maxSeconds||0);
  const watchedSeconds = Math.min(duration, prevWatched + Math.max(0, addSeconds));
  const percent = Math.min(100, Math.round(watchedSeconds/duration*150));
  rec.videoProgress[videoId] = {
    watchedSeconds, duration, percent,
    completed: prev.completed || ended || percent>=95,
    updatedAt: new Date().toISOString()
  };
  await saveRecord(studentId);
  const label = document.getElementById('vprog-'+videoId);
  if(label) label.innerHTML = videoProgressBlockHTML(studentId, videoId);
}
/* 재생 중에 이 자리만 다시 그린다 (render()를 부르면 iframe이 새로 생겨 재생이 끊긴다).
   그래서 여기서 나오는 것은 DS 조각이어야 한다 — 구버전 .video-gauge는 이제 없다.
   이모지 마일스톤(🌱🌿🔥⭐🎉)은 뺐다. 이 시스템은 이모지를 아이콘으로 쓰지 않는다. */
function videoProgressBlockHTML(studentId, videoId){
  const rec = DATA.records[studentId];
  const p = rec && rec.videoProgress && rec.videoProgress[videoId];
  if(!p) return '<div style="font-size:11.5px;color:var(--dim);margin-top:10px;">아직 시청 기록이 없습니다.</div>';
  const pct = Math.max(0, Math.min(100, p.percent||0));
  return `<div class="sap-prog">
      <span class="bar"><i style="width:${pct}%"></i></span>
      <b style="color:${p.completed?'var(--ok)':'var(--dim)'};">${p.completed?'완료':pct+'%'}</b>
    </div>
    <div style="font-size:11px;color:var(--dim);margin-top:6px;">${
      p.completed ? '시청 완료' : '시청 중'} · 최근 <span class="mono">${(p.updatedAt||'').slice(0,10)}</span></div>`;
}
// 재생 중이던 구간의 벽시계 경과 시간을 정산해서 누적한다(멈춤/종료/화면전환 시 남은 조각까지 반영).
function flushWatchTick(entry, studentId, videoId, player, ended){
  if(entry.lastTick==null) return;
  const now = Date.now();
  const elapsed = Math.min(20, Math.max(0, (now-entry.lastTick)/1000)); // 백그라운드 탭 등으로 타이머가 밀려도 과도하게 잡히지 않도록 상한
  entry.lastTick = null;
  try{
    const dur = player.getDuration();
    noteVideoWatchTime(studentId, videoId, elapsed, dur, ended);
  }catch(err){}
}
// 학생이 '부교재 해설강의' 탭에 있을 때만 실제 유튜브 플레이어를 붙여서 재생 상태를 감시한다.
function mountVideoTrackers(studentId){
  const frames = document.querySelectorAll('.yt-tracked-frame[data-bank-vid]');
  if(frames.length===0) return;
  ensureYouTubeAPI(() => {
    if(!state.ytPlayers) state.ytPlayers = {};
    frames.forEach(frame => {
      const videoId = frame.dataset.bankVid;
      const prev = state.ytPlayers[videoId];
      if(prev && prev.el === frame) return;   // 같은 iframe에 이미 붙어 있다
      /* ⚠ render()가 app.innerHTML을 통째로 갈면 예전 iframe은 사라지는데,
         여기 남아 있는 플레이어는 그 죽은 iframe을 가리킨다. 예전에는 «id가 있으면 건너뛴다»라
         새 iframe에 다시 붙지 못했다 — 화면을 한 번 다시 그린 뒤부터 시청 시간이 조용히
         기록되지 않았다. 학생 화면이 영상을 하나씩 열고 닫게 되면서 매번 걸리는 길이 됐다. */
      if(prev){
        if(prev.timer) clearInterval(prev.timer);
        flushWatchTick(prev, studentId, videoId, prev.player, false);
        try{ prev.player.destroy(); }catch(err){}
        delete state.ytPlayers[videoId];
      }
      let player;
      try{
        player = new YT.Player(frame.id, {
          events: {
            onStateChange: (e) => {
              const entry = state.ytPlayers[videoId];
              if(!entry) return;
              if(e.data === YT.PlayerState.PLAYING){
                entry.lastTick = Date.now();
                if(entry.timer) clearInterval(entry.timer);
                entry.timer = setInterval(() => {
                  const now = Date.now();
                  const elapsed = Math.min(10, Math.max(0, (now-entry.lastTick)/1000));
                  entry.lastTick = now;
                  try{
                    const dur = player.getDuration();
                    noteVideoWatchTime(studentId, videoId, elapsed, dur, false);
                  }catch(err){}
                }, 5000);
              } else {
                if(entry.timer){ clearInterval(entry.timer); entry.timer = null; }
                flushWatchTick(entry, studentId, videoId, player, e.data===YT.PlayerState.ENDED);
              }
            }
          }
        });
      }catch(err){ return; }
      state.ytPlayers[videoId] = { player, timer: null, el: frame };
    });
  });
}

/* `examId`가 비어 있으면 새 시험지를, 들어 있으면 **이미 있는 시험에 문항을 채운다**

   ⚠ 성적은 `examId`로 붙어 있으므로 **id를 그대로 두면 저절로 이어진다.** 따로 «연결»할 것이 없다. */
let examDraft = { examId:'', classId:'', title:'', date:'', questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };

function compressImageToBase64(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}
function compressImageToBlob(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('이미지 압축에 실패했습니다.')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}
const DRIVE_UPLOAD_TIMEOUT_MS = 55000;
async function uploadImageToDrive(file){
  const blob = await compressImageToBlob(file);
  const fd = new FormData();
  fd.append('file', blob, 'img_' + Date.now() + '.jpg');
  const token = await withTimeout(getAuthToken(), 8000);
  /* FormData다 — Content-Type을 직접 넣으면 안 된다. 브라우저가 boundary까지 붙여야 한다. */
  const res = await withTimeout(fetch(AI_WORKER_URL + '/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  }), DRIVE_UPLOAD_TIMEOUT_MS);
  if(!res.ok) throw new Error('upload http ' + res.status);
  return res.json(); // {url, fileId}
}
/* 토큰을 받아 오려면 await가 필요해서 async가 됐다. 부르는 쪽 8곳은 전부 결과를 기다리지 않는
   «보내 놓고 잊는» 호출이라 그대로 둔다 — 실패는 여기서 삼키므로 미처리 거부도 생기지 않는다. */
async function deleteFromDrive(fileId){
  if(!fileId) return;
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await fetch(AI_WORKER_URL + '/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ fileId })
    });
  }catch(e){ console.error('드라이브 파일 삭제 실패', e); }
}
function dataUrlToBlob(dataUrl){
  const m = dataUrl.match(/^data:([^;]+);base64,(.*)$/s);
  if(!m) throw new Error('잘못된 이미지 데이터입니다.');
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: m[1] });
}

/* =================== 강의자료 (2026-08-09) ===================
   업로드 길은 이미 있었다 — 워커의 `/upload`는 파일 종류를 가리지 않고 드라이브에 올리고
   공개 권한까지 붙인다. 이미지만 그 길을 쓰고 있었을 뿐이라 **워커는 손대지 않았다.**

   `uploadImageToDrive`와 다른 점은 둘이다 —
   ① 압축하지 않는다 (PDF·한글 파일을 JPEG로 만들 수는 없다)

      문서는 `drive.google.com/file/d/{id}/view`로 열어야 한다. */
const MATERIAL_MAX_BYTES = 15 * 1024 * 1024;   // 워커가 본문을 메모리에 쌓아 올리므로 상한을 둔다

async function uploadFileToDrive(file){
  const fd = new FormData();

  /* FormData다 — Content-Type을 직접 넣으면 안 된다. 브라우저가 boundary까지 붙여야 한다. */
  const res = await withTimeout(fetch(AI_WORKER_URL + '/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  }), DRIVE_UPLOAD_TIMEOUT_MS);
  if(!res.ok) throw new Error('upload http ' + res.status);
  return res.json(); // {url, fileId}
}
function materialLink(m){

function fileSizeLabel(n){
  if(!n && n!==0) return '';
  return n >= 1024*1024 ? (n/1024/1024).toFixed(1) + 'MB' : Math.max(1, Math.round(n/1024)) + 'KB';
}

// 레거시(base64 문자열) 레코드와 신규({url,fileId}) 레코드를 모두 렌더링할 수 있게 흡수하는 헬퍼
/* =================== 문제 본문을 «보이게» 그린다 ===================
   내용은 평문으로 저장된다(HTML을 넣을 수 없다). 그 평문을 화면에 올릴 때
   두 가지를 되살린다 —

   ① **표** — hwpx 파서가 `| 칸 | 칸 |` 줄로 적어 둔 것을 진짜 표로 만든다.
      예전에는 셀을 공백으로 이어 붙여 대진표·조건표가 글 뭉치가 됐다.
   ② **객관식 선지** — hwpx는 선지 사이를 탭으로 두는데 그 탭이 파싱에서 사라져
      `① $4$② $12$③ $64$`처럼 다닥다닥 붙는다. 기호 앞에서 줄을 바꿔 한 줄에 하나씩 세운다.

   ⚠ 수식은 여기서 건드리지 않는다. `$…$`를 그대로 남기면 render() 끝의
   renderMathInElement가 알아서 그린다 — 두 곳에서 손대면 어느 쪽이 그린 건지 알 수 없게 된다. */
const CHOICE_MARKS = '①②③④⑤⑥⑦⑧⑨⑩';
function spaceChoices(line){
  if(!new RegExp('['+CHOICE_MARKS+']').test(line)) return line;
  /* 줄 맨 앞의 기호는 그대로 두고, 「내용 뒤에 바로 붙은」 기호 앞에서만 줄을 바꾼다. */
  return line.replace(new RegExp('(\\S)\\s*([' + CHOICE_MARKS + '])', 'g'), '$1\n$2');
}
function problemHTML(text){
  const src = String(text == null ? '' : text);
  const lines = src.split('\n');
  let out = '', row = [];
  const flush = () => {
    if(!row.length) return;
    /* 열이 하나뿐이면 «상자»(조건·증명 상자), 둘 이상이면 «격자»다. 그리는 법이 다르다 —
       상자는 한 덩어리인 글이라 줄마다 선을 그으면 표처럼 잘려 보인다. */
    const kind = row.every(cells => cells.length === 1) ? 'box' : 'grid';
    out += `<table class="pb-tbl ${kind}"><tbody>` + row.map(cells =>
      '<tr>' + cells.map(c => '<td>' + escHtml(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
    row = [];
  };
  for(const line of lines){
    const t = line.trim();
    /* 표 줄 — `|`로 시작하고 `|`로 끝나며 칸이 둘 이상. 수식 줄은 `$`로 시작하므로 안 걸린다. */
    if(t.length > 2 && t.startsWith('|') && t.endsWith('|')){
      row.push(t.slice(1, -1).split('|').map(c => c.trim()));
      continue;
    }
    flush();
    out += escHtml(spaceChoices(line)) + '\n';
  }
  flush();
  return out.replace(/\n$/, '');
}

async function handleExamFileSelect(fileList){
  syncExamDraftFromDOM();
  const files = Array.from(fileList || []);
  const entries = files.map(f => ({ uploading:true, previewUrl: URL.createObjectURL(f), file:f }));
  entries.forEach(e => examDraft.pages.push(e));
  render();
  let failed = 0;
  for(const entry of entries){
    try{
      const { url, fileId } = await uploadImageToDrive(entry.file);
      entry.uploading = false; entry.url = url; entry.fileId = fileId;
      URL.revokeObjectURL(entry.previewUrl);
      delete entry.file; delete entry.previewUrl;
    }catch(e){
      console.error('시험지 이미지 업로드 실패', entry.file && entry.file.name, e);
      URL.revokeObjectURL(entry.previewUrl);
      const idx = examDraft.pages.indexOf(entry);
      if(idx>=0) examDraft.pages.splice(idx,1);
      failed++;
    }
    render();
  }
  if(failed>0) showToast(failed + '개 이미지 업로드에 실패했습니다. 다시 시도해주세요.');
}

      /* ⚠ 문항 그림은 문항 «안»에 없다 — pbimg:{bankId} 문서에 따로 있고, 있다는 사실만
         bank.hasImage가 안다. 그래서 여기서 그리려면 bank를 거쳐야 한다.
         이 화면만 그 사실을 빠뜨려서 그림 있는 시험지를 올려도 검토 탭에서만 그림이 보였다
         (2026-08-11). 변형 쪽은 학생이 보는 것과 같은 규칙(variantImgKind)을 따른다. */
      const vk = bank && hasTwin ? variantImgKind(bank) : null;

        </div>
        <div class="exq-b">
          <div class="exq-c">
            <div class="lb"><span class="badge no">원본</span></div>
            <div class="tx">${problemHTML(q.content)}</div>

          </div>
          ${hasTwin ? `<div class="exq-c">
            <div class="lb"><span class="badge score">변형</span></div>
            <div class="tx">${problemHTML(bank.variantContent||'')}</div>
            ${vk ? pbImageHTML(bank.id, vk, 'pb-fig') : ''}
            ${needFig ? `<div style="font-size:11px;color:var(--no);margin-top:9px;line-height:1.7;">
              이 변형은 그림이 있어야 풀립니다. <b>검토 탭</b>에서 지침을 보고 그려 올려야 학생에게 나갑니다.</div>` : ''}
            <div class="ans">정답<b>${escHtml(bank.variantAnswer||'—')}</b></div>
          </div>`
          : `<div class="exq-c none">${bank
              ? '아직 쌍둥이 문제가 없습니다.<br>위 「쌍둥이 전부 생성」으로 만들 수 있습니다.'

   ⚠ 글자마다 render()를 부르면 안 된다 — 전체 재렌더링이라 커서가 튀고 한글 조합이 깨진다
   (수업 메모·학생 메모에서 이미 겪은 것과 같은 함정). 이 판 하나만 직접 그린다. */
function updateEqPreview(i){
  const box = document.getElementById('eq-prev-'+i);
  if(!box) return;
  const c = document.getElementById('eq-content-'+i);
  const a = document.getElementById('eq-answer-'+i);

    box.appendChild(lb);
    box.appendChild(document.createTextNode(a.value));

  if(window.renderMathInElement){
    try{ renderMathInElement(box, {delimiters:[{left:'$', right:'$', display:false}], throwOnError:false}); }
    catch(e){ /* 쓰는 중인 수식은 깨져 있는 것이 정상이다. 조용히 넘긴다 */ }
  }
}
/* hwpx를 잘못 올렸을 때 쓴다. 22문항을 하나씩 지우게 두면 다시 올리는 것보다 오래 걸린다.
   되돌릴 수 없으므로 몇 개를 지우는지 세어서 묻는다. */
function clearExamQuestions(){
  syncExamDraftFromDOM();
  const n = examDraft.questions.filter(q=>(q.content||'').trim()).length;
  if(n === 0){ showToast('지울 문항이 없습니다.'); return; }
  if(!confirm(`문항 ${n}개를 모두 지울까요?\n되돌릴 수 없습니다. 시험명·반·첨부 이미지는 그대로 둡니다.`)) return;
  examDraft.questions = [{content:'', answer:'', unit:examDraft.questions[0]?.unit || UNITS[0], chapter:''}];
  showToast(`문항 ${n}개를 지웠습니다.`);
  render();
}
async function saveExam(){
  syncExamDraftFromDOM();
  if(!examDraft.title || !examDraft.classId){ showToast('반과 시험명을 입력해주세요.'); return; }
  const validQuestions = examDraft.questions.filter(q=>q.content.trim() && q.answer.trim());
  if(validQuestions.length===0){ showToast('문항을 최소 1개 이상 입력해주세요.'); return; }
  if(examDraft.pages.some(p=>p.uploading)){ showToast('이미지 업로드가 끝난 후 다시 시도해주세요.'); return; }
  const readyPages = examDraft.pages.filter(p=>p.url);
  // 문항 이미지는 problem-bank 항목마다 별도 문서(pbimg:id)로, 스캔 페이지는 구글 드라이브에
  // 올리고 링크만 저장한다. Firestore에는 짧은 URL/ID만 남아 문서 용량 제한에서 자유롭다.
  /* ⚠ 여기서 문항을 «새로 짓는다» — 초안에 든 것을 그대로 안 쓰고 고른 칸만 옮긴다.
     그래서 **새 칸을 더할 때마다 여기에도 적어야 한다.** itemCode 를 빠뜨렸더니
     hwpx 에서 읽어 온 코드가 저장 직전에 조용히 사라졌다 (2026-09-03에 실제로 그랬다). */
  const questions = validQuestions.map((q,i)=>({no:i+1, content:q.content.trim(), answer:q.answer.trim(),
    unit:q.unit||'', chapter:q.chapter||'', itemCode:q.itemCode||''}));
  /* 🔵 **이미 있는 시험을 채우는 길** (2026-08-30 · C-7) — 성적만 먼저 넣어 둔 시험에
     나중에 문항을 붙인다. 새 문서를 만들지 않고 **그 문서를 고친다** —
     id가 그대로라 `rec.scores[].examId`가 가리키는 곳이 안 바뀌고, 성적이 그대로 붙어 있다.
     ⚠ `scoreTotal`·`sourceExamId` 같은 이미 있던 값은 **덮지 않는다.** */
  const editing = examDraft.examId ? DATA.exams.find(x=>x.id===examDraft.examId) : null;
  /* 🔴 **이미 들어간 성적의 «만점»과 붙이는 문항 수가 다르면 먼저 묻는다** (2026-09-01 · C-21).
     08-31 노트가 「끝까지 안 봤다」고 남겨 둔 자리다. 09-01에 눌러 보니 실제로 어긋났다 —
     **20문항으로 채점해 둔 시험에 문항을 3개만 붙이면**
       · 열 머리는 「3문항」이 되고(examTotalOf가 문항 수를 먼저 본다)
       · 칸에는 17이 그대로 남아 «3문항에 17개 맞았다»가 되고
       · 그 뒤 「전체 저장」을 누르면 17>3이라 그 칸만 조용히 건너뛴다
     🔵 **성적이 지워지지는 않는다** — 저장된 항목은 {score:17, total:20}을 그대로 이고
       %도 그 값으로 나온다. 망가지는 것은 «다음에 고칠 때»다.
     그래서 여기서 한 번 묻는다. 정상 흐름은 **문항을 만점 수만큼 붙이는 것**이다. */
  if(editing){
    const totals = new Set();
    for(const st of DATA.students){
      const r = state.allRecords[st.studentId];
      const sc = r && examScoreOf(r, editing.id);
      if(sc && sc.total) totals.add(sc.total);
    }
    const bad = [...totals].filter(t => t !== questions.length);
    if(bad.length && !confirm(
      '이 시험에는 이미 «' + bad.join('·') + '문항 기준» 성적이 들어 있습니다.\n' +
      '지금 붙이는 문항은 ' + questions.length + '개입니다.\n\n' +
      '그대로 붙이면 넣어 둔 점수는 남지만, 다음에 그 칸을 고칠 때 ' + questions.length +
      '개를 넘는 점수는 저장되지 않습니다.\n' +
      '문항을 ' + bad[0] + '개로 맞춰 붙이는 것이 맞습니다.\n\n그래도 이대로 붙일까요?')) return;
  }
  const examId = editing ? editing.id : 'ex'+Date.now();
  let newExam;
  if(editing){
    Object.assign(editing, {classId:examDraft.classId, title:examDraft.title, date:examDraft.date,
      questions, hasFiles:readyPages.length>0 || !!editing.hasFiles});
    newExam = editing;
  }else{
    newExam = {id:examId, classId:examDraft.classId, title:examDraft.title, date:examDraft.date, questions, hasFiles:readyPages.length>0};
    DATA.exams.unshift(newExam);
  }
  await dbSetDoc('exams', newExam.id, newExam);
  if(readyPages.length>0){
    await dbSet('examfiles:'+examId, readyPages);
  }
  for(let i=0;i<questions.length;i++){
    const q = questions[i];
    const srcImage = validQuestions[i].image;
    const bankId = 'pb'+Date.now()+'_'+q.no;
    let imgResult = null;
    if(srcImage){
      try{ imgResult = await uploadDataUrlToDrive(srcImage); }
      catch(e){ console.error('문항 이미지 업로드 실패', e); showToast(q.no+'번 문항 이미지 업로드에 실패했습니다.'); }
    }
    /* ⚠ 과목·단원을 여기에 «복사»해 둔다. 시험지를 지우면 문항의 태그를 잃는데,
       데일리퀴즈의 범위 판정은 시험지가 사라진 뒤에도 돌아야 한다. */
    const bankEntry = {
      id:bankId, examId, questionNo:q.no,
      originalContent:q.content, originalAnswer:q.answer,
      variantContent:'', variantAnswer:'', status:'pending',
      subject:q.unit||'', chapter:q.chapter||'',
      /* hwpx 미주에 코드가 심겨 있었으면 그대로 물려받는다 (2026-09-03 · I-2).
         손으로 다시 칠 일이 없어지는 자리다. */
      itemCode: q.itemCode || '',
      hasImage: !!imgResult
    };
    DATA.problemBank.push(bankEntry);
    await dbSetDoc('problembank', bankEntry.id, bankEntry);
    if(imgResult) await dbSet('pbimg:'+bankId, imgResult);
  }
  examDraft = { examId:'', classId:'', title:'', date:'', questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };
  /* 저장했으면 등록 모드에서 나와 방금 만든 시험지를 보여 준다 — 폼에 남아 있으면 또 만들 것처럼 보인다. */
  state.examMode = ''; state.examSelectedId = examId;
  showToast(editing
    ? `「${newExam.title}」에 문항 ${questions.length}개를 붙였습니다. 넣어 둔 성적은 그대로 이어집니다.`
    : '시험지가 등록되었습니다. 오답 검토에서 AI 쌍둥이 문제를 생성해보세요.');
  render();
}
/* 시험지를 지우면 **거기서 나온 것도 같이 지운다.**
   예전에는 시험지만 지우고 문항 창고는 남겼다. 그러면 검토 큐에 「(삭제된 시험지) N번」이
   영영 남아 비울 수 없는 줄이 된다 — 원본이 없어졌으니 쌍둥이를 만들 수도, 판단할 수도 없다.
   학생 기록의 오답숙제도 같이 턴다. 안 그러면 «화면에 아무것도 안 뜨는 숙제»가 남는다. */
async function deleteExam(examId){
  const e = DATA.exams.find(x=>x.id===examId);
  /* 🔴 **창고를 함께 쓰는 시험지가 있으면 창고는 손대지 않는다** (2026-08-29) —
     복사본이 뿌리의 문항을 가리키고 있다. 예전 코드처럼 `examId`로 문항을 싹 지우면
     **다른 반의 쌍둥이까지 사라진다.** 마지막 한 장일 때만 턴다. */
  const siblings = e ? examSiblings(e).filter(x=>x.id!==examId) : [];
  const banks = examBanks(e || {id:examId});
  const bankIds = new Set(banks.map(b=>b.id));
  const dropBanks = siblings.length===0;

  /* 학생 기록을 다 봐야 몇 건이 딸려 나가는지 셀 수 있다. 지우기 «전»에 말해 주려고 먼저 싣는다. */
  await loadAllRecordsIfNeeded();
  /* ⚠ **창고를 함께 쓸 때는 «이 시험지의» 숙제만 턴다** — bankId로 털면 같은 문항을
     받은 **다른 반 학생의 숙제까지** 딸려 나간다. 마지막 한 장일 때만 주인 없는 것까지 쓸어 담는다. */
  const mineHw = h => h.examId===examId || (dropBanks && bankIds.has(h.bankId));
  const affected = DATA.students.filter(s=>{
    const rec = state.allRecords[s.studentId];
    return (rec && rec.wrongHomework || []).some(mineHw);
  });
  const hwCount = affected.reduce((n,s)=>{
    const rec = state.allRecords[s.studentId];
    return n + (rec.wrongHomework||[]).filter(mineHw).length;
  }, 0);
  /* 지울 것과 «남길 것»을 한 줄로 말해 준다 — 복사본이 있으면 창고는 안 지운다. */
  const bankLine = dropBanks
    ? `· 이 시험지에서 만든 문항 ${banks.length}개 (검토 대기에 있는 것 포함)`
    : `· 쌍둥이 문항 ${banks.length}개는 «남깁니다» — ${siblings.map(x=>classNameOf(x.classId)).join(' · ')}의 복사본이 함께 씁니다`;

  if(!confirm(`「${escHtmlPlain(e ? e.title : '시험지')}」를 삭제할까요?\n\n`
    + `함께 지워지는 것 —\n`
    + `${bankLine}\n`
    + (hwCount ? `· 학생 ${affected.length}명의 오답숙제 ${hwCount}건\n` : '')
    + `\n되돌릴 수 없습니다.`)) return;

  DATA.exams = DATA.exams.filter(x=>x.id!==examId);
  await dbDeleteDoc('exams', examId);
  await dbDelete('examfiles:'+examId);

  if(dropBanks){
    for(const b of banks){
      await dbDeleteDoc('problembank', b.id);
      if(b.hasImage){
        const img = await dbGet('pbimg:'+b.id, null);
        deleteFromDrive(imgFileIdOf(img));      // 결과를 기다리지 않는다
        await dbDelete('pbimg:'+b.id);
      }
      /* 강사가 변형용으로 직접 그려 올린 그림도 같이 턴다 — 남기면 드라이브에 주인 없는 파일이 쌓인다. */
      if(b.hasVariantImage) await dropVariantFigure(b);
    }
    DATA.problemBank = DATA.problemBank.filter(b=>b.examId!==examId);
  } else if(e && !e.sourceExamId){
    /* 지운 것이 «뿌리»였다 — 창고가 주인을 잃는다. 남은 복사본 하나를 새 뿌리로 세우고
       문항과 나머지 복사본이 그쪽을 가리키게 옮긴다. 안 그러면 쌍둥이가 통째로 미아가 된다. */
    const heir = siblings[0];
    for(const b of banks){ b.examId = heir.id; await dbSetDoc('problembank', b.id, b); }
    delete heir.sourceExamId;
    await dbSetDoc('exams', heir.id, heir);
    for(const x of siblings.slice(1)){ x.sourceExamId = heir.id; await dbSetDoc('exams', x.id, x); }
  }

  for(const s of affected){
    const rec = await loadRecord(s.studentId);
    rec.wrongHomework = (rec.wrongHomework||[]).filter(h=>!mineHw(h));
    /* 데일리퀴즈 상태에서도 그 카드들을 턴다 — 안 그러면 풀에 없는 id가 picks에 남는다.
       (dqTodayCards가 걸러 주긴 하지만 이력·카드 상태가 계속 쌓인다.) */
    /* ⚠ **문항이 남아 있으면(복사본이 쓰고 있으면) 카드도 그대로 둔다** — 아직 유효한 문제다. */
    if(dropBanks){
      const d = dqState(rec);
      Object.keys(d.cards).forEach(id=>{ if(bankIds.has(String(id).split(':')[0])) delete d.cards[id]; });
      d.picks = d.picks.filter(id=>!bankIds.has(String(id).split(':')[0]));
      d.log = d.log.filter(x=>!bankIds.has(String(x.id).split(':')[0]));
    }
    state.allRecords[s.studentId] = rec;
    await saveRecord(s.studentId);
  }

  logAudit('시험지 삭제', '', '', `${e ? e.title : examId} · 문항 ${dropBanks?banks.length:0}개 · 오답숙제 ${hwCount}건${dropBanks?'':' · 쌍둥이 '+banks.length+'개는 복사본이 이어받음'}`);
  showToast(`${dropBanks ? '시험지와 문항 '+banks.length+'개를 지웠습니다.'
      : '시험지를 지웠습니다. 쌍둥이 문항 '+banks.length+'개는 복사본이 계속 씁니다.'}`
    + (hwCount ? ` 학생 오답숙제 ${hwCount}건도 함께 지웠습니다.` : ''));
  render();
}
async function copyExamToClass(examId){
  const sel = document.getElementById('copy-target-'+examId);
  const targetClassId = sel.value;
  if(!targetClassId){ showToast('복사할 반을 선택해주세요.'); return; }
  const e = DATA.exams.find(x=>x.id===examId);
  if(!e) return;
  /* 🔴 **날짜를 베끼지 않는다** (2026-08-29에 고쳤다) — 예전에는 `date:e.date`라
     **원본을 처음 등록한 날**이 그대로 따라왔다. 복사는 «다른 반이 이 시험을 본다»는 뜻이라
     그 반이 본 날이 맞다. 기본값은 오늘이고, 옆 칸에서 고쳐서 복사할 수 있다. */
  const dateEl = document.getElementById('copy-date-'+examId);
  const newDate = (dateEl && dateEl.value) || todayStr();
  const newId = 'ex'+Date.now();
  const copiedExam = {id:newId, classId:targetClassId, title:e.title, date:newDate,
    questions:e.questions.map(q=>({...q})), hasFiles:e.hasFiles,
    /* 뿌리를 가리킨다 — 복사본의 복사본이어도 뿌리는 하나다(사슬을 만들지 않는다). */
    sourceExamId: e.sourceExamId || e.id};
  DATA.exams.unshift(copiedExam);
  await dbSetDoc('exams', copiedExam.id, copiedExam);
  if(e.hasFiles){
    const pages = await dbGet('examfiles:'+examId, []);
    await dbSet('examfiles:'+newId, pages);
  }
  const shared = examBanks(copiedExam).length;
  logAudit('시험지 복사', '', '', `${e.title} → ${classNameOf(targetClassId)} · ${newDate}`);
  /* 복사한 것을 곧장 열어 준다 — 안 그러면 어디로 갔는지 모르고 목록에서 찾아야 한다. */
  state.examSelectedId = newId;
  showToast(`${classNameOf(targetClassId)}에 복사되었습니다 (${newDate}).`
    + (shared ? ` 쌍둥이 문항 ${shared}개는 원본과 함께 씁니다.` : ''));
  render();
}

/* =================== 시험지 복사 — «뿌리»와 «복사본» ===================
   다른 반으로 복사한 시험지는 문항 창고(problemBank)를 **복제하지 않고 원본 것을 함께 쓴다.**
   쌍둥이 문제는 «문항»에 딸린 것이지 «반»에 딸린 것이 아니다 — 반마다 따로 만들면
   같은 문항의 쌍둥이가 둘이 되고, 검토해서 고친 것이 한쪽에만 남는다. AI 한도도 두 번 쓴다.
   그래서 복사본은 `sourceExamId`로 뿌리를 가리키기만 한다 (2026-08-29 · 사용자 요청).
   🔴 **창고는 함께 쓰고 통계는 따로다 — 이 둘을 헷갈리지 말 것.**
     학생 기록(`wrongHomework`)에는 **복사본의 `examId`가 그대로** 들어간다.
     문항별 오답률은 «그 반이 어디서 무너졌나»라 반마다 갈라져 있어야 한다.
     두 반을 합쳐 보고 싶을 때는 화면의 「전체」 토글이 답한다. */
function examRootId(examId){
  const e = DATA.exams.find(x=>x.id===examId);
  return (e && e.sourceExamId) || examId;
}
/* 이 시험지가 «쓰는» 쌍둥이 문항. 복사본이면 뿌리의 것이 나온다. */
function examBanks(exam){
  if(!exam) return [];
  return DATA.problemBank.filter(b=>b.examId===(exam.sourceExamId || exam.id));
}
/* =================== 시험지 «묶음»과 «과목 폴더» (2026-08-30 · C-2) ===================
   화면의 뼈대다 — 왼쪽은 «과목 > 시험지», 본문 위 칩이 «어느 반».
   🔵 **묶음의 기준은 «복사로 이어졌나»뿐이다** (`sourceExamId`). 제목이 같다고 묶지 않는다 —
     따로 만든 두 시험지가 우연히 이름이 같을 수 있고, 그것을 묶으면 통계가 조용히 섞인다.
   ⚠ 그래서 **2026-08-29 이전에 복사한 것은 안 묶인다** (그때는 `sourceExamId`를 안 달았다).
     지우고 다시 복사하면 묶인다 — 사용자가 그렇게 하기로 정했다. */
function examSubjectOf(e){
  /* 폴더 열쇠는 문항의 «과목»(unit) 중 가장 많은 것이다. 시험지에 과목 칸이 따로 없어서
     문항에서 뽑는다. 실데이터에서는 한 시험지가 한 과목이고 «단원»만 여럿이다. */
  const c = {};
  ((e && e.questions) || []).forEach(q=>{ const u = (q.unit||'').trim(); if(u) c[u] = (c[u]||0) + 1; });
  const keys = Object.keys(c).sort((a,b)=> c[b] - c[a]);
  return { name: keys[0] || '과목 미지정', mixed: keys.length > 1, all: keys };
}
/* 복사로 이어진 것들을 하나로 묶는다. 묶음마다 {뿌리, 대표, 반 목록, 과목}. */
function examGroups(){
  const by = {};
  /* 🔵 **점수만 있는 시험은 여기 안 뜬다** (2026-08-30 · C-4) — 이 화면이 묻는 것은
     «어느 문항이 무너졌나»다. 문항이 없으면 답할 것이 없고, 목록만 어지럽힌다.
     그 시험들은 반 > 성적에 있다. 나중에 문항을 등록하면 여기 나타난다. */
  DATA.exams.filter(e=>(e.questions||[]).length).forEach(e=>{
    const root = e.sourceExamId || e.id; (by[root] = by[root] || []).push(e); });
  const out = Object.keys(by).map(root=>{
    /* 반 목록은 «시험 본 날» 차례로 세운다 — 복사한 차례가 아니라 학생이 겪은 차례다. */
    const list = by[root].slice().sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')));
    const head = list.find(e=>e.id===root) || list[0];
    return { root, head, list, subject: examSubjectOf(head) };
  });
  /* 묶음끼리는 «가장 최근에 본 날»이 위로. 어제 본 시험이 맨 위에 있어야 한다. */
  out.sort((a,b)=> String(b.list[b.list.length-1].date||'').localeCompare(String(a.list[a.list.length-1].date||'')));
  return out;
}
/* 지금 무엇을 보고 있나 — 묶음 하나와, 골라 둔 반(없으면 «전체»). */
function examView(){
  const groups = examGroups();
  if(!groups.length) return null;
  let g = groups.find(x=>x.root===state.examGroupId);
  if(!g) g = groups.find(x=>x.list.some(e=>e.id===state.examSelectedId)) || groups[0];
  /* ⚠ 고른 반이 이 묶음 밖이면 «전체»로 떨어뜨린다 — 다른 묶음을 열면 반은 따라오면 안 된다. */
  const one = (state.examSelectedId && g.list.find(e=>e.id===state.examSelectedId)) || null;
  return { groups, g, one };
}
function examOpenGroup(root){
  state.examGroupId = root; state.examSelectedId = ''; render();
}
function examOpenClass(root, examId){
  state.examGroupId = root; state.examSelectedId = examId; render();
}
function examToggleFolder(name){
  const cur = examFolderOpen(name);
  state.examFolders = Object.assign({}, state.examFolders, {[name]: !cur});
  render();
}
/* 값이 없으면 «지금 보고 있는 묶음이 든 폴더»만 열린 것으로 친다. */
function examFolderOpen(name){
  if(state.examFolders && Object.prototype.hasOwnProperty.call(state.examFolders, name))
    return !!state.examFolders[name];
  const v = examView();
  return !!(v && v.g.subject.name === name);
}

/* 같은 창고를 쓰는 시험지 전부 — 뿌리와 그 복사본들(자기 자신 포함). */
function examSiblings(exam){
  if(!exam) return [];
  const root = exam.sourceExamId || exam.id;
  return DATA.exams.filter(e=>e.id===root || e.sourceExamId===root);
}
function findBankEntry(examId, no){
  /* 🔴 복사본이면 «뿌리»에서 찾는다. 예전에는 `examId`가 딱 맞아야 해서 복사본에서는
     항상 못 찾았고, 그래서 **이미 만들어 둔 쌍둥이를 놔두고 또 만들었다.** */
  return DATA.problemBank.find(b=>b.examId===examRootId(examId) && b.questionNo===no);
}

// 시험 선택 + 틀린 문항 체크 + 제출 위젯. "오답숙제" 탭과 홈 화면의 "빠른 변형 문제 요청" 카드에서 공용으로 쓴다.
/* wrongSubmitWidgetHTML(시험 선택 + 번호 체크 그리드)은 지웠다.
   예전에는 «홈»과 «오답숙제» 두 화면에 같은 것이 동시에 그려져 있었다 —
   state.wrongExamId·wrongChecked를 공유하니 한쪽에서 고른 것이 다른 쪽에 비쳤다.
   지금은 오답숙제의 「틀린 문제 등록」 하나뿐이다 (stuWrongHTML). */
function toggleWrongCheck(no){
  state.wrongChecked[no] = !state.wrongChecked[no];
  render();
}
async function submitWrongAnswers(){
  const examId = state.wrongExamId;
  const exam = DATA.exams.find(e=>e.id===examId);
  if(!exam){ showToast('시험지를 선택해주세요.'); return; }
  const wrongNos = Object.keys(state.wrongChecked).filter(k=>state.wrongChecked[k]).map(k=>parseInt(k));
  if(wrongNos.length===0){ showToast('틀린 문제 번호를 선택해주세요.'); return; }
  await loadUnitBankIfNeeded();
  const sid = state.currentUser.studentId;
  const rec = await loadRecord(sid);
  let matchedFromBank = 0, newlyRequested = 0;
  for(const no of wrongNos){
    let bank = findBankEntry(examId, no);
    if(!bank){
      const q = exam.questions.find(q=>q.no===no);
      if(!q) continue;
      const candidates = q.unit ? DATA.unitBank.filter(u=>u.unit===q.unit) : [];
      const match = candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : null;
      /* 시험지 등록 때와 같은 태그를 싣는다 — 이 길로 만들어진 항목만 태그가 없으면
         그 학생만 조용히 범위 판정에서 빠진다 (문항 태그는 problembank가 진실이다). */
      const tag = {subject:q.unit||'', chapter:q.chapter||''};
      if(match){
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: match.content, variantAnswer: match.answer,
          status:'approved', source:'unitbank', unitBankId: match.id, ...tag
        };
        matchedFromBank++;
      } else {
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: '', variantAnswer: '',
          status:'pending', ...tag
        };
        newlyRequested++;
      }
      DATA.problemBank.push(bank);
      await dbSetDoc('problembank', bank.id, bank);
    }
    if(!rec.wrongHomework.some(h=>h.bankId===bank.id)){
      rec.wrongHomework.push({bankId:bank.id, examId, questionNo:no, assignedAt:todayStr(), done:false, studentAnswer:''});
    }
  }
  await saveRecord(sid);
  state.wrongChecked = {};
  let msg = '제출되었습니다.';
  if(matchedFromBank>0 && newlyRequested>0) msg = `제출되었습니다. ${matchedFromBank}개는 바로 숙제로 나갔고, ${newlyRequested}개는 선생님이 등록하면 나갑니다.`;
  else if(matchedFromBank>0) msg = '제출되었습니다. 문항 창고에서 바로 숙제로 나갔습니다.';
  else if(newlyRequested>0) msg = '제출되었습니다. 선생님이 쌍둥이 문제를 등록하면 숙제로 나갑니다.';
  showToast(msg);
  render();
}
async function submitHomeworkAnswer(bankId){
  const sid = state.currentUser.studentId;
  const rec = await loadRecord(sid);
  const hw = rec.wrongHomework.find(h=>h.bankId===bankId);
  if(!hw) return;
  const val = document.getElementById('hw-answer-'+bankId).value.trim();
  if(!val){ showToast('답을 입력해주세요.'); return; }
  hw.studentAnswer = val;
  hw.done = true;
  await saveRecord(sid);
  render();
}

/* =================== 문항 그림 =================== */
/* 문항 하나에 그림이 둘까지 붙는다. 문서를 나눠 두고 캐시 열쇠도 갈라 둔다.
     'orig' → pbimg:{id}   시험지에서 딸려 온 원본 그림
     'var'  → pbvimg:{id}  «그림이 있어야 푸는 변형»에 강사가 직접 그려 올린 그림
   한 캐시에 넣되 열쇠를 갈라야 한다 — 같은 열쇠를 쓰면 한 문항의 두 그림이 서로를 덮는다. */
function pbImgDoc(bankId, kind){ return (kind==='var' ? 'pbvimg:' : 'pbimg:') + bankId; }
function pbImgCacheKey(bankId, kind){ return (kind==='var' ? 'v:' : '') + bankId; }

/* 그림은 필요해질 때 늦게 부른다. 캐시에 없으면 «불러오는 중»을 박아 두고, 도착하면 다시 그린다.
   ⚠ **여기서 곧장 render()를 부르지 않는다.** 이 함수는 화면을 «그리는 도중»에 불린다
     (examDetailHTML·reviewWorkHTML·학생 카드). 그리는 중에 또 그리면 그 판이 통째로 버려진다.
     이번 판은 'loading'을 그대로 읽어 「불러오는 중」을 그리면 된다. */
function ensurePbImage(bankId, kind){
  const ck = pbImgCacheKey(bankId, kind);
  if(state.pbImageCache[ck] !== undefined) return;
  state.pbImageCache[ck] = 'loading';
  dbGet(pbImgDoc(bankId, kind), null).then(img=>{
    state.pbImageCache[ck] = img || 'empty';
    pbImgArrived();
  });
}
/* 시험지 탭의 「문항 내용」은 그림을 스무 장씩 부른다. 도착할 때마다 그리면 render()가
   스무 번 도는데, 이 앱은 전체 재렌더링이라 그 값이 싸지 않다. 한 박자 모아서 한 번만 그린다. */
let pbImgRenderQueued = false;
function pbImgArrived(){
  if(pbImgRenderQueued) return;
  pbImgRenderQueued = true;
  setTimeout(()=>{ pbImgRenderQueued = false; render(); }, 60);
}
/* ⚠ 반드시 imgSrcOf()를 거친다. 드라이브에 올린 그림은 «{url, fileId} 객체»로 저장돼 있어
   그대로 src에 넣으면 "[object Object]"가 되어 아무것도 안 뜬다.
   옛 기록에는 base64 문자열도 섞여 있어 두 가지를 다 받아 줘야 한다. */
function pbImageSrc(bankId, kind){
  const v = state.pbImageCache[pbImgCacheKey(bankId, kind)];
  return (v && v!=='loading' && v!=='empty') ? imgSrcOf(v) : null;
}
/* 「불러오는 중」 자리를 채우는 조각. 그림을 쓰는 화면이 넷이라 표기를 한 곳에 모은다.
   ⚠ 그림이 두 «모양»으로 저장된다 — 드라이브에 올린 사진(`{url, fileId}`)과
   figure.js가 그린 SVG 문자열(`{kind:'svg', svg}`). 여기가 그 둘을 가르는 유일한 자리다.
   **어느 그림을 쓸지**는 여전히 variantImgKind()가 정한다 — «어떻게 저장돼 있나»와
   «어느 카드가 쓰나»는 다른 물음이라 섞으면 안 된다.

   ⚠ SVG를 innerHTML로 넣는다. **모델이 낸 SVG는 절대 저장하지 않는다** — 저장하는 것은
   figure.js의 renderScene()이 «장면»에서 만들어 낸 것뿐이고, 거기서 글자는 전부 이스케이프된다.
   이 불변식이 깨지면 그 자리가 곧 스크립트 주입 구멍이다. */
function pbImageHTML(bankId, kind, cls){
  ensurePbImage(bankId, kind);
  const v = state.pbImageCache[pbImgCacheKey(bankId, kind)];
  if(v && typeof v === 'object' && v.kind === 'svg' && v.svg)
    return `<div class="${cls} pb-svg">${v.svg}</div>`;
  const src = pbImageSrc(bankId, kind);
  if(src) return `<img class="${cls}" src="${src}">`;
  return v==='empty' ? ''
    : '<div style="font-size:11.5px;color:var(--dim);margin-top:9px;">그림 불러오는 중…</div>';
}

/* =================== 교사: 오답 문제 검토 =================== */
/* 신호 임계값도 여기서 같이 읽는다. signalOf()를 쓰는 세 화면(명단·신호·학생 상세)이
   전부 이 함수를 거치므로, 기록이 도착한 시점에는 규칙도 와 있다.
   따로 불러오면 «기본값으로 한 번 그리고 → 규칙이 와서 등급이 바뀌는» 깜빡임이 생긴다. */
async function loadAllRecordsIfNeeded(){
  if(state.allRecordsLoaded || state.allRecordsLoading) return;
  state.allRecordsLoading = true;
  render();
  const [entries, savedRules] = await Promise.all([
    Promise.all(DATA.students.map(async s => [s.studentId, await dbGet('record:'+s.studentId, null)])),
    dbGet('signal-rules', {})
  ]);
  state.signalRules = (savedRules && typeof savedRules === 'object') ? savedRules : {};
  state.allRecords = {};
  entries.forEach(([sid, rec]) => { if(rec) state.allRecords[sid] = rec; });
  state.allRecordsLoading = false;
  state.allRecordsLoaded = true;
  render();
}
// 문항 하나를 몇 명의 학생이 오답으로 제출했는지 센다 (제출 현황/검토 화면에서 재사용).
function bankRequesterCount(bankId){
  let n = 0;
  for(const sid in state.allRecords){
    if((state.allRecords[sid].wrongHomework||[]).some(h=>h.bankId===bankId)) n++;
  }
  return n;
}
/* teacherSubmissionsHTML(모든 시험지 x 모든 학생을 한 표에)은 지웠다 —
   시험지 화면의 우측 칸(examSubmissionsHTML)이 대신한다. 시안 07의 자리다. */
// 문제/답안/후기 등 사용자가 입력한 텍스트를 그대로 innerHTML에 넣으면 "<", ">"가
// 태그로 해석되어 레이아웃이 깨진다 (예: 부등식 "g(x)<f(x)<0"). HTML로 렌더링되기 전에
// 항상 이 함수를 거쳐서 특수문자를 이스케이프한다.
function escHtml(s){
  if(s===null || s===undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
