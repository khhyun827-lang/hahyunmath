const HP_NS = 'http://www.hancom.co.kr/hwpml/2011/paragraph';
// 한글 수식 스크립트를 KaTeX가 그릴 수 있는 LaTeX로 변환하고 $..$ 로 감싼다.
// (완벽한 변환기는 아니고, 고등수학에서 자주 쓰는 패턴 위주로 처리한다)
// 문자열에서 openIdx가 가리키는 '{'와 짝이 맞는 ')'를 중첩까지 고려해서 찾는다.
// (예: sqrt{ ( x ^{2} ) ^{2} }처럼 안에 또 중괄호가 있는 경우 단순 정규식으론 못 잡음)
function findMatchingBrace(s, openIdx){
  let depth = 0;
  for(let i=openIdx;i<s.length;i++){
    if(s[i]==='{') depth++;
    else if(s[i]==='}'){ depth--; if(depth===0) return i; }
  }
  return -1;
}
// keyword 뒤의 "{...}"를 중첩 중괄호까지 포함해서 통째로 찾아 wrap(inner)로 치환한다.
function replaceBalancedKeyword(s, keyword, wrap){
  const re = new RegExp('\\b'+keyword+'\\s*\\{','g');
  let result = '', lastIndex = 0, m;
  while((m = re.exec(s))){
    const openIdx = m.index + m[0].length - 1;
    const closeIdx = findMatchingBrace(s, openIdx);
    if(closeIdx===-1) continue;
    const inner = s.slice(openIdx+1, closeIdx);
    result += s.slice(lastIndex, m.index) + wrap(inner);
    lastIndex = closeIdx+1;
    re.lastIndex = closeIdx+1;
  }
  result += s.slice(lastIndex);
  return result;
}
// "{분자} over {분모}"를 \frac{}{}로 바꾼다. 분자/분모 안에 또 중괄호(예: 지수)가 있어도
// 괄호 짝을 직접 세어가며 찾기 때문에 중첩된 경우도 정확히 처리되고, 재귀적으로 안쪽도 변환한다.
function convertOverToFrac(s){
  let result = '', i = 0;
  while(i < s.length){
    if(s[i]==='{'){
      const close1 = findMatchingBrace(s, i);
      if(close1!==-1){
        let j = close1+1;
        while(s[j]===' ') j++;
        if(s.slice(j,j+4)==='over'){
          let k = j+4;
          while(s[k]===' ') k++;
          if(s[k]==='{'){
            const close2 = findMatchingBrace(s, k);
            if(close2!==-1){
              const num = convertOverToFrac(s.slice(i+1, close1));
              const den = convertOverToFrac(s.slice(k+1, close2));
              result += '\\frac{'+num+'}{'+den+'}';
              i = close2+1;
              continue;
            }
          }
        }
      }
    }
    result += s[i];
    i++;
  }
  return result;
}
function convertHwpEq(script){
  let s = script || '';
  if(!s.trim()) return '';
  s = s.replace(/`/g, '');
  s = s.replace(/\brm\s*/g, '');
  // "it"(이탤릭 지정)은 rm과 같은 서체 지정 명령이라 내용만 남기고 지운다.
  // "it2r+3"(공백 없음), "it r ^{2}"(공백 있음) 둘 다 나오므로 뒤 공백까지 함께 지운다.
  s = s.replace(/\bit\s*(?=[0-9a-zA-Z(])/g, '');
  s = replaceBalancedKeyword(s, 'pmatrix', inner => '\\begin{pmatrix}' + inner.replace(/#/g,'\\\\') + '\\end{pmatrix}');
  s = replaceBalancedKeyword(s, 'cases', inner => '\\begin{cases}' + inner.replace(/#/g,'\\\\') + '\\end{cases}');
  const greek = {alpha:'\\alpha',beta:'\\beta',gamma:'\\gamma',delta:'\\delta',theta:'\\theta',pi:'\\pi',lambda:'\\lambda',mu:'\\mu',sigma:'\\sigma',phi:'\\phi',omega:'\\omega'};
  for(const k in greek) s = s.replace(new RegExp('\\b'+k+'\\b','g'), greek[k]);
  // le/ge/LEQ 등은 it과 마찬가지로 뒤에 공백 없이 숫자가 바로 붙는 경우(le5)가 있어
  // 뒤쪽 \b는 안 쓰고 시작 위치만 단어 경계로 확인한다. 방금 만든 "\leq"의 "le"를
  // 다시 건드리지 않도록(무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = s.replace(/(?<!\\)\bLEQ/gi, '\\leq').replace(/(?<!\\)\bGEQ/gi, '\\geq').replace(/(?<!\\)\bNEQ/gi, '\\neq');
  s = s.replace(/(?<!\\)\ble/g, '\\leq').replace(/(?<!\\)\bge/g, '\\geq');
  s = s.replace(/\bTIMES\b/gi, '\\times');
  // angle/bar는 "angle{BAD}"(중괄호), "angle BAD"(공백), "angleBAD"(붙여쓰기) 세 가지 형태가
  // 모두 나오므로 각각 처리한다. 방금 만든 "\angle"/"\overline"을 다시 건드리지 않도록
  // (무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = replaceBalancedKeyword(s, 'angle', inner => '\\angle ' + inner);
  s = s.replace(/(?<!\\)\bangle\s+([A-Za-z]+)\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle([A-Z]{1,3})\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle\b/g, '\\angle');
  s = replaceBalancedKeyword(s, 'bar', inner => '\\overline{' + inner + '}');
  s = s.replace(/(?<!\\)\bbar\s+([A-Za-z]+)\b/g, '\\overline{$1}');
  s = s.replace(/(?<!\\)\bbar([A-Z]{1,3})\b/g, '\\overline{$1}');
  /* LEFT/RIGHT는 괄호만이 아니다 — 절댓값 LEFT | … RIGHT |, 대괄호, 중괄호가 다 온다.
     ⚠ 중괄호는 LaTeX에서 \left\{ 로 이스케이프해야 한다 (\left{ 는 KaTeX가 못 읽는다).
     짝이 안 맞는 LEFT/RIGHT가 남으면 수식 전체가 안 그려지므로, 못 알아본 것은 그냥 지운다. */
  s = s.replace(/\bLEFT\s*\{/g, '\\left\\{').replace(/\bRIGHT\s*\}/g, '\\right\\}');
  s = s.replace(/\bLEFT\s*([([|])/g, (m,d)=>'\\left'+d)
       .replace(/\bRIGHT\s*([)\]|])/g, (m,d)=>'\\right'+d);
  s = s.replace(/\bLEFT\b\s*/g, '').replace(/\bRIGHT\b\s*/g, '');
  s = s.replace(/\bCDOTS\b/gi, '\\cdots').replace(/\bLDOTS\b/gi, '\\ldots')
       .replace(/\bDOTSAXIS\b/gi, '\\cdots').replace(/\bDOTS\b/gi, '\\cdots');
  /* «같지 않다»가 세 가지 표기로 온다 — != 와 NEQ(위에서 처리) 와 ne. */
  s = s.replace(/!=/g, '\\neq').replace(/(?<!\\)\bne\b/g, '\\neq');
  /* pile{a#b}는 «세로로 쌓기»다. 열이 하나인 행렬로 옮긴다 (행 구분은 cases·pmatrix와 같은 #). */
  s = replaceBalancedKeyword(s, 'pile', inner =>
    '\\begin{matrix}' + inner.replace(/#/g,'\\\\') + '\\end{matrix}');
  s = convertOverToFrac(s);
  s = replaceBalancedKeyword(s, 'sqrt', inner => '\\sqrt{' + inner + '}');
  // 첨자가 여러 글자인데 중괄호 없이 붙어있으면(a_11 등) LaTeX에서 첫 글자만
  // 첨자로 처리되어 깨지므로, 중괄호로 다시 감싸준다.
  s = s.replace(/([_^])(?!\{)([0-9a-zA-Z]+)/g, '$1{$2}');
  s = s.replace(/\s+/g, ' ').trim();
  return s ? '$' + s + '$' : '';
}
// 수식 개체가 아니라 그냥 평문(<hp:t>)으로 "barAD", "angleBAD"처럼 붙여 쓴 경우를 정리한다.
function cleanHwpPlainText(t){
  if(!t) return t;
  return t
    .replace(/\bbar([A-Z]{1,3})\b/g, '$\\overline{$1}$')
    .replace(/\bangle([A-Z]{1,3})\b/g, '$\\angle $1$');
}
const HWP_CORE_NS = 'http://www.hancom.co.kr/hwpml/2011/core';
const HWP_WATERMARK_PATTERNS = [/족보닷컴/, /zocbo\.com/i];
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
function hwpWalkParagraphs(paras, tokens){
  for(const p of paras){
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType !== 1) continue;
        const local = child.localName;
        if(local === 't'){
          tokens.push({type:'text', v: cleanHwpPlainText(child.textContent||'')});
        } else if(local === 'equation'){
          const scriptEl = child.getElementsByTagNameNS(HP_NS,'script')[0];
          tokens.push({type:'eq', v: convertHwpEq(scriptEl?scriptEl.textContent:'')});
        } else if(local === 'pic'){
          const imgEl = child.getElementsByTagNameNS(HWP_CORE_NS,'img')[0];
          const ref = imgEl ? imgEl.getAttribute('binaryItemIDRef') : null;
          if(ref) tokens.push({type:'pic', v: ref});
        } else if(local === 'tbl'){
          /* 표를 «줄 하나로 뭉개지» 않고 행·열을 살려 둔다.
             예전에는 셀을 공백으로 이어 붙여서, 대진표나 조건 표가 테두리도 칸도 없는
             글 뭉치가 됐다. 지금은 한 행을 `| 칸 | 칸 |` 한 줄로 적는다 —
             글로 봐도 읽히고, 화면에서는 problemHTML()이 진짜 표로 되살린다.
             (내용은 평문으로 저장되므로 HTML을 넣을 수는 없다. 그래서 이 표기를 쓴다.) */
          const trs = Array.from(child.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
          const rows = [];
          for(const tr of trs){
            const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
            const cells = [];
            for(const tc of tcs){
              const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
              if(!subList){ cells.push(''); continue; }
              const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
              const cellTokens = [];
              hwpWalkParagraphs(cellParas, cellTokens);
              let s = '';
              for(const t of cellTokens){
                /* ⚠ 세로줄(`|`)은 표 행 문법과 부딪힌다. 그런데 **그냥 지우면 안 된다** —
                   수식의 절댓값이 이미 `\left|…\right|`로 바뀌어 있어서 막대를 지우면
                   `\left ` 만 남아 수식 전체가 안 그려진다 (실제로 겪었다).
                   수식 안에서는 LaTeX가 알아듣는 `\vert`로 바꾸고, 평문에서만 지운다. */
                if(t.type==='eq') s += String(t.v).replace(/\|/g, '\\vert ');
                else if(t.type==='text') s += String(t.v).replace(/\|/g, '');
                else if(t.type==='break') s += '\n';           // 줄바꿈을 살린다
                else if(t.type==='pic') tokens.push(t);        // 그림은 표 밖으로 빼서 살린다
                else if(t.type==='endnote') tokens.push(t);    // 정답 미주도 마찬가지
              }
              cells.push(s.replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim());
            }
            if(cells.some(c=>c)) rows.push(cells);
          }
          if(rows.length){
            /* ⚠ 표라고 다 «격자»가 아니다. 셋으로 갈린다.
               ① 보기 표 — 선지를 표로 그린 시험지가 흔하다 (칸 하나가 딱 ①②③④⑤).
                  격자로 두면 10칸짜리 한 줄이 되어 읽기 나쁘다 → 글로 펴고
                  problemHTML의 spaceChoices가 한 줄에 하나씩 세운다
               ② 상자 — 열이 하나뿐인 표 (조건 (가)(나) 상자). 한 행으로 뭉치면 그 안의
                  줄바꿈이 사라지므로 **줄마다 한 행**으로 편다
               ③ 진짜 격자 — 열이 둘 이상. 칸을 지켜야 하므로 줄바꿈은 공백으로 접는다
               ④ «자리»표 — 아래 isSeatLike 참고. ①보다 먼저 갈라야 한다 */
            const isMark = c => /^[①②③④⑤⑥⑦⑧⑨⑩]$/.test(c.trim());
            /* ⚠ ④ «자리»표 — 칸이 **전부** 맨 기호뿐인 표는 선지가 아니다.
               좌석 배치도·도형 라벨처럼 **기호의 위치가 곧 문제**라, 글로 펴면
               어느 칸이 1번인지 알 수 없어진다. 빈 칸(운전석 자리)까지 지워지므로
               더 나빠진다. 실제로 8인승 좌석 배치도가 이 길로 무너져 있었다.
               선지 표는 기호 «옆에 값»이 있어서 (`| ① | $4$ | ② | …`) 여기 안 걸린다. */
            const marked = rows.flat().filter(c => c.trim());
            const isSeatLike = marked.length > 0 && marked.every(isMark);
            const isChoiceTable = !isSeatLike && rows.some(cells => cells.some(isMark));
            tokens.push({type:'break'});
            if(isChoiceTable){
              for(const cells of rows){
                const line = cells.map(c=>c.replace(/\s+/g,' ').trim()).filter(Boolean).join(' ');
                if(line){ tokens.push({type:'text', v:line}); tokens.push({type:'break'}); }
              }
            } else {
              const singleCol = rows.every(cells=>cells.length===1);
              for(const cells of rows){
                const out = singleCol
                  ? cells[0].split('\n').map(l=>l.trim()).filter(Boolean).map(l=>[l])
                  : [cells.map(c=>c.replace(/\s+/g,' ').trim())];
                for(const row of out){
                  tokens.push({type:'text', v:'| ' + row.join(' | ') + ' |'});
                  tokens.push({type:'break'});
                }
              }
            }
          }
        } else if(local === 'ctrl'){
          const endNoteEl = child.getElementsByTagNameNS(HP_NS,'endNote')[0];
          if(endNoteEl){
            { const _p = hwpEndnoteParts(endNoteEl);
              tokens.push({type:'endnote', v: _p.answer, code: _p.code}); }
          } else if(child.getElementsByTagNameNS(HP_NS,'autoNum')[0]?.getAttribute('numType')==='ENDNOTE'){
            // 문서 맨 뒤 "빠른정답" 요약처럼 진짜 hp:endNote가 아닌 평문 목록을 만나면
            // 문항 구간이 끝난 것으로 보고 멈춘다.
            tokens.push({type:'stop'});
          }
        }
      }
    }
    tokens.push({type:'break'});
  }
}
/* 🔴 **미주 맨 앞의 문항 코드를 여기서 떼어 낸다** (2026-09-03 · I-2).
   안 떼면 `[정답]` 라벨이 «맨 앞»이 아니게 되어 아래 정규식이 빗나가고,
   **정답에 코드와 라벨이 통째로 들어간다.** 코드를 심자마자 실제로 그렇게 됐다.
   ⚠ **코드를 미주의 다른 자리로 옮겨도 이 문제는 안 사라진다** — 아래에서 보듯
     미주 속 글자를 «전부 이어 붙인 뒤» 라벨을 떼기 때문에, 끝에 두든 다음 줄에 두든
     정답 텍스트에 섞인다. 자리를 옮길 일이 아니라 **떼어 내야 하는 일**이다.
   🔵 그리고 떼어 낸 코드는 버리지 않는다 — 그대로 문항의 `itemCode` 가 된다. */
/* ⚠ **변형 코드(`-N01`)까지 받는다.** 복습테스트처럼 «이미 변형인 문항»으로 시험지를 만들면
     미주에 `[K2-01-E-0001-N01]` 이 적힌다. 접미사를 안 받으면 그것도 못 알아보고
     **정답에 통째로 섞인다** — 원본 코드에서 겪은 것과 똑같은 흠이다. */
const HWP_CODE_RE = /^\s*\[([A-Z]{1,2}\d?-\d{2}-[A-Z]-\d{4}(?:-[NUD]\d{2})?)\]\s*/;
function hwpEndnoteParts(endNoteEl){
  const subList = endNoteEl.getElementsByTagNameNS(HP_NS,'subList')[0];
  const innerParas = subList ? Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p') : [];
  const innerTokens = [];
  hwpWalkParagraphs(innerParas, innerTokens);
  let ans = '';
  for(const it of innerTokens){ if(it.type==='text'||it.type==='eq') ans += it.v; }
  let code = '';
  const m = ans.match(HWP_CODE_RE);
  if(m){ code = m[1]; ans = ans.slice(m[0].length); }
  // "[정답]" 라벨과, 일부 문서에서 수식 앞에 자동으로 붙는 "수식입니다." 안내 문구를 제거한다.
  return { code, answer: ans.replace(/^\s*\[정답\]\s*/,'').replace(/수식입니다\.?/g,'').trim() };
}
function hwpEndnoteText(endNoteEl){ return hwpEndnoteParts(endNoteEl).answer; }
// 표의 셀 하나를 문제 하나로 취급해서 텍스트/그림/(있다면) 정답을 뽑는다.
// 표 기반 시험지는 "번호 인식"을 미주 등장 시점에 의존하면 정답이 없는 문항에서
// 여러 문제가 한 덩어리로 뭉쳐버리는 문제가 있어서, 셀 경계를 기준으로 삼는 게 훨씬 안정적이다.
function hwpCellToBlock(cellParas){
  const tokens = [];
  hwpWalkParagraphs(cellParas, tokens);
  let text = '', answer = null, pics = [], itemCode = '';
  for(const tok of tokens){
    if(tok.type === 'endnote'){ answer = tok.v; if(tok.code) itemCode = tok.code; }
    else if(tok.type === 'text' || tok.type === 'eq') text += tok.v;
    else if(tok.type === 'pic') pics.push(tok.v);
    else if(tok.type === 'break') text += '\n';
  }
  return { text, answer, pics, itemCode };
}
/* 최상위 표를 «문항 컨테이너»로 볼 것인가, «문항 안의 상자»로 볼 것인가.

   ⚠ 이 둘을 한 규칙으로 못 가른다. 시험지 양식이 두 가지다 —
   ① 표 한 칸이 문항 하나인 시험지 (원래 이 파서가 맞춘 양식)
   ② 문항은 본문에 흐르고, 표는 «다음 조건을 만족시킨다» 상자나 보기 격자로 쓰이는 시험지
   ②를 ①로 읽으면 **한 문제가 조각조각 갈라진다.** 실제로 20문항짜리가 39개로 쪼개졌고,
   좌석 번호 표(①~⑧)가 든 문항 하나가 12조각이 났다 (2026-08-10, 광남고 1-1b).

   그래서 **양쪽으로 다 읽어 보고 미주(정답) 개수와 맞는 쪽을 고른다.**
   문항 하나에 정답 미주가 하나씩 달리므로 미주 개수가 곧 «문항 수»의 근거다.
   양식을 미리 알아맞히려 들지 않는 것이 요점이다 — 알아맞히는 규칙은 다음 양식에서 또 깨진다. */
function hwpParseBlocks(topParas, tablesAsProblems){
  const blocks = [];
  let plainTokens = [];
  let stopped = false;
  function flushPlain(){
    if(plainTokens.length===0) return;
    let cur = { text:'', answer:null, pics:[] };
    for(const tok of plainTokens){
      if(tok.type === 'stop'){ stopped = true; break; }
      if(tok.type === 'endnote'){
        if(cur.text.trim()) blocks.push(cur);
        cur = { text:'', answer: tok.v, itemCode: tok.code || '', pics:[] };
      } else if(tok.type === 'text') cur.text += tok.v;
      else if(tok.type === 'eq') cur.text += tok.v;
      else if(tok.type === 'pic') cur.pics.push(tok.v);
      else if(tok.type === 'break') cur.text += '\n';
    }
    if(cur.text.trim()) blocks.push(cur);
    plainTokens = [];
  }
  for(const p of topParas){
    if(stopped) break;
    // 이 문단 바로 아래에 최상위 표(문항 박스 레이아웃)가 있는지 찾는다.
    let foundTable = null;
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType===1 && child.localName==='tbl') foundTable = child;
      }
    }
    if(foundTable && tablesAsProblems){
      flushPlain();
      const trs = Array.from(foundTable.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
      for(const tr of trs){
        const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
        for(const tc of tcs){
          const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
          if(subList){
            const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
            const b = hwpCellToBlock(cellParas);
            if(b.text.trim()) blocks.push(b);
          }
        }
      }
    } else {
      hwpWalkParagraphs([p], plainTokens);
    }
  }
  flushPlain();
  return blocks;
}
async function parseHwpxToProblems(file){
  await ensureJSZipLoaded();
  const zip = await JSZip.loadAsync(file);
  /* 🔴 **구역을 «전부» 읽는다** (2026-09-03).
     예전에는 `section0.xml` 하나만 읽었다. 학교 시험지는 구역이 하나라 그것으로 됐지만,
     **교재는 구역이 여럿이다** — 엔딩크레딧 공통수학2 는 다섯이고 목차·표지가 앞을 차지해
     문항은 2·3 구역에 있다. 그래서 실제로 올려 보니 **목차 10줄만 읽고 문항은 하나도**
     **못 잡았다.** (내가 만든 흠이 아니라 원래 있던 한계인데, 교재를 올리게 되면서 드러났다.)
     ⚠ 구역 차례는 파일 이름의 숫자다 — `section10` 이 `section2` 보다 뒤여야 하므로 숫자로 센다. */
  const secNames = Object.keys(zip.files)
    .filter(n => /^Contents\/section\d+\.xml$/.test(n))
    .sort((a,b) => (+a.match(/\d+/)[0]) - (+b.match(/\d+/)[0]));
  if(!secNames.length) throw new Error('올바른 hwpx 파일이 아닙니다.');

  const topParas = [];
  const allEndnotes = [];
  for(const nm of secNames){
    const xmlText = await zip.file(nm).async('string');
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    const sec = doc.documentElement;
    if(!sec) continue;
    for(const n of Array.from(sec.childNodes)) if(n.nodeType===1 && n.localName==='p') topParas.push(n);
    for(const e of Array.from(doc.getElementsByTagNameNS(HP_NS,'endNote'))) allEndnotes.push(e);
  }

  /* 미주 개수 = 문항 개수의 근거. 두 가지로 읽어 보고 여기에 맞는 쪽을 고른다. */
  const orderedParts   = allEndnotes.map(hwpEndnoteParts);
  const orderedAnswers = orderedParts.map(x=>x.answer);
  const endnoteCount = orderedAnswers.length;

  /* ⚠ 미주 순서 매칭을 «점수를 매기기 전»에 해야 한다.
     정답이 문제 칸 «밖»에 있는 양식(문항마다 표로 감싼 시험지가 그렇다)에서는
     표=문항 해석이 정답을 하나도 못 붙여 0점이 되고, 그러면 문항 전체가 한 셀에 든
     표=상자 해석이 이겨 **문항이 통째로 한 줄로 뭉개진다** (2026-08-10).
     보정까지 마친 «최종 모습»끼리 견줘야 옳은 쪽이 뽑힌다. */
  const fillAnswers = bs => {
    if(bs.some(b=>!b.answer) && orderedAnswers.length === bs.length){
      bs.forEach((b,i)=>{ if(!b.answer) b.answer = orderedAnswers[i]; });
    }
    /* 코드도 같은 차례로 채운다 — 정답이 이미 붙어 있어도 코드는 비어 있을 수 있다. */
    if(orderedParts.length === bs.length){
      bs.forEach((b,i)=>{ if(!b.itemCode && orderedParts[i].code) b.itemCode = orderedParts[i].code; });
    }
    return bs;
  };
  const candidates = [
    fillAnswers(hwpParseBlocks(topParas, true)),
    fillAnswers(hwpParseBlocks(topParas, false)),
  ];
  const scoreOf = bs => {
    const answered = bs.filter(b=>b.answer && b.answer.trim()).length;
    /* ① 미주 수와 문항 수가 맞으면 압도적으로 좋다 ② 그다음은 정답이 붙은 비율 */
    return (endnoteCount && bs.length === endnoteCount ? 1000 : 0)
         + (bs.length ? Math.round(answered / bs.length * 100) : 0);
  };
  /* 동점이면 «표를 문항으로 보는» 해석을 택한다 — 그쪽이 셀 안의 줄바꿈을 지킨다. */
  const blocks = scoreOf(candidates[1]) > scoreOf(candidates[0]) ? candidates[1] : candidates[0];

  // 저작권 보호 워터마크(예: 족보닷컴)가 문제나 정답에 섞인 문항은 자동 인식에서 제외한다.
  let watermarked = 0;
  const clean = blocks.filter(b=>{
    const hay = b.text + ' ' + (b.answer||'');
    if(HWP_WATERMARK_PATTERNS.some(re=>re.test(hay))){ watermarked++; return false; }
    return true;
  });

  // 문항에 딸린 그림이 있으면 hwpx 안의 실제 이미지 파일을 꺼내 압축해 첨부한다.
  let idToHref = {};
  const hpfFile = zip.file('Contents/content.hpf');
  if(hpfFile){
    const hpfText = await hpfFile.async('string');
    const hpfDoc = new DOMParser().parseFromString(hpfText, 'text/xml');
    const items = hpfDoc.getElementsByTagName('opf:item');
    for(const it of Array.from(items)){
      const id = it.getAttribute('id'), href = it.getAttribute('href');
      if(id && href) idToHref[id] = href;
    }
  }
  const problems = [];
  for(const b of clean){
    const problem = { content: b.text.trim(), answer: (b.answer||'').trim(), image: null,
                      itemCode: b.itemCode || '' };
    const ref = b.pics[0];
    if(ref && idToHref[ref]){
      const imgFile = zip.file(idToHref[ref]);
      if(imgFile){
        try{
          const blob = await imgFile.async('blob');
          problem.image = await compressImageToBase64(blob, 1000, 0.6);
        }catch(e){ console.error('그림 추출 실패', ref, e); }
      }
    }
    problems.push(problem);
  }
  problems.watermarkedCount = watermarked;
  return problems;
}
async function handleUnitBankHwpxFile(fileList){
  const file = (fileList||[])[0];
  if(!file) return;
  const unit = document.getElementById('ub-hwpx-unit').value;
  try{
    showToast('hwpx 파일을 분석하는 중입니다...');
    const problems = await parseHwpxToProblems(file);
    if(problems.length === 0){ showToast('인식된 문항이 없습니다.'); return; }
    state.unitImportPreview = problems.map(p => ({ unit, content: p.content, answer: p.answer, image: p.image }));
    render();
    const noAnswer = problems.filter(p=>!p.answer).length;
    const wm = problems.watermarkedCount || 0;
    showToast(problems.length + '개 문항을 인식했습니다.'
      + (noAnswer>0 ? ` (정답 비어있는 ${noAnswer}개는 확인해주세요)` : '')
      + (wm>0 ? ` (저작권 보호 자료로 보이는 ${wm}개는 제외됨)` : ''));
  }catch(e){
    console.error('hwpx 처리 실패', e);
    showToast('hwpx 파일을 처리하지 못했습니다: ' + e.message);
  }
}

async function handleUnitBankExcelFile(fileList){
  const file = (fileList || [])[0];
  if(!file) return;
  try{
    await ensureXLSXLoaded();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    const parsed = rows.map(r => ({
      unit: String(r['단원'] ?? r['unit'] ?? '').trim(),
      content: String(r['문제'] ?? r['내용'] ?? r['content'] ?? '').trim(),
      answer: String(r['정답'] ?? r['answer'] ?? '').trim()
    })).filter(r => r.content && r.answer);
    if(parsed.length === 0){
      showToast('읽을 수 있는 문항이 없습니다. "단원/문제/정답" 열 이름을 확인해주세요.');
      return;
    }
    state.unitImportPreview = parsed;
    render();
  }catch(e){
    console.error('엑셀 처리 실패', e);
    showToast('엑셀 파일을 읽지 못했습니다.');
  }
}
function syncUnitImportPreviewFromDOM(){
  const rows = state.unitImportPreview;
  if(!rows) return;
  rows.slice(0,30).forEach((r,i)=>{
    const u = document.getElementById('uip-unit-'+i);
    const c = document.getElementById('uip-content-'+i);
    const a = document.getElementById('uip-answer-'+i);
    if(u) r.unit = u.value;
    if(c) r.content = c.value;
    if(a) r.answer = a.value;
  });
}
async function confirmUnitBankImport(){
  syncUnitImportPreviewFromDOM();
  const rows = state.unitImportPreview;
  if(!rows || rows.length===0) return;
  const CONCURRENCY = 15;
  const today = todayStr();
  let ok = 0, done = 0;
  state.importProgress = { done: 0, total: rows.length };
  render();
  for(let i=0; i<rows.length; i+=CONCURRENCY){
    const chunk = rows.slice(i, i+CONCURRENCY);
    const results = await Promise.all(chunk.map(async r => {
      let image = '', imageFileId = '';
      if(r.image){
        try{
          const up = await uploadDataUrlToDrive(r.image);
          image = up.url; imageFileId = up.fileId;
        }catch(e){ console.error('단원문항 이미지 업로드 실패', e); }
      }
      const { image:_drop, ...rest } = r;
      return collectionAdd('unitbank', { ...rest, image, imageFileId, createdAt: today });
    }));
    results.forEach(doc => { if(doc){ DATA.unitBank.unshift(doc); ok++; } });
    done += chunk.length;
    state.importProgress = { done, total: rows.length };
    render();
  }
  state.importProgress = null;
  state.unitImportPreview = null;
  showToast(ok + '개 문항이 창고에 추가되었습니다.' + (ok<rows.length ? ` (${rows.length-ok}건 실패)` : ''));
  render();
}
function cancelUnitBankImport(){
  state.unitImportPreview = null;
  render();
}

function readCheckedClassIds(prefix){

async function addAssistant(){
  const taId = document.getElementById('ta-id').value.trim();
  const pw = document.getElementById('ta-pw').value;
  const name = document.getElementById('ta-name').value.trim();
  const phone = document.getElementById('ta-phone').value.trim();
  const classIds = readCheckedClassIds('ta-cls-');
  if(!name){ showToast('이름을 입력해주세요.'); return; }
  if(!taId || !pw){ showToast('아이디와 비밀번호를 입력해주세요.'); return; }
  if(pw.length < 4){ showToast('비밀번호는 4자 이상으로 설정해주세요.'); return; }
  if(classIds.length===0){ showToast('담당 반을 하나 이상 고르세요.'); return; }
  if(DATA.assistants.some(a=>a.taId===taId)){ showToast('이미 사용 중인 아이디입니다.'); return; }
  const assistant = {id:'ta'+Date.now(), taId, pw, name, phone, classIds};
  DATA.assistants.push(assistant);
  await dbSetDoc('assistants', assistant.id, assistant);
  document.getElementById('ta-id').value='';
  document.getElementById('ta-pw').value='';
  document.getElementById('ta-name').value='';
  document.getElementById('ta-phone').value='';
  showToast(`${name} 조교를 추가했습니다 — 담당 ${assistantClassLabel(classIds)}`);
  render();
}

/* 담당 반 변경. 예전에는 이 문이 아예 없어서, 반을 바꾸려면 계정을 지우고 새로 만들어야 했다. */
async function saveAssistantClasses(aid){
  const a = DATA.assistants.find(x=>x.id===aid);
  if(!a) return;
  const next = readCheckedClassIds('tae-' + aid + '-');
  if(next.length===0){ showToast('담당 반을 하나 이상 골라야 합니다.'); return; }
  const before = assistantClassLabel(assistantClassIds(a));
  a.classIds = next;
  /* 옛 단수 필드는 여기서 없앤다 — 둘이 같이 남으면 어느 쪽이 진짜인지 알 수 없게 된다.
     (assistantClassIds가 classIds를 먼저 보므로 당장은 안 틀리지만, 남겨 두면 언젠가 틀린다.) */
  delete a.classId;
  await dbSetDoc('assistants', a.id, a);
  await logAudit('조교 담당 반 변경', '', '', `${a.name} · ${before} → ${assistantClassLabel(next)}`);
  state.taEditId = null;
  showToast(`${a.name} 조교의 담당 반을 바꿨습니다.`);

async function resetAssistantPw(aid){
  const a = DATA.assistants.find(a=>a.id===aid);
  if(!a) return;
  const next = prompt(`${a.name} 조교의 새 비밀번호를 입력하세요 (4자 이상)`);
  if(next===null) return;

/* =================== SVG 성적 그래프 =================== */
// 홈 화면의 "이달의 진도 성취도" 원형 그래프.
/* progressRingSVG(반 진도 도넛)은 지웠다 — 학생 홈에만 있던 것이고,
   진도는 제 화면(학습 > 진도·과제)에서 바(.bar)와 단원 목록으로 말한다.
   같은 값을 두 곳에서 다른 모양으로 말할 이유가 없다. */
function renderScoreChart(scores){
  if(!scores || scores.length===0) return '<div class="empty">등록된 성적이 없습니다.</div>';
  const w=560,h=180,pad=30;
  const pts = scores.map(s=> Math.round((s.score/s.total)*100));
  const n = pts.length;
  const stepX = n>1 ? (w-pad*2)/(n-1) : 0;
  const coords = pts.map((p,i)=>{
    // 점이 1개뿐일 땐 왼쪽 끝에 붙이지 않고 가운데 배치 — 안 그러면 차트 대부분이 텅 비어 보임.
    const x = n>1 ? (pad + stepX*i) : (w/2);
    const y = h-pad - (p/100)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>
    '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="4" fill="#6E2A2F"></circle>'+
    '<text x="'+c[0].toFixed(1)+'" y="'+(c[1]-10).toFixed(1)+'" font-size="11" fill="#3D3335" text-anchor="middle" font-family="JetBrains Mono, monospace">'+pts[i]+'%</text>'
  ).join('');
  const gridLines = [0,25,50,75,100].map(v=>{
    const y = h-pad-(v/100)*(h-pad*2);
    return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#E7DED9" stroke-width="1"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#7D7274" font-family=\'JetBrains Mono, monospace\'>'+v+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:600px;height:auto;">'+gridLines+
    '<path d="'+path+'" fill="none" stroke="#AE4B53" stroke-width="2.5"/>'+dots+'</svg>';
}

/* 제출 사진 확대를 닫는 길은 셋이다 — 겹침 아무 데나 · × · ESC.
   닫는 일이 한 곳에 모여 있어야 셋이 어긋나지 않는다. */
function closeHwPhoto(){
  if(!state.hwPhotoView) return;
  state.hwPhotoView = null;
  render();
}
/* ESC는 «떠 있을 때만» 듣는다. 안 떠 있으면 다른 화면의 ESC를 가로채지 않는다.
   ⚠ **겹친 순서대로 닫는다** — 사진을 크게 본 채로 ESC를 누르면 사진만 닫히고
     오른쪽 상세는 남아야 한다. 둘이 한꺼번에 닫히면 어디까지 보던 중이었는지 잃는다. */
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(state.hwPhotoView){ e.preventDefault(); closeHwPhoto(); return; }
  if(state.pwModal){ e.preventDefault(); closePwChange(); return; }
  if(state.hwCell){ e.preventDefault(); hwCloseCell(); return; }
  /* 2026-08-27 · D-1 — 오른쪽에서 열리는 것은 전부 ESC로 닫힌다.
     ⚠ 둘은 서로 다른 화면에 사니 겹칠 일이 없다. 순서는 형식적인 것이다. */
  if(state.hwNoticeId){ e.preventDefault(); hwCloseNotice(); return; }
  if(state.attOpenDate){ e.preventDefault(); attCloseDate(); return; }
  if(state.sgQView){ e.preventDefault(); sgCloseQ(); return; }
  if(state.hwNewOpen){ e.preventDefault(); hwCloseNew(); return; }
  if(state.chubConsultId){ e.preventDefault(); chubCloseConsult(); return; }
  if(state.stuEditId){ e.preventDefault(); stuEdit(null); }
});

let lastSyncedHash = null;
function syncHistory(){
  const newHash = buildHashFromState();
  if(newHash === lastSyncedHash) return;
  const snap = {view:state.view, teacherTab:state.teacherTab, studentTab:state.studentTab, assistantTab:state.assistantTab};
  if(lastSyncedHash===null) history.replaceState(snap, '', newHash); // 첫 렌더는 기록을 새로 안 쌓고 지금 자리를 교체만
  else history.pushState(snap, '', newHash);
  lastSyncedHash = newHash;
}

function render(){
  const app = document.getElementById('app');

  // 알림 뱃지를 그리는 headerHTML()보다 본문을 먼저 계산해야 뱃지가 한 렌더 늦게 갱신되지 않는다.

  else if(state.view==='login') bodyHtml = loginHTML();
  else if(state.view==='student') bodyHtml = studentHTML();
  else if(state.view==='teacher') bodyHtml = teacherHTML();

  let html = bodyHtml;
  /* 과제 격자의 오른쪽 상세. 화면을 덮으므로 사진 확대와 같은 자리에서 그린다.

  if(state.hwNoticeId && state.view==='teacher'

  /* 반 › 과제의 «등록» 판 (2026-09-01 · C-15). */
  if(state.hwNewOpen && state.view==='teacher' && state.teacherTab==='classhub'
     && state.classHubTab==='homework' && !state.studentDetailId)
    drawers += hwNewDrawerHTML();

    drawers += attDateDrawerHTML();

     ⚠ 만드는 중에는 화면을 떠나면 안 되므로 닫는 문을 그때만 잠근다(드로어 안에서 처리). */

  if(drawers) html += `<div class="app hwd-layer">${drawers}</div>`;
  /* 비밀번호 변경. 학생·조교 어느 화면에서 눌렀든 여기 한 곳에서 그린다. */
  if(state.pwModal) html += pwChangeModalHTML();
  /* 제출 사진 크게 보기. 화면 위에 덮으므로 어느 뷰에서 눌렀든 여기 한 곳에서 그린다 —
     학생앱과 강사 검토 화면이 같은 자리를 쓴다. */
  if(state.hwPhotoView) html += `<div class="hw-view" onclick="closeHwPhoto()">

  if(state.toast) html += `<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B1B1D;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;">${state.toast}</div>`;
  /* 🔴 **오른쪽 판의 스크롤 자리를 지킨다** (2026-09-01).
     드로어 안에서 버튼을 누르면 대개 `render()`가 돈다 — 20명 반의 출결 판에서
     열여덟 번째 학생의 상태를 누르면 판이 맨 위로 튀어 «누구를 누르던 중»인지 잃는다.
     `app.innerHTML`을 갈기 직전 자리를 재고 갈아 끼운 뒤 되돌려 놓는다. */
  const hwdScroll = (app.querySelector('.hwd-b') || {}).scrollTop;
  /* 🔴 **수업 화면도 같다** (2026-09-01 · C-19) — 과제 검사는 학생마다 한 번씩 누르고,
     누를 때마다 render()가 돈다. 스무 번째 학생을 누르면 목록이 맨 위로 튀어
     «어디까지 봤는지»를 잃는다. 손이 빨라야 하는 화면이라 이것이 곧 못 쓰는 화면이 된다. */
  const clsScroll = (app.querySelector('.cls-body') || {}).scrollTop;
  app.innerHTML = html;
  if(hwdScroll){ const nb = app.querySelector('.hwd-b'); if(nb) nb.scrollTop = hwdScroll; }
  if(clsScroll){ const cb = app.querySelector('.cls-body'); if(cb) cb.scrollTop = clsScroll; }
  if(window.renderMathInElement){
    try{
      renderMathInElement(app, {
        delimiters: [{left:'$', right:'$', display:false}],
        throwOnError: false
      });

  if(state.view==='student' && state.studentTab==='video' && state.currentUser){
    mountVideoTrackers(state.currentUser.studentId);

     ⚠ 홈을 그리는 것만으로는 아무것도 «저장»하지 않는다 — 읽기뿐이다. */
  if(state.view==='student' && state.studentTab==='home' && state.currentUser){
    ckEnsureRank(state.currentUser.studentId);

  /* 강사의 「출석 도장」도 같다 — 그 주 순위 문서 하나만 읽는다. 쓰는 길은 없다. */
  if(state.view==='teacher' && state.teacherTab==='checkin'){

  /* 채팅은 «마지막 말»이 있는 곳에서 열려야 한다. 전체 재렌더링이라 매번 위로 되돌아간다. */

  if(state.view==='home') mountLanding();

/* headerHTML() · footerHTML()은 지웠다.

   이제 **모든 화면이 자기 셸을 스스로 갖는다** — 공개 홈은 .l-bar/.l-foot,
   관리자·조교·학생은 .topbar, 로그인은 로고 하나. 덧씌우면 상단바가 두 겹이 됐다.
   notificationBellHTML도 함께 지웠다 — 학생은 bellHTML, 관리자는 상단바가 맡는다. */


/* =================== 공개 홈 — 랜딩 「생각의 흐름」 (2026-08-13 전면 재구성) ===================
   **주인공은 시스템이 아니라 수학강사 김하현이다.**

   전판(「하루」)은 «이 학원이 일하는 하루»를 보여 주는 페이지였다. 태도는 보였지만
   그 태도가 «누구의 것»인지가 흐렸고, 이름은 로고에만 있었다.
   이번 판의 뼈대는 사용자가 직접 말한 **수업의 원칙 셋**이다.

     01 개념 — 개념의 원리를 정확히 이해하며 학습한다
     02 문제 — 풀이법을 주지 않고, 발문에서 스스로 떠올리는 순서를 만들어 준다
     03 반복 — 그 흐름이 몸에 붙을 때까지 따라간다 (교재 · 클리닉 · 오답)

   **오답 · 변형문항 · 데일리퀴즈는 «원칙 03의 도구»로 뒤에 선다** — 전체의 70% 지점에서
   처음 등장한다. 「AI가 이런 기능을 합니다」로 시작하면 이 페이지의 순서가 뒤집힌다.

   ⚠ **사실이 아닌 것을 쓰지 않는다.** 2026-08-13에 전판의 두 문장

/* 등장과 상단바. render()가 문자열을 innerHTML로 넣기 때문에 시안의 <script>는 실행되지 않는다 —
   그 몫을 여기서 한다. 관찰자는 렌더마다 새로 만들므로 «이전 것»을 반드시 끊는다. */
let lpObservers = [];
function mountLanding(){
  lpObservers.forEach(o=>o.disconnect());
  lpObservers = [];
  const root = document.querySelector('.lp');
  if(!root) return;

  const rises = root.querySelectorAll('.l-rise, .l-draw');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 한 번 드러난 뒤에는 다시 흐려지지 않는다. 전체 재렌더링 구조라 토스트 하나에도
     페이지가 통째로 다시 페이드인하면 어지럽다.
     ⚠ IntersectionObserver가 없으면 «전부 보이게» 떨어져야 한다 — .l-rise는 opacity:0이라
     관찰자가 안 붙으면 공개 페이지가 통째로 백지가 된다. 감출 바에 안 움직이는 편이 낫다. */
  if(reduce || state.lpRevealed || !window.IntersectionObserver){
    rises.forEach(el=>el.classList.add('in'));
  } else {
    const spine = root.querySelector('#lp-spine');
    if(spine) spine.classList.add('in');
    /* 히어로는 스크롤을 기다리지 않고 순서대로 들어온다 */
    root.querySelectorAll('.l-hero .l-rise').forEach((el,i)=>
      setTimeout(()=>el.classList.add('in'), 260 + i*170));
    const io = new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(!e.isIntersecting) return;
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, {threshold:.18, rootMargin:'0px 0px -8% 0px'});
    rises.forEach(el=>{ if(!el.closest('.l-hero')) io.observe(el); });
    lpObservers.push(io);
    state.lpRevealed = true;
  }

  const bar = root.querySelector('#lp-bar');
  const hero = root.querySelector('.l-hero');
  if(bar && hero){
    const bio = new IntersectionObserver(es=>{
      bar.classList.toggle('on', !es[0].isIntersecting);
    }, {threshold:0, rootMargin:'-72px 0px 0px 0px'});
    bio.observe(hero);
    lpObservers.push(bio);
  }
}

/* =================== 로그인 (design-v1/17-login) ===================
   **역할: 누구로 들어갈지 고르고 들어간다. 그 이상은 하지 않는다.**

   **문 셋을 동등하게 두지 않았다.** 구버전은 학생·조교·강사를 같은 크기의 탭 셋으로 세웠다.
   그런데 여기 오는 사람은 거의 전부 학생이고, 조교는 계정이 아직 하나도 없고, 강사는 한 명이다.
   → 학생 폼이 곧 화면이고 조교·강사는 아래 작은 글이다. 공개 홈도 이미 같은 비중이다
   (상단바에 「학생 로그인」, 푸터에 「강사 로그인」).

   ⚠ **`<form>`으로 감쌌다.** 구버전은 버튼 onclick뿐이라 **입력칸에서 Enter를 쳐도 아무 일이
   없었다.** 로그인 화면에서 Enter가 안 먹는 것은 그 자체로 결함이다. */
function lgField(o){
  return `<div class="lo-f"><label class="lo-lab" for="${o.id}">${o.label}</label>
    <input class="lo-in" id="${o.id}" type="${o.type||'text'}" placeholder="${o.ph||''}"
      ${o.auto ? `autocomplete="${o.auto}"` : ''} ${o.focus ? 'autofocus' : ''}></div>`;
}

    body = `
      ${needsSetup ? `<div class="note" style="margin-bottom:22px;">

      </div>` : ''}

      ${lgField({id:'login-id', label:'아이디', auto:'username', focus:1,
                 ph: mode==='assistant' ? '강사에게 안내받은 아이디' : '학원에서 안내받은 아이디'})}

      ${mode==='student'
        ? `<div class="lo-doors">
             <a onclick="goLoginMode('assistant')">조교로 로그인</a><s>·</s>

           </div>`
        : `<div class="lo-doors">
             <a onclick="goLoginMode('student')">← 학생 로그인으로</a>

}

/* =================== 학생 마이페이지 (design-v1/20-student-app) ===================
   **탭 11개를 4개로 묶었다. 기능은 하나도 빼지 않았다.**
   예전에는 홈·데일리퀴즈·진도/과제·오답숙제·강의시청·성적·출석·공지사항·질의응답·
   클리닉 신청·채팅 열한 개가 평평하게 나열돼 있었다. 데스크톱에서는 되지만
   하단 탭바에 들어가는 것은 4~5개가 한계고, 열한 개를 가로로 밀게 하면 뒤쪽은 아무도 안 누른다.

   묶는 기준은 «학생이 지금 뭘 하려는가»다.
     홈   — 오늘 뭐 해야 하지
     학습 — 손을 쓰는 화면 (제출·입력·시청)
     기록 — 읽기만 하는 화면
     소통 — 선생님과 닿는 경로

   **탭 id는 예전 이름을 그대로 쓴다.** state.studentTab이 여전히 «화면 하나»를 가리키고,
   그것이 어느 탭에 속하는지는 STUDENT_TAB_SECTION이 되찾아 준다 (관리자 셸과 같은 장치다).
   그래서 #student/quiz 해시 · goStudentPage('clinic') · 알림 드롭다운의 gotoCode가
   전부 손대지 않고 그대로 동작한다.

   **모바일이 기준이다.** 데일리퀴즈 제출·오답 답 입력·강의 시청·클리닉 신청은
   전부 학생이 집이나 이동 중에 폰으로 하는 일이다. 데스크톱에서 열면 한 칸이 가운데로 모인다. */

/* 한 화면이 쓰는 것을 한 곳에서 고른다. 열한 개가 저마다 같은 filter를 되풀이하고 있었다. */
function stuCtx(){
  const sid = state.currentUser.studentId;
  const rec = DATA.records[sid] || emptyRecord();
  const me = DATA.students.find(s=>s.studentId===sid) || {};
  const classId = me.classId;                    // 주 반. 「내 반」을 한 줄로 말하는 자리가 쓴다
  const myClassIds = studentClassIds(me);        // 듣는 반 전부 (2026-09-01 · E-1)
  /* 오늘의 데일리퀴즈는 «학생이 앱을 연 순간» 한 번 정해진다. 여기서 보장해 두면
     홈의 할 일 줄·서브내비 숫자·퀴즈 화면이 전부 같은 세 문제를 본다.
     (교사 화면은 이걸 부르지 않는다 — 남의 기록을 렌더 중에 저장하게 된다.) */
  dqEnsureToday(sid, rec);
  return {
    sid, rec, me, classId,
    /* quizzes는 없앴다 — 데일리퀴즈가 반 배포물이 아니라 이 학생의 오답에서 뽑히므로
       stuCtx가 미리 걸러 줄 것이 없다. 카드는 dqTodayCards(rec)가 만든다. */
    /* 듣는 반 전부에서 온다 — 특강 과제·영상·시험도 이 학생의 것이다 (2026-09-01 · E-1).
       ⚠ `classId`(주 반)는 그대로 둔다 — 「내 반」을 한 줄로 말하는 자리가 아직 여럿이다. */
    classIds: myClassIds,
    homework: DATA.assignments.filter(a=>!a.classId || myClassIds.includes(a.classId)),
    videos:   DATA.videos.filter(v=>v.studentId ? v.studentId===sid : (!v.classId || myClassIds.includes(v.classId))),
    exams:    DATA.exams.filter(e=>myClassIds.includes(e.classId)),
    qnas:     DATA.qnas.filter(q=>q.studentId===sid),
    clinics:  DATA.clinics.filter(c=>c.studentId===sid)
  };
}

/* 출석률 = 「퇴원」을 뺀 기록 중 「결석」이 아닌 비율. 지각·조퇴는 «온 것»으로 센다.
   명단(rosterStats)이 쓰는 정의와 같은 것이다 — 두 화면이 다른 숫자를 말하면 둘 다 못 믿게 된다.
   (rosterStats는 state.allRecords를 보는데 그건 교사만 싣는다. 규칙만 같이 쓴다.) */
function stuAttRate(rec, me){
  /* 🔴 강사 화면(rosterStats)과 **같은 줄을 센다** — 주 반 것만 (2026-09-01 · E-1).
     여기서만 특강을 함께 세면 학생이 보는 출석률과 선생님이 보는 출석률이 달라진다. */
  return attRateOf(attCountedOf(rec, me));
}
/* 시청률 = 대상 영상들의 진도율 평균. studentVideoSummary(교사 화면)와 같은 식이다. */
function stuVideoAvg(c){
  if(c.videos.length===0) return null;
  const sum = c.videos.reduce((n,v)=> n + ((c.rec.videoProgress[v.id]||{}).percent || 0), 0);
  return Math.round(sum / c.videos.length);
}
function stuDday(due){
  if(!due) return null;
  const t = todayStr();
  if(due < t)  return {label:'지남', tone:'no'};
  if(due === t) return {label:'오늘', tone:'no'};
  const days = Math.round((Date.parse(due+'T00:00:00Z') - Date.parse(t+'T00:00:00Z')) / 86400000);
  return {label:'D-'+days, tone: days<=3 ? 'no' : days<=7 ? 'late' : ''};
}
/* ⚠ 이 결과를 .mono 안에 넣지 말 것. JetBrains Mono에는 한글 글리프가 없어서
   브라우저가 «고정폭 한글 글꼴»로 떨어뜨린다 — 「오늘」이 「오 늘」처럼 벌어진다.
   자유 텍스트 시간(「7시~9시」·「저녁 7시」)도 같다. mono는 YYYY-MM-DD·숫자·퍼센트에만 쓴다. */
function stuDateLabel(ymd){
  if(!ymd) return '';
  const t = todayStr();
  if(ymd===t) return '오늘';
  if(ymd===shiftYmd(t,1)) return '내일';
  const [y,m,d] = ymd.split('-').map(Number);
  return `${m}월 ${d}일 (${WEEKDAY_LABEL[new Date(ymd+'T00:00:00').getDay()]})`;
}
/* 다음 수업 — 반 일정에서 오늘 이후 첫 수업일. 시각은 자유 텍스트라 그대로 보여 준다. */
function stuNextSession(classId){
  const cls = DATA.classes.find(x=>x.id===classId);
  if(!cls) return null;
  const days = parseScheduleDays(cls.schedule);
  if(days.length===0) return null;
  const d = new Date();
  for(let i=0; i<14; i++){
    if(days.includes(d.getDay())) return {date: ymdLocal(d), cls};
    d.setDate(d.getDate()+1);
  }
  return null;
}

/* «오늘 뭐 해야 하지»에 답하는 한 줄들. 네 종류가 한 목록에 섞인다 —
   학생에게 «퀴즈 탭에 하나, 과제 탭에 둘»은 의미 없는 구분이다. */
function stuTodo(c){
  const items = [];
  /* 데일리퀴즈는 한 줄로 묶는다 — 세 문제가 각각 한 줄을 차지하면 오늘 할 일 목록이 퀴즈로 덮인다. */
  const dqLeft = dqTodayCards(c.rec).filter(x=>!dqDoneToday(c.rec, x.id));
  if(dqLeft.length) items.push({
    icon:'sparkle', bg:'var(--latebg)', fg:'var(--late)',
    title:`데일리퀴즈 ${dqLeft.length}문제`, sub:'틀렸던 문제 다시 풀기',
    tab:'quiz', pre:`state.stuQuizId='${dqLeft[0].id}';`
  });
  wrongHomeworkLeft(c.rec).forEach(h=>{
    const exam = DATA.exams.find(e=>e.id===h.examId);
    items.push({
      icon:'clipboard', bg:'var(--nobg)', fg:'var(--no)',
      title:`오답숙제 ${h.questionNo}번`, sub:(exam ? exam.title : '시험지') + ' 쌍둥이 문제',
      tab:'wronghw'
    });
  });
  /* ⚠ «낸 것»은 할 일이 아니다 — 학생은 기다리는 중이고 공은 강사에게 넘어가 있다.
     안 냈거나(none) 반려된 것(rejected)만 남긴다. */
  c.homework.filter(a=>hwNeedsAction(c.rec, a.id)).forEach(a=>items.push({
    icon:'document', bg:'var(--bluebg)', fg:'var(--blue)',
    title:a.title,
    sub:(hwState(c.rec, a.id).status===HW_REJECTED ? '과제 · 다시 해야 해요' : '과제')
        + (a.dueDate ? ' · '+a.dueDate+'까지' : ''),
    due:a.dueDate || '', dday:stuDday(a.dueDate), tab:'progress'
  }));
  c.videos.filter(v=>!((c.rec.videoProgress[v.id]||{}).completed)).forEach(v=>{
    const p = c.rec.videoProgress[v.id];
    items.push({
      icon:'video', bg:'var(--accent-bg)', fg:'var(--accent)',
      title:v.title, sub:'강의' + (p ? ` · ${p.percent}%까지 봄` : ' · 아직 안 봄'),
      tab:'video', pre:`state.stuVideoId='${v.id}';`
    });
  });
  /* 마감이 가까운 것이 위로 온다. 마감이 없는 것(퀴즈·오답·영상)은 그 아래에 원래 순서대로. */
  return items.sort((a,b)=>{
    if(a.due && b.due) return a.due.localeCompare(b.due);
    return (a.due ? 0 : 1) - (b.due ? 0 : 1);
  });
}

/* =================== 출석 도장 ===================
   학생 홈에 놓는 «하루 한 판»짜리 장치. 시안은 design-v1/21-checkin.html 이다.

   ⚠ **이것은 출결이 아니다.** 강사가 「수업 > 출결」에 넣는 `rec.attendance` 는 그대로 두고,
     이 도장은 `rec.checkin` 이라는 **다른 줄**에 쌓인다. 출석률에 한 숫자도 섞이지 않는다.
   ⚠ **화면을 그리는 것만으로는 아무것도 저장하지 않는다.** 이 앱은 학생 화면을 그리기만 해도
     저장하는 길이 하나 있는데(dqEnsureToday), 도장은 **그 길을 따라가지 않는다.**
     학생이 실제로 한 판을 끝낸 순간에만 쓴다. 「연 것」과 「찍은 것」이 같아지면
     도장이 아무 뜻도 못 갖는다.
   ⚠ **연속은 수업 없는 날도 센다.** 학원 출결이 아니라 「앱을 연 날」이라
     주말에 끊기면 아무도 안 하게 된다.
   =================================================== */

/* checkin 없는 옛 기록을 제자리에서 채운다 (dqState 와 같은 어법) */
function ckState(rec){
  if(!rec.checkin) rec.checkin = {last:'', streak:0, best:0, bestScore:0, bests:{}, days:{}};
  const c = rec.checkin;
  if(!c.days) c.days = {};
  if(typeof c.streak !== 'number') c.streak = 0;
  if(typeof c.best !== 'number') c.best = 0;
  if(typeof c.bestScore !== 'number') c.bestScore = 0;
  if(!c.bests || typeof c.bests !== 'object') c.bests = {};
  return c;
}
function ckDoneToday(rec){ return ckState(rec).last === todayStr(); }
/* 🔴 **«역대 최고»는 게임마다 따로다** (2026-09-01 · S-D-2).
   달리기 봇이 1840점, 똥피하기 봇이 350점대다 — **잣대가 다섯 배 다르다.**
   한 칸에 담으면 달리기 주에 찍은 수를 **똥피하기 주에는 영원히 못 깬다.**
   그러면 「최고 기록입니다」가 한쪽 게임에서만 나오고, 나머지 주는 매번 «졌다»가 된다.
   ⚠ E-4에서 만난 것과 같은 꼴이다 — **한 값이 두 물음에 답하려 하면 한쪽이 거짓이 된다.**
   ⚠ 옛 기록(`bestScore`)은 똥피하기 것이다. 그때는 그것뿐이었다. */
function ckBestOf(rec, key){
  const c = ckState(rec);
  if(typeof c.bests[key] === 'number') return c.bests[key];
  return key === 'dodge' ? (c.bestScore || 0) : 0;
}
function ckSetBest(rec, key, score){
  const c = ckState(rec);
  if(score <= ckBestOf(rec, key)) return false;
  c.bests[key] = score;
  /* 옛 칸도 함께 둔다 — 다른 화면이 아직 그것을 볼 수 있다 */
  if(key === 'dodge') c.bestScore = score;
  return true;
}

/* 그 주 «월요일». ⚠ 로컬 기준이다 — UTC로 세면 한국 새벽에 하루가 어긋난다 */
function weekStartOf(ymd){
  const d = new Date(ymd + 'T00:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // 일=0 이므로 월=0 으로 옮긴다
  return ymdLocal(d);
}
/* ---------- 이번 주의 게임 (2026-09-01 · S-D) ----------
   사용자가 정했다 — 「**일주일씩 로테이션으로 게임이 바뀐다**」.
   🔵 **이것이 순위 문제를 통째로 없앤다.** 순위는 원래 «주 단위»(`rank:{월요일}`)라,
     한 주에 게임이 하나면 **그 주의 순위는 같은 잣대끼리만 겨룬다.**
     고르게 했으면 «점수 잘 나오는 쪽»으로 몰려 순위가 «누가 쉬운 걸 찾았나»가 됐을 것이다.
   ⚠ 도장·연속·하루 한 판은 **그대로 하나다** — 게임이 바뀌어도 출석의 뜻은 안 바뀐다. */
const GAMES = [
  { key:'runner', name:'달리기',   icon:'🏃',
    tip:'← → 옮기기 · ↑ 뛰기 · ↓ 미끄러지기',
    tip2:'폰에서는 옆으로 · 위로 · 아래로 쓸어 넘기세요' },
  { key:'dodge',  name:'똥피하기', icon:'💩',
    tip:'손가락을 끌어 좌우로 피하세요',   tip2:'⭐ 를 먹으면 50점' }
];
/* 주차를 세는 기준. ⚠ 이 날짜를 옮기면 «이번 주 게임»이 통째로 바뀐다 — 주 중에 옮기면
   그 주에 이미 올라간 점수가 다른 게임 것이 되어 순위에서 빠진다. 월요일에만 옮길 것. */
const GAME_EPOCH = '2026-08-31';
function gameOfWeek(monday){
  const a = new Date(GAME_EPOCH + 'T00:00:00'), b = new Date((monday||GAME_EPOCH) + 'T00:00:00');
  const wk = Math.round((b - a) / 604800000);
  return GAMES[((wk % GAMES.length) + GAMES.length) % GAMES.length];
}
function gameThisWeek(){ return gameOfWeek(weekStartOf(todayStr())); }
function gameByKey(k){ return GAMES.find(g => g.key === k) || GAMES[0]; }

function weekLabelOf(monday){
  const a = new Date(monday + 'T00:00:00');
  const b = new Date(monday + 'T00:00:00'); b.setDate(b.getDate() + 6);
  return (a.getMonth()+1) + '/' + a.getDate() + ' ~ ' + (b.getMonth()+1) + '/' + b.getDate();
}

/* ---------- 이번 주 순위 ----------
   ⚠ **학생 기록(record:학번)에는 성적·출결이 다 들어 있다.** 순위를 그리자고 남의 기록을
     읽으면 안 된다. **이름·반·점수만** 든 별도 문서를 따로 둔다.
   ⚠ **열쇠에 주(週)가 들어 있어 «리셋»이라는 동작이 없다.** 월요일이 되면 열쇠가 바뀌고
     새 문서는 그냥 비어 있다. 지우는 작업이 없으니 실패할 일도 없고,
     지난 주 것이 남아 「지난 주 1등」을 보여줄 수 있다.
   ⚠ **조작을 막지 못한다** — 브라우저가 Firestore 를 직접 부르는 구조라 콘솔 한 줄로
     1등이 된다. 감수하는 근거는 둘뿐이다: **보상이 없고 · 하루 한 판이다.**
     🔴 **상품이나 성적 가산점을 거는 순간 워커 검증이 먼저여야 한다.** */
const RANK_TOP = 5;
const rankCache = {};            // 주(월요일) → 배열

async function loadRank(monday){
  if(!rankCache[monday]) rankCache[monday] = await dbGet('rank:'+monday, []);
  return rankCache[monday];
}
/* ⚠ **읽고 → 내 줄만 고치고 → 쓴다.** 들고 있던 배열로 통째로 덮으면
   그 사이에 올라온 «남의 점수»가 사라진다. */
async function rankSubmit(sid, name, cls, score){
  const monday = weekStartOf(todayStr());
  const game = gameOfWeek(monday).key;
  const rows = await dbGet('rank:'+monday, []);
  /* 🔴 **어느 게임의 점수인지 적어 둔다.** 게임은 주마다 바뀌므로 한 주 안에서는 섞일 일이
     없지만, **기준 주(GAME_EPOCH)를 옮기면** 옛 점수가 다른 게임 것이 된다.
     ⚠ 게임이 안 적힌 옛 줄은 「똥피하기」로 읽는다 — 그때는 그것뿐이었다. */
  const mine = rows.find(r => r.sid === sid);
  if(mine){ if(score > mine.score){ mine.score = score; mine.at = todayStr(); mine.name = name; mine.cls = cls; mine.game = game; } }
  else rows.push({sid, name, cls, score, at: todayStr(), game});
  rows.sort((a,b) => b.score - a.score);
  rankCache[monday] = rows;
  await dbSet('rank:'+monday, rows);
  return rows;
}

function rankHTML(sid, rows, lastRows, monday){
  /* 🔵 **그 주의 게임 점수만 센다** (2026-09-01 · S-D). 게임이 주마다 바뀌므로
     한 주의 순위는 언제나 «같은 잣대끼리»다. 게임이 안 적힌 옛 줄은 똥피하기로 본다. */
  const gw = gameOfWeek(monday), gl = gameOfWeek(weekStartOf(shiftYmd(monday, -7)));
  const only = (list, g) => (list||[]).filter(r => (r.game || 'dodge') === g.key);
  rows = only(rows, gw); lastRows = only(lastRows, gl);
  const top = rows.slice(0, RANK_TOP);
  const mine = rows.find(r => r.sid === sid);
  const inTop = top.some(r => r.sid === sid);
  const last = lastRows[0];

  const list = top.map((r, n) => `
    <div class="gm-rk${n===0?' top':''}${r.sid===sid?' me':''}">
      <span class="n">${n+1}</span>
      <span class="nm">${escHtml(r.name||'')}${r.cls?`<i>${escHtml(r.cls)}</i>`:''}${
        r.sid===sid?'<em>나</em>':''}</span>
      <span class="sc">${(r.score||0).toLocaleString()}</span>
    </div>`).join('');

  /* ⚠ 5위 밖이어도 «몇 등»인지는 말하지 않는다. 매일 열 때마다 자기 이름이 아래쪽에 있는 것을
     보면 그만두게 된다. 대신 «내 점수»는 보여 준다 — 겨룰 대상이 남이 아니라 어제의 자기여도 된다.
     ⚠ 전체를 한 판에 세우면 5위가 멀어서, 실제로 대부분의 학생이 매일 보는 것은 이 줄이다. */
  const yet = inTop ? '' : `<div class="yet">${mine
    ? `이번 주 내 최고 <b>${(mine.score||0).toLocaleString()}점</b> — ${RANK_TOP}위 안에 들면 여기 이름이 올라갑니다`
    : '한 판 하면 이번 주 기록이 시작됩니다'}</div>`;

  return `<div class="gm-rank">
    <div class="hd"><b>이번 주 순위</b><s>${gw.icon} ${escHtml(gw.name)}<i style="font-style:normal;"> · </i>${weekLabelOf(monday)}</s></div>
    ${list}
    ${yet}
    <div class="yet">전체 ${rows.length}명 · <b>월요일에 게임이 바뀝니다</b>${
      last ? `<br>지난 주(${escHtml(gl.name)}) 1등 <b>${escHtml(last.name||'')}</b>${
        last.cls?` (${escHtml(last.cls)})`:''} ${(last.score||0).toLocaleString()}점` : ''}</div>
  </div>`;
}

/* ---------- 홈에 놓는 카드 ---------- */
const DOW_CK = ['일','월','화','수','목','금','토'];
function ckCardHTML(c){
  const ck = ckState(c.rec);
  const today = todayStr();
  const monday = weekStartOf(today);
  const done = ckDoneToday(c.rec);

  /* 일곱 칸 — 이번 주 월요일부터 일요일까지 */
  let cells = '';
  for(let i=0; i<7; i++){
    const d = new Date(monday + 'T00:00:00'); d.setDate(d.getDate() + i);
    const ymd = ymdLocal(d);
    const on = !!ck.days[ymd];
    const dow = d.getDay();
    cells += `<div class="gm-day${on?' on':''}${ymd===today?' today':''}">${
      on ? `<img class="stmp" src="stamp.webp" alt="도장">` : ''
    }<span class="lb">${DOW_CK[dow]}</span></div>`;
  }

  const todayScore = (ck.days[today] && ck.days[today].score) || 0;
  const run = done
    ? `<div class="gm-run off">
        <span class="ic"><img src="stamp.webp" alt=""></span>
        <span class="t"><b>오늘 도장을 찍었습니다 — ${todayScore.toLocaleString()}점</b>
        <span>내일 다시 열립니다 · ${escHtml(gameThisWeek().name)} 최고 ${
          ckBestOf(c.rec, gameThisWeek().key).toLocaleString()}점</span></span></div>`
    : `<div class="gm-run" onclick="openGame()">
        <span class="ic">${gameThisWeek().icon}</span>
        <span class="t"><b>이번 주 게임 — ${escHtml(gameThisWeek().name)}</b>
        <span>하루 한 판입니다 · ${escHtml(gameThisWeek().name)} 최고 ${
          ckBestOf(c.rec, gameThisWeek().key).toLocaleString()}점</span></span>
        <span class="go">${iconSvg('chevR',16)}</span></div>`;

  return `
  <div class="msec" style="margin-top:22px;">출석 도장</div>
  <div class="mc">
    <div class="gm-head">
      <span class="st">${ck.streak||0}<em>일째</em></span>
      <span class="best">최고 <b>${ck.best||0}</b>일</span>
    </div>
    <div class="gm-weekwrap"><div class="gm-week">${cells}</div></div>
    ${run}
    <div id="ck-rank">${rankHTML(c.sid, rankCache[monday], rankCache[weekStartOf(shiftYmd(monday,-7))], monday)}</div>
    <div style="font-size:11px;color:var(--dim);margin-top:11px;line-height:1.7;">
      학원 출결과는 별개입니다. 앱을 연 날에만 찍힙니다.</div>
  </div>`;
}

/* 순위는 «읽어 온 뒤»에 그린다. 홈을 그릴 때 없으면 비어 보이므로,
   받아 오면 그 자리만 갈아 끼운다 (화면 전체를 다시 그리지 않는다). */
async function ckEnsureRank(sid){
  const monday = weekStartOf(todayStr());
  const prev = weekStartOf(shiftYmd(monday, -7));
  if(rankCache[monday] && rankCache[prev]) return;
  await Promise.all([loadRank(monday), loadRank(prev)]);
  const box = document.getElementById('ck-rank');
  if(box) box.innerHTML = rankHTML(sid, rankCache[monday], rankCache[prev], monday);
}

/* ---------- 강사가 보는 순위 (2026-08-24) ----------
   ⚠ **여기 오는 것은 «순위»뿐이다 — 도장 현황(누가 며칠 연속 찍었나)은 안 붙인다.**
     연속 일수를 반 명단으로 세우는 순간 「안 찍은 애」가 지표가 되고, 그때부터 도장은
     놀이가 아니라 평가다 (2026-08-21 결정). 순위 문서에는 «한 판이라도 한 학생»만 있고
     들어 있는 것도 이름·반·점수뿐이라 그 선을 안 넘는다.
     **`record:학번` 은 이 화면에서 안 읽는다** — 거기엔 성적·출결이 다 들어 있다.
   ⚠ **학생 화면과 달리 전원을 보여 준다 — 2026-08-24에 사용자가 그렇게 정했다.**
     학생 쪽 5위 제한의 이유는 «매일 열 때마다 자기가 아래에 있는 것을 보면 그만둔다»였다.
     강사는 매일 자기 이름을 찾는 사람이 아니라 한 번 훑는 사람이라 그 이유가 안 걸린다.
     ⚠ 대신 **명단에 없는 학생 = 이번 주에 안 한 학생**이 된다. 위에서 피한 자리와 결국
     같은 곳이다 — 사용자가 알고 고른 것이다. 「안 한 학생」 목록을 «따로» 세우지는 말 것.
   ⚠ **읽기만 한다.** 이 화면에서 rankSubmit 으로 가는 길은 없다. */
function ckTeacherWeek(){ return state.ckWeek || weekStartOf(todayStr()); }

function ckWeekShift(delta){
  const next = weekStartOf(shiftYmd(ckTeacherWeek(), delta * 7));
  if(next > weekStartOf(todayStr())) return;      // 다음 주는 아직 오지 않았다
  state.ckWeek = next;
  render();
}

/* 그 주 문서 하나만 읽는다. 받아 오면 한 번 더 그린다 —
   두 번째로 들어올 때는 rankCache 가 차 있어 그냥 돌아 나가므로 되돌이가 안 생긴다.
   ⚠ 없는 문서도 dbGet 이 `[]` 를 캐시에 넣는다(404는 «정상»이다). 그래서 빈 주에도 안 맴돈다. */
const rankLoading = new Set();
async function ckEnsureTeacherRank(){
  const monday = ckTeacherWeek();
  if(rankCache[monday] || rankLoading.has(monday)) return;
  rankLoading.add(monday);
  try{ await loadRank(monday); }
  finally{ rankLoading.delete(monday); }
  if(state.view==='teacher' && state.teacherTab==='checkin' && ckTeacherWeek()===monday) render();
}

           혼자 반대쪽 끝으로 날아가므로 눌러 준다 — 제목 바로 아래에 붙어야 읽힌다. */''}
      ${/* ⚠ 여기서 <b>를 쓰면 안 된다 — .rst-cnt b 는 JetBrains Mono 라 한글이
           «이 번  주»처럼 벌어진다. 그 규칙은 숫자를 위한 것이다. */''}
      <span class="rst-cnt" style="margin-left:0;">${monday===thisWk

            escHtml(top.name||'')}</span> <b>${(top.score||0).toLocaleString()}</b>점`}</span>
    </div>

  const body = waiting
    ? '<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">불러오는 중…</div>'
    : list.length===0
    ? `<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.9;">
        이 주에는 아직 기록이 없습니다.<br>학생이 홈에서 한 판 끝내면 여기 이름이 올라옵니다.</div>`
    : `<div class="rst-wrap" style="max-height:none;flex:none;">
      ${/* ⚠ .app .rst-wrap 은 flex:1 이라 줄이 적어도 화면 끝까지 늘어난다. 그러면 아래 주의문이
           표에서 한참 떨어진 화면 바닥에 가서 붙어 안 읽힌다 → flex:none 으로 표 크기만큼만 쓴다.
         ⚠ table.grid 는 width:100% 라 열 다섯 개가 1500px 로 벌어진다. 이름과 점수가 화면
           양 끝으로 갈라져 눈이 따라가지 못하므로 max-width 로 묶는다.
         ⚠ min-width(1464px)는 명단의 것이다 — 인라인 style 이 시트 규칙을 이긴다. */''}
      <table class="grid" style="min-width:620px;max-width:820px;">
        <thead><tr>
          <th class="r" style="width:58px;">등수</th>
          <th style="width:150px;">이름</th>
          <th style="width:170px;">반</th>
          <th class="r" style="width:100px;">점수</th>
          <th style="width:120px;">마지막 기록</th>
        </tr></thead>
        <tbody>${list.map((r, i) => `<tr>
          <td class="r mono"${i===0?' style="font-weight:700;"':''}>${i+1}</td>
          <td class="nm">${escHtml(r.name||'')}</td>
          <td>${escHtml(r.cls||'')}</td>
          <td class="r mono"${i===0?' style="font-weight:700;"':''}>${(r.score||0).toLocaleString()}</td>

/* ---------- 열기 · 닫기 ---------- */
/* 🔴 **이번 주의 게임을 연다.** 어느 갈래인지는 «주»가 정한다 — 학생이 고르지 않는다.
   고르게 하면 점수 잘 나오는 쪽으로 몰려 그 주 순위가 «누가 쉬운 걸 찾았나»가 된다. */
function openGame(){
  const sid = state.currentUser && state.currentUser.studentId;
  if(!sid) return;
  const rec = DATA.records[sid];
  /* ⚠ 하루 한 판. «끝난» 판이 있어야 소모된다 —
     열었다가 시작도 안 하고 닫은 것은 소모가 아니다 (그러면 잘못 눌러 하루를 잃는다) */
  if(!rec || ckDoneToday(rec)) return;

  const host = document.getElementById('gamehost');
  if(!host || host.querySelector('.gm-over')) return;
  const ck = ckState(rec);
  const gw = gameThisWeek();
  const ov = document.createElement('div');
  ov.className = 'gm-over';
  ov.innerHTML = `<div class="gm-shell">
    <div class="gm-bar">
      <button type="button" class="gm-x" aria-label="닫기" onclick="closeGame()">✕</button>
      <span class="sc" id="gm-score">0</span>
      <span class="bs" style="margin-left:auto;">${gw.icon} ${escHtml(gw.name)}</span>
      <span class="bs" id="gm-best">최고 ${ckBestOf(rec, gw.key).toLocaleString()}</span>
    </div>
    <div class="gm-stage" id="gm-stage"><canvas id="gm-canvas"></canvas></div>
  </div>`;
  host.appendChild(ov);
  Game.mount(ov.querySelector('#gm-canvas'), {
    mode: gw.key === 'runner' ? MODE_RUNNER : MODE_DODGE,
    tips: [gw.tip, gw.tip2],
    onScore(s){ const e = document.getElementById('gm-score'); if(e) e.textContent = s; },
    onEnd: finishGame
  });
}

function closeGame(){
  Game.stop();
  const host = document.getElementById('gamehost');
  const ov = host && host.querySelector('.gm-over');
  if(ov) ov.remove();
  render();
}

/* ⚠ **저장은 여기 한 곳이다** — 판이 끝날 때 한 번.
   기록은 «읽어 온 그 객체»를 제자리에서 고친다 (saveRecord 가 객체 동일성을 본다). */
async function finishGame(score){
  const sid = state.currentUser && state.currentUser.studentId;
  if(!sid) return;
  const rec = DATA.records[sid];
  if(!rec) return;
  const ck = ckState(rec);
  const today = todayStr();

  const first = ck.last !== today;
  if(first){
    /* 연속 — 어제 찍었으면 잇고, 아니면 1부터 */
    ck.streak = (ck.last === shiftYmd(today, -1)) ? (ck.streak || 0) + 1 : 1;
    if(ck.streak > (ck.best||0)) ck.best = ck.streak;
    ck.last = today;
  }
  const dayRec = ck.days[today] || (ck.days[today] = {score:0, n:0});
  dayRec.n = (dayRec.n||0) + 1;
  if(score > (dayRec.score||0)) dayRec.score = score;
  const gw = gameThisWeek();
  const newBest = ckSetBest(rec, gw.key, score);
  await saveRecord(sid);
  /* 상단바의 「최고」도 같이 고친다 — 안 고치면 새 기록을 낸 화면에서 옛 최고가 그대로 떠 있다 */
  const bestEl = document.getElementById('gm-best');
  if(bestEl) bestEl.textContent = '최고 ' + ckBestOf(rec, gw.key).toLocaleString();

  /* 순위 — 이름과 반만 올린다. 성적·출결은 넘기지 않는다 */
  const me = DATA.students.find(s => s.studentId === sid) || {};
  let rows = null;
  try{ rows = await rankSubmit(sid, me.name || state.currentUser.name || '', classNameOf(me.classId) || '', score); }
  catch(e){ console.error('순위 저장 실패', e); }

  const stage = document.getElementById('gm-stage');
  if(!stage) return;
  const monday = weekStartOf(today);
  const res = document.createElement('div');
  res.className = 'gm-res';
  res.innerHTML = `<div class="in">
    <div class="big">${score.toLocaleString()}</div>
    <div class="sub2">${newBest ? '최고 기록입니다'
      : escHtml(gw.name) + ' 최고 ' + ckBestOf(rec, gw.key).toLocaleString() + '점'}</div>
    <div class="stamp"><img src="stamp.webp" alt="참! 잘했어요 도장">
      <span class="day">오늘 도장을 찍었습니다 · ${ck.streak}일째</span></div>
    ${rankHTML(sid, rows || rankCache[monday], rankCache[weekStartOf(shiftYmd(monday,-7))], monday)}
    <div class="one">하루 한 판입니다. 내일 다시 열립니다</div>
    <div class="btns"><button type="button" onclick="closeGame()">닫기</button></div>
  </div>`;
  stage.appendChild(res);
}

   예전 홈에는 질문 폼·반 진도 링·빠른 변형 문제 요청·영상 카드가 함께 있었다.
   전부 제 화면이 따로 있는 것들이라 그리로 보냈다. 남은 것은 «할 일»과 그 주변뿐이다. */

  ${/* 시험 — 날짜가 있을 때만 뜬다. 「끝남」은 안 그린다. 지난 시험을 학생 홈에 남겨 두면
