/* ---------- 데일리퀴즈 ---------- */
/* 시안은 «10문항 중 3번»을 한 문제씩 푸는 화면이었다. 이제 실제로 그 구조다 —
   하루 세 문제가 학생 자기 오답에서 뽑혀 나오고, 지금 푸는 것 하나가 크게 선다.
   문제 위에 «원본 12번» / «변형 12번»을 붙이는 것이 이 화면의 핵심이다 —
   내가 뭘 틀려서 이걸 다시 푸는지 모르면 그냥 새 숙제가 된다 (오답숙제와 같은 판단). */
function stuQuizHTML(c){
  const cards = dqTodayCards(c.rec);
  const range = studentRange(c.sid);
  const all = dqPool(c.rec);
  const pool = all.filter(x=>dqInRange(x, range));   // 지금 시험 범위 안의 것만
  /* 지금 무엇을 준비하는 중인지 학생도 알아야 «왜 이 문제만 나오나»가 납득된다. */
  const banner = range ? `<div class="sap-range">${escHtml(currentSeason())}
    <s>·</s>${escHtml(subjectOfStudent(c.sid))} ${range.size}단원</div>` : '';

  if(pool.length===0){
    const left = wrongHomeworkLeft(c.rec).length;
    /* 셋을 가른다 — 할 일이 저마다 다르다. 「범위 밖」을 «없다»고만 하면
       학생은 다 푼 줄 알지만 실제로는 시험이 끝나서 접힌 것이다. */
    const outOfRange = all.length - pool.length;
    return banner + `<div class="sap-empty">${
      outOfRange ? `지금 시험 범위에 해당하는 문제가 없습니다.<br>
        <span style="font-size:11.5px;">범위 밖으로 접어 둔 문제 ${outOfRange}개는 방학에 다시 나옵니다.</span>`
      : left ? `아직 풀 문제가 없습니다.<br>오답숙제를 <b>${left}개</b> 끝내면 그 문제가 여기로 돌아옵니다.`
      : `아직 풀 문제가 없습니다.<br>시험에서 틀린 번호를 등록하고 오답숙제를 끝내면 그 문제가 여기로 돌아옵니다.`}
      ${outOfRange ? '' : `<div style="margin-top:14px;"><button class="mbtn" style="max-width:220px;margin:0 auto;"
        onclick="state.studentTab='wronghw'; ${left?'':'state.stuWrongMode=true; '}render()"
        >${left ? '오답숙제 풀러 가기' : '틀린 문제 등록하러 가기'}</button></div>`}
    </div>`;
  }
  if(cards.length===0){
    /* 풀은 있는데 오늘 차례가 없다 — 전부 복습 날짜가 아직 안 됐거나 다 익혔다. */
    const nexts = pool.map(x=>(dqState(c.rec).cards[x.id]||{}).due).filter(Boolean).sort();
    const retired = pool.filter(x=>{ const st = dqState(c.rec).cards[x.id]; return st && !st.due; }).length;
    return banner + `<div class="sap-empty">오늘 풀 문제가 없습니다.
      ${nexts.length ? `<br>다음 복습은 <b class="mono">${escHtml(nexts[0])}</b>입니다.` : ''}
      ${retired ? `<br><span style="font-size:11.5px;">다 익힌 문제 ${retired}개는 이제 나오지 않습니다.</span>` : ''}
    </div>`;
  }

  const doneCount = cards.filter(x=>dqDoneToday(c.rec, x.id)).length;
  const undone = cards.filter(x=>!dqDoneToday(c.rec, x.id));
  const cur = cards.find(x=>x.id===state.stuQuizId) || undone[0] || cards[0];
  const curDone = dqDoneToday(c.rec, cur.id);
  const st = dqState(c.rec).cards[cur.id];
  const exam = DATA.exams.find(e=>e.id===cur.examId);
  const idx = cards.findIndex(x=>x.id===cur.id);

  /* 어느 그림을 붙일지는 카드가 이미 알고 있다 (dqPool의 imgKind — 오답숙제와 같은 규칙이다). */
  const imgHTML = cur.imgKind ? pbImageHTML(cur.bankId, cur.imgKind, 'sap-img') : '';

  const kindBadge = k => k==='orig'
    ? `<span class="badge no">원본</span>`
    : `<span class="badge score">변형</span>`;

  return banner + `
  <div class="sap-prog" style="margin:0 0 16px;">
    <span class="bar"><i style="width:${Math.round(doneCount/cards.length*100)}%"></i></span>
    <b>${doneCount}/${cards.length}</b>
  </div>

  <div class="mc ${curDone ? '' : 'go'}">
    <div class="row" style="gap:7px;">
      ${kindBadge(cur.kind)}
      <span class="badge">${cur.no}번</span>
      ${curDone ? `<span class="badge ${curDone.correct?'ok':'no'}">${curDone.correct?'정답':'오답'}</span>` : ''}
      <span class="spacer"></span>
      <span class="mono" style="font-size:10.5px;color:var(--dim);">${idx+1} / ${cards.length}</span>
    </div>
    <div style="font-size:11.5px;color:var(--dim);margin-top:9px;">
      ${exam ? escHtml(exam.title) : '(삭제된 시험지)'} ${cur.no}번
      ${cur.kind==='orig' ? '· 그때 틀린 문제' : '· 같은 유형의 쌍둥이 문제'}
      ${st && st.streak ? ` · 연속 ${st.streak}회 정답` : ''}
    </div>
    <div class="sap-q" style="margin-top:11px;">${problemHTML(cur.content)}</div>
    ${imgHTML}
    <div style="margin-top:15px;">
      ${curDone
        ? `<div class="mrow" style="min-height:0;gap:8px;">
             <span style="font-size:12px;color:var(--sub);">낸 답</span>
             <b class="mono" style="font-size:15px;">${escHtml(curDone.ans||'')}</b>
             ${curDone.correct ? '' : `<span class="spacer"></span>
               <span style="font-size:12px;color:var(--sub);">정답</span>
               <b class="mono" style="font-size:15px;color:var(--ok);">${escHtml(cur.answer)}</b>`}
           </div>
           <div style="margin-top:9px;font-size:11.5px;color:var(--dim);line-height:1.7;">
             ${escHtml(dqNextLabel(curDone))}</div>`
        : isMultipleChoice(cur.content)
          ? `${answerInputHTML('dq-ans-'+cur.id)}
             <button class="mbtn p" style="margin-top:11px;" onclick="submitDailyQuiz('${cur.id}')">제출</button>`
          : `<input id="dq-ans-${cur.id}" class="sap-in" placeholder="답을 입력하세요">
             <button class="mbtn p" style="margin-top:9px;" onclick="submitDailyQuiz('${cur.id}')">제출</button>`}
    </div>
  </div>

  ${cards.length>1 ? `
  <div class="msec">오늘의 문제</div>
  ${cards.map((x,i)=>{
    const d = dqDoneToday(c.rec, x.id);
    return `<div class="mc" onclick="state.stuQuizId='${x.id}'; render(); window.scrollTo(0,0)"
        style="cursor:pointer;${x.id===cur.id ? 'border-color:var(--accent);' : (d?'opacity:.7;':'')}">
      <div class="mrow" style="min-height:38px;gap:8px;">
        <span class="mono" style="font-size:11px;color:var(--dim);">${i+1}</span>
        <span style="flex:1;min-width:0;">
          ${/* ⚠ position:relative가 없으면 안 된다 — KaTeX가 넣는 position:absolute인
                .katex-mathml의 기준이 이 <b>가 아니라 .app.sap(가장 가까운 위치 지정 조상)이 되어
                overflow:hidden을 그냥 빠져나간다. 실제로 문서가 521px 가로로 늘어났다.
                «스크롤 상자는 relative여야 한다»와 같은 함정의 가로 판이다. */''}
          <b style="display:block;position:relative;font-size:13px;font-weight:600;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap;">${escHtml(x.content)}</b>
          <span style="display:block;font-size:11px;color:var(--dim);margin-top:3px;">
            ${x.kind==='orig'?'원본':'변형'} ${x.no}번</span>
        </span>
        ${d ? `<span class="badge ${d.correct?'ok':'no'}">${d.correct?'정답':'오답'}</span>`
            : `<span class="badge late">대기</span>`}
      </div>
    </div>`;
  }).join('')}` : ''}

  ${doneCount===cards.length ? `
  <div class="mc" style="margin-top:4px;">
    <div style="font-size:12.5px;color:var(--sub);line-height:1.75;">
      오늘 치를 다 풀었습니다. 틀린 것은 내일 다시, 맞힌 것은 며칠 뒤에 한 번 더 나옵니다.</div>
  </div>` : ''}`;
}

/* ---------- 오답숙제 ---------- */
/* 원본 문항 번호를 반드시 같이 보여 준다. «내가 뭘 틀려서 이걸 푸는지»를 모르면 그냥 새 숙제가 된다.
   시험지별로 묶는 것도 같은 이유다 — 오답숙제는 «어느 시험을 다시 푸는 일»이다. */
function stuWrongHTML(c){
  /* 없는 문항을 가리키는 숙제는 «묶기 전에» 뺀다. 카드만 안 그리면
     「삭제된 시험지 0/15」짜리 빈 구획이 남는다 (아래 byExam이 그걸로 만들어진다). */
  const hws = liveWrongHomework(c.rec);
  const byExam = {};
  hws.forEach(h=>{ (byExam[h.examId] = byExam[h.examId] || []).push(h); });
  const examIds = Object.keys(byExam);
  const selectedExam = c.exams.find(e=>e.id===state.wrongExamId);

  const card = hw => {
    const bank = DATA.problemBank.find(b=>b.id===hw.bankId);
    if(!bank) return '';
    if(bank.status!=='approved'){
      return `<div class="mc">
        <div class="row" style="gap:7px;">
          <span class="badge score">원본 ${hw.questionNo}번</span>
          <span class="spacer"></span><span class="badge">검토 중</span>
        </div>
        <div style="font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.7;">
          선생님이 쌍둥이 문제를 검토하고 있습니다. 끝나면 여기에 문제가 뜹니다.</div>
      </div>`;
    }
    /* ⚠ 오답숙제가 내는 것은 «변형»이다 — 원본 그림을 그냥 붙이면 안 된다.
       어느 그림을 쓸지는 variantImgKind()가 정한다 (데일리퀴즈와 같은 함수를 봐야 한다). */
    const vk = variantImgKind(bank);
    const correct = hw.done && hw.studentAnswer.trim()===bank.variantAnswer.trim();
    return `<div class="mc ${hw.done ? '' : 'go'}" style="${hw.done?'opacity:.75;':''}">
      <div class="row" style="gap:7px;">
        <span class="badge score">원본 ${hw.questionNo}번</span>
        <span class="spacer"></span>
        ${hw.done ? `<span class="badge ${correct?'ok':'no'}">${correct?'정답':'오답'}</span>`
                  : `<span class="badge late">풀 차례</span>`}
      </div>
      <div class="sap-q" style="margin-top:11px;">${problemHTML(bank.variantContent)}</div>
      ${vk ? pbImageHTML(bank.id, vk, 'sap-img') : ''}
      <div style="margin-top:14px;">
        ${hw.done
          ? `<div class="mrow" style="min-height:0;gap:8px;">
               <span style="font-size:12px;color:var(--sub);">낸 답</span>
               <b class="mono" style="font-size:15px;">${escHtml(hw.studentAnswer)}</b>
               ${correct ? '' : `<span class="spacer"></span>
                 <span style="font-size:12px;color:var(--sub);">정답</span>
                 <b class="mono" style="font-size:15px;color:var(--ok);">${escHtml(bank.variantAnswer)}</b>`}
             </div>`
          : isMultipleChoice(bank.variantContent)
            ? `${answerInputHTML('hw-answer-'+bank.id)}
               <button class="mbtn p" style="margin-top:11px;" onclick="submitHomeworkAnswer('${bank.id}')">제출</button>`
            : `<input id="hw-answer-${bank.id}" class="sap-in" placeholder="답을 입력하세요">
               <button class="mbtn p" style="margin-top:9px;" onclick="submitHomeworkAnswer('${bank.id}')">제출</button>`}
      </div>
    </div>`;
  };

  return `
  ${state.stuWrongMode ? `
  <div class="mc hi">
    <div style="font-size:13px;font-weight:700;">틀린 문제 등록</div>
    <div style="font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7;">
      시험지를 고르고 틀린 번호를 모두 누르세요. 같은 단원의 쌍둥이 문제가 숙제로 나갑니다.</div>
    ${c.exams.length===0
      ? `<div style="font-size:12.5px;color:var(--dim);margin-top:12px;">우리 반에 등록된 시험지가 없습니다.</div>`
      : `<div style="margin-top:13px;">
          <div class="sap-lab">시험지</div>
          <select class="sap-in" onchange="state.wrongExamId=this.value; state.wrongChecked={}; render()">
            <option value="">— 선택 —</option>
            ${c.exams.map(e=>`<option value="${e.id}" ${state.wrongExamId===e.id?'selected':''}>${escHtml(e.title)} (${e.date||'-'})</option>`).join('')}
          </select>
        </div>
        ${selectedExam ? `
        <div style="margin-top:14px;">
          <div class="sap-lab">틀린 번호</div>
          <div class="row" style="flex-wrap:wrap;gap:7px;">
            ${selectedExam.questions.map(q=>`<a class="pill ${state.wrongChecked[q.no]?'on':''}"
              onclick="toggleWrongCheck(${q.no})">${q.no}</a>`).join('')}
          </div>
        </div>
        <button class="mbtn p" style="margin-top:14px;" onclick="submitWrongAnswers()">제출하기</button>` : ''}`}
    <button class="mbtn q" style="margin-top:6px;" onclick="state.stuWrongMode=false; render()">닫기</button>
  </div>`
  : `<button class="mbtn" style="margin-bottom:4px;" onclick="state.stuWrongMode=true; render()">${iconSvg('plus',16)} 틀린 문제 등록</button>`}

  ${hws.length===0
    ? `<div class="sap-empty">아직 배정된 오답숙제가 없습니다.<br>시험을 본 뒤 틀린 번호를 등록하면 쌍둥이 문제가 나갑니다.</div>`
    : examIds.map(eid=>{
        const exam = DATA.exams.find(e=>e.id===eid);
        const group = byExam[eid];
        const done = group.filter(h=>h.done).length;
        return `
        <div class="msec">${escHtml(exam ? exam.title : '삭제된 시험지')}</div>
        <div class="sap-prog" style="margin:0 0 11px;">
          <span class="bar"><i style="width:${Math.round(done/group.length*100)}%"></i></span>
          <b>${done}/${group.length}</b>
        </div>
        ${group.map(card).join('')}`;
      }).join('')}`;
}

/* =================== 과제 확인 (강사 · 조교 공용) ===================
   **학생 상세와 반 관리, 두 화면이 이 한 줄을 같이 쓴다.** 두 벌로 두면 다음에 반드시
   한쪽만 고쳐진다 — 오늘 오답숙제 신호가 그렇게 새고 있었다.
   `wide`는 반 관리처럼 «학생 이름»을 앞에 세워야 하는 자리에서 켠다. */
function hwReviewRowHTML(sid, rec, a, opts){
  const o = opts || {};
  const st = hwState(rec, a.id);
  const key = a.id + ':' + sid;
  const rejecting = state.hwRejectOpen === key;
  const [tone, label] = HW_BADGE[st.status];

  const shots = st.photos.length ? `
    <div class="hw-shots">${st.photos.map(p=>`
      <img src="${escHtml(p.url)}" alt="제출한 사진"
        onclick="state.hwPhotoView='${escHtml(p.url)}'; render()">`).join('')}</div>`
    : ((st.status===HW_APPROVED || st.status===HW_PARTIAL) && (st.onSite || st.legacy)
        ? `<div class="hw-note">${st.legacy ? '예전 방식으로 완료 표시된 과제입니다 (제출물 없음).'
                                             : '현장에서 확인했습니다 (온라인 제출물 없음).'}</div>` : '');

  /* 버튼은 «지금 상태에서 할 수 있는 것»만 낸다. 전부 늘어놓으면 무엇이 다음인지 흐려진다. */
  let acts = '';
  if(st.status===HW_SUBMITTED){
    /* 🔵 셋으로 늘었다 (2026-09-01 · C-15). 왼쪽에서 오른쪽으로 «통과 → 통과하되 적어 둠 → 되돌림».
       ⚠ 「보완 필요」는 p(강조)로 두지 않는다 — 기본 답은 여전히 「수락」이다. */
    acts = `<button class="btn p sm" onclick="approveHomework('${sid}','${a.id}',false)">수락</button>
      <button class="btn sm" title="제출은 «한 것»으로 세되 미비했다고 적어 둡니다. 다시 낼 필요는 없습니다."
        onclick="partialHomework('${sid}','${a.id}')">보완 필요</button>
      <button class="btn q sm" onclick="state.hwRejectOpen='${key}'; render()">반려</button>`;
  } else if(st.status===HW_APPROVED){
    acts = `<button class="btn sm" title="제출은 «한 것»으로 세되 미비했다고 적어 둡니다."
        onclick="partialHomework('${sid}','${a.id}')">보완 필요로</button>
      <button class="btn sm" onclick="undoHwDecision('${sid}','${a.id}')">완료 취소</button>`;
  } else if(st.status===HW_PARTIAL){
    acts = `<button class="btn p sm" onclick="approveHomework('${sid}','${a.id}',false)">완료로</button>
      <button class="btn sm" onclick="undoHwDecision('${sid}','${a.id}')">표시 취소</button>`;
  } else {
    /* 미제출·반려 — 현장에서 보여 주면 여기서 바로 완료가 된다. */
    acts = `<button class="btn p sm" onclick="approveHomework('${sid}','${a.id}',true)">현장 확인</button>
      ${st.status===HW_REJECTED
        ? `<button class="btn sm" onclick="undoHwDecision('${sid}','${a.id}')">반려 취소</button>` : ''}`;
  }

  return `<div class="hw-row">
    <div class="hw-rt">
      ${/* 반 관리에서는 과제 하나를 «펼친 안»이라 줄마다 과제명을 되풀이할 이유가 없다.
           그 자리에 학생 이름이 온다 — 여기서 가려는 것은 «누가»다. */''}
      ${/* ⚠ `.hw-who` 하나만 붙인다. `.hw-title`을 같이 붙이면 그쪽 `flex:1`이 이겨
           이름이 늘어나고 배지가 화면 오른쪽 끝으로 밀린다 (2026-08-25에 고친 것). */''}
      ${o.wide ? `<b class="hw-who">${escHtml(o.name||'')}</b>`
               : `<span class="hw-title">${escHtml(a.title)}</span>`}
      ${/* ⚠ `hideBadge`는 «상태별로 묶인 명단» 안에서 켠다 — 묶음 머리가 이미
           「확인 대기」라고 말했는데 줄마다 「확인 기다리는 중」을 또 다는 것은
           같은 말을 두 번 하는 것이다. 학생 상세처럼 섞여 있는 자리에서는 끈다. */''}
      ${o.hideBadge ? '' :
        (label ? `<span class="badge ${tone}">${label}</span>` : '<span class="badge">미제출</span>')}
      ${/* ⚠ **한글을 `.mono` 안에 넣지 말 것.** `.mono`는 JetBrains Mono라 한글 글리프가
           없어서 「낸 날」이 **두부 상자 두 개**로 나왔다 (2026-08-25에 발견). 날짜만 mono다. */''}
      ${st.submittedAt ? `<span class="hw-when">낸 날 <span class="mono">${escHtml(st.submittedAt)}</span></span>` : ''}
      ${st.by ? `<span class="hw-when">${escHtml(st.by)}${st.decidedAt?' · '+escHtml(st.decidedAt):''}</span>` : ''}
      ${/* `tight`면 버튼이 이름과 «같은 줄» 오른쪽에 붙는다. 사진 아래로 내려보내면
           한 사람이 130px씩 먹어서 대기 두 명에 화면 절반이 나간다. */''}
      ${o.tight && !rejecting ? `<span class="hw-acts inline">${acts}</span>` : ''}
    </div>
    ${st.status===HW_REJECTED && st.reason
      ? `<div class="hw-back"><b>반려 사유</b><span>${escHtml(st.reason)}</span></div>` : ''}
    ${shots}
    ${rejecting ? `<div class="hw-rej">
      <textarea id="hw-reject-${a.id}-${sid}" rows="2"
        placeholder="무엇을 다시 해야 하는지 적어주세요. 학생 화면에 그대로 보입니다."></textarea>
      <div class="row" style="gap:6px;margin-top:7px;">
        <button class="btn q sm" onclick="rejectHomework('${sid}','${a.id}')">반려하고 알리기</button>
        <button class="btn sm" onclick="state.hwRejectOpen=null; render()">취소</button>
      </div></div>`
      : (o.tight ? '' : `<div class="hw-acts">${acts}</div>`)}
  </div>`;
}

/* =================== 과제 확인 명단 — 반 전체 (2026-08-25 · H-3) ===================
   **강사 화면 둘이 이 한 덩어리를 같이 쓴다** — 「수업 > 과제」와 「반 관리 > 과제」.
   ⚠ 전에는 두 곳이 `roster.map(hwReviewRowHTML)`을 **각자** 돌렸고,
     **수업 쪽에만 정렬이 있었다.** 노트에 적어 둔 「두 벌로 두면 한쪽만 고쳐진다」가
     실제로 벌어져 있던 자리다. 요약줄·알림바·정렬·접기를 전부 여기 하나로 모은다.

   **명단을 «할 일» 순서로 접는다 — 2026-08-25에 사용자가 고른 방향이다.**
   강사가 이 화면에서 실제로 하는 일은 «확인 대기를 수락/반려»하는 것 하나인데,
   전에는 20명이 등록 순서로 늘어서 대기 2명을 눈으로 찾아야 했다. 셋으로 간다 —
   ① **확인 대기** — 지금 손이 가야 하는 것. 사진과 버튼을 **편 채로** 둔다
   ② **아직 안 냄** — 볼 것이 없다(사진도 낸 날짜도 없다). **한 줄로 눕힌다**
   ③ **완료** — 볼 일이 없다. **접는다.** 이름만 스치듯 남기고 눌러야 펴진다

   ⚠ **②는 `hwNeedsAction` 하나로만 가른다 — 미제출 알림이 잡는 집합과 «같아야» 한다.**
     여기서 따로 세면 「안 냈다는데 알림 목록엔 없다」가 생긴다. 안 냈거나 반려된 것 둘 다다.
   ⚠ **요약줄에 미제출 수를 넣지 않았다.** 바로 아래 알림바가 그 숫자를 이미 말한다 —
     같은 수를 두 번 쓰면 어느 쪽이 진짜인지 묻게 된다. 요약줄은 «완료»와 «대기»만 진다.
   ⚠ **알림바는 맨 위에 그대로 둔다** (N-1에서 정한 자리). 「아직 안 냄」 묶음 머리로
     내리면 대기가 많은 날 화면 아래로 밀려 «또 올라와야» 한다. */
function hwRosterReviewHTML(a, roster){
  if(!state.allRecordsLoaded)
    return '<span class="muted" style="font-size:12px;">학생 기록을 불러오는 중…</span>';
  if(roster.length === 0)
    return '<span class="muted" style="font-size:12px;">이 반에 재원생이 없습니다.</span>';

  const recOf  = s => state.allRecords[s.studentId];
  const withRec = roster.filter(s => recOf(s));
  const byName = (x, y) => x.name.localeCompare(y.name);

  /* 판정은 전부 기존 셋에 맡긴다 — 여기서 상태를 새로 해석하지 않는다. */
  const waiting = withRec.filter(s => hwState(recOf(s), a.id).status === HW_SUBMITTED).sort(byName);
  const todo    = withRec.filter(s => hwNeedsAction(recOf(s), a.id)).sort(byName);
  const done    = withRec.filter(s => hwIsDone(recOf(s), a.id)).sort(byName);

  const pct = Math.round(done.length / roster.length * 100);
  const openDone = state.hwDoneOpen === a.id;

  const full = s => hwReviewRowHTML(s.studentId, recOf(s), a,
    {wide:true, name:s.name, tight:true, hideBadge:true});

  /* 아직 안 낸 사람 한 줄. 반려된 사람은 «왜»가 붙는다 — 그게 다시 낼 근거다. */
  const mini = s => {
    const st = hwState(recOf(s), a.id);
    const back = st.status === HW_REJECTED;
    return `<div class="hw-mini">
      <b>${escHtml(s.name)}</b>
      ${back ? '<span class="badge no">반려</span>' : ''}
      ${back && st.reason ? `<span class="hw-mini-r">${escHtml(st.reason)}</span>` : ''}
      <span class="act">
        ${/* 이 화면의 «주된» 손짓은 수락이다. 현장 확인까지 진한 버튼으로 두면
             미제출이 열 명일 때 진한 버튼 열 개가 깔려 무엇이 먼저인지 흐려진다. */''}
        <button class="btn sm" onclick="approveHomework('${s.studentId}','${a.id}',true)">현장 확인</button>
        ${back ? `<button class="btn sm" onclick="undoHwDecision('${s.studentId}','${a.id}')">반려 취소</button>` : ''}
      </span>
    </div>`;
  };

  const grp = (tone, label, list, rowFn) => !list.length ? '' : `
    <div class="hw-grp">
      <div class="hw-grp-h ${tone}"><b>${label}</b><span>${list.length}명</span></div>
      ${list.map(rowFn).join('')}
    </div>`;

  return `
    <div class="hw-sum">
      <span class="bar"><i style="width:${pct}%"></i></span>
      <b class="mono">${done.length}/${roster.length}</b><span>완료</span>
      ${waiting.length ? `<span class="hw-dot late"></span><span>확인 대기 <b>${waiting.length}</b></span>` : ''}
    </div>
    ${hwNoticeBarHTML(a, roster)}
    ${grp('late', '확인 대기', waiting, full)}
    ${grp('no',   '아직 안 냄', todo,   mini)}
    ${!done.length ? '' : `<div class="hw-grp">
      <button class="hw-fold" onclick="state.hwDoneOpen = state.hwDoneOpen==='${a.id}' ? null : '${a.id}'; render()">
        <span class="hw-caret">${openDone ? '▾' : '▸'}</span>
        <b>완료</b><span class="n">${done.length}명</span>
        ${openDone ? '' : `<span class="who">${done.map(s=>escHtml(s.name)).join(' · ')}</span>`}
      </button>
      ${openDone ? done.map(full).join('') : ''}
    </div>`}`;
}

/* =================== 과제 격자 — 행=학생 · 열=과제 (2026-08-25 · H-5) ===================
   사용자가 격자 화면을 가리키며 **「이런식으로 뭔가 한눈에 보고싶은데」**라고 했다.
   **문제는 시인성이 아니라 «축»이었다.** 이 화면은 「과제 하나를 펴면 그 안에 학생」이라
   **한 번에 한 과제만** 보였다. 명단을 아무리 정리해도 «한눈에»가 될 수 없는 모양이다.
   격자는 반 전체 × 과제 전체를 한 판에 올린다.

   **눈이 먼저 가는 것은 «확인 대기»여야 한다** — 강사가 실제로 할 일이다.
   완료는 조용한 초록, 미제출은 흐린 글자, 반려는 붉게, **확인 대기만 테두리까지 준다.**

   **누르는 곳이 둘이고, 하는 일이 겹치지 않는다** (2026-08-26에 갈랐다) —
   · **칸** → 오른쪽에서 상세가 나온다(`state.hwCell`). 격자를 떠나지 않고 수락·반려한다.
     **검토는 전부 여기서 한다**
   · **열 머리** → 그 과제의 **미제출 알림**이 격자 «아래»로 열린다(`state.homeworkDetailId`).
     **거기가 N-1로 가는 유일한 문이다** — 격자만 두면 그 길이 끊긴다.
     🔴 **여기에 명단을 다시 펴지 말 것** — 격자가 이미 하는 말이라 그게 불편의 원인이었다

   ⚠ **표 골격을 새로 짜지 않는다** — `table.grid`(ds.css)를 그대로 쓴다.
   ⚠ **판정은 `hwState` 하나만 부른다.** 격자라고 상태를 새로 해석하지 않는다.
   ⚠ **최신 과제가 왼쪽이다.** 지금 밀린 것을 먼저 보는 화면이지 연대기가 아니다. */
/* 세 번째 값이 «칸에 적히는 것»이다 (2026-09-01).
   🔴 **줄여 쓰지 말 것.** 한 번 「완·대·반」으로 줄였다가 사용자가 「대 한글자가 뭘 말하는지
     모르겠다」고 해서 되돌렸다. 열 폭은 제목이 정하므로(96px) 말을 다 적어도 표는 안 넓어진다.
   ⚠ **미제출만 «·»이다** — 가장 흔한 상태라 글자로 적으면 표가 그 낱말로 뒤덮인다.
     08-25에 겪은 일이고, 출결 격자의 «미입력»도 같은 이유로 점이다. 뜻은 표 아래 한 줄이 진다. */
const HWG_CELL = {
  [HW_APPROVED]:  ['ok',   '완료',      '완료'],
  [HW_PARTIAL]:   ['half', '보완 필요', '보완 필요'],
  [HW_SUBMITTED]: ['wait', '확인 대기', '확인 대기'],
  [HW_REJECTED]:  ['no',   '반려',      '반려'],
  [HW_NONE]:      ['none', '미제출',    '·']
};
function hwGridHTML(classId, list, roster){
  if(!state.allRecordsLoaded)
    return '<div class="hwg-empty">학생 기록을 불러오는 중…</div>';
  if(roster.length === 0) return '<div class="hwg-empty">이 반에 재원생이 없습니다.</div>';
  if(list.length === 0)   return '<div class="hwg-empty">등록된 과제가 없습니다.</div>';

  const recOf = s => state.allRecords[s.studentId];
  const named = roster.slice().sort((x,y)=>x.name.localeCompare(y.name));
  /* 최신이 왼쪽 — 등록일이 없으면 뒤로 민다. */
  const cols = list.slice().sort((x,y)=>String(y.createdAt||'').localeCompare(String(x.createdAt||'')));

  const cell = (s, a) => {
    const rec = recOf(s);
    if(!rec) return '<td></td>';
    const st = hwState(rec, a.id);
    let [tone, label, mark] = HWG_CELL[st.status] || HWG_CELL[HW_NONE];
    /* 🔴 **마감이 지난 미제출은 붉게 «미제출»이라고 적는다** (2026-09-01 · C-15 · 사용자가 시켰다).
       마감 전에는 «·» 한 점으로 조용하다 — 아직 낼 시간이 있는 것을 할 일처럼 세우면
       표가 매일 붉어진다. **지나야 비로소 할 일이 된다.**
       ⚠ 마감일이 없는 과제는 «지났다»가 성립하지 않으므로 영영 «·»다. */
    if(st.status===HW_NONE && a.dueDate && a.dueDate < todayStr()){
      tone = 'over'; mark = '미제출'; label = '미제출 · 마감 지남';
    }
    const sel = state.hwCell && state.hwCell.sid===s.studentId && state.hwCell.hwId===a.id;
    /* ⚠ 사진 장수는 «확인 대기»에서만 말한다 — 볼지 말지를 정하는 정보라서다.
       완료된 칸에까지 「사진 1」을 달았더니 표 전체가 그 글자로 뒤덮였다.
       🔵 이제 그 «있다»는 사실만 점으로 알리고 수는 title에 둔다 (2026-09-01). */
    const shots = st.status===HW_SUBMITTED ? st.photos.length : 0;
    return `<td><button class="hg-m ${tone}${sel?' sel':''}"
      onclick="hwOpenCell('${s.studentId}','${a.id}')"
      title="${escHtml(s.name)} · ${escHtml(a.title)} — ${label}${
        shots ? ' · 사진 '+shots+'장' : ''}">${mark}${
        shots ? '<i class="dotmark"></i>' : ''}</button></td>`;
  };

  /* 🔴 **열 머리는 «이름»이 아니라 «날짜»다** (2026-09-01 · C-16 · 사용자가 시켰다).
     사용자의 말 — 「**과제 이름이 길면 다 잘리기 때문에 과제이름이 아니라 어떤수업때 내준
       과제인지 날짜와(출결날짜와 동일하게) 마감일로 뜨게 해줘**」.
     맞는 말이다. 96px에 이름을 우겨넣어 봐야 예닐곱 자에서 잘리고, **잘린 이름은
     이름 노릇을 못 한다.** 날짜는 짧고, 길이가 늘지 않고, «어느 수업»을 정확히 가리킨다.
     ⚠ **이름은 사라지지 않는다** — title(마우스)에 있고, 열 머리를 누르면 열리는
       오른쪽 판의 머리글이 이름이다. 한 번 누르면 나온다.
     ⚠ **날짜 어법은 출결 격자와 같게 둔다**(C-10) — 「3 월」처럼 일과 요일이 나란히.
       다만 출결은 한 달치가 못 박혀 있는데 **여기는 아니다** — `inMonth`가
       «낸 날이 이 달» 또는 «마감이 이 달»이라 낸 날이 지난달일 수 있다.
       그래서 **다른 달일 때만 월을 적는다**(`7/29`). 안 그러면 조용히 거짓이 된다.
     ⚠ 옛 과제에 `createdAt`이 없으면 날짜를 지어낼 수 없다 — 그때는 이름으로 되돌린다. */
  const ymNow2 = chubYm();
  const head = cols.map(a=>{
    const done = named.filter(s=>recOf(s) && hwIsDone(recOf(s), a.id)).length;
    const wait = named.filter(s=>recOf(s) && hwState(recOf(s), a.id).status===HW_SUBMITTED).length;
    const on = state.hwNoticeId===a.id;
    const cd = String(a.createdAt||'');
    const wd = cd ? WEEKDAY_LABEL[new Date(cd+'T00:00:00').getDay()] : '';
    const dNum = !cd ? '' : (cd.slice(0,7)===ymNow2 ? String(+cd.slice(8)) : (+cd.slice(5,7))+'/'+(+cd.slice(8)));
    return `<th class="hwg-col${on?' on':''}${(done+wait)===0?' empty':''}" onclick="hwToggleCol('${a.id}')"
      title="${escHtml(a.title)}
${cd ? '낸 날 '+escHtml(cd)+' ('+wd+')' : '낸 날 모름'}${a.dueDate?' · 마감 '+escHtml(a.dueDate):' · 마감 없음'}
완료 ${done}/${named.length}${wait?' · 확인 대기 '+wait:''} — 누르면 오른쪽에 열립니다">
      ${cd ? `<b><span class="mono">${dNum}</span><i>${wd}</i></b>`
           : `<b>${escHtml(a.title)}</b>`}
      <span class="due">${a.dueDate ? `마감 <span class="mono">${escHtml(a.dueDate.slice(5))}</span>` : '마감 없음'}</span>
    </th>`;
  }).join('');

  /* 이름 칸은 이름만 진다 — 「제출」은 오른쪽 끝 열로 나갔다(출결의 「출석률」 자리). */
  const rows = named.map(s=>{
    const rec = recOf(s);
    const mine = rec ? cols.filter(a=>hwIsDone(rec, a.id)).length : 0;
    return `<tr>
      <td class="who"><span class="nm">${escHtml(s.name)}</span></td>
      ${cols.map(a=>cell(s, a)).join('')}
      <td class="hg-done"><span class="mono">${mine}/${cols.length}</span></td>
    </tr>`;
  }).join('');

  /* ⚠ **`table.grid`를 쓰지 않는다** (2026-09-01 · 사용자가 짚었다) —
     `.grid`의 `width:100%`가 과제가 두어 건뿐일 때 열을 476px까지 벌려 놓았다.
     출결(`.hwg.ag`)·성적(`.hwg.sg`)은 원래 `.grid` 없이 «내용만큼»만 선다.
     셋 중 과제만 다른 표였다. 이제 셋이 같은 뼈대를 쓴다.
   ⚠ **표 밑 설명 줄은 지웠다** (2026-09-01 · C-16 · 사용자가 정했다) — 「지워도 될 것 같아」.
     표식의 뜻은 칸마다 붙은 title이 그대로 지고 있고, 칸을 누르면 오른쪽 판이 열리므로
     «눌러도 되는 것»인지도 한 번이면 안다.
     ⚠ 다시 세우고 싶어지면 «·»(미제출) 하나만 두는 것이 맞다 — 나머지 셋은 칸에 적혀 있다. */
  return `<div class="hwg-wrap"><table class="hwg hg">
    <thead><tr><th class="who">이름</th>${head}<th class="hg-done">제출</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
/* 칸을 누르면 오른쪽 상세를 연다. 같은 칸을 다시 누르면 닫힌다. */
function hwOpenCell(sid, hwId){
  const cur = state.hwCell;
  state.hwCell = (cur && cur.sid===sid && cur.hwId===hwId) ? null : {sid, hwId};
  state.hwRejectOpen = null;
  render();
}
function hwCloseCell(){ state.hwCell = null; state.hwRejectOpen = null; render(); }
/* 열 머리 — 그 과제의 «미제출 알림»을 오른쪽에서 연다 (2026-08-27 · D-1).
   ⚠ **격자 아래로 펴던 것을 옮긴 것이다.** 사용자가 「아래 또 뜨는게 불편하다」고 했다 —
     칸을 눌렀을 때와 «같은 자리»에서 같은 모양으로 열려야 한 화면으로 읽힌다. */
function hwToggleCol(hwId){
  state.hwNoticeId = state.hwNoticeId===hwId ? null : hwId;
  state.hwDoneOpen = null;
  render();
}
function hwCloseNotice(){ state.hwNoticeId = null; render(); }
/* 오른쪽 상세. **줄은 명단과 «같은 것»을 쓴다**(`hwReviewRowHTML`) —
   여기서만 쓰는 두 번째 검토 화면을 만들면 다음에 한쪽만 고쳐진다.
   ⚠ 상태를 옮기는 문은 여전히 `approveHomework`·`rejectHomework`·`undoHwDecision` 셋뿐이다. */
function hwCellDrawerHTML(){
  const c = state.hwCell;
  if(!c) return '';
  const a = DATA.assignments.find(x=>x.id===c.hwId);
  const s = DATA.students.find(x=>x.studentId===c.sid);
  const rec = state.allRecords[c.sid];
  if(!a || !s || !rec){ return ''; }
  const st = hwState(rec, a.id);
  const [tone, label] = HW_BADGE[st.status];

  /* 대기 중인 다음 사람으로 바로 넘어간다 — 다섯 명을 볼 때 격자로 되돌아갈 이유가 없다. */
  const sameClass = classRoster(a.classId)
    .sort((x,y)=>x.name.localeCompare(y.name));
  const waiting = sameClass.filter(x=>{
    const r = state.allRecords[x.studentId];
    return r && hwState(r, a.id).status===HW_SUBMITTED;
  });
  const at = waiting.findIndex(x=>x.studentId===c.sid);
  const nextWait = at >= 0 ? waiting[at+1] : waiting[0];

  return `<div class="hwd-back" onclick="hwCloseCell()"></div>
    <aside class="hwd">
      <div class="hwd-h" style="position:relative;">
        <div class="t">${escHtml(a.title)}</div>
        <div class="m">${a.dueDate ? '마감 <span class="mono">'+escHtml(a.dueDate)+'</span>' : '마감 없음'}
          <s>·</s>${escHtml(DATA.classes.find(x=>x.id===a.classId)?.name || '')}</div>
        <button class="x" onclick="hwCloseCell()" title="닫기 (Esc)">×</button>
      </div>
      <div class="hwd-b">
        ${hwReviewRowHTML(c.sid, rec, a, {wide:true, name:s.name})}
        ${st.photos.length ? '' : `<div class="hw-note">아직 올린 사진이 없습니다.</div>`}
      </div>
      <div class="hwd-f">
        <span class="badge ${tone}">${label || '미제출'}</span>
        <div class="nav">
          ${nextWait && nextWait.studentId!==c.sid
            ? `<button class="btn sm" onclick="hwOpenCell('${nextWait.studentId}','${a.id}')">다음 대기 ${iconSvg('arrowR',13)}</button>`
            : ''}
          <button class="btn sm" onclick="hwCloseCell()">닫기</button>
        </div>
      </div>
    </aside>`;
}

/* 열 머리에서 여는 «미제출 알림» 드로어 (2026-08-27 · D-1).
   🔴 **칸 상세(`hwCellDrawerHTML`)와 같은 껍데기를 쓴다** — 같은 격자에서 열리는 둘이
     서로 다른 모양이면 «어디를 눌렀길래 이게 떴나»를 매번 다시 읽어야 한다.
   ⚠ **여기서는 «미제출 알림» 버튼을 한 번 더 누르게 하지 않는다.** 열 머리를 누른 뜻이
     이미 「알림을 보내겠다」이므로, 아래로 펴던 시절의 `hwNoticeBarHTML`(버튼 한 단계)
     대신 `hwNoticePanelHTML`을 곧장 편다. 08-26에 고친 «두 번 누르기»와 같은 이야기다.
   ⚠ 「과제 삭제」는 격자 아래 묶음에 있던 것을 그대로 데려왔다 — 이 문이 사라지면
     반 관리에서 과제를 지울 자리가 없어진다. */
function hwNoticeDrawerHTML(){
  const a = DATA.assignments.find(x=>x.id===state.hwNoticeId);
  if(!a) return '';
  const roster = classRoster(a.classId);
  /* ⚠ 기록을 불러오기 전에는 `hwUnsubmitted`가 빈 배열이라 «미제출자 없음»으로 보인다.
       불러오는 중인 것과 정말 없는 것은 다른 말이므로 갈라서 말한다. */
  const miss = state.allRecordsLoaded ? hwUnsubmitted(a, roster) : [];
  const body = !state.allRecordsLoaded
    ? '<div class="hw-note">학생 기록을 불러오는 중…</div>'
    : miss.length ? hwNoticePanelHTML(a, miss)
    : '<div class="hw-note">미제출자가 없습니다 — 보낼 알림이 없습니다.</div>';
  return `<div class="hwd-back" onclick="hwCloseNotice()"></div>
    <aside class="hwd wide">
      <div class="hwd-h" style="position:relative;">
        <div class="t">${escHtml(a.title)}</div>
        <div class="m">${a.dueDate ? '마감 <span class="mono">'+escHtml(a.dueDate)+'</span>' : '마감 없음'}
          <s>·</s>${escHtml(DATA.classes.find(x=>x.id===a.classId)?.name || '')}${
          state.allRecordsLoaded ? '<s>·</s>미제출 <b class="mono">'+miss.length+'</b>명' : ''}</div>
        <button class="x" onclick="hwCloseNotice()" title="닫기 (Esc)">×</button>
      </div>
      <div class="hwd-b">
        ${a.description?`<p class="st-note" style="white-space:pre-wrap;margin:8px 0 12px;">${escHtml(a.description)}</p>`:''}
        ${body}
      </div>
      <div class="hwd-f">
        <button class="btn q sm" onclick="deleteHomework('${a.id}')">과제 삭제</button>
        <div class="nav"><button class="btn sm" onclick="hwCloseNotice()">닫기</button></div>
      </div>
    </aside>`;
}

/* =================== 숙제 미제출 알림 (2026-08-24 · N-1) ===================
   사용자가 「미제출 알림 버튼을 누르면 카카오톡으로 자동 발송」을 원했다.
   **지금 여기 있는 것은 «발송 직전»까지다 — 실제로 나가지 않는다.** 사용자가 그 순서로 정했다.

   🔴 **왜 아직 못 보내는가 — 코드가 아니라 바깥 준비물이 없어서다.**
     카카오톡으로 «친구가 아닌 사람»에게 보내는 길은 **알림톡뿐**이고, 그러려면
     ① 카카오톡 채널 + 비즈니스 인증(사업자등록증) ② 발송 대행사 계약(솔라피·알리고·NHN 등 —
     카카오가 API를 직접 열지 않는다) ③ **템플릿 사전 심사**가 먼저다. 건당 과금이다.
     (카카오 메시지 API의 「친구에게 보내기」는 학부모·학생이 **이 앱에 카카오 로그인**을 하고
      **선생님과 카톡 친구**여야 해서 학원 알림으로는 성립하지 않는다. 그래서 뺐다.)

   ⚠ **그래서 «문안»이 코드보다 앞선다.** 승인된 템플릿 문장 밖으로는 한 글자도 못 나가고,
     바꾸려면 재심사다. 아래 `HW_NOTICE_TEMPLATE`이 **심사에 넣을 원문 그대로**이고
     화면의 미리보기는 그것을 실제 값으로 치환해 보여 준다 — 심사 전에 눈으로 확정하라는 뜻이다.

   ⚠ **받는 사람은 «학생 본인»이다 — 2026-08-24에 사용자가 그렇게 정했다.** `s.phone`을 쓴다.
     학부모(`s.parentPhone`)로 바꾸려면 아래 `HW_NOTICE_TO` 한 곳만 고치면 된다.

   🔴 **연결하기 전에 반드시 풀어야 하는 것 둘** (지금은 발송이 막혀 있어 문제가 안 될 뿐이다) —
     ① **워커가 「강사인지」를 모른다.** `signInAnonymously()`라 토큰이 «사이트를 연 사람»까지만
        말해 준다(worker/README). AI 한도일 때는 감수했지만, **돈이 나가고 학생에게 도달하는**
        엔드포인트를 그대로 열면 누구든 호출해 뿌릴 수 있다
     ② **중복 방지·발송 기록**이 없다. 두 번 누르면 두 번 간다.
        만들 때는 순위 문서(`rank:<월요일>`)와 **같은 어법**으로 — 읽고 → 내 줄만 더하고 → 쓴다
   ⚠ **API 키는 워커 비밀로만 둔다.** 브라우저에 실으면 그 순간 공개된다(AI_SITE_TOKEN의 교훈). */

const HW_NOTICE_TO = s => (s.phone || '').trim();      // 받는 사람 = 학생 본인

/* ⚠ 이 문안은 **내가 지은 자리표시다 — 사용자의 말이 아니다.**
   심사에 넣기 전에 원장님이 문장을 확정해야 한다 (9절 8번의 규칙). */
const HW_NOTICE_TEMPLATE =
`[김하현수학연구소]
#{학생명} 학생, 과제 「#{과제명}」이 아직 제출되지 않았습니다.
마감: #{마감일}
앱에서 사진으로 제출할 수 있습니다.`;

function hwNoticeText(name, a){
  return HW_NOTICE_TEMPLATE
    .replace('#{학생명}', name || '')
    .replace('#{과제명}', a.title || '')
    .replace('#{마감일}', a.dueDate || '미정');
}

/* 이 과제를 아직 «해야 할 일»로 들고 있는 학생 — 안 냈거나 반려됐거나.
   ⚠ 판정은 `hwNeedsAction` 하나만 부른다. 제출해 둔 것(확인 대기)은 미제출이 아니다 —
     그걸 섞으면 «낸 사람에게 안 냈다고 보내는» 일이 생긴다. */
function hwUnsubmitted(a, roster){
  return roster.filter(s=>{
    const rec = state.allRecords[s.studentId];
    return rec && hwNeedsAction(rec, a.id);
  });
}

/* 펼친 과제 위에 붙는 한 줄. 수업 > 과제와 반 관리 > 과제가 **같은 것을 쓴다** —
   두 벌로 두면 다음에 반드시 한쪽만 고쳐진다(hwReviewRowHTML과 같은 이유). */
function hwNoticeBarHTML(a, roster){
  if(!state.allRecordsLoaded) return '';
  const miss = hwUnsubmitted(a, roster);
  if(miss.length === 0) return '';
  const open = state.hwNoticeFor === a.id;
  return `<div class="hw-nbar">
    <span class="sub">미제출 <b class="mono">${miss.length}</b>명</span>
    <span class="spacer"></span>
    <button class="btn sm" onclick="event.stopPropagation(); state.hwNoticeFor = ${
      open ? 'null' : `'${a.id}'`}; render()">${open ? '닫기' : '미제출 알림'}</button>
  </div>${open ? hwNoticePanelHTML(a, miss) : ''}`;
}

function hwNoticePanelHTML(a, miss){
  const withPhone = miss.filter(s=>HW_NOTICE_TO(s));
  const noPhone   = miss.filter(s=>!HW_NOTICE_TO(s));
  const sample    = withPhone[0] || miss[0];

  return `<div class="hw-npanel" onclick="event.stopPropagation();">
    <div class="t-sec" style="margin:0 0 9px;">보낼 사람 <span class="mono">${withPhone.length}</span>명</div>
    ${withPhone.length === 0
      ? `<div class="hw-nnone">보낼 수 있는 사람이 없습니다 — 아래 학생들의 <b>전화번호가 비어 있습니다.</b></div>`
      : `<div class="hw-nlist">${withPhone.map(s=>`<div class="hw-nrow">
          <b>${escHtml(s.name)}</b><span class="mono">${escHtml(HW_NOTICE_TO(s))}</span>
        </div>`).join('')}</div>`}

    ${noPhone.length ? `
      <div class="t-sec" style="margin:16px 0 7px;">번호가 없어 못 보냄 <span class="mono">${noPhone.length}</span>명</div>
      <div class="hw-nlist off">${noPhone.map(s=>`<div class="hw-nrow">
        <b>${escHtml(s.name)}</b><span class="muted">전화번호 없음</span></div>`).join('')}</div>
      ${/* ⚠ 2026-08-26에 «설정»으로 바뀌었다 — 전화번호를 채우는 곳이 옮겨 갔다.
             계정·개인정보를 손대는 문은 이제 설정 > 학생 하나뿐이다. */''}
      <p class="st-note" style="margin-top:7px;">설정 &gt; 학생에서 <b>계정 수정</b>을 눌러 <b>전화번호</b>를 채우면 보낼 수 있습니다.</p>` : ''}

    <div class="t-sec" style="margin:16px 0 7px;">보낼 문안</div>
    ${/* 심사 전에 «실제로 나갈 문장»을 눈으로 확정하라는 자리다. 요약하지 않고 그대로 보여 준다. */''}
    <div class="hw-nmsg">${escHtml(hwNoticeText(sample ? sample.name : '홍길동', a))}</div>
    <p class="st-note" style="margin-top:7px;">
      학생 이름·과제명·마감일만 사람마다 바뀝니다. <b>나머지 문장은 심사받은 그대로 고정</b>입니다.</p>

    <div class="hw-nact">
      <button class="btn p" disabled title="아직 연결되지 않았습니다">카카오톡으로 보내기</button>
      <span class="muted">아직 <b>실제로 보내지지 않습니다.</b> 채널 인증 · 발송 대행사 ·
        템플릿 심사가 끝나야 연결됩니다.</span>
    </div>
  </div>`;
}

/* ---------- 진도 · 과제 ---------- */
/* 과제 한 장. 예전에는 «학생이 직접 누르는 체크박스»였다 — 눌렀다는 말 말고는 아무 근거가
   없었다. 지금은 사진을 올려 내고, 강사·조교가 보고 수락해야 완료가 된다.
   ⚠ 학생에게는 «완료로 만드는 버튼»이 없다. 그 문은 강사·조교 쪽에만 있다. */
const HW_BADGE = {
  [HW_NONE]:      ['', ''],
  [HW_SUBMITTED]: ['late', '확인 기다리는 중'],
  [HW_APPROVED]:  ['ok',   '완료'],
  /* ⚠ 학생에게도 그대로 말한다 (2026-09-01 · C-15) — 「완료」로만 보이면 왜 다음에
     더 챙기라는 말을 듣는지 알 수 없다. 다만 «다시 내라»가 아니므로 올리는 칸은 안 열린다
     (그 문은 `hwNeedsAction`이 지키고, 보완 필요는 거기 안 든다). */
  [HW_PARTIAL]:   ['half', '완료 · 보완이 필요해요'],
  [HW_REJECTED]:  ['no',   '다시 해야 해요']
};
function stuHomeworkCardHTML(c, a){
  const st = hwState(c.rec, a.id);
  const done = hwIsDone(c.rec, a.id);   // 보완 필요도 «한 것»이다 (C-15)
  const dd = hwNeedsAction(c.rec, a.id) ? stuDday(a.dueDate) : null;
  const [tone, label] = HW_BADGE[st.status];
  const staged = hwPhotoList(a.id);
  const busy = staged.some(p=>p.uploading);

  /* 이미 낸 사진 — 제출했든 수락됐든 «내가 낸 것»은 늘 보여 준다. */
  const sent = st.photos.length ? `
    <div class="hw-shots">${st.photos.map(p=>`
      <img src="${escHtml(p.url)}" alt="제출한 사진"
        onclick="state.hwPhotoView='${escHtml(p.url)}'; render()">`).join('')}</div>` : '';

  /* 낼 차례일 때만 올리는 자리를 연다. */
  const uploader = hwNeedsAction(c.rec, a.id) ? `
    <div class="hw-up">
      ${staged.length ? `<div class="hw-shots">${staged.map((p,i)=>`
        <span class="hw-shot">
          <img src="${escHtml(p.url || p.previewUrl)}" ${p.uploading?'style="opacity:.45;"':''} alt="올린 사진">
          ${p.uploading ? `<b class="hw-upping">올리는 중…</b>`
            : `<button class="hw-x" onclick="removeHwPhoto('${a.id}',${i})">×</button>`}
        </span>`).join('')}</div>` : ''}
      <input type="file" accept="image/*" multiple id="hwf-${a.id}" style="display:none;"
        onchange="handleHwPhotos('${a.id}', this.files); this.value='';">
      <input type="file" accept="image/*" capture="environment" id="hwc-${a.id}" style="display:none;"
        onchange="handleHwPhotos('${a.id}', this.files); this.value='';">
      <div class="row" style="gap:7px;margin-top:${staged.length?'9px':'2px'};">
        <button class="mbtn" style="flex:1;" ${staged.length>=HW_PHOTO_MAX?'disabled':''}
          onclick="document.getElementById('hwc-${a.id}').click()">${iconSvg('camera',15)} 촬영</button>
        <button class="mbtn" style="flex:1;" ${staged.length>=HW_PHOTO_MAX?'disabled':''}
          onclick="document.getElementById('hwf-${a.id}').click()">${iconSvg('file',15)} 사진 선택</button>
      </div>
      <button class="mbtn p" style="margin-top:8px;" ${staged.length===0||busy?'disabled':''}
        onclick="submitHomework('${c.sid}','${a.id}')">${
          busy ? '사진 올리는 중…' : `제출하기${staged.length?` (${staged.length}장)`:''}`}</button>
      <div class="hw-hint">노트를 찍어 올리면 강사·조교가 확인합니다. 최대 ${HW_PHOTO_MAX}장.</div>
    </div>` : '';

  return `<div class="mc" style="${done?'opacity:.7;':''}">
    <div class="mrow" style="min-height:34px;gap:9px;">
      <span style="flex:1;min-width:0;font-size:13.5px;${done?'color:var(--sub);':'font-weight:600;'}">
        ${escHtml(a.title)}</span>
      ${label ? `<span class="badge ${tone}">${label}</span>` : ''}
      ${dd ? `<span class="badge ${dd.tone}">${dd.label}</span>`
           : `<span class="mono" style="font-size:11px;color:var(--dim);">${escHtml(a.dueDate||'')}</span>`}
    </div>
    ${a.description ? `<div style="font-size:12.5px;color:var(--sub);line-height:1.75;
      white-space:pre-wrap;margin-top:4px;">${escHtml(a.description)}</div>` : ''}
    ${st.status===HW_REJECTED && st.reason ? `<div class="hw-back">
      <b>다시 해야 하는 이유</b><span>${escHtml(st.reason)}</span>
      <i>${escHtml(st.by||'')}${st.decidedAt?' · '+escHtml(st.decidedAt):''}</i></div>` : ''}
    ${st.status===HW_PARTIAL ? `<div class="hw-ok half">확인받았습니다 — <b>보완이 필요한 부분이 있습니다.</b>
      다시 낼 필요는 없고, 다음에 더 챙겨 주세요.${
      st.by ? ` <i>${escHtml(st.by)}${st.decidedAt?' · '+escHtml(st.decidedAt):''}</i>` : ''}</div>` : ''}
    ${st.status===HW_APPROVED ? `<div class="hw-ok">${
      st.onSite ? '현장에서 확인받았습니다.' : '확인받았습니다.'}${
      st.by ? ` <i>${escHtml(st.by)}${st.decidedAt?' · '+escHtml(st.decidedAt):''}</i>` : ''}</div>` : ''}
    ${st.status===HW_SUBMITTED ? `<div class="hw-wait">
      ${escHtml(st.submittedAt||'')}에 냈습니다. 강사·조교가 확인하면 완료로 바뀝니다.</div>` : ''}
    ${sent}
    ${uploader}
  </div>`;
}

/* 반 진도와 내 과제를 한 화면에 둔다. «어디까지 나갔는지»와 «내가 뭘 안 냈는지»는
   학생 입장에서 같은 질문이다. */
function stuProgressHTML(c){
  markSeen('homework', c.homework.length);
  const cp = getClassProgress(c.classId);
  const nextUnit = cp.chapters.find(u=>!cp.doneMap[u]);
  const undone = c.homework.filter(a=>!hwIsDone(c.rec, a.id));
  const doneCount = c.homework.length - undone.length;
  /* 마감이 가까운 미완료가 위로, 완료는 아래로. */
  const sorted = c.homework.slice().sort((a,b)=>{
    const ad = hwIsDone(c.rec, a.id), bd = hwIsDone(c.rec, b.id);
    if(ad!==bd) return ad ? 1 : -1;
    return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
  });

  return `
  ${!cp.subject
    ? `<div class="mc"><span style="font-size:12.5px;color:var(--dim);">아직 등록된 진도가 없습니다.</span></div>`
    : `<div class="mc">
        <div class="mrow" style="min-height:0;">
          <span style="flex:1;font-size:13.5px;font-weight:700;">${escHtml(cp.subject)}</span>
          <b class="mono" style="font-size:15px;">${cp.percent}%</b>
        </div>
        <div class="bar" style="margin-top:11px;"><i style="width:${cp.percent}%"></i></div>
        <div style="font-size:12px;color:var(--sub);margin-top:11px;">
          ${cp.doneCount} / ${cp.chapters.length}단원 완료</div>
        <div style="font-size:12px;color:var(--dim);margin-top:5px;">
          다음 · ${nextUnit ? escHtml(nextUnit) : '모든 단원을 끝냈습니다'}</div>
        ${cp.books && cp.books.length ? `<div style="font-size:12px;color:var(--sub);margin-top:9px;
          padding-top:9px;border-top:1px solid var(--line);">교재 · ${
          cp.books.map(b=>escHtml(b)).join(' · ')}</div>` : ''}
      </div>`}

  <div class="msec">과제 <span class="mono" style="color:${undone.length?'var(--late)':'var(--dim)'};">${doneCount}/${c.homework.length}</span></div>
  ${c.homework.length===0
    ? `<div class="mc"><span style="font-size:12.5px;color:var(--dim);">등록된 과제가 없습니다.</span></div>`
    : sorted.map(a=>stuHomeworkCardHTML(c, a)).join('')}

  ${/* 단원 체크리스트는 «읽는 것»이라 손이 닿는 자리(과제) 아래에 둔다.
       카드를 단원마다 하나씩 세우면 열 줄에 480px을 쓴다 — 한 카드 안의 줄로 접었다. */
    cp.chapters.length ? `
  <div class="msec">단원 <span class="mono">${cp.doneCount}/${cp.chapters.length}</span></div>
  <div class="mc" style="padding:4px 15px;">
    ${cp.chapters.map(u=>{
      const on = !!cp.doneMap[u];
      return `<div class="row" style="gap:10px;padding:10px 0;
        ${cp.chapters[0]===u?'':'border-top:1px solid var(--line2);'}">
        <span style="width:18px;height:18px;border-radius:var(--r-xs);flex-shrink:0;
          display:flex;align-items:center;justify-content:center;
          ${on?'background:var(--accent);color:#fff;':'border:1.5px solid #C9C6BB;color:transparent;'}"
          >${iconSvg('check',12)}</span>
        <span style="flex:1;min-width:0;font-size:12.5px;${on?'':'color:var(--dim);'}">${escHtml(u)}</span>
      </div>`;
    }).join('')}
  </div>` : ''}`;
}

/* ---------- 강의시청 ---------- */
/* 이어보기를 맨 위에 둔다. 중단 지점이 기록돼 있는데 목록 맨 아래에서 찾게 하면 결국 안 본다.
   **한 번에 하나만 임베드한다.** 예전에는 목록 수만큼 iframe이 떠서, 영상이 열 개면
   화면을 열자마자 유튜브를 열 번 불렀다. 누른 것 하나만 붙인다. */
/* 학생 쪽 자료 — 받아 가는 곳이라 목록 하나면 된다.
   ⚠ 파일을 앱 안에서 열지 않는다. 드라이브 링크를 새 창으로 넘긴다 —
   PDF·한글을 폰에서 여는 것은 기기가 훨씬 잘한다. */
function stuMaterialHTML(c){
  if(!c.classId) return '<div class="sap-empty">아직 반이 정해지지 않았습니다.</div>';
  loadMaterialsIfNeeded(c.classId);
  const list = (state.materials[c.classId] || []).slice().reverse();
  if(state.materialLoading[c.classId] && !state.materials[c.classId])
    return '<div class="sap-empty">불러오는 중…</div>';
  if(list.length===0) return '<div class="sap-empty">아직 올라온 자료가 없습니다.</div>';
  return list.map(m=>`
    <a class="mc" href="${materialLink(m)}" target="_blank" rel="noopener"
       style="display:block;text-decoration:none;color:inherit;">
      <div class="row" style="gap:7px;">
        <span class="badge">${escHtml(((m.name||'').split('.').pop()||'파일').toUpperCase().slice(0,4))}</span>
        <span class="spacer"></span>
        <span class="mono" style="font-size:10.5px;color:var(--dim);">${escHtml((m.at||'').slice(0,10))}</span>
      </div>
      <div style="font-size:13.5px;font-weight:700;margin-top:8px;line-height:1.5;">${escHtml(m.title)}</div>
      <div style="font-size:11.5px;color:var(--dim);margin-top:5px;">
        ${escHtml(m.name)} · <span class="mono">${fileSizeLabel(m.size)}</span></div>
    </a>`).join('');
}

function stuVideoHTML(c){
  markSeen('video', c.videos.length);
  if(c.videos.length===0) return `<div class="sap-empty">등록된 강의가 없습니다.</div>`;
  const pg = id => c.rec.videoProgress[id] || null;
  const resume = c.videos.find(v=>{ const p = pg(v.id); return p && !p.completed; });
  const open = c.videos.find(v=>v.id===state.stuVideoId);

  const embed = v => {
    const vid = extractYouTubeId(v.url);
    if(!vid) return `<div class="note" style="margin-top:11px;">유튜브 링크 형식을 인식하지 못했습니다.
      선생님께 알려 주세요.</div>`;
    const src = 'https://www.youtube-nocookie.com/embed/' + vid +
      '?enablejsapi=1&modestbranding=1&rel=0&iv_load_policy=3&origin=' + encodeURIComponent(location.origin);
    return `<div class="sap-vwrap"><iframe id="yt-frame-${v.id}" class="yt-tracked-frame"
      data-bank-vid="${v.id}" src="${src}" title="${escHtml(v.title)}"
      sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
      <div id="vprog-${v.id}">${videoProgressBlockHTML(c.sid, v.id)}</div>`;
  };

  return `
  ${resume && (!open || open.id!==resume.id) ? `
  <div class="mc go" onclick="state.stuVideoId='${resume.id}'; render()" style="cursor:pointer;">
    <div style="font-size:11.5px;font-weight:700;color:var(--accent);">이어보기</div>
    <div style="font-size:14.5px;font-weight:700;margin-top:7px;">${escHtml(resume.title)}</div>
    <div class="sap-prog">
      <span class="bar"><i style="width:${pg(resume.id).percent}%"></i></span>
      <b>${pg(resume.id).percent}%</b>
    </div>
    <button class="mbtn p" style="margin-top:12px;">${iconSvg('play',17)} 이어서 보기</button>
  </div>` : ''}

  <div class="msec">전체 강의 <span class="mono">${c.videos.length}</span></div>
  ${c.videos.map(v=>{
    const p = pg(v.id);
    const pct = p ? p.percent : 0;
    const isOpen = open && open.id===v.id;
    return `<div class="mc ${isOpen?'go':''}">
      <div onclick="state.stuVideoId=${isOpen?'null':`'${v.id}'`}; render()" style="cursor:pointer;">
        <div class="row" style="gap:8px;">
          <span style="flex:1;min-width:0;font-size:13.5px;font-weight:600;">${escHtml(v.title)}</span>
          ${v.studentId ? '<span class="badge late">개인 배정</span>' : ''}
        </div>
        ${v.unit ? `<div style="font-size:11.5px;color:var(--dim);margin-top:5px;">${escHtml(v.unit)}</div>` : ''}
        ${/* 열려 있으면 진도 표시는 영상 아래 것 하나만 둔다 — 그쪽이 재생 중에 살아 움직인다 */
          isOpen ? '' : `<div class="sap-prog">
          <span class="bar"><i style="width:${pct}%"></i></span>
          <b style="color:${p && p.completed ? 'var(--ok)' : 'var(--dim)'};">${p && p.completed ? '완료' : pct+'%'}</b>
        </div>`}
      </div>
      ${isOpen ? embed(v) : ''}
    </div>`;
  }).join('')}`;
}

/* ---------- 성적 ---------- */
/* 그래프를 크게 쓴다. 폰에서 표는 읽히지 않고, 학생이 알고 싶은 건 «오르고 있나»다.
   **시험마다 만점이 달라 점수를 그대로 이으면 선이 거짓말을 한다** — 100점 환산해서 잇는다
   (명단의 성적 추이 열과 같은 규칙이다).

   **시안의 「반 평균」은 넣지 않았다.** 그 값을 내려면 같은 반 학생 전원의 기록을
   이 학생 브라우저로 내려받아야 한다. 학생 화면이 남의 성적을 싣는 것은
   화면에 안 보여도 이미 유출이다. */
/* 점이 상자 가장자리에 걸리면 반이 잘린다 — 안쪽으로 pad만큼 들여서 그린다.
   (overflow:visible로 밀어내면 «부모 침범»으로 잡힌다.) */
function stuScoreLineSVG(vals, w, h){
  const pad = 5;
  const mn = Math.max(0, Math.min.apply(null, vals) - 6);
  const mx = Math.min(100, Math.max.apply(null, vals) + 6);
  const r = (mx - mn) || 1;
  let d = '', dots = '';
  vals.forEach((v,i)=>{
    const x = vals.length>1 ? (pad + (w-pad*2) * i / (vals.length-1)) : w/2;
    const y = (h-pad) - ((v - mn) / r) * (h-pad*2);
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--accent)"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function stuScoresHTML(c){
  const scores = (c.rec.scores||[]).filter(s=>s.total);
  if(scores.length===0) return `<div class="sap-empty">아직 등록된 성적이 없습니다.</div>`;
  const pts = scores.map(s=>Math.round(s.score/s.total*100));
  const last = pts[pts.length-1], first = pts[0];
  const delta = last - first;

  return `
  <div class="mc">
    <div class="mrow" style="min-height:0;gap:9px;">
      <span style="flex:1;font-size:12.5px;color:var(--sub);">최근 ${pts.length}회 · 100점 환산</span>
      <b class="mono" style="font-size:22px;">${last}</b>
      ${pts.length>1 ? `<span class="mono ${delta<0?'down':'up'}" style="font-size:12px;">
        ${delta<0?'▼':'▲'}${Math.abs(delta)}</span>` : ''}
    </div>
    ${pts.length>1 ? `<div style="margin-top:16px;">${stuScoreLineSVG(pts, 320, 96)}</div>
    <div class="row" style="justify-content:space-between;margin-top:9px;">
      <span class="mono" style="font-size:10px;color:var(--dim);">${escHtml(scores[0].date||'')}</span>
      <span class="mono" style="font-size:10px;color:var(--dim);">${escHtml(scores[scores.length-1].date||'')}</span>
    </div>` : `<div style="font-size:12px;color:var(--dim);margin-top:10px;">
      기록이 하나뿐이라 아직 추이를 그릴 수 없습니다.</div>`}
  </div>

  <div class="msec">시험</div>
  ${scores.slice().reverse().map(s=>{
    const pct = Math.round(s.score/s.total*100);
    return `<div class="mc">
      <div class="mrow" style="min-height:34px;">
        <span style="flex:1;min-width:0;">
          <b style="display:block;font-size:13.5px;font-weight:600;">${escHtml(s.name)}</b>
          <span class="mono" style="display:block;font-size:11px;color:var(--dim);margin-top:3px;">${escHtml(s.date||'')}</span>
        </span>
        <b class="mono" style="font-size:15px;">${s.score}<s style="text-decoration:none;color:var(--dim);font-size:11px;">/${s.total}</s></b>
        <span class="mono" style="font-size:12px;color:var(--sub);width:38px;text-align:right;">${pct}%</span>
      </div>
    </div>`;
  }).join('')}`;
}

/* ---------- 출석 ---------- */
/* 달력이 맞다 — 출결은 «언제»가 핵심이라 목록으로는 결석이 몰린 시기가 안 보인다.
   5상태 색은 관리자와 같은 것을 쓴다.
   시안은 결석에 «사유»를 달았는데 도메인에 사유 필드가 없다. 지어내지 않았다. */
function stuShiftMonth(ym, delta){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0');
}
function stuAttendanceHTML(c){
  const att = (c.rec.attendance||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(att.length===0) return `<div class="sap-empty">아직 출석 기록이 없습니다.</div>`;
  const ym = state.stuAttMonth || todayStr().slice(0,7);
  const [y, m] = ym.split('-').map(Number);
  /* 🔴 **달력은 «출석률과 같은 줄»을 세야 한다** (2026-09-02 · E-5).
     예전에는 반을 가리지 않고 `byDate[일] = 상태`로 덮어썼다. 그래서 정규반과 특강이
     **같은 요일에 겹치는 학생은 하루에 한 칸밖에 없어 한쪽이 조용히 사라졌다** —
     실제로 「정규 결석 / 특강 출석」인 날이 **초록(출석)으로** 보이고 있었다.
     바로 옆의 출석률(stuAttRate)은 정규만 세는데 달력과 카운터는 섞어 세서
     **같은 화면의 두 숫자가 서로 달랐다.**
     🔵 달력·카운터는 정규(주 반)만 센다. 특강은 아래에 **제 이름을 달고 따로** 선다 —
       리포트가 쓰는 규칙과 같다(E-1b). */
  const mine = attCountedOf(c.rec, c.me).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const byDate = {};
  mine.filter(a=>a.date.slice(0,7)===ym).forEach(a=>{ byDate[Number(a.date.slice(8,10))] = a.status; });
  /* 같은 날 다른 반에 남은 줄 — 칸에 마우스를 올리면 전부 보이게 한다 */
  const dayAll = {};
  att.filter(a=>a.date.slice(0,7)===ym).forEach(a=>{
    const d = Number(a.date.slice(8,10));
    (dayAll[d] = dayAll[d] || []).push(classNameOf(attClassOf(a, studentMainClassId(c.me))) + ' ' + a.status);
  });

  /* 달력 격자 — 1일의 요일만큼 앞을 비운다. 월 길이는 다음 달 0일로 얻는다. */
  const firstDow = new Date(y, m-1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  let cells = WEEKDAY_LABEL.map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0; i<firstDow; i++) cells += '<div class="d off"></div>';
  const today = todayStr();
  for(let d=1; d<=days; d++){
    const ymd = `${ym}-${String(d).padStart(2,'0')}`;
    const st = byDate[d] ? attStatusClass(byDate[d]) : '';
    const tip = (dayAll[d]||[]).length ? ` title="${escHtml(ymd + ' · ' + dayAll[d].join(' · '))}"` : '';
    cells += `<div class="d ${st==='drop'?'':st}${ymd===today?' today':''}"${tip}>${d}</div>`;
  }

  const cnt = {};
  Object.values(byDate).forEach(s=>{ cnt[s] = (cnt[s]||0) + 1; });
  /* 「결석·지각·조퇴」 목록도 정규만 — 위 숫자와 같은 줄을 세야 한다.
     특강 것은 아래 특강 구역이 제 이름을 달고 말한다. */
  const flagged = mine.filter(a=>a.date.slice(0,7)===ym && a.status!=='출석').reverse();
  const rate = stuAttRate(c.rec, c.me);
  /* 특강 구역 — 주 반이 아닌 반마다 그 달을 따로 센다. 그 달에 아무 일도 없던 특강은 뺀다 */
  const extraAtt = studentExtraClassIds(c.me).map(cid=>{
    const rows = attOfClass(c.rec, cid, studentMainClassId(c.me))
      .filter(a=>a.date.slice(0,7)===ym && a.status!=='퇴원');
    return { name: classNameOf(cid), rows, rate: attRateOf(rows) };
  }).filter(x=>x.rows.length);

  return `
  <div class="mc">
    <div class="mrow" style="min-height:0;">
      <button class="sap-navbtn" onclick="state.stuAttMonth='${stuShiftMonth(ym,-1)}'; render()">${iconSvg('chevL',17)}</button>
      <span class="spacer"></span>
      <b style="font-size:14.5px;">${y}년 ${m}월</b>
      <span class="spacer"></span>
      <button class="sap-navbtn" onclick="state.stuAttMonth='${stuShiftMonth(ym,1)}'; render()">${iconSvg('chevR',17)}</button>
    </div>
    <div class="cal" style="margin-top:12px;">${cells}</div>
  </div>

  <div class="msec">이번 달</div>
  <div class="kpis">
    ${/* 0을 상태색으로 칠하지 않는다 — 빨간 「결석 0」은 없는 일을 있는 것처럼 읽힌다 */
      [['출석','ok'],['지각','late'],['조퇴','leave'],['결석','no']].map(s=>
      `<div class="kpi"><div class="k">${s[0]}</div>
        <div class="v" style="color:${cnt[s[0]] ? `var(--${s[1]})` : 'var(--dim)'};">${cnt[s[0]]||0}</div></div>`).join('')}
  </div>
  <div style="font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.7;">
    ${extraAtt.length ? '정규 수업' : '전체'} 출석률
    <b class="mono" style="color:var(--ink);">${rate===null?'—':rate+'%'}</b>
    — 퇴원 기록을 뺀 전체 중 결석이 아닌 비율입니다. 지각·조퇴는 «온 것»으로 셉니다.
    ${extraAtt.length ? '<br>위 달력과 숫자는 <b>정규 수업</b>만입니다 — 특강은 아래에 따로 있습니다.' : ''}</div>

  ${extraAtt.length ? `
  <div class="msec">특강</div>
  ${extraAtt.map(x=>`<div class="mc">
    <div class="row" style="gap:8px;">
      <span style="font-size:12.5px;font-weight:700;">${escHtml(x.name)}</span>
      <span class="spacer"></span>
      <b class="mono" style="font-size:12.5px;">${x.rate===null?'—':x.rate+'%'}</b>
    </div>
    <div style="font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.7;">
      ${['출석','지각','조퇴','결석'].map(st=>{
        const k = x.rows.filter(a=>a.status===st).length;
        return k ? st + ' ' + k + '일' : '';
      }).filter(Boolean).join(' · ')}
    </div>
  </div>`).join('')}` : ''}

  ${flagged.length ? `
  <div class="msec">결석 · 지각 · 조퇴</div>
  ${flagged.map(a=>`<div class="mc">
    <div class="row" style="gap:8px;">
      <span class="badge ${attStatusClass(a.status)==='drop'?'gone':attStatusClass(a.status)}">${a.status}</span>
      <span style="font-size:12.5px;font-weight:600;">${stuDateLabel(a.date)}</span>
      <span class="spacer"></span>
      <span class="mono" style="font-size:10.5px;color:var(--dim);">${escHtml(a.date)}</span>
    </div>
  </div>`).join('')}` : ''}`;
}

/* ---------- 공지사항 ---------- */
/* 안 읽은 공지에 왼쪽 accent 바를 단다. 관리자 화면에서 «선택»을 뜻하던 그 표시와 같은 모양이다.
   읽음 판정은 «개수»다 (unseenCount) — 공지는 최신순으로 쌓이므로 앞의 n개가 새 것이다.
   개별 읽음 상태를 두려면 학생마다 필드를 더해야 하는데, 이 정도 데이터엔 과하다. */
function stuNoticeHTML(){
  const unread = unseenCount('notice', DATA.notices.length);
  markSeen('notice', DATA.notices.length);
  if(DATA.notices.length===0) return `<div class="sap-empty">등록된 공지가 없습니다.</div>`;
  return DATA.notices.map((n,i)=>`
    <div class="mc" style="${i<unread ? 'border-left:3px solid var(--accent);' : 'opacity:.78;'}">
      <div class="row" style="gap:7px;">
        ${i<unread ? '<span class="badge no">새 공지</span>' : ''}
        <span class="spacer"></span>
        <span class="mono" style="font-size:10.5px;color:var(--dim);">${escHtml(n.date||'')}</span>
      </div>
      <div style="font-size:13.5px;${i<unread?'font-weight:700;':''}margin-top:8px;line-height:1.55;">${escHtml(n.title)}</div>
      ${n.content ? `<div class="ntx" style="font-size:12.5px;margin-top:8px;">${noticeBodyHTML(n.content)}</div>` : ''}
    </div>`).join('');
}

/* ---------- 클리닉 신청 ---------- */
/* 빈 시간을 먼저 보여주고 고르게 한다. 날짜를 적어 신청하고 기다리는 방식이면
   거절될 때마다 처음부터 다시 해야 한다.
   경로는 셋인데 학생이 쓰는 것은 둘이다 — ①열린 시간대에서 고르기 ②희망 시간 직접 제안.
   (③교사 직접 배정은 관리자 화면에 있다.) */
/* 고른 시간대를 켜고 끈다. **같은 날 안에서만** 여러 개를 고를 수 있다 —
   클리닉 한 번은 한 자리에서 이어 앉는 일이라, 날짜가 섞이면 그건 신청 둘이다. */
function stuToggleSlot(id){
  const s = DATA.clinicSlots.find(x=>x.id===id);
  if(!s) return;
  let ids = (state.stuClinicSlotIds || []).slice();
  const others = ids.map(i=>DATA.clinicSlots.find(x=>x.id===i)).filter(Boolean);
  if(others.length && others[0].date !== s.date){
    ids = [];                                    // 날짜를 바꾸면 앞의 선택은 버린다
    showToast('다른 날짜를 골라 앞의 선택을 비웠습니다.');
  }
  ids = ids.includes(id) ? ids.filter(x=>x!==id) : ids.concat(id);
  state.stuClinicSlotIds = ids;
  render();
}

  const slots = openClinicSlots();

      <span class="mono" style="font-size:11.5px;">${escHtml(cl.day||'')}</span>
      <span style="font-size:12.5px;font-weight:600;">${escHtml(clinicWhenLabel(cl))}</span>
      ${clinicSlotIds(cl).length===0 ? '<span class="badge">직접 제안</span>' : ''}

      onclick="cancelClinicRequest('${cl.id}')">신청 취소</button>` : ''}

  <div class="msec">새로 신청</div>
  <div class="row" style="gap:7px;margin-bottom:12px;">
    <a class="pill ${mode==='slot'?'on':''}" onclick="state.clinicApplyMode='slot'; render()">
      열린 시간대${slots.length?` <b>${slots.length}</b>`:''}</a>
    <a class="pill ${mode==='free'?'on':''}" onclick="state.clinicApplyMode='free'; render()">희망 시간 제안</a>
  </div>

  ${mode==='slot' ? (slots.length===0
    ? `<div class="sap-empty">지금 열려 있는 시간대가 없습니다.<br>「희망 시간 제안」으로 신청해 보세요.</div>`
    : `<div style="font-size:11.5px;color:var(--dim);margin:-4px 0 10px;line-height:1.7;">
        오래 남을 거라면 <b style="color:var(--ink);">이어지는 시간대를 여러 개</b> 고르세요.
        다시 누르면 빠집니다.</div>
      ${slots.map(s=>{
        const left = s.capacity - clinicSlotBookedCount(s.id);
        const on = pickedIds.includes(s.id);
        return `<div class="mc ${on?'go':''}" onclick="stuToggleSlot('${s.id}')" style="cursor:pointer;">
          <div class="mrow" style="min-height:30px;gap:10px;">
            <span style="width:20px;height:20px;border-radius:var(--r-xs);flex-shrink:0;
              display:flex;align-items:center;justify-content:center;
              ${on?'background:var(--accent);color:#fff;':'border:1.5px solid #C9C6BB;color:transparent;'}"

        <div class="sap-lab" style="margin-top:11px;">무엇을 묻고 싶나요?</div>

        <button class="mbtn p" style="margin-top:11px;" onclick="submitClinicRequest(false)">

        <div><div class="sap-lab">시작</div>

      </div>

        <div><div class="sap-lab">마지막 (선택)</div>
          <input id="clinic-free-end" class="sap-in" type="time" step="1800"></div>
        <div style="font-size:11px;color:var(--dim);align-self:end;padding-bottom:9px;line-height:1.6;">

      </div>
      <div class="sap-lab" style="margin-top:13px;">무엇을 묻고 싶나요?</div>
      <input id="clinic-topic" class="sap-in" placeholder="예: 미적분Ⅰ 도함수의 활용">

/* ---------- 채팅 ---------- */
/* 관리자 채팅(12-chat)과 같은 말풍선이다. 학생 쪽에서는 선생님 말이 왼쪽, 내 말이 오른쪽에 온다.
   날짜가 바뀌는 자리에 구분선을 넣는다 — 「어제 한 말」과 「오늘 한 말」은 다른 무게를 갖는다. */
function stuChatHTML(c){
  const chat = DATA.chats[c.sid] || [];
  if(!DATA.chats[c.sid]) loadChat(c.sid).then(()=>render());
  /* 대화를 «연» 순간이 읽은 순간이다. 학생 벨의 「선생님 답장」이 여기서 꺼진다. */
  markSeen('chat:'+c.sid, chat.filter(m=>m.from==='teacher').length);
  let lastDay = '';
  const bubbles = chat.map(m=>{
    const day = (m.at||'').slice(0,10);
    const time = (m.at||'').slice(11,16);
    let sep = '';
    /* ds.css의 .chat-day span은 mono다 — 「오늘」 같은 낱말은 넣지 않고 날짜 그대로 둔다. */
    if(day && day!==lastDay){ lastDay = day; sep = `<div class="chat-day"><span>${escHtml(day)}</span></div>`; }
    return sep + `<div class="bub-row ${m.from==='student'?'me':''}">
      <div class="bub" style="max-width:70%;">${escHtml(m.text)}</div>
      <span class="tm">${escHtml(time)}</span>
    </div>`;
  }).join('');

  return `
  <div class="sap-chat">
    ${chat.length===0
      ? `<div class="sap-empty">아직 주고받은 말이 없습니다.<br>궁금한 것을 편하게 남겨 주세요.</div>`
      : bubbles}
  </div>
  <div class="row" style="gap:8px;">
    <input id="chat-input-student" class="sap-in" placeholder="메시지 입력"
      onkeydown="if(chatSendKey(event)) sendChatMessage('${c.sid}','student')">
    <button class="btn p" style="height:46px;flex-shrink:0;"
      onclick="sendChatMessage('${c.sid}','student')">전송</button>
  </div>`;
}

/* ---------- 셸 ---------- */
/* 알림 벨 — 학생·관리자가 같이 쓴다.
   items는 화면마다 다르지만(studentNotifItems / teacherNotifItems) 껍데기는 하나다.
   구버전 notificationBellHTML은 공용 헤더에 붙어 있었는데, 그 헤더가 사라지면서
   각 셸의 상단바로 들어왔다. */
function bellHTML(items){
  /* 항목이 «안 읽은 수»를 스스로 들고 오면 그것을 쓴다 (채팅처럼 학생별로 세는 것).
     keepUnseen이면 눌러도 읽음으로 찍지 않는다 — 벨을 눌렀다고 읽은 것은 아니다. */
  const n = it => it.unseen !== undefined ? it.unseen : unseenCount(it.key, it.count);
  const total = items.reduce((sum,it)=>sum + n(it), 0);
  const unseen = items.filter(it=>n(it)>0);
  return `<div class="ds-bell">
    <button onclick="state.notifOpen=!state.notifOpen; render()">${iconSvg('bell',19)}
      ${total>0 ? `<span class="n">${total>9?'9+':total}</span>` : ''}</button>
    ${state.notifOpen ? `<div class="ds-drop">
      ${unseen.length===0 ? '<div class="em">새 알림이 없습니다</div>'
      : unseen.map(it=>`<div class="it" onclick="${it.gotoCode} ${
          it.keepUnseen ? '' : `markSeen('${it.key}', ${it.count});`}
          state.notifOpen=false; render()">
          <span>${it.label}</span><b>${n(it)}</b></div>`).join('')}
    </div>` : ''}
  </div>`;
}

function studentTabBodyHTML(c){
  const t = state.studentTab;
  if(t==='home')       return stuHomeHTML(c);
  if(t==='quiz')       return stuQuizHTML(c);
  if(t==='wronghw')    return stuWrongHTML(c);
  if(t==='progress')   return stuProgressHTML(c);
  if(t==='video')      return stuVideoHTML(c);
  if(t==='material')   return stuMaterialHTML(c);
  if(t==='grades')     return stuScoresHTML(c);
  if(t==='attendance') return stuAttendanceHTML(c);
  if(t==='notice')     return stuNoticeHTML();
  if(t==='qna')        return stuQnaHTML(c);
  if(t==='clinic')     return stuClinicHTML(c);
  if(t==='chat')       return stuChatHTML(c);
  return stuHomeHTML(c);
}

/* =================== 조교 (design-v1/18-assistant) ===================
   **따로 만든 화면이 아니라 관리자 화면을 «권한»으로 좁힌 것이다.**
   구버전이 여기 남아 있던 이유는 «DS 학생 상세가 기본정보·삭제까지 열어 두기 때문»이었는데,
   그건 화면의 문제가 아니라 권한의 문제다. 화면을 두 벌로 두면 앞으로 모든 변경을
   두 번 해야 하고 반드시 한쪽만 고쳐진다 (신호 규칙을 signalOf() 하나로 합친 것과 같은 이유).
   → 명단은 .rst-*, 학생 상세는 sdScreenHTML을 그대로 쓰고 «못 하는 것»만 뺀다.

   **상단바에 메뉴가 없다.** 갈 곳이 하나뿐인데 메뉴를 만들면 그게 거짓말이다.
   대신 「조교」 뱃지와 담당 반을 둔다 — 자기가 누구로 있는지가 늘 보여야 한다. */

           «자기가 누구로 있는지»가 늘 보여야 하므로 숫자로 뭉뚱그리지 않는다. */''}
      <div class="as-who">

/* 담당 반 명단 — 01-roster에서 «조교가 손댈 수 없는 열»을 뺐다.
   반 진도(05가 전담하는 신호 등급도) · 시청률(영상은 강사가 올린다).
   남은 열은 전부 조교가 «넣는» 것이다. 일괄 작업도 없다.

   ⚠ **「반」 열은 담당 반이 둘 이상일 때만 세운다** (2026-08-11). 예전에는 반이 하나뿐이라
   아예 뺐는데, 여러 반을 맡게 되면 그 열이 없으면 «이 학생이 어느 반인지»를 알 수 없다.
   반을 하나 골라 본 상태에서는 다시 뺀다 — 한 열에 같은 값만 스무 줄 서는 것은 자리 낭비다. */
function assistantRosterHTML(cu){
  const q = (state.rosterSearchQuery||'').trim().toLowerCase();
  const flag = state.asFlag || '';
  const ids = assistantClassIds(cu);
  /* 고른 반이 «지금도 내 반인지»를 매번 본다 — 강사가 반을 뺏은 뒤에도 state에 남아 있으면
     그 반 학생이 계속 보인다. */
  const pick = ids.includes(state.asClassId) ? state.asClassId : '';
  const multi = ids.length > 1;
  const wide = multi && !pick;              // 「반」 열을 세울 때
  const full = DATA.students.filter(s=> pick
    ? studentClassIds(s).includes(pick)
    : studentClassIds(s).some(id=>ids.includes(id)));

  const rows = full.map(s=>({s, st: rosterStats(s)}))
    .filter(r=>!r.st.withdrawn)                 // 퇴원은 명단에서 뺀다. 섞이면 모든 숫자가 흐려진다
    .filter(r=>!q || (r.s.name||'').toLowerCase().includes(q)
                  || (r.s.studentId||'').toLowerCase().includes(q));

  const hwLeft   = rows.filter(r=>r.st.hwTotal && r.st.hwDone < r.st.hwTotal).length;
  const wrongLeft= rows.filter(r=>r.st.wrongLeft > 0).length;
  const shown = rows.filter(r=>
    flag==='hw'    ? (r.st.hwTotal && r.st.hwDone < r.st.hwTotal)
  : flag==='wrong' ? r.st.wrongLeft > 0
  : true);

  const pill = (id, label, n) => `<a class="pill ${flag===id?'on':''}"
    onclick="state.asFlag='${flag===id?'':id}'; render()">${label} <b>${n}</b></a>`;

  /* 머리말은 «지금 무엇을 보고 있는가»를 말한다 — 반을 고르면 그 반, 아니면 담당 전체. */
  const head = pick
    ? { title: classNameOf(pick),
        sub: ((DATA.classes.find(c=>c.id===pick)||{}).schedule || '일정 미등록') + ' · ' + rows.length + '명' }
    : multi
    ? { title: '담당 반 ' + ids.length + '개', sub: assistantClassLabel(ids) + ' · ' + rows.length + '명' }
    : { title: classNameOf(ids[0]),
        sub: ((DATA.classes.find(c=>c.id===ids[0])||{}).schedule || '일정 미등록') + ' · ' + rows.length + '명' };

  /* 반 고르개는 «담당 반이 둘 이상일 때만» 나온다. 하나뿐인데 「전체 / 그 반」 둘을 그리면
     고를 것이 없는 줄이 된다 (명단 화면의 뷰 축과 같은 부품을 쓴다). */
  const views = !multi ? '' : `<div class="rst-views">
    <a class="pill ${pick?'':'on'}" onclick="state.asClassId=''; render()">전체 <b>${
      DATA.students.filter(s=>ids.includes(s.classId) && !rosterStats(s).withdrawn).length}</b></a>
    ${ids.map(id=>`<a class="pill ${pick===id?'on':''}" onclick="state.asClassId='${id}'; render()">${
      escHtml(classNameOf(id))} <b>${
      DATA.students.filter(s=>studentClassIds(s).includes(id) && !rosterStats(s).withdrawn).length}</b></a>`).join('')}
  </div>`;

  return `
  <div class="rst-screen">
    <div class="rst-head">
      <div class="rst-hrow">
        <h1 class="t-title">${escHtml(head.title)}<s>${escHtml(head.sub)}</s></h1>
      </div>
      <p class="as-lede">
        <b>성적 · 출결 · 과제 · 오답</b>을 넣을 수 있습니다.
        학생 등록·삭제, 반 이동, 개인정보 수정은 강사만 할 수 있습니다.
      </p>
      ${views}
      <div class="rst-fbar">
        <span class="field rst-selwrap">${iconSvg('search',15)}
          <input id="roster-search" value="${escHtml(state.rosterSearchQuery||'')}" placeholder="이름 · 아이디로 찾기"
            oninput="liveEdit(event, v=>state.rosterSearchQuery=v)" oncompositionend="liveEdit(event, v=>state.rosterSearchQuery=v)"></span>
        ${pill('hw', '과제 미완', hwLeft)}
        ${pill('wrong', '오답 미제출', wrongLeft)}
        <span class="rst-cnt">${pick ? escHtml(classNameOf(pick)) : '담당 반'} <b>${shown.length}</b>명</span>
      </div>
    </div>

    <div class="rst-wrap">
      ${ids.length===0
        ? '<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.8;">맡은 반이 없습니다.<br>강사에게 담당 반 배정을 요청해 주세요.</div>'
        : full.length===0
        ? '<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">아직 담당 반에 배정된 학생이 없습니다.</div>'
        : shown.length===0
        ? '<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">해당하는 학생이 없습니다.</div>'
        : `<table class="grid as-narrow">
        <thead><tr>
          <th style="width:236px;">학생</th>
          ${wide ? '<th style="width:130px;">반</th>' : ''}
          <th style="width:64px;">학년</th>
          <th class="r" style="width:78px;">출석률</th>
          <th style="width:120px;">최근 8회</th>
          <th class="r" style="width:72px;">과제</th>
          <th class="r" style="width:72px;">오답</th>
          <th style="width:200px;">성적 추이</th>
          <!-- 폭을 비워 두면 남는 자리를 이 열이 흡수한다. 오른쪽 정렬이라 버튼은 끝에 붙고,
               비는 것은 «성적 추이와 버튼 사이»가 되어 여백으로 읽힌다.
               성적 추이에 흡수시키면 스파크라인 옆이 900px 텅 빈다. -->
          <th class="r"></th>
        </tr></thead>
        <tbody>
        ${shown.map(({s, st})=>`
          <tr>
            <td><div class="rst-sig" style="cursor:pointer;" onclick="sdOpen('${s.studentId}')">
              <span class="av">${escHtml((s.name||'?').slice(0,1))}</span>
              <span class="nm" style="min-width:0;overflow:hidden;text-overflow:ellipsis;">${escHtml(s.name)}
                <s>${escHtml(s.studentId)}</s></span></div></td>
            ${wide ? `<td class="sub" title="${escHtml(classNameOf(s.classId))}">${escHtml(classNameOf(s.classId))}</td>` : ''}
            <td>${escHtml(s.grade||'—')}</td>
            <td class="r mono ${st.attPct!==null && st.attPct<85 ? 'warn':''}">${st.attPct===null?'—':st.attPct+'%'}</td>
            <td>${rosterDots(st.att8)}</td>
            <td class="r mono">${st.hwTotal ? st.hwDone+'/'+st.hwTotal : '—'}</td>
            <td class="r mono ${st.wrongLeft?'cau':''}">${st.wrongLeft||0}</td>
            <td>${rosterSpark(st.scores)}</td>
            <td class="r"><button class="btn sm" onclick="sdOpen('${s.studentId}')">기록 넣기</button></td>
          </tr>`).join('')}
        </tbody></table>`}
    </div>
  </div>`;
}

/* ---------- 관리자 셸 ----------
   좌측 사이드바 5그룹을 버리고 상단바 메뉴 + 서브탭으로 바꿨다.
   메뉴는 여기 한 곳에서만 정의한다 — 화면마다 손으로 적으면 반드시 어긋난다.

   🔴 **「명단」 탭을 없앴다 (2026-09-01 · C-13 · 사용자가 정했다).**
   사용자의 말 — 「**여기 이식하고나면 명단탭은 없어도 될 것같아**」.
   **화면이 사라진 것이 아니라 «문»이 하나로 줄었다** — 명단은 이제 「반 › 학생」이다.
   같은 곳으로 가는 문이 둘이면 검색칸·정렬·고른 반이 둘 사이에서 새는데,
   실제로 사용자가 그것을 짚었다 — 「**반-학생탭이 검색창이 명단탭의 검색창이랑 이어지는 것 같아**」.
   ⚠ **순서도 사용자가 정했다** — 「반-수업-오답-소통-신호-설정」.
     «반»이 첫머리인 것은 로그인 첫 화면이 그리로 가기 때문이다(→ `teacherHTML`). */
const TEACHER_NAV = [
  ['반',   'classhub'],
  ['수업', 'session'],
  ['오답', 'review'],
  ['소통', 'clinic'],
  ['신호', 'signals'],
  ['설정', 'settings']
];

/* 서브탭 — [라벨, 탭, 반 관리 내부탭?]
   🔴 **「학생」은 이제 «명단» 그 자체다** (2026-09-01 · C-13). 세 판에 걸쳐 여기까지 왔다 —
     ① 08-30(C-3) 「학생 명단」을 눌렀더니 **반에서 튕겨 나갔다**. 상단이 「명단」으로 넘어가고
        반 서브탭이 통째로 사라져 보고 있던 반까지 잃었다. 그래서 반 «안»으로 데려왔다
     ② 09-01(C-12) 반 안에 갇히니 **학교별로 훑을 수가 없었다**. 고르개를 살렸다
     ③ 09-01(C-13) **「명단」 탭을 없애고 이 자리 하나만 남겼다.** 문이 둘이면 검색칸이 샌다
   ⚠ **「학생」이 맨 앞인 것은 로그인 첫 화면이기 때문이다** (→ `state.classHubTab` 기본값). */
const TEACHER_SUBNAV = {
  '반': [
    ['학생',       'classhub', 'students'],
    ['출결',       'classhub', 'sessions'],
    ['성적',       'classhub', 'scores'],
    ['과제',       'classhub', 'homework'],
    ['상담',       'classhub', 'consult'],
    ['수업 기록',  'classhub', 'log'],
    ['진도',       'classhub', 'progress'],
    ['데일리퀴즈', 'classhub', 'quiz'],
    ['영상',       'classhub', 'video'],
    ['자료',       'classhub', 'material']
  ],
  /* 「제출 현황」은 시험지 화면의 우측 칸으로 흡수했다 (시안 07). 서브탭에서 뺐다. */
  '오답': [
    ['검토', 'review'], ['시험지', 'exams'], ['보충문제 창고', 'unitbank'], ['문항 코드', 'itemcode']
  ],
  /* 「출석 도장」이 여기 있는 이유 — «신호»는 지표를 세우는 화면이고 «명단»은 평가하는
     화면이라, 놀이를 그 옆에 두면 놀이가 그 성격을 물려받는다. 소통이 제일 안 다치는 자리다. */
  '소통': [
    ['클리닉', 'clinic'], ['공지', 'notices'],
    ['질의응답', 'qna'], ['채팅', 'chat'], ['출석 도장', 'checkin']
  ]
};

/* 탭이 어느 상위 메뉴에 속하는지.
   ⚠ `roster`·`home`은 여기 없다 — 둘 다 「반 › 학생」으로 옮겨졌고,
     옛 세션·북마크가 들고 있으면 `teacherHTML`이 첫 줄에서 갈아 끼운다. */
const TEACHER_TAB_SECTION = {
  signals:'신호',
  classhub:'반', session:'수업',
  /* ⚠ 여기와 TEACHER_SUBNAV 는 **둘 다** 고쳐야 한다 — 노트가 적어 둔 그것이다.
     itemcode 를 서브탭에만 넣고 여기를 빠뜨렸더니 상단 메뉴가 「반」으로 잡히고
     서브탭 줄이 통째로 반의 것으로 그려졌다 (2026-09-03). */
  review:'오답', exams:'오답', unitbank:'오답', itemcode:'오답',
  clinic:'소통', notices:'소통', qna:'소통', chat:'소통', checkin:'소통',
  settings:'설정'
};


function goTeacherTab(tab, hubTab){
  state.teacherTab = tab;
  state.studentDetailId = null;
  if(hubTab) state.classHubTab = hubTab;
  /* 🔴 **여기서 `classHubId`를 비우지 않는다** (2026-09-01 · C-13에서 뺐다).
     예전에는 상단 「반」을 누를 때마다 첫 반으로 되돌렸다 — 그때는 반을 고르는 자리가
     왼쪽 목록뿐이라 손해가 없었다. 지금은 **학생 명단의 고르개가 그 반을 정한다**.
     비우면 「고20.5B」를 골라 놓고 상단 「반」을 한 번 누르는 순간 조용히 첫 반으로
     되돌아가고, 그 뒤 출결·성적이 엉뚱한 반을 연다. */
  render();
}

function teacherTabBodyHTML(){
  /* 「제출 현황」은 시험지 화면으로 흡수됐다. 예전 세션이 그 탭을 들고 있으면
     기본값(반 관리)으로 떨어지므로 흡수된 곳으로 보낸다. */
  if(state.teacherTab==='submissions') state.teacherTab = 'exams';
  const t = state.teacherTab;
  if(t==='signals')     return teacherSignalsHTML();
  if(t==='session')     return teacherSessionHTML();
  if(t==='classhub')    return teacherClassHubHTML();
  if(t==='clinic')      return teacherClinicHTML();
  if(t==='notices')     return teacherNoticesHTML();
  if(t==='qna')         return teacherQnaHTML();
  if(t==='chat')        return teacherChatHTML();
  if(t==='checkin')     return teacherCheckinHTML();
  if(t==='exams')       return teacherExamsHTML();
  if(t==='review')      return teacherReviewHTML();
  if(t==='unitbank')    return teacherUnitBankHTML();
  if(t==='itemcode')    return teacherItemCodeHTML();
  if(t==='settings')    return teacherSettingsHTML();
  return teacherClassHubHTML();
}

function teacherHTML(){
  /* 🔴 **옛 자리를 새 자리로 갈아 끼운다** (2026-09-01 · C-13) —
     `roster`(없어진 「명단」 탭)와 `home`(상단바에 없던 로그인 기본값) 둘 다
     **「반 › 학생」이 받는다.** 저장된 세션·북마크(`#teacher/roster`)가 그 값을 들고 온다.
     ⚠ **여기서 한다** — 본문(`teacherTabBodyHTML`)에서 고치면 상단 메뉴는 이미
       옛 값으로 그려진 뒤라 «메뉴는 명단, 본문은 반»으로 한 판이 어긋난다. */
  if(state.teacherTab==='roster' || state.teacherTab==='home'){
    state.teacherTab = 'classhub';
    state.classHubTab = 'students';
  }
  const section = TEACHER_TAB_SECTION[state.teacherTab] || '반';
  const subs = TEACHER_SUBNAV[section];
  const subActive = s => state.teacherTab===s[1] && (!s[2] || state.classHubTab===s[2]);
  /* 벨이 «새 채팅»을 세려면 대화를 알고 있어야 한다. 셸에서 한 번만 부른다. */
  loadAllChatsIfNeeded();
  /* 「과제 제출 확인 대기」도 같은 이유로 기록이 있어야 센다 — 어느 화면에 있든 벨은 떠 있다. */
  loadAllRecordsIfNeeded();
  const body = teacherTabBodyHTML();

  return `
  <div class="app">
    <div class="topbar">
      <div class="bm">김하현수학연구소</div>
      <nav>${TEACHER_NAV.map(n=>
        `<a class="${n[0]===section?'on':''}" onclick="goTeacherTab('${n[1]}')">${n[0]}</a>`
      ).join('')}</nav>
      <div class="right">
        ${bellHTML(teacherNotifItems())}
        <span class="who">김하현T</span>
        <button class="btn sm" onclick="logout()">로그아웃</button>
      </div>
    </div>
    ${subs ? `<div class="subnav">${subs.map(s=>
      `<a class="${subActive(s)?'on':''}" onclick="goTeacherTab('${s[1]}'${s[2]?`,'${s[2]}'`:''})">${s[0]}</a>`
    ).join('')}</div>` : ''}
    <div class="body">${body}</div>
  </div>`;
}

/* =================== 명단 (design-v1/01-roster) ===================
   A1의 밀도를 A3의 언어로. 역할은 «전체를 훑고 · 걸러내고 · 한꺼번에 처리한다».

   목업과 다른 점 — 목업은 「고2 미적분Ⅰ」 반 하나를 이미 고른 상태를 그렸다.
   실서비스는 반이 여러 개고 미배정 학생도 있어서 «모집단(뷰)»을 먼저 고르게 했다.
   반을 고르면 「반」·「반 진도」 열은 사라진다 — 행마다 같은 값을 되풀이하지 않는다.

   목업에 있었으나 넣지 않은 것:
     열 선택(15/22) · 사용자 저장 뷰 · 과제 일괄 배포 · 학부모 문자 · 클리닉 배정
   전부 도메인 레이어에 없는 신규 기능이다. 눌러도 아무 일 없는 버튼은 두지 않는다.
   (과제는 반 단위로만 배포되게 돼 있어 «선택한 학생에게»가 데이터 구조상 성립하지 않는다.) */

/* 출석률 = 「퇴원」을 뺀 전체 기록 중 「결석」이 아닌 비율.
   지각·조퇴는 «온 것»으로 센다. 여기서 묻는 것은 «왔는가»이고,
   «얼마나 있었는가»는 학생 상세의 출석 기록이 답한다. */
function rosterStats(s){
  const sid = s.studentId;
  const rec = state.allRecords[sid] || {};

  /* 🔴 **명단·신호는 «주 반» 출결만 센다** (2026-09-01 · E-1 · 사용자가 「가르자」로 정했다).
     특강 결석이 여기 섞이면 정규반 신호가 켜지고, 그 신호를 아무도 안 믿게 된다. */
  const att = attCountedOf(rec, s).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const attPct = attRateOf(att);

  /* 시험마다 만점이 달라 점수를 그대로 이으면 선이 거짓말을 한다. 100점 환산해서 잇는다.
     🔴 **주 반 시험만 잇는다** (2026-09-01 · E-2) — 특강 점수가 섞이면 두 반의 난이도가
       한 선에 얹혀 「성적 급락」이 엉뚱하게 켜진다. 출결을 가른 것과 같은 까닭이다. */
  const scores = scoresCountedOf(rec, s).filter(sc=>sc.total).map(sc=>Math.round(sc.score/sc.total*100));
  const drop = scores.length>1 ? scores[0] - scores[scores.length-1] : 0;

  /* 과제·영상은 «듣는 반 전부»에서 온다 — 특강 과제도 이 학생의 과제다 (E-1). */
  const myClasses = studentClassIds(s);
  const hws = DATA.assignments.filter(a=>!a.classId || myClasses.includes(a.classId));
  const hwDone = hws.filter(a=>hwIsDone(rec, a.id)).length;

  /* ⚠ 없는 문항을 가리키는 숙제는 세지 않는다 — 학생이 손쓸 수 없는 것으로 「위험」을 만들면
     그 신호는 영원히 안 꺼진다. 실제로 고아 9건이 한 학생을 위험 1순위로 올려 두고 있었다.
     («검토 중»인 것은 여기서 아직 센다 — 뜻이 다른 이야기라 따로 정한다.) */
  const wrongLeft = liveWrongHomework(rec).filter(h=>!h.done).length;

  const vids = DATA.videos.filter(v=>v.studentId ? v.studentId===sid : (!v.classId || myClasses.includes(v.classId)));
  const vidPct = vids.length ? Math.round(vids.reduce((sum,v)=>{
    const p = rec.videoProgress && rec.videoProgress[v.id];
    if(!p) return sum;
    return sum + (p.completed ? 100 : Math.max(0, Math.min(100, Math.round(p.percent||0))));
  }, 0) / vids.length) : null;

  return {
    att8: att.slice(-8), attPct, scores, drop,
    hwDone, hwTotal: hws.length, wrongLeft, vidPct,
    withdrawn: isWithdrawn(s, rec),
    /* 퇴원의 «언제·왜»를 말하려면 학생 자체가 필요하다 — `withdrawnAt`은 기록이 아니라
       학생 문서에 있다(W-1). 신호 열이 이걸 쓴다. */
    student: s,
    /* 대표 반의 진도 — 특강만 듣는 학생도 제 반의 진도를 본다 (E-4). */
    prog: studentPrimaryClassId(s) ? getClassProgress(studentPrimaryClassId(s)) : null
  };
}

/* =================== 신호 규칙 (명단·신호 공용) ===================
   **명단(01)과 신호(05)는 반드시 이 함수 하나만 본다.** 규칙이 두 벌로 갈라지는 순간
   화면끼리 숫자가 어긋나고, 그러면 두 화면 다 못 믿게 된다.

   등급은 셋. 늘리지 않는다 — 사람이 한 번에 판단할 수 있는 층은 셋이 한계다.
     위험 r  «무거운 신호» 2개 이상                → 즉시 연락
     주의 y  무거운 신호 1개 또는 시청률 70% 미만  → 이번 주 안에 개입
     관찰 g  경미한 신호만                        → 추세만 지켜본다

   시안(05-signals)은 위험을 «출석률<80 그리고 시청률<50»으로 못박았는데,
   그러면 결석이 잦아도 영상만 잘 본 학생이 어디에도 안 걸린다.
   실데이터에 맞춰 «무거운 신호 2개 이상»으로 바꿨다.

   **임계값은 상수가 아니라 설정이다 (설정 > 신호 규칙).** 학원마다 다르고 학기마다 달라진다.
   등급을 «어떻게» 매기는지(무거운 신호 2개 = 위험)는 여기 고정이고,
   각 신호가 «언제» 켜지는지만 연다. 층을 정하는 규칙까지 열면 화면끼리 말이 달라진다. */

const SIGNAL_GRADE = {
  r: { label:'위험', badge:'no',   todo:'즉시 연락 권장',     cond:'무거운 신호 2개 이상' },
  y: { label:'주의', badge:'late', todo:'이번 주 안에 개입',  cond:'무거운 신호 1개 · 시청률 저조' },
  g: { label:'관찰', badge:'',     todo:'추세만 지켜보는 중', cond:'경미한 신호 하나' }
};
/* 등급 조건 문장은 임계값을 따라가야 한다 — 설정에서 70을 60으로 바꿨는데
   화면이 「70% 미만」이라고 적혀 있으면 둘 중 하나는 거짓말이 된다. */
function gradeCond(k){
  return k === 'y' ? `무거운 신호 1개 · 시청률 ${signalRules().vidWarn}% 미만` : SIGNAL_GRADE[k].cond;
}

/* 임계값 아홉 개 — 저장은 신호 해제와 같은 방식이다 (컬렉션 대신 kv 문서 하나).
   ⚠ 앞의 일곱이 **명단 · 신호 · 학생 상세 세 화면의 등급**을 한꺼번에 정한다.
   ⚠ 뒤의 둘(`rpRed`·`rpYellow`)은 **월간 리포트의 막대 색에만** 쓰인다 (2026-09-01).
     같은 kv 문서에 담는 까닭은 **임계값이 한 곳에만 있어야 하기 때문**이다 —
     흩어 두면 «어디서 정하는 값이더라»를 다시 찾아야 한다. */
const SIGNAL_DEFAULTS = { absent:2, attPct:80, drop:8, wrong:3, vidHeavy:50, vidWarn:70, vidLight:80,
                          rpRed:60, rpYellow:80 };
const SIGNAL_LIMITS   = { absent:[1,8], attPct:[1,100], drop:[1,100], wrong:[1,99],
                          vidHeavy:[0,100], vidWarn:[0,100], vidLight:[0,100],
                          rpRed:[0,100], rpYellow:[0,100] };
const SIGNAL_RULE_LABELS = { absent:'연속 결석', attPct:'출석률', drop:'성적 급락', wrong:'오답 미제출',
                             vidHeavy:'시청률 무거움', vidWarn:'시청률 주의', vidLight:'시청률 경미',
                             rpRed:'리포트 빨강', rpYellow:'리포트 노랑' };

function clampRule(k, n){
  const [lo, hi] = SIGNAL_LIMITS[k] || [0, 100];
  return Math.min(hi, Math.max(lo, Math.round(n)));
}
/* 저장된 값이 비었거나 깨져 있어도 화면이 멈추면 안 된다 — 읽을 때마다 기본값에 덮어 씌우고
   범위와 순서를 바로잡는다. 그래서 이 함수를 통하지 않고 state.signalRules를 직접 보지 않는다. */
function signalRules(){
  const saved = state.signalRules || {};
  const r = {};
  for(const k in SIGNAL_DEFAULTS){
    const n = Number(saved[k]);
    r[k] = Number.isFinite(n) ? clampRule(k, n) : SIGNAL_DEFAULTS[k];
  }
  // 시청률 셋은 항상 «무거움 ≤ 주의 ≤ 경미»다. 뒤집히면 어느 구간도 성립하지 않는다.
  r.vidWarn  = Math.max(r.vidWarn, r.vidHeavy);
  r.vidLight = Math.max(r.vidLight, r.vidWarn);
  // 리포트 색도 같다 — 빨강 ≤ 노랑이 아니면 «빨강도 노랑도 아닌» 구간이 생긴다.
  r.rpYellow = Math.max(r.rpYellow, r.rpRed);
  return r;
}

function signalOf(st){
  if(st.withdrawn) return null;              // 퇴원은 트리아지 대상이 아니다
  const R = signalRules();
  const rules = [];
  const absent = st.att8.filter(a=>a.status==='결석').length;
  const push = (name, heavy, why) => rules.push({ name, heavy, why });

  if(absent >= R.absent)                          push('연속 결석',   true,  `최근 ${st.att8.length}회 중 결석 <b>${absent}</b>`);
  if(st.attPct !== null && st.attPct < R.attPct)  push('출석률 저조', true,  `출석률 <b>${st.attPct}%</b>`);
  if(st.drop >= R.drop)                           push('성적 급락',   true,  `성적 <b>${st.scores[0]}→${st.scores[st.scores.length-1]}</b>`);
  if(st.wrongLeft >= R.wrong)                     push('오답 미제출', true,  `오답숙제 <b>${st.wrongLeft}건</b> 미제출`);
  else if(st.wrongLeft > 0)                       push('오답 미제출', false, `오답숙제 <b>${st.wrongLeft}건</b> 미제출`);
  if(st.vidPct !== null && st.vidPct < R.vidHeavy)      push('시청률 저조', true,  `강의 시청 <b>${st.vidPct}%</b>`);
  else if(st.vidPct !== null && st.vidPct < R.vidLight) push('시청률 저조', false, `강의 시청 <b>${st.vidPct}%</b>`);
  if(st.hwTotal && st.hwDone < st.hwTotal) push('과제 누락',   false, `과제 <b>${st.hwDone}/${st.hwTotal}</b>`);

  if(rules.length === 0) return null;

  const heavy = rules.filter(r=>r.heavy).length;
  const grade = heavy >= 2 ? 'r'
