/* ---------- 출석부 (반별 일괄 입력) ---------- */
// 반+날짜 조합이 바뀔 때만 draft를 저장된 값(또는 미입력 상태)으로 새로 채운다.
// 같은 조합에 머무는 동안은 학생별로 누른 상태/입력 중인 사유를 그대로 유지한다.
function ensureAttDraft(classId, date){
  const key = classId + '|' + date;
  if(state.attDraftKey === key) return;
  state.attDraftKey = key;
  state.attDraft = {};
  DATA.students.filter(s=>s.classId===classId).forEach(s=>{
    const rec = state.allRecords[s.studentId];
    const existing = rec && (rec.attendance||[]).find(a=>a.date===date);
    state.attDraft[s.studentId] = existing ? {status:existing.status, reason:existing.reason||'', videoUrl:''} : {status:null, reason:'', videoUrl:''};
  });
}
function setAttStatus(studentId, status){
  const cur = state.attDraft[studentId] || {reason:'', videoUrl:''};
  state.attDraft[studentId] = {status, reason: status==='출석' ? '' : cur.reason, videoUrl: status==='결석' ? cur.videoUrl : ''};
  render();
}
function setAllPresent(classId){
  DATA.students.filter(s=>s.classId===classId).forEach(s=>{
    state.attDraft[s.studentId] = {status:'출석', reason:'', videoUrl:''};
  });
  render();
}
function teacherAttendanceHTML(fixedClassId){
  loadAllRecordsIfNeeded();
  const classId = fixedClassId || state.attendanceClassId;
  const date = state.attendanceDate || todayStr();
  const roster = classId ? DATA.students.filter(s=>s.classId===classId) : [];
  if(classId && state.allRecordsLoaded) ensureAttDraft(classId, date);
  return `
  <div class="panel">
    <h3>출석 입력</h3>
    <div class="inline-form" style="align-items:flex-end;">
      ${fixedClassId ? '' : `<div class="field"><label>반</label><select onchange="state.attendanceClassId=this.value; render()">
        <option value="">-- 반 선택 --</option>
        ${DATA.classes.map(c=>`<option value="${c.id}" ${classId===c.id?'selected':''}>${escHtml(c.name)}</option>`).join('')}
      </select></div>`}
      <div class="field" style="max-width:200px;"><label>날짜</label><input type="date" value="${date}" onchange="state.attendanceDate=this.value; render()"></div>
      ${classId && state.allRecordsLoaded && roster.length>0 ? `
      <button class="btn" onclick="setAllPresent('${classId}')">전체 출석</button>
      <button class="btn btn-primary" onclick="saveClassAttendance('${classId}','${date}')">저장</button>` : ''}
    </div>
    ${!classId ? '<div class="empty">반을 선택해주세요.</div>' :
      !state.allRecordsLoaded ? '<div class="empty">학생 기록을 불러오는 중입니다...</div>' :
      roster.length===0 ? '<div class="empty">이 반에 배정된 학생이 없습니다.</div>' : `
      ${roster.map(s=>{
        const d = state.attDraft[s.studentId] || {status:null, reason:'', videoUrl:''};
        return `<div class="att-row">
          <div class="att-name">${escHtml(s.name)} <span class="mono" style="font-size:11px;color:var(--ink-soft);">(${s.studentId})</span></div>
          <div class="att-btn-group">
            ${['출석','지각','결석'].map(st=>`<button class="att-status-btn att-${st==='출석'?'ok':st==='지각'?'late':'no'} ${d.status===st?'active':''}" onclick="setAttStatus('${s.studentId}','${st}')">${st}</button>`).join('')}
          </div>
          ${(d.status==='지각'||d.status==='결석') ? `<input class="att-reason-input" id="att-reason-${s.studentId}" placeholder="사유 입력 (선택)" value="${escHtml(d.reason)}" oninput="state.attDraft['${s.studentId}'].reason=this.value">` : ''}
          ${d.status==='결석' ? `<input class="att-reason-input" id="att-video-${s.studentId}" placeholder="보충 영상 유튜브 링크 (선택 — 이 학생에게만 보여요)" value="${escHtml(d.videoUrl)}" oninput="state.attDraft['${s.studentId}'].videoUrl=this.value">` : ''}
        </div>`;
      }).join('')}
    `}
  </div>
  ${classId && state.allRecordsLoaded && roster.length>0 ? `
  <div class="panel">
    <h3>${classNameOf(classId)} 출결 누적 집계</h3>
    <table><tr><th>학생</th><th>출석</th><th>지각</th><th>결석</th></tr>
    ${roster.map(s=>{
      const list = (state.allRecords[s.studentId] && state.allRecords[s.studentId].attendance) || [];
      const count = st => list.filter(a=>a.status===st).length;
      return `<tr><td>${escHtml(s.name)}</td><td>${count('출석')}</td><td>${count('지각')}</td><td>${count('결석')}</td></tr>`;
    }).join('')}
    </table>
  </div>` : ''}`;
}
async function saveClassAttendance(classId, date){
  const roster = DATA.students.filter(s=>s.classId===classId);
  const newVideos = [];
  await Promise.all(roster.map(async s => {
    const d = state.attDraft[s.studentId];
    if(!d || !d.status) return; // 아무도 안 건드린 학생은 건너뛴다
    const rec = await loadRecord(s.studentId);
    const idx = rec.attendance.findIndex(a=>a.date===date);
    if(idx>=0) rec.attendance[idx] = {date, status:d.status, reason:d.reason||''};
    else rec.attendance.push({date, status:d.status, reason:d.reason||''});
    rec.attendance.sort((a,b)=>a.date.localeCompare(b.date));
    await saveRecord(s.studentId);
    if(state.allRecords[s.studentId]) state.allRecords[s.studentId] = rec;
    // 결석 처리하면서 보충 영상 링크를 같이 넣었으면, 그 학생에게만 보이는 개인 영상으로 등록한다.
    if(d.status==='결석' && d.videoUrl && d.videoUrl.trim()){
      const url = d.videoUrl.trim();
      if(extractYouTubeId(url)){
        newVideos.push({id:'v'+Date.now()+'_'+s.studentId, unit:'', title:date+' 결석 보충 영상', url, classId:'', studentId:s.studentId});
      } else {
        showToast(escHtml(s.name)+'의 보충 영상 링크 형식이 올바르지 않아 등록하지 못했습니다.');
      }
    }
  }));
  if(newVideos.length>0){
    DATA.videos.unshift(...newVideos);
    await dbSet('videos', DATA.videos);
  }
  showToast('출석이 저장되었습니다.' + (newVideos.length>0 ? ` 보충 영상 ${newVideos.length}건도 배정했어요.` : ''));
  render();
}

/* ---------- 영상 (부교재 해설강의) ---------- */
// 학생 한 명이 자기 반에 해당하는 영상들을 얼마나 봤는지 집계 (반 관리 허브의 영상 서브탭에서 사용).
function studentVideoSummary(studentId, classId){
  const relevantVideos = DATA.videos.filter(v => v.studentId ? v.studentId===studentId : (!v.classId || v.classId===classId));
  const rec = state.allRecords[studentId];
  let completed = 0, sumPercent = 0;
  const details = relevantVideos.map(v => {
    const p = rec && rec.videoProgress && rec.videoProgress[v.id];
    if(p && p.completed) completed++;
    sumPercent += (p ? p.percent : 0);
    return { video: v, p };
  });
  const avg = relevantVideos.length ? Math.round(sumPercent/relevantVideos.length) : 0;
  return { total: relevantVideos.length, completed, avg, details };
}

        <div style="font-size:13.5px;white-space:pre-wrap;margin-top:8px;">${escHtml(b.content)}</div>

        <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-top:8px;">정답: ${escHtml(b.answer)}</div>
      </div>`).join('')}
  </div>`;
}

// 알림 드롭다운이 열려있을 때 벨 바깥을 클릭하면 닫는다.
document.addEventListener('click', (e) => {
  if(state.notifOpen && !e.target.closest('.notif-bell')){
    state.notifOpen = false;
    render();
  }
});

// 브라우저 뒤로가기/앞으로가기 시 주소창 해시에 맞춰 화면을 복원한다.
window.addEventListener('popstate', (e) => {
  const desired = e.state ? e.state.view : (location.hash.replace(/^#\/?/,'').split('/')[0] || 'home');
  state.view = viewAllowedForCurrentUser(desired);
  if(e.state && state.view==='teacher' && e.state.teacherTab) state.teacherTab = e.state.teacherTab;
  if(e.state && state.view==='student' && e.state.studentTab) state.studentTab = e.state.studentTab;
  const correctedHash = buildHashFromState();
  // 로그인 상태와 안 맞아 다른 화면으로 안전하게 리다이렉트된 경우, 주소창 해시도 그 화면에 맞게 바로잡는다.
  if(correctedHash !== location.hash) history.replaceState({view:state.view, teacherTab:state.teacherTab, studentTab:state.studentTab}, '', correctedHash);
  lastSyncedHash = correctedHash; // 복원 자체가 새 push를 유발하지 않도록 먼저 맞춰둠
  render();
});
