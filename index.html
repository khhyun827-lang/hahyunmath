<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김하현수학연구소 | 고등수학 전문</title>
<meta name="description" content="기록하는 수학 학원. 출결·진도·오답·질문이 모두 남고, 틀린 문항은 쌍둥이 문항이 되어 다시 돌아옵니다.">
<meta property="og:title" content="김하현수학연구소">
<meta property="og:description" content="기록하는 수학 학원. 출결·진도·오답·질문이 모두 남습니다.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 구버전(Noto Sans KR·Serif 900)과 ds.css(Serif 600·Mono 500)가 쓰는 굵기를 한 요청에 합쳤다.
     이행이 끝나 구버전 화면이 사라지면 Noto Sans KR과 Serif 900은 빼면 된다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="ds.css">

<style>
/* ============================================================
   실서비스 셸 — «배치»만 둔다. 색·서체·반경·간격은 ds.css 토큰을 쓴다.
   목업은 1440×900 캔버스 안에서 절대배치라 .topbar/.subnav가 absolute이고
   .body가 top:52px로 떠 있다. 실제 앱은 «스크롤하는 문서»라 그대로 쓸 수 없다.
   여기서 바꾸는 것은 position 뿐이다.
   ============================================================ */
.app{background:var(--paper);color:var(--ink);min-height:100vh;
  font-family:'Pretendard',-apple-system,sans-serif;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
.app .topbar{position:sticky;top:0;}
.app .subnav{position:sticky;top:52px;}
/* .body는 ds.css에서 absolute·top:52px다. 스크롤 문서에서는 그냥 흐르게 둔다. */
.app .body{position:static;padding:20px;}
.app .topbar .bm{display:flex;align-items:center;gap:9px;}
.app .topbar .bm img{height:22px;width:auto;display:block;}
.app .topbar nav a{cursor:pointer;}
.app .subnav a{cursor:pointer;}

/* ---------- 명단 (design-v1/01-roster) ----------
   목업은 .main을 absolute로 잡고 액션바를 캔버스 바닥(bottom:0)에 붙인다.
   실서비스는 스크롤하는 문서라 «흐르는 표 + 뷰포트에 고정된 액션바»가 된다.
   ds.css의 클래스 이름은 여기서 다시 정의하지 않는다 — 전부 rst- 접두사다.
   (.actbar의 position만 예외다. 위 규칙대로 position만 바꾼다.) */
.app .rst-hrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.app .rst-views{display:flex;align-items:center;gap:7px;margin-top:16px;flex-wrap:wrap;}
.app .rst-fbar{display:flex;align-items:center;gap:8px;margin-top:13px;padding-bottom:13px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;}
.app .rst-fbar .field{width:262px;}
.app .rst-fbar .field input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:inherit;font-size:12.5px;color:var(--ink);}
.app .rst-cnt{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap;}
.app .rst-cnt b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600;}
.app .rst-selwrap{padding-right:6px;}
.app .rst-sel{border:0;background:transparent;outline:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink);}

/* 머리말은 고정하고 표«만» 스크롤한다 — 목업의 .main / .tablewrap과 같은 구조다.
   문서 스크롤에 맡기고 th를 top:52px로 붙이는 방법은 쓸 수 없다.
   가로 스크롤 때문에 .rst-wrap이 overflow:auto가 되는 순간 그 안이 새 스크롤포트가 되어
   sticky 기준이 뷰포트가 아니라 이 상자로 바뀌고, 헤더가 52px 내려와 첫 행을 덮는다.
   높이 92px = 상단바 52 + .body 상하 패딩 20+20. (서브탭 있는 화면으로 옮길 땐 +42) */
/* ⚠ 스크롤 상자는 반드시 position:relative여야 한다.
   KaTeX가 수식마다 position:absolute인 .katex-mathml을 넣는데, 조상 중에 위치 지정된 것이 없으면
   그 요소의 기준이 «문서»가 되어 overflow:auto가 잡아 주지 못한다.
   실제로 시험지 화면에서 문서가 3736px 세로로 늘어났다 (수식이 상자 밖에 «있는» 것으로 계산된다).
   세로로 스크롤하는 상자를 새로 만들 때마다 이 줄을 같이 넣을 것. */
.app .rst-wrap, .app .sig-list, .app .cls-body, .app .chub-body, .app .chub-lbody,
.app .rv-body, .app .rv-lbody, .app .sd-tl, .app .sd-lbody, .app .sd-ctx,
.app .co-body, .app .co-sbody, .app .ch-lbody, .app .ch-win,
.app .ex-body, .app .ex-lbody, .app .vd-main{position:relative;}

.app .rst-screen{display:flex;flex-direction:column;height:calc(100vh - 92px);}
.app .rst-head{flex-shrink:0;}
.app .rst-wrap{flex:1;min-height:0;overflow:auto;margin-top:2px;}
.app .rst-wrap table.grid thead th{position:sticky;top:0;z-index:2;}
/* 행 높이는 40px로 고정한다. 한 행이라도 두 줄이 되면 표의 리듬이 깨진다.
   그래서 table-layout:fixed로 열 너비를 못 박고, 넘치는 글자는 …로 자른다.
   1440 캔버스를 전제로 그린 표다. 그보다 좁은 화면에서는 표«만» 가로로 스크롤한다
   (문서 전체가 밀리면 상단바까지 따라 움직여서 어디에 있는지 알 수 없게 된다). */
.app .rst-wrap table.grid{table-layout:fixed;min-width:1418px;}
/* 반을 고르면 「반」·「반 진도」 두 열이 빠진다. 그만큼 최소 너비도 줄여야
   좁은 화면에서 괜히 가로 스크롤이 남는다. */
.app .rst-wrap table.grid.narrow{min-width:1214px;}
.app .rst-wrap td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app .rst-wrap .cb{cursor:pointer;}

.app .rst-sig{display:flex;align-items:center;gap:6px;min-width:0;}
.app .rst-sig .why{flex:1;min-width:0;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;}
.app .rst-act{display:flex;gap:5px;justify-content:flex-end;opacity:0;transition:opacity var(--t);}
.app .rst-wrap tbody tr:hover .rst-act,
.app .rst-act:focus-within{opacity:1;}

/* ---------- 신호 (design-v1/05-signals) ----------
   등급으로 묶은 한 줄기 세로 목록. 명단의 .rst-screen 골격을 그대로 쓴다. */
.app .sig-list{flex:1;min-height:0;overflow:auto;}
/* 등급 머리 — 연대기의 날짜 자리와 같은 역할이라 스크롤에 붙여 둔다 */
.app .sig-ghead{display:flex;align-items:center;gap:9px;padding:22px 2px 9px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;}
.app .sig-ghead b{font-size:13px;font-weight:700;}
.app .sig-n{font-size:12px;font-weight:600;color:var(--dim);}
.app .sig-do{font-size:12px;color:var(--sub);}
.app .sig-cond{margin-left:auto;font-size:11px;color:var(--dim);}

/* 한 줄 = 한 학생. 근거 문장이 주인공이다 — 뱃지만 있으면 «위험하다»만 알고 아무 것도 못 한다. */
.app .sig-row{display:flex;align-items:center;gap:13px;padding:12px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .sig-row:hover{background:var(--hover);}
.app .sig-row.off{opacity:.5;}
.app .sig-who{width:198px;flex-shrink:0;display:flex;align-items:center;gap:10px;cursor:pointer;}
.app .sig-t{min-width:0;}
.app .sig-t b{display:block;font-size:13.5px;font-weight:600;}
.app .sig-t span{display:block;font-size:11.5px;color:var(--dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .sig-mid{flex:1;min-width:0;cursor:pointer;}
.app .sig-rules{display:flex;gap:5px;flex-wrap:wrap;}
.app .sig-why{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.55;}
.app .sig-why b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);}
.app .sig-num{width:104px;flex-shrink:0;text-align:right;}
.app .sig-sc{font-size:15px;font-weight:600;letter-spacing:-.02em;}
.app .sig-num .dots{justify-content:flex-end;margin-top:6px;}
.app .sig-act{width:250px;flex-shrink:0;display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;
  opacity:0;transition:opacity var(--t);}
.app .sig-row:hover .sig-act,
.app .sig-act:focus-within{opacity:1;}
/* 위험은 미루면 안 된다. 이 등급만 조치 버튼을 상시 노출한다 —
   장식이 아니라 등급 차이를 «행동»으로 드러내는 유일한 지점이다. */
.app .sig-row.now .sig-act,
.app .sig-row.off .sig-act{opacity:1;}

/* ---------- 수업 (design-v1/02-class) ----------
   목업은 좌측 사이드바를 캔버스에 absolute로 붙였다. 실서비스는 그냥 두 칸 플렉스다.
   ds.css의 .steps / .tile / .seg / .actbar 는 그대로 쓴다 — 여기서 다시 정의하지 않는다. */
.app .cls-screen{display:flex;height:calc(100vh - 92px);}
.app .cls-side{width:270px;flex-shrink:0;padding-right:18px;border-right:1px solid var(--line);
  overflow-y:auto;}
.app .cls-main{flex:1;min-width:0;padding-left:24px;display:flex;flex-direction:column;}
.app .cls-mh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;flex-shrink:0;}
.app .cls-nav{display:flex;align-items:center;gap:8px;}
.app .cls-day{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
  white-space:nowrap;}

/* 오늘의 수업 — 시간이 1차 축이다. 반을 고르는 것이 아니라 «지금 하는 수업»을 고른다. */
.app .cls-sess{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 15px;margin-bottom:9px;position:relative;cursor:pointer;
  transition:border-color var(--t),background var(--t);}
.app .cls-sess:hover{background:var(--hover);}
.app .cls-sess.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(63,53,55,.1);}
.app .cls-sess .t{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);font-weight:600;}
.app .cls-sess .n{font-size:14px;font-weight:700;margin-top:5px;letter-spacing:-.02em;}
.app .cls-sess .m{font-size:11.5px;color:var(--sub);margin-top:5px;}
.app .cls-sess .st{position:absolute;right:13px;top:13px;}

.app .cls-todo{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px 15px;}
.app .cls-todo a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink);cursor:pointer;}
.app .cls-todo a:last-child{border-bottom:none;}
.app .cls-todo a:hover{color:var(--accent);}
.app .cls-todo a b{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
  background:var(--line2);border-radius:var(--r-xs);padding:2px 8px;color:var(--sub);}
.app .cls-todo a.hot b{background:var(--nobg);color:var(--no);}

/* 단계 본문«만» 스크롤한다. 머리말·단계 막대는 늘 보여야 어디까지 했는지 안다. */
.app .cls-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* align-items:start — 사유 칸이 붙어 커진 타일에 같은 행의 멀쩡한 타일까지 끌려가지 않게 한다.
   높이가 들쭉날쭉해지지만, 그 차이가 곧 «여기 손볼 게 남았다»는 신호라 오히려 읽기 쉽다. */
.app .cls-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  align-content:start;align-items:start;}
@media (max-width:1180px){ .app .cls-tiles{grid-template-columns:repeat(2,1fr);} }
/* 사유·보충영상 칸이 붙는 타일은 세로로 자란다. ds.css의 .tile은 64px 고정이라 여기서 푼다. */
.app .cls-tiles .tile{height:auto;min-height:64px;flex-wrap:wrap;padding:11px 13px;}
.app .cls-tiles .tile .seg{margin-left:auto;}
.app .cls-sub{flex:0 0 100%;display:flex;gap:6px;margin-top:9px;}
.app .cls-sub input{flex:1;min-width:0;height:30px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--paper);padding:0 9px;
  font-family:inherit;font-size:12px;color:var(--ink);outline:none;}
.app .cls-sub input:focus{border-color:var(--accent-line);}

.app .cls-form{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-top:11px;}
.app .cls-form label{display:flex;flex-direction:column;gap:5px;}
.app .cls-form label span{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.02em;}
.app .cls-form input,.app .cls-form textarea{border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);
  outline:none;width:100%;resize:vertical;}
.app .cls-form input:focus,.app .cls-form textarea:focus{border-color:var(--accent-line);}

.app .cls-memo{width:100%;min-height:220px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--note);padding:15px 17px;font-family:inherit;font-size:13.5px;line-height:1.75;
  color:var(--ink);outline:none;resize:vertical;}
.app .cls-memo:focus{border-color:var(--accent-line);}

.app .cls-chaps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.app .cls-chap{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;font-size:13px;
  cursor:pointer;transition:background var(--t),border-color var(--t);}
.app .cls-chap:hover{background:var(--hover);}
.app .cls-chap.on{background:var(--accent-bg);border-color:var(--accent-line);font-weight:600;}

.app .cls-hw{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 16px;margin-bottom:9px;display:flex;align-items:center;gap:14px;}
.app .cls-hw .n{flex:1;min-width:0;font-size:13.5px;font-weight:600;}
.app .cls-hw .n s{display:block;text-decoration:none;font-size:11.5px;font-weight:400;color:var(--dim);margin-top:3px;}

/* ---------- 반 관리 (design-v1/06-classes 외) ----------
   시안의 핵심은 «좌측 반 목록이 네 화면 공통»이라는 것이다. 예전에는 목록 화면과 상세 화면이
   따로여서 반을 바꿀 때마다 «← 반 목록으로»를 눌러 돌아가야 했다. 목록을 늘 띄워 두면 그 왕복이 사라진다.
   높이 134px = 상단바 52 + 서브탭 42 + .body 상하 패딩 40. */
.app .chub-screen{display:flex;height:calc(100vh - 134px);}
.app .chub-side{width:250px;flex-shrink:0;padding-right:16px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;}
.app .chub-lh{display:flex;align-items:center;flex-shrink:0;padding-bottom:10px;}
.app .chub-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
/* 반 하나 = 한 항목. 진도 막대를 항목 안에 두면 목록만 봐도 어디가 밀렸는지 보인다. */
.app .chub-cl{padding:10px 12px;border-left:3px solid transparent;border-radius:0 var(--r-md) var(--r-md) 0;
  cursor:pointer;transition:background var(--t);}
.app .chub-cl:hover{background:var(--hover);}
.app .chub-cl.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .chub-cl .n{font-size:13.5px;font-weight:600;}
.app .chub-cl .m{font-size:11.5px;color:var(--dim);margin-top:3px;}
.app .chub-cl .p{display:flex;align-items:center;gap:8px;margin-top:8px;}
.app .chub-cl .p .bar{flex:1;}
.app .chub-cl .p span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}
.app .chub-cl.off .n{color:var(--dim);font-weight:500;}

.app .chub-main{flex:1;min-width:0;padding-left:24px;display:flex;flex-direction:column;}
.app .chub-mh{display:flex;align-items:flex-start;gap:14px;flex-shrink:0;}
.app .chub-mh .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.app .chub-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* 아직 DS로 안 옮긴 서브탭은 이 안에서 구버전 스타일 그대로 그린다. */

/* 단원 체크리스트 — 표가 아니라 «목록»이다. 열이 많은 표는 훑는 데 좋고,
   순서가 있는 것은 목록이 낫다. 진도는 순서가 전부다. */
.app .chub-u{display:flex;align-items:center;gap:13px;padding:11px 2px;
  border-bottom:1px solid var(--line2);cursor:pointer;transition:background var(--t);}
.app .chub-u:hover{background:var(--hover);}
.app .chub-u .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid #C9C6BB;
  background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:11px;font-weight:700;transition:all var(--t);}
.app .chub-u.done .ck{background:var(--accent);border-color:var(--accent);color:#fff;}
.app .chub-u.now .ck{border-color:var(--accent);border-style:dashed;}
.app .chub-u .no{width:22px;flex-shrink:0;font-family:'JetBrains Mono',monospace;
  font-size:11.5px;color:var(--dim);}
.app .chub-u .t{flex:1;min-width:0;font-size:13.5px;}
.app .chub-u.done .t{color:var(--sub);}
.app .chub-u.wait .t{color:var(--dim);}
.app .chub-u .st{flex-shrink:0;}

/* 수업 기록 (design-v1/14-log) — 한 행이 한 번의 수업. 그날 남은 것이 전부 그 행 안에 있다. */
.app .chub-fbar{display:flex;align-items:center;gap:7px;padding-bottom:13px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);flex-shrink:0;}
.app .chub-sess{display:flex;gap:18px;padding:15px 2px;border-bottom:1px solid var(--line2);
  cursor:pointer;transition:background var(--t);}
.app .chub-sess:hover{background:var(--hover);}
.app .chub-sess .when{width:104px;flex-shrink:0;}
.app .chub-sess .when .d{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;}
.app .chub-sess .when .w{font-size:11px;color:var(--dim);margin-top:4px;}
.app .chub-sess .mid{flex:1;min-width:0;}
.app .chub-sess .att{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.app .chub-sess .att .sum{font-size:12.5px;color:var(--sub);}
.app .chub-sess .att .sum b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);}
.app .chub-sess .memo{margin-top:10px;background:var(--note);border:1px solid var(--note-line);
  border-radius:var(--r-md);padding:9px 12px;font-size:12.5px;color:var(--sub);line-height:1.7;
  white-space:pre-wrap;}
.app .chub-sess .tags{width:186px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;
  align-items:flex-end;font-size:11.5px;color:var(--dim);text-align:right;}
.app .chub-dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;
  padding-bottom:13px;border-bottom:1px solid var(--line);}

/* 데일리퀴즈 (design-v1/15-quiz) — 1차 축은 문항이 아니라 «회차의 흐름»이다. */
.app .qz-strip{padding:16px 18px 12px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--card);flex-shrink:0;}
.app .qz-sh{display:flex;align-items:baseline;gap:10px;margin-bottom:24px;}
.app .qz-sh b{font-size:12.5px;font-weight:700;}
.app .qz-sh span{font-size:11.5px;color:var(--dim);}
.app .qz-sh .r{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);}
.app .qz-bars{display:flex;align-items:flex-end;gap:6px;height:92px;border-bottom:1px solid var(--line);}
.app .qz-b{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  height:100%;cursor:pointer;min-width:0;}
.app .qz-b i{display:block;width:100%;background:#CFCBC2;border-radius:4px 4px 0 0;
  transition:background var(--t);min-height:2px;}
/* 순서가 곧 우선순위다. «낮음»보다 «지금 보고 있는 것»이 위여야 한다 —
   .low를 뒤에 두면 선택된 막대가 노란색에 덮여 어느 회차를 보고 있는지 알 수 없다. */
.app .qz-b.low i{background:var(--late);}
.app .qz-b.on i{background:var(--accent);}
.app .qz-b:hover i{background:var(--accent-d);}
/* 값은 선택된 회차와 가장 낮은 회차에만 붙인다 — 전부 붙이면 읽히지 않는다 */
.app .qz-b .v{position:absolute;top:-17px;left:0;right:0;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--ink);}
.app .qz-xax{display:flex;gap:6px;margin-top:7px;}
.app .qz-xax span{flex:1;min-width:0;text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--dim);overflow:hidden;white-space:nowrap;}

.app .qz-body{display:flex;gap:22px;margin-top:18px;align-items:flex-start;flex-wrap:wrap;}
.app .qz-q{flex:1;min-width:280px;}
.app .qz-qbox{background:var(--note);border:1px solid var(--note-line);border-radius:var(--r-lg);
  padding:14px 16px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;}
.app .qz-subs{width:330px;flex-shrink:0;}
.app .qz-sr{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2);}
.app .qz-sr .t{flex:1;min-width:0;font-size:12.5px;}
.app .qz-sr .t span{display:block;font-size:11px;color:var(--dim);margin-top:1px;}
.app .qz-sr .a{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
  max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (max-width:1080px){ .app .qz-subs{width:100%;} }

/* 영상 (design-v1/16-videos) — 역할은 «시청률»이 아니라 «어디서 멈췄나»다. */
.app .vd-screen{display:flex;gap:0;}
.app .vd-list{width:264px;flex-shrink:0;border-right:1px solid var(--line);
  padding-right:14px;margin-right:18px;}
.app .vd-item{padding:12px;border-left:3px solid transparent;border-bottom:1px solid var(--line2);
  border-radius:0 var(--r-md) var(--r-md) 0;cursor:pointer;transition:background var(--t);}
.app .vd-item:hover{background:var(--hover);}
.app .vd-item.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .vd-item .t{font-size:13px;font-weight:600;line-height:1.5;}
.app .vd-item .m{display:flex;align-items:center;gap:8px;margin-top:7px;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);}
.app .vd-item .p{display:flex;align-items:center;gap:9px;margin-top:8px;}
.app .vd-item .p .bar{flex:1;}
.app .vd-item .p b{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;}
.app .vd-main{flex:1;min-width:0;}

/* 이탈 지점 — 학생이 «어디까지 보고 멈췄는가»의 분포. 10구간 + 완주 칸. */
.app .vd-drop{padding:16px 18px 12px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--card);}
.app .vd-dh{display:flex;align-items:baseline;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.app .vd-dh b{font-size:12.5px;font-weight:700;}
.app .vd-dh span{font-size:11.5px;color:var(--dim);}
.app .vd-dh .r{margin-left:auto;font-size:11px;color:var(--dim);}
.app .vd-bars{display:flex;align-items:flex-end;gap:4px;height:74px;border-bottom:1px solid var(--line);}
.app .vd-bars .b{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  height:100%;min-width:0;}
.app .vd-bars .b i{display:block;width:100%;background:#DEDAD1;border-radius:4px 4px 0 0;min-height:1px;}
.app .vd-bars .b.peak i{background:var(--no);}
.app .vd-bars .b.end i{background:var(--ok);}
/* 시안은 left/right를 -14px로 빼 라벨을 막대보다 넓게 잡았는데, 실서비스에서는 그만큼
   .vd-bars의 scrollWidth가 커져 가로 넘침으로 잡힌다. 막대 폭이 충분하므로 제 박스 안에 둔다
   (퀴즈 스트립도 같은 방식이다). */
.app .vd-bars .b .v{position:absolute;top:-17px;left:0;right:0;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;}
.app .vd-dax{display:flex;gap:4px;margin-top:7px;}
.app .vd-dax span{flex:1;min-width:0;text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--dim);}

.app .vd-sv{display:flex;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .vd-sv:hover{background:var(--hover);}
.app .vd-sv .who{width:150px;flex-shrink:0;display:flex;align-items:center;gap:9px;min-width:0;}
.app .vd-sv .who b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .vd-sv .track{flex:1;min-width:0;height:16px;background:var(--line2);border-radius:4px;overflow:hidden;}
.app .vd-sv .track i{display:block;height:100%;border-radius:4px;background:#CFCBC2;}
.app .vd-sv.done .track i{background:var(--ok);}
.app .vd-sv.low .track i{background:var(--no);}
.app .vd-sv .pct{width:46px;flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;}
.app .vd-sv .st{width:64px;flex-shrink:0;text-align:right;}
@media (max-width:1000px){
  .app .vd-screen{flex-direction:column;}
  .app .vd-list{width:100%;border-right:0;border-bottom:1px solid var(--line);
    padding-right:0;margin-right:0;margin-bottom:16px;}
}

/* ---------- 오답 검토 (design-v1/04-review) ----------
   시안이 A4에서 흡수한 것 셋 — 큐 · 2열 비교 · 키보드. 다크 테마는 버렸다.
   높이 134px = 상단바 52 + 서브탭 42 + .body 상하 패딩 40. */
.app .rv-screen{display:flex;height:calc(100vh - 134px);}
.app .rv-queues{width:196px;flex-shrink:0;padding-right:14px;border-right:1px solid var(--line);
  overflow-y:auto;}
.app .rv-qn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-md);
  font-size:12.5px;color:var(--sub);cursor:pointer;transition:background var(--t),color var(--t);}
.app .rv-qn:hover{background:var(--hover);color:var(--ink);}
.app .rv-qn.on{background:var(--accent-bg);color:var(--accent);font-weight:700;}
.app .rv-qn b{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;}

/* min-height:0이 없으면 플렉스 항목의 최소 높이가 «내용 크기»가 되어, 안에 든 KaTeX 수식이
   상자를 밀어낸다. 화면 높이는 고정인데 문서가 그만큼 세로로 스크롤됐다. */
.app .rv-list{width:292px;flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;margin-left:16px;padding-right:14px;}
.app .rv-lh{display:flex;align-items:center;gap:8px;padding-bottom:11px;
  border-bottom:1px solid var(--line);flex-shrink:0;}
.app .rv-lbody{flex:1;min-height:0;overflow-y:auto;}
.app .rv-item{padding:12px 11px;border-left:3px solid transparent;border-bottom:1px solid var(--line2);
  border-radius:0 var(--r-md) var(--r-md) 0;cursor:pointer;transition:background var(--t);}
.app .rv-item:hover{background:var(--hover);}
.app .rv-item.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .rv-item .t{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;}
.app .rv-item .t s{text-decoration:none;margin-left:auto;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:500;color:var(--dim);}
.app .rv-item .m{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

.app .rv-work{flex:1;min-width:0;min-height:0;padding-left:22px;display:flex;flex-direction:column;}
.app .rv-wh{flex-shrink:0;}
.app .rv-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* 편집칸은 비교 상자 «안»에 둔다 — 원본을 보면서 고쳐야 하므로 자리를 옮기지 않는다. */
.app .rv-edit{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:9px 11px;font-family:inherit;font-size:13px;line-height:1.7;
  color:var(--ink);outline:none;resize:vertical;}
.app .rv-edit:focus{border-color:var(--accent-line);}
.app .rv-edit.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;}
/* AI 풀이는 접어 둔다 — 검토자가 먼저 판단하고 나서 펼치도록. */
.app .rv-fold{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);}
.app .rv-fh{display:flex;align-items:center;gap:8px;padding:11px 15px;font-size:12.5px;
  color:var(--sub);cursor:pointer;}
.app .rv-fh .sp{margin-left:auto;font-size:11px;color:var(--dim);}
.app .rv-fb{padding:12px 15px 14px;font-size:12.5px;color:var(--sub);line-height:1.85;
  border-top:1px solid var(--line2);white-space:pre-wrap;}
.app .rv-warn{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 13px;
  border:1px solid var(--no-line);border-left-width:3px;border-radius:var(--r-md);
  background:var(--nobg);color:var(--no);}
.app .rv-warn b{display:block;font-size:12.5px;margin-bottom:3px;}
.app .rv-warn span{display:block;font-size:11.5px;line-height:1.6;color:var(--sub);}
@media (max-width:1240px){ .app .rv-queues{display:none;} }

/* ---------- 학생 상세 (design-v1/03-student) — 디자인 시스템의 기준 화면 ---------- */
.app .sd-screen{display:flex;height:calc(100vh - 92px);}
.app .sd-list{width:258px;flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;padding-right:14px;}
.app .sd-lh{flex-shrink:0;padding-bottom:10px;}
.app .sd-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
.app .sd-doc{flex:1;min-width:0;min-height:0;padding:0 24px;display:flex;flex-direction:column;}
.app .sd-dh{display:flex;align-items:flex-start;gap:16px;flex-shrink:0;}
.app .sd-dh .tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
/* 신호 — 별도 보드를 만들지 않고 학생 화면 안에 «근거 문장»으로 앉힌다 (A5에서 흡수). */
.app .sd-sig{display:flex;align-items:center;gap:11px;margin-top:12px;padding:10px 14px;
  border-radius:var(--r-md);flex-shrink:0;flex-wrap:wrap;}
.app .sd-sig.r{background:var(--nobg);border:1px solid var(--no-line);}
.app .sd-sig.y{background:var(--latebg);border:1px solid var(--late-line);}
.app .sd-sig.g{background:var(--sunk);border:1px solid var(--line);}
.app .sd-sig .x{flex:1;min-width:180px;font-size:12.5px;color:var(--sub);line-height:1.55;}
.app .sd-sig .x b{font-weight:700;color:var(--ink);font-family:'JetBrains Mono',monospace;}
.app .sd-tf{display:flex;align-items:center;gap:6px;margin-top:18px;flex-shrink:0;flex-wrap:wrap;}
.app .sd-tf .r{margin-left:auto;font-size:12px;color:var(--dim);}
.app .sd-tl{flex:1;min-height:0;margin-top:14px;overflow-y:auto;}
/* 연대기 — 하루가 한 덩어리, 그 안에 그날 있었던 일이 종류를 가리지 않고 쌓인다. */
.app .sd-day{display:flex;align-items:center;gap:9px;padding:18px 2px 7px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;}
.app .sd-day b{font-size:12px;font-weight:700;}
.app .sd-day span{font-size:11.5px;color:var(--dim);}
.app .sd-ev{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .sd-ev:hover{background:var(--hover);}
.app .sd-ev .kind{width:52px;flex-shrink:0;font-size:11px;color:var(--dim);padding-top:4px;}
.app .sd-ev .body{flex:1;min-width:0;}
.app .sd-ev .ti{font-size:13.5px;font-weight:600;}
.app .sd-ev .de{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.6;}
.app .sd-ev .de b{font-family:'JetBrains Mono',monospace;color:var(--ink);font-weight:600;}
.app .sd-ev .st{flex-shrink:0;}

.app .sd-ctx{width:296px;flex-shrink:0;border-left:1px solid var(--line);padding-left:20px;
  overflow-y:auto;min-height:0;}
.app .sd-crow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:6px 0;font-size:12.5px;}
.app .sd-crow span{color:var(--dim);flex-shrink:0;}
.app .sd-crow b{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .sd-crow b.m{font-family:'JetBrains Mono',monospace;font-weight:600;}
.app .sd-qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.app .sd-qa .btn{width:100%;}
/* 입력 폼은 연대기 «위»에 붙는다 — 지금 보고 있는 갈래에 무엇을 더할지가 분명해진다. */
.app .sd-form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 15px;margin-top:14px;flex-shrink:0;}
@media (max-width:1280px){ .app .sd-ctx{display:none;} }
@media (max-width:1020px){ .app .sd-list{display:none;} }

/* ---------- 소통 4종 (design-v1/09~12) ----------
   네 화면이 성격이 다르다. 통일해야 하는 것은 색·서체·간격·버튼이지 «형태»가 아니다 —
   질의응답은 세로 스택, 채팅은 말풍선, 클리닉은 시간 판, 공지는 목록이다. */
.app .co-screen{display:flex;height:calc(100vh - 134px);}
.app .co-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;}
.app .co-body{flex:1;min-height:0;overflow-y:auto;margin-top:16px;}
.app .co-side{width:320px;flex-shrink:0;border-left:1px solid var(--line);padding-left:18px;
  margin-left:20px;display:flex;flex-direction:column;min-height:0;}
.app .co-sbody{flex:1;min-height:0;overflow-y:auto;margin-top:12px;}

/* 클리닉 — 시간이 자원이다. 목록만으로는 «어디가 비었나»가 안 보인다. */
.app .cn-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:start;}
.app .cn-col{min-width:0;}
.app .cn-ch{text-align:center;font-size:11.5px;font-weight:700;color:var(--sub);padding-bottom:8px;
  border-bottom:1px solid var(--line);margin-bottom:8px;}
.app .cn-ch s{text-decoration:none;display:block;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;color:var(--dim);font-weight:500;margin-top:2px;}
.app .cn-ch.today{color:var(--accent);}
.app .cn-slot{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:8px 9px;margin-bottom:6px;transition:border-color var(--t);}
.app .cn-slot.free{background:var(--sunk);border-style:dashed;}
.app .cn-slot.full{background:var(--okbg);border-color:var(--ok-line);}
.app .cn-slot .t{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;}
.app .cn-slot .u{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5;}
.app .cn-none{font-size:11px;color:var(--dim);text-align:center;padding:10px 0;}
.app .cn-rq{padding:12px 2px;border-bottom:1px solid var(--line2);}
.app .cn-rq .h{display:flex;align-items:center;gap:8px;}
.app .cn-rq .h b{font-size:13px;font-weight:600;}
.app .cn-rq .h .ago{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);}
.app .cn-rq .w{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6;}
.app .cn-rq .a{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}

/* 질의응답 — 세로 스택. 질문 하나가 한 덩어리고 답이 그 아래 붙는다. */
.app .qn-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
  padding:15px 17px;margin-bottom:12px;}
.app .qn-card.open{border-color:var(--late-line);}
.app .qn-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);}
.app .qn-meta .spacer{margin-left:auto;}
.app .qn-q{font-size:14px;line-height:1.75;margin-top:9px;white-space:pre-wrap;}
.app .qn-a{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);
  font-size:13px;line-height:1.75;color:var(--sub);white-space:pre-wrap;}
.app .qn-img{max-width:220px;max-height:220px;margin-top:10px;border:1px solid var(--line);
  border-radius:var(--r-md);display:block;}

/* 공지 — 읽히는 순서가 곧 최신 순이다. */
.app .nt-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
  padding:14px 16px;margin-bottom:10px;}
.app .nt-h{display:flex;align-items:baseline;gap:10px;}
.app .nt-h b{font-size:14px;font-weight:700;}
.app .nt-h s{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);}
.app .nt-b{font-size:13px;line-height:1.75;margin-top:8px;white-space:pre-wrap;color:var(--sub);}

/* 채팅 — 말풍선. 왼쪽에 학생, 오른쪽에 대화. */
/* 목록과 대화 사이는 «선 하나»가 아니라 여백까지 있어야 갈라져 보인다.
   padding-right만 주면 선에 제목과 말풍선이 붙는다. */
.app .ch-list{width:240px;flex-shrink:0;border-right:1px solid var(--line);
  padding-right:16px;margin-right:24px;
  display:flex;flex-direction:column;min-height:0;}
.app .ch-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
.app .ch-win{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding:16px 2px;}
.app .ch-b{max-width:72%;padding:9px 13px;border-radius:var(--r-lg);font-size:13px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;}
.app .ch-b.from-student{align-self:flex-start;background:var(--card);border:1px solid var(--line);}
.app .ch-b.from-teacher{align-self:flex-end;background:var(--accent);color:#fff;}
.app .ch-b .at{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;
  opacity:.6;margin-top:5px;}
.app .ch-in{display:flex;gap:8px;flex-shrink:0;padding-top:12px;border-top:1px solid var(--line);}
.app .ch-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--paper);padding:9px 12px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;}
.app .ch-in input:focus{border-color:var(--accent-line);}
@media (max-width:1180px){ .app .co-side{display:none;} }

/* ---------- 시험지 (design-v1/07-exams) ----------
   역할은 «어느 문항이 무너졌는지 본다». 오답 파이프라인의 입구다. */
.app .ex-screen{display:flex;height:calc(100vh - 134px);}
.app .ex-list{width:262px;flex-shrink:0;border-right:1px solid var(--line);
  padding-right:14px;margin-right:20px;display:flex;flex-direction:column;min-height:0;}
.app .ex-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
.app .ex-item{padding:11px 12px;border-left:3px solid transparent;border-bottom:1px solid var(--line2);
  border-radius:0 var(--r-md) var(--r-md) 0;cursor:pointer;transition:background var(--t);}
.app .ex-item:hover{background:var(--hover);}
.app .ex-item.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .ex-item .n{font-size:13px;font-weight:600;}
.app .ex-item .m{font-size:11.5px;color:var(--dim);margin-top:4px;}
.app .ex-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;}
.app .ex-body{flex:1;min-height:0;overflow-y:auto;margin-top:16px;}
/* 문항별 오답률 — 막대를 세우지 않고 «행»으로 눕힌다. 20문항이면 세로 막대엔 라벨이 안 들어간다. */
.app .ex-q{display:flex;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .ex-q:hover{background:var(--hover);}
.app .ex-q .no{width:34px;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;
  font-weight:600;color:var(--sub);}
.app .ex-q .unit{width:150px;flex-shrink:0;font-size:12px;color:var(--sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .ex-q .track{flex:1;min-width:60px;height:18px;background:var(--line2);border-radius:4px;overflow:hidden;}
.app .ex-q .track i{display:block;height:100%;border-radius:4px;background:#D9D6CC;}
.app .ex-q.mid .track i{background:var(--late);}
.app .ex-q.hi .track i{background:var(--no);}
.app .ex-q .pct{width:46px;flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;}
.app .ex-q .tw{width:92px;flex-shrink:0;text-align:right;}
@media (max-width:1240px){ .app .ex-side{display:none;} }

.app .actbar{position:fixed;z-index:6;flex-wrap:wrap;}
/* 고정된 액션바가 마지막 행을 가리지 않게, 스크롤 영역 «안»에 여백을 둔다. */
.app .rst-pad{height:64px;flex-shrink:0;}

/* ============================================================
   학생 마이페이지 (design-v1/20-student-app) — 접두사 sap-
   목업은 390×812 «폰 액자»(.ph/.ph-body/.ph-tabs) 안에 그려져 있다.
   실서비스는 진짜 폰이므로 액자를 벗기고 그 자리에 뷰포트를 넣는다.
   데스크톱에서 열면 한 칸짜리 열이 가운데로 모인다 — 시안이 못박아 둔 대로다.
   ds.css의 모바일 부품(.mc/.mrow/.msec/.mbtn/.todo/.cal/.bar/.bub-row)은
   여기서 다시 정의하지 않는다. 이 블록에 있는 것은 «셸»뿐이다.
   ============================================================ */
.app.sap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;
  background:var(--paper);box-shadow:0 0 0 1px var(--line);}
@media (max-width:520px){ .app.sap{box-shadow:none;} }
/* 상단바·서브내비는 ds.css 것을 그대로 쓴다. 학생이라고 다른 상단바를 만들지 않는다. */
.app.sap .topbar{padding:0 16px;gap:10px;}
.app.sap .topbar .bm{font-size:13px;}
.app.sap .subnav{padding:0 6px;}
.app.sap .subnav a{padding:0 11px;font-size:12.5px;}
/* 하단 탭바가 마지막 줄을 가리지 않도록 본문 아래에 그만큼 비워 둔다. */
.app.sap .body{padding:16px 16px 78px;}

/* 하단 탭 — 엄지가 닿는 자리. 뷰포트에 고정하되 폭은 앱 열에 맞춘다.
   ds.css의 .ph-tabs는 폰 액자 «안»의 것이라 position이 다르다. */
.sap-tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;height:58px;display:flex;z-index:7;
  background:var(--card);border-top:1px solid var(--line);}
.sap-tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--dim);font-size:10.5px;cursor:pointer;
  transition:color var(--t);}
.sap-tabs a.on{color:var(--accent);font-weight:700;}

/* 알림 벨 — 학생·관리자 상단바가 같이 쓴다 */
.ds-bell{position:relative;display:flex;}
.ds-bell>button{width:32px;height:32px;border:0;background:transparent;color:var(--sub);
  border-radius:var(--r-md);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ds-bell>button:hover{background:var(--hover);}
.ds-bell .n{position:absolute;top:1px;right:0;min-width:15px;height:15px;padding:0 3px;
  border-radius:8px;background:var(--no);color:#fff;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.ds-drop{position:absolute;top:38px;right:0;width:210px;z-index:9;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 8px 24px rgba(0,0,0,.1);overflow:hidden;}
.ds-drop .it{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:12.5px;cursor:pointer;}
.ds-drop .it+.it{border-top:1px solid var(--line2);}
.ds-drop .it:hover{background:var(--hover);}
.ds-drop .it b{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--no);}
.ds-drop .em{padding:14px;font-size:12px;color:var(--dim);text-align:center;}

/* 화면 머리 — 「누구의 화면인가」. serif는 학생 이름에만 쓴다 (시스템 규칙) */
.sap-hi b{display:block;font-family:'Noto Serif KR',serif;font-size:21px;font-weight:600;
  letter-spacing:-.02em;}
.sap-hi span{display:block;font-size:12.5px;color:var(--dim);margin-top:5px;}

/* 화면 안내문 — 「여기서 무엇을 하는가」 한 줄 */
.sap-lede{font-size:12px;color:var(--sub);line-height:1.7;margin:0 0 14px;}

/* 입력 — .cls-form은 데스크톱 밀도(12.5px)라 엄지로 쓰기엔 작다 */
.sap-in{width:100%;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:12px 13px;font-family:inherit;font-size:14px;color:var(--ink);outline:none;resize:vertical;}
.sap-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.sap-in::placeholder{color:var(--dim);}
.sap-lab{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.04em;margin-bottom:6px;}
.sap-row2{display:flex;gap:9px;}
.sap-row2>*{flex:1;min-width:0;}

/* 보기 버튼 ①~⑤ — selectChoice()가 부모의 .mc-choice-btn을 찾으므로 이름은 그대로 쓴다 */
.sap .mc-choice-group{display:flex;gap:8px;}
.sap .mc-choice-btn{flex:1;height:46px;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r-md);font-family:inherit;font-size:17px;color:var(--sub);cursor:pointer;
  transition:all var(--t);}
.sap .mc-choice-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

/* 문제 본문 — 수식이 섞이므로 줄 간격을 넉넉히 */
.sap-q{font-size:15px;line-height:1.85;white-space:pre-wrap;}

/* 스크롤 상자에는 반드시 position:relative를 같이 준다 (KaTeX .katex-mathml 때문).
   시험지 화면에서 문서가 3736px 늘어났던 사고와 같은 것이다. */
.sap-chat{position:relative;height:calc(100vh - 250px);min-height:280px;overflow-y:auto;
  padding:2px;margin-bottom:12px;}

/* 오답숙제·성적처럼 «수치를 세는» 곳의 작은 진행 표시 */
.sap-prog{display:flex;align-items:center;gap:10px;margin-top:11px;}
.sap-prog .bar{flex:1;}
.sap-prog b{font-family:'JetBrains Mono',monospace;font-size:12px;}

/* 달 넘김 같은 «작은 화살표»도 엄지로 누른다. ds.css의 .btn.icon(32px)은 마우스 치수다. */
.sap-navbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--sunk);
  border-radius:var(--r-md);color:var(--sub);cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.sap-navbtn:hover{background:var(--hover);color:var(--ink);}

.sap-empty{padding:36px 0;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.8;}
.sap-img{max-width:100%;border:1px solid var(--line);border-radius:var(--r-md);display:block;margin-top:10px;}

/* 강의 임베드 — 16:9 비율 상자 */
.sap-vwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-md);
  overflow:hidden;background:#000;margin-top:11px;}
.sap-vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

/* ============================================================
   폼 · 표 — 구버전 스타일이 쥐고 있던 마지막 조각들이 온 자리다. 접두사 fm-
   화면이 아니라 «부품»이라 화면별 접두사를 붙이지 않는다.
   시험지 등록 · 창고 추가 · 설정 6갈래 · 수업 기록 상세가 이걸 같이 쓴다.
   ============================================================ */
.app .fm-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 22px;margin-bottom:16px;}
.app .fm-panel h3{margin:0 0 16px;font-family:'Noto Serif KR',serif;font-size:16px;
  font-weight:600;letter-spacing:-.02em;}
.app .fm-panel h4{margin:22px 0 10px;font-size:13px;font-weight:700;}

.app .fm-field{margin-bottom:14px;}
.app .fm-field label{display:block;font-size:11px;font-weight:700;color:var(--dim);
  letter-spacing:.02em;margin-bottom:6px;}
.app .fm-field input,.app .fm-field select,.app .fm-field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;
  transition:border-color var(--t),box-shadow var(--t);}
.app .fm-field input:focus,.app .fm-field select:focus,.app .fm-field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.app .fm-field textarea{min-height:78px;resize:vertical;}
.app .fm-field input[type=file]{padding:6px;background:var(--card);}

.app .fm-hint{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:11px;}
/* .fm-field 밖에 홀로 선 드롭다운 — 여기 없으면 브라우저 기본 모양이 그대로 나온다 */
.app .fm-sel{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--sunk);padding:0 8px;font-family:inherit;font-size:12.5px;color:var(--ink);
  outline:none;cursor:pointer;}
.app .fm-sel:focus{border-color:var(--accent);}
/* 가로로 늘어놓는 입력 줄 — 구버전 .inline-form */
.app .fm-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.app .fm-row .fm-field{margin-bottom:0;min-width:140px;flex:1;}
.app .fm-empty{padding:34px 0;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.8;}
.app .fm-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.app .fm-head h3{margin:0;font-size:15px;}
.app .fm-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:10px;}
.app .fm-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.app .fm-acts button{margin:0;}

/* 표 — 구버전 .ledger(위 2px 잉크선 + 아래 얇은 선)가 여기로 왔다.
   ds.css의 table.grid와 같은 리듬이되, 폼 패널 안이라 조금 낮다. */
.app .fm-panel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.app .fm-panel thead th,.app .fm-panel tr:first-child th{height:32px;text-align:left;
  font-size:11px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);
  padding:0 8px;white-space:nowrap;}
.app .fm-panel td{height:38px;padding:0 8px;border-bottom:1px solid var(--line2);
  font-size:12.5px;vertical-align:middle;}
.app .fm-panel tbody tr:hover td,.app .fm-panel tr:hover td{background:var(--hover);}
.app .fm-nm{font-weight:600;}
.app .fm-sub{color:var(--dim);font-size:11.5px;}

/* 채팅 — 학생 화면과 같은 말풍선(ds.css .bub-row)을 쓴다.
   ⚠ 스크롤 상자에는 position:relative를 같이 준다 (KaTeX .katex-mathml 때문). */
.app .fm-chat{position:relative;height:340px;overflow-y:auto;padding:4px 2px;margin-bottom:12px;}

/* 문항 한 줄 — 시험지 등록의 «번호 + 입력들» */
.app .fm-q{display:flex;gap:9px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid var(--line2);}
.app .fm-q .qno{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent);
  flex:0 0 32px;padding-top:9px;font-size:12.5px;}
.app .fm-q .qf{flex:1;display:flex;gap:8px;flex-wrap:wrap;}
.app .fm-q .qf textarea{flex:2;min-width:200px;min-height:44px;}
.app .fm-q .qf input{flex:1;min-width:100px;}
.app .fm-q .qf input,.app .fm-q .qf textarea,.app .fm-q .qf select{
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;resize:vertical;}
.app .fm-q .qf input:focus,.app .fm-q .qf textarea:focus{border-color:var(--accent);}

/* 출석 표 — 수업 기록 상세. 상태 버튼은 ds.css의 .seg를 그대로 쓴다 */
.app .fm-att td,.app .fm-att th{white-space:nowrap;}
.app .fm-att td:last-child,.app .fm-att th:last-child{white-space:normal;min-width:150px;}
.app .fm-att input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:6px 9px;font-family:inherit;font-size:12px;color:var(--ink);outline:none;}
.app .fm-att input:focus{border-color:var(--accent);}

/* ============================================================
   로그인 (design-v1/17-login) — 접두사 lo-
   폰과 데스크톱이 «같은 한 칸»이다. 캔버스를 씌우지 않고 가운데 세운다.
   ============================================================ */
.app.lo{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:clamp(44px,11vh,116px) 20px 64px;}
.lo-col{width:100%;max-width:396px;}
/* 로고가 홈으로 가는 문이다. 상단 헤더가 없으므로 여기 하나뿐이다. */
.lo-logo{width:196px;height:auto;display:block;margin:0 auto 34px;cursor:pointer;}
.lo-lab{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 7px;letter-spacing:-.01em;}
.lo-in{width:100%;height:48px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);padding:0 14px;font-family:inherit;font-size:14.5px;color:var(--ink);
  outline:none;transition:border-color var(--t),box-shadow var(--t);}
.lo-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.lo-in::placeholder{color:var(--dim);}
.lo-f+.lo-f{margin-top:16px;}
.lo-go{display:flex;align-items:center;justify-content:center;width:100%;height:50px;
  background:var(--accent);border:1px solid var(--accent);border-radius:var(--r-md);
  color:#fff;font-family:inherit;font-size:15px;font-weight:700;margin-top:24px;cursor:pointer;
  transition:background var(--t);}
.lo-go:hover{background:var(--accent-d);}
.lo-hint{margin:16px 0 0;font-size:12px;color:var(--dim);line-height:1.75;text-align:center;}
/* 다른 문 — 오는 사람은 거의 전부 학생이라 조교·강사는 «아래 작은 글»이다 */
.lo-doors{margin-top:32px;padding-top:20px;border-top:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;gap:13px;
  font-size:12.5px;color:var(--sub);}
.lo-doors a{text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
.lo-doors a:hover{color:var(--ink);}
.lo-doors s{text-decoration:none;color:var(--line);}
/* 오류는 «다시 입력하기 전»에 읽혀야 하므로 칸 위에 온다.
   구버전은 버튼 아래에 뒀는데, 고치려고 위로 올라가면 화면 밖으로 나갔다. */
.lo-err{display:flex;align-items:flex-start;gap:9px;margin-bottom:20px;padding:12px 14px;
  background:var(--nobg);border:1px solid var(--no-line);border-radius:var(--r-md);
  font-size:12.5px;line-height:1.7;color:var(--no);}
.lo-err svg{flex-shrink:0;margin-top:1px;}
.lo-err b{display:block;font-weight:700;}
.lo-err span{color:#8E4A40;}

/* ============================================================
   조교 (design-v1/18-assistant) — 접두사 as-
   **따로 만든 화면이 아니라 관리자 화면을 «권한»으로 좁힌 것이다.**
   그래서 명단은 .rst-*, 학생 상세는 .sd-*를 그대로 쓴다. 여기 있는 것은
   «조교라는 사실»을 말하는 부품뿐이다.
   ============================================================ */
.app.as .topbar{gap:10px;}
.as-who{display:flex;align-items:center;gap:9px;margin-left:12px;}
.as-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-xs);
  background:var(--accent);color:#fff;letter-spacing:.02em;flex-shrink:0;}
.as-cls{font-size:12.5px;color:var(--sub);white-space:nowrap;}
.as-cls b{color:var(--ink);font-weight:700;}
/* 권한을 화면이 먼저 말한다 — 눌러 보고 나서야 «안 되는구나»를 알게 하지 않는다 */
.as-lede{margin:11px 0 0;font-size:12.5px;color:var(--sub);line-height:1.75;max-width:78ch;}
.as-lede b{color:var(--ink);font-weight:700;}
/* 조교의 표는 열이 여덟이라 명단(1418px)보다 좁다. 그대로 두면 괜히 가로 스크롤이 남는다. */
.app .rst-wrap table.grid.as-narrow{min-width:1004px;}

/* ============================================================
   공개 홈 — 랜딩 「하루」 (landing-v2/index.html)
   토큰은 전부 ds.css(:root). 여기에는 «배치»만 둔다.
   클래스는 전부 l- 접두사 — ds.css와 이름이 겹치면 조용히 망가진다.
   («.stage / .ev / .tag / .row»로 이미 세 번 당했다.)

   시안은 제 문서라 html·body에 직접 글꼴과 배경을 걸었다.
   실서비스는 한 문서 안에 관리자·학생·랜딩이 함께 있으므로 .lp가 그 자리를 맡는다.
   ⚠ 시안의 body{overflow-x:hidden}은 옮기지 않았다 — .lp에 걸면 그 상자가
   새 스크롤포트가 되어 페이지 스크롤이 통째로 안쪽으로 들어간다 (명단에서 겪은 그 사고다).
   가로 넘침은 감추는 대신 «만들지 않는» 쪽으로 잡았다.
   ============================================================ */
.lp{background:var(--paper);color:var(--ink);
  font-family:'Pretendard',-apple-system,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
.lp a{color:inherit;}
.lp :focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:2px;}

.lp .l-skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;
  padding:12px 18px;z-index:100;border-radius:0 0 8px 0;text-decoration:none;}
.lp .l-skip:focus{left:0;}

/* 공통 배치 — 시각 열 / 척추 / 본문 열 */
.lp .l-wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.lp .l-rail{position:relative;}
.lp .l-spine{position:absolute;left:132px;top:0;bottom:0;width:1px;background:var(--line);
  transform-origin:top;}
.lp .l-dot{position:absolute;left:128px;width:9px;height:9px;border-radius:50%;
  background:var(--brand);border:2px solid var(--paper);}
.lp .l-col{padding-left:164px;}

/* ---------- 상단 바 : 히어로를 지나면 나타난다 ---------- */
.lp .l-bar{position:fixed;left:0;right:0;top:0;height:62px;z-index:50;
  display:flex;align-items:center;gap:16px;padding:0 28px;
  background:rgba(250,249,246,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  transform:translateY(-100%);transition:transform .32s cubic-bezier(.4,0,.2,1);}
.lp .l-bar.on{transform:translateY(0);}
.lp .l-bar .l-inner{max-width:1180px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;}
.lp .l-bar img{height:26px;width:auto;display:block;}
.lp .l-bar .l-sp{margin-left:auto;}

.lp .l-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--r-md);
  padding:11px 20px;font-family:inherit;font-size:14px;font-weight:700;text-decoration:none;
  cursor:pointer;white-space:nowrap;
  transition:background var(--t),border-color var(--t);}
.lp .l-btn:hover{background:var(--accent-d);border-color:var(--accent-d);}
.lp .l-btn.l-sm{padding:8px 15px;font-size:13px;}
.lp .l-btn.l-lg{padding:17px 30px;font-size:16.5px;border-radius:var(--r-lg);}
.lp .l-btn.l-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.lp .l-btn.l-ghost:hover{background:var(--hover);border-color:#D9D6CC;}

/* ---------- 1. 도착 ---------- */
/* 히어로 높이를 뷰포트보다 조금 낮게 잡아 «하루»의 첫 행이 접힌 채로 보이게 한다.
   따로 미리보기 행을 두면 같은 16:00이 두 번 나온다 — 그건 장치가 아니라 버그로 읽힌다. */
.lp .l-hero{min-height:calc(100vh - 118px);min-height:calc(100svh - 118px);
  display:flex;flex-direction:column;justify-content:center;padding:110px 0 0;position:relative;}
/* ⚠ .l-wrap의 margin:0 auto는 «세로 플렉스»의 가로축에서 stretch를 끈다.
   그래서 히어로 안에서만 wrap이 내용 크기(612px)로 줄어들고, **척추가 아래 본문과 어긋났다**
   — 히어로 495 대신 779. 페이지 전체가 한 줄기 선 위에 있다는 것이 이 랜딩의 뼈대인데
   그 선이 첫 화면에서 끊겨 있었다. 시안(landing-v2)에도 같은 것이 있어 함께 고쳤다. */
.lp .l-hero .l-wrap{width:100%;}
.lp .l-hero .l-logo{max-width:392px;width:52%;min-width:260px;height:auto;display:block;}
.lp .l-hero .l-date{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:14px;
  color:var(--dim);letter-spacing:.14em;}
.lp .l-hero .l-date .l-dow{font-family:'Pretendard',sans-serif;letter-spacing:.02em;margin-left:16px;}
.lp .l-hero .l-sub{margin-top:14px;font-size:16px;color:var(--sub);}

/* ---------- 2. 하루 ---------- */
.lp .l-day{padding:0 0 128px;}
.lp .l-row{position:relative;display:flex;align-items:flex-start;padding:34px 0;}
.lp .l-row .l-t{width:132px;flex-shrink:0;text-align:right;padding-right:30px;
  font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;color:var(--sub);
  padding-top:2px;}
.lp .l-row .l-b{padding-left:32px;flex:1;min-width:0;}
.lp .l-row .l-k{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;
  color:var(--dim);letter-spacing:.18em;}
.lp .l-row .l-s{margin:12px 0 0;font-size:27px;font-weight:500;letter-spacing:-.035em;
  line-height:1.5;}
.lp .l-row .l-s b{font-weight:700;}

.lp .l-break{display:flex;align-items:center;gap:16px;margin:12px 0 12px 164px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);letter-spacing:.06em;}
.lp .l-break::after{content:'';flex:1;height:1px;background:var(--line);}

/* ---------- 3. 전환 : 유일하게 큰 소리 ---------- */
.lp .l-turn{background:var(--accent);color:#fff;padding:130px 0;position:relative;}
.lp .l-turn .l-spine{background:rgba(255,255,255,.2);}
.lp .l-turn .l-dot{background:var(--brand);border-color:var(--accent);}
.lp .l-turn .l-k{font-family:'JetBrains Mono',monospace;font-size:12.5px;
  color:rgba(255,255,255,.5);letter-spacing:.24em;}
.lp .l-turn h2{margin:34px 0 0;font-family:'Noto Serif KR',serif;font-size:62px;font-weight:600;
  letter-spacing:-.045em;line-height:1.3;max-width:15ch;}
.lp .l-turn p{margin:34px 0 0;font-size:18px;line-height:1.9;color:rgba(255,255,255,.7);
  max-width:44ch;}

/* ---------- 4. 사람 ---------- */
.lp .l-human{padding:128px 0 0;position:relative;overflow:hidden;}
.lp .l-human .l-inner{display:flex;align-items:flex-end;gap:40px;}
.lp .l-human .l-say{flex:1;min-width:0;max-width:620px;padding-bottom:96px;}
.lp .l-note{background:var(--note);border:1px solid var(--note-line);border-radius:var(--r-lg);
  padding:30px 32px;}
.lp .l-note p{margin:0;font-size:22px;line-height:1.85;letter-spacing:-.025em;}
.lp .l-note .l-by{margin-top:24px;display:flex;align-items:baseline;gap:10px;
  font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);}
.lp .l-note .l-by b{font-family:'Pretendard',sans-serif;font-size:14px;font-weight:700;color:var(--ink);}
.lp .l-human .l-photo{flex-shrink:0;width:340px;align-self:flex-end;}
.lp .l-human .l-photo picture{display:block;}
.lp .l-human .l-photo img{width:100%;height:auto;display:block;}

/* ---------- 4-B. 들은 말 (수강생 후기) ----------
   같은 메모 종이색이다. 시스템에서 «사람이 적은 것»은 전부 이 색이고,
   후기는 학생이 적은 것이다. 원장 메모와 크기로 갈린다 — 저쪽이 22px, 이쪽이 17px. */
/* 섹션 머리 — 「하루」의 l-k와 같은 목소리다. 척추 옆에 붙는 작은 라벨 */
.lp .l-hk{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;
  color:var(--dim);letter-spacing:.18em;}

.lp .l-heard{padding:80px 0 0;}
.lp .l-heard .l-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px;}
.lp .l-heard .l-q{background:var(--note);border:1px solid var(--note-line);
  border-radius:var(--r-lg);padding:24px 26px;}
.lp .l-heard .l-q p{margin:0;font-size:17px;line-height:1.8;letter-spacing:-.02em;}
.lp .l-heard .l-who{margin-top:18px;display:flex;align-items:center;gap:9px;
  font-size:12.5px;color:var(--dim);}
.lp .l-heard .l-medal{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-xs);
  background:var(--accent);color:#fff;}
.lp .l-heard .l-more{margin-top:22px;}
/* 나머지 후기는 접어 둔다. 펴는 것은 render() 없이 클래스 하나로 —
   전체 재렌더링이 일어나면 등장 애니메이션이 통째로 다시 돈다. */
.lp .l-heard .l-q.l-x{display:none;}
.lp .l-heard.l-open .l-q.l-x{display:block;}

/* ---------- 5. 기록 (경력 · 성과) ----------
   시안이 «자리»만 잡아 두고 비워 둔 칸(CONTENT.credits)이 여기다.
   ⚠ 왼쪽 라벨은 mono가 아니다. 「경력」·「성과」는 낱말이라 고정폭에서 글자가 벌어진다. */
.lp .l-cred{position:relative;display:flex;align-items:flex-start;padding:30px 0;}
.lp .l-cred .l-t{width:132px;flex-shrink:0;text-align:right;padding-right:30px;padding-top:2px;
  font-size:15px;font-weight:700;color:var(--sub);letter-spacing:-.02em;}
.lp .l-cred .l-b{padding-left:32px;flex:1;min-width:0;}
.lp .l-cred ul{margin:0;padding:0;list-style:none;}
.lp .l-cred li{font-size:17px;line-height:1.5;letter-spacing:-.025em;padding:9px 0;
  color:var(--sub);}
.lp .l-cred li+li{border-top:1px solid var(--line2);}
.lp .l-cred li b{color:var(--ink);font-weight:700;}
.lp .l-cred li.l-now{color:var(--ink);font-weight:700;}
.lp .l-cred li.l-now::before{content:'';display:inline-block;width:6px;height:6px;
  border-radius:50%;background:var(--brand);margin-right:9px;vertical-align:2px;}

/* ---------- 6. 공지 ---------- */
.lp .l-notice{padding:110px 0 0;}
.lp .l-notice .l-nrow{display:flex;align-items:baseline;gap:18px;padding:18px 0;
  border-bottom:1px solid var(--line2);}
.lp .l-notice .l-nrow:first-of-type{border-top:1px solid var(--line);}
.lp .l-notice .l-nd{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);
  flex-shrink:0;width:96px;}
.lp .l-notice .l-nt{flex:1;min-width:0;font-size:17px;letter-spacing:-.02em;}
.lp .l-notice .l-nx{margin-top:7px;font-size:14px;color:var(--sub);line-height:1.8;
  white-space:pre-wrap;}

/* ---------- 7. 행동 ---------- */
.lp .l-act{padding:110px 0 120px;}
.lp .l-act .l-inner{display:flex;gap:56px;align-items:flex-start;flex-wrap:wrap;}
.lp .l-act .l-say{flex:1;min-width:290px;}
.lp .l-act h3{margin:0;font-family:'Noto Serif KR',serif;font-size:34px;font-weight:600;
  letter-spacing:-.035em;}
.lp .l-act p{margin:16px 0 0;font-size:16px;color:var(--sub);line-height:1.85;max-width:46ch;}
.lp .l-act .l-ways{margin-top:30px;display:flex;flex-direction:column;gap:2px;}
.lp .l-act .l-way{display:flex;align-items:baseline;gap:14px;padding:11px 0;
  border-top:1px solid var(--line2);font-size:14.5px;}
.lp .l-act .l-way span{width:78px;flex-shrink:0;font-size:12.5px;color:var(--dim);}
.lp .l-form{width:400px;flex-shrink:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-xl);padding:30px 32px;}
.lp .l-form .l-fk{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);
  letter-spacing:.16em;margin-bottom:20px;}
.lp .l-form label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);
  margin:0 0 7px;letter-spacing:-.01em;}
.lp .l-form label+*{margin-bottom:17px;}
.lp .l-form input,.lp .l-form select,.lp .l-form textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk);
  padding:12px 14px;font-family:inherit;font-size:14.5px;color:var(--ink);outline:none;
  resize:vertical;transition:border-color var(--t),box-shadow var(--t);}
.lp .l-form input:focus,.lp .l-form select:focus,.lp .l-form textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,48,52,.12);}
.lp .l-form textarea{min-height:96px;}
.lp .l-form .l-btn{width:100%;margin-top:4px;}

.lp .l-foot{border-top:1px solid var(--line);padding:38px 0 52px;margin-top:24px;}
.lp .l-foot .l-inner{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.lp .l-foot img{height:34px;width:auto;opacity:.62;}
.lp .l-foot .l-meta{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  color:var(--dim);letter-spacing:.06em;text-align:right;line-height:1.9;}
.lp .l-foot .l-tlog{font-family:'Pretendard',sans-serif;letter-spacing:0;font-size:12px;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.lp .l-foot .l-tlog:hover{color:var(--ink);}

/* ---------- 등장 ---------- */
.lp .l-rise{opacity:0;transform:translateY(14px);
  transition:opacity .62s cubic-bezier(.4,0,.2,1),transform .62s cubic-bezier(.4,0,.2,1);}
.lp .l-rise.in{opacity:1;transform:none;}
.lp .l-draw{transform:scaleY(0);transition:transform .9s cubic-bezier(.4,0,.2,1);}
.lp .l-draw.in{transform:scaleY(1);}

/* ---------- 반응형 ----------
   척추는 사라지지 않는다. 좁아지면 왼쪽 끝으로 붙고 시각이 문장 위로 올라간다. */
@media (max-width:980px){
  .lp .l-act .l-inner{display:block;}
  .lp .l-form{width:auto;margin-top:40px;}
}
@media (max-width:900px){
  .lp .l-spine{left:9px;}
  .lp .l-dot{left:5px;}
  .lp .l-col{padding-left:44px;}
  .lp .l-hero{padding-top:96px;}
  .lp .l-hero .l-logo{width:74%;min-width:0;}
  .lp .l-row,.lp .l-cred{display:block;padding:26px 0 26px 44px;}
  .lp .l-row .l-t,.lp .l-cred .l-t{width:auto;text-align:left;padding:0 0 8px;font-size:15px;}
  .lp .l-row .l-b,.lp .l-cred .l-b{padding-left:0;}
  .lp .l-row .l-s{font-size:21px;margin-top:9px;}
  .lp .l-break{margin-left:44px;}
  .lp .l-turn{padding:88px 0;}
  .lp .l-turn h2{font-size:36px;}
  .lp .l-turn p{font-size:16px;}
  .lp .l-human{padding-top:88px;}
  .lp .l-human .l-inner{display:block;}
  .lp .l-human .l-say{padding-bottom:40px;max-width:none;}
  .lp .l-human .l-photo{width:230px;margin-left:auto;}
  .lp .l-note p{font-size:18px;}
  .lp .l-heard{padding-top:72px;}
  .lp .l-heard .l-grid{grid-template-columns:1fr;}
  .lp .l-heard .l-q p{font-size:15.5px;}
  .lp .l-cred li{font-size:15.5px;}
  .lp .l-notice{padding-top:80px;}
  .lp .l-notice .l-nrow{display:block;}
  .lp .l-notice .l-nd{width:auto;margin-bottom:6px;}
  .lp .l-notice .l-nt{font-size:15.5px;}
  .lp .l-act{padding:80px 0 88px;}
  .lp .l-act h3{font-size:26px;}
}
@media (max-width:560px){
  .lp .l-wrap{padding:0 20px;}
  .lp .l-hero .l-logo{width:88%;}
  .lp .l-turn h2{font-size:29px;}
  .lp .l-form{padding:24px 22px;}
  .lp .l-foot .l-meta{margin-left:0;text-align:left;width:100%;}
}

@media (prefers-reduced-motion:reduce){
  .lp .l-rise{opacity:1;transform:none;transition:none;}
  .lp .l-draw{transform:none;transition:none;}
  .lp .l-bar{transition:none;}
}
</style>

</head>

  // 순수 HTTPS 요청/응답 방식인 REST가 훨씬 안정적으로 동작한다.)
  const FIRESTORE_ROOT = 'https://firestore.googleapis.com/v1/projects/' + firebaseConfig.projectId + '/databases/(default)/documents';

     X-Site-Token으로 보냈는데, 정적 클라이언트라 모든 방문자 브라우저로 내려가는 값이었다.
     비밀이 될 수 없는 값이었고 그 뒤에 방어도 없어서, 토큰만 있으면 워커를 루프로 호출해
     Gemini 비용을 태울 수 있었다. 이제 워커가 토큰을 검증하고 할당량을 uid별로 «서버에서» 센다.
     아래 AI_DAILY_LIMIT은 이제 «표시용»이고 진짜 한도는 워커가 쥔다 (gemini-proxy.js:30과 같아야 한다). */
  const AI_DAILY_LIMIT = 20;
  async function getAuthToken(){
    if(!fbAuth.currentUser){
      await new Promise(resolve=>{
        const unsub = fbAuth.onAuthStateChanged(u=>{ if(u){ unsub(); resolve(); } });
      });
    }
    return fbAuth.currentUser.getIdToken();

<script>
/* =================== 저장소 유틸 (Firebase Firestore) =================== */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
async function dbGet(key, fallback){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
    if(res.status === 404) return fallback;
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    return JSON.parse(doc.fields.value.stringValue);
  }catch(e){ console.error('불러오기 실패', key, e); return fallback; }
}
async function dbSet(key, value){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(value) } } })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    return true;
  }
  catch(e){ console.error('저장 실패', key, e); return null; }
}
async function dbDelete(key){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', key, e); }
}

/* =================== 저장소 유틸 2 — 컬렉션(문서 하나당 레코드 하나) =================== */
// 예전엔 kv/students 문서 하나에 학생 전체 배열을 통째로 저장해서, 학생 한 명만 바꿔도
// 전체를 다시 쓰고(동시 편집 시 서로 덮어씀) 문서 1MB 한도에도 걸릴 수 있었다.
// 아래 3개 함수는 컬렉션 하나에 레코드마다 문서를 따로 둬서 그 문제를 없앤다.
// (Firestore 문서 형식을 그대로 쓰지 않고 예전처럼 value 필드 하나에 JSON 문자열로 넣는 이유는
//  기존 dbGet/dbSet과 직렬화 방식을 통일해서 변환 과정에서 실수할 여지를 줄이기 위함.)
async function dbSetDoc(collection, id, data){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_ROOT + '/' + collection + '/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(data) } } })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    return true;
  }catch(e){ console.error('저장 실패', collection, id, e); return null; }
}
async function dbDeleteDoc(collection, id){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_ROOT + '/' + collection + '/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', collection, id, e); }
}
async function dbGetCollection(collection){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    let out = [], pageToken = '';
    do{
      const url = FIRESTORE_ROOT + '/' + collection + '?pageSize=300' + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await withTimeout(fetch(url, { headers: { Authorization: 'Bearer ' + token } }), 8000);
      if(res.status === 404) break;
      if(!res.ok) throw new Error('firestore http ' + res.status);
      const json = await res.json();
      (json.documents || []).forEach(doc => {
        try{ out.push(JSON.parse(doc.fields.value.stringValue)); }catch(e){}
      });
      pageToken = json.nextPageToken || '';
    } while(pageToken);
    return out;
  }catch(e){ console.error('컬렉션 불러오기 실패', collection, e); return []; }
}
// 예전 kv/{oldKey} 블롭(배열 하나)을 컬렉션(문서마다 레코드 하나)로 1회 옮긴다.
// 새 컬렉션에 이미 데이터가 있으면(=이미 옮겨졌으면) 아무것도 안 하고 그걸 그대로 쓴다.
// 예전 블롭 문서는 안전하게 그대로 남겨둔다(옮기다 실패해도 원본 데이터가 사라지지 않도록).
async function migrateBlobToCollection(oldKey, collection, idField){
  const existing = await dbGetCollection(collection);
  if(existing.length > 0) return existing;
  const oldArr = await dbGet(oldKey, []);
  if(!oldArr || oldArr.length === 0) return [];
  // 예전 데이터 중엔 id 필드 자체가 없던 것도 있어서(예: 상담 신청), 없으면 이전하면서 하나 만들어 채운다.
  // 안 그러면 전부 같은 문서 키로 겹쳐 써져서 데이터가 사라진다.
  oldArr.forEach((item, i) => { if(!item[idField]) item[idField] = collection + '_migrated_' + Date.now() + '_' + i; });
  await Promise.all(oldArr.map(item => dbSetDoc(collection, String(item[idField]), item)));
  console.log('[migrate] ' + oldKey + ' -> ' + collection + ': ' + oldArr.length + '건 이전 완료');
  return oldArr;
}

/* =================== AI 쌍둥이 문제 생성 (일 20건 한도) =================== */
/* «오늘»은 로컬 날짜다. 예전엔 toISOString()(UTC)이었는데, KST(+9)에서는 00:00~09:00 사이에
   하루 전을 가리켰다. 그 시간대에 출결을 넣으면 하루 전 날짜로 저장됐고,
   반 관리의 수업 날짜 목록은 «요일은 로컬로 판정하고 날짜는 UTC로 기록»해서 통째로 하루씩 밀렸다
   (월·수·금 반이 일·화·목으로 보였다).
   이미 저장된 기록의 날짜는 그대로 둔다 — 고쳐 봐야 어느 쪽이 맞는지 알 수 없다. */
function ymdLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return ymdLocal(new Date()); }
/* 'YYYY-MM-DD HH:MM' — 로컬 기준. 채팅처럼 «분»까지 남기는 곳이 쓴다. */
function nowStamp(){
  const d = new Date();
  return ymdLocal(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
async function getAIQuotaUsed(){
  const q = await dbGet('ai-quota', { date: todayStr(), count: 0 });
  if(q.date !== todayStr()) return 0;
  return q.count;
}
async function bumpAIQuotaUsed(){
  const used = await getAIQuotaUsed();
  await dbSet('ai-quota', { date: todayStr(), count: used + 1 });
}
async function loadAIQuotaIfNeeded(){
  if(state.aiQuotaUsed !== null) return;
  state.aiQuotaUsed = await getAIQuotaUsed();
  render();
}
async function regenerateOneWithAI(bankId){
  if(state.aiProcessing){ showToast('다른 AI 작업이 진행 중입니다. 끝난 뒤 다시 시도해주세요.'); return; }
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b) return;
  const used = await getAIQuotaUsed();
  if(used >= AI_DAILY_LIMIT){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  state.aiProcessing = true;
  state.aiRegeneratingId = bankId;
  render();
  const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
  const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
  if(twin){
    b.variantContent = twin.content;
    b.variantAnswer = twin.answer;
    b.aiSolution = twin.solution;
    b.status = 'pending';
    await dbSetDoc('problembank', b.id, b);
    await bumpAIQuotaUsed();
    state.aiQuotaUsed = null;
    showToast('다시 생성했습니다. 검토 상태가 초기화됐어요.');
  } else {
    showToast('생성에 실패했습니다. 잠시 후 다시 시도해주세요.');
  }
  state.aiProcessing = false;
  state.aiRegeneratingId = null;
  render();
}
async function processAIQueue(){
  if(state.aiProcessing) return;
  const needsAI = DATA.problemBank.filter(b=>!b.variantContent && !b.variantAnswer);
  if(needsAI.length===0){ showToast('생성할 문항이 없습니다.'); return; }
  const used = await getAIQuotaUsed();
  const remaining = AI_DAILY_LIMIT - used;
  if(remaining<=0){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  const batch = needsAI.slice(0, remaining);
  state.aiProcessing = true;
  state.aiProgress = { done:0, total: batch.length };
  render();
  let ok = 0;
  for(let i=0;i<batch.length;i++){
    const b = batch[i];
    const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
    const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
    if(twin){
      b.variantContent = twin.content;
      b.variantAnswer = twin.answer;
      b.aiSolution = twin.solution;
      await bumpAIQuotaUsed();
      ok++;
    }
    await dbSetDoc('problembank', b.id, b);
    state.aiProgress = { done:i+1, total: batch.length };
    render();
    if(i < batch.length-1) await new Promise(r=>setTimeout(r, 13000));
  }
  state.aiProcessing = false;
  state.aiProgress = null;
  state.aiQuotaUsed = null;
  const leftover = needsAI.length - batch.length;
  showToast(ok + '개 쌍둥이 문제가 생성되었습니다. 검토 후 공개해주세요.' + (leftover>0 ? ` (남은 ${leftover}개는 내일 한도 초기화 후 처리해주세요)` : ''));
  render();
}
// AI가 프롬프트 지시를 놓쳐서 "times"/"le"/"ge" 같은 영단어를 LaTeX 명령어 대신 그대로
// 쓰는 경우가 있어서(프롬프트 개선과 별개로) 이중 안전장치로 한 번 더 다듬는다.
function sanitizeAiMathText(s){
  if(!s) return s;
  return s
    .replace(/(?<!\\)\btimes\b/gi, '\\times')
    .replace(/(?<!\\)\bLEQ\b/gi, '\\leq')
    .replace(/(?<!\\)\bGEQ\b/gi, '\\geq');
}
async function generateTwinViaAI(content, answer, image){
  try{
    const payload = { content, answer };
    if(image){
      if(typeof image === 'string') payload.image = image; // 레거시 base64
      else if(image.fileId) payload.imageFileId = image.fileId; // 신규: 드라이브 파일ID
    }
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(AI_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload)
    }), 45000); // imageFileId 경로는 워커가 드라이브에서 바이트를 먼저 받아와야 해서 기존보다 여유를 둠
    if(!res.ok) throw new Error('worker http ' + res.status);
    const data = await res.json();
    if(!data.content || !data.answer) throw new Error('incomplete AI result');
    return {
      content: sanitizeAiMathText(data.content),
      answer: normalizeTwinAnswer(sanitizeAiMathText(data.answer)),
      solution: data.solution || ''
    };
  }catch(e){
    console.error('AI 쌍둥이 생성 실패', e);
    return null;
  }
}

/* =================== Firestore 컬렉션(문서 여러 개) 헬퍼 =================== */
/* kv 방식(단일 문서에 큰 JSON 저장)은 대량 데이터에는 안 맞아서, 문항 창고처럼
   개수가 많이 늘어날 수 있는 데이터는 문서를 하나씩 따로 저장하는 이 방식을 쓴다. */
function toFirestoreFields(obj){
  const fields = {};
  for(const k in obj){ fields[k] = { stringValue: String(obj[k] ?? '') }; }
  return fields;
}
function fromFirestoreDoc(doc){
  const obj = { id: doc.name.split('/').pop() };
  const fields = doc.fields || {};
  for(const k in fields){ obj[k] = fields[k].stringValue ?? ''; }
  return obj;
}
async function collectionAdd(collectionName, data){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: toFirestoreFields(data) })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    return fromFirestoreDoc(doc);
  }catch(e){ console.error('추가 실패', collectionName, e); return null; }
}
async function collectionListAll(collectionName){
  const out = [];
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    let pageToken = '';
    do{
      const url = FIRESTORE_ROOT + '/' + collectionName + '?pageSize=300' + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await withTimeout(fetch(url, { headers: { Authorization: 'Bearer ' + token } }), 8000);
      if(!res.ok) throw new Error('firestore http ' + res.status);
      const data = await res.json();
      (data.documents || []).forEach(doc => out.push(fromFirestoreDoc(doc)));
      pageToken = data.nextPageToken || '';
    } while(pageToken);
  }catch(e){ console.error('목록 조회 실패', collectionName, e); }
  return out;
}
async function collectionDelete(collectionName, id){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName + '/' + id, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', collectionName, e); }
}

/* =================== 로그인 =================== */
// 출결 기록 중 가장 최근 날짜의 상태가 "퇴원"이면 퇴원 처리된 것으로 본다.
// (학생 계정 자체엔 별도 재적 상태 필드가 없고, 출석부에서 "퇴원"으로 기록하는 게
//  유일한 방법이라 이걸로 판단한다.)
function isWithdrawnRecord(rec){
  if(!rec || !rec.attendance || rec.attendance.length===0) return false;
  const latest = [...rec.attendance].sort((a,b)=>a.date.localeCompare(b.date)).pop();
  return !!latest && latest.status==='퇴원';
}
async function doStudentLogin(){

  const rec = await loadRecord(found.studentId);

/* =================== 로그인 세션 유지 (새로고침해도 로그아웃되지 않도록) =================== */
const SESSION_KEY = 'khm-session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(state.currentUser)); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
async function restoreSession(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ saved = null; }
  if(!saved || !saved.type) return;
  if(saved.type==='teacher'){
    state.currentUser = {type:'teacher'};
    state.view = 'teacher';
  } else if(saved.type==='student'){
    const found = DATA.students.find(s=>s.studentId===saved.studentId);
    if(!found){ clearSession(); return; }
    const rec = await loadRecord(found.studentId);
    if(isWithdrawnRecord(rec)){ clearSession(); return; } // 로그인해 있던 중 퇴원 처리되면 다음 방문 때 자동 로그아웃
    state.currentUser = {type:'student', studentId:found.studentId, name:found.name};
    state.view = 'student';
  } else if(saved.type==='assistant'){
    const found = DATA.assistants.find(a=>a.id===saved.id);
    if(!found){ clearSession(); return; }
    state.currentUser = {type:'assistant', id:found.id, taId:found.taId, name:found.name, classId:found.classId};
    state.view = 'assistant';
    state.assistantTab = state.assistantTab || 'students';
    await loadAllRecordsIfNeeded();
  }
}
function logout(){ clearSession(); state.currentUser = null; goto('home'); }

// 반 일정 문자열(예: "월,수,금 7시~9시")에서 요일 글자를 찾아 요일 인덱스 배열로 변환.
const WEEKDAY_MAP = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function parseScheduleDays(schedule){
  if(!schedule) return [];
  const days = [];
  for(const ch of schedule){
    if(WEEKDAY_MAP[ch]!==undefined && !days.includes(WEEKDAY_MAP[ch])) days.push(WEEKDAY_MAP[ch]);
  }
  return days;
}
// 반 일정을 기준으로 최근(및 며칠 앞) 수업일을 최신순으로 생성한다. "차시" 번호 없이 날짜만 다룬다.
function generateClassSessionDates(schedule, count){
  const days = parseScheduleDays(schedule);
  if(days.length===0) return [];
  const result = [];
  const d = new Date();
  d.setDate(d.getDate()+2); // 다가오는 수업일도 1~2개 미리 보이도록
  while(result.length < count){
    if(days.includes(d.getDay())) result.push(ymdLocal(d));   // getDay()가 로컬이므로 날짜도 로컬로
    d.setDate(d.getDate()-1);
  }
  return result;
}

  const c = DATA.classes.find(c=>c.id===cid);
  return c ? c.name : '[삭제된 반]';
}

// 객관식(①~⑤가 포함된) 문제인지 판별 — 맞으면 텍스트 입력 대신 보기 버튼을 보여준다.
// 채점이 문자열 비교라서, 학생이 "3"이라고 타이핑하면 정답 "③"과 안 맞아 오답 처리되던 문제를 해결.
function isMultipleChoice(content){
  return /①/.test(content||'');
}

/* =================== 학생이 «입력할 수 있는» 정답인가 ===================
   답안 입력칸이 받는 것은 둘뿐이다 — 숫자 입력 아니면 ①~⑤ 보기 버튼(answerInputHTML).
   분수·무리수·음수·문자식이 정답이면 학생은 풀고도 제출할 방법이 없다.
   그래서 AI 프롬프트에 «999 이하 자연수 아니면 객관식»을 못박아 뒀고(worker/gemini-proxy.js),
   여기서는 그 약속이 지켜졌는지 «받는 쪽»에서 한 번 더 확인한다.
   생성 모델은 규칙을 어길 수 있고, 어긴 문항이 조용히 학생에게 가면 아무도 못 푼다. */
const CHOICE_SYMBOLS = ['①','②','③','④','⑤'];
function isPlainNaturalAnswer(a){
  return /^[1-9][0-9]{0,2}$/.test(String(a==null?'':a).trim());   // 1~999
}
/* AI는 formatRule("수식은 $로 감싸라") 때문에 숫자 정답에도 $를 두른다 — 실제로 «$155$»가 나왔다.
   채점이 문자열 비교라 학생이 155를 내면 오답이 된다. 받는 쪽에서 벗겨 둔다.
   벗긴 결과가 999 이하 자연수일 때«만» 벗긴다 — $\frac{1}{2}$ 같은 것은 그대로 둬야
   검토 화면에서 선생님이 진짜 형태를 본다. */
function normalizeTwinAnswer(a){
  const s = String(a==null?'':a).trim();
  const m = s.match(/^\$\s*([0-9]{1,3})\s*\$$/);
  return (m && isPlainNaturalAnswer(m[1])) ? m[1] : s;
}
/* 문제 없으면 null, 있으면 «사람이 읽을 이유»를 돌려준다. */
function answerFormProblem(content, answer){
  const a = String(answer==null?'':answer).trim();
  const mc = isMultipleChoice(content);
  if(!a) return '정답이 비어 있습니다.';
  if(CHOICE_SYMBOLS.includes(a)){
    return mc ? null : '정답이 보기 기호(' + a + ')인데 문제에 ①~⑤ 보기가 없습니다.';
  }
  if(mc) return '문제에 ①~⑤ 보기가 있는데 정답이 보기 기호가 아닙니다 (지금: ' + a + ').';
  if(isPlainNaturalAnswer(a)) return null;
  return '정답이 999 이하 자연수가 아니고 객관식도 아닙니다 (지금: ' + a + '). 학생이 입력할 수 없습니다.';
}
function answerInputHTML(inputId){
  return `<input type="hidden" id="${inputId}">
    <div class="mc-choice-group">
      ${['①','②','③','④','⑤'].map(sym=>`<button type="button" class="mc-choice-btn" onclick="selectChoice('${inputId}','${sym}',this)">${sym}</button>`).join('')}
    </div>`;
}
function selectChoice(inputId, symbol, btnEl){
  const input = document.getElementById(inputId);
  if(input) input.value = symbol;
  const group = btnEl.parentElement;
  group.querySelectorAll('.mc-choice-btn').forEach(b=>b.classList.remove('active'));
  btnEl.classList.add('active');
}
