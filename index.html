        <div class="v">${scStat.avg===null ? '—' : scStat.avg}<s>${scStat.avg===null ? '' : '%'}</s></div></div>

      ${/* 🔴 **«쌍둥이 생성»·«검토 대기»는 여기 세우지 않는다** (2026-08-30 · 사용자가 짚었다) —
           창고는 묶음이 «함께» 쓰는 것이라 **반을 바꿔도 그 두 숫자는 한 글자도 안 달라진다.**
           반 화면의 KPI는 «이 반은 어땠나»만 말해야 한다. 창고 이야기는 아래 한 줄과 「전체」로. */''}

         대신 «어디로 가면 보이는지»는 말해 준다. 그냥 없애면 사라진 줄 안다. */''}

      <span>쌍둥이 <b class="mono">${banks.length}</b>문항
        <s>검토 전 ${bankBy('pending')} · 1차 ${bankBy('review1')} · 공개 ${bankBy('approved')}</s></span>
      <span class="spacer"></span>
      <button class="btn q sm" onclick="examOpenGroup('${g.root}')"
        >문항 내용 · 변형문제는 「전체」에서 ${iconSvg('arrowR',12)}</button>

    <div class="ex-body">

           여기 남은 것은 «보는 것»뿐 — 위의 반 평균 KPI와 아래 한 줄이다. */''}
      ${scStat.of ? `<div class="ex-bankline">
        <span>이 반 성적 <b class="mono">${scStat.n}</b>/${scStat.of}명 입력${
          scStat.avg===null ? '' : ` <s>평균 ${scStat.avg}% · 최고 ${scStat.hi}% · 최저 ${scStat.lo}%</s>`}</span>

      ${/* ⚠ 여기에 `examDetailHTML`을 다시 붙이지 말 것 (2026-08-30) — 문항과 변형문제는
           «문항»에 딸린 것이라 반마다 한 글자도 안 달라진다. 세 반이면 같은 것을 세 번 그린다.
           읽을 것이 20문항 × 원본+변형이라 화면이 그것으로 덮인다. 자리는 「전체」다. */''}
      <div class="rst-pad"></div>
    </div>
  </main>
  ${examSubmissionsHTML(ex)}`;
}

/* 「제출 현황」 서브탭을 여기로 흡수했다 (시안 07의 우측 칸).
   따로 있던 화면은 «모든 시험지 × 모든 학생»을 한 표에 담았는데, 그렇게 보면
   어느 시험지 이야기인지가 흐려진다. 시험지를 고른 채로 그 시험지의 제출을 보는 것이 맞다.
   («이 학생이 전체적으로 얼마나 밀렸나»는 명단의 오답 열과 학생 상세 연대기가 답한다.) */
function examSubmissionsHTML(ex){
  /* ⚠ **여기는 일부러 `classRoster`를 안 쓴다** (W-1 · 2026-08-26) — 시험은 «이미 있었던 일»이다.
     퇴원생을 빼면 **그때 20명이 봤던 시험이 나중에 18명으로 보인다.** 과거를 고쳐 쓰는 셈이다.
     사용자가 「앞으로의 일에서만 뺀다」로 정했다. */
  const roster = DATA.students.filter(s=>studentClassIds(s).includes(ex.classId));
  const banks = examBanks(ex);

  const rows = roster.map(s=>{
    const rec = state.allRecords[s.studentId];
    /* ⚠ **bankId가 아니라 examId로 고른다** (2026-08-29) — 창고를 복사본과 함께 쓰면서
       같은 bankId가 두 반에 걸린다. bankId로 고르면 **다른 반 학생의 숙제가 여기 섞인다.** */
    const hw = (rec && rec.wrongHomework || []).filter(h=>h.examId===ex.id);
    const done = hw.filter(h=>h.done);
    const correct = done.filter(h=>{
      const bank = banks.find(b=>b.id===h.bankId);
      return bank && (h.studentAnswer||'').trim()===(bank.variantAnswer||'').trim();
    });
    return { s, total:hw.length, done:done.length, correct:correct.length, hw };
  }).filter(r=>r.total>0).sort((a,b)=> (a.done/a.total) - (b.done/b.total));

  return `<aside class="co-side ex-side">
    <div style="flex-shrink:0;">
      <span style="font-size:13px;font-weight:700;">이 시험지의 오답숙제</span>
      <div style="font-size:11.5px;color:var(--dim);margin-top:7px;">덜 낸 학생이 위로 옵니다</div>
    </div>
    <div class="co-sbody">
      ${!state.allRecordsLoaded ? '<div style="padding:28px 0;color:var(--dim);font-size:12.5px;">불러오는 중…</div>'
      : rows.length===0 ? '<div style="padding:28px 0;color:var(--dim);font-size:12.5px;line-height:1.7;">아직 이 시험지에서 나간 오답숙제가 없습니다.<br>학생이 틀린 문항을 체크하면 여기 쌓입니다.</div>'
      : rows.map(r=>{
          const open = state.submissionDetailId===r.s.studentId;
          const pct = r.total ? Math.round(r.done/r.total*100) : 0;
          return `<div class="cn-rq">
            <div class="h"><b>${escHtml(r.s.name)}</b>
              <span class="ago">${r.done}/${r.total} 제출</span></div>
            <div style="display:flex;align-items:center;gap:9px;margin-top:7px;">
              <span class="bar" style="flex:1;"><i style="width:${pct}%"></i></span>
              <span style="font-size:11.5px;">정답 <span class="mono">${r.correct}/${r.done}</span></span>
            </div>
            <div class="a">
              <button class="btn q sm" onclick="state.submissionDetailId = ${open?'null':`'${r.s.studentId}'`}; render()">${open?'접기':'문항별'}</button>
              <button class="btn q sm" onclick="rosterOpen('${r.s.studentId}','wronghw')">학생</button>
            </div>
            ${open ? `<div style="margin-top:9px;">${r.hw.map(h=>{
              const bank = banks.find(b=>b.id===h.bankId);
              if(!bank) return '';
              const ok = h.done && (h.studentAnswer||'').trim()===(bank.variantAnswer||'').trim();
              return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line2);font-size:11.5px;">
                <span class="mono" style="width:34px;flex-shrink:0;">${bank.questionNo}번</span>
                <span style="flex:1;min-width:0;color:var(--sub);">${h.done?`낸 답 ${escHtml(h.studentAnswer||'')}`:'미제출'}</span>
                ${h.done ? `<span class="badge ${ok?'ok':'no'}">${ok?'정답':'오답'}</span>` : '<span class="badge">—</span>'}
              </div>`;
            }).join('')}</div>` : ''}
          </div>`;
        }).join('')}
    </div>
  </aside>`;
}

         저장을 막지는 않는다 — 막으면 급할 때 등록 자체를 못 한다. 대신 사실을 말해 준다. */''}

      return n ? `<div class="fm-warn" style="margin-top:10px;">단원을 정하지 않은 문항이 <b>${n}개</b> 있습니다.
        그대로 저장하면 그 문항은 <b>데일리퀴즈에 나오지 않습니다</b> (오답숙제로는 나갑니다).</div>` : ''; })()}

      <button class="btn no" onclick="clearExamQuestions()">문항 전체 삭제</button>

/* =================== 오답 검토 (design-v1/04-review) ===================
   역할은 «쌓인 것을 비운다». A4에서 흡수한 것 셋 — 큐 · 2열 비교 · 키보드. 다크 테마는 버렸다.

   예전 화면은 카드를 세로로 나열했다. 한 건을 판단하려면 원본과 쌍둥이를 나란히 봐야 하는데,
   카드가 길어 스크롤하는 동안 원본이 화면 밖으로 나갔다. 2열로 고정하면 그 왕복이 사라진다.

   **큐는 시안과 다르다.** 시안은 「재생성 요청 · 난도 확인 필요 · 보류함」을 그렸는데
   도메인에 그런 상태가 없다. 실제 상태는 pending → review1 → approved 셋뿐이다.
   지어내지 않고 실제로 갈라지는 축으로 큐를 짰다 —
   내용 없음(AI 생성 필요) / 1차 대기 / 2차 대기 / 답 형태 문제 / 공개됨.

   「보류」도 넣지 않았다. 보류 상태를 만들려면 problembank에 필드를 더해야 하는데,
   pending에 머무는 것이 이미 «아직 안 봤다»와 같은 뜻이라 층을 하나 더 둘 이유가 없다. */

const REVIEW_QUEUES = [
  ['empty',    '내용 없음',    'y', b => !b.variantContent && !b.variantAnswer],
  ['pending',  '1차 검토 대기', 'r', b => b.status==='pending' && (b.variantContent || b.variantAnswer)],
  ['review1',  '2차 검토 대기', 'y', b => b.status==='review1'],
  /* 「답 형태 문제」와 같은 성격의 줄이다 — 상태와 상관없이 «공개를 막고 있는 것»을 모은다.
     그림이 있어야 푸는 변형인데 아직 안 그려진 것. 손이 가야 비는 줄이라 따로 세운다. */
  ['nofig',    '그림 필요',    'r', b => !!b.variantNeedsFigure && !b.hasVariantImage],
  ['bad',      '답 형태 문제',  'r', b => (b.variantContent || b.variantAnswer) && !!answerFormProblem(b.variantContent, b.variantAnswer)],
  ['approved', '공개됨',       'g', b => b.status==='approved']
];

function reviewQueueList(key){
  const q = REVIEW_QUEUES.find(x=>x[0]===key) || REVIEW_QUEUES[1];
  return DATA.problemBank.filter(q[3]);
}

/* 한 문항을 손봐서 그것이 «지금 보고 있는 큐»의 조건에서 빠졌을 때, 큐를 문항 따라 옮긴다.
   그대로 두면 방금 손댄 사람이 **빈 화면**을 마주한다 — 그리고 이어서 할 일(붙인 그림을 보고
   공개하기 · 다시 생성한 내용 검토하기)이 바로 그 문항에 달려 있다.
   ⚠ **한 문항을 손보는 «버튼 핸들러»에서만 부른다.** 일괄 작업은 큐를 옮기면 안 된다 —
      스무 건을 도는 중에 화면이 튀고, 어느 것을 따라갈지도 정할 수 없다.
   가는 곳은 REVIEW_QUEUES 순서상 **처음 걸리는 줄**이다. 이 순서가 곧 「먼저 손봐야 하는 것」이다. */
function followBankToQueue(b){
  const cur = REVIEW_QUEUES.find(q => q[0] === (state.reviewQueue || 'pending'));
  if(cur && cur[3](b)) return;                 // 아직 이 큐에 있다면 건드리지 않는다
  const next = REVIEW_QUEUES.find(q => q[3](b));
  if(!next) return;                            // 어느 줄에도 안 걸리면 그대로 둔다
  state.reviewQueue = next[0];
  state.reviewSelectedId = b.id;
}

function goReviewQueue(key){
  state.reviewQueue = key;
  state.reviewSelectedId = null;   // 큐를 옮기면 선택도 옮긴다
  render();
}
function selectReviewItem(id){ state.reviewSelectedId = id; render(); }

/* J/K로 큐 안을 오르내린다. 목록 «순서»가 기준이라 화면에 보이는 것과 어긋나지 않는다. */
function reviewMove(delta){
  const list = reviewQueueList(state.reviewQueue || 'pending');
  if(list.length===0) return;
  let i = list.findIndex(b=>b.id===state.reviewSelectedId);
  if(i < 0) i = 0; else i = Math.max(0, Math.min(list.length-1, i + delta));
  state.reviewSelectedId = list[i].id;
  render();
  const el = document.querySelector('.rv-item.on');
  if(el) el.scrollIntoView({ block:'nearest' });
}

/* 승인/반려 뒤에는 «다음 것»으로 넘어간다 — 큐를 비우는 화면이라 손이 멈추면 안 된다.
   지금 항목이 큐에서 빠지므로, 빠지기 «전»에 다음 대상을 정해 둔다. */
async function reviewAdvance(id, next){
  const list = reviewQueueList(state.reviewQueue || 'pending');
  const i = list.findIndex(b=>b.id===id);
  const after = list[i+1] || list[i-1] || null;
  await advanceBankStatus(id, next);
  const b = DATA.problemBank.find(x=>x.id===id);
  const stillHere = reviewQueueList(state.reviewQueue || 'pending').some(x=>x.id===id);
  if(!stillHere) state.reviewSelectedId = after ? after.id : null;
  render();
}

/* =================== 문항 코드 조회 (2026-09-03 · I-3) ===================
   🔴 **번호를 «세는 일»을 없앤다.**
     한글에서 복습테스트를 만들며 「이건 몇 번째 변형이지?」를 알 길이 없었다.
     세는 것을 돕는 대신 **다음 번호를 그냥 말해 준다** — 받아 적으면 끝이다.
     (「어긋남은 설명할 것이 아니라 없앨 것이다」와 같은 결이다.)
   ⚠ 번호를 «예약»하지 않는다. 받아 적고 안 쓰면 그 번호는 다음에 다시 나온다.
     일련번호는 뜻이 없어 구멍이 나도 되고, **구멍보다 겹치는 것이 위험**하다. */
const SUBJECT_OF_CODE = { K1:'공통수학1', K2:'공통수학2', AL:'대수', C1:'미적분Ⅰ',
                          PS:'확률과통계', GE:'기하', C2:'미적분Ⅱ' };
const BOOK_OF_CODE    = { E:'엔딩크레딧', S:'학교 기출', D:'동그랑땡 모의고사', A:'시중교재' };
const SCENE_MEANING   = { '1':'기본유형 — 배운 규칙을 한 번 적용',
                          '2':'발전유형 — 조건이 한 겹 얹힌다',
                          '3':'실전 — 다른 눈이 필요하다' };

/* 단원 «이름»을 번호로 찾는다.
   🔵 **자리를 안 본다** — `UNIT_CHAPTER_DEFS` 가 번호를 못박아 들고 있어서,
     단원을 옮기거나 중간에 끼워도 이름이 안 어긋난다 (2026-09-03 · 기획서 02·B). */
function chapterNameOf(subjectCode, chapNo){
  return chapterNameOfNo(SUBJECT_OF_CODE[subjectCode], chapNo);
}

/* 이 코드가 «어느 시험지에 나갔나». 장부에는 없는 것이라 problemBank 에서 캐 온다 —
   창고와 실제 수업을 잇는 유일한 줄이다. */
function icUsedIn(code){
  return DATA.problemBank.filter(b => b.itemCode === code).map(b => {
    const ex = DATA.exams.find(e => e.id === b.examId);
    return { no: b.questionNo, title: ex ? ex.title : '(지운 시험지)',
             date: ex ? ex.date : '', cls: ex ? classNameOf(ex.classId) : '' };
  });
}

function icLookup(){
  const el = document.getElementById('ic-q');
  state.icQuery = el ? el.value : '';
  render();
}
function icPick(code){ state.icQuery = code; render(); }
function icCopy(text){
  if(navigator.clipboard) navigator.clipboard.writeText(text);
  showToast(text + ' 를 복사했습니다 — 한글 미주 맨 앞에 붙여넣으세요.');
}
/* 🔵 **문항 카드** — 코드 하나에 붙은 것을 다 모아 보인다.
   장부가 아는 것(단원·출처·정답·SCENE·해설 앞머리)에, 장부가 모르는 것 하나를 더한다:
   **이 문항이 어느 시험지에 나갔나**(problemBank). 그게 창고와 수업을 잇는 줄이다. */
function icItemCardHTML(root, it, vs){
  const sp = splitItemCode(root) || {};
  const m  = String(root).match(ITEM_CODE_RE) || [];
  const subjCode = m[1] || '', chapNo = m[2] || '', bookCode = m[3] || '';
  const subj = SUBJECT_OF_CODE[subjCode] || subjCode;
  const chap = chapterNameOf(subjCode, chapNo);
  const book = BOOK_OF_CODE[bookCode] || bookCode;
  const used = icUsedIn(root);
  const sceneNo = it && it.scene ? String(it.scene).replace(/\D/g,'') : '';

  if(!it){
    return `<div class="ic-card">
      <div class="ic-ch"><b class="mono">${escHtml(root)}</b>
        <span class="ic-cw">창고에 없는 문항입니다</span></div>
      <div class="ic-cb"><div class="ic-crow"><span class="ic-cl">코드가 말하는 것</span>
        <span>${escHtml(subj)}${chapNo?' · '+chapNo+(chap?' '+chap:''):''}${book?' · '+book:''}</span></div>
        <div class="ic-crow"><span class="ic-cl">왜 없나</span>
        <span>오타이거나, <b>아직 코드를 안 심은 교재</b>입니다.
          지금 창고에 있는 것은 ${(state.itemIndex||[]).map(L=>escHtml((SUBJECT_OF_CODE[L.subject]||L.subject)+' '+(BOOK_OF_CODE[L.book]||L.book)+' '+L.count+'제')).join(' · ')||'없습니다'}</span></div>
      </div></div>`;
  }

  return `<div class="ic-card">
    <div class="ic-ch">
      <b class="mono">${escHtml(root)}</b>
      <span class="ic-ct">${escHtml(subj)} <s>·</s> ${escHtml(chapNo)}${chap?' '+escHtml(chap):''} <s>·</s> ${escHtml(book)}</span>
      <span style="flex:1;"></span>
      <span class="${vs.length?'ic-have':'ic-none'}">변형 <b class="mono">${vs.length}</b>개</span>
    </div>
    <div class="ic-cb">
      <div class="ic-crow"><span class="ic-cl">출처</span>
        <span><b>${escHtml((it.source&&it.source.book)||'출처없음')}</b>
        ${it.source&&it.source.label&&it.source.label!==it.source.book
          ? `<s class="ic-cs">문서에는 「${escHtml(it.source.label)}」로 적혀 있습니다</s>` : ''}</span></div>
      ${/* 🔴 **정답과 해설은 장부에 없다** — 장부는 배포에 실려 나가는 파일이라
             주소만 알면 누구나 받는다. 564제의 정답을 거기 두면 학생이 미리 본다.
             정답은 시험지를 올릴 때 `problemBank` 로 들어와 검토 화면에서 보인다. */''}
      ${it.answer ? `<div class="ic-crow"><span class="ic-cl">정답</span>
        <span><b class="mono">${escHtml(it.answer)}</b>
          <s class="ic-cs">${escHtml(it.answerKind||'')}</s></span></div>` : ''}
      ${sceneNo ? `<div class="ic-crow"><span class="ic-cl">자리</span>
        <span>SCENE <b>${escHtml(sceneNo)}</b>
          <s class="ic-cs">${escHtml(SCENE_MEANING[sceneNo]||'')}</s></span></div>` : ''}
      ${it.noteHead ? `<div class="ic-crow"><span class="ic-cl">해설 첫머리</span>
        <span class="ic-cq">${escHtml(it.noteHead)}…</span></div>` : ''}
      ${it.flag ? `<div class="ic-crow"><span class="ic-cl">눈으로 볼 것</span>
        <span style="color:var(--no);font-weight:600;">${escHtml(it.flag)}</span></div>` : ''}
      <div class="ic-crow"><span class="ic-cl">쓰인 곳</span>
        <span>${used.length
          ? used.map(u=>`${escHtml(u.title)} <b>${u.no}번</b>
              <s class="ic-cs">${escHtml(u.cls||'')}${u.date?' · '+escHtml(u.date):''}</s>`).join('<br>')
          : '<s class="ic-cs">아직 시험지에 안 나갔습니다</s>'}</span></div>
    </div>
  </div>`;
}

/* 코드를 다 안 쳐도 찾아 준다 — `K2-05` 로 그 단원을, `0431` 로 그 번호를.
   🔵 **나중에 학생이 쓸 검색이 바로 이것**이다. 강사가 먼저 써 보고 다듬는 셈이다. */
function icPartialHTML(raw){
  const q = raw.trim().toUpperCase().replace(/\s+/g,'');
  const all = Object.keys(state.itemByCode);
  const hits = all.filter(c => c.includes(q)).sort().slice(0, 40);
  if(!hits.length){
    return `<div class="rst-empty">「<b class="mono">${escHtml(raw)}</b>」 로 찾은 것이 없습니다.<br>
      <span class="mono">K2-05-E-0431</span> 처럼 다 넣거나,
      <span class="mono">K2-05</span>·<span class="mono">0431</span> 처럼 일부만 넣어도 됩니다.</div>`;
  }
  const more = all.filter(c => c.includes(q)).length - hits.length;
  return `<div class="ic-list" style="margin-top:0;">
    ${hits.map(c=>{
      const x = state.itemByCode[c];
      const n = variantsOfCode(c).length;
      return `<div class="ic-row" style="cursor:pointer;" onclick="icPick('${escHtml(c)}')">
        <b class="mono">${escHtml(c)}</b>
        <span class="ic-kind">${escHtml(x.chapter||'')}</span>
        ${/* 장부에 정답·해설이 없다(일부러다) — 있는 것만 보인다. */''}
        <span class="ic-txt">${escHtml((x.source&&x.source.book)||'')}
          <s class="ic-cs">${escHtml(x.scene||'')}</s></span>
        ${n ? `<span class="ic-have">변형 ${n}</span>` : ''}
        ${x.answer ? `<span class="mono ic-a">${escHtml(x.answer)}</span>` : ''}
      </div>`;
    }).join('')}
  </div>
  ${more>0 ? `<div class="rst-empty" style="margin-top:8px;">${more}개가 더 있습니다 — 더 좁혀 주세요.</div>` : ''}`;
}

function teacherItemCodeHTML(){
  if(!state.itemByCode){
    loadItemStoreIfNeeded().then(()=>{ if(state.itemByCode) render(); });
    return `<div class="st-sec"><div class="st-h">문항 코드</div>
      <div class="rst-empty">문항 창고를 여는 중…</div></div>`;
  }
  const raw  = state.icQuery || '';
  const sp   = splitItemCode(normItemCode(raw) || raw.trim().toUpperCase());
  const root = sp ? sp.origin : '';
  const it   = root ? itemOfCode(root) : null;
  const vs   = root ? variantsOfCode(root) : [];
  const total = Object.keys(state.itemByCode).length;

  const body = !raw.trim()
    ? `<div class="rst-empty">코드를 넣으면 <b>이미 만들어 둔 변형</b>과 <b>다음 번호</b>를 알려 드립니다.<br>
        창고에 원본 <b class="mono">${total}</b>제가 있습니다.</div>`
    : !sp
      ? icPartialHTML(raw)
      : `${icItemCardHTML(root, it, vs)}
        ${/* 🔵 이 표가 이 화면의 전부다 — 갈래마다 «다음 번호» 하나씩. */''}
        <div class="ic-next">
          ${VARIANT_KINDS.map(([k,label])=>{
            const got = vs.filter(v=>v.variantKind===k);
            const next = nextVariantCode(root, k);
            return `<div class="ic-nrow">
              <span class="ic-nlab">${label}</span>
              <span class="ic-ncnt">지금 <b class="mono">${got.length}</b>개</span>
              <b class="mono ic-ncode">${escHtml(next)}</b>
              <span class="ic-nhint">다음은 이 번호</span>
              <button class="btn q sm" onclick="icCopy('${escHtml(next)}')">복사</button>
            </div>`;
          }).join('')}
        </div>
        ${vs.length ? `<div class="ic-list" style="margin-top:12px;">
          ${vs.map(v=>`<div class="ic-row">
            <b class="mono">${escHtml(v.code)}</b>
            <span class="ic-kind">${escHtml((VARIANT_KINDS.find(x=>x[0]===v.variantKind)||['','?'])[1])}</span>
            <span class="ic-txt">${escHtml(String(v.content||'').replace(/\s+/g,' ').slice(0,72))}</span>
            <span class="mono ic-a">${escHtml(v.answer||'—')}</span>
          </div>`).join('')}
        </div>` : `<div class="rst-empty" style="margin-top:12px;">아직 이 문항의 변형이 없습니다 —
          <b class="mono">${escHtml(nextVariantCode(root,'N'))}</b> 부터 시작하시면 됩니다.</div>`}`;

  return `<div class="st-sec">

      <span style="font-size:13px;font-weight:700;">${REVIEW_QUEUES.find(q=>q[0]===qkey)[1]}</span>
      <span class="muted" style="font-size:11.5px;">${list.length}건</span>
    </div>

      ${list.length===0 ? '<div style="padding:36px 12px;text-align:center;color:var(--dim);font-size:12.5px;">비어 있습니다.</div>'

function reviewSelected(list){

/* 그림 문항의 변형이 어느 길로 갔는지 검토자에게 말해 주고, 그려야 하면 그 자리에 문을 연다.
   갈래는 워커가 고른다 (worker/gemini-proxy.js) —

     (B) needsFigure 그림을 읽는 것 자체가 물음이라 구조는 두고 수만 바꿨다.
                     **사람이 그려 붙여야** 다음으로 간다. 그래서 여기가 그 작업대다
   (B)를 (A)로 강제했더니 그림 하나를 문장으로 전부 풀어 써서 원본보다 길고 어려운 문제가
   나왔다 (2026-08-11). 갈래를 되돌리는 대신 «그리는 일»을 사람에게 넘긴 것이 이 화면이다. */
function variantFigureNoteHTML(b){

  const busy = state.figureUploading===b.id;

       모델이 (B)를 고르고는 「원본 그림과 동일함 (변형 없음)」이라고 적어 냈다.
       그림도 본문도 원본 그대로인데 정답만 달라져 있었으니, 그건 쌍둥이가 아니라 틀린 문제다.
       프롬프트로도 막았지만 이건 «지나간 뒤에» 잡는 문이다 — 검토자가 눈으로 놓칠 수 있다. */
    const unchanged = /원본과\s*동일|원본\s*그림과\s*동일|변형\s*없음|바뀌는\s*것\s*없음/.test(spec);
    const specBox = `<div class="rv-spec">${spec ? escHtml(spec)

      + (unchanged ? `<div class="rv-fignote" style="color:var(--no);">
          <b>AI가 그림을 그대로 두겠다고 적었습니다.</b> 그러면 원본과 같은 문제입니다 —
          정답만 다르다면 그 정답이 틀린 것입니다. <b>「AI로 다시 생성」</b>을 권합니다.</div>` : '');
    /* 함수 그래프는 기계가 먼저 그려 볼 수 있다. 되면 강사 손이 아예 안 가고,
       안 되면 «못 그린다»고 말하고 물러난다 — 지어낸 그림보다 그쪽이 옳다. */
    const draftBtn = (busy || state.figureDrafting===b.id) ? ''
      : `<button class="btn sm" onclick="requestFigureDraft('${b.id}')">${iconSvg('sparkle',13)} 초안 그려 보기</button>`;
    if(b.hasVariantImage) return `<div class="rv-fig on">
      <b>이 변형에 붙는 그림</b>
      ${pbImageHTML(b.id, 'var', 'pb-fig')}
      <div class="rv-figact">${busy?'<span class="hx">올리는 중…</span>':fileInput}
        ${draftBtn}
        <button class="btn no sm" onclick="removeVariantFigure('${b.id}')">그림 지우기</button></div>
      ${figureDraftHTML(b)}
      ${specBox}
    </div>`;
    return `<div class="rv-fig">
      <b>그림을 그려서 올려야 합니다</b>
      <span class="hx">그림을 읽어 내는 것이 이 문제의 물음이라, AI가 구조는 그대로 두고 수만 바꿨습니다.
        그림이 붙기 전에는 <b>학생에게 공개할 수 없습니다.</b>
        <b>「초안 그려 보기」</b>를 누르면 기계가 먼저 그려 봅니다 — 함수 그래프라면 대개 됩니다.</span>
      ${specBox}
      <div class="rv-figact">${busy?'<span class="hx">올리는 중…</span>':fileInput}
        ${draftBtn}</div>
      <span class="hx">사진으로 찍어 올려도 됩니다 — 올리면서 자동으로 압축됩니다.</span>
      ${figureDraftHTML(b)}
    </div>`;
  }
  if(b.variantFigureFree) return `<div class="rv-fignote">
    원본에 그림이 있어 <b>그림 없이 풀 수 있는 문제</b>로 새로 썼습니다.
    필요한 값이 본문에 다 적혀 있는지 확인해 주세요 —
    「다음 그림과 같이」 같은 말이 남아 있으면 학생이 못 풉니다.</div>`;
  /* (C) — 그림이 «배경»이라 그릴 것이 없다. 지도·배치도·대진표가 여기로 온다.
     대신 볼 것이 하나 있다: 그림에 수치가 적혀 있는데 본문의 수가 바뀌었다면 둘이 모순된다. */

    <b>그림에 적힌 수치가 본문과 어긋나지 않는지</b>만 확인해 주세요. 어긋나면 다시 생성해야 합니다.</div>`;

  return `<div class="rv-fignote">

    그림과 본문의 수가 어긋나 있으면 다시 생성하거나 직접 고쳐 주세요.</div>`;
}

/* =================== (B)의 그림 초안 — 기계가 먼저 그려 본다 ===================
   (B)의 대가가 「강사가 손으로 그린다」인데, 함수 그래프는 기계가 그릴 수 있다.
   ⚠ **AI에게 그리게 하지 않는다.** 워커가 내는 것은 «무엇을 그릴지»를 적은 장면(scene)이고,
   그림은 figure.js가 그린다. 그러면 «정말 x=2에서 x축을 만나는가»를 **검산할 수 있다.**

   초안은 **저장하지 않는다.** state에만 담아 두고 검토자가 「이 그림으로 하겠습니다」를
   눌러야 붙는다 — 검산을 통과했다는 것과 «이 문제에 맞다»는 것은 다른 판단이다. */
async function requestFigureDraft(bankId){
  if(state.aiProcessing || state.figureDrafting){ showToast('다른 AI 작업이 진행 중입니다.'); return; }
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b) return;
  const used = await getAIQuotaUsed();
  if(used >= AI_DAILY_LIMIT){ showToast('오늘 AI 생성 한도('+AI_DAILY_LIMIT+'건)를 모두 사용했습니다.'); return; }
  state.figureDrafting = bankId;
  state.figureDraft = null;
  render();
  const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
  const r = await fetchFigureSceneViaAI(b.variantFigureSpec||'', b.variantContent||'', image);
  state.figureDrafting = null;
  if(!r){ showToast('초안을 받지 못했습니다. 다시 시도하거나 직접 그려 올려주세요.'); render(); return; }
  if(r.quotaExceeded){ showToast('오늘 AI 생성 한도를 모두 사용했습니다.'); render(); return; }
  if(r.unsupported){
    state.figureDraft = { bankId, unsupported:true, reason:r.reason };
    render(); return;
  }
  /* ★ 검문. 통과 못 하면 그림은 그려 두되 «쓸 수 없음»으로 보여 준다 —
     무엇이 어긋났는지 눈으로 봐야 다시 생성할지 직접 그릴지 정할 수 있다. */
  let v = null, svg = '';
  try{
    v = Figure.verifyScene(r.scene);
    svg = Figure.renderScene(r.scene);
  }catch(e){
    console.error('장면을 그리지 못했다', e);
    state.figureDraft = { bankId, unsupported:true, reason:'받은 장면을 그리지 못했습니다.' };
    render(); return;
  }
  state.figureDraft = { bankId, scene:r.scene, svg, ok:v.ok, failures:v.failures };
  render();
}
function discardFigureDraft(){ state.figureDraft = null; render(); }

/* 초안을 이 변형의 그림으로 삼는다. 손으로 올린 것과 **같은 문서·같은 플래그**를 쓴다 —
   그래야 「그림 필요」 큐·공개 잠금·다시 생성 시 버리기가 전부 그대로 동작한다.
   ⚠ 그린 SVG와 장면을 **둘 다** 저장한다. 장면만 두고 볼 때마다 다시 그리면, 나중에
   렌더러를 손보는 날 **검토자가 승인한 그림이 조용히 달라진다.** */
async function acceptFigureDraft(bankId){
  const d = state.figureDraft;
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!d || d.bankId!==bankId || !d.svg || !b) return;
  state.figureUploading = bankId;
  render();
  try{
    if(b.hasVariantImage) await dropVariantFigure(b);
    const doc = { kind:'svg', svg:d.svg, scene:d.scene, at:new Date().toISOString() };
    await dbSet('pbvimg:'+bankId, doc);
    state.pbImageCache[pbImgCacheKey(bankId, 'var')] = doc;
    b.hasVariantImage = true;
    await dbSetDoc('problembank', b.id, b);
    /* 손으로 올릴 때와 같은 이유로 큐를 문항 따라 옮긴다 — 붙인 사람이 빈 큐를 마주하면 안 된다. */
    followBankToQueue(b);
    state.figureDraft = null;
    showToast('그림을 붙였습니다. 이제 공개할 수 있습니다.');
  }catch(e){
    console.error('초안 저장 실패', e);
    showToast('그림을 붙이지 못했습니다. 다시 시도해주세요.');
  }
  state.figureUploading = null;
  render();
}

/* 초안 상자. 「그림 필요」 작업대 안에 산다. */
function figureDraftHTML(b){
  if(state.figureDrafting===b.id)
    return `<div class="rv-draft"><b>초안을 그리는 중…</b>
      <span class="hx">지침과 원본 그림을 보고 «무엇을 그릴지»를 받아 와서 그립니다.</span></div>`;
  const d = state.figureDraft;
  if(!d || d.bankId!==b.id) return '';
  if(d.unsupported)
    return `<div class="rv-draft no"><b>기계가 그릴 수 없는 그림입니다</b>
      <span class="hx">${escHtml(d.reason||'')} — <b>직접 그려서 올려주세요.</b></span>
      <div class="rv-figact"><button class="btn sm" onclick="discardFigureDraft()">닫기</button></div></div>`;
  return `<div class="rv-draft ${d.ok?'ok':'no'}">
    <b>${d.ok ? '초안 — 검산을 통과했습니다' : '초안 — 검산에 걸렸습니다'}</b>
    <span class="hx">${d.ok
      ? '지침에 적힌 값이 그림에서 실제로 그렇게 되는지 확인했습니다. <b>문제에 맞는지는 눈으로 보고 정해주세요.</b>'
      : '아래가 어긋납니다. <b>이대로 붙일 수 없습니다</b> — 다시 받거나 직접 그려주세요.'}</span>
    ${d.ok ? '' : `<ul class="rv-draftfail">${d.failures.map(f=>`<li>${escHtml(f.msg)}</li>`).join('')}</ul>`}
    <div class="pb-svg">${d.svg}</div>
    <div class="rv-figact">
      ${d.ok ? `<button class="btn p sm" onclick="acceptFigureDraft('${b.id}')">이 그림으로 하겠습니다</button>` : ''}
      <button class="btn sm" onclick="requestFigureDraft('${b.id}')">다시 받기</button>
      <button class="btn sm" onclick="discardFigureDraft()">버리기</button>
      <span class="hx">다시 받으면 한도를 하나 더 씁니다.</span>
    </div>
  </div>`;
}

/* 그린 그림을 붙인다. 원본 그림과 같은 길(압축 → 드라이브)을 쓰고 문서만 pbvimg:{id}로 따로 둔다. */
async function uploadVariantFigure(bankId, fileList){
  const file = (fileList||[])[0];
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!file || !b) return;
  state.figureUploading = bankId;
  render();
  try{
    if(b.hasVariantImage) await dropVariantFigure(b);   // 갈아끼우는 것이면 옛것을 먼저 치운다
    const img = await uploadImageToDrive(file);
    await dbSet('pbvimg:'+bankId, img);
    state.pbImageCache[pbImgCacheKey(bankId, 'var')] = img;
    b.hasVariantImage = true;
    await dbSetDoc('problembank', b.id, b);
    /* 그림이 붙는 순간 이 문항은 「그림 필요」 큐에서 빠진다. 그대로 두면 방금 올린 사람이
       빈 큐를 마주한다 — 올린 그림을 보고 공개까지 이어서 해야 하므로 문항을 따라 큐를 옮긴다. */
    followBankToQueue(b);
    showToast('그림을 올렸습니다. 이제 공개할 수 있습니다.');
  }catch(e){
    console.error('변형 그림 업로드 실패', e);
    showToast('그림 업로드에 실패했습니다. 다시 시도해주세요.');
  }
  state.figureUploading = null;
  render();
}
async function removeVariantFigure(bankId){
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b || !b.hasVariantImage) return;

/* 문항 코드 띠 — «만들기» 위에 놓는다 (2026-09-03 · I-2).
   🔴 **자리가 곧 뜻이다.** 만들기 단추보다 «위»에 있어야 「먼저 찾는다」가 읽힌다.
     아래에 두면 이미 만들고 난 뒤에 보게 되고, 그러면 있으나 마나다. */
function itemCodeStripHTML(b){
  const loaded = !!state.itemByCode;
  if(!loaded){
    /* 창고를 아직 안 받았다 — 이 화면을 연 김에 받아 두고 다시 그린다.
       ⚠ render() 안에서 부르므로 await 하지 않는다. 끝나면 스스로 다시 그린다. */
    loadItemStoreIfNeeded().then(()=>{ if(state.itemByCode) render(); });
    return `<div class="ic-strip"><span class="ic-load">문항 창고를 여는 중…</span></div>`;
  }
  const code = b.itemCode || '';
  /* 🔴 **이 문항이 «변형»일 수 있다.** 복습테스트 시험지가 그렇다 — 문항 자체가 N01 이다.
     그때 «이 코드의 변형»을 찾으면 언제나 0개다. 찾아야 할 것은 **원본의 형제들**이다. */
  const sp   = code ? splitItemCode(code) : null;
  const root = sp ? sp.origin : code;
  const it   = root ? itemOfCode(root) : null;
  const vs   = root ? variantsOfCode(root) : [];
  const mine = sp && sp.isVariant ? vs.find(v=>v.code===code) : null;

  if(!code){
    return `<div class="ic-strip">
      <span class="ic-k">문항 코드</span>
      <input class="ic-in mono" id="ic-in-${b.id}" placeholder="K2-05-E-0431"
        onkeydown="if(event.key==='Enter'&&!event.isComposing)setBankItemCode('${b.id}')">
      <button class="btn q sm" onclick="setBankItemCode('${b.id}')">잇기</button>
      <span class="ic-hint">교재 미주 맨 앞의 <span class="mono">[K2-05-E-0431]</span> 을 적으면
        <b>이미 만들어 둔 변형</b>을 먼저 찾아봅니다 ·
        <a href="#teacher/itemcode" style="color:var(--brand);"
           onclick="goTeacherTab('itemcode');render();return false;">코드를 모르면 여기서 찾기</a></span>
    </div>`;
  }

  const byKind = VARIANT_KINDS.map(([k,label])=>{
    const got = vs.filter(v=>v.variantKind===k);
    return got.length ? `<span class="ic-kind">${label} <b class="mono">${got.length}</b></span>` : '';
  }).join('');

  const kindName = sp && sp.isVariant
    ? (VARIANT_KINDS.find(x=>x[0]===sp.variantKind)||['','?'])[1] : '';

  return `<div class="ic-strip on">
    <span class="ic-k">문항 코드</span>
    <b class="ic-code mono">${escHtml(code)}</b>
    ${sp && sp.isVariant
      ? `<span class="ic-meta"><b class="mono">${escHtml(sp.origin)}</b> 의 <b>${kindName} ${escHtml(sp.variantNo)}</b></span>
         ${mine ? '' : `<button class="btn q sm" onclick="registerVariantFromBank('${b.id}')">창고에 넣기</button>`}`
      : (it ? `<span class="ic-meta">${escHtml(it.chapter||'')} · ${escHtml((it.source&&it.source.book)||'')}
          ${it.answer ? '· 정답 <b>'+escHtml(it.answer)+'</b>' : ''}</span>`
            : '<span class="ic-meta warn">창고에 없는 코드</span>')}
    <button class="btn q sm" onclick="if(confirm('이 문항의 코드를 뗄까요?')){const b=DATA.problemBank.find(x=>x.id==='${b.id}');b.itemCode='';dbSetDoc('problembank',b.id,b);render();}">떼기</button>
    <span style="flex:1;"></span>
    ${vs.length
      ? `<span class="ic-have">${sp && sp.isVariant ? '형제 변형' : '이미 있는 변형'} <b class="mono">${vs.length}</b>개</span>${byKind}`
      : `<span class="ic-none">아직 만들어 둔 변형이 없습니다</span>`}
  </div>
  ${vs.length ? `<div class="ic-list">
    ${vs.map(v=>`<div class="ic-row">
      <b class="mono">${escHtml(v.code)}</b>
      <span class="ic-kind">${escHtml((VARIANT_KINDS.find(x=>x[0]===v.variantKind)||['','?'])[1])}</span>
      <span class="ic-txt">${escHtml(String(v.content||'').replace(/\s+/g,' ').slice(0,64))}</span>
      <span class="mono ic-a">${escHtml(v.answer||'—')}</span>
      <button class="btn q sm" onclick="useVariantFromStore('${b.id}','${escHtml(v.code)}')">가져오기</button>
    </div>`).join('')}
  </div>` : ''}
  ${(b.variantContent || b.variantAnswer) ? `<div class="ic-save">
    <span>지금 이 변형을 창고에 넣어 두면 <b>다음엔 찾아집니다</b> — 어느 갈래입니까?</span>
    ${/* 셋 다 받침으로 끝나므로 「으로」다 — 「숫자변형로」가 되어 있었다. */''}
    ${VARIANT_KINDS.map(([k,label])=>`<button class="btn q sm" onclick="saveVariantToStore('${b.id}','${k}')">${label}으로 저장</button>`).join('')}
  </div>` : ''}`;
}

/* 키보드 — 검토 화면에서만 듣는다. 입력칸에 커서가 있으면 아무 것도 하지 않는다
   (문항을 고치다가 J를 치면 다음 문항으로 튀어 버린다). */
document.addEventListener('keydown', e=>{
  if(state.teacherTab!=='review' || state.studentDetailId) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return;
  const list = reviewQueueList(state.reviewQueue || 'pending');
  const b = reviewSelected(list);
  const k = e.key.toLowerCase();
  /* J=이전 · K=다음. 처음엔 vi식(J=아래)이었는데 쓰는 사람 손에 안 맞아 뒤집었다 (2026-08-10). */
  if(k==='j'){ e.preventDefault(); reviewMove(-1); }
  else if(k==='k'){ e.preventDefault(); reviewMove(1); }
  else if(!b) return;
  else if(k==='e'){
    e.preventDefault();
    if(b.status==='pending' && (b.variantContent||b.variantAnswer)) reviewAdvance(b.id,'review1');
    else if(b.status==='review1') reviewAdvance(b.id,'approved');
  }
  else if(k==='x'){
    e.preventDefault();
    if(b.status==='approved') reviewAdvance(b.id,'review1');
    else if(b.status==='review1') reviewAdvance(b.id,'pending');
  }
  else if(k==='r'){ e.preventDefault(); if(!state.aiProcessing) regenerateOneWithAI(b.id); }
});

      <div class="fm-field" style="flex:2;"><label>hwpx 파일</label><input type="file" accept=".hwpx" onchange="handleUnitBankHwpxFile(this.files)"></div>
    </div>
  </div>
  <div class="st-sec">
    <div class="st-h"><b>엑셀로 한꺼번에</b><span>단원 / 문제 / 정답 세 열</span></div>
    <p class="fm-hint" style="margin-top:-8px;">.xlsx 파일에 <b>단원 / 문제 / 정답</b> 열을 만들어서 올려주세요.</p>
    <input type="file" accept=".xlsx,.xls" onchange="handleUnitBankExcelFile(this.files)">
  </div>
  ${state.unitImportPreview ? `
  <div class="st-sec">
    <div class="st-h"><b>올린 것 확인</b><span>총 ${state.unitImportPreview.length}개</span>
      <span class="r"><button class="btn p sm" onclick="confirmUnitBankImport()">일괄 등록</button>
      <button class="btn q sm" onclick="cancelUnitBankImport()">취소</button></span></div>
    <p class="fm-hint" style="margin-top:-8px;">${state.unitImportPreview.length>30?'처음 30개만 미리 보이고, 나머지는 그대로 등록됩니다. ':''}정답이 비어있는 항목(<span style="color:var(--no);font-weight:700;">빨간 표시</span>)은 등록 전에 채워주시면 좋아요.</p>
    <div style="max-height:420px;overflow-y:auto;margin-top:8px;">
      ${state.unitImportPreview.slice(0,30).map((r,i)=>`
        <div class="st-form" style="padding-top:12px;">
          <div class="fm-row" style="margin-bottom:6px;">
            <div class="fm-field"><label>단원</label><select id="uip-unit-${i}">${UNITS.map(u=>`<option value="${u}" ${r.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
            <div class="fm-field"><label>정답 ${!r.answer?'<span style="color:var(--no);">(비어있음)</span>':''}</label><input id="uip-answer-${i}" value="${escHtml(r.answer||'')}" style="${!r.answer?'border-color:var(--no);':''}"></div>
          </div>
          <textarea id="uip-content-${i}" style="width:100%;min-height:60px;">${escHtml(r.content)}</textarea>
          ${r.image ? `<img src="${r.image}" style="max-width:160px;max-height:160px;margin-top:8px;border:1px solid var(--line);border-radius:4px;display:block;">` : ''}
        </div>`).join('')}
    </div>
    ${state.importProgress ? `
      <div style="margin-top:12px;font-size:13px;">업로드 중... ${state.importProgress.done} / ${state.importProgress.total}</div>
      <div class="bar" style="height:10px;margin:8px 0;"><i style="width:${Math.round(state.importProgress.done/state.importProgress.total*100)}%;"></i></div>
    ` : ''}
  </div>` : ''}
  `;
}

/* ---------- 조교 관리 ---------- */

/* =================== 설정 > 시험 범위 ===================
   데일리퀴즈가 «지금 준비하는 시험 범위»만 내도록 하는 곳이다. 두 층으로 되어 있다.

   ① **시즌** — 전역이다. 날짜로 넘기지 않고 「시즌 종료」를 누르면 다음으로 간다.
      학교마다 시험 날짜가 다르지만 먼저 끝난 학교는 휴강·휴식기로 가므로 문제가 없다.
   ② **학교·학년별 범위** — 프리셋(과목의 단원 목록을 시즌으로 자른 것)을 «갈아끼운다».
      더하는 것이 아니라 갈아끼우는 이유는 확장도 축소도 되어야 하기 때문이다 —
      둘을 합치면 어느 쪽이 진짜인지 알 수 없게 된다.

   학교 목록은 학생 명부에서 나온다. 학교를 따로 등록하는 곳을 만들지 않았다 —
   이름을 두 곳에서 관리하면 오타 하나로 «다른 학교»가 된다. */
function teacherExamRangeHTML(){
  loadExamHistoryIfNeeded();
  const season = currentSeason();
  const next = SEASONS[(SEASONS.indexOf(season) + 1) % SEASONS.length];
  const hist = (state.examHistory && state.examHistory.items) || [];

  /* ---- 지금이냐 지난 기록이냐. 이 갈림을 «접근자 셋»에 가둔다 —
         아래 표와 달력은 어느 쪽을 보고 있는지 몰라도 되게 한다. ---- */
  const vi = state.examSeasonView;
  const past = (vi !== '' && vi != null && hist[vi]) ? hist[vi] : null;
  const viewSeason = past ? past.season : season;
  const getDates = (sc, gr) => past
    ? ((past.dates && past.dates[sc] && past.dates[sc][gr]) || null)
    : examDatesOf(sc, gr);
  const getBook = (sc, gr) => past
    ? ((past.books && past.books[sc] && past.books[sc][gr]) || '')
    : schoolBookOf(sc, gr);
  const getChaps = (sc, gr, sj) => {
    if(!past) return rangeChapters(sc, gr, sj);
    const got = past.bySchool && past.bySchool[sc] && past.bySchool[sc][gr] && past.bySchool[sc][gr][sj];
    return (Array.isArray(got) && got.length) ? got.slice() : presetChapters(sj, past.season);
  };
  const getDday = (sc, gr) => {
    if(!past) return examDdayOf(sc, gr);
    return null;               // 지난 기록에 D-day는 뜻이 없다
  };
  /* 🔴 **등급컷은 지난 기록에서도 «지금 값»이다** (2026-09-02 · G-1).
     범위·날짜·교재는 보관본 «안»에 뜬 스냅숏이라 못 고친다. 등급컷은 kv 문서에
     «시즌 한 판»을 열쇠로 따로 살아 있어서 지난 시즌 것도 적을 수 있다 —
     시험이 끝난 뒤에 나오는 값이라 그래야 한다. */
  const cutKey = past ? seasonKeyOf(past.season, past.startedAt) : curSeasonKey();
  const cutSeasonLabel = past ? examHistLabel(past) : season;
  const cutN = gradeCutCount(cutKey);

  /* ---- 줄 목록 ---- */
  let list = [];
  if(past){
    /* 보관본에서 뽑는다 — 그때의 명단은 남아 있지 않다. 적혀 있던 것만 보여 준다. */
    const seen = {};
    const add = (school, grade, subject) => {
      const k = rangeKey(school, grade, subject);
      if(seen[k]) return; seen[k] = 1;
      list.push({school, grade, subject, n: null});
    };
    Object.entries(past.bySchool || {}).forEach(([sc, byG]) =>
      Object.entries(byG || {}).forEach(([gr, byS]) =>
        Object.keys(byS || {}).forEach(sj => add(sc, gr, sj))));
    /* 범위는 기본값이라 안 적혔지만 «날짜»만 적어 둔 학교·학년도 한 줄로 세운다. */
    Object.entries(past.dates || {}).forEach(([sc, byG]) =>
      Object.keys(byG || {}).forEach(gr => {
        if(!list.some(x => x.school === sc && x.grade === gr)) add(sc, gr, '');
      }));
  } else {
    /* 학교 × 학년 × 과목 — 실제로 범위가 필요한 조합만 세운다.
       학년이 들어가야 하는 이유는 rangeChapters() 주석에 있다. */
    const combos = {};
    DATA.students.forEach(s => {
      const subject = subjectOfStudent(s.studentId);
      if(!subject) return;
      const school = s.school || '', grade = s.grade || '';
      const key = rangeKey(school, grade, subject);
      if(!combos[key]) combos[key] = {school, grade, subject, n: 0};
      combos[key].n++;
    });
    list = Object.values(combos);
  }
  /* **가까운 시험이 위로 온다.** 이 화면의 물음이 「어디가 먼저인가」이기 때문이다 —
     노션 표는 학교순이었지만 그건 표를 «적는» 순서지 «보는» 순서가 아니다.
     기준은 수학 시험일 → 없으면 시험기간 시작일. 날짜가 없는 줄은 맨 아래로 내린다. */
  list.sort((a, b) => {
    const da = getDates(a.school, a.grade), db = getDates(b.school, b.grade);
    const sa = (da && (da.math || da.start)) || '', sb = (db && (db.math || db.start)) || '';
    if(sa && sb && sa !== sb) return sa.localeCompare(sb);
    if(!!sa !== !!sb) return sa ? -1 : 1;
    return (a.school || '힣').localeCompare(b.school || '힣')
      || (a.grade || '힣').localeCompare(b.grade || '힣')
      || (a.subject || '').localeCompare(b.subject || '');
  });

  const noSchool = DATA.students.filter(s => !s.school).length;
  const noGrade = DATA.students.filter(s => !s.grade).length;
  const noSubject = DATA.students.filter(s => !subjectOfStudent(s.studentId)).length;
  const dated = list.filter(x => getDates(x.school, x.grade)).length;
  const soon = past ? 0 : list.filter(x => {
    const d = getDday(x.school, x.grade);
    return d && (d.state === 'during' || (d.state === 'before' && d.days <= 14));
  }).length;
  const openKey = state.rangeSchool;
  const mode = state.examViewMode || 'table';

  /* ---- 시즌 고르개 + 보기 전환 ---- */
  const seasonPicker = `
  <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;">
    <span class="field" style="min-width:0;">
      <select onchange="goExamSeason(this.value)" style="min-width:190px;">
        <option value="" ${!past ? 'selected' : ''}>지금 — ${escHtml(season)}</option>
        ${hist.map((h, i) => `<option value="${i}" ${vi === i || vi === String(i) ? 'selected' : ''}
          >${escHtml(examHistLabel(h))}</option>`).join('')}
      </select>
    </span>
    ${hist.length === 0 && !past
      ? `<span style="font-size:11.5px;color:var(--dim);">시즌을 넘기면 지금 일정이 «지난 기록»으로 보관됩니다.</span>`
      : ''}
    <span class="spacer"></span>
    <div class="row" style="gap:0;">
      <button class="btn sm ${mode === 'table' ? 'p' : 'q'}" style="border-radius:var(--r-sm) 0 0 var(--r-sm);"
        onclick="state.examViewMode='table'; render()">표</button>
      <button class="btn sm ${mode === 'cal' ? 'p' : 'q'}" style="border-radius:0 var(--r-sm) var(--r-sm) 0;"
        onclick="state.examViewMode='cal'; render()">달력</button>
    </div>
  </div>`;

  /* ---- 지금 시즌 상자 (지난 기록을 볼 때는 그 자리에 «읽기 전용» 알림이 온다) ---- */
  const seasonBox = past ? `
  <div class="fm-warn" style="margin-bottom:18px;">
    <b>${escHtml(examHistLabel(past))}</b>의 지난 기록입니다 —
    ${past.startedAt ? `<span class="mono">${escHtml(past.startedAt)}</span>에 시작해 ` : ''}
    <span class="mono">${escHtml(past.endedAt)}</span>에 보관됐습니다.
    <b>고칠 수 없습니다.</b> 지금 시즌으로 돌아가려면 위에서 «지금»을 고르세요.
    <br><b>다만 내신 등급컷은 여기서도 적을 수 있습니다</b> — 등급컷은 시험이 끝난 뒤에
    나오기 때문입니다. 줄을 누르면 펼쳐집니다.
  </div>` : `
  <div class="cls-hw" style="display:block;margin-bottom:18px;">
    <div class="t-sec" style="margin:0;">지금 시즌</div>
    <div class="row" style="gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap;">
      <b style="font-size:20px;">${escHtml(season)}</b>
      ${/* 한글은 mono 밖에 둔다 — 「부터」가 「부 터」로 벌어진다 */''}
      ${state.season && state.season.startedAt
        ? `<span style="font-size:11.5px;color:var(--dim);"><span class="mono">${escHtml(state.season.startedAt)}</span>부터</span>` : ''}
      <span class="spacer"></span>
      <button class="btn p sm" onclick="endSeason()">${escHtml(season)} 종료 → ${escHtml(next)}</button>
    </div>
    <div style="margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.8;">
      ${isVacationSeason(season)
        ? '방학에는 <b>과목의 모든 단원</b>이 나갑니다 — 그동안 범위 밖으로 접어 둔 문제가 다시 돌아옵니다.'
        : '시즌에 해당하는 단원만 데일리퀴즈로 나갑니다. 범위 밖 문제는 복습 시계가 멈춘 채 기다립니다.'}<br>
      순서 — ${SEASONS.map(s => s === season ? `<b>${escHtml(s)}</b>` : escHtml(s)).join(' → ')} → …<br>
      <b>시즌을 넘기면 지금 일정은 «지난 기록»으로 보관되고, 학교·학년별 수정은 기본 범위로 돌아갑니다.</b>
    </div>
  </div>`;

  const head = `
  <div class="row" style="align-items:baseline;gap:12px;margin-bottom:4px;flex-wrap:wrap;">
    <div class="t-sec" style="margin:0;">${past ? '지난 시험 일정' : '학교·학년별 시험 일정'}</div>
    <span style="font-size:11.5px;color:var(--dim);">
      ${soon ? `<b style="color:var(--no);">2주 안 ${soon}곳</b> · ` : ''}날짜 있음
      <b class="mono" style="color:var(--ink);">${dated}</b>/<span class="mono">${list.length}</span>
      · 등급컷 <b class="mono" style="color:${cutN ? 'var(--ink)' : 'var(--dim)'};">${cutN}</b>곳
    </span>
  </div>`;

  const help = past ? '' : `
  <div style="margin:0 0 12px;font-size:11.5px;color:var(--dim);line-height:1.8;">
    <b>가까운 시험이 위로 옵니다</b> — 기준은 <b>수학 시험일</b>이고, 없으면 시험기간 시작일입니다.
    한 줄이 «학교 × 학년 × 과목»이고, 줄을 누르면 그 자리에서 고칠 수 있습니다.<br>
    <b>날짜와 교재는 학교·학년 단위</b>라 같은 학교·학년의 다른 과목 줄에도 같이 반영됩니다.
    <b>범위는 과목마다 다릅니다.</b>
  </div>
  ${noSchool || noGrade || noSubject ? `<div class="fm-warn" style="margin-bottom:12px;">
    ${noSchool ? `학교를 입력하지 않은 학생이 <b>${noSchool}명</b> 있습니다. ` : ''}
    ${noGrade ? `학년을 입력하지 않은 학생이 <b>${noGrade}명</b> 있습니다. ` : ''}
    ${noSubject ? `반의 진도 과목이 정해지지 않아 범위를 못 정하는 학생이 <b>${noSubject}명</b> 있습니다
      (반 관리 &gt; 진도에서 과목을 고르면 됩니다). ` : ''}
    학교·학년이 비어 있어도 «빈 값»끼리 한 줄로 묶여 범위는 적용됩니다 —
    다만 <b>다른 학교 학생과 범위를 같이 쓰게</b> 되니 명단에서 채워 주세요.</div>` : ''}`;

  if(list.length === 0)
    return seasonPicker + seasonBox + head
      + `<div style="font-size:12.5px;color:var(--dim);">${past ? '이 시즌에는 적어 둔 일정이 없습니다.' : '범위를 정할 조합이 없습니다.'}</div>`;

  if(mode === 'cal')
    return seasonPicker + seasonBox + head
      + examCalendarHTML(list, getDates, viewSeason);

  const body = list.map(({school, grade, subject, n}) => {
    const all = UNIT_CHAPTERS[subject] || [];
    const cur = new Set(getChaps(school, grade, subject));
    const overridden = past
      ? !!(past.bySchool && past.bySchool[school] && past.bySchool[school][grade] && past.bySchool[school][grade][subject])
      : hasRangeOverride(school, grade, subject);
    /* ⚠ 지난 기록에서도 펼친다 — 거기서도 등급컷은 적기 때문이다 (2026-09-02 · G-1) */
    const open = openKey === rangeKey(school, grade, subject);
    const sc = jsAttr(school), gr = jsAttr(grade), sj = jsAttr(subject);
    const dd = getDday(school, grade), dates = getDates(school, grade);
    const book = getBook(school, grade);
    const cut = gradeCutOf(cutKey, school, grade, subject);
    const cutWarn = gradeCutWarn(cut);
    const ck = jsAttr(cutKey);
    /* 켜진 단원의 «처음과 끝». 노션 표가 그렇게 적혀 있었고, 그게 사람이 읽기 좋다. */
    const on = all.filter(ch => cur.has(ch));
    const span = !subject ? '' : on.length === 0 ? '' : on.length === 1 ? `${all.indexOf(on[0]) + 1}. ${on[0]}`
      : `${all.indexOf(on[0]) + 1}. ${on[0]} ~ ${all.indexOf(on[on.length - 1]) + 1}. ${on[on.length - 1]}`;
    const ddTone = !dd ? '' : dd.state === 'during' ? 'no' : dd.state === 'after' ? 'gone'
      : dd.days <= 7 ? 'no' : dd.days <= 14 ? 'late' : '';
    const dow = ymd => WEEKDAY_LABEL[new Date(ymd + 'T00:00:00').getDay()];
    return `
      ${/* ⚠ .cb는 «체크박스 네모»의 클래스다(width·height가 박혀 있다). 행에 걸면 줄이 찌그러진다. */''}
      <tr style="cursor:pointer;${open ? 'background:var(--hover);' : ''}"
          onclick="toggleRangeOpen('${sc}','${gr}','${sj}')">
        <td><b>${escHtml(school || '(학교 미입력)')}</b></td>
        <td class="sub">${escHtml(grade || '—')}</td>
        <td class="sub">${escHtml(subject || '—')}</td>
        <td class="r mono">${n == null ? '<span style="color:var(--dim);">—</span>' : n}</td>
        ${/* D-day는 «수학 시험일»이 기준이다. 없을 때만 시험기간 시작일로 물러난다. */''}
        <td>${dd ? `<span class="badge ${ddTone}" title="${dd.basis === 'math' ? '수학 시험일 기준' : '시험기간 시작일 기준'}">${
            dd.state === 'before' ? 'D-' + dd.days : dd.state === 'during' ? '시험 중' : '끝남'}</span>`
          : `<span style="color:var(--dim);">—</span>`}</td>
        ${/* 연도를 뗀다 — 두 날짜를 온전히 쓰면 이 폭에서 잘린다. 온전한 날짜는 title과 펼친 칸에 있다. */''}
        <td class="mono sub" title="${dates && dates.start ? escHtml(dates.start + (dates.end ? ' ~ ' + dates.end : '')) : ''}">${
          dates && dates.start ? escHtml(dates.start.slice(5)) + (dates.end ? ' ~ ' + escHtml(dates.end.slice(5)) : '') : '—'}</td>
        <td class="mono" title="${dates && dates.math ? escHtml(dates.math) : ''}" style="${
          dates && dates.math ? 'color:var(--brand-d);font-weight:700;' : 'color:var(--dim);'}">${
          dates && dates.math ? escHtml(dates.math.slice(5)) + ' ' + dow(dates.math) : '—'}</td>
        <td class="sub" title="${span ? escHtml(span) : ''}">${
          span ? escHtml(span) : '<span style="color:var(--dim);">—</span>'}
          ${overridden ? '<span class="badge score" style="margin-left:6px;">수정됨</span>' : ''}</td>
        <td class="sub" title="${escHtml(book)}">${book ? escHtml(book) : '—'}</td>
        ${/* 등급컷 — 「88 · 79 · 71 · 64」. 적힌 것이 없으면 «—» (2026-09-02 · G-1) */''}
        <td class="mono sub" title="${cut ? escHtml('1~4등급컷 ' + gradeCutLabel(cut)) : ''}"
            style="${cutWarn ? 'color:var(--late);' : ''}">${
          cut ? escHtml(gradeCutLabel(cut)) : '<span style="color:var(--dim);">—</span>'}</td>
        <td class="r sub" style="font-size:11px;">${open ? '접기' : '펼치기'}</td>
      </tr>
      ${!open ? '' : `
      <tr><td colspan="11" style="white-space:normal;overflow:visible;background:var(--hover);padding:16px 14px;">

        ${/* ---- 내신 등급컷 (2026-09-02 · G-1) — 사용자가 「기록만 한다」로 정했다.

        <div class="t-sec" style="margin:${past ? '0' : '16px'} 0 8px;font-size:12px;">

        </div>

          <b>${escHtml(cutSeasonLabel)}</b> 등급컷입니다 — 시험 범위와 같이 <b>과목마다 따로</b>입니다.
          비우면 지워지고, 0~100 밖의 값은 저장되지 않습니다.

                 : '<br>시즌을 넘겨도 <b>지워지지 않습니다</b> — «지난 기록»에서 그대로 보이고, 거기서 더 적을 수도 있습니다.'}

  return seasonPicker + seasonBox + head + help + `
  <div class="rst-wrap" style="max-height:none;">
    ${/* ⚠ .app .rst-wrap table.grid의 min-width는 명단(1464px)의 것이다. 이 표는 더 좁으므로

         sticky 헤더는 걸지 않는다. 줄이 적고, 가로 스크롤과 같이 쓰면 헤더가 첫 행을 덮는다 (0-B). */''}

function goExamSeason(v){
  state.examSeasonView = (v === '') ? '' : Number(v);
  state.rangeSchool = '';        // 보던 줄은 다른 시즌의 것이다
  state.examCalMonth = '';       // 달력도 그 시즌의 첫 달로 되돌린다
  render();
}

/* ---------- 시험 달력 ----------
   표는 «어디가 먼저인가»에 답하고, 달력은 «이번 달이 어떻게 생겼나»에 답한다.
   시험기간이 서로 겹치는 학교가 몇인지는 표로는 안 보인다.

   ⚠ 한 학교·학년이 과목 줄을 여럿 갖지만 **날짜는 하나**다. 그대로 그리면 같은 딱지가
      과목 수만큼 겹쳐 나온다 — 학교·학년으로 먼저 묶는다. */
function examCalendarHTML(list, getDates, viewSeason){
  const seen = {}, spans = [];
  list.forEach(({school, grade}) => {
    const k = school + '\n' + grade;
    if(seen[k]) return; seen[k] = 1;
    const d = getDates(school, grade);
    if(!d) return;
    const start = d.start || d.math, end = d.end || d.start || d.math, math = d.math || '';
    /* 줄을 차지하는 범위는 «수학 시험일까지» 포함한다 — 기간 밖에 적힌 경우가 있다 */
    const at = [start, end, math].filter(Boolean).sort();
    spans.push({school, grade, start, end, math, from: at[0], to: at[at.length - 1]});
  });

  if(spans.length === 0) return `<div style="font-size:12.5px;color:var(--dim);">
    날짜를 적어 둔 학교가 없습니다. «표»에서 줄을 눌러 시험 날짜를 넣어주세요.</div>`;

  /* 보고 있는 달 — 정해 두지 않았으면 «가장 이른 시험이 있는 달»에서 시작한다.
     오늘 달에서 시작하면 시험이 다음 달일 때 빈 달을 마주한다. */
  const first = spans.map(s => s.start).filter(Boolean).sort()[0] || todayStr();
  const ym = state.examCalMonth || first.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);

  const firstDow = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const today = todayStr();

  /* ⚠ 학교마다 «줄»을 고정한다.
     예전에는 그날 걸린 것을 순서대로 쌓아서 같은 학교가 날마다 다른 높이에 떴고,
     수학 시험일에는 그 학교만 맨 위로 튀어 **띠가 두 동강** 났다.
     이제 한 학교·학년은 그 달 내내 같은 줄에 있고 수학 시험일도 그 줄 위에 선다.
     기간이 안 겹치는 학교끼리는 같은 줄을 나눠 써서 칸이 무한정 높아지지 않는다. */
  const laneEnd = [];   // 줄마다 «지금까지 찬 마지막 날»
  spans.sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1
    : (a.school + a.grade).localeCompare(b.school + b.grade))
    .forEach(s => {
      let i = 0;
      while(i < laneEnd.length && laneEnd[i] >= s.from) i++;
      s.lane = i; laneEnd[i] = s.to;
    });
  /* ⚠ 줄을 고정하면 «그날 걸린 것 중 셋»을 고르던 예전과 달리, 높은 줄로 밀린 학교는
     한 달 내내 한 번도 안 보이게 된다. 그래서 셋에서 여섯으로 늘렸다 —
     겹치는 것끼리만 줄을 더 쓰므로 한산한 주는 그대로 낮다. */
  const LANES = 6;

  let cells = WEEKDAY_LABEL.map(d => `<div class="dh">${d}</div>`).join('');
  for(let i = 0; i < firstDow; i++) cells += '<div class="d off"></div>';
  for(let d = 1; d <= days; d++){
    const ymd = `${ym}-${String(d).padStart(2, '0')}`;
    const dow = new Date(y, m - 1, d).getDay();
    const onLane = []; let more = 0;
    spans.forEach(s => {
      const inPeriod = s.start && ymd >= s.start && ymd <= (s.end || s.start);
      if(!inPeriod && s.math !== ymd) return;
      if(s.lane >= LANES){ more++; return; }
      onLane[s.lane] = s;
    });
    /* 뒤쪽 빈 줄은 안 그린다 — 앞쪽만 맞으면 가로줄은 이미 맞는다.
       (sparse 배열이라 forEach가 빈 자리를 건너뛴다) */
    let last = -1; onLane.forEach((s, i) => { last = i; });
    let rows = '';
    for(let i = 0; i <= last; i++){
      const s = onLane[i];
      /* 비어 있는 줄도 자리를 남긴다. 이게 없으면 아랫줄이 위로 당겨져 행이 어긋난다 */
      if(!s){ rows += '<span class="exc-chip void">&nbsp;</span>'; continue; }
      const who = escHtml(s.school) + ' ' + escHtml(s.grade);
      const pStart = s.start, pEnd = s.end || s.start;
      const inPeriod = pStart && ymd >= pStart && ymd <= pEnd;
      /* 모서리 — 첫날 왼쪽·마지막날 오른쪽만 막는다. 주 경계는 양쪽 다 열어 둬야 이어져 보인다.
         기간 밖에 떨어져 있는 수학 시험일은 그 하루가 통째로 한 덩어리다. */
      const cap = (!inPeriod || ymd === pStart ? ' capL' : '')
                + (!inPeriod || ymd === pEnd ? ' capR' : '');
      /* ⚠ 이름을 «기간 첫날 한 번»만 쓰면 주가 넘어간 칸에는 이름이 없고,
         지난달에 시작한 시험은 이 달에 이름이 아예 안 나온다 —
         실제로 이름 없는 띠가 떠 있었다. **주가 바뀔 때와 달 첫날에 다시 쓴다.**
         그래도 닷새 내내 반복되지는 않는다. */
      const named = !inPeriod || ymd === pStart || dow === 0 || d === 1;
      if(s.math === ymd){
        /* 수학 시험일 — 기간 딱지 대신 이것을 그린다. 같은 학교가 두 번 나오면 안 된다 */
        rows += `<span class="exc-chip math${cap}" title="${who} 수학 시험">${who}</span>`;
      }else{
        rows += `<span class="exc-chip${cap}" title="${who} 시험기간">${named ? who : '&nbsp;'}</span>`;
      }
    }
    cells += `<div class="d${ymd === today ? ' today' : ''}${dow === 0 ? ' sun' : dow === 6 ? ' sat' : ''}">
      <span class="n">${d}</span>${rows}${
      more ? `<span class="exc-more">외 ${more}곳</span>` : ''}</div>`;
  }
  /* 마지막 주의 남는 칸도 채운다 — 안 채우면 그 자리에 격자 배경(회색)이 통째로 드러난다. */
  const tail = (7 - ((firstDow + days) % 7)) % 7;
  for(let i = 0; i < tail; i++) cells += '<div class="d off"></div>';

  return `
  <div class="row" style="gap:10px;align-items:center;margin:2px 0 12px;">
    <button class="btn q sm" onclick="shiftExamCal('${ym}',-1)">${iconSvg('chevL', 14)}</button>
    <b style="font-size:15px;">${y}년 ${m}월</b>
    <button class="btn q sm" onclick="shiftExamCal('${ym}',1)">${iconSvg('chevR', 14)}</button>
    <span class="spacer"></span>
    ${/* ⚠ 범례 딱지는 달력 칸이 아니라 «한 덩어리로 잇는» 규칙 밖이다 —
          inline style로 margin·padding·모서리를 되돌린다 */''}
    <span style="font-size:11.5px;color:var(--dim);">
      <span class="exc-chip math" style="display:inline-block;margin:0 4px 0 0;padding:2px 7px;border-radius:5px;">수학 시험일</span>
      <span class="exc-chip" style="display:inline-block;margin:0;padding:2px 7px;border-radius:5px;">시험기간</span>
    </span>
  </div>
  <div class="exc">${cells}</div>
  <div style="margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.8;">
    «${escHtml(viewSeason)}» 기준 <b class="mono" style="color:var(--ink);">${spans.length}</b>개 학교·학년의 일정입니다.
    <b style="color:var(--ink);">한 학교는 그 달 내내 같은 줄</b>에 서고 수학 시험일도 그 줄 위에 뜹니다.
    시험기간은 <b style="color:var(--ink);">한 덩어리 띠</b>로 이어지고, 이름은 <b style="color:var(--ink);">주가 바뀔 때마다</b> 다시 나옵니다.
    줄은 여섯까지 보이고 나머지는 «외 n곳»으로 접힙니다.
  </div>`;
}
function shiftExamCal(ym, delta){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  state.examCalMonth = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
  render();
}
/* 인라인 onclick 안의 «문자열 리터럴»로 안전하게 넣는다.
   학교 이름은 사람이 친 값이라 따옴표·백슬래시가 들어올 수 있다.
   ⚠ 제어문자(특히 NUL)는 HTML 파서가 U+FFFD로 바꿔 버려 키가 영영 안 맞는다 —
   실제로 학교+과목 키를 `\u0000`으로 이어 붙였다가 「펼치기」가 안 먹었다 (2026-08-10).
   순서가 중요하다: 먼저 JS 이스케이프, 그다음 HTML 속성 이스케이프. */
function jsAttr(s){
  const js = String(s==null?'':s).replace(/[\u0000-\u001F]/g,' ')
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return js.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function rangeKey(school, grade, subject){ return school + '\n' + grade + '\n' + subject; }
function toggleRangeOpen(school, grade, subject){
  const key = rangeKey(school, grade, subject);
  state.rangeSchool = (state.rangeSchool === key) ? '' : key;
  render();
}
/* 한 칸만 고쳐도 나머지는 그대로 둔다 — 셋이 한 값이라 통째로 다시 쓴다. */
async function setExamDate(school, grade, which, value){
  const d = examDatesOf(school, grade) || {};
  const next = {start: d.start||'', end: d.end||'', math: d.math||''};
  next[which] = value || '';
  /* 끝이 시작보다 앞서면 사람이 잘못 고른 것이다. 되돌린다 — 하루짜리 시험도 있으니 같은 날은 받는다. */
  if(next.start && next.end && next.end < next.start){
    showToast('시험 끝 날짜가 시작보다 앞섭니다. 다시 골라주세요.');
    render(); return;
  }
  /* 수학 시험일이 시험기간 밖이면 대개 잘못 고른 것이다. 다만 **막지는 않는다** —
     보충 시험처럼 기간 밖에 치르는 경우가 실제로 있다. 알려만 준다. */
  if(next.math && next.start && next.end && (next.math < next.start || next.math > next.end)){
    showToast('수학 시험일이 시험기간 밖입니다. 맞다면 그대로 두셔도 됩니다.');
  }
  await saveExamDates(school, grade, next.start, next.end, next.math);
  render();
}
async function setSchoolBook(school, grade, text){
  await saveSchoolBook(school, grade, String(text||'').trim());
  render();
}
/* 등급컷 한 칸 (2026-09-02 · G-1).
   ⚠ 시즌 «판 열쇠»를 화면에서 받아 온다 — 지난 기록을 보면서 적을 수도 있어서,
     여기서 `curSeasonKey()`를 부르면 **지난 시즌 것이 지금 시즌에 적힌다.**
   ⚠ change(칸을 떠날 때)에 저장한다. oninput이면 render()가 글자마다 돌아 커서가 튄다 (9절 4번). */
async function setGradeCut(seasonKey, school, grade, subject, g, value){
  const ok = await saveGradeCut(seasonKey, school, grade, subject, g, value);
  if(!ok) showToast('등급컷은 0~100 사이의 원점수로 적어 주세요.');
  render();
}
/* 노션 표가 «시작 단원 ~ 끝 단원» 두 칸이었다. 그 입력을 그대로 옮긴 것 —
   단원을 열 개씩 하나하나 누르는 것보다 훨씬 빠르고, 실제 시험범위가 대개 연속 구간이다.
   ⚠ 거꾸로 골라도 받는다. 사람이 순서를 바꿔 고르는 일이 잦아서 막기보다 뒤집는 편이 낫다. */
async function applyRangeSpan(school, grade, subject){
  const a = document.getElementById('rs-a'), b = document.getElementById('rs-b');
  if(!a || !b) return;
  const all = UNIT_CHAPTERS[subject] || [];
  let i = Number(a.value), j = Number(b.value);
  if(i > j) [i, j] = [j, i];
  await saveSchoolRange(school, grade, subject, all.slice(i, j+1));
  showToast(`${i+1}. ${all[i]} ~ ${j+1}. ${all[j]} — ${j-i+1}단원으로 정했습니다.`);
  render();
}
async function toggleRangeChapter(school, grade, subject, chapter){
  const cur = rangeChapters(school, grade, subject);
  const all = UNIT_CHAPTERS[subject] || [];
  const set = new Set(cur);
  if(set.has(chapter)) set.delete(chapter); else set.add(chapter);
  /* 단원 목록의 «순서»를 지킨다 — 누른 순서로 쌓이면 화면마다 순서가 달라진다. */
  await saveSchoolRange(school, grade, subject, all.filter(ch=>set.has(ch)));
  render();
}
async function resetSchoolRange(school, grade, subject){
  await saveSchoolRange(school, grade, subject, null);
  showToast('기본 범위로 되돌렸습니다.');
  render();
}

   제목 아래 실선 하나로 구역을 가르고, 그 안은 얇은 선으로 나눈 줄이 쌓인다.
   한 화면에 상자가 서넛 뜨면 «무엇이 무엇 안에 있는지»가 흐려진다.

   **만드는 폼은 접어 둔다.** 계정·반을 만드는 일은 가끔이고 목록을 보는 일은 매번이다.
   상시 펼쳐 둔 폼은 화면에서 제일 큰 자리를 차지하면서 제일 가끔 쓰인다.
   (시험지 「새 시험지」· 창고 「문항 추가」와 같은 장치다.)

   여섯 갈래가 서로 닮은 데가 없다 — 조교 계정, 학생 계정, 반 만들기, 상담 신청,
   변경 이력, 관리자 비밀번호. 하나의 형태로 묶지 않고 «같은 부품»으로만 짓는다. */

/* 지금 규칙으로 등급별 인원. 기록이 아직 없으면 셀 수 없으므로 null을 돌려준다. */
function signalDist(){
  if(!state.allRecordsLoaded) return null;
  const dist = { r:0, y:0, g:0 };
  DATA.students.forEach(s=>{
    if(signalMutedUntil(s.studentId)) return;
    const sg = signalOf(rosterStats(s));
    if(sg) dist[sg.grade]++;
  });
  return dist;
}

/* 폼을 채우기만 한다 — 여기서 render()나 showToast()를 부르면 화면이 다시 그려지면서
   방금 채운 값이 저장된 값으로 되돌아간다. 저장은 사용자가 누른다. */
function fillSignalRuleDefaults(){
  for(const k in SIGNAL_DEFAULTS){
    const el = document.getElementById('sr-' + k);
    if(el) el.value = SIGNAL_DEFAULTS[k];
  }
}

async function saveSignalRules(){
  const before = signalRules();
  const next = {};
  for(const k in SIGNAL_DEFAULTS){
    const el = document.getElementById('sr-' + k);
    const n = Number(el && el.value);
    if(!el || el.value.trim()==='' || !Number.isFinite(n)){
      showToast(`${SIGNAL_RULE_LABELS[k]} — 숫자를 넣어 주세요.`); return;
    }
    next[k] = clampRule(k, n);
  }
  /* 뒤집힌 값은 조용히 고치지 않고 되돌려 보낸다 — 말없이 바꾸면 «내가 넣은 값»과
     «화면이 쓰는 값»이 달라지고, 그때부터 이 화면을 못 믿게 된다. */
  if(!(next.vidHeavy <= next.vidWarn && next.vidWarn <= next.vidLight)){
    showToast('시청률은 무거움 ≤ 주의 ≤ 경미 순서여야 합니다.'); return;
  }
  if(!(next.rpRed <= next.rpYellow)){
    showToast('리포트 색 기준은 빨강 ≤ 노랑 순서여야 합니다.'); return;
  }
  const diff = Object.keys(SIGNAL_DEFAULTS).filter(k=>before[k] !== next[k])
    .map(k=>`${SIGNAL_RULE_LABELS[k]} ${before[k]}→${next[k]}`);
  if(diff.length === 0){ showToast('바뀐 값이 없습니다.'); return; }

  state.signalRules = next;
  await dbSet('signal-rules', next);
  await logAudit('신호 규칙 변경', '', '', diff.join(' · '));

  const dist = signalDist();
  showToast(dist ? `저장했습니다 — 위험 ${dist.r} · 주의 ${dist.y} · 관찰 ${dist.g}` : '저장했습니다.');
}

/* ---------- 학생 ----------
   여기는 **«계정을 다루는 곳»**이다 — 만들고, 고치고, 지운다.
   학생의 **«학업»을 보는 곳은 명단 하나뿐이다** — 성적·출결·과제·신호·연대기.

   ⚠ **한때 여기서 목록을 뺐다가 2026-08-26에 다시 세웠다. 같은 목록이 아니다.**
     그때 뺀 이유는 «같은 곳으로 가는 문이 두 개면 어느 쪽이 최신인지 헷갈린다»였고,
     그 말은 **둘 다 학생을 «보는» 목록이었을 때** 옳았다.
     지금은 문이 둘이 아니라 **일이 둘로 갈렸다** — 사용자가 그렇게 갈랐다:
     **«계정 관련 설정이나 정보 입력 등을 전부 설정탭으로 옮기고, 명단에서는
     학업에 관련한 관리만 하도록 분리»**.
     그래서 이 목록에는 **성적·출결·신호를 한 칸도 두지 않는다.** 두는 순간 옛 문제로 돌아간다. */
function teacherSettingsStudentsHTML(){
  const open = state.settingsForm==='stu';
  const bulk = state.settingsForm==='bulk';

  /* 검색은 «계정을 찾는» 검색이다 — 이름·아이디·학교·반까지만 본다.
     ⚠ 명단의 `rosterQuery`와 따로 둔다. 한쪽에서 거른 것이 다른 쪽에 따라가면
       「왜 학생이 없지」로 이어진다 — 두 화면은 이제 하는 일이 다르다. */
  /* 🔵 명단과 **같은 어법**을 쓴다 (2026-09-01 · C-14) — 띄어쓰면 AND, 한 낱말 안에서는 OR.
     ⚠ 거르는 «값»은 여전히 따로다(`stuQuery`). 어법만 같게 둔다 —
       한 화면에서 되던 검색이 다른 화면에서 안 되면 그것이 더 헷갈린다. */
  const terms = (state.stuQuery||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit = s => !terms.length || (()=>{
    const fields = [s.name, s.studentId, s.school, s.grade, classNameOf(s.classId)]
      .map(v => String(v||'').toLowerCase());
    return terms.every(t => fields.some(v => v.includes(t)));
  })();
  /* 반 → 이름 순. 계정을 손볼 때는 «같은 반끼리» 보게 되는 일이 많다. */
  /* **퇴원생은 맨 아래로 내려간다** (2026-08-26 · W-2) — 사용자가 그렇게 정했다.
     ⚠ 감추지는 않는다. 계정을 다루는 곳이라 «되돌리러» 오는 일이 있고, 그때 없으면 못 찾는다.
     퇴원끼리는 **늦게 그만둔 사람이 위**다 — 되돌릴 일이 있다면 대개 최근 사람이다. */
  const listed = DATA.students.filter(hit).slice().sort((a,b)=>
    (isWithdrawn(a) - isWithdrawn(b))
    || (isWithdrawn(a) ? String(b.withdrawnAt||'').localeCompare(String(a.withdrawnAt||'')) : 0)
    || String(classNameOf(a.classId)).localeCompare(String(classNameOf(b.classId)),'ko')
    || String(a.name||'').localeCompare(String(b.name||''),'ko'));
  const goneCount = listed.filter(isWithdrawn).length;

  /* 한 줄에 열을 맞춘다 (2026-08-26 · W-2). 사용자의 말 —
     「학교와 반이 이름 옆으로 쓰여지면서 보이게 하면 더 한눈에 여러 학생이 정리되지 않을까」.
     🔴 **한 줄로 만드는 것만으로는 절반이다 — 열이 맞아야 값을 한다.**
       이 목록의 일은 «여러 명을 훑어 한 명을 찾는 것»이고 그때 눈은 세로로 내려간다.
       그냥 이어 붙이면 「광남고」·「건대부고」·「학교 미입력」의 길이가 달라서
       **「반」이 줄마다 다른 자리에 서고, 세로로 훑을 수가 없다.**
     ⚠ `table`을 쓰지 않는다 — 줄을 펴면 그 아래에 편집 폼이 들어와야 하는데
       표의 칸 안에서는 폼이 열 폭에 갇힌다. 고정폭 `flex`가 같은 결과를 준다.
     ⚠ 폰에서는 `.st-row{flex-wrap:wrap}`(P-3)이 이미 접어 준다. 고정폭에
       `flex-shrink`를 남겨 둬야 좁은 폭에서 글자가 안 잘린다. */
  const line = s => {
    const on = state.stuEditId===s.studentId;
    const gone = isWithdrawn(s);
    return `<div class="st-row stu-row${gone?' gone':''}" style="align-items:flex-start;">
      <div class="t">
        <div class="stu-line">
          <b class="nm">${escHtml(s.name)}</b>
          <span class="mono id">${escHtml(s.studentId)}</span>
          <span class="sch">${escHtml(s.school||'학교 미입력')} ${escHtml(s.grade||'')}</span>
          <span class="cls" title="${escHtml(studentClassTitle(s))}">${studentClassIds(s).length
            ? escHtml(studentClassLabel(s, {short:true}))
            : '<span class="badge">미배정</span>'}</span>
          ${gone ? `<span class="badge gone">퇴원${
            s.withdrawnAt ? ' <span class="mono">'+escHtml(s.withdrawnAt)+'</span>' : ''}</span>` : ''}
        </div>
        ${/* 🔴 **줄 아래에 폼을 펴지 않는다** (2026-08-27 · D-1) — 오른쪽 드로어로 갔다.
             사용자의 말 — **「아래 펼쳐지는게 아니라 오른쪽에 공간 많으니까」**.
             줄 아래로 펴면 그 아래 학생들이 통째로 밀려서, 여러 명을 훑다가 하나를 고치면
             «보던 자리»를 잃는다. W-2에서 열을 맞춘 뜻이 그때 사라진다. */''}
      </div>
      <div class="v"><button class="btn ${on?'p':''} sm" onclick="stuEdit('${s.studentId}')">${
        on ? '닫기' : '계정 수정'}</button></div>
    </div>`;
  };

  const rows = listed.length===0
    ? `<div class="st-empty">${DATA.students.length===0 ? '등록된 학생이 없습니다.' : '조건에 맞는 학생이 없습니다.'}</div>`
    : listed.map((s,i)=>{
        /* 재원과 퇴원 사이에 «금»을 하나 긋는다 — 아래로 내리기만 하면
           어디부터가 퇴원인지 한 줄씩 확인해야 한다. */
        const first = goneCount && isWithdrawn(s) && (i===0 || !isWithdrawn(listed[i-1]));
        return (first ? `<div class="stu-sep"><span>퇴원 ${goneCount}명</span></div>` : '') + line(s);
      }).join('');

  return `<div class="st-wrap">
  ${stSec({
    title:'학생 계정', desc:`전체 ${DATA.students.length}명${
      terms.length ? ` · <b class="mono">${listed.length}</b>명 표시` : ''}`,
    action:`<button class="btn ${open?'':'p'} sm" onclick="stOpen('stu')">${
      open ? '닫기' : iconSvg('plus',13)+' 학생 추가'}</button>`,
    form: !open ? '' : `<div class="st-form">
      <div class="cls-form">
        <label style="min-width:120px;"><span>아이디</span><input id="new-sid" placeholder="예: st01"></label>
        <label style="min-width:110px;"><span>이름</span><input id="new-sname" placeholder="이름"></label>
        <label style="min-width:120px;"><span>비밀번호</span><input id="new-spw" placeholder="비밀번호"></label>
        <label style="width:92px;"><span>학년</span><select class="fm-sel" id="new-sgrade"><option>고1</option><option>고2</option><option>고3</option></select></label>
        <label style="min-width:130px;"><span>학교</span><input id="new-sschool" placeholder="학교명 (선택)"></label>
        <label style="min-width:150px;"><span>학부모 전화</span><input id="new-sparentphone" placeholder="010-0000-0000 (선택)"></label>
        <label style="min-width:150px;"><span>학생 전화</span><input id="new-sphone" placeholder="010-0000-0000 (선택)"></label>
        <label style="min-width:150px;"><span>반</span><select class="fm-sel" id="new-sclass">${classOptionsHTML(null)}</select></label>
        <button class="btn p sm" onclick="addStudent()">추가</button>
      </div>
      <p class="st-note">반을 안 고르셨거나 나중에 옮기고 싶으면 <b>아래 목록</b>에서 <b>계정 수정</b>을 눌러 언제든 바꿀 수 있습니다.</p></div>`,
    body: `<div class="st-fbar" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;">
      <span class="field">${iconSvg('search',15)}
        <input id="stu-search" value="${escHtml(state.stuQuery||'')}"
          placeholder="이름 · 아이디 · 학교 · 학년 · 반"
          oninput="stuSearch(event)" oncompositionend="stuSearch(event)"></span>
      ${/* 학업은 여기 없다 — 찾으러 온 사람을 명단으로 보내는 문 하나는 남긴다.
           ⚠ 그 명단은 이제 「반 › 학생」이다 (2026-09-01 · C-13). */''}
      <button class="btn sm" onclick="goTeacherTab('classhub','students')">성적·출결은 학생 명단에서 ${iconSvg('arrowR',13)}</button>
    </div>
    ${rows}`
  })}
  ${stSec({
    title:'엑셀로 한꺼번에', desc:'양식을 채워 올리면 이미 있는 아이디는 건너뜁니다',
    action:`<button class="btn ${bulk?'':'p'} sm" onclick="stOpen('bulk')">${bulk?'닫기':'일괄 등록'}</button>`,
    form: !bulk ? '' : `<div class="st-form">
      <div class="cls-form">
        <label style="min-width:170px;"><span>배정할 반</span><select class="fm-sel" id="import-sclass">${classOptionsHTML(null)}</select></label>
        <button class="btn sm" onclick="downloadStudentExcelTemplate()">${iconSvg('download',14)} 양식 내려받기</button>
        <label class="btn sm" style="cursor:pointer;">${iconSvg('file',14)} 엑셀 올리기<input type="file" accept=".xlsx,.xls"
          style="display:none;" onchange="handleStudentExcelFile(this.files)"></label>
      </div></div>`,
    body: studentImportPreviewHTML()
  })}
  </div>`;
}

/* ---------- 변경 이력 ----------
   시안(13-settings)이 그린 그대로 «줄»이다. 표가 아니다 —
   표는 «비교»하는 것이고 로그는 «훑는» 것이라 열 머리가 필요 없다. */
function teacherAuditLogHTML(){
  const q = (state.auditLogSearchQuery||'').trim().toLowerCase();
  const filtered = !q ? DATA.auditLog : DATA.auditLog.filter(e=>
    (e.studentName||'').toLowerCase().includes(q) ||
    (e.actor||'').toLowerCase().includes(q) ||
    (e.action||'').toLowerCase().includes(q)
  );
  const shown = filtered.slice(0, 300);
  /* 「26. 08. 04. 오전 12:16」은 두 줄로 접힌다 — toLocaleString의 한국어 오전/오후 때문이다.
     시안이 쓴 24시간 형식으로 맞춘다. 전부 숫자라 mono에서도 제대로 읽힌다. */
  const p2 = n => String(n).padStart(2,'0');
  const fmtAt = iso => { try{
    const d = new Date(iso);
    if(isNaN(d)) return iso||'';
    return `${String(d.getFullYear()).slice(2)}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  }catch(e){ return iso||''; } };
  /* 항목마다 색을 달리한다 — 성적·출석은 «고친 것», 삭제는 «없앤 것»이라 무게가 다르다. */
  const tone = a => /삭제/.test(a) ? 'no' : /성적|출석|출결/.test(a) ? 'late'
              : /추가|등록|생성/.test(a) ? 'ok' : '';

  return `<div class="st-wrap">
  ${stSec({
    title:'변경 이력', desc:`${DATA.auditLog.length}건${q?` · 검색결과 ${filtered.length}건`:''}`,
    action:`<span class="field" style="width:230px;">${iconSvg('search',14)}
      <input id="auditlog-search" value="${escHtml(state.auditLogSearchQuery||'')}"
        placeholder="학생 · 작성자 · 항목으로 찾기"
        style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:inherit;font-size:12.5px;color:var(--ink);"
        oninput="liveEdit(event, v=>state.auditLogSearchQuery=v)" oncompositionend="liveEdit(event, v=>state.auditLogSearchQuery=v)"></span>`,
    body: (DATA.auditLog.length===0
      ? '<div class="st-empty">아직 기록된 변경 이력이 없습니다.<br>성적·출석·학생정보처럼 되돌리기 어려운 변경만 남습니다.</div>'
      : shown.length===0
      ? `<div class="st-empty">「${escHtml(state.auditLogSearchQuery)}」에 해당하는 기록이 없습니다.</div>`
      : shown.map(e=>`<div class="st-log">
          <span class="tm">${fmtAt(e.at)}</span>
          <span class="ac"><span class="badge ${tone(e.action)}">${escHtml(e.action)}</span></span>
          <span class="x">${e.studentName?`<b style="color:var(--ink);font-weight:600;">${escHtml(e.studentName)}</b> `:''}${escHtml(e.detail||'')}</span>
          <span class="by">${escHtml(e.actor||'')}</span>
        </div>`).join('')
      + (filtered.length>300 ? `<p class="st-note">최근 300건만 보입니다 (전체 ${filtered.length}건).</p>` : ''))
  })}
  </div>`;
}

      ${!open ? '' : `<div class="st-form">
        <div class="cls-form">
          <label style="min-width:170px;"><span>현재 비밀번호</span><input id="pw-current" type="password" autocomplete="current-password"></label>
          <label style="min-width:170px;"><span>새 비밀번호 (4자 이상)</span><input id="pw-new" type="password" autocomplete="new-password"></label>
          <button class="btn p sm" onclick="changeTeacherPw()">변경</button>
        </div></div>`}
      <div class="st-row">
        <div class="t"><b>아이디가 없습니다</b>
          <span>지금은 비밀번호 하나로 들어옵니다 — 누가 시도했는지 남지 않습니다</span></div>
        <div class="v"><span class="badge late">알려진 한계</span></div>
      </div>`
  })}
  </div>`;
}


// 알림 드롭다운이 열려있을 때 벨 바깥을 클릭하면 닫는다.
document.addEventListener('click', (e) => {
  if(state.notifOpen && !e.target.closest('.ds-bell')){
    state.notifOpen = false;
    render();
  }
});

// 브라우저 뒤로가기/앞으로가기 시 주소창 해시에 맞춰 화면을 복원한다.
window.addEventListener('popstate', (e) => {
  const desired = e.state ? e.state.view : (location.hash.replace(/^#\/?/,'').split('/')[0] || 'home');
  state.view = viewAllowedForCurrentUser(desired);
  if(e.state && state.view==='teacher' && e.state.teacherTab) state.teacherTab = e.state.teacherTab;
  if(e.state && state.view==='student' && e.state.studentTab) state.studentTab = e.state.studentTab;
  if(e.state && state.view==='assistant' && e.state.assistantTab) state.assistantTab = e.state.assistantTab;
  const correctedHash = buildHashFromState();
  // 로그인 상태와 안 맞아 다른 화면으로 안전하게 리다이렉트된 경우, 주소창 해시도 그 화면에 맞게 바로잡는다.
  if(correctedHash !== location.hash) history.replaceState({view:state.view, teacherTab:state.teacherTab, studentTab:state.studentTab, assistantTab:state.assistantTab}, '', correctedHash);
  lastSyncedHash = correctedHash; // 복원 자체가 새 push를 유발하지 않도록 먼저 맞춰둠 
  render();
});

/* =================== 시작 =================== */
// 익명 인증 시도 (완전 공개 접근 차단용 최소 보안 장치). 인증 설정이 안 됐거나
// 실패해도 loadAll()의 자체 에러 처리로 사이트는 계속 동작한다.
fbAuth.signInAnonymously().catch(e=>console.error('익명 로그인 실패 (Firebase Authentication에서 익명 로그인을 사용 설정했는지 확인하세요)', e));
loadAll();
</script>
