<script>
/* =================== 저장소 유틸 (Firebase Firestore) =================== */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
/* ⚠ **«없는 문서»와 «못 읽은 문서»는 다르다.**
   dbGet은 둘 다 fallback을 돌려주므로 부르는 쪽은 구분할 수 없다. 그런데 그 fallback을
   그대로 저장하면 **진짜 문서를 덮는다** — 읽기 한 번 실패가 곧 데이터 삭제가 된다.
   특히 `loadRecord`의 fallback이 `emptyRecord()`라, 학생이 앱을 열기만 해도
   («그리기만 해도» 저장하는 dqEnsureToday 때문에) 자기 기록이 지워질 수 있었다.

   → 못 읽은 열쇠를 적어 두고 **그 열쇠로는 저장을 막는다.** 다시 읽어 성공하면 풀린다.
   404는 «정상»이다 (아직 없는 문서에 처음 쓰는 길이 막히면 안 된다). */
const dbReadFailed = new Set();
const dbBlockWarned = new Set();
function warnDbBlocked(key){
  if(dbBlockWarned.has(key)) return;
  dbBlockWarned.add(key);
  try{ showToast('저장하지 못했습니다 — 이 기록을 불러오지 못한 상태입니다. 새로고침해 주세요.'); }catch(e){}
}
async function dbGet(key, fallback){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
    if(res.status === 404){ dbReadFailed.delete(key); return fallback; }   // 없는 문서 — 정상이다
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    const value = JSON.parse(doc.fields.value.stringValue);
    dbReadFailed.delete(key);
    return value;
  }catch(e){
    console.error('불러오기 실패', key, e);
    dbReadFailed.add(key);          // ← 이 열쇠로는 저장을 막는다
    return fallback;
  }
}
async function dbSet(key, value){
  /* 못 읽은 문서에는 쓰지 않는다 — 지금 메모리에 있는 것은 «진짜»가 아니라 fallback이다. */
  if(dbReadFailed.has(key)){
    console.error('저장을 막았다 — 이 문서를 읽지 못한 적이 있다', key);
    warnDbBlocked(key);
    return null;
  }
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(value) } } })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    return true;
  }
  catch(e){ console.error('저장 실패', key, e); return null; }
}
async function dbDelete(key){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', key, e); }
}

/* =================== 저장소 유틸 2 — 컬렉션(문서 하나당 레코드 하나) =================== */
// 예전엔 kv/students 문서 하나에 학생 전체 배열을 통째로 저장해서, 학생 한 명만 바꿔도
// 전체를 다시 쓰고(동시 편집 시 서로 덮어씀) 문서 1MB 한도에도 걸릴 수 있었다.
// 아래 3개 함수는 컬렉션 하나에 레코드마다 문서를 따로 둬서 그 문제를 없앤다.
// (Firestore 문서 형식을 그대로 쓰지 않고 예전처럼 value 필드 하나에 JSON 문자열로 넣는 이유는
//  기존 dbGet/dbSet과 직렬화 방식을 통일해서 변환 과정에서 실수할 여지를 줄이기 위함.)
async function dbSetDoc(collection, id, data){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_ROOT + '/' + collection + '/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(data) } } })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    return true;
  }catch(e){ console.error('저장 실패', collection, id, e); return null; }
}
async function dbDeleteDoc(collection, id){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_ROOT + '/' + collection + '/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', collection, id, e); }
}
async function dbGetCollection(collection){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    let out = [], pageToken = '';
    do{
      const url = FIRESTORE_ROOT + '/' + collection + '?pageSize=300' + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await withTimeout(fetch(url, { headers: { Authorization: 'Bearer ' + token } }), 8000);
      if(res.status === 404) break;
      if(!res.ok) throw new Error('firestore http ' + res.status);
      const json = await res.json();
      (json.documents || []).forEach(doc => {
        try{ out.push(JSON.parse(doc.fields.value.stringValue)); }catch(e){}
      });
      pageToken = json.nextPageToken || '';
    } while(pageToken);
    return out;
  }catch(e){ console.error('컬렉션 불러오기 실패', collection, e); return []; }
}
// 예전 kv/{oldKey} 블롭(배열 하나)을 컬렉션(문서마다 레코드 하나)로 1회 옮긴다.
// 새 컬렉션에 이미 데이터가 있으면(=이미 옮겨졌으면) 아무것도 안 하고 그걸 그대로 쓴다.
// 예전 블롭 문서는 안전하게 그대로 남겨둔다(옮기다 실패해도 원본 데이터가 사라지지 않도록).
async function migrateBlobToCollection(oldKey, collection, idField){
  const existing = await dbGetCollection(collection);
  if(existing.length > 0) return existing;
  const oldArr = await dbGet(oldKey, []);
  if(!oldArr || oldArr.length === 0) return [];
  // 예전 데이터 중엔 id 필드 자체가 없던 것도 있어서(예: 상담 신청), 없으면 이전하면서 하나 만들어 채운다.
  // 안 그러면 전부 같은 문서 키로 겹쳐 써져서 데이터가 사라진다.
  oldArr.forEach((item, i) => { if(!item[idField]) item[idField] = collection + '_migrated_' + Date.now() + '_' + i; });
  await Promise.all(oldArr.map(item => dbSetDoc(collection, String(item[idField]), item)));
  console.log('[migrate] ' + oldKey + ' -> ' + collection + ': ' + oldArr.length + '건 이전 완료');
  return oldArr;
}

/* =================== 문항 창고 — 코드로 찾는다 (2026-09-03 · I-2) ===================
   기획서 3단계: **만들기 전에 먼저 찾는다.**

   🔴 **창고가 둘이고, 그건 일부러다.**
     ① **원본**은 «장부 파일»(`codes/*.json`)에 산다. 한글 문서에 코드를 심을 때 같이 만들어졌고
        **안 변한다.** 저장소에 있으니 배포에 실려 온다.
     ② **변형**은 Firestore(`variants`)에 산다. 계속 «늘어나는» 것이라 파일로는 못 담는다.
     「시험 전에 적는 값과 후에 적는 값은 다른 곳에 산다」와 같은 가름이다.

   ⚠ **둘 다 loadAll() 에 넣지 않는다.** loadAll 은 로그인마다 도는데 장부만 지금 564제다.
     거기 넣으면 **학생이 홈을 여는 데까지** 그 값을 치른다. 쓰는 화면에서만 받는다. */
/* ⚠ **여기서 `state.xxx = null` 로 자리를 잡지 않는다.** 이 블록은 `const state` 선언보다
     «위»에 있어서, 그렇게 적으면 「Cannot access 'state' before initialization」로
     **스크립트가 통째로 죽는다** (2026-09-03에 실제로 그렇게 만들었다 —
     함수 선언은 끌어올려져 살아 있는데 state·DATA 가 없어서, 겉보기엔 «페이지는 뜨는데
     아무것도 안 되는» 꼴이 됐다). 자리는 state 선언 안에 잡아 뒀다: itemIndex·itemByCode·variants. */

/* ⚠ **이미 받는 중이면 «그것을 기다린다».** 예전엔 그냥 빠져나왔는데, 그러면
     기다린 쪽이 **빈손으로 이어가서** `state.variants` 가 null 인 채로 쓰인다
     (2026-09-03에 실제로 터졌다 — 화면이 먼저 부르고 내가 이어서 부른 자리에서).
     화면은 render() 마다 부르므로 이 겹침은 «가끔»이 아니라 «자주» 일어난다. */
let itemStoreLoading = null;
async function loadItemStoreIfNeeded(){
  if(state.itemByCode && state.variants) return;
  if(itemStoreLoading) return itemStoreLoading;
  itemStoreLoading = (async () => {
  try{
    if(!state.itemByCode){
      /* ⚠ file:// 로 열면 fetch 가 막힌다. 그때는 창고가 «빈 채»로 남고 화면은 그대로 돈다 —
         터지지 않는 것이 중요하다. 서버로 열면(node tools/serve.js) 정상이다. */
      const map = {};
      try{
        const idx = await fetch('codes/index.json', {cache:'no-cache'}).then(r=>r.json());
        state.itemIndex = idx.ledgers || [];
        for(const L of state.itemIndex){
          const g = await fetch('codes/' + L.file, {cache:'no-cache'}).then(r=>r.json());
          for(const it of (g.items||[])) map[it.code] = it;
        }
      }catch(e){ console.warn('[창고] 장부를 못 읽었다 —', e.message); state.itemIndex = []; }
      state.itemByCode = map;
    }
    if(!state.variants){
      const rows = await dbGetCollection('variants');
      const by = {};
      for(const v of rows) (by[v.originCode] = by[v.originCode] || []).push(v);
      for(const k in by) by[k].sort((a,b)=> a.code < b.code ? -1 : 1);
      state.variants = by;
    }
  } finally { itemStoreLoading = null; }
  })();
  return itemStoreLoading;
}

const ITEM_CODE_RE = /^([A-Z]{1,2}\d?)-(\d{2})-([A-Z])-(\d{4})(?:-([NUD])(\d{2}))?$/;  // K2-05-E-0431 · …-N01
const VARIANT_KINDS = [['N','숫자변형'],['U','상향'],['D','하향']];
/* 코드 하나를 «원본»과 «변형»으로 가른다.
   🔴 **복습테스트는 기존 문항의 숫자변형이 곧 문항**이라, 그 시험지에는 변형 코드가
     그대로 적힌다. 그것도 알아들어야 «이 문항은 0001의 N01» 이라고 말해 줄 수 있다. */
function splitItemCode(code){
  const m = String(code || '').match(ITEM_CODE_RE);
  if(!m) return null;
  return {
    origin: m[1] + '-' + m[2] + '-' + m[3] + '-' + m[4],
    isVariant: !!m[5], variantKind: m[5] || '', variantNo: m[6] || '',
  };
}

function normItemCode(s){
  const t = String(s||'').trim().toUpperCase().replace(/\s+/g,'');
  return ITEM_CODE_RE.test(t) ? t : '';
}
function itemOfCode(code){ return (state.itemByCode || {})[code] || null; }
function variantsOfCode(code){ return (state.variants || {})[code] || []; }

/* 다음 변형 번호. **갈래마다 따로 센다** — N01 이 있어도 U01 은 비어 있을 수 있다.
   ⚠ 변형의 변형은 만들지 않는다. 언제나 «원본»에 직접 매단다 (체인이 끊길 자리를 안 만든다). */
function nextVariantCode(originCode, kind){
  const used = variantsOfCode(originCode)
    .filter(v => v.variantKind === kind)
    .map(v => parseInt(String(v.code).slice(-2), 10) || 0);
  return originCode + '-' + kind + String((used.length ? Math.max(...used) : 0) + 1).padStart(2,'0');
}

/* 시험지 문항에 코드를 잇는다.
   🔴 **창고에 없는 코드는 막는다.** 조용히 받아 두면 나중에 «찾아도 안 나오는 문항»이 되고,
     그때는 원인을 못 찾는다. 오타는 지금 드러나야 한다. */
async function setBankItemCode(bankId){
  const el = document.getElementById('ic-in-' + bankId);
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b || !el) return;
  const raw = el.value;
  if(!raw.trim()){
    /* ⚠ 빈 칸으로 눌렀는데 «뗐습니다»라고 했다 — 뗄 코드가 없는데도.
       사용자가 「잇기가 뭐 하는 건가」 하고 눌러 보고 그 말을 들었다 (2026-09-03).
       **아무 일도 안 일어났으면 «무엇을 해야 하는지»를 말해야 한다.** */
    if(!b.itemCode){
      showToast('코드를 먼저 넣어 주세요 — 교재 미주 맨 앞의 「[K2-05-E-0431]」 같은 것입니다.');
      return;
    }
    b.itemCode = '';
    await dbSetDoc('problembank', b.id, b);
    showToast('코드를 뗐습니다.'); render(); return;
  }
  const code = normItemCode(raw);
  if(!code){ showToast('코드 모양이 아닙니다 — 「K2-05-E-0431」처럼 적어주세요.'); return; }
  await loadItemStoreIfNeeded();
  /* 🔴 **변형 코드(`…-N01`)면 «원본»이 창고에 있는지 본다.**
     변형은 장부에 없다(장부는 원본만 담는다). 코드 그대로 찾으면 언제나 «없다»가 되어
     **손으로 변형 코드를 잇는 길이 통째로 막힌다** — 복습테스트가 바로 그 길이다. */
  const sp = splitItemCode(code);
  if(!itemOfCode(sp.origin)){
    showToast(sp.isVariant
      ? '원본 ' + sp.origin + ' 이 창고에 없습니다 — 단원이나 번호를 다시 봐주세요.'
      : '창고에 없는 코드입니다 — 단원이나 번호를 다시 봐주세요.');
    return;
  }
  b.itemCode = code;
  await dbSetDoc('problembank', b.id, b);
  showToast(code + ' 에 이었습니다.');
  render();
}

/* 만든 변형을 창고에 넣는다. **여기가 «다음에 찾아지는» 자리다.** */
async function saveVariantToStore(bankId, kind){
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b || !b.itemCode){ showToast('먼저 이 문항에 코드를 이어주세요.'); return; }
  if(!b.variantContent && !b.variantAnswer){ showToast('저장할 변형 내용이 없습니다.'); return; }
  await loadItemStoreIfNeeded();
  const code = nextVariantCode(b.itemCode, kind);
  const v = {
    code, originCode: b.itemCode, variantKind: kind,
    content: b.variantContent || '', answer: b.variantAnswer || '',
    solution: b.aiSolution || '', needsFigure: !!b.variantNeedsFigure,
    fromBankId: b.id, createdAt: nowStamp(),
  };
  await dbSetDoc('variants', code, v);
  (state.variants[b.itemCode] = state.variants[b.itemCode] || []).push(v);
  state.variants[b.itemCode].sort((a,b2)=> a.code < b2.code ? -1 : 1);
  showToast(code + ' 로 창고에 넣었습니다 — 다음엔 찾아집니다.');
  render();
}

/* 🔵 **손으로 코드를 적어 올린 변형을 창고에 넣는다** (2026-09-03).
   복습테스트처럼 «이미 변형인 문항»으로 시험지를 만들어 올리면, 그 문항 자체가 N01 이다.
   그때는 AI 가 만든 것이 아니므로 갈래를 물을 필요도 없다 — **코드가 이미 말하고 있다.**
   ⚠ 번호도 여기서 새로 매기지 않는다. 사용자가 파일에 적은 그 번호를 그대로 쓴다. */
async function registerVariantFromBank(bankId){
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b || !b.itemCode) return;
  const sp = splitItemCode(b.itemCode);
  if(!sp || !sp.isVariant){ showToast('변형 코드가 아닙니다.'); return; }
  await loadItemStoreIfNeeded();
  if(variantsOfCode(sp.origin).some(v=>v.code===b.itemCode)){ showToast('이미 창고에 있습니다.'); render(); return; }
  const v = {
    code: b.itemCode, originCode: sp.origin, variantKind: sp.variantKind,
    content: b.originalContent || '', answer: b.originalAnswer || '',
    solution: '', needsFigure: false, fromBankId: b.id, createdAt: nowStamp(),
  };
  await dbSetDoc('variants', v.code, v);
  (state.variants[sp.origin] = state.variants[sp.origin] || []).push(v);
  state.variants[sp.origin].sort((a,b2)=> a.code < b2.code ? -1 : 1);
  showToast(v.code + ' 를 창고에 넣었습니다.');
  render();
}

/* 창고에 있는 변형을 이 문항으로 가져온다 — **만들지 않고 쓰는 길.** */
async function useVariantFromStore(bankId, code){
  const b = DATA.problemBank.find(x=>x.id===bankId);
  const v = variantsOfCode(b && b.itemCode).find(x=>x.code===code);
  if(!b || !v) return;
  b.variantContent = v.content;
  b.variantAnswer  = v.answer;
  b.aiSolution     = v.solution || '';
  b.variantNeedsFigure = !!v.needsFigure;
  await dbSetDoc('problembank', b.id, b);
  showToast(code + ' 를 가져왔습니다 — AI 한도를 안 썼습니다.');
  render();
}

/* =================== AI 쌍둥이 문제 생성 (일 20건 한도) =================== */
/* «오늘»은 로컬 날짜다. 예전엔 toISOString()(UTC)이었는데, KST(+9)에서는 00:00~09:00 사이에
   하루 전을 가리켰다. 그 시간대에 출결을 넣으면 하루 전 날짜로 저장됐고,
   반 관리의 수업 날짜 목록은 «요일은 로컬로 판정하고 날짜는 UTC로 기록»해서 통째로 하루씩 밀렸다
   (월·수·금 반이 일·화·목으로 보였다).
   이미 저장된 기록의 날짜는 그대로 둔다 — 고쳐 봐야 어느 쪽이 맞는지 알 수 없다. */
function ymdLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return ymdLocal(new Date()); }
/* 'YYYY-MM-DD HH:MM' — 로컬 기준. 채팅처럼 «분»까지 남기는 곳이 쓴다. */
function nowStamp(){
  const d = new Date();
  return ymdLocal(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
/* ⚠ **한도는 워커가 쥔다. 여기서 따로 세면 반드시 어긋난다.**
   실제로 화면엔 15/20으로 떠 있는데 누르면 429가 났다 (2026-08-10). 어긋난 이유가 셋이었다 —
     ① 워커는 «요청을 받을 때마다» 세고 여기서는 «성공했을 때만» 셌다 (실패가 안 세짐)
     ② 워커는 사용자(uid)별로 세고 여기서는 공용 문서 하나로 셌다
     ③ 워커의 날짜는 UTC, `todayStr()`은 로컬 — KST 00~09시에 하루가 어긋난다
   그래서 워커에 `/quota`를 열고 **그 숫자를 그대로 쓴다.** 여기서는 세지 않는다. */
async function getAIQuotaUsed(){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(AI_WORKER_URL + '/quota', {
      method:'POST', headers:{ 'Authorization': 'Bearer ' + token }
    }), 8000);
    if(!res.ok) throw new Error('quota http ' + res.status);
    const q = await res.json();
    if(typeof q.used === 'number') return q.used;
    throw new Error('bad quota body');
  }catch(e){
    /* 워커를 못 부르는 곳(로컬 127.0.0.1은 ALLOW_ORIGIN에 막힌다)에서는 화면이 멈추면 안 된다.
       0으로 보고 «남았다»고 그린다 — 진짜 한도는 어차피 워커가 막는다. */
    console.warn('한도 조회 실패 — 0으로 본다', e);
    return 0;
  }
}
async function loadAIQuotaIfNeeded(){
  if(state.aiQuotaUsed !== null) return;
  state.aiQuotaUsed = await getAIQuotaUsed();
  render();
}
/* 생성 결과를 문항에 얹는다. 「하나 다시 생성」과 「일괄 생성」이 같은 일을 하므로 한 곳에 둔다 —
   두 벌이면 필드를 하나 늘릴 때 한쪽만 고쳐진다.
   ⚠ 강사가 손으로 그려 붙였던 변형 그림은 여기서 **버린다.** 본문의 수가 새로 바뀌었으니
      옛 그림은 이제 «다른 문제의 그림»이다. 남겨 두면 수는 새것·그림은 옛것인 카드가 학생에게 간다. */
async function applyTwinToBank(b, twin){
  if(b.hasVariantImage) await dropVariantFigure(b);
  b.variantContent = twin.content;
  b.variantAnswer = twin.answer;
  b.aiSolution = twin.solution;
  b.variantFigureFree = !!twin.figureFree;
  b.variantNeedsFigure = !!twin.needsFigure;
  b.variantReuseFigure = !!twin.reuseFigure;
  b.variantFigureSpec = twin.figureSpec || '';
  await dbSetDoc('problembank', b.id, b);
}
/* 변형 그림 하나를 치운다 — 드라이브 파일 · kv 문서 · 캐시 · 플래그.
   problembank 저장은 여기서 하지 않는다. 부르는 쪽이 다른 변경과 함께 한 번에 저장한다. */

}
async function regenerateOneWithAI(bankId){

  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b) return;
  const used = await getAIQuotaUsed();
  if(used >= AI_DAILY_LIMIT){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  state.aiProcessing = true;
  state.aiRegeneratingId = bankId;
  render();
  const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
  const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
  if(twin && twin.quotaExceeded){
    showToast(`오늘 AI 생성 한도(${AI_DAILY_LIMIT}건)를 모두 사용했습니다. 내일 다시 시도해주세요.`);
  } else if(twin){
    b.status = 'pending';
    await applyTwinToBank(b, twin);
    /* 다시 생성하면 문항이 지금 큐에서 빠진다 (「공개됨」에서 눌렀다면 pending으로 내려간다).
       그림을 붙일 때와 같은 이유로 큐를 문항 따라 옮긴다 — 여기는 «하나»를 손보는 자리다. */
    followBankToQueue(b);
    /* 워커가 실어 보낸 숫자를 그대로 쓴다 — 여기서 세지 않는다. */
    state.aiQuotaUsed = (typeof twin.quotaUsed === 'number') ? twin.quotaUsed : null;
    showToast(twin.needsFigure
      ? '다시 생성했습니다. 이 변형은 그림이 필요합니다 — 검토 화면의 지침을 보고 그려서 올려주세요.'
      : '다시 생성했습니다. 검토 상태가 초기화됐어요.');
  } else {
    showToast('생성에 실패했습니다. 잠시 후 다시 시도해주세요.');
  }
  state.aiProcessing = false;
  state.aiRegeneratingId = null;
  render();
}
/* 일괄 생성을 멈춘다. 지금 부르고 있는 한 건은 **받아서 붙이고** 멈춘다 —
   한도는 이미 썼으므로 버리면 그 한 건이 그냥 날아간다.
   ⚠ 루프를 밖에서 끊을 길이 이것 하나뿐이다. 예전에는 스무 건이 도는 중에
      멈출 방법이 화면에 없어서 «페이지를 새로고침»하는 수밖에 없었다. */
function cancelTwinBatch(){
  if(!state.aiProcessing) return;
  state.aiCancel = true;
  render();
}
/* 13초를 통째로 자면 「멈춤」을 눌러도 그만큼 기다려야 한다. 그래서 «깨우는 시계»를 따로 둔다.
   ⚠ **잘게 끊어 자면 안 된다.** 250ms짜리 타이머 52개로 쪼갰더니, 탭이 백그라운드로 가는 순간
      크롬이 타이머를 초당 1회로 조여 13초가 52초가 됐다 (5분 넘게 묻어 두면 더 나빠진다).
      기다림은 **긴 타이머 하나**로 두고, 취소만 짧은 시계로 엿본다 —
      멈춤 버튼은 «보고 있는 탭»에서만 눌리므로 그 시계는 조여도 상관없다. */
function aiSleep(ms){
  if(state.aiCancel) return Promise.resolve();
  return new Promise(resolve=>{
    const done = ()=>{ clearTimeout(timer); clearInterval(watch); resolve(); };
    const timer = setTimeout(done, ms);
    const watch = setInterval(()=>{ if(state.aiCancel) done(); }, 250);
  });
}
/* 쌍둥이 일괄 생성. 대상 목록만 받아서 «오늘 한도까지» 돌린다.
   한도를 넘는 것은 손대지 않고 남겨 둔다 — 내용이 빈 채로 남으므로 다음날 다시 부르면 이어진다.
   생성된 것은 status를 건드리지 않는다: 등록 때 'pending'이었으므로 내용이 채워지는 순간
   저절로 「1차 검토 대기」 큐로 옮겨 간다 (그 큐의 조건이 status==='pending' && 내용 있음이다). */
async function runTwinBatch(needsAI, label){
  if(state.aiProcessing){ showToast('다른 AI 작업이 진행 중입니다. 끝난 뒤 다시 시도해주세요.'); return null; }
  if(needsAI.length===0){ showToast('생성할 문항이 없습니다.'); return null; }
  const used = await getAIQuotaUsed();
  const remaining = AI_DAILY_LIMIT - used;
  if(remaining<=0){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return null; }
  const batch = needsAI.slice(0, remaining);
  state.aiProcessing = true;
  state.aiCancel = false;
  state.aiProgress = { done:0, total: batch.length };
  render();
  let ok = 0, needFig = 0, stoppedByQuota = false, stoppedByUser = false, doneCount = 0;
  for(let i=0;i<batch.length;i++){
    /* 「멈춤」은 «다음 한 건으로 넘어가기 직전»에 듣는다. 돌던 것은 끝까지 붙인다. */
    if(state.aiCancel){ stoppedByUser = true; break; }
    const b = batch[i];
    const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
    const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
    /* 한도에 걸리면 그 자리에서 멈춘다 — 계속 두드려도 전부 429인데
       13초씩 쉬며 헛돌기만 한다. 남은 것은 손대지 않고 그대로 둔다. */
    if(twin && twin.quotaExceeded){ stoppedByQuota = true; break; }
    if(twin){
      await applyTwinToBank(b, twin);
      if(twin.needsFigure) needFig++;
      if(typeof twin.quotaUsed === 'number') state.aiQuotaUsed = twin.quotaUsed;
      ok++;
    }
    doneCount = i + 1;
    state.aiProgress = { done:doneCount, total: batch.length };
    render();
    if(i < batch.length-1) await aiSleep(13000);
  }
  state.aiProcessing = false;
  state.aiCancel = false;
  state.aiProgress = null;
  state.aiQuotaUsed = null;
  const leftover = needsAI.length - ((stoppedByQuota || stoppedByUser) ? doneCount : batch.length);
  showToast(ok===0 && stoppedByQuota
    ? `오늘 AI 생성 한도(${AI_DAILY_LIMIT}건)를 모두 사용했습니다. 내일 다시 시도해주세요.`
    : stoppedByUser
    ? `${label}${ok}개까지 만들고 멈췄습니다. 「1차 검토 대기」에 있습니다.`
      + (needFig>0 ? ` 그중 ${needFig}개는 그림을 직접 그려서 올려야 합니다 (「그림 필요」).` : '')
      + (leftover>0 ? ` 남은 ${leftover}개는 다시 「AI로 채우기」로 이어서 만들 수 있습니다.` : '')
    : `${label}${ok}개를 생성했습니다. 「1차 검토 대기」에 있습니다.`
      + (needFig>0 ? ` 그중 ${needFig}개는 그림을 직접 그려서 올려야 합니다 (「그림 필요」).` : '')
      + (leftover>0 ? ` 남은 ${leftover}개는 오늘 한도를 넘어 내일 이어서 만들 수 있습니다.` : ''));
  render();
  return { ok, needFig, leftover, stoppedByUser };
}
async function processAIQueue(){
  await runTwinBatch(DATA.problemBank.filter(b=>!b.variantContent && !b.variantAnswer), '');
}
/* 시험지를 올린 «그 자리»에서 그 시험지 것만 한꺼번에 만든다.
   예전에는 등록 → 검토 탭으로 이동 → 문항마다 「생성」을 눌러야 했다.
   끝나면 검토 화면의 «1차 검토 대기»로 데려간다 — 다음에 할 일이 그것이기 때문이다. */
async function generateTwinsForExam(examId){
  const e = DATA.exams.find(x=>x.id===examId);
  if(!e) return;
  /* 복사본에서 눌러도 «뿌리»의 문항을 채운다 — 쌍둥이는 반이 아니라 문항에 딸린 것이다. */
  const needsAI = DATA.problemBank
    .filter(b=>b.examId===examRootId(examId) && !b.variantContent && !b.variantAnswer)
    .sort((a,b)=>(a.questionNo||0)-(b.questionNo||0));
  if(needsAI.length===0){ showToast('이 시험지에는 새로 만들 문항이 없습니다.'); return; }
  const used = await getAIQuotaUsed();
  const remaining = Math.max(0, AI_DAILY_LIMIT - used);
  const willDo = Math.min(needsAI.length, remaining);
  if(willDo===0){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  /* 한 건에 13초씩 쉬어 가므로 20건이면 4분이 넘는다. 얼마나 걸리는지 미리 말해 준다. */
  const mins = Math.ceil(willDo * 13 / 60);
  if(!confirm(`${escHtmlPlain(e.title)}의 문항 ${willDo}개로 쌍둥이를 만듭니다.\n`
    + `약 ${mins}분 걸립니다. 그동안 이 화면을 닫지 마세요.\n\n`
    + (needsAI.length > willDo
        ? `오늘 남은 한도가 ${remaining}건이라 ${needsAI.length - willDo}개는 내일 이어서 만듭니다.\n\n` : '')
    + '시작할까요?')) return;
  const res = await runTwinBatch(needsAI, `${e.title} — `);
  if(res && res.ok > 0){
    state.teacherTab = 'review';
    state.reviewQueue = 'pending';        // 1차 검토 대기
    state.examMode = '';
    render();
  }
}
/* confirm()은 HTML을 못 그린다. 태그가 섞이면 그대로 보이므로 표시용으로만 벗긴다. */
function escHtmlPlain(s){ return String(s==null?'':s).replace(/<[^>]*>/g,''); }
// AI가 프롬프트 지시를 놓쳐서 "times"/"le"/"ge" 같은 영단어를 LaTeX 명령어 대신 그대로
// 쓰는 경우가 있어서(프롬프트 개선과 별개로) 이중 안전장치로 한 번 더 다듬는다.
function sanitizeAiMathText(s){
  if(!s) return s;
  return s
    .replace(/(?<!\\)\btimes\b/gi, '\\times')
    .replace(/(?<!\\)\bLEQ\b/gi, '\\leq')
    .replace(/(?<!\\)\bGEQ\b/gi, '\\geq');
}
async function generateTwinViaAI(content, answer, image){
  try{
    const payload = { content, answer };
    if(image){
      if(typeof image === 'string') payload.image = image; // 레거시 base64
      else if(image.fileId) payload.imageFileId = image.fileId; // 신규: 드라이브 파일ID
    }
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(AI_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload)
    }), 45000); // imageFileId 경로는 워커가 드라이브에서 바이트를 먼저 받아와야 해서 기존보다 여유를 둠
    /* 한도 초과는 «실패»와 다르게 다뤄야 한다. 일괄 생성 중이면 남은 것을 계속 두드려도
       전부 429라, 13초씩 쉬며 헛돌기만 한다. 그 자리에서 멈추도록 신호를 돌려준다. */
    if(res.status === 429){
      const body = await res.json().catch(()=>({}));
      if(typeof body.used === 'number') state.aiQuotaUsed = body.used;
      return { quotaExceeded:true, used: body.used };
    }
    if(!res.ok) throw new Error('worker http ' + res.status);
    const data = await res.json();
    if(!data.content || !data.answer) throw new Error('incomplete AI result');
    return {
      content: sanitizeAiMathText(data.content),
      answer: normalizeTwinAnswer(sanitizeAiMathText(data.answer)),
      solution: data.solution || '',
      /* 그림 문항이 어느 길로 갔는가 (worker/gemini-proxy.js의 (A)/(B)/(C)).
         figureFree  — 그림 없이 푸는 문제로 새로 썼다. 변형에 원본 그림을 붙이지 않는다.
         needsFigure — 그림이 있어야 푸는 변형이다. figureSpec을 보고 강사가 직접 그려 붙인다.
         reuseFigure — 그림은 배경이라 원본 것을 그대로 쓴다. 그릴 것이 없다.
         옛 워커는 이 값들을 안 보내므로 없으면 false로 본다. */
      figureFree: !!data.figureFree,
      needsFigure: !!data.needsFigure,
      reuseFigure: !!data.reuseFigure,
      figureSpec: data.figureSpec || '',
      quotaUsed: (typeof data.quotaUsed === 'number') ? data.quotaUsed : undefined
    };
  }catch(e){
    console.error('AI 쌍둥이 생성 실패', e);
    return null;
  }
}

/* (B)의 그림 «초안»을 받아 온다. 돌아오는 것은 **그림이 아니라 장면(scene)**이고,
   그리는 것도 판정하는 것도 여기다 (figure.js). 워커는 검산하지 않는다 —
   규칙이 두 벌이면 워커와 화면이 다른 답을 내는데, 막는 쪽이 화면이라 진실도 여기여야 한다.
   ⚠ 이 호출도 하루 한도를 하나 쓴다. 그래서 «일괄 생성»에서는 부르지 않는다. */
async function fetchFigureSceneViaAI(spec, content, image){
  try{
    const payload = { spec, content };
    if(image){
      if(typeof image === 'string') payload.image = image;
      else if(image.fileId) payload.imageFileId = image.fileId;
    }
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(AI_WORKER_URL + '/figure', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload)
    }), 45000);
    if(res.status === 429){
      const body = await res.json().catch(()=>({}));
      if(typeof body.used === 'number') state.aiQuotaUsed = body.used;
      return { quotaExceeded:true };
    }
    if(!res.ok) throw new Error('worker http ' + res.status);
    const data = await res.json();
    if(typeof data.quotaUsed === 'number') state.aiQuotaUsed = data.quotaUsed;
    /* «못 그린다»는 실패가 아니다. 워커가 200으로 돌려주고 화면은 「사람이 그리세요」로 간다. */
    if(data.unsupported) return { unsupported:true, reason: data.reason || '' };
    return { scene: data.scene };
  }catch(e){
    console.error('그림 장면 생성 실패', e);
    return null;
  }
}

/* =================== Firestore 컬렉션(문서 여러 개) 헬퍼 =================== */
/* kv 방식(단일 문서에 큰 JSON 저장)은 대량 데이터에는 안 맞아서, 문항 창고처럼
   개수가 많이 늘어날 수 있는 데이터는 문서를 하나씩 따로 저장하는 이 방식을 쓴다. */
function toFirestoreFields(obj){
  const fields = {};
  for(const k in obj){ fields[k] = { stringValue: String(obj[k] ?? '') }; }
  return fields;
}
function fromFirestoreDoc(doc){
  const obj = { id: doc.name.split('/').pop() };
  const fields = doc.fields || {};
  for(const k in fields){ obj[k] = fields[k].stringValue ?? ''; }
  return obj;
}
async function collectionAdd(collectionName, data){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: toFirestoreFields(data) })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    return fromFirestoreDoc(doc);
  }catch(e){ console.error('추가 실패', collectionName, e); return null; }
}
async function collectionListAll(collectionName){
  const out = [];
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    let pageToken = '';
    do{
      const url = FIRESTORE_ROOT + '/' + collectionName + '?pageSize=300' + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await withTimeout(fetch(url, { headers: { Authorization: 'Bearer ' + token } }), 8000);
      if(!res.ok) throw new Error('firestore http ' + res.status);
      const data = await res.json();
      (data.documents || []).forEach(doc => out.push(fromFirestoreDoc(doc)));
      pageToken = data.nextPageToken || '';
    } while(pageToken);
  }catch(e){ console.error('목록 조회 실패', collectionName, e); }
  return out;
}
async function collectionDelete(collectionName, id){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName + '/' + id, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', collectionName, e); }
}

/* 로고 — 가로형(1) 컬러. 28KB PNG 966×223을 data URI로 심어 뒀다.
   파일 경로가 «로고/가로형(1).png»라 한글이 섞이는데, 그걸 배포본에서 부르면

/* 과목 안에서만 고른다 — 「포물선」은 이차함수에도 이차곡선에도 있다.
   과목을 모르면 짐작하지 않는다. 틀린 초안은 없느니만 못하다. */
function guessChapter(content, subject){
  const chapters = UNIT_CHAPTERS[subject] || [];
  const text = String(content || '');
  let best = '', bestScore = 0;
  chapters.forEach(ch => {
    const hints = CHAPTER_HINTS[ch] || [ch];
    const score = hints.reduce((n, h) => n + (text.includes(h) ? h.length : 0), 0);
    if(score > bestScore){ bestScore = score; best = ch; }
  });
  return best;
}

/* ---------- 지금 시즌과 «지금 범위» ----------
   저장은 컬렉션을 늘리지 않고 kv 문서 둘이다 (이 프로젝트의 기존 판단과 같다).
     kv/season       {name, startedAt}
     kv/exam-ranges  {season, bySchool:{학교:{과목:[단원…]}}}
   **학교별 수정은 «지금 시즌에 대한 것»이라 시즌이 넘어가면 비운다.**
   시험범위는 매 시험마다 새로 받는 것이라, 지난 시즌 수정이 남아 있으면 그게 더 위험하다. */
function currentSeason(){ return (state.season && state.season.name) || SEASONS[0]; }

/* 프리셋 — 과목의 단원 목록을 시즌으로 자른다. */
/* seasonName을 넘기면 «그 시즌» 기준으로 자른다 — 지난 기록을 볼 때 필요하다. */
function presetChapters(subject, seasonName){
  const all = UNIT_CHAPTERS[subject] || [];
  const season = seasonName || currentSeason();
  if(isVacationSeason(season)) return all.slice();
  const cut = SEASON_SPLIT[subject];
  if(!cut) return all.slice();
  return season.includes('중간') ? all.slice(0, cut) : all.slice(cut);
}
/* 학교별 수정이 있으면 그것이 프리셋을 대신한다 (더하는 것이 아니라 갈아끼운다 —
   «확장»도 «축소»도 되어야 하고, 둘을 합치면 어느 쪽이 진짜인지 알 수 없게 된다). */
/* ⚠ 범위는 «학교»만으로 갈리지 않는다. **같은 학교라도 학년마다 시험범위가 다르다.**
   그래서 저장은 학교 → 학년 → 과목 세 겹이다 (`bySchool[학교][학년][과목] = [단원…]`).
   처음엔 학교×과목 두 겹이었는데, 한 학교의 고1과 고2가 같은 과목을 들으면
   범위가 하나로 합쳐져 한쪽이 틀린 범위를 받는다 (2026-08-10에 학년을 넣었다). */
function rangeOverrideOf(school, grade, subject){
  const bys = state.examRanges && state.examRanges.bySchool;
  const byGrade = bys && bys[school];
  const got = byGrade && byGrade[grade] && byGrade[grade][subject];
  return (Array.isArray(got) && got.length) ? got : null;
}
function rangeChapters(school, grade, subject){
  const got = rangeOverrideOf(school, grade, subject);
  return got ? got.slice() : presetChapters(subject);
}
function hasRangeOverride(school, grade, subject){
  return !!rangeOverrideOf(school, grade, subject);
}
/* 이 학생이 지금 배우는 과목 — 반에서 온다. 반이 없거나 과목을 안 정했으면 빈 문자열. */
function subjectOfStudent(sid){
  const s = DATA.students.find(x=>x.studentId===sid);
  const c = s && DATA.classes.find(x=>x.id===s.classId);
  return (c && c.progress && c.progress.subject) || '';
}
/* 이 학생의 «지금 범위» = 단원 이름 Set. 과목을 못 정했으면 null —
   null은 «범위를 모른다»는 뜻이고, 그때는 거르지 않는다 (모른다고 다 막으면 화면이 빈다). */
function studentRange(sid){
  const subject = subjectOfStudent(sid);
  if(!subject) return null;
  const s = DATA.students.find(x=>x.studentId===sid);
  const list = rangeChapters((s && s.school) || '', (s && s.grade) || '', subject);
  return list.length ? new Set(list) : null;
}

async function saveSeason(name){
  state.season = {name, startedAt: todayStr()};
  await dbSet('season', state.season);
  /* 시즌이 바뀌면 학교별 수정은 지난 시험의 것이 된다. 비우고 프리셋으로 돌아간다.
     **날짜도 함께 비운다** — 지난 시험의 날짜가 남아 있으면 학생 화면에 끝난 시험의
     D-day가 뜬다. 교재(kv/school-books)는 여기서 건드리지 않는다. */
  state.examRanges = {season: name, bySchool: {}, dates: {}};
  await dbSet('exam-ranges', state.examRanges);
}
/* ---------- 지난 시즌 보관 ----------
   시즌을 넘기면 범위와 날짜를 «비운다»는 판단은 그대로다 — 지난 시험의 범위가 남아 있으면
   그게 더 위험하기 때문이다. 다만 **비우기 전에 통째로 떠서 보관한다.**
   작년 이맘때 그 학교 시험이 언제였고 범위가 어디까지였는지는 다음 해에 그대로 쓸모가 있다.

   ⚠ 교재(kv/school-books)는 시즌과 무관해 «지금 값»이 계속 살아 있지만,
      **보관본에는 그때의 스냅숏을 같이 넣는다** — 나중에 바뀌면 지난 기록이 거짓이 된다.
   ⚠ 컬렉션을 늘리지 않는다. kv 문서 하나에 배열로 쌓고 스물넷(4년치)까지만 남긴다. */
const EXAM_HISTORY_MAX = 24;
async function loadExamHistoryIfNeeded(){
  if(state.examHistory) return;
  state.examHistory = (await dbGet('exam-history', null)) || {items: []};
  render();
}
async function archiveCurrentSeason(){
  const er = state.examRanges || {};
  const hasRanges = er.bySchool && Object.keys(er.bySchool).length;
  const hasDates  = er.dates    && Object.keys(er.dates).length;
  /* ⚠ **등급컷만 적어 둔 시즌도 보관한다** (2026-09-02 · G-1). 등급컷은 시험이 끝난 뒤에
     적는 값이라 «범위도 날짜도 안 적고 등급컷만» 있는 시즌이 실제로 생긴다. 그걸 안 보관하면
     지난 기록 고르개에 그 시즌이 아예 안 떠서 **적어 둔 등급컷을 다시 못 본다.** */
  const hasCuts   = gradeCutCount(curSeasonKey()) > 0;
  /* 적어 둔 것이 없으면 보관하지 않는다 — 빈 기록이 목록을 채우면 찾기만 어려워진다. */
  if(!hasRanges && !hasDates && !hasCuts) return;
  const hist = state.examHistory || (await dbGet('exam-history', null)) || {items: []};
  hist.items.unshift({
    season: currentSeason(),
    startedAt: (state.season && state.season.startedAt) || '',
    endedAt: todayStr(),
    bySchool: er.bySchool || {},
    dates: er.dates || {},
    books: JSON.parse(JSON.stringify(state.schoolBooks || {})),
  });
  hist.items = hist.items.slice(0, EXAM_HISTORY_MAX);
  state.examHistory = hist;
  await dbSet('exam-history', hist);
}
/* 보관본 한 건의 이름 — 같은 시즌이 해마다 돌아오므로 «연도»가 있어야 구분된다. */
function examHistLabel(h){
  const y = (h.startedAt || h.endedAt || '').slice(0,4);
  return (y ? y + ' · ' : '') + h.season;
}

async function endSeason(){
  const now = currentSeason();
  const next = SEASONS[(SEASONS.indexOf(now) + 1) % SEASONS.length];
  if(!confirm(`「${now}」을 끝내고 「${next}」으로 넘어갈까요?\n\n`
    + `지금 적어 둔 시험 일정(날짜·범위·교재)은 «지난 기록»으로 보관되고,\n`
    + `학교·학년별 수정은 지워져 기본 범위로 돌아갑니다.`)) return;
  await archiveCurrentSeason();          // ⚠ 반드시 «비우기 전»에
  await saveSeason(next);
  logAudit('시험 시즌 변경', '', '', `${now} → ${next}`);
  showToast(`「${next}」으로 넘어갔습니다. 지난 일정은 «지난 기록»에서 볼 수 있습니다.`);
  render();
}
async function saveSchoolRange(school, grade, subject, chapters){
  if(!state.examRanges) state.examRanges = {season: currentSeason(), bySchool: {}};
  const bys = state.examRanges.bySchool;
  if(!bys[school]) bys[school] = {};
  if(!bys[school][grade]) bys[school][grade] = {};
  if(chapters && chapters.length) bys[school][grade][subject] = chapters;
  else delete bys[school][grade][subject];
  state.examRanges.season = currentSeason();
  await dbSet('exam-ranges', state.examRanges);
}

/* ---------- 시험 일정 — 날짜와 교재 (2026-08-13) ----------
   노션에서 시험기간마다 손으로 정리하던 표를 여기로 옮겼다.
   **표를 새로 만들지 않았다** — 그 표의 「시작 단원 ~ 끝 단원」이 곧 위의 시험 범위라
   따로 두면 범위가 두 벌이 된다 (signalOf·assistantClassIds를 하나로 합친 것과 같은 이유).
   없던 것은 «날짜»와 «교재» 둘뿐이고, 그 둘만 여기서 더한다.

   ⚠ **날짜는 학교 × 학년 단위다.** 과목별로 갈리지 않는다 — 시험기간은 학교가 정하는 것이라
      그 학교 그 학년이면 과목이 무엇이든 같은 기간이다. (범위는 과목마다 다르다.)

   ⚠ **저장되는 곳이 둘로 갈린다. 이게 이 기능의 핵심 판단이다.**
     날짜 → `kv/exam-ranges`의 `dates`. **시험마다 새로 받는 값**이라 시즌을 넘기면 범위와 함께 비운다.
     교재 → `kv/school-books` **따로**. 「미래엔」·「천재홍」은 학교의 «고정 속성»에 가까워
            매 시즌 다시 입력하게 하면 안 된다. 시즌 초기화에 휩쓸리지 않아야 한다. */
function examDatesOf(school, grade){
  const d = state.examRanges && state.examRanges.dates;
  const got = d && d[school] && d[school][grade];
  return (got && (got.start || got.end || got.math)) ? got : null;
}
/* 날짜 셋 — 시험기간 시작·끝, 그리고 **수학 시험일**.
   수학 시험일이 따로 있는 이유: 시험기간은 닷새인데 수학은 그중 하루다.
   이 사람에게 중요한 날은 그 하루이므로 D-day의 기준도 그것이 된다. */
async function saveExamDates(school, grade, start, end, math){
  if(!state.examRanges) state.examRanges = {season: currentSeason(), bySchool: {}};
  if(!state.examRanges.dates) state.examRanges.dates = {};
  const d = state.examRanges.dates;
  if(!d[school]) d[school] = {};
  if(start || end || math) d[school][grade] = {start: start||'', end: end||'', math: math||''};
  else delete d[school][grade];
  state.examRanges.season = currentSeason();
  await dbSet('exam-ranges', state.examRanges);
}
/* ---------- 내신 등급컷 (2026-09-02 · G-1) ----------
   사용자가 시켰다 — 「시험 일정과 비슷하게 **학교별 학년별 내신성적 등급컷**을 기록」,
   「**1등급컷부터 4등급컷까지**」. 물어서 정한 둘: **과목까지 나눈다** · **기록만 한다**.

   🔴 **저장을 kv/exam-ranges 에 넣지 않았다. 이것이 이 기능의 핵심 판단이다.**
     범위·날짜는 시험 «전»에 적는 값이라 시즌을 넘기면 비우는 것이 맞다.
     그런데 **등급컷은 시험이 «끝난 뒤»에 학교에서 나온다.** 넘긴 뒤에 나오는 일이 흔하고,
     exam-ranges 에 뒀다면 **넘기는 순간 적을 데가 사라진다.**
   🔵 그래서 kv 문서를 따로 두고 **«시즌 한 판»을 열쇠로 삼는다.** 시즌 초기화에 안 휩쓸리고,
     지난 기록을 보면서도 그 시즌의 등급컷은 «적을 수 있다» — 지난 기록 중 유일하게 고쳐지는 값이다.
   ⚠ 시즌 이름은 해마다 돌아온다(「1학기 중간」). 그래서 열쇠는 **시작일 + 이름**이다 —
     examHistLabel 이 연도를 앞에 붙이는 것과 같은 까닭이다.
   ⚠ 컬렉션을 늘리지 않는다 — 이 프로젝트의 기존 판단대로 kv 문서 하나다. */
function seasonKeyOf(name, startedAt){ return String(startedAt || '') + '|' + String(name || ''); }
function curSeasonKey(){
  return seasonKeyOf(currentSeason(), (state.season && state.season.startedAt) || '');
}
const CUT_GRADES = [1, 2, 3, 4];              // 사용자가 정했다 — 1~4등급컷까지
function gradeCutOf(seasonKey, school, grade, subject){
  const by = state.gradeCuts && state.gradeCuts.byKey;
  const got = by && by[seasonKey] && by[seasonKey][school]
    && by[seasonKey][school][grade] && by[seasonKey][school][grade][subject];
  return (got && CUT_GRADES.some(g => got['c' + g] != null)) ? got : null;
}
/* 한 등급컷을 고친다. **넷이 다 비면 줄째로 지운다** — 빈 껍데기가 남으면
   「적어 둔 곳 N개」가 거짓이 되고, 지난 기록 목록에도 빈 시즌이 뜬다.
   ⚠ 0점을 «비었다»로 읽으면 안 된다 — 빈 칸과 0은 다른 말이다. */
async function saveGradeCut(seasonKey, school, grade, subject, g, value){
  if(!state.gradeCuts) state.gradeCuts = {byKey: {}};
  if(!state.gradeCuts.byKey) state.gradeCuts.byKey = {};
  const by = state.gradeCuts.byKey;
  if(!by[seasonKey]) by[seasonKey] = {};
  if(!by[seasonKey][school]) by[seasonKey][school] = {};
  if(!by[seasonKey][school][grade]) by[seasonKey][school][grade] = {};
  const cell = Object.assign({}, by[seasonKey][school][grade][subject] || {});
  const num = String(value == null ? '' : value).trim();
  if(num === '') delete cell['c' + g];
  else {
    const v = Number(num);
    /* 원점수다 — 100을 넘을 수 없다. 잘못 친 값은 «저장 안 함»으로 돌려보낸다 */
    if(!Number.isFinite(v) || v < 0 || v > 100) return false;
    cell['c' + g] = v;
  }
  if(CUT_GRADES.every(x => cell['c' + x] == null)) delete by[seasonKey][school][grade][subject];
  else by[seasonKey][school][grade][subject] = cell;
  /* 빈 껍데기를 걷는다 */
  if(!Object.keys(by[seasonKey][school][grade]).length) delete by[seasonKey][school][grade];
  if(!Object.keys(by[seasonKey][school]).length) delete by[seasonKey][school];
  if(!Object.keys(by[seasonKey]).length) delete by[seasonKey];
  await dbSet('grade-cuts', state.gradeCuts);
  return true;
}
/* 「88 · 79 · 71 · 64」 — 표 한 칸에 넣는 짧은 말. 빠진 등급은 «—»로 둔다 */
function gradeCutLabel(cut){
  if(!cut) return '';
  return CUT_GRADES.map(g => (cut['c' + g] == null ? '—' : cut['c' + g])).join(' · ');
}
/* 🔴 **등급은 내림차순이어야 한다** — 1등급컷이 2등급컷보다 낮으면 둘 중 하나가 오타다.
   막지는 않는다(학교가 이상하게 낸 해도 있다). **말해 줄 뿐이다.** */
function gradeCutWarn(cut){
  if(!cut) return '';
  for(let i = 0; i < CUT_GRADES.length - 1; i++){
    const a = cut['c' + CUT_GRADES[i]], b = cut['c' + CUT_GRADES[i + 1]];
    if(a != null && b != null && a <= b)
      return CUT_GRADES[i] + '등급컷이 ' + CUT_GRADES[i + 1] + '등급컷보다 낮습니다';
  }
  return '';
}
/* 이 시즌에 등급컷이 적힌 «칸»의 수 */
function gradeCutCount(seasonKey){
  const by = state.gradeCuts && state.gradeCuts.byKey && state.gradeCuts.byKey[seasonKey];
  let k = 0;
  Object.values(by || {}).forEach(byG => Object.values(byG || {}).forEach(bySj =>
    { k += Object.keys(bySj || {}).length; }));
  return k;
}
function schoolBookOf(school, grade){
  const b = state.schoolBooks;
  return (b && b[school] && b[school][grade]) || '';
}
async function saveSchoolBook(school, grade, text){
  if(!state.schoolBooks) state.schoolBooks = {};
  const b = state.schoolBooks;
  if(!b[school]) b[school] = {};
  if(text) b[school][grade] = text; else delete b[school][grade];
  await dbSet('school-books', state.schoolBooks);
}

/* 시험까지 며칠. 셋을 가른다 — «아직»·«시험 중»·«끝남»은 학생에게 서로 다른 말이다.
   ⚠ 날짜 산술은 문자열을 UTC로 맞춰서 한다. 로컬 자정으로 만든 뒤 toISOString()으로
      되돌리면 KST에서 하루가 깎인다 (2026-08-07에 겪었다). */
function examDdayOf(school, grade){
  const d = examDatesOf(school, grade);
  if(!d) return null;
  /* **수학 시험일이 있으면 그 날이 기준이다.** 시험기간은 닷새여도 이 사람에게 중요한 날은 하루다.
     없을 때만 시험기간 시작일로 물러난다. */
  const target = d.math || d.start;
  if(!target) return null;
  const end = d.end || d.start || target;
  const days = ymd => Math.round(Date.parse(ymd+'T00:00:00Z') / 86400000);
  const t = todayStr();
  const basis = d.math ? 'math' : 'start';
  const base = {basis, start:d.start, end:d.end, math:d.math, target};
  const left = days(target) - days(t);
  if(left > 0)             return Object.assign({state:'before', days:left}, base);
  if(days(t) <= days(end)) return Object.assign({state:'during', days:0},    base);
  return Object.assign({state:'after', days:0}, base);
}
/* 이 학생의 시험 일정. 학교·학년이 비어 있으면 «빈 값»끼리 묶인 줄을 본다 —
   범위가 그렇게 동작하므로 날짜도 같아야 한다. */
function studentExamDday(sid){
  const s = DATA.students.find(x=>x.studentId===sid);
  if(!s) return null;
  return examDdayOf(s.school || '', s.grade || '');
}

   그 경로로 만들어진 학생만 조용히 필드가 없는 채로 돌아다닌다. */
function emptyRecord(){
  return {scores:[], attendance:[], assignments:[], progress:{unit:'', percent:0},
          wrongHomework:[], videoProgress:{}, assignmentsDone:{},
          dailyQuiz:{day:'', picks:[], cards:{}, log:[]},
          /* 출석 도장 — «앱을 연 날». ⚠ attendance(강사가 넣는 출결)와 **다른 줄**이다 */
          checkin:{last:'', streak:0, best:0, bestScore:0, bests:{}, days:{}}};
}
/* ⚠ **저장해도 되는 기록은 «읽어 온 그 객체» 하나뿐이다.**
   메모리의 기록을 다른 객체로 갈아끼운 뒤 저장하면 진짜 문서를 통째로 덮는다.
   실제로 그렇게 테스트학생의 출결·성적·오답숙제를 날렸다 (2026-08-12).
   ⚠ 이 앱은 **학생 화면을 «그리기만 해도» 저장한다** (dqEnsureToday가 오늘 뽑기를 박아 둔다).
     그래서 «잘못된 기록을 메모리에 얹고 화면을 그리는 것»이 곧 삭제다 — 그 문을 여기서 닫는다.
   제자리에서 고치는(mutate) 기존 경로는 객체가 그대로라 전부 통과한다. */
const recordLoaded = new Map();          // studentId → 읽어 온 «그» 객체
function adoptRecord(studentId, rec){
  recordLoaded.set(studentId, rec);
  DATA.records[studentId] = rec;
  return rec;
}
async function loadRecord(studentId){
  if(!DATA.records[studentId]){
    adoptRecord(studentId, await dbGet('record:'+studentId, emptyRecord()));
  }
  if(!DATA.records[studentId].wrongHomework) DATA.records[studentId].wrongHomework = [];
  if(!DATA.records[studentId].videoProgress) DATA.records[studentId].videoProgress = {};
  if(!DATA.records[studentId].assignmentsDone) DATA.records[studentId].assignmentsDone = {};
  dqState(DATA.records[studentId]);          // dailyQuiz 없는 옛 기록을 여기서 채운다
  ckState(DATA.records[studentId]);          // checkin 없는 옛 기록도 마찬가지
  return DATA.records[studentId];
}
async function saveRecord(studentId){
  const rec = DATA.records[studentId];
  if(!rec || recordLoaded.get(studentId) !== rec){
    console.error('저장을 막았다 — 읽어 온 기록이 아니다', studentId);
    warnDbBlocked('record:'+studentId);
    return null;
  }
  return dbSet('record:'+studentId, rec);
}
async function loadChat(studentId){
  if(!DATA.chats[studentId]){
    DATA.chats[studentId] = await dbGet('chat:'+studentId, []);
  }
  return DATA.chats[studentId];
}

/* =================== 로그인 =================== */
// ⚠ 아래 두 줄은 «2026-08-26 이전»의 설명이었다. 지금은 틀렸으니 그대로 믿지 말 것 —
//   학생 계정에 재적 필드(`withdrawnAt`)가 생겼다. 아래 W-1 상자가 지금의 설명이다.
//   `isWithdrawnRecord`는 **옛 데이터를 읽기 위해서만** 남아 있다.
/* =================== 퇴원 (2026-08-26 · W-1) ===================
   **퇴원은 «삭제와 다른 것»이다** — 사용자의 말: 「그냥 삭제랑 별도로 정보는 남겨두고
   퇴원처리만 하는 기능이 필요해」. 기록은 한 줄도 안 지우고 **명단에서만 내려놓는다.**

   🔴 **판정은 `student.withdrawnAt` 하나가 한다** (「YYYY-MM-DD」). 그 전에는 «마지막 출결
   상태가 퇴원인가»로 봤는데, 그러면 **나중에 더 늦은 날짜의 출결이 한 줄 들어가는 순간
   조용히 재원으로 돌아간다.** 학적은 사건이지 출결의 부산물이 아니다.
   ⚠ **옛 방식도 계속 읽는다** — 그렇게 적힌 학생이 이미 있으면 갑자기 되살아나면 안 된다.
     다만 **새로 적지는 않는다**(출결의 「퇴원」 항목은 W-1에서 뺐다 → `ATT_STATUSES`).
   ⚠ `rec`는 «있으면» 본다 — 기록이 아직 안 실린 화면에서도 `withdrawnAt`만으로 답이 나와야
     한다. 반 명단을 거르는 자리 스무 곳이 전부 동기 함수라 이게 중요하다. */
function isWithdrawnRecord(rec){
  if(!rec || !rec.attendance || rec.attendance.length===0) return false;
  const latest = [...rec.attendance].sort((a,b)=>a.date.localeCompare(b.date)).pop();
  return !!latest && latest.status==='퇴원';
}
function isWithdrawn(s, rec){
  if(!s) return false;
  if(s.withdrawnAt) return true;
  return isWithdrawnRecord(rec || state.allRecords[s.studentId] || DATA.records[s.studentId]);
}
/* **지금 이 반에 «다니는» 학생.** 출석부·과제·클리닉처럼 «앞으로의 일»을 다루는 자리는
   전부 이것을 쓴다 — `DATA.students.filter(s=>s.classId===…)`를 직접 쓰면 퇴원생이 딸려 온다.
   ⚠ **«지난 기록» 화면은 이걸 쓰지 않는다** — 사용자가 그렇게 정했다(2026-08-26).
     지난 시험의 오답 집계·제출 현황에서 퇴원생을 빼면 **그때 20명이 봤던 시험이
     나중에 18명으로 보인다.** 과거를 고쳐 쓰는 셈이라 그 화면들은 그대로 둔다. */
/* =================== 반이 여럿인 학생 (2026-09-01 · E-1) ===================
   사용자가 말했다 — 「정규를 듣는 학생이 여러 특강에 편성되기도 하고, 정규가 아닌 학생이
   특강만 수강하기도 한다」. 특강을 «새 물건»으로 만들지 않았다 — 특강도 결국 출결을 찍고
   과제를 내고 시험을 본다. 반이 하는 일과 같으므로 **반의 갈래**로 둔다.

   🔴 **«주 반»(s.classId)은 지우지 않는다.** 리포트의 반 이름도, 명단의 기본 소속도,
     학부모께 말하는 반도 **하나여야 한다.** 코드 62곳이 그 칸을 보고 있고, 살려 두면 안 깨진다.
     배열(s.classIds)은 **«추가로 듣는 것»만** 담는다.
   🔵 **조교(assistantClassIds)와 같은 모양이다** — 배열이 없으면 한 칸을 배열로 읽으므로
     **옛 학생 문서를 한 줄도 안 고쳐도 그날부터 돈다.** */
function studentClassIds(s){
  if(!s) return [];
  const out = [];
  if(s.classId) out.push(s.classId);                     // 주 반이 언제나 맨 앞이다
  (Array.isArray(s.classIds) ? s.classIds : []).forEach(id=>{
    if(id && out.indexOf(id) < 0) out.push(id);
  });
  return out;
}
function studentMainClassId(s){ return (s && s.classId) || ''; }
/* 🔴 **«이 학생의 반»을 한 줄로 적는 말은 여기 하나뿐이다** (2026-09-01 · E-3).
   씨앗 데이터를 심고 명단을 눈으로 보고서야 보였다 — 뷰 고르개는 고쳤는데 **행의 이름표**가
   `s.classId`만 보고 특강만 듣는 학생을 「미배정」이라 부르고 있었다.
   기획서에 «「미배정」의 뜻이 바뀝니다»라고 적어 둔 그 자리다. 적어 두고도 한 곳을 빠뜨렸다.
   ⚠ 주 반이 있으면 그 이름이 먼저다 — 뒤에 «+N»으로 겹쳐 듣는 수만 덧붙인다.
     반 이름을 전부 늘어놓으면 40px 행에서 표가 무너진다(8절). */
function studentClassLabel(s, opt){
  const ids = studentClassIds(s);
  if(ids.length === 0) return '미배정';
  const main = studentMainClassId(s);
  const extra = ids.length - (main ? 1 : 0);
  if(main) return classNameOf(main) + (extra ? ' +' + extra : '');
  return (opt && opt.short) ? SPECIAL_ONLY_LABEL : ids.map(classNameOf).join(' · ');
}
/* 마우스를 올렸을 때 보이는 «전부». 잘린 것은 여기서 펴 준다. */
function studentClassTitle(s){
  const ids = studentClassIds(s);
  return ids.length ? ids.map(classNameOf).join(' · ') : '미배정';
}
function studentExtraClassIds(s){ return studentClassIds(s).slice(1); }
/* 🔴 **«이 학생을 대표하는 반»** (2026-09-01 · E-4). 주 반이 있으면 그것이고,
   **없으면 그가 듣는 첫 반**이다 — 특강만 듣는 학생에게는 그 특강이 곧 그의 반이다.
   ⚠ `studentMainClassId`와 갈라 둔다. «출결을 어느 반 것으로 세나»(main)와
     «이 학생을 뭐라고 소개하나»(primary)는 **다른 물음**이다. main은 없을 수 있어야
     `attCountedOf`가 «듣는 것이 곧 전부»로 떨어진다.
   🔵 이것이 없어서 **학부모께 가는 리포트에 반 이름이 「미배정」**으로 찍히고 있었다. */
function studentPrimaryClassId(s){ return studentClassIds(s)[0] || ''; }
function classKindOf(id){
  const c = DATA.classes.find(x=>x.id===id);
  return (c && c.kind) || '정규';                         // 갈래가 없는 옛 반은 정규다
}
function isSpecialClass(id){ return classKindOf(id) === '특강'; }
/* 특강만 듣는 학생을 명단에서 부르는 말. 🔴 **사용자가 아직 안 정했다**(2026-09-01 ·
   「아직 생각이 나지 않아」). 정해지면 **이 한 줄만** 고치면 된다. */
const SPECIAL_ONLY_LABEL = '특강만';

/* ---------- 출결이 «어느 반» 것인지 (2026-09-01 · E-1) ----------
   🔴 **반이 안 적힌 옛 줄은 «주 반» 것이다.** 지금까지 쌓인 출결은 전부 정규반에서 찍은 것이라
     그 해석이 맞고, 그래서 **옛 기록을 한 줄도 안 옮겨도 된다.** */
function attClassOf(a, mainId){ return (a && a.classId) || mainId || ''; }
function attOn(rec, date, classId, mainId){
  return ((rec && rec.attendance) || [])
    .find(a => a.date === date && attClassOf(a, mainId) === classId) || null;
}
function attOfClass(rec, classId, mainId){
  return ((rec && rec.attendance) || []).filter(a => attClassOf(a, mainId) === classId);
}
/* 🔴 **출석률·신호가 세는 줄은 «주 반» 것만이다** — 사용자가 「가르자」로 정했다 (2026-09-01).
   특강은 대개 짧고, 거기 한 번 빠진 것이 정규반 신호를 켜면 **그 신호를 아무도 안 믿게 된다.**
   ⚠ **주 반이 없는 학생(특강만 듣는다)은 «듣는 것»이 곧 전부다** — 거기서도 안 세면
     그 학생의 출석률이 영원히 «—»가 되어, 특강만 듣는 학생은 신호에서 통째로 사라진다. */
function attCountedOf(rec, s){
  const list = (rec && rec.attendance) || [];
  const main = studentMainClassId(s);
  if(!main) return list;
  return list.filter(a => attClassOf(a, main) === main);
}
/* 출석률의 정의는 **여기 하나뿐이다** — 「퇴원」을 뺀 것 중 「결석」이 아닌 비율. */
/* 🔴 **점수도 반을 안다** (2026-09-01 · E-2). 씨앗 데이터를 심고 나서야 보였다 —
   특강 시험 점수가 **정규 시험표에 섞여** 리포트에 두 번 적히고 있었다.
   출결만 갈라 놓고 점수를 안 가르면 「성적 급락」 신호가 **특강 점수 때문에** 켜진다.
   ⚠ 옛 점수는 `examId`가 없어 반을 알 수 없다 — 그때는 주 반 것으로 친다(출결과 같은 폴백). */
function scoreClassOf(sc, mainId){
  if(!sc) return mainId || '';
  const ex = sc.examId ? DATA.exams.find(e=>e.id===sc.examId) : null;
  return (ex && ex.classId) || mainId || '';
}
/* 명단·신호가 «성적 추이»로 세는 점수 — 주 반 것만. 주 반이 없으면 듣는 것이 곧 전부다. */
function scoresCountedOf(rec, s){
  const list = (rec && rec.scores) || [];
  const main = studentMainClassId(s);
  if(!main) return list;
  return list.filter(sc => scoreClassOf(sc, main) === main);
}
function attRateOf(list){
  const counted = (list || []).filter(a => a.status !== '퇴원');
  if(!counted.length) return null;
  return Math.round(counted.filter(a => a.status !== '결석').length / counted.length * 100);
}

function classRoster(classId){
  return DATA.students.filter(s=>studentClassIds(s).includes(classId) && !isWithdrawn(s));
}

/* =================== 로그인 세션 유지 (새로고침해도 로그아웃되지 않도록) =================== */
const SESSION_KEY = 'khm-session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(state.currentUser)); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
async function restoreSession(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ saved = null; }
  if(!saved || !saved.type) return;
  if(saved.type==='teacher'){
    state.currentUser = {type:'teacher'};
    state.view = 'teacher';
  } else if(saved.type==='student'){
    const found = DATA.students.find(s=>s.studentId===saved.studentId);
    if(!found){ clearSession(); return; }
    const rec = await loadRecord(found.studentId);
    if(isWithdrawn(found, rec)){ clearSession(); return; } // 로그인해 있던 중 퇴원 처리되면 다음 방문 때 자동 로그아웃
    state.currentUser = {type:'student', studentId:found.studentId, name:found.name};
    state.view = 'student';
  } else if(saved.type==='assistant'){
    const found = DATA.assistants.find(a=>a.id===saved.id);
    if(!found){ clearSession(); return; }
    /* 담당 반은 세션에 담아 두지 않고 «지금의 계정»에서 다시 읽는다 — 강사가 반을 바꿨는데
       옛 세션이 옛 반을 들고 다니면 조교가 남의 반을 계속 보게 된다. */
    state.currentUser = {type:'assistant', id:found.id, taId:found.taId, name:found.name,
                         classIds: assistantClassIds(found)};
    state.view = 'assistant';
    state.assistantTab = state.assistantTab || 'students';
    await loadAllRecordsIfNeeded();
  }
}
function logout(){ clearSession(); state.currentUser = null; goto('home'); }

/* =================== 비밀번호 변경 — 학생 · 조교 (2026-08-25 · P-1) ===================
   여태 비밀번호를 바꾸는 문은 **강사에게만** 있었다(설정 > 학생 / 조교).
   학생은 배정받은 것을 그대로 쓰거나 선생님께 부탁해야 했다.

   **학생과 조교가 이 한 덩어리를 같이 쓴다.** 하는 일이 같다 —
   «내 계정을 찾아 pw 하나를 바꾼다». 두 벌로 두면 다음에 한쪽만 고쳐진다.
   갈리는 것은 **어느 컬렉션의 어느 열쇠인가** 뿐이라 그것만 `myAccount()`가 판단한다.

   🔴 **이 화면은 비밀번호를 «비밀»로 만들지 않는다 — 그런 척해서도 안 된다.**
     로그인 자체가 `DATA.students`를 브라우저에서 대조하는 방식이고(`doStudentLogin`),
     그 목록은 **로그인 전에 이미 모두에게 내려간다**(`loadAll`). 즉 사이트를 연 사람은
     누구나 콘솔에서 전원의 비밀번호를 읽을 수 있다. **이건 이 기능의 문제가 아니라
     인증 구조의 문제다** — 워커의 «강사인지 모른다»(0-B·N-1)와 같은 뿌리다.
     처음엔 창에 「다른 곳에서 쓰는 비밀번호는 넣지 마세요」를 달았는데
     **사용자가 빼라고 해서 뺐다**(2026-08-25). 근거를 함께 말했다 —
     **「올해는 테스트용으로 몇 명만 사용하고, 내년에 본격적으로 시작할 때
     평문 비밀번호를 수정하겠다」** → P-2.
     ⚠ **그 계획이 이 결정을 떠받치고 있다.** 전제는 «쓰는 사람이 몇 명뿐»이다 —
       **신입생을 받거나 반이 늘면, P-2를 내년까지 미루는 것이 맞는지 먼저 물을 것.**
   ⚠ **감사 기록에 비밀번호를 남기지 않는다.** 「바꿨다」는 사실만 적는다. */
function myAccount(){
  const cu = state.currentUser;
  if(!cu) return null;
  if(cu.type==='student'){
    const s = DATA.students.find(x=>x.studentId===cu.studentId);
    return s ? {kind:'student', obj:s, collection:'students', key:s.studentId,
                loginId:s.studentId, name:s.name} : null;
  }
  if(cu.type==='assistant'){
    const a = DATA.assistants.find(x=>x.id===cu.id);
    return a ? {kind:'assistant', obj:a, collection:'assistants', key:a.id,
                loginId:a.taId, name:a.name} : null;
  }
  return null;   /* 강사는 여기 오지 않는다 — 설정에 자기 문이 따로 있다 */
}
function openPwChange(){ state.pwModal = true; state.pwError = null; render(); }
function closePwChange(){ state.pwModal = false; state.pwError = null; render(); }

const PW_MIN = 4;     /* 강사 비밀번호와 같은 기준 (doTeacherLogin) — 둘이 어긋나면 설명이 안 된다 */

             「올해는 테스트용으로 몇 명만 쓰고, 내년에 본격적으로 시작할 때
             평문 비밀번호를 고치겠다」는 계획을 함께 말했다 → P-2.
             ⚠ **P-2 전에 사용자가 늘어나면 이 안내를 다시 세우는 것을 «먼저» 물을 것.** */''}
        <div class="pwm-f">

/* =================== 강사가 비밀번호를 «본다» (2026-08-25 · P-3) ===================
   사용자가 「관리페이지에서 확인이 가능해?」라고 물었고, 안 된다고(재설정만 된다) 답한 뒤
   **①그대로 두기 ②보기를 넣기 ③재설정을 편하게** 셋 중 ②를 골랐다.
   ⚠ **나는 ①을 권했고 사용자가 ②를 골랐다. 그 판단을 따른다** — 자기 학원의,
     자기가 만들어 나눠 준 계정이다. 다만 아래 두 가지는 반드시 남겨 둔다.

   🔴 **P-2를 하면 이 기능은 «못 만드는 것»이 된다.** 서버 인증으로 옮기면 비밀번호를
     한 방향으로만 저장하므로 **서버도 원본을 모른다.** 그때 이 자리는 지워야 한다.
     P-2를 시작하는 사람은 **여기부터 걷어내고 시작할 것.**
   ⚠ **감사 기록은 «남기지 않는다» — 사용자가 그렇게 정했다** (2026-08-25).
     처음에는 「누가 언제 누구 것을 봤나」를 남겼는데 빼라고 했다.
     지금은 강사가 원장 한 사람뿐이라 «누가»를 물을 일이 없다.
     ⚠ **강사가 둘 이상이 되면 이 판단이 달라진다 — 그때 다시 물을 것.**
     ⚠ 다시 넣게 되더라도 **기록에 비밀번호 자체는 적지 말 것** — 감사 기록이 비밀번호 목록이 된다.
   ⚠ **한 번에 하나만 보인다**(`state.pwReveal`이 값 하나). 목록 전체가 한꺼번에 열리면
     화면을 그대로 찍어 남기기 쉬워진다. 하나씩 열게 둔다.
   ⚠ **강사만 부를 수 있다.** onclick은 콘솔에서도 부를 수 있으니 함수 안에서 막는다
     (지금 구조에선 상징적이지만, P-2 뒤에는 이 가드가 실제로 일한다). */
function pwRevealKey(kind, id){ return (kind==='student' ? 's:' : 'ta:') + id; }
function togglePwReveal(kind, id){
  if(!state.currentUser || state.currentUser.type!=='teacher'){
    showToast('강사만 볼 수 있습니다.'); return;
  }
  const key = pwRevealKey(kind, id);
  state.pwReveal = (state.pwReveal === key) ? null : key;
  render();
}
/* 「•••• [보기]」 한 줄. 학생 기본정보와 조교 목록이 같은 것을 쓴다. */
function pwRevealHTML(kind, id, pw){
  const on = state.pwReveal === pwRevealKey(kind, id);
  const has = !!(pw && String(pw).length);
  return `<span class="pwr">
    <span class="v ${on?'on':''}">${has ? (on ? escHtml(pw) : '•'.repeat(Math.min(String(pw).length, 12))) : '없음'}</span>
    ${has ? `<button class="btn q sm" onclick="togglePwReveal('${kind}','${id}')">${on?'가리기':'보기'}</button>` : ''}
  </span>`;
}

async function submitPwChange(){
  const me = myAccount();
  if(!me){ closePwChange(); return; }
  const cur  = (document.getElementById('pw-cur')||{}).value || '';
  const nw   = (document.getElementById('pw-new')||{}).value || '';
  const nw2  = (document.getElementById('pw-new2')||{}).value || '';

  /* 막는 순서가 곧 «무엇을 먼저 말해 줄 것인가»다. 지금 것이 틀렸으면 나머지는 볼 것도 없다. */
  const fail = m => { state.pwError = m; render(); };
  if(!cur)               return fail('지금 비밀번호를 입력해주세요.');
  if(me.obj.pw !== cur)  return fail('지금 비밀번호가 일치하지 않습니다.');
  if(nw.length < PW_MIN) return fail(`새 비밀번호는 ${PW_MIN}자 이상으로 정해주세요.`);
  if(nw !== nw2)         return fail('새 비밀번호를 두 번 다르게 입력하셨습니다.');
  if(nw === cur)         return fail('지금 쓰고 있는 것과 다른 비밀번호로 정해주세요.');

  /* ⚠ **메모리를 먼저 고치고 저장에 실패하면 «바뀐 줄 알았는데 안 바뀐» 상태가 된다.**
     저장이 성공한 뒤에 메모리를 고친다 — 실패하면 옛 비밀번호로 계속 들어올 수 있어야 한다. */
  const next = {...me.obj, pw: nw};
  const ok = await dbSetDoc(me.collection, me.key, next);
  if(ok === null) return fail('저장하지 못했습니다. 잠시 뒤 다시 시도해주세요.');

  me.obj.pw = nw;
  /* ⚠ 세션에는 비밀번호가 없다(`saveSession`은 이름·아이디만 담는다). 그래서 다시 로그인할
     필요가 없다 — 여기서 로그아웃시키면 «바꿨더니 쫓겨났다»가 된다. */
  await logAudit('비밀번호 변경', me.kind==='student' ? me.key : '', me.name||'',
    me.kind==='student' ? '학생 본인이 변경' : '조교 본인이 변경');
  state.pwModal = false;
  state.pwError = null;
  showToast('비밀번호를 바꿨습니다.');
  render();
}

async function addClass(){
  const name = document.getElementById('new-cname').value.trim();
  const schedule = document.getElementById('new-cschedule').value.trim();
  const period = document.getElementById('new-cperiod').value.trim();
  if(!name){ showToast('반 이름을 입력해주세요.'); return; }
  /* 갈래 (2026-09-01 · E-1). 특강도 «반»이다 — 출결·과제·성적·진도를 그대로 물려받는다.
     다른 점은 «누가 듣는가»(여럿을 겹쳐 듣는다)와 «출석률을 따로 센다» 둘뿐이다. */
  const kind = (document.getElementById('new-ckind') || {}).value || '정규';
  const cls = {id:'c'+Date.now(), name, schedule, period, status:'진행중', kind};
  DATA.classes.push(cls);
  await dbSetDoc('classes', cls.id, cls);
  document.getElementById('new-cname').value='';
  document.getElementById('new-cschedule').value='';
  document.getElementById('new-cperiod').value='';
  showToast('반이 추가되었습니다.');
  render();
}
async function toggleClassStatus(cid){
  const c = DATA.classes.find(c=>c.id===cid);
  if(!c) return;
  c.status = c.status==='진행중' ? '종료' : '진행중';
  await dbSetDoc('classes', c.id, c);
  render();
}
async function deleteClass(cid){
  /* 이 반만 맡은 조교는 지우는 순간 «맡은 반이 없는» 계정이 된다. 지우기 전에 말해 준다 —
     조교 화면이 통째로 비면 강사는 그 이유를 알 길이 없다 (시험지 삭제와 같은 판단). */
  const orphan = DATA.assistants.filter(a=>{
    const ids = assistantClassIds(a);
    return ids.includes(cid) && ids.length===1;
  });
  if(!confirm('이 반을 삭제할까요? (배정된 학생의 반 정보는 유지되나 표시가 [삭제된 반]으로 바뀝니다)'
    + (orphan.length ? `\n\n⚠ ${orphan.map(a=>a.name).join(', ')} 조교는 이 반만 맡고 있어 `
        + `맡은 반이 없어집니다. 설정 > 조교에서 다른 반을 지정해 주세요.` : ''))) return;
  DATA.classes = DATA.classes.filter(c=>c.id!==cid);
  await dbDeleteDoc('classes', cid);
  showToast('삭제되었습니다.');
  render();
}
function classNameOf(cid){
  const c = DATA.classes.find(c=>c.id===cid);
  return c ? c.name : (cid ? '[삭제된 반]' : '미배정');
}
/* 조교가 맡는 반은 여럿이다 (2026-08-11). 예전에는 `classId` 하나였고 바꿀 문도 없었다.
   옛 계정은 그 필드만 갖고 있으므로 **읽을 때** 맞춰 준다 — 한꺼번에 옮기지 않는 이유는
   「담당 반 변경」을 저장하는 순간 저절로 새 모양이 되기 때문이다 (그때 옛 필드는 지운다).
   읽는 곳이 다섯이라(로그인·세션 복원·명단·학생 상세 권한·설정 목록) 함수 하나로 모은다 —
   두 벌이면 한쪽만 고쳐지고, 그러면 «명단엔 보이는데 상세는 막히는» 학생이 생긴다. */
function assistantClassIds(a){
  if(!a) return [];
  if(Array.isArray(a.classIds)) return a.classIds.filter(Boolean);
  return a.classId ? [a.classId] : [];
}
function assistantClassLabel(ids){
  if(!ids || ids.length===0) return '없음';
  return ids.map(classNameOf).join(' · ');
}
// 반 일정 문자열(예: "월,수,금 7시~9시")에서 요일 글자를 찾아 요일 인덱스 배열로 변환.
const WEEKDAY_MAP = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function parseScheduleDays(schedule){
  if(!schedule) return [];
  const days = [];
  for(const ch of schedule){
    if(WEEKDAY_MAP[ch]!==undefined && !days.includes(WEEKDAY_MAP[ch])) days.push(WEEKDAY_MAP[ch]);
  }
  return days;
}
// 반 일정을 기준으로 최근(및 며칠 앞) 수업일을 최신순으로 생성한다. "차시" 번호 없이 날짜만 다룬다.
function generateClassSessionDates(schedule, count){
  const days = parseScheduleDays(schedule);
  if(days.length===0) return [];
  const result = [];
  const d = new Date();
  d.setDate(d.getDate()+2); // 다가오는 수업일도 1~2개 미리 보이도록
  while(result.length < count){
    if(days.includes(d.getDay())) result.push(ymdLocal(d));   // getDay()가 로컬이므로 날짜도 로컬로
    d.setDate(d.getDate()-1);
  }
  return result;
}
/* quizClassLabel은 지웠다 — 데일리퀴즈가 «반에 배포하는 것»이 아니게 되면서 쓰는 곳이 없어졌다. */

/* =================== 퇴원 처리 · 재원 복귀 (2026-08-26 · W-1) ===================
   🔴 **삭제와 헷갈리지 말 것.** 사용자가 이 둘을 갈라 달라고 해서 만든 것이다 —
   **「그냥 삭제랑 별도로 정보는 남겨두고 퇴원처리만 하는 기능이 필요해」**.
   | | 지우는 것 | 되돌리기 |
   |---|---|---|
   | **퇴원** | **아무것도 안 지운다** — 계정·성적·출결·과제가 전부 그대로다 | **된다**(재원 복귀) |
   | **삭제** | 학생 문서와 기록이 함께 사라진다 | **안 된다** |

   ⚠ **반 배정을 그대로 둔다**(`classId`를 안 지운다) — 「어느 반이었나」가 기록의 일부다.
     대신 `classRoster`가 걸러서 출석부·과제 격자에는 안 뜬다.
   ⚠ **되돌릴 때 `withdrawnAt`을 지운다**(빈 문자열이 아니라 삭제). `isWithdrawn`이
     «값이 있나»로 보므로 빈 문자열을 넣으면 재원인데 퇴원으로 읽힐 여지가 생긴다.
   ⚠ **감사 기록에 남긴다** — 학적은 나중에 「언제 그만뒀더라」를 반드시 다시 묻는 일이다. */
async function withdrawStudent(sid){
  const s = DATA.students.find(x=>x.studentId===sid);
  if(!s) return;
  const date = (document.getElementById('wd-date')||{}).value || todayStr();
  const reason = ((document.getElementById('wd-reason')||{}).value || '').trim();
  /* 저장이 성공한 «뒤에» 메모리를 고친다 — 실패했는데 화면만 퇴원으로 바뀌면
     다음 새로고침에 되살아나서 «퇴원시킨 줄 알았던» 학생에게 알림이 나간다 (P-1과 같은 규칙). */
  const next = Object.assign({}, s, { withdrawnAt: date, withdrawnReason: reason });
  await dbSetDoc('students', sid, next);
  s.withdrawnAt = date;
  s.withdrawnReason = reason;
  await logAudit('퇴원 처리', sid, s.name, date + (reason ? ' · ' + reason : ''));
  state.stuEditId = null;
  showToast(s.name + ' 학생을 퇴원 처리했습니다.');
  render();
}
async function restoreStudent(sid){
  const s = DATA.students.find(x=>x.studentId===sid);
  if(!s) return;
  const next = Object.assign({}, s);
  delete next.withdrawnAt;
  delete next.withdrawnReason;
  await dbSetDoc('students', sid, next);
  delete s.withdrawnAt;
  delete s.withdrawnReason;
  await logAudit('재원 복귀', sid, s.name, '');
  showToast(s.name + ' 학생을 재원으로 되돌렸습니다.');
  render();
}
/* 명단·신호의 「퇴원」 배지 옆에 붙는 한 줄. 옛 데이터는 날짜를 모른다. */
function withdrawnWhy(s){
  if(!s || !s.withdrawnAt) return '출결 기록의 마지막 상태';
  return '퇴원 ' + s.withdrawnAt + (s.withdrawnReason ? ' · ' + s.withdrawnReason : '');
}
/* =================== 변경 이력(감사 로그) =================== */
// 강사뿐 아니라 조교도 성적/출석을 고칠 수 있게 되면서, 누가 언제 뭘 바꿨는지
// 기록이 없으면 책임 소재를 알 수 없다. 성적·출석·학생정보처럼 민감한 변경에만 남긴다.
function actorLabel(){
  const cu = state.currentUser;
  if(!cu) return '알 수 없음';
  if(cu.type==='teacher') return '김하현T';
  if(cu.type==='assistant') return (cu.name||'조교') + ' 조교';
  return cu.name || '알 수 없음';
}
async function logAudit(action, studentId, studentName, detail){
  const entry = {
    id: 'log' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    at: new Date().toISOString(),
    actor: actorLabel(),
    actorType: state.currentUser ? state.currentUser.type : 'unknown',
    action, studentId: studentId || '', studentName: studentName || '', detail: detail || ''
  };
  DATA.auditLog.unshift(entry);
  await dbSetDoc('auditlog', entry.id, entry);
}
function studentNameOf(sid){

// 오답숙제 기록 등)를 그대로 유지한 채 이름/학년/학교/전화번호/반만 수정한다.
async function updateStudentInfo(sid){
  const s = DATA.students.find(x=>x.studentId===sid);
  if(!s) return;
  const name = document.getElementById('info-sname').value.trim();
  const pw = document.getElementById('info-spw').value.trim();
  const grade = document.getElementById('info-sgrade').value;
  const school = document.getElementById('info-sschool').value.trim();
  const parentPhone = document.getElementById('info-sparentphone').value.trim();
  const phone = document.getElementById('info-sphone').value.trim();
  const classId = document.getElementById('info-sclass').value;
  if(!name){ showToast('이름은 필수입니다.'); return; }
  /* 추가로 듣는 반 (2026-09-01 · E-1). 🔴 **주 반과 같은 것은 담지 않는다** —
     담아 두면 «주 반을 바꿀 때» 옛 주 반이 추가 수강으로 남아 조용히 두 번 세어진다. */
  const extra = DATA.classes.map(c=>c.id).filter(id=>{

    + (extra.length ? ' · 추가 수강 ' + extra.map(classNameOf).join('·') : ''));
  showToast('학생 정보가 저장되었습니다.');
  render();
}

/* =================== 과제(숙제) — 반 단위 등록, 데일리퀴즈와 동일한 구조 =================== */
/* 과제 등록 폼은 두 화면에 있다 (반 관리 > 수업 기록 > 과제 · 수업 > 과제).
   폼을 복제하는 대신 id 접두사만 받는다 — 등록 로직이 두 벌이 되면 한쪽만 고쳐진다.
   접두사가 다르므로 두 화면이 같이 그려져도 getElementById가 엉뚱한 칸을 읽지 않는다. */
async function addHomework(prefix, sessionDate){
  const p = prefix || '';
  const classId = document.getElementById(p+'hw-class').value;
  const title = document.getElementById(p+'hw-title').value.trim();
  const description = document.getElementById(p+'hw-desc').value.trim();
  const dueDate = document.getElementById(p+'hw-due').value;
  /* 🔴 **낸 날은 «오늘»이 아니라 «그 수업 날짜»다** (2026-09-01 · C-18에서 고쳤다).
     예전에는 무조건 `todayStr()`이었다. 수업 화면에서 지난 수업을 열어 과제를 적으면
     낸 날이 오늘로 박혀 **그 수업 날짜가 아닌 열에 서고**, 바로 아래 「이 수업에서 낸 과제」
     목록(낸 날로 거른다)에도 안 나타났다. C-16이 낸 날을 열 머리로 올린 뒤로는
     그 어긋남이 화면에 그대로 보인다. */
  const createdAt = sessionDate || todayStr();
  if(!title){ showToast('과제명을 입력해주세요.'); return; }
  /* ⚠ 마감이 낸 날보다 앞설 수는 없다 (C-17과 같은 규칙). 같은 날은 괜찮다. */
  if(dueDate && dueDate < createdAt){
    showToast(`마감일(${dueDate})이 수업 날짜(${createdAt})보다 앞섭니다. 날짜를 확인해 주세요.`);
    return;
  }
  const hw = {id:'hw'+Date.now(), classId, title, description, dueDate, createdAt};
  DATA.assignments.unshift(hw);
  await dbSetDoc('assignments', hw.id, hw);
  document.getElementById(p+'hw-title').value='';
  document.getElementById(p+'hw-desc').value='';
  document.getElementById(p+'hw-due').value='';
  showToast('과제가 등록되었습니다.');
  render();
}
async function deleteHomework(hwId){
  /* 제출 사진이 몇 장 딸려 나가는지 지우기 «전»에 말해 준다 — 드라이브에서도 지워진다. */
  await loadAllRecordsIfNeeded();
  const shots = [];
  for(const sid in state.allRecords) hwState(state.allRecords[sid], hwId).photos.forEach(p=>{
    if(p.fileId) shots.push(p.fileId);
  });
  if(!confirm('이 과제를 삭제할까요? 학생들의 제출/완료 표시도 함께 사라집니다.'
    + (shots.length ? `\n\n제출된 사진 ${shots.length}장도 드라이브에서 지워집니다.` : ''))) return;
  DATA.assignments = DATA.assignments.filter(a=>a.id!==hwId);
  await dbDeleteDoc('assignments', hwId);
  /* kv에서만 지우면 드라이브에 파일이 남아 쌓인다 (강의자료에서 겪은 것과 같다). */
  shots.forEach(id=>deleteFromDrive(id));
  render();
}
/* 과제 상태를 옮기는 문은 여기 넷뿐이다. 전부 «읽어 온 그 객체»를 제자리에서 고친다
   (saveRecord가 다른 객체를 막는다 — 2026-08-12의 사고 이후로 그렇다). */
async function setHwState(studentId, hwId, patch){
  const rec = await loadRecord(studentId);
  const prev = hwState(rec, hwId);
  rec.assignmentsDone[hwId] = { ...prev, ...patch };
  delete rec.assignmentsDone[hwId].legacy;
  await saveRecord(studentId);
  /* ⚠ **강사 화면은 `state.allRecords`를 본다 — `DATA.records`가 아니다.** 둘은 각각
     따로 읽어 온 «다른 객체»라, 여기서 되꽂지 않으면 강사가 수락을 눌러도 자기 화면은
     그대로다 (버튼이 안 먹는 것처럼 보인다). deleteExam도 같은 이유로 되꽂는다. */
  state.allRecords[studentId] = rec;
  return rec;
}
/* 학생이 낸다. 사진은 이미 드라이브에 올라가 있고 여기서는 «주소»만 기록에 박는다. */
async function submitHomework(studentId, hwId){
  const staged = (state.hwPhotos && state.hwPhotos[hwId]) || [];
  if(staged.some(p=>p.uploading)){ showToast('사진을 올리는 중입니다. 잠시만 기다려주세요.'); return; }
  /* ⚠ **올리는 중에 쓰던 부스러기를 기록에 넣지 않는다.** 칸 하나가 `{uploading, previewUrl}`로
     시작해 거기에 url·fileId가 «얹히는» 구조라, 그대로 저장하면 **죽은 blob 주소**(previewUrl)가
     학생 기록에 영영 남는다. 실제로 그렇게 저장된 것을 배포본에서 봤다. 둘만 골라 담는다. */
  const photos = staged.filter(p=>p && p.url).map(p=>({url:p.url, fileId:p.fileId}));
  if(photos.length===0){ showToast('사진을 한 장 이상 올려주세요.'); return; }
  /* 반려된 것을 다시 낼 때 옛 사진은 드라이브에서 지운다 — 안 지우면 파일이 쌓이기만 한다. */
  const old = hwState(await loadRecord(studentId), hwId).photos;
  await setHwState(studentId, hwId, {
    status: HW_SUBMITTED, photos, submittedAt: todayStr(),
    reason: '', decidedAt: '', by: '', onSite: false
  });
  old.forEach(p=>{ if(p.fileId && !photos.some(n=>n.fileId===p.fileId)) deleteFromDrive(p.fileId); });
  if(state.hwPhotos) delete state.hwPhotos[hwId];
  showToast('제출했습니다. 강사·조교가 확인하면 완료로 바뀝니다.');
  render();
}
/* 강사·조교가 수락한다. onSite면 «온라인으로 안 냈지만 현장에서 보여 준» 경우다. */
async function approveHomework(studentId, hwId, onSite){
  const s = DATA.students.find(x=>x.studentId===studentId);
  await setHwState(studentId, hwId, {
    status: HW_APPROVED, decidedAt: todayStr(), by: actorLabel(),
    onSite: !!onSite, reason: ''
  });
  const hw = DATA.assignments.find(a=>a.id===hwId);
  logAudit(onSite ? '과제 현장 확인' : '과제 수락', studentId, s?s.name:'',
    (hw?hw.title:'과제'));
  showToast(onSite ? '현장 확인으로 완료 처리했습니다.' : '수락했습니다.');
  render();
}
/* 「보완 필요」로 통과시킨다 (2026-09-01 · C-15).
   ⚠ **사유를 안 받는다** — 학생에게 «다시 하라»고 시키는 것이 아니라 강사가 «미비했다»를
     적어 두는 것이다. 다시 시킬 것이면 그것은 반려다. */
async function partialHomework(studentId, hwId){
  const s = DATA.students.find(x=>x.studentId===studentId);
  await setHwState(studentId, hwId, {
    status: HW_PARTIAL, decidedAt: todayStr(), by: actorLabel(), onSite: false, reason: ''
  });
  const hw = DATA.assignments.find(a=>a.id===hwId);
  logAudit('과제 보완 필요', studentId, s?s.name:'', (hw?hw.title:'과제'));
  showToast('「보완 필요」로 표시했습니다. 제출은 한 것으로 셉니다.');
  render();
}
/* 반려한다. 사유를 반드시 받는다 — 이유 없이 되돌리면 학생은 뭘 고쳐야 할지 모른다. */
async function rejectHomework(studentId, hwId){
  const reason = (document.getElementById('hw-reject-'+hwId+'-'+studentId)||{}).value;
  const r = (reason||'').trim();
  if(!r){ showToast('반려 사유를 적어주세요. 학생 화면에 그대로 보입니다.'); return; }
  const s = DATA.students.find(x=>x.studentId===studentId);
  await setHwState(studentId, hwId, {
    status: HW_REJECTED, decidedAt: todayStr(), by: actorLabel(), reason: r, onSite: false
  });
  const hw = DATA.assignments.find(a=>a.id===hwId);
  logAudit('과제 반려', studentId, s?s.name:'', (hw?hw.title:'과제') + ' — ' + r);
  state.hwRejectOpen = null;
  showToast('반려했습니다. 학생 화면에 사유가 보입니다.');
  render();
}
/* 잘못 누른 것을 되돌린다. 제출물(사진)은 그대로 두고 «판단»만 지운다 —
   사진까지 지우면 학생이 다시 올려야 한다. */
async function undoHwDecision(studentId, hwId){
  const cur = hwState(await loadRecord(studentId), hwId);
  await setHwState(studentId, hwId, {
    status: cur.photos.length ? HW_SUBMITTED : HW_NONE,
    decidedAt: '', by: '', reason: '', onSite: false
  });
  render();
}

async function addAttendance(){
  const sid = state.teacherSelectedStudent;
  if(!sid){ showToast('학생을 선택해주세요.'); return; }
  const date = document.getElementById('att-date').value;
  const status = document.getElementById('att-status').value;
  if(!date){ showToast('날짜를 입력해주세요.'); return; }
  const rec = await loadRecord(sid);
  /* 어느 반 것인지 적는다 (2026-09-01 · E-1). 여기는 «그 학생»의 화면이라 반을 고르지 않으므로
     주 반으로 적는다 — 주 반이 없으면(특강만 듣는 학생) 그가 듣는 첫 반이다. */
  const stu = DATA.students.find(x=>x.studentId===sid);
  rec.attendance.push({date, status, classId: studentClassIds(stu)[0] || ''});
  rec.attendance.sort((a,b)=>a.date.localeCompare(b.date));
  await saveRecord(sid);
  await logAudit('출석 기록', sid, studentNameOf(sid), `${date} ${status}`);
  showToast('출석이 기록되었습니다.');

}
async function deleteAttendance(sid, idx){
  if(!confirm('이 출석 기록을 삭제할까요?')) return;
  const rec = await loadRecord(sid);
  const removed = rec.attendance[idx];
  rec.attendance.splice(idx,1);
  await saveRecord(sid);
  if(removed) await logAudit('출석 삭제', sid, studentNameOf(sid), `${removed.date} ${removed.status}`);
  render();
}

function unseenCount(key, currentCount){
  const seen = parseInt(localStorage.getItem(`khm-${key}-seen`))||0;
  return Math.max(0, currentCount - seen);
}
function markSeen(key, currentCount){
  localStorage.setItem(`khm-${key}-seen`, String(currentCount));
}
function unseenConsultCount(){

}
function markConsultsSeen(){

}

/* =================== 알림 벨 =================== */
/* 채팅은 «학생마다» 안 읽은 것이 따로 있다. 상담·질문처럼 한 숫자로 묶을 수 없어서
   학생별로 세고, 벨에는 그 합을 올린다.
   **내가 보낸 말은 세지 않는다** — 안 그러면 답장할 때마다 «안 읽음»이 늘어난다. */
function chatUnread(sid){
  const chat = DATA.chats[sid];
  if(!chat) return 0;
  return unseenCount('chat:'+sid, chat.filter(m=>m.from==='student').length);
}
function markChatSeen(sid){
  const chat = DATA.chats[sid] || [];
  markSeen('chat:'+sid, chat.filter(m=>m.from==='student').length);
}
/* 채팅은 학생마다 문서가 따로다(kv/chat:{studentId}). «누가 말을 걸었나»를 알려면
   한 번은 전부 읽어야 한다 — 기록(loadAllRecordsIfNeeded)과 같은 방식이다. */
async function loadAllChatsIfNeeded(){
  if(state.allChatsLoaded || state.allChatsLoading) return;
  state.allChatsLoading = true;
  const entries = await Promise.all(DATA.students.map(async s =>
    [s.studentId, DATA.chats[s.studentId] || await dbGet('chat:'+s.studentId, [])]));
  entries.forEach(([sid, chat]) => { DATA.chats[sid] = chat; });
  state.allChatsLoading = false;
  state.allChatsLoaded = true;
  render();
}

/* «확인 대기»는 몇 건인가 — 학생이 냈고 아직 강사가 안 본 것.
   ⚠ 기록을 아직 안 실었으면 0이다. 렌더 중에 부르므로 여기서 불러오지는 않는다
      (loadAllRecordsIfNeeded가 끝나면 스스로 render를 부른다 — 그때 숫자가 채워진다). */
function hwWaitingInClass(classId){
  if(!state.allRecordsLoaded) return 0;
  const hws = DATA.assignments.filter(a=>a.classId===classId);
  if(!hws.length) return 0;
  return classRoster(classId).reduce((n,s)=>{
    const rec = state.allRecords[s.studentId];
    return n + (rec ? hws.filter(a=>hwState(rec, a.id).status===HW_SUBMITTED).length : 0);
  }, 0);
}
function hwWaitingTotal(){
  return DATA.classes.reduce((n,c)=>n + hwWaitingInClass(c.id), 0);
}
/* 벨에서 누르면 «제일 밀린 반»의 과제 자리로 곧장 간다.
   예전에는 반 → 수업 기록 → 날짜 → 과제 → 확인하기로 다섯 번을 들어가야 했다. */
function gotoHwWaiting(){
  const worst = DATA.classes
    .map(c=>({id:c.id, n:hwWaitingInClass(c.id)}))
    .sort((a,b)=>b.n-a.n)[0];
  if(worst && worst.n > 0) state.classHubId = worst.id;
  state.teacherTab = 'classhub';
  state.classHubTab = 'homework';
  state.classHubDate = '';
  /* 대기가 있는 첫 과제를 펴 둔다 — 열자마자 할 일이 보여야 한다. */
  const rosters = classRoster(state.classHubId);
  const first = DATA.assignments.filter(a=>a.classId===state.classHubId)
    .find(a=>rosters.some(s=>{
      const rec = state.allRecords[s.studentId];
      return rec && hwState(rec, a.id).status===HW_SUBMITTED;
    }));
  state.homeworkDetailId = first ? first.id : null;
  state.hwRejectOpen = null;
}
function teacherNotifItems(){
  const chatN = DATA.students.reduce((n,s)=>n + chatUnread(s.studentId), 0);
  return [
    /* ⚠ 상담·질문처럼 «본 개수»로 셀 수 없다. 그것들은 늘기만 하는 목록이라
       watermark가 맞지만, 과제 제출은 **수락하면 줄어든다.**
       채팅과 같은 길로 간다 — 지금 대기 중인 수를 그대로 들고 오고(keepUnseen),
       벨을 눌렀다고 지우지 않는다. 확인해서 처리해야 사라진다. */
    {key:'hwsub', label:'과제 제출 확인 대기', count:0, unseen: hwWaitingTotal(),
     keepUnseen:true, gotoCode:"gotoHwWaiting();"},
    /* 🔵 **「오답 문항 검토」가 여기로 왔다** (2026-09-01 · C-22 · 사용자가 시켰다).
       수업 화면 왼쪽의 「오늘 남은 일」에 있던 넷 중 **셋(상담·질문·클리닉)은 이미 벨에 있었다** —
       한 가지만 갈 곳이 없어서 그 상자가 통째로 남아 있었던 셈이다. 그 하나를 여기 옮기고
       상자를 걷었다. ⚠ 과제 제출과 같은 종류다 — **검토하면 줄어드는 수**라 «본 개수»로
       셀 수 없다(watermark가 안 맞는다). 그래서 `keepUnseen`이다. */
    {key:'review', label:'오답 문항 검토', count:0,
     unseen: DATA.problemBank.filter(b=>b.status!=='approved').length,
     keepUnseen:true, gotoCode:"goTeacherTab('review');"},
    {key:'consult', label:'새 상담 신청', count: DATA.consults.length, gotoCode:"state.teacherTab='settings'; state.settingsSubTab='consults';"},
    {key:'qna', label:'새 질문', count: DATA.qnas.length, gotoCode:"state.teacherTab='qna';"},
    {key:'clinic', label:'새 클리닉 신청', count: DATA.clinics.length, gotoCode:"state.teacherTab='clinic';"},
    /* 누르면 채팅 탭으로만 간다. «읽음»은 그 학생 대화를 실제로 열 때 찍힌다 —
       벨을 눌렀다고 읽은 것이 아니다. */
    {key:'chat', label:'새 채팅', count:0, unseen:chatN, keepUnseen:true, gotoCode:"state.teacherTab='chat';"},
  ];

function studentNotifItems(sid){

     학생에게 그 과제는 없는 것이 된다. */
  const myClassIds = studentClassIds(me);

    {key:'notice', label:'새 공지', count: DATA.notices.length, gotoCode:"state.studentTab='notice';"},
    /* 반대 방향도 같다 — 선생님이 답을 보내면 학생 벨에 뜬다.
       학생은 자기 대화 하나만 보므로 여기서는 곧장 셀 수 있다. */
    {key:'chat:'+sid, label:'선생님 답장', count: (DATA.chats[sid]||[]).filter(m=>m.from==='teacher').length,
