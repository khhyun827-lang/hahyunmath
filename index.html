              : (heavy === 1 || (st.vidPct !== null && st.vidPct < R.vidWarn)) ? 'y' : 'g';

  /* 위험도 점수 — 등급을 «정하는» 값이 아니라 등급 «안에서 줄 세우는» 값이다.
     점수로 등급까지 정하면 임계값이 두 벌이 되고, 어느 쪽이 진짜인지 알 수 없게 된다. */
  let score = 0;
  if(st.attPct !== null) score += Math.max(0, 100 - st.attPct) * 0.8;
  score += absent * 6;
  score += Math.max(0, st.drop) * 2;
  score += st.wrongLeft * 4;
  if(st.vidPct !== null) score += Math.max(0, 80 - st.vidPct) * 0.5;
  if(st.hwTotal) score += (st.hwTotal - st.hwDone) * 3;

  return { grade, rules, score: Math.min(99, Math.round(score)) };
}

/* 명단의 신호 열 — 한 줄(40px)에 들어가야 하므로 규칙 «이름»만 잇는다.
   근거 숫자까지 보려면 신호 화면으로 간다. */
function rosterSignal(st){
  if(st.withdrawn) return ['gone', '퇴원', withdrawnWhy(st.student)];
  const sg = signalOf(st);
  if(!sg) return null;
  const g = SIGNAL_GRADE[sg.grade];
  return [g.badge, g.label, sg.rules.map(r=>r.name).join(' · ')];
}

/* ds.js의 spark()/dots()를 옮겨 왔다. ds.js는 예시 학생 22명이 들어 있어 실서비스에 로드하지 않는다. */
function rosterSpark(vals, w, h){
  if(vals.length<2) return '<span class="muted" style="font-size:11px;">—</span>';
  w = w || 56; h = h || 20;
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx-mn) || 1;
  let d = '';
  vals.forEach((v,i)=>{
    const x = (w * i / (vals.length-1)).toFixed(1);
    const y = (h - 2 - ((v-mn)/r) * (h-6)).toFixed(1);
    d += (i ? 'L' : 'M') + x + ' ' + y;
  });
  const down = vals[vals.length-1] < vals[0];
  const last = vals[vals.length-1], delta = Math.abs(last - vals[0]);
  return `<svg width="${w}" height="${h}" style="vertical-align:-6px;"><path d="${d}" fill="none" stroke="${down?'#B03A2E':'#3F7A4D'}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`
    + `<span class="mono" style="font-size:12px;margin-left:5px;">${last}</span>`
    + `<span class="mono ${down?'warn':'up'}" style="font-size:10.5px;margin-left:3px;">${down?'▼':'▲'}${delta}</span>`;
}
function rosterDots(att8){
  if(!att8.length) return '<span class="muted" style="font-size:11px;">—</span>';
  return '<span class="dots">' + att8.map(a=>
    `<i class="${attStatusClass(a.status)}" title="${a.date} ${a.status}"></i>`).join('') + '</span>';
}

/* 화면과 엑셀이 같은 명단을 봐야 한다. 필터·정렬을 두 군데 적으면 반드시 어긋난다. */
function rosterModel(){
  const stats = {};
  DATA.students.forEach(s=>{ stats[s.studentId] = rosterStats(s); });

  const view = state.rosterView || 'all';
  const classId = view.indexOf('class:')===0 ? view.slice(6) : null;

  // 퇴원 학생은 「퇴원」 뷰에서만 보인다. 재원 명단에 섞이면 모든 숫자가 흐려진다.
  const pool = DATA.students.filter(s=>{
    const st = stats[s.studentId];
    if(view==='gone') return st.withdrawn;
    if(st.withdrawn) return false;
    /* 🔴 **「미배정」은 «반이 하나도 없는» 학생이다** (2026-09-01 · E-1).
       특강만 듣는 학생을 여기 두면 «아직 안 넣은 학생»으로 읽혀 매번 넣으려 들게 된다. */
    if(view==='unassigned') return studentClassIds(s).length === 0;
    if(view==='specialonly') return !s.classId && studentClassIds(s).length > 0;
    if(classId) return studentClassIds(s).includes(classId);
    return true;
  });

  const f = state.rosterFlags || {};
  const flagged = {
    att:   s => stats[s.studentId].attPct!==null && stats[s.studentId].attPct<90,
    wrong: s => stats[s.studentId].wrongLeft>0,
    hw:    s => stats[s.studentId].hwTotal>0 && stats[s.studentId].hwDone<stats[s.studentId].hwTotal
  };
  /* 🔴 **띄어쓰면 «둘 다 만족»이다** (2026-09-01 · C-14 · 사용자가 짚었다).
     사용자의 말 — 「**건대부고 고1 이 두가지 필터를 이용해서 보고싶을때도 있는데
       학년과 학교 동시에 검색이 안돼**」. 흠이 둘이었다.
     ① **친 것을 통째로 한 낱말로 봤다.** 칸마다 `includes('건대부고 고1')`을 돌렸으니
        어느 한 칸에도 그 문자열이 통째로 들어 있지 않아 **아무도 안 걸렸다.**
     ② **「학년」이 아예 검색 대상에 없었다** — 「고1」은 혼자 쳐도 원래부터 안 걸렸다.
     이제 **띄어쓰기로 잘라 낱말마다** 본다 —
       · 낱말끼리는 **AND**: 「건대부고 고1」이면 둘 다 만족해야 한다
       · 한 낱말 안에서는 **OR**: 이름·아이디·학교·학년·반 어디든 걸리면 된다
     ⚠ **한 낱말만 칠 때의 동작은 예전과 똑같다.** 넓히기만 했지 좁힌 것이 없다.
     ⚠ 엑셀(`exportRosterExcel`)도 이 모델을 보므로 **화면과 같은 명단이 나간다.** */
  const terms = (state.rosterQuery||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  let rows = pool.filter(s=>{
    for(const k in flagged){ if(f[k] && !flagged[k](s)) return false; }
    if(!terms.length) return true;
    const fields = [s.name, s.studentId, s.school, s.grade, classNameOf(s.classId)]
      .map(v => String(v||'').toLowerCase());
    return terms.every(t => fields.some(v => v.includes(t)));
  });

  const sort = state.rosterSort || 'name';
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'', 'ko');
  // 기록이 없는 학생을 «출석률 0%»로 두면 맨 위로 올라와 실제 위험을 가린다. 뒤로 보낸다.
  const cmp = {
    name:  byName,
    att:   (a,b)=>((stats[a.studentId].attPct ?? 999) - (stats[b.studentId].attPct ?? 999)) || byName(a,b),
    drop:  (a,b)=>(stats[b.studentId].drop - stats[a.studentId].drop) || byName(a,b),
    wrong: (a,b)=>(stats[b.studentId].wrongLeft - stats[a.studentId].wrongLeft) || byName(a,b)
  }[sort] || byName;
  rows = rows.slice().sort(cmp);

  return { stats, view, classId, pool, rows, flagged };
}

const ROSTER_SORTS = [['name','이름순'], ['att','출석률 낮은 순'], ['drop','성적 하락 큰 순'], ['wrong','오답 미제출 많은 순']];
const ROSTER_FLAGS = [['att','출결 주의'], ['wrong','오답 미제출'], ['hw','과제 미제출']];

/* 🔴 **학생 명단 — 「반 › 학생」이 이 화면의 «유일한» 자리다** (2026-09-01 · C-13).
   상단의 「명단」 탭은 없앴다. 사용자의 말 — 「여기 이식하고나면 명단탭은 없어도 될 것같아」.
   ⚠ **화면을 한 벌 더 만들지 않는다** — 검색·거르개·정렬·일괄 처리·엑셀이 전부 여기 있다.
     두 벌로 두면 한쪽만 고쳐지고 둘이 조용히 어긋난다(과제 목록에서 이미 겪은 일이다).
   ⚠ **문도 두 개 만들지 않는다.** 문이 둘이던 동안 사용자가 그것을 알아챘다 —
     「반-학생탭이 검색창이 명단탭의 검색창이랑 이어지는 것 같아」. `state.rosterQuery` 하나를
     두 화면이 나눠 쓰고 있었다. 이제 화면이 하나라 샐 곳이 없다.

   🔵 **모집단은 «반»이 아니라 고르개가 정한다** (2026-09-01 · 사용자가 시켰다).
   사용자의 말 — 「**반-학생탭은 명단 탭이랑 동일하게 … 학생전체로 볼 수 있도록 해줘,
     그리고 위에서 필터로 반을 고를 수 있도록**」. 까닭도 함께 말했다 —
   「**시험기간이나 이럴때 반별학생이 아니라 «학교별»로 학생목록을 검색해야 하는 경우도 있기때문에**」.
   그 검색은 반 안에 갇혀 있으면 성립하지 않는다 — 한 학교 아이들이 여러 반에 흩어져 있다.
   🔴 **그래서 «반에 얹힌 판»이라는 갈래 자체가 없어졌다** (C-13). 몇 시간 만에 두 번 고친 자리다 —
     ① 반 안에서는 `rosterView`를 그 반으로 못박고 고르개를 감춘다(C-3)
     ② 고르개는 띄우되 «이 반 밖을 보고 있습니다» 알림을 단다(C-12)
     ③ **반 껍데기를 아예 벗는다 — 이 화면 하나만 남는다**(C-13)
   ①②가 진 짐은 전부 **«반 머리와 명단이 서로 다른 말을 한다»**는 한 가지였다.
   반 머리를 치우자 그 짐이 통째로 사라졌다. **어긋남은 설명할 것이 아니라 없앨 것이었다.** */
function teacherRosterHTML(){
  if(state.studentDetailId) return teacherStudentDetailHTML(state.studentDetailId);
  loadAllRecordsIfNeeded();

  const m = rosterModel();
  const R = signalRules();                     // 숫자 칸의 빨강은 신호 임계값과 같은 값을 본다
  const stats = m.stats, classId = m.classId;
  const wide = !classId;                       // 반을 고르지 않았을 때만 「반」·「반 진도」를 보인다
  const sel = new Set(state.rosterSelected || []);
  const selVisible = m.rows.filter(s=>sel.has(s.studentId)).length;

  const enrolled = DATA.students.filter(s=>!stats[s.studentId].withdrawn).length;
  const unassigned = DATA.students.filter(s=>studentClassIds(s).length===0 && !stats[s.studentId].withdrawn).length;
  const gone = DATA.students.filter(s=>stats[s.studentId].withdrawn).length;

  /* 반 고르개 — 정규가 먼저, 특강이 뒤다. 갈래가 섞여 있으면 «어느 것이 정규였더라»를
     매번 다시 읽어야 한다 (2026-09-01 · E-1). */
  const clsView = c => ['class:'+c.id, c.name,
    DATA.students.filter(x=>studentClassIds(x).includes(c.id) && !stats[x.studentId].withdrawn).length];
  const specialOnly = DATA.students.filter(s=>!s.classId
    && studentClassIds(s).length > 0 && !stats[s.studentId].withdrawn).length;
  const views = [['all', '전체 학생', enrolled]]
    .concat(DATA.classes.filter(c=>!isSpecialClass(c.id)).map(clsView))
    .concat(DATA.classes.filter(c=>isSpecialClass(c.id)).map(clsView))
    .concat(specialOnly ? [['specialonly', SPECIAL_ONLY_LABEL, specialOnly]] : [])
    .concat(unassigned ? [['unassigned', '미배정', unassigned]] : [])
    .concat(gone ? [['gone', '퇴원', gone]] : []);

  const cls = classId ? DATA.classes.find(c=>c.id===classId) : null;
  const subtitle = classId
    ? escHtml(classNameOf(classId)) + (cls && cls.schedule ? ' · ' + escHtml(cls.schedule) : '') + ' · ' + m.pool.length + '명'
    : `재원 ${enrolled}명 · 반 ${DATA.classes.length}개`;

  const head = `
  <div class="rst-head">
  <div class="rst-hrow">
    <h1 class="t-title">학생 명단<s>${subtitle}</s></h1>
    <div class="spacer"></div>
    <span class="field rst-selwrap" style="width:auto;">${iconSvg('chart',13)}
      <select class="rst-sel" onchange="state.rosterSort=this.value; render()">
        ${ROSTER_SORTS.map(o=>`<option value="${o[0]}" ${state.rosterSort===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>
    </span>
    <button class="btn sm" onclick="exportRosterExcel()">${iconSvg('download',13)} 엑셀</button>
    <button class="btn sm" onclick="state.teacherTab='settings'; state.settingsSubTab='students'; state.studentDetailId=null; render()">${iconSvg('plus',13)} 학생 추가</button>
  </div>

  ${/* 🔴 **모집단 고르개 — 이 줄이 «반을 고르는 유일한 자리»다** (2026-09-01 · C-13).
       왼쪽 반 목록을 없앤 대가로 이 줄이 그 일까지 진다. 반을 고르면 다른 여덟 탭이
       볼 반도 따라 움직인다 → `rosterSetView`. */''}
  <div class="rst-views">
    ${views.map(v=>`<a class="pill ${state.rosterView===v[0]?'on':''}" onclick="rosterSetView('${v[0]}')">${escHtml(v[1])} <b>${v[2]}</b></a>`).join('')}
  </div>

  <div class="rst-fbar">
    <span class="field">${iconSvg('search',15)}
      <input id="rst-search" value="${escHtml(state.rosterQuery)}" placeholder="이름 · 아이디 · 학교 · 학년 · 반" oninput="rosterSearch(event)" oncompositionend="rosterSearch(event)">
    </span>
    ${ROSTER_FLAGS.map(fl=>{
      const on = !!(state.rosterFlags||{})[fl[0]];
      const n = m.pool.filter(m.flagged[fl[0]]).length;
      return `<a class="pill ${on?'f':''}" onclick="rosterToggleFlag('${fl[0]}')">${fl[1]} <b>${n}</b>${on?' <s>×</s>':''}</a>`;
    }).join('')}
    ${/* 🔵 **띄어쓰면 «둘 다 만족»** — 이 어법은 칸 안에 적을 수가 없다 (2026-09-01 · C-14).
         `.rst-fbar .field`가 262px 고정이라 저 문장이 통째로 잘린다. 칸 옆에 둔다.
         ⚠ 이미 «둘»을 치고 계신 분에게는 군더더기라, **낱말이 하나 이하일 때만** 띄운다. */''}
    ${(state.rosterQuery||'').trim().split(/\s+/).filter(Boolean).length > 1 ? '' :
      `<span class="rst-tip">띄어쓰면 <b>둘 다</b> 만족 — 예: <b>건대부고 고1</b></span>`}
    <span class="rst-cnt">${state.allRecordsLoading ? '기록 불러오는 중…' :
      `${m.pool.length}명 중 <b>${m.rows.length}</b>명 표시`}</span>
  </div>
  </div>`;

  const rows = m.rows.map((s,i)=>{
    const st = stats[s.studentId];
    const sg = rosterSignal(st);
    const on = sel.has(s.studentId);
    return `<tr class="${on?'sel':''}">
      <td onclick="rosterToggle('${s.studentId}',${i},event)"><span class="cb ${on?'on':''}"></span></td>
      <td><span class="nm">${escHtml(s.name)}<s>${escHtml(s.studentId)}</s></span></td>
      ${/* D-day는 «학교 × 학년»의 값이라 열을 새로 세우지 않고 이 칸에 붙인다.
           표가 이미 1418px라 열을 늘리면 좁은 화면에서 가로 스크롤이 더 길어진다.
           끝난 시험은 안 그린다 — 지난 D-day는 명단을 어지럽히기만 한다. */''}
      <td class="sub">${escHtml(s.school||'—')} · ${escHtml(s.grade||'—')}${(()=>{
        const dd = studentExamDday(s.studentId);
        if(!dd || dd.state==='after') return '';
        return ` <span class="badge ${dd.state==='during' || dd.days<=7 ? 'no' : dd.days<=14 ? 'late' : ''}"
          >${dd.state==='during' ? '시험 중' : 'D-'+dd.days}</span>`;
      })()}</td>
      ${wide ? `<td class="sub" title="${escHtml(studentClassTitle(s))}">${
        studentClassIds(s).length
          ? escHtml(studentClassLabel(s, {short:true}))
          : '<span class="badge">미배정</span>'}</td>` : ''}
      ${/* 근거 문장은 열 폭에서 …로 잘린다. 잘린 뒤에도 읽을 수 있게 title로 전문을 남긴다. */''}
      <td${sg ? ` title="${escHtml(sg[1] + ' — ' + sg[2])}"` : ''}>${sg
        ? `<span class="rst-sig"><span class="badge ${sg[0]}">${sg[1]}</span><span class="why">${escHtml(sg[2])}</span></span>`
        : '<span class="muted" style="font-size:11px;">—</span>'}</td>
      ${wide ? `<td>${st.prog && st.prog.subject
        ? `<span style="display:flex;align-items:center;gap:8px;"><span class="bar" style="width:40px;"><i style="width:${st.prog.percent}%"></i></span><span class="mono sub" style="font-size:11.5px;">${st.prog.percent}%</span></span>`
        : '<span class="muted" style="font-size:11px;">—</span>'}</td>` : ''}
      <td style="white-space:nowrap;">${rosterSpark(st.scores)}</td>
      <td>${rosterDots(st.att8)}</td>
      ${/* 빨강은 «무거운 신호가 켜졌다»와 같은 뜻이어야 한다 — 그래서 설정의 임계값을 그대로 본다.
           노랑(cau)은 신호가 아니라 «가까워지고 있다»는 넓은 띠라 고정값이다. */''}
      <td class="r mono ${st.attPct===null ? 'muted' : (st.attPct<R.attPct ? 'warn' : (st.attPct<90 ? 'cau' : ''))}">${st.attPct===null ? '—' : st.attPct + '%'}</td>
      <td class="r mono ${st.hwTotal && st.hwDone<st.hwTotal ? 'cau' : ''}">${st.hwTotal ? st.hwDone + '/' + st.hwTotal : '—'}</td>
      <td class="r mono ${st.wrongLeft>0 ? 'warn' : ''}">${st.wrongLeft || '—'}</td>
      <td class="r mono ${st.vidPct===null ? 'muted' : (st.vidPct<R.vidHeavy ? 'warn' : (st.vidPct<R.vidLight ? 'cau' : ''))}">${st.vidPct===null ? '—' : st.vidPct + '%'}</td>
      <td class="sub mono" style="font-size:11.5px;">${escHtml(s.parentPhone||'—')}</td>
      <td><span class="rst-act">
        <button class="btn sm p" onclick="rosterOpen('${s.studentId}','info')">열기</button>
        <button class="btn sm" onclick="rosterOpen('${s.studentId}','attendance')">출결</button>
        <button class="btn sm" onclick="rosterOpen('${s.studentId}','grades')">성적</button>
      </span></td>
    </tr>`;
  }).join('');

  const table = `
  <div class="rst-wrap">
    <table class="grid ${wide?'':'narrow'}">
      <thead><tr>
        <th style="width:34px;" onclick="rosterToggleAll()"><span class="cb ${m.rows.length && selVisible===m.rows.length ? 'on' : ''}"></span></th>
        <th style="width:138px;">학생</th>
        <th style="width:170px;">학교 · 학년</th>
        ${wide ? '<th style="width:116px;">반</th>' : ''}
        <th style="width:180px;">신호</th>
        ${wide ? '<th style="width:88px;">반 진도</th>' : ''}
        <th style="width:132px;">성적 추이</th>
        <th style="width:118px;">출결 최근 8회</th>
        <th class="r" style="width:60px;">출석률</th>
        <th class="r" style="width:54px;">과제</th>
        <th class="r" style="width:50px;">오답</th>
        <th class="r" style="width:60px;">시청률</th>
        <th style="width:108px;">학부모</th>
        <th style="width:156px;"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${m.rows.length===0 ? `<div style="padding:40px 0;text-align:center;color:var(--dim);font-size:12.5px;">${
      DATA.students.length===0 ? '등록된 학생이 없습니다.' : '조건에 맞는 학생이 없습니다.'}</div>` : ''}
    ${(state.rosterSelected||[]).length>0 ? '<div class="rst-pad"></div>' : ''}
  </div>`;

  const selCount = (state.rosterSelected||[]).length;
  const bar = selCount===0 ? '' : `
  <div class="actbar">
    <span class="sum"><b class="mono">${selCount}</b>명 선택됨</span>
    <span class="field rst-selwrap"><select class="rst-sel" id="rst-move">${classOptionsHTML(classId)}</select></span>
    <button class="btn sm" onclick="rosterBulkMoveClass()">반 이동</button>
    <button class="btn sm" onclick="exportRosterExcel(true)">${iconSvg('download',13)} 선택 학생 내보내기</button>
    ${/* 리포트 PDF (2026-09-01 · R-3) — 고르는 칸도 발판도 이미 있었다. 단추 하나만 얹는다. */''}
    <button class="btn sm" onclick="openReportBatch()">${iconSvg('download',13)} 리포트 이미지</button>
    <button class="btn q sm" onclick="state.rosterSelected=[]; state.rosterLastIndex=null; render()">선택 해제</button>
    <span class="hint">Shift+클릭으로 범위 선택</span>
  </div>`;

  return `<div class="rst-screen">${head}${table}</div>${bar}`;
}

function rosterSetView(v){
  state.rosterView = v;
  /* 🔴 **여기가 «반을 고르는» 유일한 자리다** (2026-09-01 · C-13).
     왼쪽 반 목록을 없앴으므로, 이 고르개에서 반을 고르면 **다른 여덟 탭(출결·성적·과제…)이
     볼 반도 같이 움직인다.** 안 움직이면 학생 탭에서 반을 고른 뒤 출결로 넘어갔을 때
     엉뚱한 반이 서 있다.
     ⚠ 「전체」·「미배정」·「퇴원」은 반이 아니라 따라갈 곳이 없다 — 그때는 마지막에
       고른 반이 그대로 남는다. 다른 탭에는 왼쪽 목록이 있으니 거기서 바꾸면 된다. */
  if(v.indexOf('class:')===0) state.classHubId = v.slice(6);
  state.rosterSelected = [];      // 모집단이 바뀌면 선택은 의미를 잃는다
  state.rosterLastIndex = null;
  render();
}
function rosterToggleFlag(k){
  const f = state.rosterFlags || (state.rosterFlags = {});
  f[k] = !f[k];
  state.rosterLastIndex = null;
  render();
}
/* =================== 치면서 화면이 따라오는 입력칸 ===================
   ⚠ **한글은 «조합»으로 들어온다.** ㅇ+ㅏ+ㄴ이 모여 「안」이 되기까지 브라우저는
   그 글자를 «조합 중»으로 들고 있는데, 그 사이에 render()가 돌면 입력칸이 통째로
   새로 만들어지면서 조합이 깨진다 — 「안녕하세요」를 치면 「ㅇㅏㄴㄴㅕㅇㅎㅏㅅㅔㅇㅛ」가 된다.
   → **조합이 끝난 뒤에만 다시 그린다** (`event.isComposing`).

   커서도 «끝»이 아니라 «있던 자리»로 되돌린다. 끝으로 보내면 문장 가운데를 고치다가
   글자 하나 칠 때마다 커서가 맨 뒤로 튄다.

   쓰는 곳은 oninput과 oncompositionend 둘 다 걸어야 한다 — 브라우저마다
   조합이 끝나는 순간에 어느 이벤트가 먼저 오는지가 다르다. */
function liveEdit(ev, apply){
  const el = ev.target;
  apply(el.value);
  if(ev.isComposing) return;            // 조합 중에는 화면을 건드리지 않는다
  const id = el.id, pos = el.selectionStart;
  render();
  const back = id && document.getElementById(id);
  if(!back) return;
  back.focus();
  try{ back.setSelectionRange(pos, pos); }catch(err){}
}

function rosterSearch(ev){
  liveEdit(ev, v=>{ state.rosterQuery = v; state.rosterLastIndex = null; });
}
/* 명단·신호·수업에서 학생을 열 때 쓰던 «탭 이름»을 학생 상세의 새 모델로 옮긴다.
   탭이 사라지고 연대기 + 갈래가 됐으므로, 옛 탭 이름은 «어느 갈래로 열 것인가»가 된다. */
const ROSTER_OPEN_MAP = {
  info:['timeline','all'], attendance:['timeline','att'], grades:['timeline','score'],
  wronghw:['timeline','hw'], homework:['timeline','hw'], clinic:['timeline','qna'],
  chat:['chat','all']
};
function rosterOpen(sid, tab){
  const m = ROSTER_OPEN_MAP[tab||'info'] || ROSTER_OPEN_MAP.info;
  state.studentDetailId = sid;
  state.teacherSelectedStudent = sid;
  state.studentDetailTab = m[0];
  state.sdFilter = m[1];
  render();
}
/* Shift+클릭 범위 선택. 기준은 «지금 보이는 순서»다 — 필터나 정렬이 바뀌면 기준을 버린다. */
function rosterToggle(sid, idx, ev){
  const rows = rosterModel().rows;
  const cur = new Set(state.rosterSelected || []);
  if(ev && ev.shiftKey && state.rosterLastIndex!==null){
    const a = Math.min(state.rosterLastIndex, idx), b = Math.max(state.rosterLastIndex, idx);
    const add = !cur.has(sid);
    for(let i=a; i<=b; i++){
      if(!rows[i]) continue;
      if(add) cur.add(rows[i].studentId); else cur.delete(rows[i].studentId);
    }
  }else{
    if(cur.has(sid)) cur.delete(sid); else cur.add(sid);
  }
  state.rosterSelected = [...cur];
  state.rosterLastIndex = idx;
  render();
}
function rosterToggleAll(){
  const rows = rosterModel().rows;
  const cur = new Set(state.rosterSelected || []);
  const allOn = rows.length>0 && rows.every(s=>cur.has(s.studentId));
  rows.forEach(s=>{ if(allOn) cur.delete(s.studentId); else cur.add(s.studentId); });
  state.rosterSelected = [...cur];
  state.rosterLastIndex = null;
  render();
}

/* 반 이동 — 학생 레코드(성적·출석·오답숙제)는 건드리지 않고 classId만 바꾼다.
   updateStudentInfo와 같은 방식이며, 누가 언제 옮겼는지 감사 로그에 남긴다. */
async function rosterBulkMoveClass(){
  const ids = (state.rosterSelected || []).slice();
  if(ids.length===0) return;
  const box = document.getElementById('rst-move');
  const classId = box ? box.value : '';
  const label = classId ? classNameOf(classId) : '미배정';
  if(!confirm(`선택한 ${ids.length}명을 「${label}」(으)로 옮길까요?`)) return;
  let moved = 0;
  for(const sid of ids){
    const s = DATA.students.find(x=>x.studentId===sid);
    if(!s || s.classId===classId) continue;
    const before = s.classId ? classNameOf(s.classId) : '미배정';
    s.classId = classId;
    await dbSetDoc('students', sid, s);
    await logAudit('반 이동', sid, s.name, `${before} → ${label}`);
    moved++;
  }
  state.rosterSelected = [];
  state.rosterLastIndex = null;
  showToast(moved===0 ? '이미 모두 그 반에 있습니다.' : `${moved}명을 「${label}」(으)로 옮겼습니다.`);
}

/* 명단 엑셀 — «지금 보고 있는 명단»을 화면과 같은 열 구성으로 내보낸다.
   exportClassExcel(반 단위 성적·출결)과는 다른 일을 하므로 따로 둔다. */
async function exportRosterExcel(onlySelected){
  try{
    await ensureXLSXLoaded();
    await loadAllRecordsIfNeeded();
    const m = rosterModel();
    const picked = new Set(state.rosterSelected || []);
    const list = onlySelected ? m.rows.filter(s=>picked.has(s.studentId)) : m.rows;
    if(list.length===0){ showToast('내보낼 학생이 없습니다.'); return; }
    const header = ['아이디','이름','학교','학년','반','신호','근거','출석률(%)','과제 제출','오답 미제출','시청률(%)','최근 점수(%)','학부모 전화번호','학생 전화번호'];
    const body = list.map(s=>{
      const st = m.stats[s.studentId], sg = rosterSignal(st);
      return [
        s.studentId, s.name, s.school||'', s.grade||'',
        studentClassTitle(s),
        sg ? sg[1] : '', sg ? sg[2] : '',
        st.attPct===null ? '' : st.attPct,
        st.hwTotal ? st.hwDone + '/' + st.hwTotal : '',
        st.wrongLeft,
        st.vidPct===null ? '' : st.vidPct,
        st.scores.length ? st.scores[st.scores.length-1] : '',
        s.parentPhone||'', s.phone||''
      ];
    });
    const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '학생명단');
    XLSX.writeFile(wb, `학생명단_${todayStr()}.xlsx`);
  }catch(e){
    console.error('명단 엑셀 내보내기 실패', e);
    showToast('엑셀 파일을 만들지 못했습니다.');
  }
}

/* =================== 신호 (design-v1/05-signals) ===================
   역할은 «놓치기 전에 먼저 보인다». 규칙은 signalOf() 한 곳에 있고 여기서는 읽기만 한다.

   시안이 A5의 3열 칸반 보드를 버린 이유를 그대로 따랐다 — 카드가 흩어지면
   «놓치지 않는» 화면이 오히려 산만해진다. 등급으로 묶은 한 줄기 세로 목록이라
   읽는 눈이 위에서 아래로 한 번만 움직인다.

   시안에 있었으나 넣지 않은 것: 신호 규칙 설정 UI · 클리닉 배정 · 메모.
   규칙 편집은 아직 signalOf()를 고치는 일이고, 클리닉은 «학생이 신청하고 강사가 승인»하는
   구조라 강사가 배정하는 문이 없다. 메모는 도메인에 아예 없다.
   대신 «해제»는 넣었다 — 지울 수 없는 트리아지 목록은 곧 아무도 안 보게 된다. */

/* 신호 해제 — 새 컬렉션을 만들지 않고 kv 문서 하나에 {학생id: 'YYYY-MM-DD까지'}로 둔다.
   컬렉션을 늘리면 loadAll·마이그레이션까지 건드려야 하는데 이 정도 데이터엔 과하다. */
async function loadSignalMutesIfNeeded(){
  if(state.signalMutesLoaded || state.signalMutesLoading) return;
  state.signalMutesLoading = true;
  const m = await dbGet('signal-mutes', {});
  state.signalMutes = (m && typeof m === 'object') ? m : {};
  state.signalMutesLoading = false;
  state.signalMutesLoaded = true;
  render();
}
function signalMutedUntil(sid){
  const until = (state.signalMutes || {})[sid];
  if(!until) return null;
  return until >= todayStr() ? until : null;   // 지난 것은 저절로 풀린다
}
async function muteSignal(sid, days){
  const until = ymdLocal(new Date(Date.now() + days * 86400000));
  state.signalMutes = Object.assign({}, state.signalMutes, { [sid]: until });
  await dbSet('signal-mutes', state.signalMutes);
  await logAudit('신호 해제', sid, studentNameOf(sid), `${until}까지`);
  showToast(`${studentNameOf(sid)} — ${until}까지 신호에서 감춥니다.`);
}
async function unmuteSignal(sid){
  const next = Object.assign({}, state.signalMutes);
  delete next[sid];
  state.signalMutes = next;
  await dbSet('signal-mutes', next);
  await logAudit('신호 해제 취소', sid, studentNameOf(sid), '');
  showToast(`${studentNameOf(sid)} — 신호를 다시 봅니다.`);
}

const SIGNAL_RULE_NAMES = ['연속 결석', '출석률 저조', '성적 급락', '오답 미제출', '시청률 저조', '과제 누락'];

function signalsModel(){
  const rows = [];
  let muted = 0, clear = 0;
  DATA.students.forEach(s=>{
    const st = rosterStats(s);
    if(st.withdrawn) return;
    const sg = signalOf(st);
    if(!sg){ clear++; return; }
    const until = signalMutedUntil(s.studentId);
    if(until){ muted++; rows.push({ s, st, sg, mutedUntil: until }); return; }
    rows.push({ s, st, sg, mutedUntil: null });
  });

  const classId = state.signalClassId || '';
  const rule = state.signalRule || '';
  const visible = rows.filter(r=>
    !r.mutedUntil &&
    (!classId || r.s.classId === classId) &&
    (!rule || r.sg.rules.some(x=>x.name === rule))
  ).sort((a, b)=> b.sg.score - a.sg.score || (a.s.name||'').localeCompare(b.s.name||'', 'ko'));

  return { rows, visible, muted, clear };
}

function teacherSignalsHTML(){
  if(state.studentDetailId) return teacherStudentDetailHTML(state.studentDetailId);
  loadAllRecordsIfNeeded();
  loadSignalMutesIfNeeded();

  const m = signalsModel();
  const enrolled = DATA.students.filter(s=>!rosterStats(s).withdrawn).length;
  const unmutedAll = m.rows.filter(r=>!r.mutedUntil);
  const byClass = state.signalClassId
    ? unmutedAll.filter(r=>r.s.classId === state.signalClassId) : unmutedAll;

  const head = `
  <div class="rst-head">
    <div class="rst-hrow">
      <h1 class="t-title">신호<s>규칙 기반 자동 트리아지 · 재원 ${enrolled}명 중 ${unmutedAll.length}명</s></h1>
      <div class="spacer"></div>
      <span class="field rst-selwrap" style="width:auto;">${iconSvg('users',13)}
        <select class="rst-sel" onchange="state.signalClassId=this.value; render()">
          <option value="">반: 전체</option>
          ${DATA.classes.map(c=>`<option value="${c.id}" ${state.signalClassId===c.id?'selected':''}>${escHtml(c.name)}</option>`).join('')}
        </select>
      </span>
      ${m.muted ? `<button class="btn sm" onclick="state.signalShowMuted=${!state.signalShowMuted}; render()">${
        state.signalShowMuted ? '해제한 학생 숨기기' : `해제한 학생 ${m.muted}명 보기`}</button>` : ''}
      ${/* 「이 줄은 왜 위험이지」의 답은 임계값에 있다. 그 문을 화면 안에 둔다. */''}
      <button class="btn sm" onclick="goTeacherTab('settings'); state.settingsSubTab='signalrules'; render()">규칙 고치기</button>
    </div>

    <div class="rst-fbar">
      <a class="pill ${!state.signalRule?'on':''}" onclick="state.signalRule=''; render()">전체 <b>${byClass.length}</b></a>
      ${SIGNAL_RULE_NAMES.map(name=>{
        const n = byClass.filter(r=>r.sg.rules.some(x=>x.name===name)).length;
        if(n === 0) return '';
        return `<a class="pill ${state.signalRule===name?'on':''}" onclick="state.signalRule='${name}'; render()">${name} <b>${n}</b></a>`;
      }).join('')}
      ${/* 0명일 때는 아무 말도 하지 않는다 — 「양호 0명은 이 화면에 없습니다」는 뜻이 없다. */''}
      <span class="rst-cnt">${state.allRecordsLoading ? '기록 불러오는 중…'
        : m.clear ? `양호 <b>${m.clear}</b>명은 이 화면에 없습니다` : ''}</span>
    </div>
  </div>`;

  /* 등급별로 묶어 한 줄기로 내려 읽는다. */
  const groups = ['r', 'y', 'g'].map(k=>{
    const g = SIGNAL_GRADE[k];
    const list = m.visible.filter(r=>r.sg.grade === k);
    if(list.length === 0) return '';
    return `
    <div class="sig-ghead"><span class="rk ${k}"></span><b>${g.label}</b>
      <span class="sig-n mono">${list.length}</span>
      <span class="sig-do">· ${g.todo}</span>
      <span class="sig-cond">${gradeCond(k)}</span>
    </div>
    ${list.map(r=>signalRowHTML(r, k)).join('')}`;
  }).join('');

  const mutedList = state.signalShowMuted && m.muted ? `
    <div class="sig-ghead"><span class="rk g"></span><b>해제됨</b>
      <span class="sig-n mono">${m.muted}</span>
      <span class="sig-do">· 기간이 지나면 저절로 다시 나타난다</span>
    </div>
    ${m.rows.filter(r=>r.mutedUntil).map(r=>signalRowHTML(r, r.sg.grade, true)).join('')}` : '';

  const empty = m.visible.length === 0 && !mutedList
    ? `<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">${
        DATA.students.length === 0 ? '등록된 학생이 없습니다.'
        : m.rows.length === 0 ? '지금 신호가 잡힌 학생이 없습니다. 전부 양호합니다.'
        : '이 조건에 맞는 학생이 없습니다.'}</div>` : '';

  return `<div class="rst-screen">${head}
    <div class="sig-list">${groups}${mutedList}${empty}</div>
  </div>`;
}

function signalRowHTML(r, k, isMuted){
  const s = r.s, st = r.st, sg = r.sg;
  const badge = SIGNAL_GRADE[k].badge;
  const scoreClass = k === 'r' ? 'warn' : (k === 'y' ? 'cau' : 'muted');
  return `
  <div class="sig-row ${k === 'r' ? 'now' : ''} ${isMuted ? 'off' : ''}">
    <div class="sig-who" onclick="rosterOpen('${s.studentId}','info')">
      <div class="av">${escHtml((s.name || '?').slice(0, 1))}</div>
      <div class="sig-t"><b>${escHtml(s.name)}</b>
        <span>${escHtml(s.school || '—')} ${escHtml(s.grade || '')} · ${escHtml(classNameOf(s.classId))}</span></div>
    </div>
    <div class="sig-mid" onclick="rosterOpen('${s.studentId}','info')">
      <div class="sig-rules">${sg.rules.map(x=>
        `<span class="badge ${x.heavy ? badge : ''}">${x.name}</span>`).join('')}</div>
      <div class="sig-why">${sg.rules.map(x=>x.why).join(' · ')}${
        isMuted ? ` <span class="muted">— ${r.mutedUntil}까지 해제됨</span>` : ''}</div>
    </div>
    <div class="sig-num">
      <div class="sig-sc mono ${scoreClass}">${sg.score}</div>
      ${rosterDots(st.att8)}
    </div>
    <div class="sig-act">
      ${isMuted
        ? `<button class="btn sm" onclick="unmuteSignal('${s.studentId}')">다시 보기</button>`
        : `<button class="btn sm ${k === 'r' ? 'p' : ''}" onclick="rosterOpen('${s.studentId}','chat')">연락</button>
           <button class="btn sm" onclick="rosterOpen('${s.studentId}','attendance')">출결</button>
           <button class="btn sm" onclick="rosterOpen('${s.studentId}','wronghw')">오답</button>
           <button class="btn q sm" onclick="muteSignal('${s.studentId}',7)">7일 해제</button>`}
    </div>
  </div>`;
}

/* 홈 대시보드(teacherHomeHTML)는 지웠다 — 상단바에 「홈」이 없고 부르는 곳도 없어졌다.
   담고 있던 것은 전부 제 자리로 갔다:
     과제 빠른 등록  -> 반 관리 > 수업 기록 > 과제  (보는 곳과 만드는 곳을 붙였다)
     시험지 빠른 등록 -> 오답 > 시험지
     강의 업로드     -> 반 관리 > 영상
     새 상담 알림    -> 알림 벨 · 설정 > 상담
     반별 진도 현황  -> 반 관리 > 진도
   남겨 두면 hw-title · video-url 같은 입력 id가 살아 있는 화면과 «중복»된다.
   둘이 같이 그려지는 날 getElementById가 엉뚱한 칸을 읽는다. */

/* =================== 수업 (design-v1/02-class) ===================
   역할은 «수업 중에 순서대로 끝낸다». 명단·신호가 «훑는» 화면이라면 이건 «하는» 화면이다.
   그래서 1차 축이 반이 아니라 **날짜와 시간**이다 — 왼쪽에서 지금 하는 수업을 고르고,
   오른쪽에서 출결 → 진도 → 과제 → 메모를 순서대로 끝낸다.

   출결 저장은 새로 쓰지 않았다. 기존 attDraft / ensureAttDraft / setAttStatus /
   saveClassAttendance를 그대로 쓴다 — 결석 보충 영상 자동 배정까지 붙어 있는 로직이고,
   저장 경로가 두 벌이 되면 한쪽만 고쳐진다.

   **출결 버튼은 4개다 (출석·지각·조퇴·결석).** 「퇴원」은 수업 중에 누를 일이 없고,
   잘못 누르면 학생 로그인이 막힌다. 5상태 전부와 일괄 변경은
   반 관리 > 수업 기록 > 출석에 그대로 남아 있다 — 기능이 사라진 것이 아니다.

   데일리퀴즈는 이 흐름에 없다. 학생이 직접 제출하고 자동 채점되므로
   수업 중에 교사가 손댈 단계가 아니다. (시안의 판단을 그대로 따랐다.) */

/* 🔴 **수업 «순서»가 실제 수업을 따라간다** (2026-09-01 · C-18 · 사용자가 시켰다).
   사용자의 말 — 「**실제 수업하는 구조로 바꾸기위해서 1출결 뒤에 «2.과제검사»,
     3.진도뒤에 «4.시험»도 넣어줘**」.
   🔵 **둘로 갈린 것이 핵심이다** — 예전 「과제」 한 단계가 «지난 과제를 검사하는 일»과
     «오늘 낼 과제를 적는 일» 둘을 같이 지고 있었다. **수업에서는 그 둘이 다른 시각에 일어난다** —
     검사는 시작할 때, 내주는 것은 끝날 때다. 한 단계에 묶여 있으면 두 번 들어가야 한다.
   ⚠ 번호는 배열 순서(`i`)가 매긴다. `prev`가 0이라 출결이 1, 과제 검사가 2… 로 맞는다. */
const SESSION_STEPS = [
  ['prev', '지난 수업 확인'], ['att', '출결'], ['hwcheck', '과제 검사'],
  ['prog', '진도'], ['exam', '시험'], ['hw', '과제'], ['memo', '메모']
];
const SESSION_SEG = [['출석','ok','출'], ['지각','late','지'], ['조퇴','leave','조'], ['결석','no','결']];

/* 날짜 더하기·빼기. **new Date(ymd).toISOString()로 하면 안 된다** —
   'YYYY-MM-DD'는 UTC 자정으로, 'YYYY-MM-DDT00:00:00'은 «로컬» 자정으로 읽힌 뒤
   toISOString()이 다시 UTC로 되돌린다. KST(+9)에서는 그 왕복에 하루가 깎여
   ▶ 버튼이 제자리걸음을 하고 「지난 수업」이 하루 더 옛날을 가리켰다.
   여기서는 양쪽 다 UTC로 맞춰 날짜 문자열 산술만 한다. todayStr()도 UTC 기준이라 이게 일관된다. */
function shiftYmd(ymd, delta){
  const d = new Date(ymd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0, 10);
}

/* 반 일정은 "월,수,금 7시~9시" 같은 자유 텍스트다. 요일 글자 뒤가 시간이라고 보고 잘라 쓴다 —
   형식을 강제하는 곳이 없어서 파싱하려 들면 오히려 깨진다. */
function sessionTimeText(schedule){
  if(!schedule) return '';
  let last = -1;
  for(let i=0;i<schedule.length;i++) if(WEEKDAY_MAP[schedule[i]]!==undefined) last = i;
  return schedule.slice(last+1).replace(/^[\s,·]+/, '').trim();
}
function sessionStartHour(schedule){
  const m = sessionTimeText(schedule).match(/\d+/);
  return m ? parseInt(m[0], 10) : 99;
}
/* 그 날짜에 수업이 있는 반. 시간 순 — 왼쪽 목록이 곧 그날의 시간표가 된다. */
function sessionsOn(date){
  const dow = new Date(date + 'T00:00:00').getDay();
  return DATA.classes.filter(c=>parseScheduleDays(c.schedule).includes(dow))
    .sort((a,b)=> sessionStartHour(a.schedule) - sessionStartHour(b.schedule)
               || (a.name||'').localeCompare(b.name||'', 'ko'));
}
/* 저장된 기록 기준 요약. 초안(attDraft)이 아니라 «이미 저장된 것»만 센다 —
   왼쪽 목록은 «이 수업 끝냈나»를 말해야 하므로 아직 저장 안 한 것을 완료로 세면 거짓말이 된다. */
function sessionSavedSummary(classId, date){
  const roster = classRoster(classId);
  const cnt = {}; let filled = 0;
  roster.forEach(s=>{
    const rec = state.allRecords[s.studentId];
    const a = attOn(rec, date, classId, studentMainClassId(s));
    if(a){ filled++; cnt[a.status] = (cnt[a.status]||0) + 1; }
  });
  return { total: roster.length, filled, cnt };
}
function sessionDraftSummary(classId){
  const roster = classRoster(classId);
  const cnt = {}; let none = 0;
  roster.forEach(s=>{
    const d = state.attDraft[s.studentId];
    if(d && d.status) cnt[d.status] = (cnt[d.status]||0) + 1; else none++;
  });
  return { roster, cnt, none };
}
/* 저장 안 된 변경이 몇 명분인가. 초안은 메모리에만 있어서 반·날짜를 옮기면 사라진다 —
   그 전에 «남아 있다»고 말해 줘야 한다. */
function sessionUnsavedCount(classId, date){
  let n = 0;
  classRoster(classId).forEach(s=>{
    const d = state.attDraft[s.studentId];
    if(!d) return;
    const rec = state.allRecords[s.studentId];
    const a = attOn(rec, date, classId, studentMainClassId(s));
    if((d.status||null) !== (a ? a.status : null)) { n++; return; }
    if(d.status && (d.reason||'') !== (a ? (a.reason||'') : '')) { n++; return; }
    if((d.videoUrl||'').trim()) n++;
  });
  return n;
}

/* 수업 메모 — 새 컬렉션 대신 반마다 kv 문서 하나에 {날짜: 글}로 둔다 (신호 해제와 같은 방식).
   컬렉션을 늘리면 loadAll·마이그레이션까지 건드려야 하는데 이 정도 데이터엔 과하다. */
async function loadSessionNoteIfNeeded(classId){
  if(!classId || state.sessionNotes[classId] || state.sessionNoteLoading[classId]) return;
  state.sessionNoteLoading[classId] = true;
  const v = await dbGet('classnote:' + classId, {});
  state.sessionNotes[classId] = (v && typeof v === 'object') ? v : {};
  state.sessionNoteLoading[classId] = false;
  render();
}
/* 글자마다 render()를 부르면 전체 재렌더링이라 커서가 튄다. 초안만 담아 두고 저장할 때 읽는다. */
function sessionNoteInput(key, text){ state.sessionNoteDraft = { key, text }; }
function sessionNoteText(classId, date){
  const key = classId + '|' + date;
  if(state.sessionNoteDraft && state.sessionNoteDraft.key === key) return state.sessionNoteDraft.text;
  return (state.sessionNotes[classId] || {})[date] || '';
}
async function saveSessionNote(classId, date){
  const el = document.getElementById('cls-memo');
  const text = el ? el.value : sessionNoteText(classId, date);
  const map = Object.assign({}, state.sessionNotes[classId] || {});
  if(text.trim()) map[date] = text; else delete map[date];
  state.sessionNotes[classId] = map;
  state.sessionNoteDraft = null;
  await dbSet('classnote:' + classId, map);
  showToast(text.trim() ? '수업 메모를 저장했습니다.' : '수업 메모를 비웠습니다.');
  render();
}

/* 🔴 **지금 화면에 선 반은 여기 한 곳이 정한다** (2026-09-01 · C-20).
   `teacherSessionHTML`이 «고른 반이 그날 수업에 없으면 첫 수업으로» 되돌리는 판단을
   화면 안에서만 하고 있었다. «나갈 때 저장»이 그 판단을 다시 하면 두 벌이 되고,
   어긋나는 날 **엉뚱한 반의 출결이 저장된다.** 그래서 함수 하나로 뽑았다. */
function sessionCurrentClassId(date){
  const d = date || state.sessionDate || todayStr();
  const sessions = sessionsOn(d);
  const cur = state.sessionClassId;
  if(cur && sessions.some(c=>c.id===cur)) return cur;
  return sessions.length ? sessions[0].id : '';
}
/* 🔵 **출결은 «넘어가면» 저장된다** (2026-09-01 · C-20 · 사용자가 시켰다).
   사용자의 말 — 「**출결도 다음페이지 넘어가면 저장되는 것으로 해주고**」.
   과제 검사는 누르는 즉시 저장되는데 출결만 「저장」을 눌러야 했다 — **같은 화면에서
   두 가지 규칙이 도는 것**이 헷갈린다고 본 것이다. 맞는 말이다.
   ⚠ **바뀐 것이 없으면 아무 일도 안 한다** — 단계를 오갈 때마다 저장이 돌면
     토스트가 계속 뜨고 실 DB에 같은 값이 반복해서 쓰인다.
   ⚠ **출결 단계에서 나갈 때만이다.** 다른 단계에서는 attDraft가 화면과 무관하다. */
async function sessionAutoSaveAtt(){
  if((state.sessionStep || 'att') !== 'att') return;
  if(!state.allRecordsLoaded) return;
  const date = state.sessionDate || todayStr();
  const classId = sessionCurrentClassId(date);
  if(!classId) return;
  if(sessionUnsavedCount(classId, date) === 0) return;
  await saveClassAttendance(classId, date);
}
async function goSessionDate(delta){
  await sessionAutoSaveAtt();
  state.sessionDate = shiftYmd(state.sessionDate || todayStr(), delta);
  state.sessionClassId = '';
  sessionForgetPicks();
  render();
}
/* 반이나 날짜를 옮기면 «고른 과제·시험»을 놓는다 (2026-09-01 · C-19) —
   못 박아 두었으므로 스스로 안 풀린다. 다른 반 것이 따라오면 화면이 거짓말을 한다. */
function sessionForgetPicks(){
  state.sessionHwId = ''; state.sessionExamId = ''; state.sessionExamNew = false;
}
async function sessionGoToday(){
  await sessionAutoSaveAtt();
  state.sessionDate = ''; state.sessionClassId = '';
  sessionForgetPicks();
  render();
}
async function goSessionStep(step){
  if(step !== state.sessionStep) await sessionAutoSaveAtt();
  state.sessionStep = step;
  render();
}
async function pickSession(classId){
  if(state.sessionClassId === classId){ render(); return; }
  await sessionAutoSaveAtt();     // 반을 옮기기 «전»에 — 옮기고 나면 어느 반 것인지 모른다
  sessionForgetPicks();
  state.sessionClassId = classId;
  if(state.sessionStep === 'prev') state.sessionStep = 'att';
  render();
}
async function saveSessionAttendance(classId, date, nextStep){
  await saveClassAttendance(classId, date);
  if(nextStep) state.sessionStep = nextStep;
  render();
}
function setAllRemainingPresent(classId){
  classRoster(classId).forEach(s=>{
    const d = state.attDraft[s.studentId];
    if(d && d.status) return;                      // 이미 찍은 것은 건드리지 않는다
    state.attDraft[s.studentId] = {status:'출석', reason:'', videoUrl:'', note:(d&&d.note)||''};
  });
  render();
}

function teacherSessionHTML(){
  loadAllRecordsIfNeeded();
  const date = state.sessionDate || todayStr();
  const sessions = sessionsOn(date);
  const dow = WEEKDAY_LABEL[new Date(date + 'T00:00:00').getDay()];

  /* 고른 반이 그날 수업이 없으면 첫 수업으로 되돌린다. 날짜를 옮기면 늘 여기로 온다.
     ⚠ 판단은 `sessionCurrentClassId` 하나가 한다 — «나갈 때 저장»이 같은 답을 봐야 한다. */
  const classId = sessionCurrentClassId(date);
  const cls = DATA.classes.find(c=>c.id === classId);
  if(classId){
    loadSessionNoteIfNeeded(classId);
    if(state.allRecordsLoaded) ensureAttDraft(classId, date);
  }

  const side = `
  <aside class="cls-side">
    ${/* 🔵 **날짜 고르개가 왼쪽 맨 위로 왔다** (2026-09-01 · C-18 · 사용자가 시켰다).
         이 화면의 1차 축은 «날짜와 시간»인데, 날짜를 고르는 곳은 오른쪽 머리말에 있고
         시간을 고르는 곳은 왼쪽에 있었다. **한 축을 두 곳에서 고르고 있었던 셈이다.**
         이제 왼쪽 한 칸이 «언제»를 통째로 진다 — 날짜를 옮기면 바로 아래 수업 목록이 바뀐다. */''}
    ${sessionDateNavHTML(date)}
    <div class="t-sec" style="margin-top:14px;">${date === todayStr() ? '오늘의 수업' : dow + '요일 수업'}</div>
    ${sessions.length === 0
      ? `<div style="font-size:12.5px;color:var(--dim);line-height:1.7;">이 날짜에 수업이 없습니다.<br>반 일정은 반 관리에서 정합니다.</div>`
      : sessions.map(c=>{
          const sm = sessionSavedSummary(c.id, date);
          const st = sm.total === 0 ? ['', '학생 없음']
                   : sm.filled === 0 ? ['', '시작 전']
                   : sm.filled < sm.total ? ['consult', '입력 중']
                   : ['ok', '완료'];
          const detail = sm.total === 0 ? '배정된 학생이 없습니다'
            : sm.filled === 0 ? `${sm.total}명 · 출결 미입력`
            : sm.filled < sm.total ? `${sm.total}명 · 출결 ${sm.filled}/${sm.total}`
            : `${sm.total}명 · 출석 ${sm.cnt['출석']||0}` +
              (sm.cnt['지각'] ? ` · 지각 ${sm.cnt['지각']}` : '') +
              (sm.cnt['조퇴'] ? ` · 조퇴 ${sm.cnt['조퇴']}` : '') +
              (sm.cnt['결석'] ? ` · 결석 ${sm.cnt['결석']}` : '');
          return `
          <div class="cls-sess ${c.id === classId ? 'on' : ''}" onclick="pickSession('${c.id}')">
            <div class="t">${escHtml(sessionTimeText(c.schedule) || '시간 미정')}</div>
            <div class="n">${escHtml(c.name)}</div>
            <div class="m">${escHtml(detail)}</div>
            <span class="st badge ${st[0]}">${st[1]}</span>
          </div>`;
        }).join('')}

    ${/* 🔴 **「오늘 남은 일」을 걷었다** (2026-09-01 · C-22 · 사용자가 시켰다).
         사용자의 말 — 「**수업탭 왼쪽에 오늘 남은일은 «수업»이라는 이페이지에 어울리지 않는 것
           같아 … 다른페이지로 이동하거나 … 아니면 지웠으면 좋겠어**」.
         맞는 말이다. 이 화면은 «지금 이 수업을 끝내는» 곳인데 그 상자는 «오늘 학원 전체»를
         말하고 있었다. 축이 달랐다.
         🔵 **네 줄 중 셋(상담·질문·클리닉)은 이미 벨에 있었다.** 갈 곳이 없던 것은
           「오답 문항 검토」 하나뿐이라 **그것만 벨로 옮기고 상자를 지웠다** →
           `teacherNotifItems`. 새 단추를 만들 필요가 없었다.
         ⚠ 폰에서 이 덩어리를 본문 아래로 내리던 규칙(`.cls-rest{order:3}`)도 같이 지웠다. */''}
    <div class="rst-pad"></div>
  </aside>`;

  if(!classId){
    return `<div class="cls-screen">${side}
      <main class="cls-main">
        <div class="cls-mh">
          <h1 class="t-title">수업<s>${date} ${dow}</s></h1>
        </div>
        <div class="cls-body"><div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">
          ${DATA.classes.length === 0 ? '등록된 반이 없습니다.' : '이 날짜에 수업이 있는 반이 없습니다. 날짜를 옮겨 보세요.'}
        </div></div>
      </main></div>`;
  }

  const step = state.sessionStep || 'att';
  const sm = sessionSavedSummary(classId, date);
  const stepsHTML = `<div class="steps" style="margin-top:18px;flex-shrink:0;">
    ${SESSION_STEPS.map((s,i)=>{
      const done = s[0] === 'prev' ? true : (s[0] === 'att' && sm.total > 0 && sm.filled === sm.total);
      return `<div class="s ${step===s[0]?'on':(done?'fin':'')}" onclick="goSessionStep('${s[0]}')"
        style="cursor:pointer;"><span class="b">${s[0]==='prev' ? '✓' : (done && step!==s[0] ? '✓' : i)}</span>${s[1]}</div>`;
    }).join('')}
  </div>`;

  let body = '', bar = '';
  if(step === 'prev')      { const r = sessionPrevHTML(classId, date);  body = r.body; bar = r.bar; }
  else if(step === 'att')  { const r = sessionAttHTML(classId, date); body = r.body; bar = r.bar; }
  else if(step === 'hwcheck'){ const r = sessionHwCheckHTML(classId, date); body = r.body; bar = r.bar; }
  else if(step === 'prog') { const r = sessionProgHTML(classId);      body = r.body; bar = r.bar; }
  else if(step === 'exam') { const r = sessionExamHTML(classId, date);body = r.body; bar = r.bar; }
  else if(step === 'hw')   { const r = sessionHwHTML(classId, date);  body = r.body; bar = r.bar; }
  else                     { const r = sessionMemoHTML(classId, date);body = r.body; bar = r.bar; }

  return `<div class="cls-screen">${side}
    <main class="cls-main">
      <div class="cls-mh">
        ${/* schedule을 통째로 붙이면 시간이 두 번 나온다 — 요일만 따로 뽑아 잇는다. */''}
        <h1 class="t-title">${escHtml(cls.name)}<s>${escHtml(sessionTimeText(cls.schedule) || '시간 미정')}${
          parseScheduleDays(cls.schedule).length ? ' · ' + parseScheduleDays(cls.schedule).map(d=>WEEKDAY_LABEL[d]).join('·') : ''}</s></h1>
        ${/* ⚠ 날짜 고르개는 여기 없다 — 왼쪽 칸 맨 위로 갔다 (C-18). */''}
        <span class="cls-day">${date} <span class="muted" style="font-weight:400;">${dow}</span></span>
      </div>
      ${stepsHTML}
      <div class="cls-body">${body}<div class="rst-pad"></div></div>
    </main>
    ${bar}
  </div>`;
}

function sessionDateNavHTML(date){
  const isToday = date === todayStr();
  return `<div class="cls-nav">
    <button class="btn icon" title="이전 날" onclick="goSessionDate(-1)">${iconSvg('chevL',16)}</button>
    <span class="cls-day">${date}<span class="muted" style="margin-left:7px;font-weight:400;">${WEEKDAY_LABEL[new Date(date+'T00:00:00').getDay()]}</span></span>
    <button class="btn icon" title="다음 날" onclick="goSessionDate(1)">${iconSvg('chevR',16)}</button>
    ${isToday ? '' : `<button class="btn sm" onclick="sessionGoToday()">오늘</button>`}
  </div>`;
}

/* ── 0단계. 지난 수업 확인 — 「저번에 어디까지 했더라」를 화면이 대신 기억한다 ── */
function sessionPrevHTML(classId, date){
  const cls = DATA.classes.find(c=>c.id===classId);
  const days = parseScheduleDays(cls && cls.schedule);
  let prev = null;
  if(days.length){
    let d = date;
    for(let i=0;i<60;i++){
      d = shiftYmd(d, -1);
      if(days.includes(new Date(d + 'T00:00:00').getDay())){ prev = d; break; }
    }
  }
  const bar = `<div class="actbar">
    <span class="sum">${prev ? prev + ' 수업' : ''}</span>
    <span class="spacer"></span>
    <button class="btn p" onclick="goSessionStep('att')">출결로 ${iconSvg('arrowR',15)}</button>
  </div>`;
  if(!prev) return { bar, body:`<div style="padding:48px 0;text-align:center;color:var(--dim);font-size:12.5px;">반 일정이 없어 지난 수업을 찾을 수 없습니다.</div>` };
  const sm = sessionSavedSummary(classId, prev);
  const note = (state.sessionNotes[classId] || {})[prev] || '';
  const hws = DATA.assignments.filter(a=>(!a.classId || a.classId===classId) && a.createdAt===prev);
  return { bar, body: `
  <div class="t-sec">${prev} (${WEEKDAY_LABEL[new Date(prev+'T00:00:00').getDay()]})</div>
  <div class="cls-hw" style="display:block;">
    <div class="n" style="margin-bottom:9px;">출결</div>
    <div style="font-size:12.5px;color:var(--sub);">${sm.filled === 0 ? '기록이 없습니다.'
      : `${sm.total}명 중 ${sm.filled}명 입력 · ` + ATT_STATUSES.filter(s=>sm.cnt[s]).map(s=>`${s} <b class="mono">${sm.cnt[s]}</b>`).join(' · ')}</div>
  </div>
  <div class="cls-hw" style="display:block;">
    <div class="n" style="margin-bottom:9px;">그날 낸 과제</div>
    <div style="font-size:12.5px;color:var(--sub);">${hws.length === 0 ? '없습니다.'
      : hws.map(h=>escHtml(h.title)).join(' · ')}</div>
  </div>
  <div class="cls-hw" style="display:block;background:var(--note);border-color:var(--note-line);">
    <div class="n" style="margin-bottom:9px;">그날 수업 메모</div>
    <div style="font-size:13px;color:var(--sub);line-height:1.75;white-space:pre-wrap;">${
      note ? escHtml(note) : '<span class="muted">적어 둔 메모가 없습니다.</span>'}</div>
  </div>` };
}

/* ── 1단계. 출결 ── */
function sessionAttHTML(classId, date){
  if(!state.allRecordsLoaded) return { body:'<div style="padding:48px 0;text-align:center;color:var(--dim);font-size:12.5px;">학생 기록을 불러오는 중입니다…</div>', bar:'' };
  const { roster, cnt, none } = sessionDraftSummary(classId);
  if(roster.length === 0) return { body:'<div style="padding:48px 0;text-align:center;color:var(--dim);font-size:12.5px;">이 반에 배정된 학생이 없습니다.</div>', bar:'' };

  const tiles = roster.map(s=>{
    const d = state.attDraft[s.studentId] || {status:null, reason:'', videoUrl:''};
    const flag = d.status === '결석';
    return `
    <div class="tile ${flag?'flag':''}">
      <div class="who"><b>${escHtml(s.name)}</b><span>${escHtml(s.school||'—')} ${escHtml(s.grade||'')}</span></div>
      <div class="seg">${SESSION_SEG.map(g=>
        `<button class="${d.status===g[0] ? 'on '+g[1] : ''}" title="${g[0]}" onclick="setAttStatus('${s.studentId}','${g[0]}')">${g[2]}</button>`
      ).join('')}</div>
      ${d.status && d.status !== '출석' ? `<div class="cls-sub">
        <input placeholder="${d.status} 사유 (선택)" value="${escHtml(d.reason)}"
          oninput="state.attDraft['${s.studentId}'].reason=this.value">
        ${flag ? `<input placeholder="보충 영상 유튜브 링크 (선택)" value="${escHtml(d.videoUrl)}"
          oninput="state.attDraft['${s.studentId}'].videoUrl=this.value">` : ''}
      </div>` : ''}
    </div>`;
  }).join('');

  const unsaved = sessionUnsavedCount(classId, date);
  const bar = `<div class="actbar">
    <span class="sum">${ATT_STATUSES.slice(0,4).map(s=>`${s} <b class="mono">${cnt[s]||0}</b>`).join(' · ')} · 미입력 <b class="mono">${none}</b></span>
    ${none > 0 ? `<button class="btn sm" onclick="setAllRemainingPresent('${classId}')">남은 ${none}명 전체 출석 처리</button>` : ''}
    ${/* 🔵 **넘어가면 저절로 저장된다** (2026-09-01 · C-20) — 그래도 「저장」은 남긴다.
         수업 중에 «여기까지 넣어 뒀다»를 손으로 확인하고 싶을 때가 있고,
         그것을 없애면 «저장했나?»를 화면이 대답해 주지 못한다. */''}
    <button class="btn sm" onclick="saveSessionAttendance('${classId}','${date}')">저장</button>
    <span class="spacer"></span>
    ${unsaved > 0
      ? `<span class="hint" style="margin-left:0;color:var(--late);">안 넣은 변경 ${unsaved}명분 — 넘어갈 때 저장됩니다</span>`
      : '<span class="hint" style="margin-left:0;">넘어갈 때 저절로 저장됩니다</span>'}
    <button class="btn p" onclick="goSessionStep('hwcheck')">과제 검사로 ${iconSvg('arrowR',15)}</button>
  </div>`;
  return { body:`<div class="cls-tiles">${tiles}</div>`, bar };
}

/* ── 2단계. 진도 — 반 관리의 진도 체크리스트와 같은 데이터를 본다 ── */
function sessionProgHTML(classId){
  const { subject, chapters, doneMap, doneCount, percent, books } = getClassProgress(classId);
  const body = !subject
    ? `<div style="max-width:280px;">
        <div class="t-sec">과목</div>
        <span class="field rst-selwrap" style="width:100%;">
          <select class="rst-sel" style="flex:1;" onchange="setClassProgressSubject('${classId}', this.value)">
            <option value="">-- 과목 선택 --</option>
            ${UNITS.map(u=>`<option value="${u}">${u}</option>`).join('')}
          </select>
        </span>
        <div style="margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.7;">과목을 고르면 단원 체크리스트가 나옵니다.</div>
      </div>`
    : `<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;">
        <span class="field rst-selwrap" style="width:220px;">
          <select class="rst-sel" style="flex:1;" onchange="setClassProgressSubject('${classId}', this.value)">
            ${UNITS.map(u=>`<option value="${u}" ${subject===u?'selected':''}>${u}</option>`).join('')}
          </select>
        </span>
        <span class="bar" style="flex:1;min-width:120px;max-width:280px;"><i style="width:${percent}%"></i></span>
        <span class="sub" style="font-size:12.5px;"><span class="mono">${doneCount} / ${chapters.length}</span>단원 · <span class="mono">${percent}%</span></span>
      </div>
      ${/* 교재 (2026-09-01 · T-1c · 사용자가 시켰다: 「수업탭에서도 진도를 입력할때 교재도 표시」).
           🔴 **여기는 «보는» 자리다 — 넣는 문은 만들지 않았다.** 이 화면의 기준은 사용자가 준
             그 문장이다: 「빠르게 체크하고 입력하고 넘어가야 … **작은 글들이 너무 많으면 좋지 않을**」.
             교재를 여기서도 고칠 수 있게 하면 칸과 단추가 둘 더 늘고, 반 › 진도와 «두 곳»이 된다.
           ⚠ 적어 둔 책이 없으면 **줄째로 뺀다** — 「미등록」이라고 적으면 그것이 곧 작은 글 하나다. */''}
      ${books && books.length ? `<div style="margin:-8px 0 16px;font-size:12.5px;color:var(--sub);">
        교재 · ${books.map(b=>escHtml(b)).join(' · ')}</div>` : ''}
      <div class="cls-chaps">${chapters.map(u=>`
        <label class="cls-chap ${doneMap[u]?'on':''}">
          <span class="cb ${doneMap[u]?'on':''}"></span>
          <input type="checkbox" style="display:none;" ${doneMap[u]?'checked':''}
            onchange="toggleClassProgressUnit('${classId}','${escHtml(u)}', this.checked)">
          ${u}
        </label>`).join('')}</div>`;
  const bar = `<div class="actbar">
    <span class="sum">${subject ? `${escHtml(subject)} · <b class="mono">${doneCount}/${chapters.length}</b>단원` : '과목 미지정'}</span>
    <span class="hint">체크하면 바로 저장됩니다</span>
    <span class="spacer"></span>
    <button class="btn p" onclick="goSessionStep('exam')">시험으로 ${iconSvg('arrowR',15)}</button>
  </div>`;
  return { body, bar };
}

/* ── 2단계. 과제 검사 — «지난 과제를 확인해 주는 일» (2026-09-01 · C-18) ──
   🔵 예전에는 「과제」 한 단계가 검사와 등록을 같이 지고 있었다. 사용자가 갈라 달라고 했다 —
     「**과제검사에서는 최근 과제에 대해서 현장확인을 하는 것을 옮겨주고**」.
   🔴 **명단은 반 관리와 «같은 것»을 쓴다**(`hwRosterReviewHTML`) — 요약줄·알림바·정렬·접기가
     한 덩어리다. 두 벌로 두면 한쪽만 고쳐진다.
   ⚠ **아직 할 일이 남은 과제를 먼저 세운다** — 확인 대기와 미제출이 있는 것이 위다.
     수업 중에 이 화면을 여는 까닭이 그것이다. 다 끝난 과제는 아래로 내리되 감추지 않는다. */
/* 🔴 **한 번 눌러 정한다** (2026-09-01 · C-19 · 사용자가 시켰다).
   사용자의 말 — 「**과제검사를 수업페이지에서는 그냥 제출 / 보완필요 / 미제출로 선택할 수
     있으면 좋겠는데 보완필요를 하려면 현장확인을 누르고 다시 수정해야해.
     출결처럼 바로바로 선택할 수 있으면 좋겠어**」.
   맞는 말이었다. 예전 판은 «상태에 따라 할 수 있는 것»만 버튼으로 냈다 — 반 관리에서
   하나씩 검토할 때는 옳은 설계지만, **수업 중에는 세 갈래가 늘 같은 자리에 있어야** 손이 빠르다.
   그래서 이 화면만 **출결과 같은 `.seg`**(출·지·조·결)로 바꿨다. 세 칸이 늘 같은 자리다.
   ⚠ **반 관리의 검토 화면(`hwRosterReviewHTML`)은 그대로 둔다** — 거기는 사진을 보고
     사유를 적어 반려하는 «판단하는» 화면이라 버튼이 상태를 따라가는 것이 맞다. */
function sessionHwCheckHTML(classId, date){
  const roster = classRoster(classId);
  const recOf = s => state.allRecords[s.studentId];
  const all = DATA.assignments.filter(a=>!a.classId || a.classId===classId);
  const stat = a => ({
    wait: roster.filter(s=>recOf(s) && hwState(recOf(s), a.id).status===HW_SUBMITTED).length,
    todo: roster.filter(s=>recOf(s) && hwNeedsAction(recOf(s), a.id)).length,
    done: roster.filter(s=>recOf(s) && hwIsDone(recOf(s), a.id)).length
  });
  /* 🔴 **고르개는 «낸 날» 순으로만 세운다 — 상태로 다시 정렬하지 않는다** (2026-09-01 · C-19).
     처음에는 «할 일이 남은 것»을 위로 올렸는데, **누를 때마다 그 순서가 바뀌었다.**
     `state.sessionHwId`가 비어 있으면 `rows[0]`을 보고 있었으므로 —
     학생 하나를 「제출」로 찍는 순간 그 과제가 목록 아래로 내려가고 **보고 있던 과제가
     조용히 다른 것으로 바뀌었다.** 화면에서 실제로 그렇게 나왔다.
     이제 **차례는 날짜로 고정**하고, «급한 것»은 **처음 한 번 고르는 데만** 쓴다. */
  const rows = all.map(a=>({a, ...stat(a)}))
    .sort((x,y)=> String(y.a.createdAt||'').localeCompare(String(x.a.createdAt||'')));
  if(state.sessionHwId && !all.some(a=>a.id===state.sessionHwId)) state.sessionHwId = '';
  /* 🔴 **고른 것을 못 박는다.** 안 박으면 위와 같은 «떠다니는 기본값» 문제가 되돌아온다. */
  if(!state.sessionHwId && rows.length){
    const urgent = rows.find(r=>r.wait>0) || rows.find(r=>r.todo>0) || rows[0];
    state.sessionHwId = urgent.a.id;
  }
  const cur = all.find(a=>a.id===state.sessionHwId) || (rows[0] && rows[0].a);

  if(!state.allRecordsLoaded)
    return { bar:'', body:'<div style="padding:48px 0;text-align:center;color:var(--dim);font-size:12.5px;">학생 기록을 불러오는 중입니다…</div>' };
  if(!cur)
    return { bar:`<div class="actbar"><span class="sum">검사할 과제가 없습니다</span><span class="spacer"></span>
        <button class="btn p" onclick="goSessionStep('prog')">진도로 ${iconSvg('arrowR',15)}</button></div>`,
      body:`<div style="padding:48px 0;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.8;">
        검사할 과제가 없습니다.<br>과제는 <b style="color:var(--sub);">「5. 과제」 단계</b>에서 냅니다.</div>` };

  const c = stat(cur);
  const left = roster.length - c.done - roster.filter(s=>recOf(s) && hwState(recOf(s), cur.id).status===HW_NONE).length;

  /* 과제 고르개 — 한 줄짜리 칩이다. 수업 중에 보는 것은 대개 «지난 시간에 낸 것» 하나라
     기본으로 그것이 골라져 있고, 여러 개가 걸쳐 있을 때만 옆으로 옮긴다. */
  const chips = `<div class="rst-views" style="margin:0 0 14px;">
    ${rows.map(({a, wait, todo})=>`<a class="pill ${a.id===cur.id?'on':''}"
      onclick="state.sessionHwId='${a.id}'; render()">${escHtml(a.title)}
      <b>${a.createdAt ? a.createdAt.slice(5) : '—'}</b>${
        wait+todo ? `<s style="text-decoration:none;margin-left:5px;color:var(--no);">${wait+todo}</s>` : ''}</a>`).join('')}
  </div>`;

  const tiles = roster.map(s=>{
    const st = recOf(s) ? hwState(recOf(s), cur.id) : {status:HW_NONE, photos:[]};
    const sel = st.status===HW_APPROVED ? 'ok' : st.status===HW_PARTIAL ? 'half'
              : st.status===HW_NONE ? 'none' : '';
    const shots = st.photos.length;
    return `<div class="tile ${sel==='none'?'flag':''}">
      <div class="who"><b>${escHtml(s.name)}</b>
        <span>${st.status===HW_SUBMITTED ? `사진 ${shots}장 · 확인 대기`
          : st.status===HW_REJECTED ? '반려함 — 다시 낼 차례'
          : (shots ? `사진 ${shots}장` : escHtml((s.school||'—') + ' ' + (s.grade||'')))}</span></div>
      <div class="seg wide">
        <button class="${sel==='ok'?'on ok':''}" title="제출한 것으로 봅니다"
          onclick="hwQuickSet('${s.studentId}','${cur.id}','ok')">제출</button>
        <button class="${sel==='half'?'on leave':''}" title="냈지만 미비합니다. 제출은 «한 것»으로 셉니다"
          onclick="hwQuickSet('${s.studentId}','${cur.id}','half')">보완 필요</button>
        <button class="${sel==='none'?'on no':''}" title="아직 안 낸 것으로 되돌립니다"
          onclick="hwQuickSet('${s.studentId}','${cur.id}','none')">미제출</button>
      </div>
      ${shots ? `<div class="cls-sub"><button class="btn q sm" style="flex:0 0 auto;"
        onclick="state.hwPhotoView='${escHtml(st.photos[0].url)}'; render()">사진 보기</button></div>` : ''}
    </div>`;
  }).join('');

  const bar = `<div class="actbar">
    <span class="sum">제출 <b class="mono">${c.done}</b> · 미제출 <b class="mono">${
      roster.length - c.done}</b> · 확인 대기 <b class="mono">${c.wait}</b></span>
    ${left > 0 ? `<button class="btn sm" onclick="hwQuickAll('${classId}','${cur.id}')">남은 ${left}명 전체 제출 처리</button>` : ''}
    <span class="hint">누르면 바로 저장됩니다</span>
    <span class="spacer"></span>
    <button class="btn p" onclick="goSessionStep('prog')">진도로 ${iconSvg('arrowR',15)}</button>
  </div>`;
  return { bar, body: `${chips}
    <div class="t-sec">${escHtml(cur.title)}
      <span style="font-weight:400;">${cur.createdAt ? '낸 날 '+cur.createdAt : '낸 날 모름'}${
        cur.dueDate ? ' · 마감 '+cur.dueDate : ''}</span></div>
    <div class="cls-tiles">${tiles}</div>` };
}

/* 세 갈래를 한 번에 정한다 (2026-09-01 · C-19).
   ⚠ **문은 늘어나지 않았다** — 여전히 `approveHomework`·`partialHomework`·`undoHwDecision` 셋이다.
     여기는 «어느 문을 열지»만 고르는 자리다.
   ⚠ 사진이 없으면 «현장 확인»(onSite)으로 수락한다 — 온라인 제출물이 없는데 그냥 수락하면
     기록이 «냈다»고만 남아 나중에 무엇을 보고 통과시켰는지 알 수 없다. */
async function hwQuickSet(sid, hwId, kind){
  const st = hwState(state.allRecords[sid] || await loadRecord(sid), hwId);
  if(kind==='ok')        await approveHomework(sid, hwId, st.photos.length===0);
  else if(kind==='half') await partialHomework(sid, hwId);
  else                   await undoHwDecision(sid, hwId);
}
/* 남은 사람을 한 번에 «제출»로 — 출결의 「남은 N명 전체 출석 처리」와 같은 어법이다.
   ⚠ **이미 정해 둔 사람은 안 건드린다.** 보완 필요·미제출로 찍어 둔 것을 덮으면
     방금 한 판단이 조용히 사라진다. */
async function hwQuickAll(classId, hwId){
  const roster = classRoster(classId);
  const targets = roster.filter(s=>{
    const st = hwState(state.allRecords[s.studentId], hwId);
    return st.status===HW_SUBMITTED || st.status===HW_REJECTED;
  });
  if(!targets.length){ showToast('처리할 사람이 없습니다.'); return; }
  for(const s of targets){
    const st = hwState(state.allRecords[s.studentId], hwId);
    await setHwState(s.studentId, hwId, {
      status: HW_APPROVED, decidedAt: todayStr(), by: actorLabel(),
      onSite: st.photos.length===0, reason: ''
    });
  }
  const hw = DATA.assignments.find(a=>a.id===hwId);
  await logAudit('과제 일괄 제출 처리', '', '', `${hw?hw.title:'과제'} · ${targets.length}명`);
  showToast(`${targets.length}명을 제출로 처리했습니다.`);
  render();
}

/* ── 4단계. 시험 — «오늘 본 시험을 그 자리에서 만든다» (2026-09-01 · C-18) ──
   🔵 사용자의 말 — 「**«4,시험»은 시험 바로 입력해서 이게 반-성적탭에 시험등록이 되는구조로**」.
   🔴 **만드는 함수는 `addQuickExam` 하나다** — 반 › 성적의 「시험 추가」가 쓰는 그것이다.
     여기서 새로 만들면 «시험이 만들어지는 길»이 둘이 되고, 둘이 조용히 어긋난다.
   ⚠ **id(`qx-*`)가 반 › 성적과 같아도 된다** — 두 화면이 동시에 뜨지 않는다(과제 폼과 같은 판단).
   ⚠ **점수는 여기서 안 넣는다.** 넣는 자리는 반 › 성적 하나다(C-4에서 못 박았다) —
     여기 두면 넣는 문이 둘이 되고, 20명 × 시험 여러 개를 이 좁은 칸에서 칠 수는 없다.
     대신 **그리로 가는 문**을 만든 직후에 띄운다. */
/* 🔴 **만들고 그 자리에서 점수까지 친다** (2026-09-01 · C-19 · 사용자가 시켰다).
   사용자의 말 — 「**시험도 바로 이자리에서 시험등록하고 (시험지는 나중에 집에서 등록하더라도)
     바로 점수 입력할 수 있는 구조였으면 좋겠어**」.
   C-18에서는 «만들기»만 하고 점수는 반 › 성적으로 보냈다. 그 판단의 근거는 「20명을 좁은 칸에서
   칠 수 없다」였는데, **타일로 세우면 칠 수 있다** — 출결이 이미 20명을 그렇게 받고 있다.
   🔴 **저장은 `saveClassScores` 하나다** — 반 › 성적 격자가 쓰는 그것에 «어느 시험»만 넘긴다.
     입력칸 id도 그쪽과 같은 `cs-{시험}-{학생}` · `cst-{시험}`이라 그대로 읽힌다.
     두 벌로 두면 «만점을 어떻게 세는가»가 한쪽만 고쳐진다.
   ⚠ **퇴원생도 넣는다** — 시험은 «이미 있었던 일»이라 그때 다닌 사람의 점수가 남아야 한다.
     그래서 `classRoster`가 아니라 `DATA.students`에서 이 반을 고른다(반 › 성적과 같은 규칙). */
function sessionExamHTML(classId, date){
  const ym = String(date).slice(0,7);
  const exams = classExams(classId, ym);
  const roster = DATA.students.filter(s=>studentClassIds(s).includes(classId));
  const scored = ex => roster.filter(s=>examScoreOf(state.allRecords[s.studentId], ex.id)).length;
  if(state.sessionExamId && !exams.some(e=>e.id===state.sessionExamId)) state.sessionExamId = '';
  /* 오늘 본 시험이 있으면 그것부터. 없으면 그 달 마지막 시험.
     🔴 **고른 것을 못 박는다** (과제 검사와 같은 이유 · C-19) — 안 박으면 «지금 보고 있는 것»이
       state에 없어서, 발판의 「점수 저장」 말고 다른 길로 부를 때 무엇을 저장할지 알 수 없다. */
  const cur = exams.find(e=>e.id===state.sessionExamId)
    || exams.filter(e=>e.date===date)[0] || exams[exams.length-1] || null;
  if(cur && state.sessionExamId !== cur.id) state.sessionExamId = cur.id;
  const adding = state.sessionExamNew || !cur;

  const chips = exams.length ? `<div class="rst-views" style="margin:0 0 14px;">
    ${exams.map(ex=>`<a class="pill ${cur&&ex.id===cur.id&&!state.sessionExamNew?'on':''}"
      onclick="state.sessionExamNew=false; state.sessionExamId='${ex.id}'; render()">${escHtml(ex.title)}
      <b>${escHtml((ex.date||'').slice(5))}</b></a>`).join('')}
    <a class="pill ${state.sessionExamNew?'on':''}"
      onclick="state.sessionExamNew=${!state.sessionExamNew}; render()">${iconSvg('plus',12)} 새 시험</a>
  </div>` : '';

  const form = `
  <div class="t-sec">오늘 본 시험 등록</div>
  <div class="cls-tiles" style="grid-template-columns:1fr;">
    <div class="tile cls-new">
      <div class="cls-new-row">
        <label class="wide"><span>시험명</span>
          <input id="qx-title" placeholder="예: 3주차 쪽지시험"></label>
        <label><span>본 날짜</span><input id="qx-date" type="date" value="${date}"></label>
        <label><span>문항수</span><input id="qx-total" type="number" min="1" step="1" value="20"></label>
      </div>
      <p class="cls-new-note">만들면 <b>바로 아래에서 점수를 칩니다.</b>
        <b>시험지(문항)는 나중에</b> 「오답 › 시험지」에서 붙여도 넣어 둔 성적이 그대로 이어집니다.</p>
    </div>
  </div>`;

  /* 점수 타일 — 출결과 같은 결이다. 맞은 개수를 치면 옆에서 100점 환산이 따라 움직인다. */
  const tot = cur ? examTotalOf(cur) : 0;
  const qn = cur ? (cur.questions||[]).length : 0;
  const scoreBoard = !cur ? '' : `
  <div class="t-sec" style="margin-top:${adding?'24px':'0'};">${escHtml(cur.title)} 점수
    <span style="font-weight:400;"><span class="mono">${escHtml(cur.date||'')}</span> ·
      ${qn ? `문항 <span class="mono">${qn}</span>개 (시험지에 붙어 있습니다)`
           : `문항수 <input class="sg-tot mono" type="number" min="1" step="1" id="cst-${cur.id}"
                value="${tot}" title="이 시험의 총 문항수">개`}</span></div>
  <div class="cls-tiles">${roster.map(s=>{
    const sc = examScoreOf(state.allRecords[s.studentId], cur.id);
    const pct = sc && sc.total ? Math.round(sc.score/sc.total*100) : null;
    return `<div class="tile">
      <div class="who"><b>${escHtml(s.name)}${isWithdrawn(s)?' <span class="badge gone">퇴원</span>':''}</b>
        <span>${pct===null ? '아직 안 넣었습니다' : `<b class="mono">${pct}</b>점 · ${
          Math.max(0, sc.total-sc.score)}개 틀림`}</span></div>
      <div class="cls-score">
        <input class="mono" type="number" min="0" step="1" max="${tot||999}" placeholder="—"
          id="cs-${cur.id}-${s.studentId}" value="${sc ? sc.score : ''}"
          oninput="sessionScoreEcho('${cur.id}','${s.studentId}')">
        <s id="se-${cur.id}-${s.studentId}">/ ${tot||'—'}</s>
      </div>
    </div>`;
  }).join('')}</div>`;

  const body = `${chips}${adding ? form : ''}${scoreBoard}`;
  const done = cur ? scored(cur) : 0;
  const bar = `<div class="actbar">
    ${adding
      ? `<span class="sum">${ymLabel(ym)} 시험 <b class="mono">${exams.length}</b>개</span>
         <button class="btn p" onclick="addQuickExam('${classId}')">${iconSvg('plus',14)} 시험 만들기</button>`
      : `<span class="sum">${escHtml(cur.title)} · 점수 <b class="mono">${done}/${roster.length}</b></span>
         <button class="btn p" onclick="saveSessionScores('${classId}','${cur.id}')">점수 저장</button>
         <span class="hint">빈 칸은 «안 봤다»입니다 — 0점으로 세지 않습니다</span>`}
    <span class="spacer"></span>
    <button class="btn p" onclick="goSessionStep('hw')">과제로 ${iconSvg('arrowR',15)}</button>
  </div>`;
  return { body, bar };
}
/* 치는 동안 «몇 점인지»가 옆에서 따라 움직인다. ⚠ render()를 부르지 않는다 —
   숫자 칸이라 한글 조합은 없지만, 다시 그리면 커서가 튀고 20명 치는 손이 끊긴다(W-3와 같은 뜻). */
function sessionScoreEcho(examId, sid){
  const el = document.getElementById('cs-'+examId+'-'+sid);
  const out = document.getElementById('se-'+examId+'-'+sid);
  if(!el || !out) return;
  const ex = DATA.exams.find(x=>x.id===examId);
  const tot = ex ? examTotalOf(ex) : 0;
  const v = parseFloat(el.value);
  out.textContent = (isNaN(v) || !tot) ? '/ ' + (tot||'—') : '/ ' + tot + ' · ' + Math.round(v/tot*100) + '점';
  out.className = (!isNaN(v) && tot && v>tot) ? 'over' : '';
}
/* 저장은 반 › 성적과 «같은 함수»다 — 어느 시험인지만 넘긴다. */
async function saveSessionScores(classId, examId){
  const ex = DATA.exams.find(x=>x.id===examId);
  if(!ex) return;
  await saveClassScores(classId, [ex]);
}

/* ── 5단계. 과제 — «오늘 낼 과제를 적는 일»만 진다 (C-18) ── */
function sessionHwHTML(classId, date){
  const roster = classRoster(classId);
  /* 🔴 **검사는 여기 없다** (2026-09-01 · C-18) — 「2. 과제 검사」로 갔다.
     사용자의 말 — 「**뒤에있는 과제에서는 그냥 오늘 내줄 과제 입력만 했으면 좋겠어**」.

async function downloadStudentExcelTemplate(){
  try{

    const ws = XLSX.utils.aoa_to_sheet([['아이디','이름','비밀번호','학년','학교','학부모전화번호','학생전화번호']]);

  }catch(e){

    showToast('엑셀 양식을 만들지 못했습니다.');
  }
}
async function exportClassExcel(classId){
  try{
    await ensureXLSXLoaded();
    await loadAllRecordsIfNeeded();
    const roster = classRoster(classId);
    const header = ['아이디','이름','학년','학교','학부모전화번호','학생전화번호','출석','지각','조퇴','결석','시험 응시 횟수','평균 점수(%)','최근 시험명','최근 점수'];
    const rows = roster.map(s=>{
      const rec = state.allRecords[s.studentId] || {scores:[],attendance:[]};
      const att = {출석:0, 지각:0, 조퇴:0, 결석:0};
      /* 엑셀도 «이 반» 것만 센다 — 화면의 표와 숫자가 달라지면 둘 다 못 믿게 된다 (E-1). */
      attOfClass(rec, classId, studentMainClassId(s)).forEach(a=>{ if(att[a.status]!==undefined) att[a.status]++; });
      const scores = rec.scores||[];
      const avg = scores.length ? Math.round(scores.reduce((sum,sc)=>sum+(sc.score/sc.total*100),0)/scores.length) : '';
      const last = scores[scores.length-1];
      return [
        s.studentId, s.name, s.grade||'', s.school||'', s.parentPhone||'', s.phone||'',
        att.출석, att.지각, att.조퇴, att.결석,
        scores.length, avg,
        last?last.name:'', last?`${last.score}/${last.total}`:''
      ];
    });
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '성적출결');
    const className = classNameOf(classId).replace(/[\\/:*?"<>|]/g,'');
    XLSX.writeFile(wb, `${className}_성적출결_${todayStr()}.xlsx`);
  }catch(e){
    console.error('엑셀 내보내기 실패', e);
    showToast('엑셀 파일을 만들지 못했습니다.');
  }
}
async function handleStudentExcelFile(classId, fileList){
  const file = (fileList || [])[0];
  if(!file) return;
  try{
    await ensureXLSXLoaded();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    const parsed = rows.map(r => ({
      studentId: String(r['아이디'] ?? r['studentId'] ?? '').trim(),
      name: String(r['이름'] ?? r['name'] ?? '').trim(),
      pw: String(r['비밀번호'] ?? r['pw'] ?? '').trim(),
      grade: String(r['학년'] ?? '').trim() || '고1',
      school: String(r['학교'] ?? '').trim(),
      parentPhone: String(r['학부모전화번호'] ?? r['학부모 전화번호'] ?? '').trim(),
      phone: String(r['학생전화번호'] ?? r['학생 전화번호'] ?? r['전화번호'] ?? '').trim()
    })).filter(r => r.studentId && r.name && r.pw);
    if(parsed.length === 0){
      showToast('읽을 수 있는 학생 정보가 없습니다. "아이디/이름/비밀번호" 열을 확인해주세요.');
      return;
    }
    state.studentImportPreview = { classId, rows: parsed };
    render();
  }catch(e){
    console.error('엑셀 처리 실패', e);
    showToast('엑셀 파일을 읽지 못했습니다.');
  }
}

async function confirmStudentBulkImport(){
  const imp = state.studentImportPreview;
  if(!imp) return;
  const existingIds = new Set(DATA.students.map(s=>s.studentId));
  const toAdd = imp.rows.filter(r=>!existingIds.has(r.studentId));
  const skipped = imp.rows.length - toAdd.length;
  const newStudents = toAdd.map(r=>({studentId:r.studentId, name:r.name, pw:r.pw, grade:r.grade, school:r.school, phone:r.phone, parentPhone:r.parentPhone, classId:imp.classId}));
  newStudents.forEach(ns=>DATA.students.push(ns));
  await Promise.all(newStudents.map(ns=>dbSetDoc('students', ns.studentId, ns)));
  await Promise.all(toAdd.map(async r=>{
    adoptRecord(r.studentId, emptyRecord());  // 새 기록도 같은 문으로 등록한다
    await saveRecord(r.studentId);
  }));
  state.studentImportPreview = null;
  showToast(toAdd.length + '명 등록되었습니다.' + (skipped>0 ? ` (중복 ${skipped}명 제외)` : ''));
  render();
}
// 반의 현재 진도(과목+완료 단원)를 계산한다. 학생 홈/진도탭에서도 재사용.
function getClassProgress(classId){
  const c = DATA.classes.find(x=>x.id===classId);
  const subject = c && c.progress ? c.progress.subject : '';
  const chapters = UNIT_CHAPTERS[subject] || [];
  const doneMap = (c && c.progress && c.progress.unitsBySubject && c.progress.unitsBySubject[subject]) || {};
  const doneCount = chapters.filter(u=>doneMap[u]).length;
  const percent = chapters.length ? Math.round(doneCount/chapters.length*100) : 0;
  /* 🔴 **교재도 과목별이다** (2026-09-01 · T-1) — 단원 체크(`unitsBySubject`)와 같은 모양으로 둔다.
     반 단위로 두면 미적분Ⅰ을 마치고 확률과통계로 넘어갔을 때 **남의 과목 책이 그대로 남는다.**
     되돌아오면 그 과목에 적어 둔 책이 다시 나온다 — 단원 체크가 그러는 것과 같다. */
  const books = (c && c.progress && c.progress.booksBySubject && c.progress.booksBySubject[subject]) || [];
  return { subject, chapters, doneMap, doneCount, percent, books };
}
async function setClassProgressSubject(classId, subject){
  const c = DATA.classes.find(x=>x.id===classId);
  if(!c) return;
  if(!c.progress) c.progress = { subject:'', unitsBySubject:{}, booksBySubject:{} };
  c.progress.subject = subject;
  await dbSetDoc('classes', c.id, c);
  render();
}
/* 교재를 더한다 (2026-09-01 · T-1 · 사용자가 시켰다: 「진도탭에 어떤교재 사용중인지 입력」).
   🔴 **글자마다 render()를 부르지 않는다** — 한글 조합이 끊긴다(W-3). 누를 때 DOM에서 읽는다.
   ⚠ 같은 책을 두 번 넣지 않는다 — 빼는 쪽이 이름으로 찾기 때문이다. */
async function addClassBook(classId){
  const el = document.getElementById('cb-new');
  const title = (el ? el.value : '').trim();
  if(!title){ showToast('교재 이름을 적어 주세요.'); return; }
  const c = DATA.classes.find(x=>x.id===classId);
  if(!c || !c.progress || !c.progress.subject){ showToast('과목을 먼저 고르세요.'); return; }
  const subject = c.progress.subject;
  if(!c.progress.booksBySubject) c.progress.booksBySubject = {};
  if(!c.progress.booksBySubject[subject]) c.progress.booksBySubject[subject] = [];
  const list = c.progress.booksBySubject[subject];
  if(list.indexOf(title) >= 0){ showToast('이미 적어 둔 교재입니다.'); return; }
  list.push(title);
  await dbSetDoc('classes', c.id, c);
  await logAudit('교재 등록', '', '', c.name + ' · ' + subject + ' · ' + title);
  showToast('교재를 더했습니다.');
  render();
}
/* 🔴 **인덱스가 아니라 «그 이름»으로 뺀다** (08-27에 글귀에서 실제로 걸렸던 덫).
   ⚠ 이름은 `data-b`에 담아 `this.dataset.b`로 받는다 — onclick 문자열에 끼워 넣으면
     따옴표가 든 제목(「선생님's 노트」)에서 코드가 깨진다. escHtml은 `'`를 `&#39;`로 바꾸는데
     그것이 속성 안에서 다시 `'`로 풀리기 때문이다. */
async function removeClassBook(classId, title){
  const c = DATA.classes.find(x=>x.id===classId);
  if(!c || !c.progress || !c.progress.subject) return;
  const subject = c.progress.subject;
  const list = (c.progress.booksBySubject && c.progress.booksBySubject[subject]) || [];
  const i = list.indexOf(title);
  if(i < 0) return;
  list.splice(i, 1);
  await dbSetDoc('classes', c.id, c);
  await logAudit('교재 삭제', '', '', c.name + ' · ' + subject + ' · ' + title);
  showToast('교재를 뺐습니다.');
  render();
}
async function toggleClassProgressUnit(classId, unit, checked){
  const c = DATA.classes.find(x=>x.id===classId);
  if(!c || !c.progress || !c.progress.subject) return;
  const subject = c.progress.subject;
  if(!c.progress.unitsBySubject[subject]) c.progress.unitsBySubject[subject] = {};
  c.progress.unitsBySubject[subject][unit] = checked;
  await dbSetDoc('classes', c.id, c);
  render();
}

  }
  /* 고른 반이 없거나 지워졌으면 첫 반으로. 목록이 늘 떠 있으므로 «선택 없음» 상태를 두지 않는다. */
  let c = DATA.classes.find(x=>x.id===state.classHubId);
  if(!c){ c = DATA.classes[0]; state.classHubId = c.id; }

  /* 🔴 **「학생」 탭만은 반 껍데기를 안 쓴다** (2026-09-01 · C-13 · 사용자가 시켰다).
     사용자의 말 — 「**아예 명단탭이랑 동일하게 학생탭에서는 왼쪽 반목록이 없어도 될 것 같아**」.
     맞는 말이다. 이 화면의 모집단은 **반이 아니라 «고르개»가 정한다**(전체·반별·미배정·퇴원).
     그런데 왼쪽 반 목록과 위 반 머리(`.chub-mh`)는 «지금 이 반을 보고 있다»고 말한다 —
     「전체 학생」을 켠 순간 **화면의 두 곳이 서로 다른 말을 하게 된다.**
     ⚠ 그래서 반을 «고르는 일»은 고르개 하나가 진다. 다른 여덟 탭이 볼 반은
       고르개에서 반을 고를 때 따라 움직인다 → `rosterSetView`.
     ⚠ 서브탭 줄은 여기가 아니라 셸(`teacherHTML`)이 그리므로 그대로 남는다. */
  if(tab==='students') return teacherRosterHTML();


  let sub;
  /* 과제는 «그날 상세» 안에도 있지만 묻는 것이 다르다 —
     저기는 「그날 무슨 과제를 냈나」, 여기는 「이 반 과제가 지금 어떻게 돌아가나」다.
     제출을 확인하러 올 때 날짜를 먼저 골라야 하는 것은 말이 안 되므로 날짜에 묶지 않는다.
     **그리는 함수는 같은 것 하나를 쓴다** — 목록을 두 벌로 두면 한쪽만 고쳐진다. */
  if(tab==='homework'){
    /* ⚠ 예전에는 여기서 `classHubHomeworkShowAll=true`로 «늘 전체»를 못 박았다.
       이제 이 자리는 «그 달»이다 (2026-08-31 · C-8) — 그 판단은 함수 안에서 `standalone`이 한다.
       여기서 켜 두면 수업 기록에서 하루를 폈을 때까지 «전체»로 새어 나간다. */
    sub = (r => r.body + r.extra)(teacherClassDailyHomeworkHTML(c.id, todayStr()));

        <div class="r">

               이 버튼은 «반 밖으로» 나가는 세 번째 문이었다. 문을 하나로 모으는 것이 이 판의 뜻이다. */''}

/* =================== 반 › 상담 (2026-09-01 · C-22) ===================
   🔵 사용자가 시켰다 — 「**학생 상담하는것도 출결 성적 과제 옆에 한 탭으로 들어갔으면 좋겠어**」.
   상담 기록은 원래 «학생 상세 › 연대기 › 상담»에만 있었다. 한 사람을 열어야 보이니
   **«이 반에서 누구와 이야기를 나눴고 누구와 아직 안 나눴나»를 볼 자리가 없었다.**
   반의 다른 탭들이 전부 그 물음(반 전체를 한 판에)에 답하는데 상담만 빠져 있었던 셈이다.
   🔴 **저장하는 문은 그대로 하나다** — `addConsultLog`·`deleteConsultLog`.
     여기는 «반으로 모아 보는 창»이고, 적는 일은 오른쪽 판에서 그 함수들이 한다.
   ⚠ **달로 자르지 않는다.** 출결·성적·과제는 달마다 쌓이지만 상담은 드물게 일어난다 —
     달에 묶으면 대부분의 달이 비어 보이고 «언제 마지막으로 이야기했나»를 잃는다.
     그 물음이 이 화면의 전부라 **전 기간**으로 둔다(출결 누적 표와 같은 판단). */
function chubConsultHTML(classId){
  const roster = classRoster(classId);
  if(roster.length===0) return '<div class="fm-empty">이 반에 배정된 학생이 없습니다.</div>';
  loadConsultLogsForClass(classId);
  const loading = roster.some(s=>state.consultLogLoading[s.studentId] || !state.consultLogs[s.studentId]);
  if(loading) return '<div class="fm-empty">상담 기록을 불러오는 중입니다…</div>';

  const logOf = sid => (state.consultLogs[sid] || []).slice()
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const rows = roster.map(s=>({s, log:logOf(s.studentId)}));
  const never = rows.filter(r=>r.log.length===0).length;
  const today = todayStr();
  /* «오래된 사람»이 위다 — 이 화면에 오는 까닭이 「누구와 아직 안 나눴나」이기 때문이다.
     한 번도 없는 사람이 제일 위, 그다음이 마지막 상담이 오래된 사람이다. */
  rows.sort((a,b)=> (a.log.length?1:0) - (b.log.length?1:0)
    || String(a.log[0]?a.log[0].date:'').localeCompare(String(b.log[0]?b.log[0].date:''))
    || a.s.name.localeCompare(b.s.name,'ko'));

  return `
  <div class="es-head" style="margin:0 0 14px;flex-wrap:wrap;">
    <span class="t-sec" style="margin:0;">상담 기록
      <span style="font-weight:400;">이 반 전체 · <b>전 기간</b> (달과 무관합니다)</span></span>
    <span class="spacer"></span>
    ${never ? `<span class="badge late">아직 한 번도 없음 ${never}명</span>` : ''}
    <span style="font-size:11.5px;color:var(--dim);line-height:1.7;">
      학생을 누르면 오른쪽에서 기록합니다. <b>학생·학부모에게는 보이지 않습니다.</b></span>
  </div>
  <div class="cls-tiles" style="grid-template-columns:repeat(2,1fr);">${rows.map(({s, log})=>{
    const last = log[0];
    const days = last ? Math.round((new Date(today+'T00:00:00') - new Date(last.date+'T00:00:00'))/86400000) : null;
    return `<div class="tile ${last?'':'flag'}" style="cursor:pointer;"
        onclick="chubOpenConsult('${s.studentId}')">
      <div class="who"><b>${escHtml(s.name)}</b>
        <span>${last
          ? `<span class="mono">${escHtml(last.date)}</span> · ${escHtml(last.kind||'')}${
              days>=1 ? ` · ${days}일 전` : ' · 오늘'}`
          : '아직 상담 기록이 없습니다'}</span></div>
      <span class="sub" style="font-size:12px;white-space:nowrap;flex-shrink:0;">
        <span class="mono">${log.length}</span>건</span>
      <button class="btn q sm" style="flex-shrink:0;">기록</button>
    </div>`;
  }).join('')}</div>`;
}
/* 한 번에 다 읽고 한 번만 그린다 — 학생마다 `loadConsultLogIfNeeded`를 부르면
   스무 명이면 render()가 스무 번 돈다. */
async function loadConsultLogsForClass(classId){
  const need = classRoster(classId)
    .filter(s=>!state.consultLogs[s.studentId] && !state.consultLogLoading[s.studentId]);
  if(!need.length) return;
  need.forEach(s=>{ state.consultLogLoading[s.studentId] = true; });
  await Promise.all(need.map(async s=>{
    const v = await dbGet('consultlog:' + s.studentId, []);
    state.consultLogs[s.studentId] = Array.isArray(v) ? v : [];
    state.consultLogLoading[s.studentId] = false;
  }));
  render();
}
function chubOpenConsult(sid){ state.chubConsultId = state.chubConsultId===sid ? '' : sid; render(); }

          <p class="st-note">여기 적은 것은 <b>학생 연대기에 상담으로 쌓입니다.</b>
            학생·학부모에게는 보이지 않고, 변경 이력에도 «누구와 언제»까지만 남습니다.</p>

/* =================== 반 > 성적 — «시험» 하나의 개념 (2026-08-30 · C-4 · 사용자 요청) ===================
   🔴 **«쪽지시험»이라는 갈래를 없앴다.** 예전에는 성적을 넣는 자리가 셋이었다 —
     ① 반 > 수업 기록 > 날짜 > 성적(쪽지시험)  ② 학생 상세 > 연대기 > 성적 > 등록 폼
     ③ 오답 > 시험지 > 반 > 성적판
   셋이 만드는 것이 서로 달랐다. ①②는 `examId`가 없는 «떠 있는 점수»였고 ③만 시험지에 붙었다.
   그래서 리포트의 반 평균·등수가 «이름과 날짜가 같은가»로 짐작해야 했다.

   이제 **모든 성적은 «시험»에 붙는다.** 시험은 한 가지이고, 문항이 있느냐 없느냐만 다르다 —
     · 문항이 있는 시험 → 오답 > 시험지에서 만든다. 쌍둥이·오답률 파이프라인이 돈다
     · 점수만 있는 시험 → 여기서 만든다. 예전 «쪽지시험»이 이 자리로 흡수됐다
   둘 다 `DATA.exams`에 들어가고, 둘 다 `rec.scores[].examId`로 이어진다.

   ⚠ **입력하는 곳은 여기 하나다.** 시험지 화면에는 «보는 것»(반 평균)만 남겼다.
     넣는 문을 둘로 두면 어느 쪽이 «제 문»인지 화면이 말해 주지 못한다 — 그게 이 판의 뜻이다.
   ⚠ 옛 기록(`examId` 없는 것)은 **그대로 둔다.** 지우면 지난 리포트가 달라진다.
     연대기와 리포트는 예전대로 이름+날짜로 이어 준다. */
/* `ym`을 주면 그 달에 본 시험만. 이른 날이 앞이다. */
function classExams(classId, ym){
  return DATA.exams.filter(e=>e.classId===classId && (!ym || String(e.date||'').slice(0,7)===ym))
    .slice().sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')));
}
/* 🔵 **«만점»이 아니라 «문항수»다** (2026-08-30 · C-7 · 사용자 요청) —
   「총 문항수와 정답수로 입력되면 100점 환산되어서 표기되는 구조가 되었으면 좋겠어.
     그래야 몇 문제 틀렸는데 몇 문제 오답하고 있는지까지가 보일 것 같아.」
   ⚠ **저장되는 값은 그대로 `{score, total}`이다** — 셈이 같기 때문이다(정답수/문항수 = 점수/만점).
     바뀐 것은 «무엇을 넣는가»와 «무엇을 보여 주는가»다. 옛 기록을 건드리지 않아도 된다.
   문항이 있는 시험지는 문항수를 **알고 있으므로** 그것을 쓴다 — 손으로 고칠 일이 아니다. */
function examTotalOf(ex){
  const qn = (ex.questions||[]).length;
  if(qn) return qn;
  if(ex.scoreTotal) return ex.scoreTotal;
  for(const s of DATA.students){
    const sc = examScoreOf(state.allRecords[s.studentId], ex.id);
    if(sc && sc.total) return sc.total;
  }
  return 20;
}
/* 이 학생이 그 시험에서 «틀린 것을 몇 개나 오답으로 올렸나».
   틀린 개수(문항수 − 정답수)와 나란히 놓여야 «하다 만 것»이 보인다. */
function examWrongProgress(sid, examId){
  const hw = ((state.allRecords[sid] && state.allRecords[sid].wrongHomework) || [])
    .filter(h=>h.examId===examId);
  if(!hw.length) return null;
  return { total: hw.length, done: hw.filter(h=>h.done).length };
}
function chubScoresHTML(classId){
  loadAllRecordsIfNeeded();
