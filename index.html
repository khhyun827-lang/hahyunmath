    return `<div class="fm-empty">학생 기록을 불러오는 중입니다…</div>`;

  /* 🔵 한 달치만 (2026-08-31 · C-8) — 열이 학기 내내 늘어나면 «이번 달 이 반»을 못 읽는다. */
  const ym = chubYm();
  const exams = classExams(classId, ym);
  /* ⚠ 여기도 `classRoster`를 안 쓴다 — 시험은 «이미 있었던 일»이라 퇴원생 점수도 남아야 한다. */
  const roster = DATA.students.filter(s=>studentClassIds(s).includes(classId));
  const adding = state.scoreAddFor === classId;

  const addBar = chubMonthBarHTML(`시험 <b>${exams.length}</b>개`)
  + `<div class="es-head" style="margin:0 0 14px;flex-wrap:wrap;">
    ${adding ? `
      <span class="field" style="width:auto;">시험명
        <input class="rst-sel" id="qx-title" style="width:150px;" placeholder="예: 3주차 쪽지"></span>
      <span class="field" style="width:auto;">날짜
        ${/* 보고 있는 달의 날짜를 기본으로 준다 — 7월을 보다가 시험을 만들면 7월 것이다. */''}
        <input class="rst-sel" type="date" id="qx-date"
          value="${ym===ymNow() ? todayStr() : ym+'-01'}"></span>
      <span class="field" style="width:auto;">문항수
        <input class="rst-sel" type="number" id="qx-total" min="1" step="1" style="width:64px;text-align:right;" value="20"></span>
      <button class="btn p sm" onclick="addQuickExam('${classId}')">만들기</button>
      <button class="btn q sm" onclick="state.scoreAddFor=''; render()">취소</button>
      <span style="font-size:11.5px;color:var(--dim);line-height:1.7;flex:1;min-width:200px;">
        지금은 <b>점수만</b> 넣습니다. <b>문항은 나중에 붙여도 됩니다</b> —
        붙이면 넣어 둔 성적이 그대로 이어지고 오답 쌍둥이가 돕니다.</span>`
    : `
      <button class="btn p sm" onclick="state.scoreAddFor='${classId}'; render()">${iconSvg('plus',13)} 시험 추가</button>
      ${exams.length ? `<button class="btn sm" onclick="saveClassScores('${classId}')">전체 저장</button>` : ''}
      <span style="font-size:11.5px;color:var(--dim);line-height:1.7;flex:1;min-width:220px;">
        <b>맞은 개수</b>를 넣으면 100점으로 환산해 보여 줍니다. 빈 칸은 <b>«안 봤다»</b>입니다 —
        0점으로 세지 않고 평균에서도 뺍니다. 넣은 점수는 <b>월간 리포트</b>에 실립니다.</span>`}
  </div>`;

  if(exams.length===0)
    return addBar + `<div class="fm-empty">${ymLabel(ym)}에 본 시험이 없습니다.
      「시험 추가」로 만들거나, 문항이 있는 시험지는 <b>오답 &gt; 시험지</b>에서 만듭니다.</div>`;
  if(roster.length===0)
    return addBar + `<div class="fm-empty">이 반에 배정된 학생이 없습니다.</div>`;

  /* 학생 한 줄의 평균 — 만점이 시험마다 다르므로 «%»로 환산해서 잇는다. */
  const pctOf = (sid, ex) => {
    const sc = examScoreOf(state.allRecords[sid], ex.id);
    return sc && sc.total ? sc.score / sc.total * 100 : null;
  };
  const colAvg = ex => {
    const v = roster.map(s=>pctOf(s.studentId, ex)).filter(x=>x!==null);
    return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null;
  };

  return addBar + `<div class="hwg-wrap"><table class="hwg sg">
    <thead><tr>
      <th class="who">이름</th>
      ${exams.map(ex=>{
        const qn = (ex.questions||[]).length;
        const avg = colAvg(ex);
        return `<th class="hwg-col sg-col">
          <b title="${escHtml(ex.title)}">${escHtml(ex.title)}</b>
          <span class="due"><span class="mono">${escHtml(ex.date||'-')}</span></span>
          ${/* 문항이 있는 시험지는 문항수를 «알고 있다» — 손으로 고칠 값이 아니다.
               🔴 **「20문항」으로 붙여 쓴다** (2026-09-01 · C-15 · 사용자가 짚었다).
                 예전에는 「문항」과 「20」이 두 줄로 갈라졌다 — `.hwg-col b`가 `display:block`이라
                 안쪽 `<b class="mono">`가 통째로 줄을 바꿔 버렸다. 붙여 쓰면 그 사고도 같이 사라진다.
               ⚠ 한글이 섞이므로 `.mono`는 «숫자만» 감싼다. */''}
          <span class="n">${qn
            ? `<span class="mono">${qn}</span>문항`
            : `<input class="sg-tot mono" type="number" min="1" title="이 시험의 총 문항수"
                 id="cst-${ex.id}" value="${examTotalOf(ex)}">문항`}</span>
          <span class="n ${avg!==null && avg<60 ? 'wait' : ''}">${avg===null ? '—' : '평균 '+avg+'%'}</span>
          ${qn
            ? `<button class="sg-x" title="문항과 오답률을 오른쪽에서 봅니다"
                 onclick="sgOpenQ('${ex.id}')">문항 보기</button>`
            : `<button class="sg-x on" title="이 시험에 문항을 붙입니다. 넣어 둔 성적은 그대로 이어집니다."
                 onclick="attachExamQuestions('${ex.id}')">문항 등록</button>
               <button class="sg-x" title="이 시험을 지웁니다" onclick="deleteExam('${ex.id}')">✕</button>`}
        </th>`;
      }).join('')}
      <th class="sg-avg">평균</th>
    </tr></thead>
    <tbody>
      ${roster.map(s=>{
        const vals = exams.map(ex=>pctOf(s.studentId, ex)).filter(x=>x!==null);
        const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
        return `<tr>
          <td class="who"><span class="nm">${escHtml(s.name)}</span>${
            isWithdrawn(s) ? ' <span class="badge gone">퇴원</span>' : ''}</td>
          ${exams.map(ex=>{
            const sc = examScoreOf(state.allRecords[s.studentId], ex.id);
            const tot = examTotalOf(ex);
            const pct = sc && sc.total ? Math.round(sc.score/sc.total*100) : null;
            const missed = sc && sc.total ? Math.max(0, sc.total - sc.score) : null;
            const wp = examWrongProgress(s.studentId, ex.id);
            /* 🔵 «몇 문제 틀렸는데 몇 문제 오답하고 있나»가 한 칸에서 읽혀야 한다 (사용자 요청).
               오답을 다 못 낸 것은 색으로 알린다 — 숫자만으로는 스무 칸 중에서 안 보인다. */
            return `<td><input class="sg-in mono" type="number" step="1" min="0" max="${tot}" placeholder="—"
                id="cs-${ex.id}-${s.studentId}" value="${sc ? sc.score : ''}">
              ${pct===null ? '' : `<span class="sg-sub"><b>${pct}</b>점${
                missed ? ` · ${missed}틀림` : ''}</span>`}
              ${wp ? `<span class="sg-sub ${wp.done<wp.total?'wait':'ok'}">오답 ${wp.done}/${wp.total}</span>` : ''}
            </td>`;
          }).join('')}
          <td class="sg-avg"><span class="mono">${avg===null ? '—' : avg+'%'}</span></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}

   🔵 **사용자가 시켰다** — 「문항보기를 누르면 오답-시험지탭으로 넘어가는게 아니라

     나란히 놓는 넓은 판이라 520px에 안 들어간다. 변형문제·검토는 시험지 화면의 일이고,

          onclick="sgCloseQ(); goTeacherTab('exams'); examOpenClass(examRootId('${ex.id}'),'${ex.id}')"
          >시험지 화면에서 자세히</button>
        <div class="nav"><button class="btn sm" onclick="sgCloseQ()">닫기</button></div>

/* 🔵 **성적을 먼저 넣어 둔 시험에 나중에 문항을 붙인다** (2026-08-30 · C-7 · 사용자 요청).
   「시험지 이름이랑 점수를 먼저 입력한 상태에서 추후 시험지를 등록시켜서 연결을 지어주는
     방법은 없는거야?」 — 있다. 그리고 **«연결»이라는 일이 따로 필요 없다.**
   성적은 `examId`로 붙어 있으므로, **그 시험 문서에 문항을 채우기만 하면** 그대로 이어진다.
   그래서 새 시험지를 만드는 대신 `examDraft.examId`를 세워 등록 폼을 연다 (→ `saveExam`). */
function attachExamQuestions(examId){
  const ex = DATA.exams.find(x=>x.id===examId);
  if(!ex) return;
  examDraft = { examId, classId: ex.classId, title: ex.title, date: ex.date,
    questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };
  goTeacherTab('exams');
  state.examMode = 'new';
  showToast(`「${ex.title}」에 붙일 문항을 넣어 주세요. 넣어 둔 성적은 그대로 이어집니다.`);
  render();
}

/* 점수만 있는 시험을 만든다 — 예전 «쪽지시험»이 이 자리다.
   ⚠ 문항이 없으므로 오답 > 시험지 목록에는 안 뜬다(거기는 «문항이 무너진 곳»을 보는 화면이다). */
async function addQuickExam(classId){
  const title = (document.getElementById('qx-title').value||'').trim();
  const date  = document.getElementById('qx-date').value || todayStr();
  const total = parseFloat(document.getElementById('qx-total').value);
  if(!title){ showToast('시험명을 입력해주세요.'); return; }
  if(isNaN(total) || total<=0){ showToast('문항수를 입력해주세요.'); return; }
  const ex = {id:'ex'+Date.now(), classId, title, date, questions:[], hasFiles:false, scoreTotal:total};
  DATA.exams.unshift(ex);
  await dbSetDoc('exams', ex.id, ex);
  await logAudit('시험 등록', '', '', `${title} · ${classNameOf(classId)} · ${date} · ${total}문항 (점수만)`);
  state.scoreAddFor = '';
  /* 🔵 수업 화면에서 만들었으면 그 시험의 점수판으로 곧장 데려간다 (C-19) —
     만든 까닭이 «지금 점수를 치려고»이기 때문이다. */
  state.sessionExamId = ex.id; state.sessionExamNew = false;
  showToast(`「${title}」을 만들었습니다. 점수를 넣고 「저장」을 눌러주세요.`);
  render();
}

/* 격자 한 판을 통째로 저장한다.
   ⚠ 줄마다·칸마다 저장 버튼을 두지 않는다 — 한 번 누를 때마다 render()가 돌아
     아직 안 누른 칸이 전부 지워진다. 20명 × 시험 5개면 못 쓴다. */
async function saveClassScores(classId, examList){
  /* ⚠ **격자에 «떠 있는» 시험만 읽는다** — 달로 잘라 놓았으므로 다른 달 시험까지 훑으면
     화면에 없는 칸을 «비었다»고 보고 그 달 성적을 지워 버린다.
     🔵 수업 화면은 «그 시험 하나»만 넘긴다 (2026-09-01 · C-19) — 거기는 달 고르개가 없고
       한 번에 한 시험만 화면에 있다. 같은 규칙의 다른 표현이다: 화면에 있는 것만 읽는다. */
  const exams = examList || classExams(classId, chubYm());
  const roster = DATA.students.filter(s=>studentClassIds(s).includes(classId));
  /* 만점부터 거둔다 — 점수를 읽기 전에 시험마다 만점이 정해져 있어야 한다. */
  const totals = {};
  for(const ex of exams){
    /* 문항이 있는 시험지는 칸이 없다 — 문항수를 알고 있으므로 그것을 쓴다. */
    const qn = (ex.questions||[]).length;
    if(qn){ totals[ex.id] = qn; continue; }
    const el = document.getElementById('cst-'+ex.id);
    const t = parseFloat(el ? el.value : '');
    if(isNaN(t) || t<=0){ showToast(`「${ex.title}」의 문항수를 확인해주세요.`); return; }
    totals[ex.id] = t;
    if(ex.scoreTotal !== t){ ex.scoreTotal = t; await dbSetDoc('exams', ex.id, ex); }
  }
  let saved = 0, cleared = 0; const over = [];
  for(const st of roster){
    let touched = false;
    const rec = await loadRecord(st.studentId);
    for(const ex of exams){
      const el = document.getElementById('cs-'+ex.id+'-'+st.studentId);
      if(!el) continue;
      const raw = el.value.trim();
      const idx = rec.scores.findIndex(x=>x.examId===ex.id);
      if(raw===''){
        if(idx>=0){ rec.scores.splice(idx,1); cleared++; touched = true; }
        continue;                       // 원래 없던 칸은 건드리지 않는다
      }
      const score = parseFloat(raw);
      if(isNaN(score) || score<0) continue;
      /* 🔴 넘치면 «건너뛴다» — 알림만 띄우고 저장하면 440% 같은 값이 리포트까지 간다. */
      if(score>totals[ex.id]){ over.push(st.name + ' · ' + ex.title); continue; }
      const entry = {name: ex.title, date: ex.date || todayStr(), score, total: totals[ex.id], examId: ex.id};
      if(idx>=0){
        const o = rec.scores[idx];
        if(o.score===entry.score && o.total===entry.total && o.name===entry.name && o.date===entry.date) continue;
        rec.scores[idx] = entry;
      } else rec.scores.push(entry);
      saved++; touched = true;
    }
    if(!touched) continue;
    rec.scores.sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')));
    await saveRecord(st.studentId);
    state.allRecords[st.studentId] = rec;
  }
  if(!saved && !cleared){
    showToast(over.length
      ? `저장하지 않았습니다 — 맞은 개수가 문항수보다 큽니다 (${over.join(', ')}).`
      : '바뀐 점수가 없습니다.');
    if(over.length) return;
    return;
  }
  await logAudit('시험 성적 등록', '', '', `${classNameOf(classId)} · ${saved}건 저장`);
  showToast(`${saved}건을 저장했습니다.`
    + (cleared ? ` ${cleared}건은 비워서 지웠습니다.` : '')
    + (over.length ? ` ⚠ ${over.length}칸은 맞은 개수가 문항수보다 커서 **안 넣었습니다** (${over.join(', ')}).` : ''));
  render();
}

/* =================== 반 화면의 «달 고르개» (2026-08-31 · C-8 · 사용자 요청) ===================
   「출결, 성적, 과제, 수업기록 다 한 달치로 보이게 해 주고 이전 달로 넘어갈 수 있도록 해줘.」
   🔴 **격자가 달을 넘나들면 읽히지 않는다** — 출결 격자가 08/28부터 07/17까지 스무 회를
     한 줄에 늘어놓고 있었다. 「이번 달 이 반이 어땠나」를 물으러 온 사람에게
     지난달 열일곱 칸이 함께 밀려든다.
   🔵 **달은 네 화면이 «함께» 본다** (\`state.classHubYm\`) — 8월 출결을 보다 성적으로 옮기면
     8월 성적이 나와야 한다. 탭마다 따로 두면 «지금 몇 월을 보고 있나»를 매번 잃는다.
     이것도 「반·날짜는 화면이 아니라 필터다」의 한 자락이다. */
function chubYm(){ return state.classHubYm || ymNow(); }
function chubSetYm(delta){
  const next = shiftYm(chubYm(), delta);
  /* 아직 오지 않은 달로는 못 간다 — 그 달에는 아무 일도 일어나지 않았다. */
  if(next > ymNow()) return;
  state.classHubYm = next === ymNow() ? '' : next;
  /* 달이 바뀌면 그 달 밖의 «펴 놓은 것»은 뜻을 잃는다. 함께 접는다. */
  state.attOpenDate = ''; state.classHubDate = '';
  render();
}
/* 네 화면이 같은 줄을 쓴다. \`extra\`는 그 화면만의 곁말(«수업 8회» 같은 것). */
function chubMonthBarHTML(extra){
  const ym = chubYm();
  const isNow = ym === ymNow();
  return `<div class="chub-mbar">
    <button class="btn q sm" onclick="chubSetYm(-1)" title="이전 달">${iconSvg('chevL',13)}</button>
    <b>${ymLabel(ym)}</b>
    <button class="btn q sm" ${isNow?'disabled title="아직 오지 않은 달입니다"':'title="다음 달"'}
      onclick="chubSetYm(1)">${iconSvg('chevR',13)}</button>
    ${isNow ? '' : `<button class="btn q sm" onclick="state.classHubYm=''; state.attOpenDate=''; state.classHubDate=''; render()">이번 달</button>`}
    ${extra ? `<span class="mb-x">${extra}</span>` : ''}
  </div>`;
}
/* 그 달에 든 수업일 — 이른 날이 앞이다.
   ⚠ \`generateClassSessionDates\`는 «오늘에서 뒤로 n회»라 달을 물어보는 데는 못 쓴다.
     달의 1일부터 말일까지 훑어서 요일이 맞는 날을 고른다. */
function classSessionDatesInMonth(schedule, ym){
  const days = parseScheduleDays(schedule);
  if(days.length===0) return [];
  const [y, m] = ym.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const out = [];
  for(let d=1; d<=last; d++){
    const dt = new Date(y, m-1, d);
    if(days.includes(dt.getDay())) out.push(ymdLocal(dt));
  }
  return out;
}

/* =================== 반 > 출결 — «한눈에»가 먼저다 (2026-08-30 · C-6) ===================
   🔴 **날짜 하나의 입력 화면을 앞에 세우면 안 된다** (사용자가 짚었다) —
     「데일리로 출석 입력하는 건 수업에서 할 수 있으니까, 반별 출석을 한눈에 파악할 수 있는
     구조가 우선이 되면서 특정 날짜의 출결을 수정도 할 수 있으면 좋겠어.」
     C-5에서 두 겹 화면을 없애면서 **그 자리에 «그날 입력»을 그대로 세운 것이 잘못이었다.**
     이 탭이 답해야 할 물음은 «누가 얼마나 빠졌나»이지 «오늘 출결을 넣자»가 아니다.
     오늘 넣는 일은 「수업」 탭이 한다.

   그래서 **격자가 먼저**다 — 세로 학생 × 가로 수업일. 성적·과제 격자와 같은 결이다.
   ⚠ **고치는 길은 열어 둔다** — 날짜 열 머리를 누르면 그날 입력이 격자 «아래»로 펴진다.
     (과제 격자에서 열 머리를 눌러 명단을 펴는 것과 같은 장치다.) */
function chubAttendanceHTML(classId){
  loadAllRecordsIfNeeded();
  const c = DATA.classes.find(x=>x.id===classId);
  if(!(c && parseScheduleDays(c.schedule).length)){
    return `<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.8;">
      반 일정(요일)이 없어 수업 날짜를 만들 수 없습니다.<br>설정 &gt; 반 추가에서 「월,수,금 7시~9시」처럼 넣어 주세요.</div>`;
  }
  if(!state.allRecordsLoaded) return `<div class="fm-empty">학생 기록을 불러오는 중입니다…</div>`;
  const roster = classRoster(classId);
  if(roster.length===0) return `<div class="fm-empty">이 반에 배정된 학생이 없습니다.</div>`;

  const today = todayStr();
  const ym = chubYm();
  /* 🔵 한 달치만 세운다 (2026-08-31 · C-8) — 이른 날이 왼쪽이다.
     달을 잘라 놓으면 «1일에서 말일로» 읽는 것이 자연스럽다(격자가 곧 그 달의 달력이다).
     ⚠ 앞으로 올 수업은 세우지 않는다 — 아직 있지도 않은 날이다. */
  const cols = classSessionDatesInMonth(c.schedule, ym).filter(d=>d<=today);
  const open = state.attOpenDate && cols.includes(state.attOpenDate) ? state.attOpenDate : '';

  /* 🔴 **이 표는 «이 반» 것만 말한다** (2026-09-01 · E-1). 학생이 특강도 들으면 그 줄이
     여기 섞여서는 안 된다 — 「고2 미적분Ⅰ 출결표」에 토요일 특강 결석이 뜨면 거짓이다. */
  const mainOf = {};
  roster.forEach(st=>{ mainOf[st.studentId] = studentMainClassId(st); });
  const attOf = (sid, date) =>
    attOn(state.allRecords[sid], date, classId, mainOf[sid]);
  /* 출석률 = 「퇴원」을 뺀 기록 중 «결석이 아닌» 비율. 명단·신호가 쓰는 셈과 같은 것이다. */
  const rateOf = sid => attRateOf(attOfClass(state.allRecords[sid], classId, mainOf[sid]));
  const MARK = {'출석':'출', '지각':'지', '조퇴':'조', '결석':'결', '퇴원':'퇴'};

  const filledCols = cols.filter(d=>roster.some(st=>attOf(st.studentId, d))).length;
  return `
  ${chubMonthBarHTML(cols.length
    ? `수업 <b>${cols.length}</b>회 · 출결 넣은 날 <b>${filledCols}</b>회`
    : '지난 수업이 없습니다')}
  <div class="es-head" style="margin:0 0 14px;flex-wrap:wrap;">
    <span class="spacer"></span>
    <span style="font-size:11.5px;color:var(--dim);line-height:1.7;text-align:right;">
      <b>날짜를 누르면</b> 그날 출결을 아래에서 고칠 수 있습니다.
      오늘 수업의 출결은 <b>「수업」 탭</b>에서 넣습니다.</span>
  </div>

  ${cols.length===0 ? '<div class="fm-empty">이 달에는 지난 수업이 없습니다.</div>' : `
  <div class="hwg-wrap"><table class="hwg ag">
    <thead><tr>
      <th class="who">이름</th>
      ${cols.map(d=>{
        const filled = roster.filter(s=>attOf(s.studentId, d)).length;
        const absent = roster.filter(s=>{ const a = attOf(s.studentId, d); return a && a.status==='결석'; }).length;
        const wd = WEEKDAY_LABEL[new Date(d+'T00:00:00').getDay()];
        /* 🔵 열 머리는 «한 줄»이다 (2026-09-01) — 날짜와 요일이 나란히 선다.
           ⚠ 상태 줄(「미입력」·「입력 3/4」·「완료」)을 뺐다 — 바로 아래 격자가 같은 말을
           하고 있었다(빈 칸은 «·», 결석은 붉은 「결」). 머리가 석 줄에서 한 줄로 줄어
           20명 반이 한 판에 들어온다. **사용자가 짚은 것이다 (2026-09-01).**
           «아직 아무도 안 넣은 날»만 흐리게 눌러 둔다 — 자리를 한 칸도 안 쓰는 신호다.
           수를 세는 말은 title로 내렸다 — 눌러 보기 전에도 알 길이 남는다.
           ⚠ 달은 안 적는다 — 격자가 이미 한 달치이고 그 달은 위 고르개가 말한다.
           ⚠ 요일에 .mono를 걸지 말 것 — 한글 글리프가 없어 두부가 된다. 숫자만 감싼다. */
        return `<th class="hwg-col ag-col ${d===open?'on':''}${filled===0?' empty':''}"
          title="${d} · ${wd}요일 — 누르면 이 날짜를 고칩니다${
            filled===0 ? ' (아직 아무도 안 넣었습니다)'
            : filled<roster.length ? ` (${filled}/${roster.length} 넣었습니다)`
            : (absent?` (결석 ${absent}명)`:'')}"
          onclick="state.attOpenDate='${d===open?'':d}'; render()">
          <b><span class="mono">${+d.slice(8)}</span><i>${wd}</i>${d===today?'<i class="td">오늘</i>':''}</b>
        </th>`;
      }).join('')}
      <th class="ag-rate">출석률</th>
    </tr></thead>
    <tbody>
      ${roster.map(s=>{
        const r = rateOf(s.studentId);
        return `<tr>
          <td class="who"><span class="nm">${escHtml(s.name)}</span></td>
          ${cols.map(d=>{
            const a = attOf(s.studentId, d);
            const extra = a && (a.reason || a.videoUrl || a.note);
            return `<td class="${d===open?'on':''}">${a
              ? `<span class="ag-m ${attStatusClass(a.status)}" title="${escHtml(
                  a.status + (a.reason?' · '+a.reason:'') + (a.note?' · '+a.note:'') + (a.videoUrl?' · 보충 영상 있음':''))}"
                  >${MARK[a.status]||a.status.slice(0,1)}${extra?'<i class="dotmark"></i>':''}</span>`
              : '<span class="ag-m none" title="미입력">·</span>'}</td>`;
          }).join('')}
          <td class="ag-rate"><span class="mono ${r!==null && r<80 ? 'down':''}">${r===null?'—':r+'%'}</span></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`}

  ${/* 🔵 **고치는 판은 «오른쪽»에서 열린다** (2026-09-01 · 사용자가 시켰다).
       C-6에서는 격자 «아래»로 폈다. 사용자의 말 —
       **「날짜를 눌렀을때 수정하는게 아래 펼쳐지는게 아니라 오른쪽에 뜨는걸로」**.
       과제 격자가 이미 그렇게 하고 있었고(D-1), 같은 격자에서 여는 둘이
       서로 다른 자리에 뜨면 «어디를 눌렀길래 이게 떴나»를 매번 다시 읽어야 한다.
       그리는 곳은 여기가 아니라 `render()`다 → `attDateDrawerHTML`. */''}

  ${/* ⚠ 누적은 «전 기간»이다 — 달 고르개를 따라가지 않는다. 위 격자가 그 달을 말하고,
       이 표는 «지금까지 통틀어»를 말한다. 둘 다 달에 묶으면 «전체가 어떤가»를 볼 곳이 없어진다. */''}
  <div class="t-sec" style="margin-top:28px;">출결 누적
    <span style="font-weight:400;">이 반 전체 · <b>전 기간</b> (달과 무관합니다)</span></div>
  <div style="overflow-x:auto;"><table class="es-tb" style="max-width:520px;">
    <thead><tr><th>학생</th>${ATT_STATUSES.map(st=>`<th style="text-align:right;">${st}</th>`).join('')}
      <th style="text-align:right;">출석률</th></tr></thead>
    <tbody>${roster.map(s=>{
      const list = attOfClass(state.allRecords[s.studentId], classId, mainOf[s.studentId]);
      const r = rateOf(s.studentId);
      return `<tr><td class="fm-nm">${escHtml(s.name)}</td>${
        ATT_STATUSES.map(st=>`<td style="text-align:right;"><span class="mono">${list.filter(a=>a.status===st).length}</span></td>`).join('')}
        <td style="text-align:right;"><span class="mono ${r!==null && r<80?'down':''}">${r===null?'—':r+'%'}</span></td></tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

/* =================== 반 > 수업 기록 — 하루하루의 «전부» (2026-08-30 · C-6) ===================
   🔴 **출결 아래에 붙여 두었던 것을 다시 뺐다** (사용자가 짚었다) —
     「출결만 보이는 것도 아니고 하루하루에 대해 전체적으로 시험이든 뭐든 기록되는 거니까
     출결 탭에 있는 것도 맞지 않는 것 같아.」 맞는 말이다.
     이 목록이 답하는 것은 «그날 무슨 일이 있었나»이고, 출결은 그중 하나일 뿐이다.
   ⚠ **C-5의 두 겹 화면으로 되돌아가지 않는다** — 누르면 «들어가는» 것이 아니라
     그 줄 아래로 펴진다. 목록을 잃지 않은 채로 그날을 읽는다. */
function chubLogHTML(classId){
  loadAllRecordsIfNeeded();
  loadSessionNoteIfNeeded(classId);
  const c = DATA.classes.find(x=>x.id===classId);
  if(!(c && parseScheduleDays(c.schedule).length)){
    return `<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.8;">
      반 일정(요일)이 없어 수업 날짜를 만들 수 없습니다.<br>설정 &gt; 반 추가에서 「월,수,금 7시~9시」처럼 넣어 주세요.</div>`;
  }
  /* 🔵 한 달치만 (2026-08-31 · C-8). 목록은 «최근이 위»라 뒤집는다 — 격자와 방향이 다른 이유는
     격자가 «달력»이고 목록이 «일지»이기 때문이다. 일지는 최근 것부터 읽는다. */
  const dates = classSessionDatesInMonth(c.schedule, chubYm()).filter(d=>d<=todayStr()).reverse();
  const facts = dates.map(d=>({ date:d, f:chubSessionFacts(classId, d) }));
  const filter = state.classHubLogFilter || '';
  const match = x => filter==='memo' ? !!x.f.memo
                   : filter==='absent' ? x.f.absent>0
                   : filter==='hw' ? x.f.hws.length>0
                   : true;
  const shown = facts.filter(match);
  const pill = (key, label, n) =>
    `<a class="pill ${filter===key?'on':''}" onclick="state.classHubLogFilter='${key}'; render()">${label} <b>${n}</b></a>`;
  const open = state.classHubDate;

  return `
  ${chubMonthBarHTML(`수업 <b>${dates.length}</b>회`)}
  <div class="chub-fbar">
    ${pill('', '전체', facts.length)}
    ${pill('memo', '메모 있음', facts.filter(x=>x.f.memo).length)}
    ${pill('absent', '결석 발생', facts.filter(x=>x.f.absent>0).length)}
    ${pill('hw', '과제 배포', facts.filter(x=>x.f.hws.length>0).length)}
    <span class="rst-cnt">${state.allRecordsLoading ? '기록 불러오는 중…' : '최근 순'}</span>
    ${/* 보충 수업처럼 일정 밖의 날짜를 열 문 하나는 남긴다. */''}
    <span class="field rst-selwrap" style="width:auto;">${iconSvg('calendar',13)}
      <input type="date" class="rst-sel" style="width:132px;" title="일정 밖의 날짜도 열 수 있습니다"
        onchange="if(this.value){ state.classHubDate=this.value; render(); }">
    </span>
  </div>
  ${shown.length===0 ? `<div style="padding:48px 0;text-align:center;color:var(--dim);font-size:12.5px;">${
      dates.length===0 ? '이 달에는 지난 수업이 없습니다.' : '이 조건에 맞는 수업이 없습니다.'}</div>`
  : shown.map(({date, f})=>{
    const isToday = date===todayStr();
    /* 달 머리(8월 · n회)는 뺐다 — 목록이 이제 한 달치라 달이 안 바뀐다. 위 고르개가 그 말을 한다. */
    const on = date===open;
    return `<div class="chub-sess ${on?'on':''}" onclick="state.classHubDate='${on?'':date}'; render()">
      <div class="when">
        <div class="d">${date.slice(5).replace('-','/')}</div>
        <div class="w">${WEEKDAY_LABEL[new Date(date+'T00:00:00').getDay()]}요일${isToday?' · 오늘':''}</div>
      </div>
      <div class="mid">
        <div class="att">
          ${f.total===0 ? '<span class="sum muted">배정된 학생이 없습니다</span>'
            : f.filled===0 ? '<span class="badge">출결 미입력</span>'
            : `<span class="dots" title="${escHtml(f.marks.map(m=>m.name+' '+(m.status||'미입력')).join(' · '))}">${
                f.marks.map(m=>`<i class="${m.status?attStatusClass(m.status):''}"></i>`).join('')}</span>
               <span class="sum">출석 <b>${f.cnt['출석']||0}</b>${
                f.cnt['지각']?` · 지각 <b>${f.cnt['지각']}</b>`:''}${
                f.cnt['조퇴']?` · 조퇴 <b>${f.cnt['조퇴']}</b>`:''}${
                f.absent?` · 결석 <b>${f.absent}</b>`:''}</span>
               ${f.filled<f.total?`<span class="badge late">미입력 ${f.total-f.filled}</span>`:'<span class="badge ok">완료</span>'}`}
        </div>
        ${f.memo ? `<div class="memo">${escHtml(f.memo)}</div>` : ''}
      </div>
      <div class="tags">
        ${f.hws.length ? f.hws.map(h=>`<span class="tag">${escHtml(h.title)}</span>`).join('') : ''}
        ${f.scored ? `<span>성적 <b class="mono">${f.scored}</b>명 입력됨</span>` : ''}
      </div>
    </div>`
    + (on ? `<div class="chub-day" onclick="event.stopPropagation()">${chubDayHTML(classId, date)}</div>` : '');
  }).join('')}`;
}

/* 그날 하나 — 목록 «아래»로 펴진다. 읽는 자리다.
   ⚠ 출결 «입력»은 여기 두지 않는다 — 출결 탭(격자)과 수업 탭이 그 일을 한다.
     여기까지 입력을 두면 또 문이 늘고, 그게 이 판 전체가 고치고 있는 것이다. */
function chubDayHTML(classId, date){
  const exams = DATA.exams.filter(e=>e.classId===classId && e.date===date);
  const hws = DATA.assignments.filter(a=>a.classId===classId && (a.createdAt===date || a.dueDate===date));
  const memo = sessionMemoHTML(classId, date);
  const roster = classRoster(classId);
  const att = roster.map(s=>({
    s, a: attOn(state.allRecords[s.studentId], date, classId, studentMainClassId(s))
  }));
  const notable = att.filter(x=>x.a && x.a.status!=='출석');
  return `
  <div class="chub-day-grid">
    <div>
      <div class="t-sec">출결</div>
      ${att.every(x=>!x.a)
        ? `<div class="st-empty">아직 넣지 않았습니다 — <b>출결 탭</b>에서 이 날짜를 눌러 넣습니다.</div>`
        : notable.length===0
          ? `<div class="st-empty">전원 출석했습니다.</div>`
          : notable.map(({s, a})=>`<div class="st-row">
              <div class="t"><b>${escHtml(s.name)}</b>
                <span>${a.reason ? escHtml(a.reason) : '사유 없음'}${a.note ? '<s>·</s>'+escHtml(a.note) : ''}</span></div>
              <div class="v">${attBadge(a.status)}${a.videoUrl
                ? ` <a class="btn q sm" href="${escHtml(a.videoUrl)}" target="_blank" rel="noopener">보충 영상</a>` : ''}</div>
            </div>`).join('')}

      <div class="t-sec" style="margin-top:22px;">그날 시험</div>
      ${exams.length===0 ? '<div class="st-empty">이 날짜로 등록된 시험이 없습니다.</div>'
        : exams.map(e=>`<div class="st-row">
            <div class="t"><b>${escHtml(e.title)}</b>
              <span>${(e.questions||[]).length ? '문항 '+e.questions.length+'개' : '점수만 있는 시험'}</span></div>
            <div class="v"><button class="btn q sm" onclick="state.classHubTab='scores'; render()">성적 보기</button></div>
          </div>`).join('')}

      <div class="t-sec" style="margin-top:22px;">그날 과제</div>
      ${hws.length===0 ? '<div class="st-empty">이 날짜에 낸 과제가 없습니다.</div>'
        : hws.map(h=>`<div class="st-row">
            <div class="t"><b>${escHtml(h.title)}</b><span>마감 ${escHtml(h.dueDate||'-')}</span></div>
            <div class="v"><button class="btn q sm" onclick="state.classHubTab='homework'; render()">과제 보기</button></div>
          </div>`).join('')}
    </div>
    <div>${memo.body}${memo.bar}</div>
  </div>`;
}

  </aside>`;
}

/* ── 진도 (design-v1/06-classes) ──
   시안은 단원을 «미분/적분» 같은 대단원으로 묶고 각 단원에 진행 날짜·회차를 달았다.
   도메인에 그 둘이 없다 — UNIT_CHAPTERS는 과목별 «평평한» 단원 목록이고 회차 개념도 없다.
   없는 것을 지어내지 않고, 대신 «다음에 나갈 단원»만 표시한다 (체크 안 된 첫 단원).
   그건 실제로 도출되는 값이라 거짓이 아니다. */
function chubProgressHTML(classId){
  loadAllRecordsIfNeeded();
  const { subject, chapters, doneMap, doneCount, percent, books } = getClassProgress(classId);
  const roster = classRoster(classId);
  const stats = roster.map(s=>rosterStats(s));
  const live = stats.filter(st=>!st.withdrawn);
  const avgOf = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : null;
  const avgScore = avgOf(live.map(st=>st.scores.length ? st.scores[st.scores.length-1] : null).filter(v=>v!==null));
  const avgAtt   = avgOf(live.map(st=>st.attPct).filter(v=>v!==null));
  const flagged  = live.filter(st=>signalOf(st)).length;
  const loading  = !state.allRecordsLoaded;
  const nextIdx  = chapters.findIndex(u=>!doneMap[u]);

  const kpis = `<div class="kpis" style="flex-shrink:0;">
    <div class="kpi"><div class="k">진도</div><div class="v">${subject?percent:'—'}<s>${subject?'%':''}</s></div></div>
    <div class="kpi"><div class="k">완료 단원</div><div class="v">${subject?doneCount:'—'}<s>${subject?'/'+chapters.length:''}</s></div></div>
    <div class="kpi"><div class="k">재원</div><div class="v">${live.length}<s>명</s></div></div>
    <div class="kpi"><div class="k">최근 성적 평균</div><div class="v">${loading?'…':(avgScore===null?'—':avgScore)}<s>${avgScore===null?'':'/100'}</s></div></div>
    <div class="kpi"><div class="k">평균 출석률</div><div class="v">${loading?'…':(avgAtt===null?'—':avgAtt)}<s>${avgAtt===null?'':'%'}</s></div></div>
    <div class="kpi"><div class="k">신호 있는 학생</div><div class="v ${flagged?'down':''}">${loading?'…':flagged}<s>/${live.length}</s></div></div>
  </div>`;

  if(!subject){
    return kpis + `<div style="margin-top:22px;max-width:300px;">
      <div class="t-sec">과목</div>
      <span class="field rst-selwrap" style="width:100%;">
        <select class="rst-sel" style="flex:1;" onchange="setClassProgressSubject('${classId}', this.value)">
          <option value="">-- 과목 선택 --</option>
          ${UNITS.map(u=>`<option value="${u}">${u}</option>`).join('')}
        </select>
      </span>
      <div style="margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.7;">과목을 고르면 그 과목의
        <b>단원 체크리스트</b>와 <b>교재 칸</b>이 나옵니다.</div>
    </div>`;
  }

  return kpis + `
  <div style="display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap;">
    <span class="field rst-selwrap" style="width:210px;">
      <select class="rst-sel" style="flex:1;" onchange="setClassProgressSubject('${classId}', this.value)">
        ${UNITS.map(u=>`<option value="${u}" ${subject===u?'selected':''}>${u}</option>`).join('')}
      </select>
    </span>
    ${/* ⚠ 단원명은 낱말이라 mono에 넣지 않는다 — 「합 성 함 수」처럼 벌어진다 (8절) */''}
    <span class="t-meta">${nextIdx>=0 ? `다음 단원 <b>${escHtml(chapters[nextIdx])}</b>` : '<b>모든 단원을 마쳤습니다.</b>'}</span>
  </div>
  ${/* 교재 (2026-09-01 · T-1). 단원 목록 «위»에 둔다 — 「무슨 책으로」가 「어디까지」보다 먼저다. */''}
  <div style="margin-top:20px;max-width:620px;">
    <div class="t-sec" style="margin:0 0 8px;">교재
      <span style="font-weight:400;color:var(--dim);">${escHtml(subject)}에서 쓰는 책</span></div>
    ${books.length ? `<div class="cb-list">${books.map(t=>`
      <span class="cb-item"><span class="t">${escHtml(t)}</span>
        <button type="button" class="x" data-b="${escHtml(t)}" title="빼기"
          onclick="removeClassBook('${classId}', this.dataset.b)">×</button></span>`).join('')}</div>`
      : '<div class="cb-none">아직 적어 둔 교재가 없습니다.</div>'}
    ${/* 🔴 **`!event.isComposing`이 없으면 한글이 반쯤 든 채로 등록된다** (W-3의 새 얼굴).
         「개념서」를 치고 **조합을 끝내려고 누르는 Enter**도 keydown을 쏜다 — 그 한 번에
         책이 들어가 버리고, 이어 치려던 글자는 갈 곳을 잃는다. 영문만 쳐 보면 절대 안 걸린다. */''}
    <div class="cls-form" style="margin-top:10px;">
      <label style="flex:1;min-width:230px;"><span>교재 이름</span>
        <input id="cb-new" placeholder="예: [2026] 개념서 미적분Ⅰ"
          onkeydown="if(event.key==='Enter' && !event.isComposing){ event.preventDefault(); addClassBook('${classId}'); }"></label>
      <button class="btn p sm" onclick="addClassBook('${classId}')">추가</button>
    </div>
    <p class="st-note">여러 권이면 <b>하나씩 더합니다</b> — 개념서 · 워크북처럼 함께 쓰는 책을 나란히 둡니다.<br>
      <b>과목마다 따로 기억합니다</b> — 과목을 바꾸면 그 과목에 적어 둔 교재가 나오고,
      돌아오면 그대로 있습니다.</p>
  </div>
  <div style="margin-top:20px;">
    ${chapters.map((u,i)=>{
      const done = !!doneMap[u];
      const cls = done ? 'done' : (i===nextIdx ? 'now' : 'wait');
      return `<label class="chub-u ${cls}">
        <span class="ck">✓</span>
        <input type="checkbox" style="display:none;" ${done?'checked':''}
          onchange="toggleClassProgressUnit('${classId}','${escHtml(u)}', this.checked)">
        <span class="no mono">${String(i+1).padStart(2,'0')}</span>
        <span class="t">${escHtml(u)}</span>
        <span class="st">${done ? '<span class="badge ok">완료</span>'
          : i===nextIdx ? '<span class="badge consult">다음</span>' : ''}</span>
      </label>`;
    }).join('')}
  </div>`;
}

function classOptionsHTML(selectedId){
  return `<option value="">미배정</option>` + DATA.classes.map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${c.name}</option>`).join('');
}

/* ---------- 학생 상세 (반 관리 > 학생 명단에서 진입) ---------- */
/* =================== 학생 상세 (design-v1/03-student) ===================
   디자인 시스템의 «기준 화면»이고, 이 시스템 전체가 그 사상 위에 있다 —
   **탭을 없애고 하나의 연대기로 합친다.** 출결·성적·과제·오답·퀴즈·질문·클리닉이
   종류를 가리지 않고 날짜 순으로 한 줄기에 쌓인다. 「이 학생에게 무슨 일이 있었나」는
   원래 시간 순 질문이지, 탭을 일곱 번 눌러 맞춰 볼 질문이 아니다.

   **탭을 없애면서 잃을 뻔한 것 — 입력.** 예전 탭에는 성적 추가/삭제, 출결 추가/삭제,
   과제 완료 토글, 기본정보 수정, 학생 삭제, 채팅이 들어 있었다. 전부 살렸다.
     · 연대기 위의 갈래(전체/출결/성적/과제·오답/질문·클리닉)를 고르면
       그 갈래의 «입력 폼»이 연대기 위에 붙는다 — 무엇을 더할지가 분명해진다
     · 기본정보·채팅은 연대기와 성격이 다르다(하나는 폼, 하나는 말풍선).
       오른쪽 «빠른 작업»에서 모드로 전환한다
   신호는 별도 보드를 만들지 않고 여기 근거 문장으로 앉힌다 (A5에서 흡수). */

const SD_FILTERS = [['all','전체'],['att','출결'],['score','성적'],['hw','과제·오답'],['qna','질문·클리닉'],['consult','상담']];

/* =================== 상담 일지 (2026-08-09) ===================
   시안 03의 연대기에 「상담」 갈래가 있었는데 도메인에 상담 «기록»이 없어서 비어 있었다.
   (`DATA.consults`는 홈페이지로 들어온 «신청»이지 나눈 이야기가 아니다.)
   학생 메모·수업 메모와 같은 방식으로 만든다 — 컬렉션을 늘리지 않고 `kv/consultlog:{학생id}`에 배열 하나.

   **메모(한 덩어리)와 다른 것은 «날짜가 붙는다»는 점이다.** 상담은 사건이라 연대기에 쌓여야 하고,
   메모는 «늘 참인 한 가지»라 옆에 붙어 있어야 한다. 둘은 서로를 대신하지 못한다. */
const CONSULT_KINDS = ['전화', '대면', '문자'];

async function loadConsultLogIfNeeded(sid){
  if(!sid || state.consultLogs[sid] || state.consultLogLoading[sid]) return;
  state.consultLogLoading[sid] = true;
  const v = await dbGet('consultlog:' + sid, []);
  state.consultLogs[sid] = Array.isArray(v) ? v : [];
  state.consultLogLoading[sid] = false;
  render();
}
async function addConsultLog(sid){
  const date = document.getElementById('cs-date').value || todayStr();
  const kind = document.getElementById('cs-kind').value;
  const text = document.getElementById('cs-text').value.trim();
  if(!text){ showToast('상담 내용을 적어 주세요.'); return; }
  const list = (state.consultLogs[sid] || []).concat([{ id:'cl'+Date.now(), date, kind, text, at: nowStamp() }]);
  state.consultLogs[sid] = list;
  await dbSet('consultlog:' + sid, list);
  /* 무엇을 나눴는지는 변경 이력에 남기지 않는다 — 상담에는 사적인 말이 들어가고
     변경 이력은 조교도 본다 (학생 메모와 같은 판단). */
  await logAudit('상담 기록', sid, studentNameOf(sid), `${date} ${kind}`);
  showToast('상담을 기록했습니다.');
  render();
}
async function deleteConsultLog(sid, id){
  if(!confirm('이 상담 기록을 지울까요?')) return;
  const list = (state.consultLogs[sid] || []).filter(x=>x.id!==id);
  state.consultLogs[sid] = list;
  await dbSet('consultlog:' + sid, list);
  await logAudit('상담 기록 삭제', sid, studentNameOf(sid), '');
  showToast('상담 기록을 지웠습니다.');
  render();
}

/* 한 사람에게 일어난 일을 전부 «날짜가 붙은 사건»으로 바꾼다.
   kind는 갈래 필터용, type은 화면에 찍는 이름이다. */
/* dot — 연대기 레일에 찍히는 점의 색. 시안이 넷에만 색을 물린 것과 같은 규칙이다.
   출결과 성적, 클리닉만 칠하고 나머지는 회색으로 둔다 (상태는 오른쪽 뱃지가 말한다). */
const SD_ATT_DOT = { '출석':'k-ok', '지각':'k-late', '조퇴':'k-late', '결석':'k-no' };

function studentTimeline(s, rec){
  const sid = s.studentId, ev = [];
  const push = (date, kind, type, title, desc, badge, act, dot) => { if(date) ev.push({date, kind, type, title, desc, badge, act, dot}); };

  /* 삭제는 «배열 인덱스»로 지운다 — 연대기는 날짜순으로 다시 세우므로 원래 인덱스를 들고 다녀야 한다.
     이걸 빠뜨리면 탭에 있던 성적·출결 삭제가 사라진다. */
  /* 🔴 **어느 반 것인지 적는다** (2026-09-02 · E-5). 반이 여럿인 학생은 같은 날 줄이 둘 서는데
     («정규 지각 / 특강 결석» 같은 날이 실제로 있다) 화면에는 「지각」 「결석」만 나란히 떠서
     **어느 것이 어느 반인지 알 길이 없었다.**
     ⚠ 반이 하나뿐인 학생에게는 안 적는다 — 열에 아홉은 그쪽이고, 늘 적으면 잡음이 된다. */
  const attMulti = studentClassIds(s).length > 1;
  const attMain = studentMainClassId(s);
  (rec.attendance||[]).forEach((a,i)=>{
    const where = attMulti
      ? ` <s style="text-decoration:none;color:var(--dim);font-weight:400;">${escHtml(classNameOf(attClassOf(a, attMain)))}</s>`
      : '';
    push(a.date, 'att', '출결', a.status + where + (a.reason ? ' — ' + escHtml(a.reason) : ''),
      a.note ? escHtml(a.note) : '', ['출석','지각','조퇴','결석','퇴원'].includes(a.status)
        ? `<span class="badge ${attStatusClass(a.status)==='drop'?'gone':attStatusClass(a.status)}">${a.status}</span>` : '',
      `<button class="btn q sm" onclick="deleteAttendance('${sid}',${i})">삭제</button>`,
      /* 「퇴원」은 칠하지 않는다 — 빨간 점은 «결석했다»는 뜻으로 읽히는데 퇴원은 그런 사건이 아니다.
         상태는 옆의 «퇴원» 뱃지가 말한다. */
      SD_ATT_DOT[a.status] || '');
  });
  (rec.scores||[]).forEach((sc,i)=>{
    const pct = sc.total ? Math.round(sc.score/sc.total*100) : null;
    push(sc.date, 'score', '성적', escHtml(sc.name||'시험'),
      `<b>${sc.score}</b> / ${sc.total}${pct!==null?` · <b>${pct}%</b>`:''}`,
      pct!==null ? `<span class="badge score">${pct}%</span>` : '',
      `<button class="btn q sm" onclick="deleteScore('${sid}',${i})">삭제</button>`, 'k-score');
  });
  DATA.assignments.filter(a=>!a.classId || a.classId===s.classId).forEach(a=>{
    /* 연대기는 «무슨 일이 있었나»라 상태를 넷 그대로 보여 준다 —
       완료/미완료로 뭉개면 «냈는데 아직 확인 안 됨»이 미완료로 보인다. */
    const stt = hwState(rec, a.id);
    const [tone, label] = HW_BADGE[stt.status];
    push(a.createdAt || a.dueDate, 'hw', '과제', escHtml(a.title),
      (a.dueDate ? `마감 ${a.dueDate}` : '')
        + (stt.by ? `${a.dueDate?' · ':''}${escHtml(stt.by)}` : ''),
      label ? `<span class="badge ${tone}">${escHtml(label)}</span>`
            : '<span class="badge no">미제출</span>');
  });
  /* ⚠ 고아 숙제는 여기서도 뺀다 — `liveWrongHomework`. 08-14에 막은 것은 학생 화면뿐이라
     강사 연대기에는 「(삭제된 시험지) n번」이 그대로 섰다 (문항이 없으니 눌러도 볼 것이 없다).
     데이터는 안 건드린다 — 읽는 쪽에서만 막는 결정이다 (3291행 머리말). */
  liveWrongHomework(rec).forEach(h=>{
    const bank = DATA.problemBank.find(b=>b.id===h.bankId);
    const exam = DATA.exams.find(e=>e.id===h.examId);
    const correct = h.done && bank && (h.studentAnswer||'').trim()===(bank.variantAnswer||'').trim();
    push(h.assignedAt, 'hw', '오답', (exam?escHtml(exam.title):'(삭제된 시험지)') + ' ' + h.questionNo + '번',
      h.done ? `제출 <b>${escHtml(h.studentAnswer||'')}</b>` : '아직 제출하지 않았습니다',
      h.done ? `<span class="badge ${correct?'ok':'no'}">${correct?'정답':'오답'}</span>` : '<span class="badge">미제출</span>');
  });
  /* 데일리퀴즈 — 이제 채점이 되므로 «제출했다»가 아니라 «맞았다/틀렸다»가 남는다.
     한 카드가 여러 번 나오므로 이력(log)을 그대로 편다 — 같은 문제를 세 번 맞혀 익혀 가는 과정이 보인다. */
  ((rec.dailyQuiz && rec.dailyQuiz.log) || []).forEach(e=>{
    const [bankId, kind] = String(e.id||'').split(':');
    const bank = DATA.problemBank.find(b=>b.id===bankId);
    const exam = bank && DATA.exams.find(x=>x.id===bank.examId);
    push(e.d, 'hw', '퀴즈',
      `${exam?escHtml(exam.title):'(삭제된 시험지)'} ${bank?bank.questionNo:'?'}번 ${kind==='var'?'변형':'원본'}`,
      '데일리퀴즈',
      `<span class="badge ${e.ok?'ok':'no'}">${e.ok?'정답':'오답'}</span>`);
  });
  DATA.qnas.filter(q=>q.studentId===sid).forEach(q=>{
    push(q.date, 'qna', '질문', escHtml(q.question),
      q.answer ? `답변 ${q.answeredAt||''} — ${escHtml(q.answer)}` : '',
      q.answer ? '<span class="badge ok">답변 완료</span>' : '<span class="badge no">답변 대기</span>');
  });
  DATA.clinics.filter(c=>c.studentId===sid).forEach(c=>{
    push(c.day, 'qna', '클리닉', escHtml(c.topic||'클리닉'),
      escHtml(clinicWhenLabel(c)), `<span class="badge ${c.status==='승인'||c.status==='완료'?'ok':(c.status==='취소'?'gone':'late')}">${c.status}</span>`,
      '', c.status==='취소' ? '' : 'k-consult');
  });

  /* 상담 일지 — kv에 따로 사는 기록이라 여기서 연대기에 합류시킨다.
     아직 안 불러왔으면 그냥 없는 것으로 둔다(불러오면 다시 그린다). */
  (state.consultLogs[sid] || []).forEach(c=>{
    push(c.date, 'consult', '상담', escHtml(c.kind || '상담'), escHtml(c.text),
      '', `<button class="btn q sm" onclick="deleteConsultLog('${sid}','${c.id}')">삭제</button>`, 'k-consult');
  });

  ev.sort((a,b)=> b.date.localeCompare(a.date));   // 최근이 위
  return ev;
}

function sdOpen(sid, filter){
  state.studentDetailId = sid;
  state.teacherSelectedStudent = sid;
  state.studentDetailTab = 'timeline';
  if(filter) state.sdFilter = filter;
  render();
}
function sdMode(mode){ state.studentDetailTab = mode; render(); }
function sdFilter(f){ state.sdFilter = f; render(); }
/* 빠른 작업의 「상담」 — 연대기로 돌아가면서 갈래를 상담으로 맞춘다.
   ⚠ 둘을 «같이» 해야 한다. 채팅을 보던 중이면 갈래만 바꿔서는 화면이 안 바뀐다. */
function sdConsult(){ state.studentDetailTab = 'timeline'; state.sdFilter = 'consult'; render(); }

function teacherStudentDetailHTML(sid){
  const s = DATA.students.find(s=>s.studentId===sid);
  if(!s){ state.studentDetailId=null; return state.teacherTab==='settings' ? teacherSettingsHTML() : teacherClassHubHTML(); }
  const isAssistant = state.currentUser && state.currentUser.type==='assistant';
  if(isAssistant && !assistantClassIds(state.currentUser).includes(s.classId)){
    // 담당 반이 아닌 학생은 조교가 볼 수 없다. 담당 반은 여럿일 수 있다.
    state.studentDetailId = null;
    return assistantRosterHTML(state.currentUser);
  }
  const rec = DATA.records[sid];
  if(!rec){
    /* 「상세보기」는 상태만 바꾸고 render()만 부른다 — 그 학생 기록을 실제로 불러오진 않아서
       여기서 직접 불러온 뒤 끝나면 다시 그린다. 안 하면 «불러오는 중»에서 영원히 멈춘다. */
    loadRecord(sid).then(()=>render());
    return `<div style="padding:56px 0;text-align:center;color:var(--dim);font-size:12.5px;">학생 기록을 불러오는 중입니다…</div>`;
  }
  /* **강사와 조교가 같은 화면을 쓴다.** 다른 것은 권한뿐이라 인자 하나로 좁힌다 —
     화면을 두 벌로 두면 앞으로 모든 변경을 두 번 해야 하고 반드시 한쪽만 고쳐진다. */
  return sdScreenHTML(s, rec, isAssistant);
}

/* teacherStudentDetailLegacyHTML(구버전 탭 7개 화면)은 지웠다.
   조교가 이 화면을 쓰던 유일한 이유는 «DS 화면이 삭제·기본정보까지 열어 두기 때문»이었는데,
   그건 화면의 문제가 아니라 권한의 문제였다. sdScreenHTML이 isAssistant를 받으면서
   화면 한 벌로 둘 다 감당한다 — 두 벌로 두면 앞으로 모든 변경을 두 번 해야 했다. */

/* ── DS 화면 ── */
/* isAssistant면 «못 하는 것»이 빠진다. 화면을 새로 만드는 것이 아니라 좁히는 것이다.
     빠지는 것 — 우측 칸 통째로(연락처·기본정보·삭제·채팅·클리닉·수업 화면) ·
                 신호 «해제»(규칙을 다루는 것은 강사의 판단) · 「질문·클리닉」 갈래 */
/* =================== 월간 리포트 (2026-08-27 · R-1) ===================
   사용자가 원한 것 — **「우리가 수집하는 자료들을 종합해서 학부모님께 월마다 전송하는
   시스템(직접 전송을 눌러서)」**. «직접»이 핵심이다. 자동 발송이 아니라 **선생님이 보고 나서
   가져가는** 흐름이라, 이 화면의 일은 «만들어 보여 주는 것»까지다.

   🔴 **자동으로 «칭찬 문장»을 만들지 않는다.** 「성실히 참여했습니다」 같은 말은 내가 지어낸 것이지
     선생님이 관찰한 것이 아니다. **숫자는 시스템이, 사람의 말은 「선생님 한마디」에서 선생님이.**
     비워 두면 그 자리는 리포트에 아예 안 나간다 → 9절 8번의 «있을 법한 말을 지어냈다»와 같은 규칙.
   🔴 **그 달에 없던 항목은 «줄째로» 뺀다.** 빈 칸이나 0/0을 남기면 «안 한 것»으로 읽힌다.
   ⚠ **상담 일지는 넣지 않는다** — 선생님이 나중에 보려고 적은 메모라, 학부모가 읽을 것을
     전제로 쓰이지 않았다. 필요하면 「선생님 한마디」에 직접 옮겨 적는 것이 안전하다.
   ⚠ **신호(위험·주의)도 넣지 않는다** — 내부 판단이다. 「위험」이 그대로 가면 안 된다. */

function ymNow(){ return todayStr().slice(0,7); }
function ymOf(d){ return String(d||'').slice(0,7); }
function reportYm(){ return state.reportYm || ymNow(); }
function ymLabel(ym){ const a=String(ym).split('-'); return a[0]+'년 '+Number(a[1])+'월'; }
/* 달을 앞뒤로 옮긴다. 문자열 산술이라 시간대와 무관하다 (6절의 shiftYmd와 같은 뜻). */
function shiftYm(ym, delta){
  const a = ym.split('-').map(Number); let y=a[0], m=a[1]+delta;
  while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; }
  return y+'-'+String(m).padStart(2,'0');
}

/* 🔴 **화면과 갈라 둔 순수 함수다** — 필요한 것을 전부 ctx로 받는다.
   그래야 브라우저 없이 node로 «숫자가 맞나»만 따로 확인할 수 있다 (08-26에 값을 한 방법). */
function monthlyReportData(s, rec, ym, ctx){
  rec = rec || {}; ctx = ctx || {};
  const inMonth = d => ymOf(d)===ym;

  /* ⚠ **분모는 «기록된 날»이다.** 시간표로 세면 휴강·보강이 어긋나 실제와 달라진다. */
  /* 🔴 **이 달 출결 — «주 반» 것만이다** (2026-09-01 · E-1 · 사용자가 「가르자」로 정했다).
     특강 결석이 여기 섞이면 학부모께 가는 출석률이 실제 정규 출석과 달라진다.
     특강은 아래 `extras`로 **따로** 담아 문서 아래쪽에 제 이름을 달고 나간다. */
  const attList = (ctx.attOfMain || (r=>r.attendance||[]))(rec)
    .filter(a=>inMonth(a.date) && a.status!=='퇴원');
  const att = {'출석':0, '지각':0, '조퇴':0, '결석':0};
  attList.forEach(a=>{ if(att[a.status]!==undefined) att[a.status]++; });
  /* ⚠ **출석률은 명단·KPI와 «같은 식»이어야 한다**(rosterStats) — 결석이 아닌 날 ÷ 전체.
       여기서만 달리 세면 같은 화면 안에서 두 숫자가 어긋난다. */
  const attPct = attList.length
    ? Math.round(attList.filter(a=>a.status!=='결석').length / attList.length * 100) : null;

  /* 시험 — 반 평균과 등수는 «같은 시험(이름+날짜)을 본 사람들» 사이에서만 뜻이 있다.
     ⚠ 퇴원생을 빼지 않는다 — 지난 시험은 이미 있었던 일이다 (examWrongCounts와 같은 규칙).
     ⚠ 사용자가 **「반 평균과 등수를 넣는다」**로 정했다 (2026-08-27). 다만 **분모를 반드시 함께**
       적는다 — 「2등」만 있으면 실제보다 크게 읽힌다. */
  /* 🔴 **고아 숙제를 뺀다** (2026-08-27에 실제로 걸렸다) — 문항이 사라져도 학생 기록의 숙제는
       남는다(3291행 머리말). 리포트가 raw `wrongHomework`를 세는 바람에 실데이터에서
       **「9건 중 4건」으로 나왔는데 살아 있는 것은 3건뿐**이었다.
       **학부모에게 나갈 문서에 유령 숫자가 실릴 뻔했다.** 읽는 쪽에서 막는다는 결정을 여기도 따른다.
     ⚠ ctx.liveWrong 이 없으면(node 검사 등) 거르지 않는다 — 그때는 주는 쪽이 이미 고른 것이다. */
  const liveHw = ctx.liveWrong ? ctx.liveWrong(rec) : (rec.wrongHomework||[]);
  const wrong = liveHw.filter(h=>inMonth(h.assignedAt));
  /* 낸 답이 맞았는가 — 연대기·검토 화면과 같은 식이다(변형 문항의 정답과 문자열 비교). */
  const isCorrect = h => !!(h.done && ctx.answerOf &&
    String(h.studentAnswer||'').trim() === String(ctx.answerOf(h.bankId)||'').trim());

  /* 시험 하나에 딸린 오답 숙제.
     ✅ **2026-08-29부터 성적에 examId가 붙는다** — 시험지 화면의 성적판에서 넣은 것은
       짐작 없이 곧장 이어진다. 옛 기록(examId가 없는 것)만 예전 방식으로 잇는다:
     ⚠ **이름과 날짜가 둘 다 같을 때만** 잇는다. 이름만으로 짐작해 이으면 그 줄이 거짓이 된다.
       못 이으면 null을 돌려주고 그 줄은 화면에서 빠진다. */
  const examWrongOf = x => {
    const ex = x.examId ? (ctx.exams||[]).find(e=>e.id===x.examId)
                        : (ctx.exams||[]).find(e=>e.title===x.name && e.date===x.date);
    if(!ex) return null;
    const mine = liveHw.filter(h=>h.examId===ex.id);
    if(!mine.length) return null;
    return {total:mine.length, done:mine.filter(h=>h.done).length, correct:mine.filter(isCorrect).length};
  };

  /* 🔴 **주 반 시험만 싣는다** (2026-09-01 · E-2). 특강 시험은 아래 `extras`가 제 이름을 달고
     따로 적으므로, 여기 두면 **한 시험이 문서에 두 번** 적힌다. */
  const scores = (rec.scores||[]).filter(x=>inMonth(x.date) && x.total
      && !(ctx.isExtraScore && ctx.isExtraScore(x))).map(x=>{
    const seen = {};
    for(const sid in (ctx.allRecords||{})){
      const r = ctx.allRecords[sid];
      (r && r.scores || []).forEach(y=>{
        /* ✅ examId가 있으면 그것으로 짝을 짓는다 (2026-08-29) — 이름과 날짜가 우연히
           같은 다른 시험을 «같은 시험»으로 세던 자리다. 옛 기록은 예전대로 이름+날짜. */
        const same = x.examId ? (y.examId===x.examId) : (y.name===x.name && y.date===x.date);
        if(same && y.total && seen[sid]===undefined)
          seen[sid] = y.score / y.total * 100;
      });
    }
    const peers = Object.keys(seen).map(k=>({sid:k, pct:seen[k]})).sort((a,b)=>b.pct-a.pct);
    const at = peers.findIndex(q=>q.sid===s.studentId);
    /* 🔴 **혼자 본 시험이면 평균도 등수도 말하지 않는다** (2026-08-27에 실제로 나왔다).
       그 시험을 이 학생만 봤다면 「반 평균 92점 · 1명 중 1등」이 되는데,
       **자기 점수를 자기와 견준 것**이라 정보가 0이면서 학부모에게는 뜻이 있는 말처럼 읽힌다. */
    const alone = peers.length < 2;
    /* 🔵 **그 시험에서 나온 오답 숙제를 여기 붙인다** (사용자가 요청했다 —
       「성적과 성적에 대한 오답 … 도 기록했으면」). 점수 옆에 있어야 «틀린 것을 어떻게 했는가»가
       한 이야기로 읽힌다. 따로 떼면 두 숫자가 서로 남이 된다.
       ⚠ 배정일이 다음 달로 넘어가도 «그 시험의» 숙제이므로 달로 자르지 않는다. */
    const exHw = examWrongOf ? examWrongOf(x) : null;
    return {
      name: x.name, date: x.date, score: x.score, total: x.total, examId: x.examId||'',
      pct: Math.round(x.score / x.total * 100),
      avg: alone ? null : Math.round(peers.reduce((n,q)=>n+q.pct,0)/peers.length),
      rank: (alone || at<0) ? null : at+1, of: peers.length,
      wrong: exHw
    };
  });

  /* 과제 — «그 달에 내야 했던 것»이 학부모가 궁금한 것이라 마감일로 자른다 (없으면 등록일). */
  /* ⚠ «대표 반»의 과제다 — 주 반이 없는 학생(특강만)은 그 특강이 곧 대표 반이라
     여기서 세어야 한다. 그 학생은 `extras`가 비어 있으므로 두 번 세어지지 않는다 (E-4). */
  const asgs = (ctx.assignments||[]).filter(a=>a.classId===(ctx.primaryClassId||s.classId)
      && inMonth(a.dueDate||a.createdAt));
  const hwDone = ctx.isDone ? asgs.filter(a=>ctx.isDone(rec, a.id)).length : 0;
  /* 🔵 **「보완 필요」를 따로 센다** (2026-09-01 · C-21 · 사용자가 시켰다).
     ⚠ **제출 수(hwDone)에서 빼지 않는다** — 09-01에 사용자가 «한 것으로 센다»로 정했고
       제출률·신호가 그 판정을 쓴다. 여기서만 달리 세면 같은 학생의 숫자가 화면마다 달라진다.
     그래서 이것은 **«그중 몇 건이 미비했나»**라는 곁줄이다. 분자도 분모도 안 건드린다. */
  const hwPartial = ctx.isPartial ? asgs.filter(a=>ctx.isPartial(rec, a.id)).length : 0;


  /* 🔴 **강의 시청과 진도에는 날짜가 없다** — videoProgress는 편별 «누적치» 하나뿐이고
       progress.unit은 «지금» 어디까지 나갔는지다. 그 달로 자를 방법이 아예 없다.
     🔴 **그래서 «지난 달» 리포트에서는 통째로 뺀다** (2026-08-27에 실제로 걸렸다).
       7월 리포트를 8월에 뽑으면 «8월 현재»의 시청률과 진도가 7월 것인 양 실린다.
       달이 지날수록 옛 리포트가 저절로 «고쳐 쓰이는» 셈이라, 과거를 고치지 않는다는
       이 프로젝트의 규칙(examWrongCounts · W-1)과 정면으로 어긋난다.
     ⚠ 이번 달 리포트에는 넣되 **«지금까지»라고 밝혀서** 내보낸다. 달치인 척하면 거짓이 된다. */
  /* 데일리퀴즈 — log 항목이 {d:날짜, id:'bankId:kind', ok:참거짓}이라 **날짜가 있다.**
     그래서 이것은 «그 달»로 정확히 자를 수 있다(시청률·진도와 다른 점이다).
     ⚠ **«푼 날 수»를 함께 센다** — 정답률만으로는 «꾸준히 했는가»를 말할 수 없다.
       한 날 몰아서 12문항을 푼 것과 여덟 날에 걸쳐 푼 것은 학부모가 볼 때 다른 이야기다. */
  const qlog = ((rec.dailyQuiz && rec.dailyQuiz.log) || []).filter(e=>inMonth(e.d));
  const qdays = {};
  qlog.forEach(e=>{ qdays[e.d] = true; });
  const qok = qlog.filter(e=>e.ok).length;

  const isNow = ctx.isThisMonth !== false;
  const vids = !isNow ? [] : (ctx.videos||[]).filter(v=>!v.studentId || v.studentId===s.studentId);
  const vp = rec.videoProgress || {};
  const vidSeen = vids.filter(v=>vp[v.id] && (vp[v.id].percent>0 || vp[v.id].completed));
  const vidPct = vidSeen.length
    ? Math.round(vidSeen.reduce((n,v)=>n + (vp[v.id].completed ? 100 : (vp[v.id].percent||0)), 0) / vidSeen.length)
    : null;

  return {
    ym: ym, name: s.name, school: s.school||'', grade: s.grade||'',
    className: ctx.className || '',
    att: att, attDays: attList.length, attPct: attPct,
    scores: scores,
    hw: asgs.length ? {done:hwDone, total:asgs.length, partial:hwPartial,
          pct: Math.round(hwDone/asgs.length*100)} : null,
    wrong: wrong.length ? {done:wrong.filter(h=>h.done).length, total:wrong.length,
          correct: wrong.filter(isCorrect).length,
          pct: Math.round(wrong.filter(h=>h.done).length/wrong.length*100)} : null,
    quiz: qlog.length ? {n:qlog.length, ok:qok, days:Object.keys(qdays).length,
          pct: Math.round(qok/qlog.length*100)} : null,
    video: vids.length ? {seen:vidSeen.length, total:vids.length, pct:vidPct} : null,
    unit: isNow ? ((rec.progress||{}).unit || '') : '',
    /* 특강 (2026-09-01 · E-1b · 사용자가 정했다: 「메인반 학생들이 추가로 특강을 수강한다면
       그달 리포트에 특강에 대한 내용도 추가되어 나갔으면 좋겠다」).
       🔴 **리포트는 학생 한 장이다** — 반마다 나누지 않고 «이 아이의 한 달» 안에 얹는다.
       ⚠ 정규 숫자는 한 글자도 안 건드린다. 특강은 제 이름을 달고 아래에 따로 선다. */
    extras: ctx.extras || [],
    /* 교재 (2026-09-01 · T-1b). ⚠ **달치가 아니라 «지금» 값이다** — 반이 쓰는 책은 이력을 안 남긴다.
       그래서 지난 달 리포트에서는 화면이 «지금 쓰는 책»이라고 밝혀서 적는다
       (08-27에 정한 규칙 그대로: 지금 값을 실을 때는 «지금»이라고 밝힌다. 달치인 척하면 거짓이 된다). */
    books: ctx.books || []
  };
}

/* 화면도 글귀도 이것 하나로 재료를 얻는다 — 두 곳에서 따로 부르면 조건이 어긋난다. */
/* 🔴 **«이 달에 기록이 없다»는 판정은 여기 하나뿐이다** (2026-09-01 · R-3b).
   리포트 화면의 「기록이 없습니다」와, 여러 명 PDF에서 «건너뛸 사람»과, 달 고르개의 «N명 기록 있음»이
   **전부 이 함수를 본다.** 따로 세면 «화면에는 줄이 있는데 PDF는 건너뛴» 어긋남이 생긴다.
   ⚠ 아래 조건은 sdReportHTML이 눈금 줄을 «미는 조건»과 한 글자도 다르면 안 된다 —
     줄을 하나 더할 때 여기도 같이 고칠 것.
   🔵 **특강(`extras`)은 «있음»으로 센다** (2026-09-01 · E-1b) — 정규에 아무 기록이 없어도
     그 달에 특강을 들었다면 학부모께 보낼 것이 있다. 교재와 다른 점은 **그것이 이 학생이
     «한 일»이라는 것**이다.
   🔴 **딱 하나 일부러 뺀 것이 있다 — `books`(교재).** 교재는 **반의 속성이지 이 학생이 한 일이 아니다.**
     넣으면 «출결도 과제도 하나 없는 학생»이 반에 교재가 적혀 있다는 이유로 리포트를 받게 되고,
     학부모는 책 이름 한 줄만 든 종이를 받는다. 그래서 교재 줄은 **«기록이 있을 때만» 따라 나온다.** */
function reportIsEmpty(d){
  return d.attPct === null && !d.hw && !d.wrong && !d.quiz
      && !(d.video && d.video.pct !== null) && !d.unit && !d.scores.length
      && !(d.extras && d.extras.length);
}
function reportDataOf(s, rec, ym){
  /* 🔴 **정규 출결을 고르는 함수를 «주입»한다** — 계산은 화면과 갈라 둔 순수 함수라
     DATA·state를 몰라야 한다(2절의 규칙). 여기서 그 판단을 넣어 준다. */
  const main = studentMainClassId(s);
  const attOfMain = r => attCountedOf(r, s);
  /* 특강 시험을 정규 시험표에서 빼는 판단 — 계산은 DATA를 모르므로 여기서 넣어 준다 (E-2). */
  const extraIds = studentExtraClassIds(s);
  const isExtraScore = sc => extraIds.length > 0 && extraIds.includes(scoreClassOf(sc, main));
  /* 특강마다 «그 반의 한 달»을 따로 센다. 출결은 그 반 줄만, 과제·시험은 그 반 것만이다. */
  const extras = studentExtraClassIds(s).map(cid=>{
    const rows = attOfClass(rec, cid, main).filter(a=>String(a.date).slice(0,7)===ym && a.status!=='퇴원');
    const att = {'출석':0,'지각':0,'조퇴':0,'결석':0};
    rows.forEach(a=>{ if(att[a.status]!==undefined) att[a.status]++; });
    const asgs = DATA.assignments.filter(a=>a.classId===cid
      && String(a.dueDate||a.createdAt||'').slice(0,7)===ym);
    const done = asgs.filter(a=>hwIsDone(rec, a.id)).length;
    const exs = DATA.exams.filter(e=>e.classId===cid && String(e.date||'').slice(0,7)===ym);
    const scores = exs.map(e=>{
      const got = (rec.scores||[]).find(sc=>sc.examId===e.id);
      return got ? {name:e.name||e.title||'시험', score:got.score, total:got.total,
                    pct: got.total ? Math.round(got.score/got.total*100) : null} : null;
    }).filter(Boolean);
    const cp = getClassProgress(cid);
    return {
      classId: cid, name: classNameOf(cid), special: isSpecialClass(cid),
      attDays: rows.length, att,
      attPct: rows.length ? Math.round(rows.filter(a=>a.status!=='결석').length / rows.length * 100) : null,
      hw: asgs.length ? {done, total: asgs.length} : null,
      scores, books: cp.books || [], unit: cp.subject || ''
    };
  /* ⚠ **이 달에 아무 일도 없던 특강은 줄째로 뺀다** — 「특강 · 0건」은 학부모께
     «안 한 것»으로 읽힌다. 리포트 전체가 그 규칙 위에 서 있다. */
  }).filter(x => x.attDays || x.hw || x.scores.length);
  return monthlyReportData(s, rec, ym, {
    attOfMain, extras, isExtraScore, primaryClassId: studentPrimaryClassId(s),
    /* 🔴 «대표 반»을 본다 — 특강만 듣는 학생은 주 반이 없어 교재가 통째로 비어 있었다 (E-4). */
    books: studentPrimaryClassId(s) ? getClassProgress(studentPrimaryClassId(s)).books : [],
    allRecords: state.allRecords, assignments: DATA.assignments,
    videos: DATA.videos, isDone: hwIsDone,
    /* 🔴 학부모가 읽는 반 이름이다. 특강만 듣는 학생에게 「미배정」이라 적으면
       **그 집에서는 «우리 애가 반이 없다»로 읽힌다** (2026-09-01 · E-4). */
    className: studentPrimaryClassId(s) ? classNameOf(studentPrimaryClassId(s)) : '미배정',
    exams: DATA.exams, liveWrong: liveWrongHomework,
    isPartial: (r, id) => hwState(r, id).status === HW_PARTIAL,
    answerOf: bid => (DATA.problemBank.find(b=>b.id===bid)||{}).variantAnswer,
    isThisMonth: ym === ymNow()
  });
}
/* =================== 예비 글귀 (2026-08-27 · R-1b) ===================
   사용자가 요청했다 — **「선생님 한마디 입력을 지금처럼 할수 있게 남겨두되 예비 글귀들
   몇개정도 만들어두고 선택할 수 있도록」**.

   🔴 **이것이 «문장을 지어내지 않는다»는 규칙과 부딪히지 않는 이유는 셋이다.**
     ① **고르는 사람은 선생님이다.** 저절로 실리지 않는다 — 누르면 «입력칸에 들어갈 뿐»이고,
        저장은 여전히 선생님이 「저장」을 눌러야 된다. 고른 뒤 고쳐 쓸 수도 있다.
     ② **데이터가 뒷받침하는 글귀만 목록에 뜬다.** 결석이 있는 달에 「결석 없이」가 뜨면 안 된다.
        그래서 아래는 전부 그 달 숫자를 보고 «해당할 때만» 나온다.
     ③ **사람의 판단이 들어가는 말(권유·당부)은 «사실 주장»을 하지 않는다.**
        「~해 주시면 좋겠습니다」는 선생님의 뜻이지 내가 관찰한 사실이 아니다.
   ⚠ **그래도 이것은 «초안»이다.** 화면에 그렇게 적어 둔다 — 고르고 나서 손보시라고.
   ⚠ 새 글귀를 더할 때도 **조건 없이 항상 뜨는 «칭찬»은 만들지 말 것.** 그것이 8절의 그 일이다. */
function reportPhrases(d){
  const out = [];
  const 결석 = d.att ? d.att["결석"] : 0, 지각 = d.att ? d.att["지각"] : 0;

  if(d.attDays >= 2 && 결석===0 && 지각===0)
    out.push("이번 달은 한 번도 빠지지 않고 제시간에 왔습니다.");
  if(d.attDays >= 2 && 결석===0 && 지각 > 0)
    out.push("결석 없이 꾸준히 나오고 있습니다. 다만 지각이 몇 번 있어 조금만 서두르면 좋겠습니다.");
  if(결석 > 0)
    out.push("이번 달 결석이 있었습니다. 빠진 부분은 보충으로 메우고 있으니 가정에서도 한 번 살펴봐 주시면 좋겠습니다.");

  if(d.hw && d.hw.total > 0 && d.hw.done === d.hw.total && !d.hw.partial)
    out.push("내준 과제를 빠짐없이 해왔습니다.");
  /* ⚠ 「빠짐없이 해왔다」와 「보완이 필요했다」를 한 문장에 담는다 — 앞의 것만 고르면
     칭찬이 사실보다 커지고, 뒤의 것만 고르면 해온 것이 안 보인다. */
  if(d.hw && d.hw.total > 0 && d.hw.done === d.hw.total && d.hw.partial)
    out.push("내준 과제를 빠짐없이 해왔습니다. 다만 " + d.hw.partial +
      "건은 내용을 조금 더 채우면 좋겠습니다.");
  if(d.hw && d.hw.partial >= 2 && d.hw.done < d.hw.total)
    out.push("과제를 해오기는 하는데 내용이 다소 비어 있는 경우가 있습니다. 집에서 한 번 함께 살펴봐 주시면 좋겠습니다.");
  if(d.hw && d.hw.total > 0 && d.hw.pct < 60)
    out.push("과제 제출이 밀리는 편입니다. 집에서 한 번 챙겨봐 주시면 큰 도움이 됩니다.");

  if(d.wrong && d.wrong.total > 0 && d.wrong.pct >= 80)
    out.push("틀린 문제를 그냥 넘기지 않고 오답까지 끝까지 붙잡고 갑니다.");
  if(d.wrong && d.wrong.total > 0 && d.wrong.pct < 50)
    out.push("오답 숙제가 남아 있습니다. 틀린 문제를 다시 푸는 것이 지금 시기에 가장 크게 남습니다.");

  if(d.quiz && d.quiz.days >= 8)
    out.push("데일리퀴즈를 거의 매일 챙기고 있습니다. 이 습관이 계속되면 좋겠습니다.");
  if(d.quiz && d.quiz.days > 0 && d.quiz.days < 5)
    out.push("데일리퀴즈에 들어오는 날이 뜸합니다. 하루 세 문제라 부담이 크지 않으니 함께 챙겨봐 주세요.");

  if(d.scores.length && d.scores[0].rank && d.scores[0].rank === 1)
    out.push("이번 시험에서 반에서 가장 좋은 결과를 냈습니다.");
  if(d.scores.length && d.scores[0].avg !== null && d.scores[0].pct > d.scores[0].avg)
    out.push("이번 시험은 반 평균을 웃돌았습니다.");

  /* 마무리 — 사실 주장이 없는 «선생님의 뜻»이라 늘 둔다. 다만 이것도 «초안»이다. */
  out.push("다음 달에도 지금처럼 해 나가면 좋겠습니다. 궁금하신 점은 언제든 연락 주세요.");
  return out;
}
/* 글귀를 «입력칸에 넣기만» 한다 — 저장하지 않는다. 선생님이 고쳐 쓰고 「저장」을 눌러야 남는다.
   🔴 **누른 «그 문장»을 그대로 받는다 — 인덱스로 집으면 안 된다** (2026-08-27에 실제로 걸렸다).
     글귀 목록은 그 달 데이터를 보고 만들어지는데, `loadAllRecordsIfNeeded()`가 끝나기 «전»에
     한 번 그려지고 «뒤»에 다시 그려진다. 그 사이 목록이 길어지면 **같은 자리에 다른 글귀가 온다.**
     실제로 마지막 글귀를 눌렀는데 데일리퀴즈 문장이 들어갔다.
     버튼의 `this.textContent`가 곧 그 글귀라 이스케이프 걱정도 없다. */
function reportUsePhrase(sid, ym, text){
  text = String(text||'').trim();
  if(!text) return;
  const el = document.getElementById("rp-comment");
  const cur = (el ? el.value : reportCommentText(sid, ym));
  /* 이어 붙인다 — 두 개를 고르면 두 문장이 된다. 갈아치우면 애써 쓴 말이 사라진다. */
  const next = cur.trim() ? cur.replace(/\s+$/, "") + " " + text : text;
  state.reportDrafts[reportKey(sid, ym)] = next;
  if(el){ el.value = next; el.focus(); }
}

/* 리포트 한 줄의 «등급» — 빈 문자열(넉넉함) · y(조금 아쉬움) · r(보충 필요).
   사용자가 요청했다 — **「부족한 것이나 미비한 것은 신호판과 비슷하게 붉은색이나 노란색으로」**.

   🔴 **임계값을 여기서 새로 지어내지 않는다.** 신호 규칙(설정 > 신호 규칙)에 이미 있는 것은
     **그대로 가져다 쓴다** — 같은 학생이 신호판에서는 빨강인데 리포트에서는 멀쩡하면
     둘 중 하나는 거짓말이 된다. 선생님이 설정에서 임계값을 바꾸면 이 색도 함께 움직인다.
     · 출결 → `R.attPct`(기본 80) 미만이면 r. 그 위 10점 안쪽이면 y
     · 강의 시청 → **규칙에 이미 3단계가 있다**(`vidHeavy` 50 · `vidWarn` 70). 그대로 쓴다
     · 오답 «제출» → 남은 미제출이 `R.wrong`(기본 3)건 이상이면 r — 신호와 같은 잣대다
   ✅ **과제 · 오답 정답률 · 데일리퀴즈도 이제 규칙에서 읽는다** — `R.rpRed`(기본 60) · `R.rpYellow`(기본 80).
     08-30에는 내가 지어낸 상수였고, **2026-09-01에 사용자가 「설정에서 조절하게」로 정했다.**
     ⚠ 이 둘은 **리포트에서만** 쓰인다 — 신호판·명단은 안 본다. 설정 화면에서도 그렇게 적었다.
   ⚠ **학부모 문서에 「위험」·「주의」라는 «말»은 쓰지 않는다** — 그것은 선생님이 볼 내부 판단이다
     (R-1에서 신호를 빼기로 한 것과 같은 뜻). 여기서는 **색과 범례로만** 말한다. */
function rpGrade(pct, kind, R, extra){
  if(pct === null || pct === undefined) return '';
  if(kind === 'att')   return pct < R.attPct ? 'r' : (pct < R.attPct + 10 ? 'y' : '');
  if(kind === 'video') return pct < R.vidHeavy ? 'r' : (pct < R.vidWarn ? 'y' : '');
  if(kind === 'hwLeft') return extra >= R.wrong ? 'r' : (extra > 0 ? 'y' : '');
  return pct < R.rpRed ? 'r' : (pct < R.rpYellow ? 'y' : '');
}
function reportKey(sid, ym){ return sid + ':' + ym; }
async function loadReportIfNeeded(sid, ym){
  const k = reportKey(sid, ym);
  if(!sid || state.reportDocs[k] || state.reportLoading[k]) return;
  state.reportLoading[k] = true;
  const v = await dbGet('report:' + k, {});
  state.reportDocs[k] = (v && typeof v==='object') ? v : {};
  state.reportLoading[k] = false;
  render();
}
function reportCommentText(sid, ym){
  const k = reportKey(sid, ym);
  if(state.reportDrafts[k] !== undefined) return state.reportDrafts[k];
  return (state.reportDocs[k] || {}).comment || '';
}
/* ⚠ **render()를 부르지 않는다** — 한글 조합이 끊긴다 (W-3). 고정 메모와 같은 방식이다. */
function reportCommentInput(sid, ym, text){ state.reportDrafts[reportKey(sid,ym)] = text; }
async function saveReportComment(sid, ym){
  const el = document.getElementById('rp-comment');
  const text = (el ? el.value : reportCommentText(sid, ym)).trim();
  const k = reportKey(sid, ym);
  const doc = Object.assign({}, state.reportDocs[k] || {});
  if(text) doc.comment = text; else delete doc.comment;

  state.reportDocs[k] = doc;
  delete state.reportDrafts[k];
  await dbSet('report:' + k, doc);
  showToast('선생님 한마디를 저장했습니다.');
  render();
}

/* =================== 리포트 PDF 묶음 (2026-09-01 · R-3) ===================

     이 대가를 **먼저 말하고 고르게 했다.** 벡터로 넣으려면 한글 글꼴을 PDF에 심고 표·눈금을

/* A4 세로. 좌우 12mm · 위아래 14mm는 @media print의 @page와 **같은 값**이다 —
   두 길로 나온 종이가 같아 보여야 한다. 703px = 186mm(210−24)를 96dpi로 옮긴 값. */
const RPB = { W:703, MMPX:186/703, X:12, Y:14, PW:186 };
const RPB_PAGE_PX = 269 / (186/703);         // 한 장에 들어가는 CSS 픽셀 (≈1016)

function ensureHtml2CanvasLoaded(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('그림 변환 라이브러리를 불러오지 못했습니다.'));
    document.head.appendChild(s);
  });
}
/* 화면이 그리는 «그» 문서를 그대로 떼어 온다.
   🔴 **여기서 리포트를 다시 만들지 않는다** — 만들면 화면과 PDF가 두 벌이 되고,
     한쪽만 고치는 날부터 «화면에서는 맞는데 PDF는 틀린» 일이 시작된다.
   🔴 **id를 뗀다** — #rp-doc이 둘이 되면 인쇄 규칙 body:has(#rp-doc)이 명단 화면에서도 켜져
     Ctrl+P가 엉뚱한 것을 걷어낸다. */
function rptDocEl(s, rec){
  const box = document.createElement('div');
  box.innerHTML = sdReportHTML(s, rec);
  const doc = box.querySelector('.rp-doc');
  if(doc) doc.removeAttribute('id');
  return doc;
}
/* «이 달에 기록이 없다»는 판정은 reportIsEmpty 하나를 본다 (R-3b).
   🔴 **여기서 sdReportHTML을 부르지 않는다** — 그 함수는 loadReportIfNeeded를 부르므로
     달 고르개에서 열두 달을 세는 순간 **학생×달 만큼 DB를 읽고 render()가 그만큼 돈다.**
     reportDataOf는 이미 읽어 둔 것만 보는 순수 계산이라 몇백 번을 불러도 값이 안 든다. */
function rptIsEmpty(s, rec, ym){
  if(!s || !rec) return true;
  return reportIsEmpty(reportDataOf(s, rec, ym));
}
/* 달 고르개에 «몇 명이나 기록이 있나»를 함께 적는다 (2026-09-01 · R-3b).
   🔵 **이러면 «어느 달을 골라야 하나»를 사용자가 짐작하지 않아도 된다** — 9월 1일에 열면
     「9월 0명 · 8월 3명」이 나란히 보인다. 기본값을 내가 «똑똑하게» 맞히려 들지 않는 까닭이다:
     8월 말에 8월 것을 뽑는 날도, 9월 1일에 8월 것을 뽑는 날도 둘 다 있다. */
function rptMonthOptions(ids){
  const out = [];
  let ym = ymNow();
  for(let i=0;i<12;i++){
    let has = 0;
    for(const sid of ids){
      const st = DATA.students.find(x=>x.studentId===sid);
      if(st && DATA.records[sid] && !rptIsEmpty(st, DATA.records[sid], ym)) has++;
    }
    out.push({ ym, has });
    ym = shiftYm(ym, -1);
  }
  return out;
}

/* 자를 자리 — «덩어리의 아래끝»만 고른다. 눈금 줄이나 표 행 한가운데를 자르면
   글자가 위아래로 반씩 갈려 **두 장 모두에서 못 읽는다.**
   ⚠ 한 덩어리가 한 장보다 크면 어쩔 수 없이 그냥 자른다(선생님 한마디가 아주 길 때). */
/* 🔴 **PDF가 아니라 «사진»으로 낸다** (2026-09-01 · R-4 · 사용자가 정했다).
   까닭은 쓰임이 바뀌었기 때문이다 — 「**파일이나 사진으로 문자전송할 생각**」.
   PDF 한 장이 **3.6MB**였고 MMS는 보통 1MB 안팎이라, 그대로는 못 보낸다.
   🔵 어차피 안에 든 것은 처음부터 그림이었다(html2canvas). **PDF 껍데기만 벗긴 셈이다** —
     jsPDF도, 장 나누기도 필요 없어져 코드가 오히려 줄었다.
   ⚠ **한 학생에 한 장이다.** 장을 나누면 문자에 사진이 여러 개 붙어 «어느 게 앞이지»가 된다.
     종이로 곱게 뽑을 때는 인쇄(R-2b)가 그대로 있다 — 그쪽은 벡터라 글자가 선명하다. */
/* 🔴 **크롬은 «한 번에 여러 파일 내려받기»를 조용히 막는다** (2026-09-01에 실제로 당했다).
   3명을 저장했다고 알렸는데 **내려받기 폴더에는 한 개만** 있었다. 주소창에 작은 차단 표시가
   뜰 뿐이라 **아무도 모른다.** 「허용해 주세요」라고 적어 둔 것으로는 못 막는다 —
   **어긋남은 설명할 것이 아니라 없앨 것이다.**
   🔵 그래서 **폴더를 한 번 고르게 하고 거기에 직접 쓴다.** 내려받기가 아니므로 막힐 일이 없고,
     «어디에 저장됐는지»도 사용자가 고른 그 폴더로 확정된다.
   ⚠ **고르는 창은 «누른 그 순간»에 열어야 한다** — 라이브러리를 먼저 기다리면 클릭의 힘이
     풀려서 브라우저가 창을 안 띄운다. 그래서 runReportBatch의 맨 첫 줄이다.
   ⚠ 이 API가 없는 브라우저에서는 옛길(내려받기)로 간다. */
function rptCanPickFolder(){ return typeof window.showDirectoryPicker === 'function'; }
async function rptPickFolder(){
  if(!rptCanPickFolder()) return null;
  try{
    return await window.showDirectoryPicker({ id:'hh-report', mode:'readwrite', startIn:'downloads' });
  }catch(e){
    return 'CANCEL';                     // 사용자가 창을 닫았다 — 잘못이 아니다
  }
}

const RPB_MAX_BYTES = 950 * 1024;      // MMS가 대개 1MB 언저리다. 그 밑으로 맞춘다

/* 캔버스를 «문자로 보낼 만한 크기»가 될 때까지 낮춰 가며 굽는다.
   ⚠ 품질만 낮추면 글자 가장자리가 먼저 뭉갠다. **크기를 줄이는 쪽이 글자에 덜 아프다** —
     그래서 품질을 두 번 낮춘 뒤에야 크기를 건드린다. */
async function rptBakeImage(canvas){
  const tries = [ {q:.92, s:1}, {q:.84, s:1}, {q:.86, s:.8}, {q:.8, s:.66} ];
  let last = null;
  for(const t of tries){
    let cv = canvas;
    if(t.s !== 1){
      cv = document.createElement('canvas');
      cv.width  = Math.round(canvas.width  * t.s);
      cv.height = Math.round(canvas.height * t.s);
      const c = cv.getContext('2d');
      c.imageSmoothingQuality = 'high';
      /* ⚠ JPEG에는 투명이 없다 — 흰 바탕을 먼저 깔지 않으면 검게 나온다 */
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, cv.width, cv.height);
      c.drawImage(canvas, 0, 0, cv.width, cv.height);
    }
    const url = cv.toDataURL('image/jpeg', t.q);
    const bytes = Math.round((url.length - url.indexOf(',') - 1) * 3 / 4);
    last = {url, bytes, q:t.q, scale:t.s, w:cv.width, h:cv.height};
    if(bytes <= RPB_MAX_BYTES) return last;
  }
  return last;                          // 끝까지 못 줄였으면 가장 작은 것을 준다
}
function rptDataUrlToBlob(url){
  const i = url.indexOf(','), bin = atob(url.slice(i + 1));
  const buf = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) buf[k] = bin.charCodeAt(k);
  return new Blob([buf], {type:'image/jpeg'});
}

/* 한 학생 → 사진 한 장. **파일 이름이 곧 학부모께 보낼 때의 이름**이 되므로 사람이 읽는 말로 짓는다.
   dir 가 있으면 그 폴더에 쓰고, 없으면 옛길(내려받기)로 간다. */
async function rptSaveOne(el, s, ym, dir){
  /* 🔵 **192dpi에서 384dpi로 올렸다 (2026-09-02 · R-4b).** 09-01에 «흐릴 것»을 걱정해
     배율을 낮춰 뒀는데, **실측해 보니 한 장이 123KB였다** — 950KB 한도의 8분의 1이라
     품질 낮추기 사다리가 한 칸도 안 내려가고 있었다. 4배로 올려도 **309KB**다.
     ⚠ **긴 문서는 3배로 내린다** — 캔버스는 폭×높이에 상한이 있어, 4배로 굽다가
       넘으면 html2canvas가 **빈 그림을 조용히 돌려준다**. 넘치는 크기는 사다리가 받아 준다. */
  const scale = el.scrollHeight > 2600 ? 3 : 4;
  const canvas = await html2canvas(el, {scale, backgroundColor:'#ffffff', logging:false, useCORS:true});
  const baked = await rptBakeImage(canvas);
  const name = (s.name + '_' + ym + '_월간리포트').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '') + '.jpg';
  if(dir){
    const fh = await dir.getFileHandle(name, { create:true });
    const w = await fh.createWritable();
    await w.write(rptDataUrlToBlob(baked.url));
    await w.close();
  }else{
    /* 옛길 — a[download]. 큰 dataURL을 그대로 물리면 브라우저가 버거우므로 blob 주소를 쓴다. */
    const href = URL.createObjectURL(rptDataUrlToBlob(baked.url));
    const a = document.createElement('a');
    a.href = href; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(href), 4000);
  }
  return { name, bytes: baked.bytes };
}

function rptBatchMonth(delta){
  const b = state.rptBatch; if(!b || b.phase==='running') return;
  state.reportYm = shiftYm(b.ym, delta);
  openReportBatch(b.ids);
}
function rptBatchPickMonth(ym){
  const b = state.rptBatch; if(!b || b.phase==='running' || !ym || ym===b.ym) return;
  state.reportYm = ym;
  openReportBatch(b.ids);
}
function closeReportBatch(){
  if(state.rptBatch && state.rptBatch.phase==='running') return;   // 만드는 중에는 안 닫는다
  state.rptBatch = null; render();
}

/* 여는 것과 «재료를 다 읽는 것»이 한 몸이다.
   🔴 **다 읽기 «전»에 그리면 안 된다** — 선생님 한마디는 학생마다 따로 읽어 오는데,
     안 읽힌 채로 그리면 **한마디가 빠진 PDF**가 조용히 나간다. 그래서 phase를 둔다. */
async function openReportBatch(ids){
  ids = (ids || state.rosterSelected || []).slice();
  if(ids.length === 0){ showToast('학생을 먼저 고르세요.'); return; }
  const ym = reportYm();
  state.rptBatch = { ids, ym, phase:'loading', cur:0, saved:[], skipped:[], err:'',
                     months:(state.rptBatch && state.rptBatch.months) || [], files:[], where:'' };
  render();
  await loadAllRecordsIfNeeded();
  for(const sid of ids){
    await loadRecord(sid);
    const k = reportKey(sid, ym);
    if(!state.reportDocs[k]) state.reportDocs[k] = (await dbGet('report:' + k, {})) || {};
  }
  const b = state.rptBatch;
  if(!b || b.ym !== ym) return;              // 그 사이 달을 바꿨으면 이 결과는 버린다
  b.skipped = ids.filter(sid=>{
    const st = DATA.students.find(x=>x.studentId===sid);
    return rptIsEmpty(st, DATA.records[sid], ym);
  });
  b.months = rptMonthOptions(ids);           // 「어느 달에 몇 명」 — 고르는 근거를 함께 보인다
  b.phase = 'ready';
  render();
}

async function runReportBatch(){
  const b = state.rptBatch;
  if(!b || b.phase !== 'ready') return;
  const list = b.ids.filter(id => !b.skipped.includes(id));
  if(list.length === 0){ showToast('이 달에 기록이 있는 학생이 없습니다.'); return; }
  /* 🔴 **폴더 고르는 창을 맨 먼저 연다** — 아래에서 라이브러리를 기다린 뒤에 열면
     «사용자가 누른 힘»이 이미 풀려서 브라우저가 창을 안 띄운다. */
  const dir = await rptPickFolder();
  if(dir === 'CANCEL') return;               // 창을 닫으셨다 — 아무 일도 안 한다
  state.reportYm = b.ym;                     // sdReportHTML이 보는 달을 못박는다
  b.phase = 'running'; b.cur = 0; b.saved = []; b.files = []; b.bytes = 0; b.err = '';
  b.where = dir ? (dir.name || '고르신 폴더') : '';
  render();
  let stage = null;
  try{
    await ensureHtml2CanvasLoaded();
    /* ⚠ 글꼴이 아직 안 왔으면 html2canvas가 **대체 글꼴로** 그려 버린다. 되돌릴 수 없다. */
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    stage = document.createElement('div');
    stage.className = 'rpb-stage';
    document.body.appendChild(stage);
    for(let i=0;i<list.length;i++){
      const sid = list[i];
      b.cur = i; render();
      const st = DATA.students.find(x=>x.studentId===sid);
      const rec = DATA.records[sid];
      if(!st || !rec) continue;
      const doc = rptDocEl(st, rec);
      if(!doc) continue;
      stage.innerHTML = '';
      stage.appendChild(doc);
      /* 두 프레임을 쉰다 — 붙이자마자 재면 배치가 안 끝나 자를 자리가 어긋난다. */
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      const out = await rptSaveOne(doc, st, b.ym, dir);
      b.saved.push(sid);
      b.files.push(out.name + '  (' + Math.round(out.bytes/1024) + 'KB)');
      b.bytes = (b.bytes||0) + out.bytes;
      render();
      /* ⚠ 옛길(내려받기)일 때만 쉰다 — 잇달아 시키면 브라우저가 뒤엣것을 흘린다.
         폴더에 직접 쓸 때는 그럴 일이 없다. */
      if(!dir) await new Promise(r=>setTimeout(r, 350));
    }
    b.phase = 'done'; render();
    const mb = Math.round((b.bytes||0)/1024/1024*10)/10;
    showToast(dir
      ? b.saved.length + '장을 「' + b.where + '」 폴더에 저장했습니다 · 모두 ' + mb + 'MB'
      : b.saved.length + '장을 내려받기 폴더로 보냈습니다 — 실제로 왔는지 확인해 주세요.');
  }catch(e){
    b.phase = 'ready';
    b.err = (e && e.message) ? e.message : String(e);
    render();
    showToast('리포트 이미지를 만들지 못했습니다 — ' + b.err);
  }finally{
    if(stage) stage.remove();
  }
}

function rptBatchDrawerHTML(){
  const b = state.rptBatch; if(!b) return '';
  const live = b.ids.filter(id => !b.skipped.includes(id));
  const running = b.phase === 'running';
  const rows = b.ids.map((sid, i)=>{
    const st = DATA.students.find(x=>x.studentId===sid);
    const off  = b.skipped.includes(sid);
    const done = b.saved.includes(sid);
    const now  = running && live[b.cur] === sid;
    const word = off ? '이 달 기록 없음' : done ? '저장됨' : now ? '만드는 중…'
      : b.phase === 'loading' ? '읽는 중…' : '대기';
    return `<div class="rpb-row ${off ? 'off' : ''}${done ? ' ok' : ''}${now ? ' now' : ''}">
      <span class="n mono">${i + 1}</span>
      <span class="nm">${escHtml(st ? st.name : sid)}<s>${
        escHtml(st ? studentClassTitle(st) : '미배정')}</s></span>
      <span class="st">${word}</span></div>`;
  }).join('');

  return `<div class="hwd-back" onclick="closeReportBatch()"></div>
    <aside class="hwd">
      <div class="hwd-h" style="position:relative;">
        <div class="t">리포트 이미지로 저장</div>
        <div class="m">고른 <b class="mono">${b.ids.length}</b>명<s>·</s>${ymLabel(b.ym)}</div>
        ${running ? '' : '<button class="x" onclick="closeReportBatch()" title="닫기 (Esc)">×</button>'}
      </div>
      <div class="hwd-b">
        ${/* 🔵 **달을 «고르는 것»으로 만들었다** (2026-09-01 · R-3b · 사용자가 시켰다):
             「9월 1일이어서 8월달 리포트를 쓰고싶을수도 있고, 8월말에 8월달 리포트를 저장할 수도
             있어서」. **그래서 기본값을 똑똑하게 맞히려 들지 않는다** — 두 경우가 다 있는데
             한쪽으로 찍으면 나머지 절반은 매번 되돌려야 한다.
             대신 **«어느 달에 몇 명»을 옆에 적어** 고르는 근거를 화면이 준다. */''}
        <div class="st-form" style="margin:0 0 12px;">
          <label style="display:block;">
            <span style="display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;">리포트 달</span>
            <select class="fm-sel" style="width:100%;" ${running ? 'disabled' : ''}
              onchange="rptBatchPickMonth(this.value)">
              ${(b.months && b.months.length ? b.months : [{ym:b.ym, has:null}]).map(o=>
                `<option value="${o.ym}" ${o.ym===b.ym?'selected':''}>${ymLabel(o.ym)}${
                  o.has === null ? '' : (o.has ? '  ·  기록 있는 학생 ' + o.has + '명' : '  ·  기록 없음')
                }${o.ym===ymNow() ? '  (이번 달)' : ''}</option>`).join('')}
            </select>
          </label>
        </div>
        ${rows}
        ${b.skipped.length ? `<p class="st-note"><b>${b.skipped.length}명은 이 달 기록이 없어 뺐습니다</b> —
          출결 · 시험 · 과제 어느 것도 남지 않은 달이라 빈 종이가 나갑니다. 위에서 달을 바꾸면 다시 셉니다.</p>` : ''}
        ${b.err ? `<p class="st-note" style="color:var(--no);">${escHtml(b.err)}</p>` : ''}
        ${b.phase === 'done' && b.files.length ? `<p class="st-note">
          <b>${b.where ? '「' + escHtml(b.where) + '」 폴더에' : '내려받기 폴더로'} ${b.files.length}개를 저장했습니다.</b><br>
          ${b.files.map(f=>escHtml(f)).join('<br>')}</p>` : ''}
        ${/* 🔴 어디에 저장되는지를 **누르기 전에** 말한다. 09-01에 사용자가 「어디에 저장했는지도
             모르겠고」라고 한 자리다 — 3개를 저장했다고 알렸는데 실제로는 1개만 와 있었다. */''}
        <p class="st-note">${rptCanPickFolder()
          ? `누르면 <b>폴더를 고르는 창</b>이 먼저 뜹니다. 고르신 그 폴더에 <b>학생마다 파일 하나씩</b>
             바로 저장됩니다 — 「이름_${escHtml(b.ym)}_월간리포트.jpg」.`
          : `이 브라우저는 폴더 고르기를 지원하지 않아 <b>내려받기 폴더</b>로 갑니다 —
             「이름_${escHtml(b.ym)}_월간리포트.jpg」.<br>
             🔴 <b>크롬은 파일을 여러 개 내려받는 것을 막을 수 있습니다</b> — 주소창에 차단 표시가 뜨면
             허용해 주세요. <b>저장했다고 나와도 실제로 몇 개가 왔는지 꼭 확인</b>하세요.`}<br>
          🔵 <b>문자로 보내실 수 있게</b> 한 학생에 <b>사진 한 장</b>으로 만들고,
          <b>한 장이 1MB를 넘지 않게</b> 맞춥니다(MMS가 대개 그 언저리입니다).<br>
          ⚠ 사진이라 글자를 복사·검색할 수 없습니다. 종이로 곱게 뽑으실 때는
          그 학생 리포트 화면의 <b>「인쇄」</b>를 쓰세요 — 그쪽은 글자가 선명합니다.<br>
          ⚠ <b>「선생님 한마디」는 저장하신 것만</b> 들어갑니다.</p>
      </div>
      <div class="hwd-f">
        <div class="nav">
          <button class="btn sm" ${running ? 'disabled' : ''} onclick="closeReportBatch()">닫기</button>
          <button class="btn p sm" ${b.phase !== 'ready' || live.length === 0 ? 'disabled' : ''}
            onclick="runReportBatch()">${
              b.phase === 'loading' ? '읽는 중…'
              : running ? '만드는 중 ' + b.saved.length + '/' + live.length
              : b.phase === 'done' ? '다시 저장 (' + live.length + '장)'
              : rptCanPickFolder() ? '폴더 고르고 ' + live.length + '장 저장'
              : live.length + '장 저장'}</button>
        </div>
      </div>
    </aside>`;
}
function printReport(){

  /* 저장 안 한 한마디가 있으면 먼저 알린다 — 눌러 놓고 종이에서야 빠진 걸 알면 늦다. */
  const el = document.getElementById('rp-comment');
  const saved = (state.reportDocs[reportKey(state.studentDetailId, reportYm())] || {}).comment || '';
  if(el && el.value.trim() !== saved.trim()){
    showToast('선생님 한마디가 아직 저장되지 않았습니다 — 저장해야 문서에 실립니다.');
  }
  window.print();
}

function sdReportHTML(s, rec){
  const sid = s.studentId, ym = reportYm();
  loadAllRecordsIfNeeded();
  loadReportIfNeeded(sid, ym);
  const isThisMonth = ym === ymNow();
  const d = reportDataOf(s, rec, ym);
  const doc = state.reportDocs[reportKey(sid,ym)] || {};
  const comment = reportCommentText(sid, ym);

  const R = signalRules();
  let anyWarn = false;
  /* 한 줄 = 이름 · 막대 · % · 풀어 쓴 말.
     🔴 **% 만 두지 않는다** — 「50%」는 2건 중 1건일 때도 20건 중 10건일 때도 같은 얼굴이라,
       옆에 «몇 건 중 몇 건»이 없으면 학부모가 크기를 못 잡는다.
     ⚠ **곁말(「기록된 n일」·「지금까지」·「지금」)은 뺐다** (2026-08-27 · 사용자가 「의미 없는 것 같다」).
       그 대신 **분모를 본문 안에 드러낸다** — 출결은 출석·지각·결석을 «0이어도» 적어서
       그 합이 곧 며칠인지 말하게 했다. 곁말로 분모를 대신하던 것을 본문으로 옮긴 셈이다. */
  const meter = (label, pct, text, g) => {
    if(g) anyWarn = true;
    return `<div class="rp-m${g ? ' ' + g : ''}">
      <span class="k">${label}</span>
      <span class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></span>
      <b class="p mono">${pct}%</b>
      <span class="x">${text}</span>
    </div>`;
  };

  const meters = [];
  if(d.attPct !== null){
    /* 출석·지각·결석은 **0이어도 적는다** — 「결석 0」은 학부모가 가장 보고 싶은 줄이고,
       셋을 다 적으면 합이 곧 분모라 「기록된 n일」이 필요 없어진다.
       조퇴만 드문 일이라 있을 때만 낀다. */
    const bits = ["출석 " + d.att["출석"] + "일", "지각 " + d.att["지각"] + "일"];
    if(d.att["조퇴"]) bits.push("조퇴 " + d.att["조퇴"] + "일");
    bits.push("결석 " + d.att["결석"] + "일");
    meters.push(meter("출결", d.attPct, bits.join(" · "), rpGrade(d.attPct, "att", R)));
  }
  /* ⚠ 보완 필요는 «제출한 것 안»의 이야기다 — 그래서 「그중」이라고 적는다.
     막대와 %는 안 건드린다(제출률의 정의는 한 곳에서만 정해진다). */
  if(d.hw) meters.push(meter("과제 제출", d.hw.pct,
    d.hw.total + "건 중 " + d.hw.done + "건 제출" +
    (d.hw.partial ? " <s>그중 " + d.hw.partial + "건은 보완 필요</s>" : ""),
    rpGrade(d.hw.pct, "hw", R)));
  /* 🔵 **오답 숙제를 «제출»과 «정답률»로 가른다** (2026-08-27 · 사용자 요청).
     둘은 다른 이야기다 — **다 냈는데 많이 틀린 것**과 **아예 안 낸 것**은 집에서 할 일이 다르다.
     ⚠ 정답률의 분모는 «낸 것»이다(`done`). 안 낸 것까지 분모에 넣으면 «틀렸다»와 «안 냈다»가 섞인다.
     ⚠ 하나도 안 냈으면 정답률 줄은 아예 빼야 한다 — 0/0은 0%가 아니라 «말할 수 없음»이다. */
  if(d.wrong){
    const left = d.wrong.total - d.wrong.done;
    meters.push(meter("오답 제출", d.wrong.pct,
      d.wrong.total + "건 중 " + d.wrong.done + "건 제출" +
      (left ? " <s>남은 " + left + "건</s>" : ""),
      rpGrade(d.wrong.pct, "hwLeft", R, left)));
    if(d.wrong.done){
      const cpct = Math.round(d.wrong.correct / d.wrong.done * 100);
      meters.push(meter("오답 정답률", cpct,
        "제출한 " + d.wrong.done + "건 중 " + d.wrong.correct + "건 정답",
        rpGrade(cpct, "rate", R)));
