<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김하현수학연구소 | 고등수학 전문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 구버전(Noto Sans KR·Serif 900)과 ds.css(Serif 600·Mono 500)가 쓰는 굵기를 한 요청에 합쳤다.
     이행이 끝나 구버전 화면이 사라지면 Noto Sans KR과 Serif 900은 빼면 된다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="ds.css">

<style>
/* ============================================================
   실서비스 셸 — «배치»만 둔다. 색·서체·반경·간격은 ds.css 토큰을 쓴다.
   목업은 1440×900 캔버스 안에서 절대배치라 .topbar/.subnav가 absolute이고
   .body가 top:52px로 떠 있다. 실제 앱은 «스크롤하는 문서»라 그대로 쓸 수 없다.
   여기서 바꾸는 것은 position 뿐이다.
   ============================================================ */
.app{background:var(--paper);color:var(--ink);min-height:100vh;
  font-family:'Pretendard',-apple-system,sans-serif;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
.app .topbar{position:sticky;top:0;}
.app .subnav{position:sticky;top:52px;}
/* .body는 ds.css에서 absolute·top:52px다. 스크롤 문서에서는 그냥 흐르게 둔다. */
.app .body{position:static;padding:20px;}
.app .topbar .bm{display:flex;align-items:center;gap:9px;}
.app .topbar .bm img{height:22px;width:auto;display:block;}
.app .topbar nav a{cursor:pointer;}
.app .subnav a{cursor:pointer;}
/* 아직 새 디자인으로 옮기지 않은 화면은 이 안에서 구버전 스타일을 그대로 쓴다. */
.app .legacy{padding:0;}

/* ---------- 명단 (design-v1/01-roster) ----------
   목업은 .main을 absolute로 잡고 액션바를 캔버스 바닥(bottom:0)에 붙인다.
   실서비스는 스크롤하는 문서라 «흐르는 표 + 뷰포트에 고정된 액션바»가 된다.
   ds.css의 클래스 이름은 여기서 다시 정의하지 않는다 — 전부 rst- 접두사다.
   (.actbar의 position만 예외다. 위 규칙대로 position만 바꾼다.) */
.app .rst-hrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.app .rst-views{display:flex;align-items:center;gap:7px;margin-top:16px;flex-wrap:wrap;}
.app .rst-fbar{display:flex;align-items:center;gap:8px;margin-top:13px;padding-bottom:13px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;}
.app .rst-fbar .field{width:262px;}
.app .rst-fbar .field input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:inherit;font-size:12.5px;color:var(--ink);}
.app .rst-cnt{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap;}
.app .rst-cnt b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600;}
.app .rst-selwrap{padding-right:6px;}
.app .rst-sel{border:0;background:transparent;outline:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink);}

/* 머리말은 고정하고 표«만» 스크롤한다 — 목업의 .main / .tablewrap과 같은 구조다.
   문서 스크롤에 맡기고 th를 top:52px로 붙이는 방법은 쓸 수 없다.
   가로 스크롤 때문에 .rst-wrap이 overflow:auto가 되는 순간 그 안이 새 스크롤포트가 되어
   sticky 기준이 뷰포트가 아니라 이 상자로 바뀌고, 헤더가 52px 내려와 첫 행을 덮는다.
   높이 92px = 상단바 52 + .body 상하 패딩 20+20. (서브탭 있는 화면으로 옮길 땐 +42) */
.app .rst-screen{display:flex;flex-direction:column;height:calc(100vh - 92px);}
.app .rst-head{flex-shrink:0;}
.app .rst-wrap{flex:1;min-height:0;overflow:auto;margin-top:2px;}
.app .rst-wrap table.grid thead th{position:sticky;top:0;z-index:2;}
/* 행 높이는 40px로 고정한다. 한 행이라도 두 줄이 되면 표의 리듬이 깨진다.
   그래서 table-layout:fixed로 열 너비를 못 박고, 넘치는 글자는 …로 자른다.
   1440 캔버스를 전제로 그린 표다. 그보다 좁은 화면에서는 표«만» 가로로 스크롤한다
   (문서 전체가 밀리면 상단바까지 따라 움직여서 어디에 있는지 알 수 없게 된다). */
.app .rst-wrap table.grid{table-layout:fixed;min-width:1418px;}
/* 반을 고르면 「반」·「반 진도」 두 열이 빠진다. 그만큼 최소 너비도 줄여야
   좁은 화면에서 괜히 가로 스크롤이 남는다. */
.app .rst-wrap table.grid.narrow{min-width:1214px;}
.app .rst-wrap td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app .rst-wrap .cb{cursor:pointer;}

.app .rst-sig{display:flex;align-items:center;gap:6px;min-width:0;}
.app .rst-sig .why{flex:1;min-width:0;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;}
.app .rst-act{display:flex;gap:5px;justify-content:flex-end;opacity:0;transition:opacity var(--t);}
.app .rst-wrap tbody tr:hover .rst-act,
.app .rst-act:focus-within{opacity:1;}

/* ---------- 신호 (design-v1/05-signals) ----------
   등급으로 묶은 한 줄기 세로 목록. 명단의 .rst-screen 골격을 그대로 쓴다. */
.app .sig-list{flex:1;min-height:0;overflow:auto;}
/* 등급 머리 — 연대기의 날짜 자리와 같은 역할이라 스크롤에 붙여 둔다 */
.app .sig-ghead{display:flex;align-items:center;gap:9px;padding:22px 2px 9px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;}
.app .sig-ghead b{font-size:13px;font-weight:700;}
.app .sig-n{font-size:12px;font-weight:600;color:var(--dim);}
.app .sig-do{font-size:12px;color:var(--sub);}
.app .sig-cond{margin-left:auto;font-size:11px;color:var(--dim);}

/* 한 줄 = 한 학생. 근거 문장이 주인공이다 — 뱃지만 있으면 «위험하다»만 알고 아무 것도 못 한다. */
.app .sig-row{display:flex;align-items:center;gap:13px;padding:12px 2px;
  border-bottom:1px solid var(--line2);transition:background var(--t);}
.app .sig-row:hover{background:var(--hover);}
.app .sig-row.off{opacity:.5;}
.app .sig-who{width:198px;flex-shrink:0;display:flex;align-items:center;gap:10px;cursor:pointer;}
.app .sig-t{min-width:0;}
.app .sig-t b{display:block;font-size:13.5px;font-weight:600;}
.app .sig-t span{display:block;font-size:11.5px;color:var(--dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app .sig-mid{flex:1;min-width:0;cursor:pointer;}
.app .sig-rules{display:flex;gap:5px;flex-wrap:wrap;}
.app .sig-why{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.55;}
.app .sig-why b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);}
.app .sig-num{width:104px;flex-shrink:0;text-align:right;}
.app .sig-sc{font-size:15px;font-weight:600;letter-spacing:-.02em;}
.app .sig-num .dots{justify-content:flex-end;margin-top:6px;}
.app .sig-act{width:250px;flex-shrink:0;display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;
  opacity:0;transition:opacity var(--t);}
.app .sig-row:hover .sig-act,
.app .sig-act:focus-within{opacity:1;}
/* 위험은 미루면 안 된다. 이 등급만 조치 버튼을 상시 노출한다 —
   장식이 아니라 등급 차이를 «행동»으로 드러내는 유일한 지점이다. */
.app .sig-row.now .sig-act,
.app .sig-row.off .sig-act{opacity:1;}

/* ---------- 수업 (design-v1/02-class) ----------
   목업은 좌측 사이드바를 캔버스에 absolute로 붙였다. 실서비스는 그냥 두 칸 플렉스다.
   ds.css의 .steps / .tile / .seg / .actbar 는 그대로 쓴다 — 여기서 다시 정의하지 않는다. */
.app .cls-screen{display:flex;height:calc(100vh - 92px);}
.app .cls-side{width:270px;flex-shrink:0;padding-right:18px;border-right:1px solid var(--line);
  overflow-y:auto;}
.app .cls-main{flex:1;min-width:0;padding-left:24px;display:flex;flex-direction:column;}
.app .cls-mh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;flex-shrink:0;}
.app .cls-nav{display:flex;align-items:center;gap:8px;}
.app .cls-day{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
  white-space:nowrap;}

/* 오늘의 수업 — 시간이 1차 축이다. 반을 고르는 것이 아니라 «지금 하는 수업»을 고른다. */
.app .cls-sess{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 15px;margin-bottom:9px;position:relative;cursor:pointer;
  transition:border-color var(--t),background var(--t);}
.app .cls-sess:hover{background:var(--hover);}
.app .cls-sess.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(63,53,55,.1);}
.app .cls-sess .t{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);font-weight:600;}
.app .cls-sess .n{font-size:14px;font-weight:700;margin-top:5px;letter-spacing:-.02em;}
.app .cls-sess .m{font-size:11.5px;color:var(--sub);margin-top:5px;}
.app .cls-sess .st{position:absolute;right:13px;top:13px;}

.app .cls-todo{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px 15px;}
.app .cls-todo a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink);cursor:pointer;}
.app .cls-todo a:last-child{border-bottom:none;}
.app .cls-todo a:hover{color:var(--accent);}
.app .cls-todo a b{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
  background:var(--line2);border-radius:var(--r-xs);padding:2px 8px;color:var(--sub);}
.app .cls-todo a.hot b{background:var(--nobg);color:var(--no);}

/* 단계 본문«만» 스크롤한다. 머리말·단계 막대는 늘 보여야 어디까지 했는지 안다. */
.app .cls-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* align-items:start — 사유 칸이 붙어 커진 타일에 같은 행의 멀쩡한 타일까지 끌려가지 않게 한다.
   높이가 들쭉날쭉해지지만, 그 차이가 곧 «여기 손볼 게 남았다»는 신호라 오히려 읽기 쉽다. */
.app .cls-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  align-content:start;align-items:start;}
@media (max-width:1180px){ .app .cls-tiles{grid-template-columns:repeat(2,1fr);} }
/* 사유·보충영상 칸이 붙는 타일은 세로로 자란다. ds.css의 .tile은 64px 고정이라 여기서 푼다. */
.app .cls-tiles .tile{height:auto;min-height:64px;flex-wrap:wrap;padding:11px 13px;}
.app .cls-tiles .tile .seg{margin-left:auto;}
.app .cls-sub{flex:0 0 100%;display:flex;gap:6px;margin-top:9px;}
.app .cls-sub input{flex:1;min-width:0;height:30px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--paper);padding:0 9px;
  font-family:inherit;font-size:12px;color:var(--ink);outline:none;}
.app .cls-sub input:focus{border-color:var(--accent-line);}

/* 구버전 .lg-field / .inline-form 은 .legacy 안에서만 산다. DS 화면에서는 스타일이 없다. */
.app .cls-form{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-top:11px;}
.app .cls-form label{display:flex;flex-direction:column;gap:5px;}
.app .cls-form label span{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.02em;}
.app .cls-form input,.app .cls-form textarea{border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);
  outline:none;width:100%;resize:vertical;}
.app .cls-form input:focus,.app .cls-form textarea:focus{border-color:var(--accent-line);}

.app .cls-memo{width:100%;min-height:220px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--note);padding:15px 17px;font-family:inherit;font-size:13.5px;line-height:1.75;
  color:var(--ink);outline:none;resize:vertical;}
.app .cls-memo:focus{border-color:var(--accent-line);}

.app .cls-chaps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.app .cls-chap{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;font-size:13px;
  cursor:pointer;transition:background var(--t),border-color var(--t);}
.app .cls-chap:hover{background:var(--hover);}
.app .cls-chap.on{background:var(--accent-bg);border-color:var(--accent-line);font-weight:600;}

.app .cls-hw{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 16px;margin-bottom:9px;display:flex;align-items:center;gap:14px;}
.app .cls-hw .n{flex:1;min-width:0;font-size:13.5px;font-weight:600;}
.app .cls-hw .n s{display:block;text-decoration:none;font-size:11.5px;font-weight:400;color:var(--dim);margin-top:3px;}

/* ---------- 반 관리 (design-v1/06-classes 외) ----------
   시안의 핵심은 «좌측 반 목록이 네 화면 공통»이라는 것이다. 예전에는 목록 화면과 상세 화면이
   따로여서 반을 바꿀 때마다 «← 반 목록으로»를 눌러 돌아가야 했다. 목록을 늘 띄워 두면 그 왕복이 사라진다.
   높이 134px = 상단바 52 + 서브탭 42 + .body 상하 패딩 40. */
.app .chub-screen{display:flex;height:calc(100vh - 134px);}
.app .chub-side{width:250px;flex-shrink:0;padding-right:16px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;}
.app .chub-lh{display:flex;align-items:center;flex-shrink:0;padding-bottom:10px;}
.app .chub-lbody{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px;}
/* 반 하나 = 한 항목. 진도 막대를 항목 안에 두면 목록만 봐도 어디가 밀렸는지 보인다. */
.app .chub-cl{padding:10px 12px;border-left:3px solid transparent;border-radius:0 var(--r-md) var(--r-md) 0;
  cursor:pointer;transition:background var(--t);}
.app .chub-cl:hover{background:var(--hover);}
.app .chub-cl.on{background:var(--accent-bg);border-left-color:var(--accent);}
.app .chub-cl .n{font-size:13.5px;font-weight:600;}
.app .chub-cl .m{font-size:11.5px;color:var(--dim);margin-top:3px;}
.app .chub-cl .p{display:flex;align-items:center;gap:8px;margin-top:8px;}
.app .chub-cl .p .bar{flex:1;}
.app .chub-cl .p span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}
.app .chub-cl.off .n{color:var(--dim);font-weight:500;}

.app .chub-main{flex:1;min-width:0;padding-left:24px;display:flex;flex-direction:column;}
.app .chub-mh{display:flex;align-items:flex-start;gap:14px;flex-shrink:0;}
.app .chub-mh .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.app .chub-body{flex:1;min-height:0;overflow:auto;margin-top:16px;}
/* 아직 DS로 안 옮긴 서브탭은 이 안에서 구버전 스타일 그대로 그린다. */
.app .chub-body > .legacy{padding:0;}

/* 단원 체크리스트 — 표가 아니라 «목록»이다. 열이 많은 표는 훑는 데 좋고,
   순서가 있는 것은 목록이 낫다. 진도는 순서가 전부다. */
.app .chub-u{display:flex;align-items:center;gap:13px;padding:11px 2px;
  border-bottom:1px solid var(--line2);cursor:pointer;transition:background var(--t);}
.app .chub-u:hover{background:var(--hover);}
.app .chub-u .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid #C9C6BB;
  background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:11px;font-weight:700;transition:all var(--t);}
.app .chub-u.done .ck{background:var(--accent);border-color:var(--accent);color:#fff;}
.app .chub-u.now .ck{border-color:var(--accent);border-style:dashed;}
.app .chub-u .no{width:22px;flex-shrink:0;font-family:'JetBrains Mono',monospace;
  font-size:11.5px;color:var(--dim);}
.app .chub-u .t{flex:1;min-width:0;font-size:13.5px;}
.app .chub-u.done .t{color:var(--sub);}
.app .chub-u.wait .t{color:var(--dim);}
.app .chub-u .st{flex-shrink:0;}

/* 수업 기록 (design-v1/14-log) — 한 행이 한 번의 수업. 그날 남은 것이 전부 그 행 안에 있다. */
.app .chub-fbar{display:flex;align-items:center;gap:7px;padding-bottom:13px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);flex-shrink:0;}
.app .chub-sess{display:flex;gap:18px;padding:15px 2px;border-bottom:1px solid var(--line2);
  cursor:pointer;transition:background var(--t);}
.app .chub-sess:hover{background:var(--hover);}
.app .chub-sess .when{width:104px;flex-shrink:0;}
.app .chub-sess .when .d{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;}
.app .chub-sess .when .w{font-size:11px;color:var(--dim);margin-top:4px;}
.app .chub-sess .mid{flex:1;min-width:0;}
.app .chub-sess .att{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.app .chub-sess .att .sum{font-size:12.5px;color:var(--sub);}
.app .chub-sess .att .sum b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);}
.app .chub-sess .memo{margin-top:10px;background:var(--note);border:1px solid var(--note-line);
  border-radius:var(--r-md);padding:9px 12px;font-size:12.5px;color:var(--sub);line-height:1.7;
  white-space:pre-wrap;}
.app .chub-sess .tags{width:186px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;
  align-items:flex-end;font-size:11.5px;color:var(--dim);text-align:right;}

<script>
/* =================== 저장소 유틸 (Firebase Firestore) =================== */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
async function dbGet(key, fallback){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
    if(res.status === 404) return fallback;
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    return JSON.parse(doc.fields.value.stringValue);
  }catch(e){ console.error('불러오기 실패', key, e); return fallback; }
}
async function dbSet(key, value){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(value) } } })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    return true;
  }
  catch(e){ console.error('저장 실패', key, e); return null; }
}
async function dbDelete(key){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_BASE + '/' + encodeURIComponent(key), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', key, e); }
}

/* =================== 저장소 유틸 2 — 컬렉션(문서 하나당 레코드 하나) =================== */
// 예전엔 kv/students 문서 하나에 학생 전체 배열을 통째로 저장해서, 학생 한 명만 바꿔도
// 전체를 다시 쓰고(동시 편집 시 서로 덮어씀) 문서 1MB 한도에도 걸릴 수 있었다.
// 아래 3개 함수는 컬렉션 하나에 레코드마다 문서를 따로 둬서 그 문제를 없앤다.
// (Firestore 문서 형식을 그대로 쓰지 않고 예전처럼 value 필드 하나에 JSON 문자열로 넣는 이유는
//  기존 dbGet/dbSet과 직렬화 방식을 통일해서 변환 과정에서 실수할 여지를 줄이기 위함.)
async function dbSetDoc(collection, id, data){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_ROOT + '/' + collection + '/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(data) } } })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    return true;
  }catch(e){ console.error('저장 실패', collection, id, e); return null; }
}
async function dbDeleteDoc(collection, id){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_ROOT + '/' + collection + '/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', collection, id, e); }
}
async function dbGetCollection(collection){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    let out = [], pageToken = '';
    do{
      const url = FIRESTORE_ROOT + '/' + collection + '?pageSize=300' + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await withTimeout(fetch(url, { headers: { Authorization: 'Bearer ' + token } }), 8000);
      if(res.status === 404) break;
      if(!res.ok) throw new Error('firestore http ' + res.status);
      const json = await res.json();
      (json.documents || []).forEach(doc => {
        try{ out.push(JSON.parse(doc.fields.value.stringValue)); }catch(e){}
      });
      pageToken = json.nextPageToken || '';
    } while(pageToken);
    return out;
  }catch(e){ console.error('컬렉션 불러오기 실패', collection, e); return []; }
}
// 예전 kv/{oldKey} 블롭(배열 하나)을 컬렉션(문서마다 레코드 하나)로 1회 옮긴다.
// 새 컬렉션에 이미 데이터가 있으면(=이미 옮겨졌으면) 아무것도 안 하고 그걸 그대로 쓴다.
// 예전 블롭 문서는 안전하게 그대로 남겨둔다(옮기다 실패해도 원본 데이터가 사라지지 않도록).
async function migrateBlobToCollection(oldKey, collection, idField){
  const existing = await dbGetCollection(collection);
  if(existing.length > 0) return existing;
  const oldArr = await dbGet(oldKey, []);
  if(!oldArr || oldArr.length === 0) return [];
  // 예전 데이터 중엔 id 필드 자체가 없던 것도 있어서(예: 상담 신청), 없으면 이전하면서 하나 만들어 채운다.
  // 안 그러면 전부 같은 문서 키로 겹쳐 써져서 데이터가 사라진다.
  oldArr.forEach((item, i) => { if(!item[idField]) item[idField] = collection + '_migrated_' + Date.now() + '_' + i; });
  await Promise.all(oldArr.map(item => dbSetDoc(collection, String(item[idField]), item)));
  console.log('[migrate] ' + oldKey + ' -> ' + collection + ': ' + oldArr.length + '건 이전 완료');
  return oldArr;
}

/* =================== AI 쌍둥이 문제 생성 (일 20건 한도) =================== */
/* «오늘»은 로컬 날짜다. 예전엔 toISOString()(UTC)이었는데, KST(+9)에서는 00:00~09:00 사이에
   하루 전을 가리켰다. 그 시간대에 출결을 넣으면 하루 전 날짜로 저장됐고,
   반 관리의 수업 날짜 목록은 «요일은 로컬로 판정하고 날짜는 UTC로 기록»해서 통째로 하루씩 밀렸다
   (월·수·금 반이 일·화·목으로 보였다).
   이미 저장된 기록의 날짜는 그대로 둔다 — 고쳐 봐야 어느 쪽이 맞는지 알 수 없다. */
function ymdLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return ymdLocal(new Date()); }
async function getAIQuotaUsed(){
  const q = await dbGet('ai-quota', { date: todayStr(), count: 0 });
  if(q.date !== todayStr()) return 0;
  return q.count;
}
async function bumpAIQuotaUsed(){
  const used = await getAIQuotaUsed();
  await dbSet('ai-quota', { date: todayStr(), count: used + 1 });
}
async function loadAIQuotaIfNeeded(){
  if(state.aiQuotaUsed !== null) return;
  state.aiQuotaUsed = await getAIQuotaUsed();
  render();
}
async function regenerateOneWithAI(bankId){
  if(state.aiProcessing){ showToast('다른 AI 작업이 진행 중입니다. 끝난 뒤 다시 시도해주세요.'); return; }
  const b = DATA.problemBank.find(x=>x.id===bankId);
  if(!b) return;
  const used = await getAIQuotaUsed();
  if(used >= AI_DAILY_LIMIT){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  state.aiProcessing = true;
  state.aiRegeneratingId = bankId;
  render();
  const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
  const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
  if(twin){
    b.variantContent = twin.content;
    b.variantAnswer = twin.answer;
    b.aiSolution = twin.solution;
    b.status = 'pending';
    await dbSetDoc('problembank', b.id, b);
    await bumpAIQuotaUsed();
    state.aiQuotaUsed = null;
    showToast('다시 생성했습니다. 검토 상태가 초기화됐어요.');
  } else {
    showToast('생성에 실패했습니다. 잠시 후 다시 시도해주세요.');
  }
  state.aiProcessing = false;
  state.aiRegeneratingId = null;
  render();
}
async function processAIQueue(){
  if(state.aiProcessing) return;
  const needsAI = DATA.problemBank.filter(b=>!b.variantContent && !b.variantAnswer);
  if(needsAI.length===0){ showToast('생성할 문항이 없습니다.'); return; }
  const used = await getAIQuotaUsed();
  const remaining = AI_DAILY_LIMIT - used;
  if(remaining<=0){ showToast('오늘 AI 생성 한도(' + AI_DAILY_LIMIT + '건)를 모두 사용했습니다. 내일 다시 시도해주세요.'); return; }
  const batch = needsAI.slice(0, remaining);
  state.aiProcessing = true;
  state.aiProgress = { done:0, total: batch.length };
  render();
  let ok = 0;
  for(let i=0;i<batch.length;i++){
    const b = batch[i];
    const image = b.hasImage ? await dbGet('pbimg:'+b.id, null) : null;
    const twin = await generateTwinViaAI(b.originalContent, b.originalAnswer, image);
    if(twin){
      b.variantContent = twin.content;
      b.variantAnswer = twin.answer;
      b.aiSolution = twin.solution;
      await bumpAIQuotaUsed();
      ok++;
    }
    await dbSetDoc('problembank', b.id, b);
    state.aiProgress = { done:i+1, total: batch.length };
    render();
    if(i < batch.length-1) await new Promise(r=>setTimeout(r, 13000));
  }
  state.aiProcessing = false;
  state.aiProgress = null;
  state.aiQuotaUsed = null;
  const leftover = needsAI.length - batch.length;
  showToast(ok + '개 쌍둥이 문제가 생성되었습니다. 검토 후 공개해주세요.' + (leftover>0 ? ` (남은 ${leftover}개는 내일 한도 초기화 후 처리해주세요)` : ''));
  render();
}
// AI가 프롬프트 지시를 놓쳐서 "times"/"le"/"ge" 같은 영단어를 LaTeX 명령어 대신 그대로
// 쓰는 경우가 있어서(프롬프트 개선과 별개로) 이중 안전장치로 한 번 더 다듬는다.
function sanitizeAiMathText(s){
  if(!s) return s;
  return s
    .replace(/(?<!\\)\btimes\b/gi, '\\times')
    .replace(/(?<!\\)\bLEQ\b/gi, '\\leq')
    .replace(/(?<!\\)\bGEQ\b/gi, '\\geq');
}
async function generateTwinViaAI(content, answer, image){
  try{
    const payload = { content, answer };
    if(image){
      if(typeof image === 'string') payload.image = image; // 레거시 base64
      else if(image.fileId) payload.imageFileId = image.fileId; // 신규: 드라이브 파일ID
    }
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(AI_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload)
    }), 45000); // imageFileId 경로는 워커가 드라이브에서 바이트를 먼저 받아와야 해서 기존보다 여유를 둠
    if(!res.ok) throw new Error('worker http ' + res.status);
    const data = await res.json();
    if(!data.content || !data.answer) throw new Error('incomplete AI result');
    return {
      content: sanitizeAiMathText(data.content),
      answer: normalizeTwinAnswer(sanitizeAiMathText(data.answer)),
      solution: data.solution || ''
    };
  }catch(e){
    console.error('AI 쌍둥이 생성 실패', e);
    return null;
  }
}

/* =================== Firestore 컬렉션(문서 여러 개) 헬퍼 =================== */
/* kv 방식(단일 문서에 큰 JSON 저장)은 대량 데이터에는 안 맞아서, 문항 창고처럼
   개수가 많이 늘어날 수 있는 데이터는 문서를 하나씩 따로 저장하는 이 방식을 쓴다. */
function toFirestoreFields(obj){
  const fields = {};
  for(const k in obj){ fields[k] = { stringValue: String(obj[k] ?? '') }; }
  return fields;
}
function fromFirestoreDoc(doc){
  const obj = { id: doc.name.split('/').pop() };
  const fields = doc.fields || {};
  for(const k in fields){ obj[k] = fields[k].stringValue ?? ''; }
  return obj;
}
async function collectionAdd(collectionName, data){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    const res = await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: toFirestoreFields(data) })
    }), 8000);
    if(!res.ok) throw new Error('firestore http ' + res.status);
    const doc = await res.json();
    return fromFirestoreDoc(doc);
  }catch(e){ console.error('추가 실패', collectionName, e); return null; }
}
async function collectionListAll(collectionName){
  const out = [];
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    let pageToken = '';
    do{
      const url = FIRESTORE_ROOT + '/' + collectionName + '?pageSize=300' + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await withTimeout(fetch(url, { headers: { Authorization: 'Bearer ' + token } }), 8000);
      if(!res.ok) throw new Error('firestore http ' + res.status);
      const data = await res.json();
      (data.documents || []).forEach(doc => out.push(fromFirestoreDoc(doc)));
      pageToken = data.nextPageToken || '';
    } while(pageToken);
  }catch(e){ console.error('목록 조회 실패', collectionName, e); }
  return out;
}
async function collectionDelete(collectionName, id){
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await withTimeout(fetch(FIRESTORE_ROOT + '/' + collectionName + '/' + id, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token }
    }), 8000);
  }catch(e){ console.error('삭제 실패', collectionName, e); }
}

// (학생 계정 자체엔 별도 재적 상태 필드가 없고, 출석부에서 "퇴원"으로 기록하는 게

function isWithdrawnRecord(rec){
  if(!rec || !rec.attendance || rec.attendance.length===0) return false;
  const latest = [...rec.attendance].sort((a,b)=>a.date.localeCompare(b.date)).pop();
  return !!latest && latest.status==='퇴원';
}

const SESSION_KEY = 'khm-session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(state.currentUser)); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
async function restoreSession(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ saved = null; }
  if(!saved || !saved.type) return;
  if(saved.type==='teacher'){
    state.currentUser = {type:'teacher'};
    state.view = 'teacher';
  } else if(saved.type==='student'){
    const found = DATA.students.find(s=>s.studentId===saved.studentId);
    if(!found){ clearSession(); return; }
    const rec = await loadRecord(found.studentId);
    if(isWithdrawnRecord(rec)){ clearSession(); return; } // 로그인해 있던 중 퇴원 처리되면 다음 방문 때 자동 로그아웃
    state.currentUser = {type:'student', studentId:found.studentId, name:found.name};
    state.view = 'student';
  } else if(saved.type==='assistant'){
    const found = DATA.assistants.find(a=>a.id===saved.id);
    if(!found){ clearSession(); return; }
    state.currentUser = {type:'assistant', id:found.id, taId:found.taId, name:found.name, classId:found.classId};
    state.view = 'assistant';

// 반 일정 문자열(예: "월,수,금 7시~9시")에서 요일 글자를 찾아 요일 인덱스 배열로 변환.
const WEEKDAY_MAP = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function parseScheduleDays(schedule){
  if(!schedule) return [];
  const days = [];
  for(const ch of schedule){
    if(WEEKDAY_MAP[ch]!==undefined && !days.includes(WEEKDAY_MAP[ch])) days.push(WEEKDAY_MAP[ch]);
  }
  return days;
}
// 반 일정을 기준으로 최근(및 며칠 앞) 수업일을 최신순으로 생성한다. "차시" 번호 없이 날짜만 다룬다.
function generateClassSessionDates(schedule, count){
  const days = parseScheduleDays(schedule);
  if(days.length===0) return [];
  const result = [];
  const d = new Date();
  d.setDate(d.getDate()+2); // 다가오는 수업일도 1~2개 미리 보이도록
  while(result.length < count){
    if(days.includes(d.getDay())) result.push(ymdLocal(d));   // getDay()가 로컬이므로 날짜도 로컬로
    d.setDate(d.getDate()-1);
  }
  return result;
}

  if(!cid) return '전체';
  const c = DATA.classes.find(c=>c.id===cid);
  return c ? c.name : '[삭제된 반]';
}

// 객관식(①~⑤가 포함된) 문제인지 판별 — 맞으면 텍스트 입력 대신 보기 버튼을 보여준다.
// 채점이 문자열 비교라서, 학생이 "3"이라고 타이핑하면 정답 "③"과 안 맞아 오답 처리되던 문제를 해결.
function isMultipleChoice(content){
  return /①/.test(content||'');
}

/* =================== 학생이 «입력할 수 있는» 정답인가 ===================
   답안 입력칸이 받는 것은 둘뿐이다 — 숫자 입력 아니면 ①~⑤ 보기 버튼(answerInputHTML).
   분수·무리수·음수·문자식이 정답이면 학생은 풀고도 제출할 방법이 없다.
   그래서 AI 프롬프트에 «999 이하 자연수 아니면 객관식»을 못박아 뒀고(worker/gemini-proxy.js),
   여기서는 그 약속이 지켜졌는지 «받는 쪽»에서 한 번 더 확인한다.
   생성 모델은 규칙을 어길 수 있고, 어긴 문항이 조용히 학생에게 가면 아무도 못 푼다. */
const CHOICE_SYMBOLS = ['①','②','③','④','⑤'];
function isPlainNaturalAnswer(a){
  return /^[1-9][0-9]{0,2}$/.test(String(a==null?'':a).trim());   // 1~999
}
/* AI는 formatRule("수식은 $로 감싸라") 때문에 숫자 정답에도 $를 두른다 — 실제로 «$155$»가 나왔다.
   채점이 문자열 비교라 학생이 155를 내면 오답이 된다. 받는 쪽에서 벗겨 둔다.
   벗긴 결과가 999 이하 자연수일 때«만» 벗긴다 — $\frac{1}{2}$ 같은 것은 그대로 둬야
   검토 화면에서 선생님이 진짜 형태를 본다. */
function normalizeTwinAnswer(a){
  const s = String(a==null?'':a).trim();
  const m = s.match(/^\$\s*([0-9]{1,3})\s*\$$/);
  return (m && isPlainNaturalAnswer(m[1])) ? m[1] : s;
}
/* 문제 없으면 null, 있으면 «사람이 읽을 이유»를 돌려준다. */
function answerFormProblem(content, answer){
  const a = String(answer==null?'':answer).trim();
  const mc = isMultipleChoice(content);
  if(!a) return '정답이 비어 있습니다.';
  if(CHOICE_SYMBOLS.includes(a)){
    return mc ? null : '정답이 보기 기호(' + a + ')인데 문제에 ①~⑤ 보기가 없습니다.';
  }
  if(mc) return '문제에 ①~⑤ 보기가 있는데 정답이 보기 기호가 아닙니다 (지금: ' + a + ').';
  if(isPlainNaturalAnswer(a)) return null;

function extractYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/watch\?[^#]*v=([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,15})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{6,15})/
  ];
  for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
  return null;
}
// 유튜브 iframe에 sandbox를 걸어서(allow-popups/allow-top-navigation 없음) 제목표시줄/로고를

/* ---------- 유튜브 시청 진도율 추적 ---------- */
// render()가 app.innerHTML을 통째로 새로 그리기 때문에, 재생 중 다른 이유로 render()가
// 다시 호출되면 iframe이 새로 만들어지면서 재생 위치가 초기화된다. 진도율 저장 자체는
// render()를 부르지 않도록 해서(=재생 화면을 다시 그리지 않도록) 이 문제를 최대한 피한다.
let ytApiLoading = false;
function ensureYouTubeAPI(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  if(!state.ytReadyCallbacks) state.ytReadyCallbacks = [];
  state.ytReadyCallbacks.push(cb);
  if(ytApiLoading) return;
  ytApiLoading = true;
  window.onYouTubeIframeAPIReady = function(){
    (state.ytReadyCallbacks||[]).forEach(fn=>fn());
    state.ytReadyCallbacks = [];
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
// 재생바 위치(getCurrentTime)가 아니라 "실제로 재생 상태였던 시간(벽시계 기준)"을 누적한다.
// 재생바 위치만 보면 끝부분으로 스킵만 해도 시청 완료로 잡히기 때문에, PLAYING 상태로
// 실제 흘러간 시간만 더하는 방식으로 바꿨다 — 스킵/탐색 자체는 시간을 늘리지 않는다.
async function noteVideoWatchTime(studentId, videoId, addSeconds, duration, ended){
  if(!duration || duration<=0) return;
  const rec = await loadRecord(studentId);
  const prev = rec.videoProgress[videoId] || {watchedSeconds:0, duration:0, percent:0, completed:false};
  const prevWatched = prev.watchedSeconds!==undefined ? prev.watchedSeconds : (prev.maxSeconds||0);
  const watchedSeconds = Math.min(duration, prevWatched + Math.max(0, addSeconds));
  const percent = Math.min(100, Math.round(watchedSeconds/duration*150));
  rec.videoProgress[videoId] = {
    watchedSeconds, duration, percent,
    completed: prev.completed || ended || percent>=95,
    updatedAt: new Date().toISOString()
  };
  await saveRecord(studentId);
  const label = document.getElementById('vprog-'+videoId);
  if(label) label.innerHTML = videoProgressBlockHTML(studentId, videoId);
}
function videoProgressGaugeHTML(percent, completed){
  const pct = Math.max(0, Math.min(100, percent||0));
  const milestone = completed || pct>=100 ? '🎉' : pct>=75 ? '⭐' : pct>=50 ? '🔥' : pct>=25 ? '🌿' : '🌱';
  return `<div class="video-gauge">
    <span class="video-gauge-emoji">${milestone}</span>
    <div class="video-gauge-bar"><div class="video-gauge-fill" style="width:${pct}%;"></div></div>
    <span class="video-gauge-pct lg-mono">${pct}%</span>
  </div>`;
}
function videoProgressBlockHTML(studentId, videoId){
  const rec = DATA.records[studentId];
  const p = rec && rec.videoProgress && rec.videoProgress[videoId];
  if(!p) return '<div class="lg-hint" style="margin-top:6px;">아직 시청 기록이 없습니다.</div>';
  const caption = (p.completed ? '시청 완료' : '시청 중') + ' · 최근 시청 ' + (p.updatedAt||'').slice(0,10);
  return videoProgressGaugeHTML(p.percent, p.completed) + `<div class="lg-mono" style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${caption}</div>`;
}
// 재생 중이던 구간의 벽시계 경과 시간을 정산해서 누적한다(멈춤/종료/화면전환 시 남은 조각까지 반영).
function flushWatchTick(entry, studentId, videoId, player, ended){
  if(entry.lastTick==null) return;
  const now = Date.now();
  const elapsed = Math.min(20, Math.max(0, (now-entry.lastTick)/1000)); // 백그라운드 탭 등으로 타이머가 밀려도 과도하게 잡히지 않도록 상한
  entry.lastTick = null;
  try{
    const dur = player.getDuration();
    noteVideoWatchTime(studentId, videoId, elapsed, dur, ended);
  }catch(err){}
}
// 학생이 '부교재 해설강의' 탭에 있을 때만 실제 유튜브 플레이어를 붙여서 재생 상태를 감시한다.
function mountVideoTrackers(studentId){
  const frames = document.querySelectorAll('.yt-tracked-frame[data-bank-vid]');
  if(frames.length===0) return;
  ensureYouTubeAPI(() => {
    if(!state.ytPlayers) state.ytPlayers = {};
    frames.forEach(frame => {
      const videoId = frame.dataset.bankVid;
      if(state.ytPlayers[videoId]) return; // 이미 이 화면에서 연결됨
      let player;
      try{
        player = new YT.Player(frame.id, {
          events: {
            onStateChange: (e) => {
              const entry = state.ytPlayers[videoId];
              if(!entry) return;
              if(e.data === YT.PlayerState.PLAYING){
                entry.lastTick = Date.now();
                if(entry.timer) clearInterval(entry.timer);
                entry.timer = setInterval(() => {
                  const now = Date.now();
                  const elapsed = Math.min(10, Math.max(0, (now-entry.lastTick)/1000));
                  entry.lastTick = now;
                  try{
                    const dur = player.getDuration();
                    noteVideoWatchTime(studentId, videoId, elapsed, dur, false);
                  }catch(err){}
                }, 5000);
              } else {
                if(entry.timer){ clearInterval(entry.timer); entry.timer = null; }
                flushWatchTick(entry, studentId, videoId, player, e.data===YT.PlayerState.ENDED);
              }
            }
          }
        });
      }catch(err){ return; }
      state.ytPlayers[videoId] = { player, timer: null };
    });
  });
}

function compressImageToBase64(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}
function compressImageToBlob(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('이미지 압축에 실패했습니다.')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}
const DRIVE_UPLOAD_TIMEOUT_MS = 55000;
async function uploadImageToDrive(file){
  const blob = await compressImageToBlob(file);
  const fd = new FormData();
  fd.append('file', blob, 'img_' + Date.now() + '.jpg');
  const token = await withTimeout(getAuthToken(), 8000);
  /* FormData다 — Content-Type을 직접 넣으면 안 된다. 브라우저가 boundary까지 붙여야 한다. */
  const res = await withTimeout(fetch(AI_WORKER_URL + '/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  }), DRIVE_UPLOAD_TIMEOUT_MS);
  if(!res.ok) throw new Error('upload http ' + res.status);
  return res.json(); // {url, fileId}
}
/* 토큰을 받아 오려면 await가 필요해서 async가 됐다. 부르는 쪽 8곳은 전부 결과를 기다리지 않는
   «보내 놓고 잊는» 호출이라 그대로 둔다 — 실패는 여기서 삼키므로 미처리 거부도 생기지 않는다. */
async function deleteFromDrive(fileId){
  if(!fileId) return;
  try{
    const token = await withTimeout(getAuthToken(), 8000);
    await fetch(AI_WORKER_URL + '/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ fileId })
    });
  }catch(e){ console.error('드라이브 파일 삭제 실패', e); }
}
function dataUrlToBlob(dataUrl){
  const m = dataUrl.match(/^data:([^;]+);base64,(.*)$/s);
  if(!m) throw new Error('잘못된 이미지 데이터입니다.');
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: m[1] });
}
// hwpx 임포트 등으로 이미 base64 data URL 형태로 메모리에 있는 이미지를 드라이브에 올릴 때 사용
async function uploadDataUrlToDrive(dataUrl){
  const blob = dataUrlToBlob(dataUrl);
  const fd = new FormData();
  fd.append('file', blob, 'img_' + Date.now() + '.jpg');
  const token = await withTimeout(getAuthToken(), 8000);
  const res = await withTimeout(fetch(AI_WORKER_URL + '/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  }), DRIVE_UPLOAD_TIMEOUT_MS);
  if(!res.ok) throw new Error('upload http ' + res.status);
  return res.json(); // {url, fileId}
}
// 레거시(base64 문자열) 레코드와 신규({url,fileId}) 레코드를 모두 렌더링할 수 있게 흡수하는 헬퍼
function imgSrcOf(v){
  if(!v) return null;
  return typeof v === 'string' ? v : (v.previewUrl || v.url || null);
}
function imgFileIdOf(v){
  return (v && typeof v === 'object') ? (v.fileId || null) : null;
}
async function handleExamFileSelect(fileList){
  syncExamDraftFromDOM();
  const files = Array.from(fileList || []);
  const entries = files.map(f => ({ uploading:true, previewUrl: URL.createObjectURL(f), file:f }));
  entries.forEach(e => examDraft.pages.push(e));
  render();
  let failed = 0;
  for(const entry of entries){
    try{
      const { url, fileId } = await uploadImageToDrive(entry.file);
      entry.uploading = false; entry.url = url; entry.fileId = fileId;
      URL.revokeObjectURL(entry.previewUrl);
      delete entry.file; delete entry.previewUrl;
    }catch(e){
      console.error('시험지 이미지 업로드 실패', entry.file && entry.file.name, e);
      URL.revokeObjectURL(entry.previewUrl);
      const idx = examDraft.pages.indexOf(entry);
      if(idx>=0) examDraft.pages.splice(idx,1);
      failed++;
    }
    render();
  }
  if(failed>0) showToast(failed + '개 이미지 업로드에 실패했습니다. 다시 시도해주세요.');
}

async function saveExam(){
  syncExamDraftFromDOM();
  if(!examDraft.title || !examDraft.classId){ showToast('반과 시험명을 입력해주세요.'); return; }
  const validQuestions = examDraft.questions.filter(q=>q.content.trim() && q.answer.trim());
  if(validQuestions.length===0){ showToast('문항을 최소 1개 이상 입력해주세요.'); return; }
  if(examDraft.pages.some(p=>p.uploading)){ showToast('이미지 업로드가 끝난 후 다시 시도해주세요.'); return; }
  const readyPages = examDraft.pages.filter(p=>p.url);
  // 문항 이미지는 problem-bank 항목마다 별도 문서(pbimg:id)로, 스캔 페이지는 구글 드라이브에
  // 올리고 링크만 저장한다. Firestore에는 짧은 URL/ID만 남아 문서 용량 제한에서 자유롭다.
  const questions = validQuestions.map((q,i)=>({no:i+1, content:q.content.trim(), answer:q.answer.trim(), unit:q.unit||''}));
  const examId = 'ex'+Date.now();
  const newExam = {id:examId, classId:examDraft.classId, title:examDraft.title, date:examDraft.date, questions, hasFiles:readyPages.length>0};
  DATA.exams.unshift(newExam);
  await dbSetDoc('exams', newExam.id, newExam);
  if(readyPages.length>0){
    await dbSet('examfiles:'+examId, readyPages);
  }
  for(let i=0;i<questions.length;i++){
    const q = questions[i];
    const srcImage = validQuestions[i].image;
    const bankId = 'pb'+Date.now()+'_'+q.no;
    let imgResult = null;
    if(srcImage){
      try{ imgResult = await uploadDataUrlToDrive(srcImage); }
      catch(e){ console.error('문항 이미지 업로드 실패', e); showToast(q.no+'번 문항 이미지 업로드에 실패했습니다.'); }
    }
    const bankEntry = {
      id:bankId, examId, questionNo:q.no,
      originalContent:q.content, originalAnswer:q.answer,
      variantContent:'', variantAnswer:'', status:'pending',
      hasImage: !!imgResult
    };
    DATA.problemBank.push(bankEntry);
    await dbSetDoc('problembank', bankEntry.id, bankEntry);
    if(imgResult) await dbSet('pbimg:'+bankId, imgResult);
  }
  examDraft = { classId:'', title:'', date:'', questions:[{content:'', answer:'', unit:UNITS[0]}], pages:[] };
  showToast('시험지가 등록되었습니다. 오답 문제 검토 탭에서 AI 쌍둥이 문제를 생성해보세요.');
  render();
}

async function submitWrongAnswers(){
  const examId = state.wrongExamId;
  const exam = DATA.exams.find(e=>e.id===examId);
  if(!exam){ showToast('시험지를 선택해주세요.'); return; }
  const wrongNos = Object.keys(state.wrongChecked).filter(k=>state.wrongChecked[k]).map(k=>parseInt(k));
  if(wrongNos.length===0){ showToast('틀린 문제 번호를 선택해주세요.'); return; }
  await loadUnitBankIfNeeded();
  const sid = state.currentUser.studentId;
  const rec = await loadRecord(sid);
  let matchedFromBank = 0, newlyRequested = 0;
  for(const no of wrongNos){
    let bank = findBankEntry(examId, no);
    if(!bank){
      const q = exam.questions.find(q=>q.no===no);
      if(!q) continue;
      const candidates = q.unit ? DATA.unitBank.filter(u=>u.unit===q.unit) : [];
      const match = candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : null;
      if(match){
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: match.content, variantAnswer: match.answer,
          status:'approved', source:'unitbank', unitBankId: match.id
        };
        matchedFromBank++;
      } else {
        bank = {
          id:'pb'+Date.now()+'_'+no, examId, questionNo:no,
          originalContent:q.content, originalAnswer:q.answer,
          variantContent: '', variantAnswer: '',
          status:'pending'
        };
        newlyRequested++;
      }
      DATA.problemBank.push(bank);
      await dbSetDoc('problembank', bank.id, bank);
    }
    if(!rec.wrongHomework.some(h=>h.bankId===bank.id)){
      rec.wrongHomework.push({bankId:bank.id, examId, questionNo:no, assignedAt:todayStr(), done:false, studentAnswer:''});
    }
  }
  await saveRecord(sid);
  state.wrongChecked = {};
  let msg = '제출되었습니다.';
  if(matchedFromBank>0 && newlyRequested>0) msg = `제출되었습니다. ${matchedFromBank}개는 바로 숙제로 나갔고, ${newlyRequested}개는 선생님이 등록하면 나갑니다.`;
  else if(matchedFromBank>0) msg = '제출되었습니다. 문항 창고에서 바로 숙제로 나갔습니다.';
  else if(newlyRequested>0) msg = '제출되었습니다. 선생님이 쌍둥이 문제를 등록하면 숙제로 나갑니다.';
  showToast(msg);
  render();
}

function escHtml(s){
  if(s===null || s===undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const HP_NS = 'http://www.hancom.co.kr/hwpml/2011/paragraph';
// 한글 수식 스크립트를 KaTeX가 그릴 수 있는 LaTeX로 변환하고 $..$ 로 감싼다.
// (완벽한 변환기는 아니고, 고등수학에서 자주 쓰는 패턴 위주로 처리한다)
// 문자열에서 openIdx가 가리키는 '{'와 짝이 맞는 ')'를 중첩까지 고려해서 찾는다.
// (예: sqrt{ ( x ^{2} ) ^{2} }처럼 안에 또 중괄호가 있는 경우 단순 정규식으론 못 잡음)
function findMatchingBrace(s, openIdx){
  let depth = 0;
  for(let i=openIdx;i<s.length;i++){
    if(s[i]==='{') depth++;
    else if(s[i]==='}'){ depth--; if(depth===0) return i; }
  }
  return -1;
}
// keyword 뒤의 "{...}"를 중첩 중괄호까지 포함해서 통째로 찾아 wrap(inner)로 치환한다.
function replaceBalancedKeyword(s, keyword, wrap){
  const re = new RegExp('\\b'+keyword+'\\s*\\{','g');
  let result = '', lastIndex = 0, m;
  while((m = re.exec(s))){
    const openIdx = m.index + m[0].length - 1;
    const closeIdx = findMatchingBrace(s, openIdx);
    if(closeIdx===-1) continue;
    const inner = s.slice(openIdx+1, closeIdx);
    result += s.slice(lastIndex, m.index) + wrap(inner);
    lastIndex = closeIdx+1;
    re.lastIndex = closeIdx+1;
  }
  result += s.slice(lastIndex);
  return result;
}
// "{분자} over {분모}"를 \frac{}{}로 바꾼다. 분자/분모 안에 또 중괄호(예: 지수)가 있어도
// 괄호 짝을 직접 세어가며 찾기 때문에 중첩된 경우도 정확히 처리되고, 재귀적으로 안쪽도 변환한다.
function convertOverToFrac(s){
  let result = '', i = 0;
  while(i < s.length){
    if(s[i]==='{'){
      const close1 = findMatchingBrace(s, i);
      if(close1!==-1){
        let j = close1+1;
        while(s[j]===' ') j++;
        if(s.slice(j,j+4)==='over'){
          let k = j+4;
          while(s[k]===' ') k++;
          if(s[k]==='{'){
            const close2 = findMatchingBrace(s, k);
            if(close2!==-1){
              const num = convertOverToFrac(s.slice(i+1, close1));
              const den = convertOverToFrac(s.slice(k+1, close2));
              result += '\\frac{'+num+'}{'+den+'}';
              i = close2+1;
              continue;
            }
          }
        }
      }
    }
    result += s[i];
    i++;
  }
  return result;
}
function convertHwpEq(script){
  let s = script || '';
  if(!s.trim()) return '';
  s = s.replace(/`/g, '');
  s = s.replace(/\brm\s*/g, '');
  // "it"(이탤릭 지정)은 rm과 같은 서체 지정 명령이라 내용만 남기고 지운다.
  // "it2r+3"(공백 없음), "it r ^{2}"(공백 있음) 둘 다 나오므로 뒤 공백까지 함께 지운다.
  s = s.replace(/\bit\s*(?=[0-9a-zA-Z(])/g, '');
  s = replaceBalancedKeyword(s, 'pmatrix', inner => '\\begin{pmatrix}' + inner.replace(/#/g,'\\\\') + '\\end{pmatrix}');
  s = replaceBalancedKeyword(s, 'cases', inner => '\\begin{cases}' + inner.replace(/#/g,'\\\\') + '\\end{cases}');
  const greek = {alpha:'\\alpha',beta:'\\beta',gamma:'\\gamma',delta:'\\delta',theta:'\\theta',pi:'\\pi',lambda:'\\lambda',mu:'\\mu',sigma:'\\sigma',phi:'\\phi',omega:'\\omega'};
  for(const k in greek) s = s.replace(new RegExp('\\b'+k+'\\b','g'), greek[k]);
  // le/ge/LEQ 등은 it과 마찬가지로 뒤에 공백 없이 숫자가 바로 붙는 경우(le5)가 있어
  // 뒤쪽 \b는 안 쓰고 시작 위치만 단어 경계로 확인한다. 방금 만든 "\leq"의 "le"를
  // 다시 건드리지 않도록(무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = s.replace(/(?<!\\)\bLEQ/gi, '\\leq').replace(/(?<!\\)\bGEQ/gi, '\\geq').replace(/(?<!\\)\bNEQ/gi, '\\neq');
  s = s.replace(/(?<!\\)\ble/g, '\\leq').replace(/(?<!\\)\bge/g, '\\geq');
  s = s.replace(/\bTIMES\b/gi, '\\times');
  // angle/bar는 "angle{BAD}"(중괄호), "angle BAD"(공백), "angleBAD"(붙여쓰기) 세 가지 형태가
  // 모두 나오므로 각각 처리한다. 방금 만든 "\angle"/"\overline"을 다시 건드리지 않도록
  // (무한 중복 방지) 바로 앞이 백슬래시가 아닐 때만 매치한다.
  s = replaceBalancedKeyword(s, 'angle', inner => '\\angle ' + inner);
  s = s.replace(/(?<!\\)\bangle\s+([A-Za-z]+)\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle([A-Z]{1,3})\b/g, '\\angle $1');
  s = s.replace(/(?<!\\)\bangle\b/g, '\\angle');
  s = replaceBalancedKeyword(s, 'bar', inner => '\\overline{' + inner + '}');
  s = s.replace(/(?<!\\)\bbar\s+([A-Za-z]+)\b/g, '\\overline{$1}');
  s = s.replace(/(?<!\\)\bbar([A-Z]{1,3})\b/g, '\\overline{$1}');
  s = s.replace(/LEFT\s*\(/g, '\\left(').replace(/RIGHT\s*\)/g, '\\right)');
  s = convertOverToFrac(s);
  s = replaceBalancedKeyword(s, 'sqrt', inner => '\\sqrt{' + inner + '}');
  // 첨자가 여러 글자인데 중괄호 없이 붙어있으면(a_11 등) LaTeX에서 첫 글자만
  // 첨자로 처리되어 깨지므로, 중괄호로 다시 감싸준다.
  s = s.replace(/([_^])(?!\{)([0-9a-zA-Z]+)/g, '$1{$2}');
  s = s.replace(/\s+/g, ' ').trim();
  return s ? '$' + s + '$' : '';
}
// 수식 개체가 아니라 그냥 평문(<hp:t>)으로 "barAD", "angleBAD"처럼 붙여 쓴 경우를 정리한다.
function cleanHwpPlainText(t){
  if(!t) return t;
  return t
    .replace(/\bbar([A-Z]{1,3})\b/g, '$\\overline{$1}$')
    .replace(/\bangle([A-Z]{1,3})\b/g, '$\\angle $1$');
}
const HWP_CORE_NS = 'http://www.hancom.co.kr/hwpml/2011/core';
const HWP_WATERMARK_PATTERNS = [/족보닷컴/, /zocbo\.com/i];
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
// 문단 목록을 재귀적으로 순회하며 텍스트/수식/그림참조/미주를 평평한 토큰 스트림으로 만든다.
// 표(hp:tbl) 안에 들어있는 문항도 셀 하나하나를 재귀 호출로 처리해서 놓치지 않는다.
// (표 안에 중첩 표가 또 있을 수 있어서, 바깥 표 처리 시 tr/tc는 반드시 "직계 자식"만
//  본다 — getElementsByTagNameNS처럼 깊은 검색을 쓰면 중첩 표의 셀까지 중복으로 잡힌다.)
function hwpWalkParagraphs(paras, tokens){
  for(const p of paras){
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType !== 1) continue;
        const local = child.localName;

          tokens.push({type:'text', v: cleanHwpPlainText(child.textContent||'')});
        } else if(local === 'equation'){
          const scriptEl = child.getElementsByTagNameNS(HP_NS,'script')[0];
          tokens.push({type:'eq', v: convertHwpEq(scriptEl?scriptEl.textContent:'')});
        } else if(local === 'pic'){
          const imgEl = child.getElementsByTagNameNS(HWP_CORE_NS,'img')[0];
          const ref = imgEl ? imgEl.getAttribute('binaryItemIDRef') : null;
          if(ref) tokens.push({type:'pic', v: ref});
        } else if(local === 'tbl'){
          // 보기(①②③④⑤) 같은 작은 표는 같은 행 안에서는 줄바꿈 없이 공백으로만
          // 구분해서, 세로로 한 줄씩 쌓이지 않고 가로로 나열되게 한다.
          const trs = Array.from(child.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
          for(const tr of trs){
            const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
            for(const tc of tcs){
              const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
              if(subList){
                const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
                const cellTokens = [];
                hwpWalkParagraphs(cellParas, cellTokens);
                while(cellTokens.length && cellTokens[cellTokens.length-1].type==='break') cellTokens.pop();
                if(cellTokens.length){
                  tokens.push(...cellTokens);
                  tokens.push({type:'text', v:' '});
                }
              }
            }
          }
          tokens.push({type:'break'});
        } else if(local === 'ctrl'){
          const endNoteEl = child.getElementsByTagNameNS(HP_NS,'endNote')[0];
          if(endNoteEl){
            tokens.push({type:'endnote', v: hwpEndnoteText(endNoteEl)});
          } else if(child.getElementsByTagNameNS(HP_NS,'autoNum')[0]?.getAttribute('numType')==='ENDNOTE'){
            // 문서 맨 뒤 "빠른정답" 요약처럼 진짜 hp:endNote가 아닌 평문 목록을 만나면
            // 문항 구간이 끝난 것으로 보고 멈춘다.
            tokens.push({type:'stop'});
          }
        }
      }
    }
    tokens.push({type:'break'});
  }
}
function hwpEndnoteText(endNoteEl){
  const subList = endNoteEl.getElementsByTagNameNS(HP_NS,'subList')[0];
  const innerParas = subList ? Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p') : [];
  const innerTokens = [];
  hwpWalkParagraphs(innerParas, innerTokens);
  let ans = '';
  for(const it of innerTokens){ if(it.type==='text'||it.type==='eq') ans += it.v; }
  // "[정답]" 라벨과, 일부 문서에서 수식 앞에 자동으로 붙는 "수식입니다." 안내 문구를 제거한다.
  return ans.replace(/^\s*\[정답\]\s*/,'').replace(/수식입니다\.?/g,'').trim();
}
// 표의 셀 하나를 문제 하나로 취급해서 텍스트/그림/(있다면) 정답을 뽑는다.
// 표 기반 시험지는 "번호 인식"을 미주 등장 시점에 의존하면 정답이 없는 문항에서
// 여러 문제가 한 덩어리로 뭉쳐버리는 문제가 있어서, 셀 경계를 기준으로 삼는 게 훨씬 안정적이다.
function hwpCellToBlock(cellParas){
  const tokens = [];
  hwpWalkParagraphs(cellParas, tokens);
  let text = '', answer = null, pics = [];
  for(const tok of tokens){
    if(tok.type === 'endnote') answer = tok.v;
    else if(tok.type === 'text' || tok.type === 'eq') text += tok.v;
    else if(tok.type === 'pic') pics.push(tok.v);
    else if(tok.type === 'break') text += '\n';
  }
  return { text, answer, pics };
}
function hwpParseBlocks(topParas){
  const blocks = [];
  let plainTokens = [];
  let stopped = false;
  function flushPlain(){
    if(plainTokens.length===0) return;
    let cur = { text:'', answer:null, pics:[] };
    for(const tok of plainTokens){
      if(tok.type === 'stop'){ stopped = true; break; }
      if(tok.type === 'endnote'){
        if(cur.text.trim()) blocks.push(cur);
        cur = { text:'', answer: tok.v, pics:[] };
      } else if(tok.type === 'text') cur.text += tok.v;
      else if(tok.type === 'eq') cur.text += tok.v;
      else if(tok.type === 'pic') cur.pics.push(tok.v);
      else if(tok.type === 'break') cur.text += '\n';
    }
    if(cur.text.trim()) blocks.push(cur);
    plainTokens = [];
  }
  for(const p of topParas){
    if(stopped) break;
    // 이 문단 바로 아래에 최상위 표(문항 박스 레이아웃)가 있는지 찾는다.
    let foundTable = null;
    for(const runEl of Array.from(p.childNodes)){
      if(runEl.nodeType!==1 || runEl.localName!=='run') continue;
      for(const child of Array.from(runEl.childNodes)){
        if(child.nodeType===1 && child.localName==='tbl') foundTable = child;
      }
    }
    if(foundTable){
      flushPlain();
      const trs = Array.from(foundTable.childNodes).filter(n=>n.nodeType===1 && n.localName==='tr');
      for(const tr of trs){
        const tcs = Array.from(tr.childNodes).filter(n=>n.nodeType===1 && n.localName==='tc');
        for(const tc of tcs){
          const subList = Array.from(tc.childNodes).find(n=>n.nodeType===1 && n.localName==='subList');
          if(subList){
            const cellParas = Array.from(subList.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');
            const b = hwpCellToBlock(cellParas);
            if(b.text.trim()) blocks.push(b);
          }
        }
      }
    } else {
      hwpWalkParagraphs([p], plainTokens);
    }
  }
  flushPlain();
  return blocks;
}
async function parseHwpxToProblems(file){
  await ensureJSZipLoaded();
  const zip = await JSZip.loadAsync(file);
  const sectionFile = zip.file('Contents/section0.xml');
  if(!sectionFile) throw new Error('올바른 hwpx 파일이 아닙니다.');
  const xmlText = await sectionFile.async('string');
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const sec = doc.documentElement;
  const topParas = Array.from(sec.childNodes).filter(n=>n.nodeType===1 && n.localName==='p');

  const blocks = hwpParseBlocks(topParas);

  // 문제 칸 안에서 정답을 못 찾은 문항이 있으면(정답이 문제와 분리된 별도 표에
  // 순서대로 나열된 문서 양식), 문서 전체의 미주를 등장 순서대로 모아 같은 순번끼리 매칭한다.
  const missingCount = blocks.filter(b=>!b.answer).length;
  if(missingCount > 0){
    const allEndnotes = Array.from(doc.getElementsByTagNameNS(HP_NS,'endNote'));
    const orderedAnswers = allEndnotes.map(hwpEndnoteText);
    if(orderedAnswers.length === blocks.length){
      blocks.forEach((b,i)=>{ if(!b.answer) b.answer = orderedAnswers[i]; });
    }
  }

  // 저작권 보호 워터마크(예: 족보닷컴)가 문제나 정답에 섞인 문항은 자동 인식에서 제외한다.
  let watermarked = 0;
  const clean = blocks.filter(b=>{
    const hay = b.text + ' ' + (b.answer||'');
    if(HWP_WATERMARK_PATTERNS.some(re=>re.test(hay))){ watermarked++; return false; }
    return true;
  });

  // 문항에 딸린 그림이 있으면 hwpx 안의 실제 이미지 파일을 꺼내 압축해 첨부한다.
  let idToHref = {};
  const hpfFile = zip.file('Contents/content.hpf');
  if(hpfFile){
    const hpfText = await hpfFile.async('string');
    const hpfDoc = new DOMParser().parseFromString(hpfText, 'text/xml');
    const items = hpfDoc.getElementsByTagName('opf:item');
    for(const it of Array.from(items)){
      const id = it.getAttribute('id'), href = it.getAttribute('href');
      if(id && href) idToHref[id] = href;
    }
  }
  const problems = [];
  for(const b of clean){
    const problem = { content: b.text.trim(), answer: (b.answer||'').trim(), image: null };
    const ref = b.pics[0];
    if(ref && idToHref[ref]){
      const imgFile = zip.file(idToHref[ref]);
      if(imgFile){
        try{
          const blob = await imgFile.async('blob');
          problem.image = await compressImageToBase64(blob, 1000, 0.6);
        }catch(e){ console.error('그림 추출 실패', ref, e); }
      }
    }
    problems.push(problem);
  }
  problems.watermarkedCount = watermarked;
  return problems;
}

async function confirmUnitBankImport(){
  syncUnitImportPreviewFromDOM();
  const rows = state.unitImportPreview;
  if(!rows || rows.length===0) return;
  const CONCURRENCY = 15;
  const today = todayStr();
  let ok = 0, done = 0;
  state.importProgress = { done: 0, total: rows.length };
  render();
  for(let i=0; i<rows.length; i+=CONCURRENCY){
    const chunk = rows.slice(i, i+CONCURRENCY);
    const results = await Promise.all(chunk.map(async r => {
      let image = '', imageFileId = '';
      if(r.image){
        try{
          const up = await uploadDataUrlToDrive(r.image);
          image = up.url; imageFileId = up.fileId;
        }catch(e){ console.error('단원문항 이미지 업로드 실패', e); }
      }
      const { image:_drop, ...rest } = r;
      return collectionAdd('unitbank', { ...rest, image, imageFileId, createdAt: today });
    }));
    results.forEach(doc => { if(doc){ DATA.unitBank.unshift(doc); ok++; } });
    done += chunk.length;
    state.importProgress = { done, total: rows.length };
    render();
  }
  state.importProgress = null;
  state.unitImportPreview = null;
  showToast(ok + '개 문항이 창고에 추가되었습니다.' + (ok<rows.length ? ` (${rows.length-ok}건 실패)` : ''));
  render();
}
function cancelUnitBankImport(){
  state.unitImportPreview = null;
  render();
}

async function addAssistant(){
  const taId = document.getElementById('ta-id').value.trim();
  const pw = document.getElementById('ta-pw').value;
  const name = document.getElementById('ta-name').value.trim();
  const phone = document.getElementById('ta-phone').value.trim();
  const classId = document.getElementById('ta-class').value;
  if(!name){ showToast('이름을 입력해주세요.'); return; }
  if(!taId || !pw){ showToast('아이디와 비밀번호를 입력해주세요.'); return; }
  if(pw.length < 4){ showToast('비밀번호는 4자 이상으로 설정해주세요.'); return; }
  if(!classId){ showToast('담당 반을 선택해주세요.'); return; }
  if(DATA.assistants.some(a=>a.taId===taId)){ showToast('이미 사용 중인 아이디입니다.'); return; }
  const assistant = {id:'ta'+Date.now(), taId, pw, name, phone, classId};
  DATA.assistants.push(assistant);
  await dbSetDoc('assistants', assistant.id, assistant);
  document.getElementById('ta-id').value='';
  document.getElementById('ta-pw').value='';
  document.getElementById('ta-name').value='';
  document.getElementById('ta-phone').value='';
  showToast('조교가 추가되었습니다.');
  render();
}
async function resetAssistantPw(aid){
  const a = DATA.assistants.find(a=>a.id===aid);
  if(!a) return;
  const next = prompt(`${a.name} 조교의 새 비밀번호를 입력하세요 (4자 이상)`);
  if(next===null) return;
  if(next.length < 4){ showToast('비밀번호는 4자 이상이어야 합니다.'); return; }
  a.pw = next;
  await dbSetDoc('assistants', a.id, a);
  showToast('비밀번호가 변경되었습니다.');
  render();
}
async function deleteAssistant(aid){
  if(!confirm('이 조교를 삭제할까요?')) return;
  DATA.assistants = DATA.assistants.filter(a=>a.id!==aid);
  await dbDeleteDoc('assistants', aid);
  render();
}

/* =================== SVG 성적 그래프 =================== */
// 홈 화면의 "이달의 진도 성취도" 원형 그래프.
function progressRingSVG(percent){
  const size=120, stroke=10, r=(size-stroke)/2, c=2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c * (1 - pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EDEBE3" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--red-pen)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--ink)" font-family="'JetBrains Mono',monospace">${Math.round(pct)}%</text>
  </svg>`;
}
function renderScoreChart(scores){
  if(!scores || scores.length===0) return '<div class="empty">등록된 성적이 없습니다.</div>';
  const w=560,h=180,pad=30;
  const pts = scores.map(s=> Math.round((s.score/s.total)*100));
  const n = pts.length;
  const stepX = n>1 ? (w-pad*2)/(n-1) : 0;
  const coords = pts.map((p,i)=>{
    // 점이 1개뿐일 땐 왼쪽 끝에 붙이지 않고 가운데 배치 — 안 그러면 차트 대부분이 텅 비어 보임.
    const x = n>1 ? (pad + stepX*i) : (w/2);
    const y = h-pad - (p/100)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>
    '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="4" fill="#6E2A2F"></circle>'+
    '<text x="'+c[0].toFixed(1)+'" y="'+(c[1]-10).toFixed(1)+'" font-size="11" fill="#3D3335" text-anchor="middle" font-family="JetBrains Mono, monospace">'+pts[i]+'%</text>'
  ).join('');
  const gridLines = [0,25,50,75,100].map(v=>{
    const y = h-pad-(v/100)*(h-pad*2);
    return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#E7DED9" stroke-width="1"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#7D7274" font-family=\'JetBrains Mono, monospace\'>'+v+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:600px;height:auto;">'+gridLines+
    '<path d="'+path+'" fill="none" stroke="#AE4B53" stroke-width="2.5"/>'+dots+'</svg>';
}

/* =================== 화면 렌더 =================== */

/* 새 디자인 시스템(ds.css)으로 옮긴 화면 목록.
   여기 들어간 화면만 구버전 스타일(.legacy)을 벗는다. 화면을 하나 옮길 때마다 여기에 더한다.
   전부 옮기고 나면 이 집합과 <style> 블록, body의 .legacy를 통째로 지운다. */
const MIGRATED_VIEWS = new Set(['teacher']);
let lastSyncedHash = null;
function syncHistory(){
  const newHash = buildHashFromState();
  if(newHash === lastSyncedHash) return;
  const snap = {view:state.view, teacherTab:state.teacherTab, studentTab:state.studentTab, assistantTab:state.assistantTab};
  if(lastSyncedHash===null) history.replaceState(snap, '', newHash); // 첫 렌더는 기록을 새로 안 쌓고 지금 자리를 교체만
  else history.pushState(snap, '', newHash);
  lastSyncedHash = newHash;
}

function render(){
  const app = document.getElementById('app');
  // 탭 렌더 함수들이 내부에서 markSeen()을 호출해 알림을 "확인함" 처리하는 경우가 있어서,
  // 알림 뱃지를 그리는 headerHTML()보다 본문을 먼저 계산해야 뱃지가 한 렌더 늦게 갱신되지 않는다.
  let bodyHtml = '';
  if(state.view==='home') bodyHtml = homeHTML();
  else if(state.view==='login') bodyHtml = loginHTML();
  else if(state.view==='student') bodyHtml = studentHTML();
  else if(state.view==='teacher') bodyHtml = teacherHTML();
  else if(state.view==='assistant') bodyHtml = assistantHTML();
  /* 새 디자인으로 옮긴 화면은 자기 셸(상단바)을 스스로 갖는다.
     공개 사이트용 헤더·푸터를 덧씌우면 상단바가 두 겹이 된다. */
  let html = MIGRATED_VIEWS.has(state.view) ? bodyHtml : headerHTML() + bodyHtml + footerHTML();
  if(state.toast) html += `<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B1B1D;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;">${state.toast}</div>`;
  document.body.classList.toggle('legacy', !MIGRATED_VIEWS.has(state.view));
  app.innerHTML = html;
  if(window.renderMathInElement){
    try{
      renderMathInElement(app, {
        delimiters: [{left:'$', right:'$', display:false}],
        throwOnError: false
      });
    }catch(e){ console.error('수식 렌더링 실패', e); }
  }
  if(state.view==='student' && state.studentTab==='video' && state.currentUser){
    mountVideoTrackers(state.currentUser.studentId);
  }
  syncHistory();

  const tabs = [['home','홈'],['quiz','데일리퀴즈'],['progress','진도/과제'],['wronghw','오답숙제'],['video','강의시청'],['grades','성적'],['attendance','출석'],['notice','공지사항'],['qna','질의응답'],['clinic','클리닉 신청'],['chat','선생님과 채팅']];

    const me = DATA.students.find(s=>s.studentId===sid) || {};

    const myHomeworkH = DATA.assignments.filter(a=>!a.classId || a.classId===myClassIdH);
    const myVideosH = DATA.videos.filter(v=>v.studentId ? v.studentId===sid : (!v.classId || v.classId===myClassIdH));
    const myExamsH = DATA.exams.filter(e=>e.classId===myClassIdH);

    // "오늘의 할 일": 퀴즈/과제/영상/오답숙제 중 아직 안 끝낸 것들을 한 리스트로 모은다.
    const todoItems = [];

    myHomeworkH.filter(a=>!rec.assignmentsDone[a.id]).forEach(a=>todoItems.push({tag:'과제', cls:'tag-hw', title:a.title, status:'제출요망', tab:'progress'}));
    myVideosH.filter(v=>!(rec.videoProgress[v.id] && rec.videoProgress[v.id].completed)).forEach(v=>todoItems.push({tag:'강의', cls:'tag-video', title:v.title, status:'미수강', tab:'video'}));
    rec.wrongHomework.filter(h=>{
      const bank = DATA.problemBank.find(b=>b.id===h.bankId);
      return bank && bank.status==='approved' && !h.done;

      const exam = DATA.exams.find(e=>e.id===h.examId);
      todoItems.push({tag:'오답', cls:'tag-wrong', title:(exam?exam.title+' ':'')+h.questionNo+'번', status:'제출요망', tab:'wronghw'});

    // "최근 시청 중인 강의": 진도율이 있지만 아직 다 안 본 영상을 우선으로 보여준다.

    body = `

        <p>${classNameOf(myClassIdH)}${clsProgressH.subject?' · 현재 진도 '+escHtml(clsProgressH.subject):''}</p>
      </div>
      <div class="home-user-badge">👤 ${escHtml(me.name||state.currentUser.name)}${me.school?` (${escHtml(me.school)} ${escHtml(me.grade||'')})`:me.grade?` (${escHtml(me.grade)})`:''}</div>
    </div>
    <div class="home-grid-3">
      <div class="home-card">
        <h4>${iconSvg('checklist')} 오늘의 할 일</h4>
        ${todoItems.length===0 ? '<div class="empty">오늘 할 일을 모두 끝냈어요! 🎉</div>' :
          `<div class="home-todo-list">${todoItems.slice(0,6).map(t=>`
          <div class="home-todo-row" onclick="state.studentTab='${t.tab}'; render()">
            <span><span class="home-tag ${t.cls}">${t.tag}</span> ${escHtml(t.title)}</span>
            <span class="lg-badge badge-no">${t.status}</span>
          </div>`).join('')}</div>`}
      </div>
      <div class="home-card" style="text-align:center;">
        <h4 style="justify-content:center;">${iconSvg('trophy')} 반 진도 성취도</h4>
        <div class="home-ring-wrap">${progressRingSVG(clsProgressH.percent)}</div>
        <p class="lg-hint" style="margin-top:10px;">${clsProgressH.subject?escHtml(clsProgressH.subject):'아직 등록된 진도가 없습니다.'}</p>
      </div>
      <div class="home-card">
        <h4>${iconSvg('messageSquare')} 무엇이든 물어보세요</h4>

        ${qnaImageFieldHTML(state.qnaQuestionImage, 'handleQnaQuestionImage(this.files)', 'removeQnaQuestionImage()', 'qna-q-home')}

        </div>`}

    <div class="lg-panel">

function attStatusClass(status){
  return {'출석':'ok', '지각':'late', '조퇴':'leave', '결석':'no', '퇴원':'drop'}[status] || 'no';
}
function attBadge(status){

  return `<span class="lg-badge ${cls}">${status}</span>`;
}

   반은 거기서 필터일 뿐이고, 같은 곳으로 가는 문을 두 개 만들지 않는다. */
const TEACHER_SUBNAV = {
  '반': [

    ['진도',       'classhub', 'progress'],

     합치기 전까지는 서브탭으로 남겨 둔다 — 지금 지우면 들어갈 문이 없어진다. */

  roster:'명단', signals:'신호', home:'신호',
  classhub:'반', session:'수업',
  review:'오답', exams:'오답', unitbank:'오답', submissions:'오답',
  clinic:'소통', notices:'소통', qna:'소통', chat:'소통',
  settings:'설정'
};

/* 새 디자인으로 옮긴 탭. 여기 없는 탭은 .legacy 안에서 구버전 스타일 그대로 그린다.

/* =================== 명단 (design-v1/01-roster) ===================
   A1의 밀도를 A3의 언어로. 역할은 «전체를 훑고 · 걸러내고 · 한꺼번에 처리한다».

   목업과 다른 점 — 목업은 「고2 미적분Ⅰ」 반 하나를 이미 고른 상태를 그렸다.
   실서비스는 반이 여러 개고 미배정 학생도 있어서 «모집단(뷰)»을 먼저 고르게 했다.
   반을 고르면 「반」·「반 진도」 열은 사라진다 — 행마다 같은 값을 되풀이하지 않는다.

   목업에 있었으나 넣지 않은 것:
     열 선택(15/22) · 사용자 저장 뷰 · 과제 일괄 배포 · 학부모 문자 · 클리닉 배정
   전부 도메인 레이어에 없는 신규 기능이다. 눌러도 아무 일 없는 버튼은 두지 않는다.
   (과제는 반 단위로만 배포되게 돼 있어 «선택한 학생에게»가 데이터 구조상 성립하지 않는다.) */

/* 출석률 = 「퇴원」을 뺀 전체 기록 중 「결석」이 아닌 비율.
   지각·조퇴는 «온 것»으로 센다. 여기서 묻는 것은 «왔는가»이고,
   «얼마나 있었는가»는 학생 상세의 출석 기록이 답한다. */
function rosterStats(s){
  const sid = s.studentId;
  const rec = state.allRecords[sid] || {};

  const att = (rec.attendance || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const counted = att.filter(a=>a.status!=='퇴원');
  const attPct = counted.length
    ? Math.round(counted.filter(a=>a.status!=='결석').length / counted.length * 100) : null;

  // 시험마다 만점이 달라 점수를 그대로 이으면 선이 거짓말을 한다. 100점 환산해서 잇는다.
  const scores = (rec.scores || []).filter(sc=>sc.total).map(sc=>Math.round(sc.score/sc.total*100));
  const drop = scores.length>1 ? scores[0] - scores[scores.length-1] : 0;

  const hws = DATA.assignments.filter(a=>!a.classId || a.classId===s.classId);
  const hwDone = hws.filter(a=>rec.assignmentsDone && rec.assignmentsDone[a.id]).length;

  const wrongLeft = (rec.wrongHomework || []).filter(h=>!h.done).length;

  const vids = DATA.videos.filter(v=>v.studentId ? v.studentId===sid : (!v.classId || v.classId===s.classId));
  const vidPct = vids.length ? Math.round(vids.reduce((sum,v)=>{
    const p = rec.videoProgress && rec.videoProgress[v.id];
    if(!p) return sum;
    return sum + (p.completed ? 100 : Math.max(0, Math.min(100, Math.round(p.percent||0))));
  }, 0) / vids.length) : null;

  return {
    att8: att.slice(-8), attPct, scores, drop,
    hwDone, hwTotal: hws.length, wrongLeft, vidPct,
    withdrawn: isWithdrawnRecord(rec),
    prog: s.classId ? getClassProgress(s.classId) : null
  };
}

/* =================== 신호 규칙 (명단·신호 공용) ===================
   **명단(01)과 신호(05)는 반드시 이 함수 하나만 본다.** 규칙이 두 벌로 갈라지는 순간
   화면끼리 숫자가 어긋나고, 그러면 두 화면 다 못 믿게 된다.

   등급은 셋. 늘리지 않는다 — 사람이 한 번에 판단할 수 있는 층은 셋이 한계다.
     위험 r  «무거운 신호» 2개 이상                → 즉시 연락
     주의 y  무거운 신호 1개 또는 시청률 70% 미만  → 이번 주 안에 개입
     관찰 g  경미한 신호만                        → 추세만 지켜본다

   시안(05-signals)은 위험을 «출석률<80 그리고 시청률<50»으로 못박았는데,
   그러면 결석이 잦아도 영상만 잘 본 학생이 어디에도 안 걸린다.
   실데이터에 맞춰 «무거운 신호 2개 이상»으로 바꿨다.
   임계값은 잠정이다. 규칙 «편집» UI는 없다 — 고치려면 이 함수를 고친다. */

const SIGNAL_GRADE = {
  r: { label:'위험', badge:'no',   todo:'즉시 연락 권장',     cond:'무거운 신호 2개 이상' },
  y: { label:'주의', badge:'late', todo:'이번 주 안에 개입',  cond:'무거운 신호 1개 · 시청률 70% 미만' },
  g: { label:'관찰', badge:'',     todo:'추세만 지켜보는 중', cond:'경미한 신호 하나' }
};

function signalOf(st){
  if(st.withdrawn) return null;              // 퇴원은 트리아지 대상이 아니다
  const rules = [];
  const absent = st.att8.filter(a=>a.status==='결석').length;
  const push = (name, heavy, why) => rules.push({ name, heavy, why });

  if(absent >= 2)                          push('연속 결석',   true,  `최근 ${st.att8.length}회 중 결석 <b>${absent}</b>`);
  if(st.attPct !== null && st.attPct < 80) push('출석률 저조', true,  `출석률 <b>${st.attPct}%</b>`);
  if(st.drop >= 8)                         push('성적 급락',   true,  `성적 <b>${st.scores[0]}→${st.scores[st.scores.length-1]}</b>`);
  if(st.wrongLeft >= 3)                    push('오답 미제출', true,  `오답숙제 <b>${st.wrongLeft}건</b> 미제출`);
  else if(st.wrongLeft > 0)                push('오답 미제출', false, `오답숙제 <b>${st.wrongLeft}건</b> 미제출`);
  if(st.vidPct !== null && st.vidPct < 50)      push('시청률 저조', true,  `강의 시청 <b>${st.vidPct}%</b>`);
  else if(st.vidPct !== null && st.vidPct < 80) push('시청률 저조', false, `강의 시청 <b>${st.vidPct}%</b>`);
  if(st.hwTotal && st.hwDone < st.hwTotal) push('과제 누락',   false, `과제 <b>${st.hwDone}/${st.hwTotal}</b>`);

  if(rules.length === 0) return null;

  const heavy = rules.filter(r=>r.heavy).length;
  const grade = heavy >= 2 ? 'r'
              : (heavy === 1 || (st.vidPct !== null && st.vidPct < 70)) ? 'y' : 'g';

  /* 위험도 점수 — 등급을 «정하는» 값이 아니라 등급 «안에서 줄 세우는» 값이다.
     점수로 등급까지 정하면 임계값이 두 벌이 되고, 어느 쪽이 진짜인지 알 수 없게 된다. */
  let score = 0;
  if(st.attPct !== null) score += Math.max(0, 100 - st.attPct) * 0.8;
  score += absent * 6;
  score += Math.max(0, st.drop) * 2;
  score += st.wrongLeft * 4;
  if(st.vidPct !== null) score += Math.max(0, 80 - st.vidPct) * 0.5;
  if(st.hwTotal) score += (st.hwTotal - st.hwDone) * 3;

  return { grade, rules, score: Math.min(99, Math.round(score)) };
}

/* 명단의 신호 열 — 한 줄(40px)에 들어가야 하므로 규칙 «이름»만 잇는다.
   근거 숫자까지 보려면 신호 화면으로 간다. */
function rosterSignal(st){
  if(st.withdrawn) return ['gone', '퇴원', '출결 기록의 마지막 상태'];
  const sg = signalOf(st);
  if(!sg) return null;
  const g = SIGNAL_GRADE[sg.grade];
  return [g.badge, g.label, sg.rules.map(r=>r.name).join(' · ')];
}

/* ds.js의 spark()/dots()를 옮겨 왔다. ds.js는 예시 학생 22명이 들어 있어 실서비스에 로드하지 않는다. */
function rosterSpark(vals, w, h){
  if(vals.length<2) return '<span class="muted" style="font-size:11px;">—</span>';
  w = w || 56; h = h || 20;
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx-mn) || 1;
  let d = '';
  vals.forEach((v,i)=>{
    const x = (w * i / (vals.length-1)).toFixed(1);
    const y = (h - 2 - ((v-mn)/r) * (h-6)).toFixed(1);
    d += (i ? 'L' : 'M') + x + ' ' + y;
  });
  const down = vals[vals.length-1] < vals[0];
  const last = vals[vals.length-1], delta = Math.abs(last - vals[0]);
  return `<svg width="${w}" height="${h}" style="vertical-align:-6px;"><path d="${d}" fill="none" stroke="${down?'#B03A2E':'#3F7A4D'}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`
    + `<span class="mono" style="font-size:12px;margin-left:5px;">${last}</span>`
    + `<span class="mono ${down?'warn':'up'}" style="font-size:10.5px;margin-left:3px;">${down?'▼':'▲'}${delta}</span>`;
}
function rosterDots(att8){
  if(!att8.length) return '<span class="muted" style="font-size:11px;">—</span>';
  return '<span class="dots">' + att8.map(a=>
    `<i class="${attStatusClass(a.status)}" title="${a.date} ${a.status}"></i>`).join('') + '</span>';
}

/* 화면과 엑셀이 같은 명단을 봐야 한다. 필터·정렬을 두 군데 적으면 반드시 어긋난다. */
function rosterModel(){
  const stats = {};
  DATA.students.forEach(s=>{ stats[s.studentId] = rosterStats(s); });

  const view = state.rosterView || 'all';
  const classId = view.indexOf('class:')===0 ? view.slice(6) : null;

  // 퇴원 학생은 「퇴원」 뷰에서만 보인다. 재원 명단에 섞이면 모든 숫자가 흐려진다.
  const pool = DATA.students.filter(s=>{
    const st = stats[s.studentId];
    if(view==='gone') return st.withdrawn;
    if(st.withdrawn) return false;
    if(view==='unassigned') return !s.classId;
    if(classId) return s.classId===classId;
    return true;
  });

  const f = state.rosterFlags || {};
  const flagged = {
    att:   s => stats[s.studentId].attPct!==null && stats[s.studentId].attPct<90,
    wrong: s => stats[s.studentId].wrongLeft>0,
    hw:    s => stats[s.studentId].hwTotal>0 && stats[s.studentId].hwDone<stats[s.studentId].hwTotal
  };
  const q = (state.rosterQuery||'').trim().toLowerCase();
  let rows = pool.filter(s=>{
    for(const k in flagged){ if(f[k] && !flagged[k](s)) return false; }
    if(!q) return true;
    return (s.name||'').toLowerCase().includes(q)
      || (s.studentId||'').toLowerCase().includes(q)
      || (s.school||'').toLowerCase().includes(q)
      || classNameOf(s.classId).toLowerCase().includes(q);
  });

  const sort = state.rosterSort || 'name';
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'', 'ko');
  // 기록이 없는 학생을 «출석률 0%»로 두면 맨 위로 올라와 실제 위험을 가린다. 뒤로 보낸다.
  const cmp = {
    name:  byName,
    att:   (a,b)=>((stats[a.studentId].attPct ?? 999) - (stats[b.studentId].attPct ?? 999)) || byName(a,b),
    drop:  (a,b)=>(stats[b.studentId].drop - stats[a.studentId].drop) || byName(a,b),
    wrong: (a,b)=>(stats[b.studentId].wrongLeft - stats[a.studentId].wrongLeft) || byName(a,b)
  }[sort] || byName;
  rows = rows.slice().sort(cmp);

  return { stats, view, classId, pool, rows, flagged };
}

const ROSTER_SORTS = [['name','이름순'], ['att','출석률 낮은 순'], ['drop','성적 하락 큰 순'], ['wrong','오답 미제출 많은 순']];
const ROSTER_FLAGS = [['att','출결 주의'], ['wrong','오답 미제출'], ['hw','과제 미제출']];
