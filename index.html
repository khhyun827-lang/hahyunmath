/* =================== 오답 검토 (design-v1/04-review) ===================
   역할은 «쌓인 것을 비운다». A4에서 흡수한 것 셋 — 큐 · 2열 비교 · 키보드. 다크 테마는 버렸다.

   예전 화면은 카드를 세로로 나열했다. 한 건을 판단하려면 원본과 쌍둥이를 나란히 봐야 하는데,
   카드가 길어 스크롤하는 동안 원본이 화면 밖으로 나갔다. 2열로 고정하면 그 왕복이 사라진다.

   **큐는 시안과 다르다.** 시안은 「재생성 요청 · 난도 확인 필요 · 보류함」을 그렸는데
   도메인에 그런 상태가 없다. 실제 상태는 pending → review1 → approved 셋뿐이다.
   지어내지 않고 실제로 갈라지는 축으로 큐를 짰다 —
   내용 없음(AI 생성 필요) / 1차 대기 / 2차 대기 / 답 형태 문제 / 공개됨.

   「보류」도 넣지 않았다. 보류 상태를 만들려면 problembank에 필드를 더해야 하는데,
   pending에 머무는 것이 이미 «아직 안 봤다»와 같은 뜻이라 층을 하나 더 둘 이유가 없다. */

const REVIEW_QUEUES = [
  ['empty',    '내용 없음',    'y', b => !b.variantContent && !b.variantAnswer],
  ['pending',  '1차 검토 대기', 'r', b => b.status==='pending' && (b.variantContent || b.variantAnswer)],
  ['review1',  '2차 검토 대기', 'y', b => b.status==='review1'],
  ['bad',      '답 형태 문제',  'r', b => (b.variantContent || b.variantAnswer) && !!answerFormProblem(b.variantContent, b.variantAnswer)],
  ['approved', '공개됨',       'g', b => b.status==='approved']
];

function reviewQueueList(key){
  const q = REVIEW_QUEUES.find(x=>x[0]===key) || REVIEW_QUEUES[1];
  return DATA.problemBank.filter(q[3]);
}

function goReviewQueue(key){
  state.reviewQueue = key;
  state.reviewSelectedId = null;   // 큐를 옮기면 선택도 옮긴다
  render();
}
function selectReviewItem(id){ state.reviewSelectedId = id; render(); }

/* J/K로 큐 안을 오르내린다. 목록 «순서»가 기준이라 화면에 보이는 것과 어긋나지 않는다. */
function reviewMove(delta){
  const list = reviewQueueList(state.reviewQueue || 'pending');
  if(list.length===0) return;
  let i = list.findIndex(b=>b.id===state.reviewSelectedId);
  if(i < 0) i = 0; else i = Math.max(0, Math.min(list.length-1, i + delta));
  state.reviewSelectedId = list[i].id;
  render();
  const el = document.querySelector('.rv-item.on');
  if(el) el.scrollIntoView({ block:'nearest' });
}

/* 승인/반려 뒤에는 «다음 것»으로 넘어간다 — 큐를 비우는 화면이라 손이 멈추면 안 된다.
   지금 항목이 큐에서 빠지므로, 빠지기 «전»에 다음 대상을 정해 둔다. */
async function reviewAdvance(id, next){
  const list = reviewQueueList(state.reviewQueue || 'pending');
  const i = list.findIndex(b=>b.id===id);
  const after = list[i+1] || list[i-1] || null;
  await advanceBankStatus(id, next);
  const b = DATA.problemBank.find(x=>x.id===id);
  const stillHere = reviewQueueList(state.reviewQueue || 'pending').some(x=>x.id===id);
  if(!stillHere) state.reviewSelectedId = after ? after.id : null;
  render();
}

function teacherReviewHTML(){
  loadAIQuotaIfNeeded();
  loadAllRecordsIfNeeded();
  const qkey = state.reviewQueue || 'pending';
  const list = reviewQueueList(qkey);
  const remaining = state.aiQuotaUsed===null ? null : Math.max(0, AI_DAILY_LIMIT - state.aiQuotaUsed);
  const left = DATA.problemBank.filter(b=>b.status!=='approved').length;

  const queues = `<nav class="rv-queues">
    <div class="t-sec">검토 대기</div>
    ${REVIEW_QUEUES.map(q=>{
      const n = DATA.problemBank.filter(q[3]).length;
      return `<a class="rv-qn ${qkey===q[0]?'on':''}" onclick="goReviewQueue('${q[0]}')">
        <span class="rk ${q[2]}"></span>${q[1]}<b>${n}</b></a>`;
    }).join('')}
    <div class="t-sec" style="margin-top:22px;">보기</div>
    <a class="rv-qn" onclick="goTeacherTab('exams')">시험지별로 보기</a>
    <a class="rv-qn" onclick="goTeacherTab('exams')">제출 현황 (시험지)</a>
    <div class="note" style="margin-top:22px;font-size:11.5px;">
      ${left===0 ? '검토 대기가 비었습니다.'
        : `남은 <b class="mono" style="color:var(--ink);">${left}</b>건을 모두 처리하면 검토 대기가 비워집니다.`}
    </div>
  </nav>`;

  /* 내용이 빈 문항은 AI로 채우는 것이 첫 일이다. 그 큐에서만 생성 버튼을 띄운다. */
  const aiBar = qkey==='empty' && list.length>0 ? `
    <div class="note" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0;">
      <span>내용이 빈 문항 <b class="mono" style="color:var(--ink);">${list.length}</b>개 ·
        ${remaining===null ? '오늘 사용량 확인 중…' : `오늘 남은 생성 <b class="mono" style="color:var(--ink);">${remaining}/${AI_DAILY_LIMIT}</b>`}</span>
      <span class="spacer"></span>
      ${state.aiProgress
        ? `<span class="mono" style="font-size:12px;">생성 중… ${state.aiProgress.done}/${state.aiProgress.total} (문항당 약 13초)</span>`
        : `<button class="btn p sm" ${remaining===0?'disabled':''} onclick="processAIQueue()">AI로 채우기</button>`}
    </div>` : '';

  const sel = reviewSelected(list);
  const items = `<div class="rv-list">
    <div class="rv-lh">
      <span style="font-size:13px;font-weight:700;">${REVIEW_QUEUES.find(q=>q[0]===qkey)[1]}</span>
      <span class="muted" style="font-size:11.5px;">${list.length}건</span>
    </div>
    <div class="rv-lbody">
      ${list.length===0 ? '<div style="padding:36px 12px;text-align:center;color:var(--dim);font-size:12.5px;">비어 있습니다.</div>'
      : list.map(b=>{
        const exam = DATA.exams.find(e=>e.id===b.examId);
        const req = bankRequesterCount(b.id);
        const bad = (b.variantContent||b.variantAnswer) && answerFormProblem(b.variantContent, b.variantAnswer);
        return `<div class="rv-item ${sel && b.id===sel.id?'on':''}" onclick="selectReviewItem('${b.id}')">
          <div class="t">${bad?'<span class="rk r"></span>':''}${exam?escHtml(exam.title):'(삭제된 시험지)'}
            <s>${b.questionNo}번</s></div>
          <div class="m">${b.variantContent ? escHtml(b.variantContent) : '아직 내용이 없습니다 — AI로 채우거나 직접 입력'}</div>
          ${req>0 ? `<div class="m" style="margin-top:5px;color:var(--sub);">요청한 학생 ${req}명</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>`;

  return `<div class="rv-screen">${queues}${items}
    <main class="rv-work">${aiBar}${sel ? reviewWorkHTML(sel, list) : `
      <div style="padding:64px 0;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.8;">
        ${list.length===0 ? '이 큐는 비어 있습니다.' : '왼쪽 목록에서 문항을 고르세요.'}</div>`}
    </main>
  </div>` + (sel ? reviewActbarHTML(sel, list) : '');
}

function reviewSelected(list){
  if(list.length===0) return null;
  return list.find(b=>b.id===state.reviewSelectedId) || list[0];
}

function reviewActbarHTML(b, list){

  return `<div class="actbar">

    ${b.status==='approved' ? `<button class="btn no" onclick="reviewAdvance('${b.id}','review1')"><span class="k">X</span> 공개 취소</button>` : ''}
    ${b.status==='review1' ? `<button class="btn" onclick="reviewAdvance('${b.id}','pending')"><span class="k">X</span> 1차로 되돌리기</button>` : ''}

/* 키보드 — 검토 화면에서만 듣는다. 입력칸에 커서가 있으면 아무 것도 하지 않는다
   (문항을 고치다가 J를 치면 다음 문항으로 튀어 버린다). */
document.addEventListener('keydown', e=>{
  if(state.teacherTab!=='review' || state.studentDetailId) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return;
  const list = reviewQueueList(state.reviewQueue || 'pending');
  const b = reviewSelected(list);
  const k = e.key.toLowerCase();
  if(k==='j'){ e.preventDefault(); reviewMove(1); }
  else if(k==='k'){ e.preventDefault(); reviewMove(-1); }
  else if(!b) return;
  else if(k==='e'){
    e.preventDefault();
    if(b.status==='pending' && (b.variantContent||b.variantAnswer)) reviewAdvance(b.id,'review1');
    else if(b.status==='review1') reviewAdvance(b.id,'approved');
  }
  else if(k==='x'){
    e.preventDefault();
    if(b.status==='approved') reviewAdvance(b.id,'review1');
    else if(b.status==='review1') reviewAdvance(b.id,'pending');
  }
  else if(k==='r'){ e.preventDefault(); if(!state.aiProcessing) regenerateOneWithAI(b.id); }
});

/* ---------- 설정: 변경 이력(감사 로그) ---------- */
function teacherAuditLogHTML(){
  const q = (state.auditLogSearchQuery||'').trim().toLowerCase();
  const filtered = !q ? DATA.auditLog : DATA.auditLog.filter(e=>
    (e.studentName||'').toLowerCase().includes(q) ||
    (e.actor||'').toLowerCase().includes(q) ||
    (e.action||'').toLowerCase().includes(q)
  );
  const shown = filtered.slice(0, 300);
  const fmtAt = iso => { try{ return new Date(iso).toLocaleString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } };
  return `
  <div class="fm-panel">
    <div class="fm-head">
      <h3 style="margin:0;">변경 이력 (${DATA.auditLog.length}건${q?` · 검색결과 ${filtered.length}건`:''})</h3>
      <div class="fm-field" style="margin:0;min-width:220px;">
        <input id="auditlog-search" value="${escHtml(state.auditLogSearchQuery)}" placeholder="학생명·작성자·항목으로 검색" oninput="state.auditLogSearchQuery=this.value; render(); document.getElementById('auditlog-search').focus();">
      </div>
    </div>
    <p class="fm-hint" style="margin-top:-4px;">성적·출석·학생정보처럼 민감한 변경만 기록됩니다. 조교가 수정한 내역도 여기서 확인할 수 있습니다.</p>
    ${DATA.auditLog.length===0 ? '<div class="fm-empty">아직 기록된 변경 이력이 없습니다.</div>' :
      shown.length===0 ? `<div class="fm-empty">"${escHtml(state.auditLogSearchQuery)}"에 해당하는 기록이 없습니다.</div>` : `
    <div style="overflow-x:auto;">
    <table><tr><th>시간</th><th>작성자</th><th>항목</th><th>학생</th><th>내용</th></tr>
    ${shown.map(e=>`<tr><td class="fm-sub mono" style="white-space:nowrap;">${fmtAt(e.at)}</td><td>${escHtml(e.actor)}</td><td>${escHtml(e.action)}</td><td class="fm-nm">${escHtml(e.studentName||'-')}</td><td class="fm-sub">${escHtml(e.detail||'-')}</td></tr>`).join('')}
    </table>
    </div>
    ${filtered.length>300 ? `<p class="fm-hint">최근 300건만 표시됩니다. (전체 ${filtered.length}건)</p>` : ''}`}
  </div>`;
}

document.addEventListener('click', (e) => {

    state.notifOpen = false;
    render();
  }
});

// 브라우저 뒤로가기/앞으로가기 시 주소창 해시에 맞춰 화면을 복원한다.
window.addEventListener('popstate', (e) => {
  const desired = e.state ? e.state.view : (location.hash.replace(/^#\/?/,'').split('/')[0] || 'home');
  state.view = viewAllowedForCurrentUser(desired);
  if(e.state && state.view==='teacher' && e.state.teacherTab) state.teacherTab = e.state.teacherTab;
  if(e.state && state.view==='student' && e.state.studentTab) state.studentTab = e.state.studentTab;
  if(e.state && state.view==='assistant' && e.state.assistantTab) state.assistantTab = e.state.assistantTab;
  const correctedHash = buildHashFromState();
  // 로그인 상태와 안 맞아 다른 화면으로 안전하게 리다이렉트된 경우, 주소창 해시도 그 화면에 맞게 바로잡는다.
  if(correctedHash !== location.hash) history.replaceState({view:state.view, teacherTab:state.teacherTab, studentTab:state.studentTab, assistantTab:state.assistantTab}, '', correctedHash);
  lastSyncedHash = correctedHash; // 복원 자체가 새 push를 유발하지 않도록 먼저 맞춰둠 
  render();
});
