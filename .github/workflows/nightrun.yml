# 날마다 AI 한도 쓰기 — 10-21 새벽으로 시작 · 10-23 부터 아침(한도 초기화 직후) — tools/nightrun.mjs · index.html nightRun()
# PC 가 꺼져 있어도 돈다. 비밀값 ADMIN_PW(관리자 비밀번호)가 있어야 한다.
name: nightrun
on:
  schedule:
    - cron: '5 0 * * *'    # UTC 00:05 = 한국 09:05 — 한도(우리 셈)가 새로 찬 직후 (10-23 사용자 — 「매일 아침, 초기화되자마자」 · 예약은 몇 시간 늦게 올 수 있다)
  workflow_dispatch:
permissions:
  contents: read
concurrency: nightrun
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # nightRun 이 시작 4시간 40분 뒤 스스로 멈춘다 — 이건 그물
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/nightrun.mjs
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .night
          key: nightrun-aside-${{ github.run_id }}
          restore-keys: nightrun-aside-
      - run: node tools/nightrun.mjs
        env:
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
