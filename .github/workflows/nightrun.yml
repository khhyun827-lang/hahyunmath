# 새벽에 남은 AI 한도 쓰기 (2026-10-21) — tools/nightrun.mjs · index.html nightRun()
# PC 가 꺼져 있어도 돈다. 비밀값 ADMIN_PW(관리자 비밀번호)가 있어야 한다.
name: nightrun
on:
  schedule:
    - cron: '7 20 * * *'   # UTC — 한국 05:07 (GitHub 가 붐비면 몇십 분 늦게 온다 · 정각을 피했다)
  workflow_dispatch:
permissions:
  contents: read
concurrency: nightrun
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # nightRun 이 08:50 에 스스로 멈춘다 — 이건 그물
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/nightrun.mjs
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .night
          key: nightrun-aside-${{ github.run_id }}
          restore-keys: nightrun-aside-
      - run: node tools/nightrun.mjs
        env:
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
