<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클리닉 — 김하현수학연구소 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="ds.css">
<style>
  /* 배치만. 색·서체·반경은 ds.css 토큰. */
  .main{position:absolute;left:0;right:340px;top:0;bottom:0;padding:20px 24px 0;
    display:flex;flex-direction:column;overflow:hidden;}
  .mh{display:flex;align-items:flex-end;gap:14px;flex-shrink:0;}
  .mh .r{margin-left:auto;display:flex;gap:6px;}

  /* 주간 슬롯 판 — 클리닉은 «시간»이 자원이다. 목록만으로는 빈자리가 안 보인다. */
  .week{flex:1;min-height:0;overflow-y:auto;margin-top:18px;padding-bottom:20px;}
  .wgrid{display:grid;grid-template-columns:56px repeat(5,1fr);gap:6px;}
  .wh{font-size:11.5px;font-weight:700;color:var(--sub);text-align:center;padding:0 0 8px;}
  .wh s{text-decoration:none;display:block;font-family:'JetBrains Mono',monospace;
    font-size:10.5px;color:var(--dim);font-weight:500;margin-top:2px;}
  .wt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);
    display:flex;align-items:center;justify-content:flex-end;padding-right:8px;}

  .slot{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
    min-height:52px;padding:7px 9px;transition:border-color var(--t);cursor:pointer;}
  .slot:hover{border-color:#D9D6CC;}
  .slot.free{background:var(--sunk);border-style:dashed;color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;}
  .slot.wait{background:var(--latebg);border-color:var(--late-line);}
  .slot.ok{background:var(--okbg);border-color:var(--ok-line);}
  .slot.done{opacity:.55;}
  .slot .n{font-size:12.5px;font-weight:600;}
  .slot .u{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.4;}
  .slot .b{margin-top:5px;}
  .slot.closed{background:repeating-linear-gradient(45deg,#F4F2EC,#F4F2EC 5px,#FAF9F6 5px,#FAF9F6 10px);
    border-color:var(--line2);}

  .ctx{position:absolute;right:0;top:0;bottom:0;width:340px;border-left:1px solid var(--line);
    background:var(--card);display:flex;flex-direction:column;overflow:hidden;}
  .ch{padding:18px 20px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .cbody{flex:1;min-height:0;overflow-y:auto;}
  .rq{padding:13px 20px;border-bottom:1px solid var(--line2);transition:background var(--t);}
  .rq:hover{background:var(--hover);}
  .rq .h{display:flex;align-items:center;gap:8px;}
  .rq .h b{font-size:13px;font-weight:600;}
  .rq .h .ago{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);}
  .rq .w{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6;}
  .rq .a{display:flex;gap:5px;margin-top:9px;}
</style>
</head>
<body>
<div class="chrome"><span class="c-num">09</span><span class="c-name">클리닉 <em>· 소통</em></span>
  <span class="c-meta">역할: 남는 시간에 학생을 앉힌다 · 시간이 자원인 화면　·　1440 × 900</span></div>

<div class="stage" id="stage"><div class="canvas" id="canvas">

  <div class="topbar">
    <div class="bm">김하현수학연구소</div>
    <nav id="nav"></nav>
    <div class="right"><span>이번 주 배정 <b class="mono">14</b>/20</span>
      <s style="text-decoration:none;">·</s><span>김하현T</span></div>
  </div>

  <div class="subnav" id="subnav"></div>

  <div class="body sub">

    <main class="main">
      <div class="mh">
        <div>
          <h1 class="t-title">클리닉<s>8월 3일(월) — 8월 7일(금)</s></h1>
          <div class="t-meta" style="margin-top:6px;">
            주 20슬롯<s>·</s>배정 14<s>·</s>승인 대기 <span style="color:var(--late);font-weight:600;">4</span><s>·</s>빈자리 6
          </div>
        </div>
        <div class="r">
          <button class="btn icon" id="prev"></button>
          <button class="btn sm">이번 주</button>
          <button class="btn icon" id="next"></button>
          <button class="btn sm" id="bslot"></button>
        </div>
      </div>

      <div class="week scroll">
        <div class="wgrid" id="wg"></div>
      </div>
    </main>

    <!-- 승인 대기는 슬롯 옆에 붙어 있어야 한다.
         «누가 신청했나»와 «어디가 비었나»를 한 화면에서 못 보면 배정이 두 번 일이 된다. -->
    <aside class="ctx">
      <div class="ch">
        <div class="row">
          <span style="font-size:13px;font-weight:700;">승인 대기</span>
          <span class="badge late">4</span>
          <span class="spacer"></span>
          <button class="btn q sm" id="bsort"></button>
        </div>
        <div class="muted" style="font-size:11.5px;margin-top:7px;">
          신호가 있는 학생을 위로 올렸습니다
        </div>
      </div>
      <div class="cbody scroll" id="reqs"></div>
    </aside>

  </div>

</div></div>

<script src="ds.js"></script>
<script>
  document.getElementById('prev').innerHTML  = ICON('chevL',16);
  document.getElementById('next').innerHTML  = ICON('chevR',16);
  document.getElementById('bslot').innerHTML = ICON('settings',13) + ' 슬롯 설정';
  document.getElementById('bsort').innerHTML = '위험도순 ' + ICON('chevD',12);

  var DAYS = [['월','8/3'],['화','8/4'],['수','8/5'],['목','8/6'],['금','8/7']];
  var TIMES = ['16:00','17:00','18:00','19:00'];

  /* 슬롯 상태 — free 빈자리 / wait 승인 대기 / ok 승인됨 / done 완료 / closed 정규수업으로 막힘
     [상태, 학생, 주제] */
  var SLOTS = {
    '16:00': [['done','최유진','오답 4문항'], ['free'], ['done','이서연','접선의 방정식'], ['free'], ['ok','윤서아','극값 판정']],
    '17:00': [['done','박지호','오답숙제 밀린 것'], ['ok','정하람','도함수의 활용'], ['free'], ['wait','임태경','도함수의 활용'], ['ok','한지우','그래프 개형']],
    '18:00': [['ok','강도윤','기초 다지기'], ['free'], ['wait','오세훈','오답 6문항'], ['free'], ['closed']],
    '19:00': [['closed'], ['closed'], ['closed'], ['closed'], ['closed']]
  };

  var LBL = {free:'빈자리', wait:'대기', ok:'승인', done:'완료'};
  var html = '<div class="wh"></div>' + DAYS.map(function (d) {
    return '<div class="wh">' + d[0] + '<s>' + d[1] + '</s></div>';
  }).join('');

  TIMES.forEach(function (t) {
    html += '<div class="wt">' + t + '</div>';
    SLOTS[t].forEach(function (s) {
      if (s[0] === 'closed') {
        html += '<div class="slot closed"></div>';
      } else if (s[0] === 'free') {
        html += '<div class="slot free">＋ 빈자리</div>';
      } else {
        html += '<div class="slot ' + s[0] + '">'
          + '<div class="n">' + s[1] + '</div>'
          + '<div class="u">' + s[2] + '</div>'
          + '<div class="b"><span class="badge ' + (s[0] === 'wait' ? 'late' : (s[0] === 'ok' ? 'ok' : '')) + '">'
          + LBL[s[0]] + '</span></div></div>';
      }
    });
  });
  html += '<div class="wt"></div><div class="slot closed" style="grid-column:span 5;min-height:26px;'
       + 'display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--dim);">'
       + '19:00 이후는 정규 수업 시간이라 클리닉을 열지 않습니다</div>';
  document.getElementById('wg').innerHTML = html;

  /* 신청 목록 — 신호가 있는 학생을 위로. 규칙이 화면 문구와 실제 정렬에서 같아야 한다. */
  var REQS = [
    ['osh15','6시간 전','8월 5일 (수) 18:00 희망 — 오답숙제 6문항이 밀렸습니다. 정적분 부분이 특히 어렵습니다.','r'],
    ['itk12','14시간 전','8월 7일 (금) 17:00 희망 — 미적분Ⅰ 도함수의 활용 집중해서 보고 싶습니다.','y'],
    ['jhr09','1일 전','8월 6일 (목) 17:00 희망 — 극대·극소 판정이 계속 헷갈립니다.','y'],
    ['mgo21','2일 전','8월 4일 (화) 16:00 희망 — 오답 2문항만 짧게 봐 주세요.','g']
  ];
  document.getElementById('reqs').innerHTML = REQS.map(function (r) {
    var s = STUDENTS.filter(function (x) { return x.id === r[0]; })[0];
    return '<div class="rq">'
      + '<div class="h"><span class="rk ' + r[3] + '"></span><b>' + s.n + '</b>'
      + '<span class="muted" style="font-size:11.5px;">' + s.s + ' ' + s.g + '</span>'
      + '<span class="ago">' + r[1] + '</span></div>'
      + '<div class="w">' + r[2] + '</div>'
      + '<div class="a"><button class="btn sm p">승인</button>'
      + '<button class="btn sm">시간 변경</button>'
      + '<button class="btn sm q">거절</button></div></div>';
  }).join('');

  renderNav('소통');
  renderSubnav('소통', '클리닉');
  fitCanvas();
</script>
</body>
</html>
