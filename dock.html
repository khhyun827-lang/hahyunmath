<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>김하현 Dock</title>
<!-- 김하현 Dock(Windows 앱 HahyunDock.exe) 전용 화면 — Dock 하나와 그 설정, 그리고 로고 배경화면 만들기.
     🔵 2026-10-18 사용자 — 「웹페이지 프로그램과 독을 분리 · 독은 별개의 프로그램으로 배경화면에 고정 · 가운데에도 · 배경화면을 로고 인트로처럼」.
     창은 투명하고(앱이 DWM 유리로 연다) 이 페이지가 Dock 만 그린다. 그린 크기는 앱에 알려 창을 딱 맞춘다(frame).
     실행할 경로는 여기 없다 — 앱이 제 PC 에 적어 두고, 이 페이지는 «id» 만 보낸다. 배경화면은 이 페이지가 PNG 로 그려 보낸다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="ds.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
html,body{height:100%;overflow:hidden;font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:transparent!important;}

/* ---------- Dock ---------- */
#dock{--dk:48px;position:fixed;z-index:10;display:flex;align-items:flex-end;width:max-content;
  gap:calc(var(--dk)*.2);padding:calc(var(--dk)*.17);box-sizing:border-box;
  height:calc(var(--dk)*1.34);
  /* 🔵 10-19 사용자 — 「독 뒤 하얀 판 지워 줘 · 어두운 맥 스타일」 → 판 없이 아이콘마다 어두운 타일만 */
  background:none;border-radius:calc(var(--dk)*.44);
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s;}
#dock[hidden]{display:none;}
#dock[data-pos=bottom]{left:50%;bottom:10px;transform:translateX(-50%);}
#dock[data-pos=center]{left:50%;top:50%;transform:translate(-50%,-50%);}
#dock[data-pos=left],#dock[data-pos=right]{top:50%;flex-direction:column;height:auto;width:calc(var(--dk)*1.34);}
#dock[data-pos=left]{left:10px;transform:translateY(-50%);align-items:flex-start;}
#dock[data-pos=right]{right:10px;transform:translateY(-50%);align-items:flex-end;}
#dock.autohide:not(.show)[data-pos=bottom]{transform:translate(-50%,calc(100% + 16px));}
#dock.autohide:not(.show)[data-pos=left]{transform:translate(calc(-100% - 16px),-50%);}
#dock.autohide:not(.show)[data-pos=right]{transform:translate(calc(100% + 16px),-50%);}
#dk-list{display:contents;}
.dk-sep{flex:none;align-self:stretch;width:1px;margin:calc(var(--dk)*.12) 0;background:rgba(255,255,255,.18);}
#dock[data-pos=left] .dk-sep,#dock[data-pos=right] .dk-sep{width:auto;height:1px;margin:0 calc(var(--dk)*.08);}

.dk-item{--z:1;position:relative;flex:none;container-type:size;
  width:calc(var(--dk)*var(--z));height:calc(var(--dk)*var(--z));
  padding:0;border:0;background:none;cursor:pointer;border-radius:22%;
  transition:width var(--t),height var(--t);}
.dk-item:focus-visible{outline:none;box-shadow:0 0 0 3px var(--point-ring);}
.dk-item .ic{width:100%;height:100%;display:block;object-fit:contain;box-sizing:border-box;pointer-events:none;
  background:rgba(30,31,36,.92);border-radius:22%;padding:16%;
  box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.08);}
.dk-item .ic.tile{padding:22%;}
.dk-item .ic.letter{display:grid;place-items:center;border-radius:22%;filter:none;
  background:linear-gradient(140deg,var(--point-lt),var(--point-d));color:#fff;font-weight:700;font-size:44cqw;
  box-shadow:0 2px 5px rgba(138,47,76,.3);}
.dk-item .ic.tile svg{width:100%;height:100%;color:rgba(255,255,255,.75);}
.dk-tip{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);
  background:rgba(30,31,36,.92);color:#fff;font-size:12px;font-weight:600;line-height:1;padding:6px 10px;
  border-radius:var(--r-sm);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--t);}
#dock[data-pos=left] .dk-tip{left:calc(100% + 12px);bottom:auto;top:50%;transform:translateY(-50%);}
#dock[data-pos=right] .dk-tip{left:auto;right:calc(100% + 12px);bottom:auto;top:50%;transform:translateY(-50%);}
.dk-item:hover .dk-tip,.dk-item:focus-visible .dk-tip{opacity:1;}
/* 눌렀을 때 — 두 번 통통 · 자두 점 하나 */
.dk-item.go{animation:dk-bounce .9s cubic-bezier(.3,0,.3,1);}
.dk-item.go::after{content:'';position:absolute;left:50%;bottom:calc(var(--dk)*-.13);width:4px;height:4px;margin-left:-2px;
  border-radius:50%;background:rgba(255,255,255,.8);}
@keyframes dk-bounce{0%,50%,100%{translate:0 0}22%{translate:0 -38%}72%{translate:0 -16%}}
#dock[data-pos=left] .dk-item.go,#dock[data-pos=right] .dk-item.go{animation:none;}
/* 시계·날짜 (10-18 사용자 — 「시계 날짜 넣어 줘」) — 왼쪽 가운데, 맥 잠금 화면처럼 가늘고 크게 */
#clock{position:fixed;left:6vw;top:50%;transform:translateY(-50%);z-index:5;color:#fff;pointer-events:none;
  text-shadow:0 2px 18px rgba(0,0,0,.35);user-select:none;}
#clock[hidden]{display:none;}
#clock .tm{font-size:clamp(72px,7.5vw,150px);font-weight:200;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
#clock .tm small{font-size:.24em;font-weight:400;letter-spacing:0;margin-left:.35em;opacity:.8;}
#clock .dt{margin-top:.5em;font-size:clamp(20px,1.7vw,32px);font-weight:500;opacity:.88;}
/* 오른쪽 카드 — 달력 · 다가오는 내 일정 · 할 일 (10-18 사용자 — 「보기만 · 오른쪽 카드」). 웹 홈의 memo:<uid> 문서를 읽기만 한다 */
#board{position:fixed;right:3vw;top:50%;transform:translateY(-50%);z-index:5;width:300px;box-sizing:border-box;padding:18px 18px 14px;
  color:#fff;background:rgba(22,23,30,.78);border:1px solid rgba(255,255,255,.08);border-radius:22px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);font-size:13px;user-select:none;}
#board[hidden]{display:none;}
#board .bd-ym{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
#board .bd-ym b{font-size:15px;font-weight:700;}
#board .bd-ym span{font-size:12px;color:rgba(255,255,255,.55);}
#board .bd-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums;}
#board .bd-grid > *{position:relative;height:26px;line-height:24px;}
#board .bd-grid .w{height:20px;line-height:20px;font-size:10.5px;color:rgba(255,255,255,.45);font-weight:600;}
#board .bd-grid .bd-su{color:#ff8a8a;} #board .bd-grid .bd-sa{color:#8ab4ff;}
#board .bd-grid .bd-t span{display:inline-block;width:24px;height:24px;border-radius:50%;background:#ff5f6d;color:#fff;font-weight:700;}
#board .bd-grid .bd-e::after{content:'';position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:rgba(255,255,255,.7);}
#board .bd-sec{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);}
#board .bd-h{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.5);}
#board ul{list-style:none;margin:0;padding:0;}
#board li{display:flex;gap:8px;align-items:baseline;padding:4px 0;line-height:1.4;}
#board li .d{flex:none;width:58px;font-size:11.5px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;}
#board li .d.on{color:#ff8a95;font-weight:700;}
#board li .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#board li .x s{text-decoration:none;margin-left:6px;font-size:11.5px;color:rgba(255,255,255,.5);}
#board li .ck{flex:none;width:12px;height:12px;box-sizing:border-box;border:1.5px solid rgba(255,255,255,.45);border-radius:50%;transform:translateY(2px);}
#board .bd-none{color:rgba(255,255,255,.4);font-size:12px;padding:2px 0;}
#board .bd-note{margin:12px 0 0;font-size:11px;color:rgba(255,255,255,.4);line-height:1.5;}
.acct input{width:110px;height:30px;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunk);padding:0 8px;font:inherit;}
#edge{position:fixed;z-index:9;display:none;}
#edge.on{display:block;}
#edge[data-pos=bottom]{left:0;right:0;bottom:0;height:4px;}
#edge[data-pos=left]{top:0;bottom:0;left:0;width:4px;}
#edge[data-pos=right]{top:0;bottom:0;right:0;width:4px;}

/* ---------- 설정 — 펴는 동안 창이 작업 영역 가득으로 커진다(앱이 맞춘다) ---------- */
#set{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(34,34,30,.28);}
#set[hidden]{display:none;}
.set-card{width:min(600px,92vw);max-height:88vh;overflow:auto;box-sizing:border-box;padding:22px 24px 24px;
  background:var(--card);border-radius:var(--r-xl);box-shadow:0 24px 60px rgba(34,34,30,.25);font-size:13px;}
.set-card header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.set-card h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;}
.set-card section{padding:14px 0;border-top:1px solid var(--line2);}
.set-card .t-sec{margin-bottom:8px;}
#set-items{list-style:none;margin:0;padding:0;}
#set-items li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:var(--r-md);}
#set-items li:hover{background:var(--hover);}
#set-items .ic{width:28px;height:28px;flex:none;}
#set-items .face{flex:none;padding:2px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;}
#set-items .face:hover,#set-items .face:focus-visible{outline:none;box-shadow:0 0 0 2px var(--point);}
#set-items .ic.tile{padding:4px;}
#set-items .ic.letter{font-size:13px;}
#set-items .nm{flex:1;min-width:0;}
#set-items input{width:100%;box-sizing:border-box;border:1px solid transparent;border-radius:var(--r-sm);
  background:transparent;font:inherit;font-weight:600;padding:3px 6px;color:var(--ink);}
#set-items input:hover{border-color:var(--line);}
#set-items input:focus{outline:none;border-color:var(--point);box-shadow:0 0 0 3px var(--point-ring);background:#fff;}
#set-items .tg{display:block;padding:0 7px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-card .ic{display:block;object-fit:contain;box-sizing:border-box;}
.set-card .ic.tile{background:#fff;border-radius:22%;box-shadow:inset 0 0 0 1px var(--line);}
.set-card .ic.letter{display:grid;place-items:center;border-radius:22%;color:#fff;font-weight:700;
  background:linear-gradient(140deg,var(--point-lt),var(--point-d));}
.set-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
#url-form{display:flex;gap:6px;margin-top:8px;}
#url-form[hidden]{display:none;}
#url-form input{height:30px;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--sunk);font:inherit;padding:0 9px;min-width:0;}
#url-form input:focus{outline:none;border-color:var(--point);box-shadow:0 0 0 3px var(--point-ring);}
#url-form [name=name]{width:110px;} #url-form [name=url]{flex:1;}
.btn.pt{background:var(--point);border-color:var(--point);color:#fff;font-weight:700;}
.btn.pt:hover{background:var(--point-d);border-color:var(--point-d);}
.btn.pt:disabled{opacity:.55;cursor:default;}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0;}
.row[hidden]{display:none;}
.row span{display:flex;align-items:center;gap:10px;}
.row output{width:40px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub);}
.row input[type=range]{width:180px;}
.row select{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunk);font:inherit;padding:0 8px;}
.set-card input[type=range],.set-card input[type=checkbox]{accent-color:var(--point);}
.set-card input[type=checkbox]{width:16px;height:16px;}

/* 배경화면 — 미리보기 셋 중 하나를 고르고 «배경화면으로» */
.wp-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.wp{padding:0;border:0;background:none;cursor:pointer;text-align:left;font:inherit;color:var(--ink);}
.wp canvas{display:block;width:100%;height:auto;border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);transition:box-shadow var(--t);}
.wp:hover canvas{box-shadow:0 0 0 2px var(--point-lt);}
.wp.on canvas{box-shadow:0 0 0 2.5px var(--point);}
.wp b{display:block;margin-top:6px;font-size:12px;font-weight:600;}
.wp s{display:block;text-decoration:none;font-size:11px;color:var(--dim);}
.wp-go{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px;font-size:11.5px;color:var(--dim);}

#toast{position:fixed;left:50%;bottom:96px;z-index:30;transform:translateX(-50%);
  background:var(--accent);color:#fff;font-size:13px;padding:9px 14px;border-radius:var(--r-md);
  box-shadow:0 8px 24px rgba(34,34,30,.25);opacity:0;pointer-events:none;transition:opacity .2s;}
#toast.on{opacity:1;}
</style>
</head>
<body>
<div id="clock" hidden><div class="tm"></div><div class="dt"></div></div>
<aside id="board" hidden aria-label="달력·할 일">
  <div class="bd-ym"><b></b><span></span></div>
  <div class="bd-grid"></div>
  <div class="bd-sec"><p class="bd-h">다가오는 일정</p><ul id="bd-ev"></ul></div>
  <div class="bd-sec"><p class="bd-h">할 일</p><ul id="bd-todo"></ul></div>
  <p class="bd-note" id="bd-note"></p>
</aside>
<div id="edge"></div>
<nav id="dock" hidden aria-label="Dock">
  <div id="dk-list"></div>
  <div class="dk-sep"></div>
  <button class="dk-item" id="dk-gear" aria-label="Dock 설정">
    <span class="ic tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
    <span class="dk-tip">Dock 설정</span>
  </button>
</nav>

<div id="set" hidden>
  <div class="set-card" role="dialog" aria-label="Dock 설정">
    <header><h2>Dock 설정</h2><button class="btn q icon" id="set-x" aria-label="닫기">✕</button></header>
    <section>
      <p class="t-sec">항목</p>
      <ul id="set-items"></ul>
      <div class="set-add">
        <button class="btn sm" data-pick="program">+ 프로그램</button>
        <button class="btn sm" data-pick="folder">+ 폴더</button>
        <button class="btn sm" data-pick="file">+ 파일</button>
        <button class="btn sm" id="add-url">+ 웹사이트</button>
      </div>
      <form id="url-form" hidden>
        <input name="name" placeholder="이름" required>
        <input name="url" placeholder="https://" required>
        <button class="btn pt sm">추가</button>
      </form>
    </section>
    <section>
      <p class="t-sec">모양</p>
      <label class="row">아이콘 크기<span><input type="range" id="s-size" min="32" max="72" step="2"><output id="o-size"></output></span></label>
      <label class="row">확대 배율<span><input type="range" id="s-mag" min="1" max="2" step="0.1"><output id="o-mag"></output></span></label>
      <label class="row">위치<select id="s-pos"><option value="bottom">아래</option><option value="center">화면 정가운데</option><option value="left">왼쪽</option><option value="right">오른쪽</option></select></label>
      <label class="row" id="r-hide">자동 숨김<input type="checkbox" id="s-hide"></label>
      <label class="row">시계·날짜 (왼쪽)<input type="checkbox" id="s-clock"></label>
    </section>
    <section>
      <p class="t-sec">달력·할 일 카드 (웹과 연동 · 보기만)</p>
      <label class="row">오른쪽 카드 보이기<input type="checkbox" id="s-board"></label>
      <div class="row" id="acct-on" hidden><span id="acct-who"></span><button class="btn sm" id="acct-out">연결 끊기</button></div>
      <form class="row acct" id="acct-form" hidden>
        <span>강사 아이디로 연결</span>
        <span><input name="id" placeholder="아이디" required autocomplete="username">
        <input name="pw" type="password" placeholder="비밀번호" required autocomplete="current-password">
        <button class="btn pt sm">연결</button></span>
      </form>
    </section>
    <section>
      <p class="t-sec">배경화면</p>
      <div class="wp-list" id="wp-list"></div>
      <div class="wp-go"><span>화면 크기 그대로 그려 Windows 배경화면으로 바꿉니다</span>
        <button class="btn pt sm" id="wp-set">배경화면으로 설정</button></div>
    </section>
    <section>
      <p class="t-sec">WINDOWS</p>
      <label class="row">Windows 시작 시 Dock 자동 실행<input type="checkbox" id="s-auto"></label>
      <label class="row" id="r-site">Windows 시작 시 김하현 Desktop 자동 실행<input type="checkbox" id="s-auto-site"></label>
    </section>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
/* 앱(C#)과 주고받는 말 — 이 페이지는 «id» 와 값만 보낸다. 경로는 앱이 제 파일 선택 창으로 받는다.
   받는 것: {cmd:'config', settings, items, autostart:{dock, site}, screen:{w,h}} · {cmd:'error'|'done', text}
   보내는 것: get · open{id} · pick{kind} · addUrl{name,url} · rename{id,name} · remove{id} · order{ids} · settings{settings}
             · autostart{which,on} · pickIcon{id} · resetIcon{id}
             · frame{mode:'dock'|'full', rects:[[x,y,w,h]…]}(물리 픽셀 — 창은 작업 영역 가득, 이 칸들만 보이고 눌린다) · wallpaper{png}(data:image/png) */
const $ = s => document.querySelector(s);
const bridge = window.chrome && window.chrome.webview;
const dock = $('#dock'), edge = $('#edge'), setBox = $('#set');
let cfg = null;
const send = m => bridge && bridge.postMessage(m);

if(bridge){
  bridge.addEventListener('message', e => {
    const m = e.data;
    if(m.cmd === 'config'){ cfg = m; renderDock(); if(!setBox.hidden) renderSettings(); }
    else if(m.cmd === 'error' || m.cmd === 'done'){ toast(m.text); if(m.cmd === 'done') wpBusy(false); }
  });
  send({cmd:'get'});
}

/* ---------- 창 — 작업 영역 가득이지만, 앱이 «여기 적은 칸들»만 창으로 남긴다(나머지는 바탕화면 클릭이 그대로 지나간다) ----------

let lastFrame = '', toastFull = false;
function frame(){
  if(!cfg) return;
  const full = !setBox.hidden || toastFull;
  const s = cfg.settings, r = dock.getBoundingClientRect(), k = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  const up = Math.ceil(s.size * (s.magnify - 1)) + 44;            // 커지는 만큼 + 말풍선
  const tucked = s.autohide && s.position !== 'center' && !dock.classList.contains('show');
  let d;   // Dock 칸
  if(s.position === 'left')       d = tucked ? [0, r.top - 20, 6, r.height + 40] : [0, r.top - 20, r.right + up + 150, r.height + 40];
  else if(s.position === 'right') d = tucked ? [W - 6, r.top - 20, 6, r.height + 40] : [r.left - up - 150, r.top - 20, W - r.left + up + 150, r.height + 40];
  else if(s.position === 'center') d = [r.left - 20, r.top - up, r.width + 40, r.height + up * 2];
  else d = tucked ? [r.left - 20, H - 6, r.width + 40, 6] : [r.left - 20, r.top - up, r.width + 40, H - r.top + up];
  const rects = [d];
  if(!board.hidden){ const c = board.getBoundingClientRect(); rects.push([c.left - 30, c.top - 30, c.width + 60, c.height + 60]); }
  if(!clockBox.hidden){ const c = clockBox.getBoundingClientRect(); rects.push([c.left - 30, c.top - 30, c.width + 60, c.height + 60]); }   // 넉넉히 — 글자 그림자가 잘리지 않게
  const m = { cmd:'frame', mode: full ? 'full' : 'dock', rects: rects.map(q => q.map(v => Math.round(v * k))) };
  const key = JSON.stringify(m);
  if(key !== lastFrame){ lastFrame = key; send(m); }
}

/* ==================== 배경화면 — 로고 인트로의 «작도»로 (10-18) ====================
   인트로(index.html #intro)가 그리는 것 그대로를 정지 화면으로 — 두 원 · 접선 · 큰 획(흰 선) · 갈래(자두 선) · 점 고리 · 격자, 그리고 로고.
   좌표는 인트로의 것(로고 그림 708×431 위, matrix M 으로 옮긴 선)을 그대로 쓴다. 그림은 화면 크기(물리 픽셀)로 그린다. */
const LOGO = new Image();
LOGO.src = 'brand-logo.png';
const LOGO_W = 708, LOGO_H = 431;
const WIRE_M = [0.95639, 0, 0, 0.95639, 103.244, -0.320];
const S1 = 'M13.72 29.25L51.20 29.25A105.32 105.32 0 0 1 155.40 119.30A79.95 79.95 0 0 0 300.66 152.60L361.54 62.91A79.97 79.97 0 1 1 373.05 166.20L346.57 204.47';
const S2 = 'M155.40 119.30A79.95 79.95 0 0 1 290.16 50.30L315.98 12.74';
const C1 = [234.51, 107.70, 79.95], C2 = [427.70, 107.82, 79.97], DOT = [153.63, 203.15, 17.61], TAN = [261.3, 210.5, 400.9, 5.0];

/* 로고를 밤 화면용으로 다시 칠한다 — 자두색은 연분홍, 짙은 글자·획은 흰색, 회색 영문은 흐린 흰색 */
let nightLogo = null;
function logoForNight(){
  if(nightLogo) return nightLogo;
  const c = document.createElement('canvas'); c.width = LOGO_W; c.height = LOGO_H;
  const g = c.getContext('2d'); g.drawImage(LOGO, 0, 0);
  const d = g.getImageData(0, 0, LOGO_W, LOGO_H), p = d.data;
  for(let i = 0; i < p.length; i += 4){
    if(!p[i + 3]) continue;
    const r = p[i], gg = p[i + 1], b = p[i + 2], lum = .3 * r + .59 * gg + .11 * b;
    if(lum > 140 && r - b < 30){ p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.round(p[i + 3] * .55); continue; }  // 회색 영문 → 흐린 흰색
    // 마크는 짙은 색 → 자두로 번지는 그라데이션이다 — 붉은 정도만큼 흰색에서 연분홍으로 «부드럽게»(뚝 끊기지 않게)
    const t = Math.max(0, Math.min(1, (r - b - 15) / 90));
    p[i] = 255 + (236 - 255) * t; p[i + 1] = 255 + (172 - 255) * t; p[i + 2] = 255 + (186 - 255) * t;
  }
  g.putImageData(d, 0, 0);
  return nightLogo = c;
}

/* 로고 자리(화면 좌표)로 옮기는 틀을 깔고, 그 안에서 인트로의 선을 긋는다 */
function wire(g, x, y, s, st){
  g.save();
  g.translate(x, y); g.scale(s, s);
  g.transform(...WIRE_M);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const lw = px => px / s / WIRE_M[0];            // 화면에서 px 두께가 되게
  // 두 원 · 접선 — 가는 보조선
  g.strokeStyle = st.guide; g.lineWidth = lw(st.thin);
  for(const [cx, cy, r] of [C1, C2]){ g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke(); }
  // 접선은 화면 끝까지 길게 — «작도»의 느낌
  const [x1, y1, x2, y2] = TAN, dx = x2 - x1, dy = y2 - y1;
  g.strokeStyle = st.guideFar; g.beginPath(); g.moveTo(x1 - dx * 6, y1 - dy * 6); g.lineTo(x2 + dx * 6, y2 + dy * 6); g.stroke();
  // 큰 원 둘을 한 번 더, 크게 — 바깥 고리
  g.strokeStyle = st.guideFar;
  for(const [cx, cy, r] of [C1, C2]){ g.beginPath(); g.arc(cx, cy, r * 2.15, 0, Math.PI * 2); g.stroke(); }
  // 큰 획(흰 선) · 갈래(자두 선) · 점 고리
  if(st.s1){ g.strokeStyle = st.s1; g.lineWidth = lw(st.thick); g.stroke(new Path2D(S1)); }
  if(st.s2){ g.strokeStyle = st.s2; g.lineWidth = lw(st.thick); g.stroke(new Path2D(S2)); }
  if(st.dot){ g.strokeStyle = st.dot; g.lineWidth = lw(st.thin); g.beginPath(); g.arc(DOT[0], DOT[1], DOT[2], 0, Math.PI * 2); g.stroke(); }
  g.restore();
}

/* 격자 — 가운데에서 멀어질수록 사라진다(인트로의 it-grid) */
function grid(g, W, H, step, color, cx, cy){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const q = c.getContext('2d');
  q.strokeStyle = color; q.lineWidth = Math.max(1, step / 44);
  q.beginPath();
  for(let x = cx % step; x < W; x += step){ q.moveTo(Math.round(x) + .5, 0); q.lineTo(Math.round(x) + .5, H); }
  for(let y = cy % step; y < H; y += step){ q.moveTo(0, Math.round(y) + .5); q.lineTo(W, Math.round(y) + .5); }
  q.stroke();
  q.globalCompositeOperation = 'destination-in';
  const R = Math.hypot(W, H) / 2, m = q.createRadialGradient(cx, cy, R * .12, cx, cy, R * .78);
  m.addColorStop(0, '#000'); m.addColorStop(1, 'rgba(0,0,0,0)');
  q.fillStyle = m; q.fillRect(0, 0, W, H);
  g.drawImage(c, 0, 0);
}

const WALLPAPERS = [
  { id:'mac', name:'맥 · 어둠', note:'숯빛 바탕 · 남색 물결 (10-19)', draw(g, W, H){
      // 바탕 — 위는 숯빛, 아래로 갈수록 짙은 남색
      const bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#26272c'); bg.addColorStop(1, '#14161f');
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      // 꽃잎 — 아래 가운데에서 오른쪽 위로 솟는 밝은 청회색 면
      g.save();
      g.beginPath();
      g.moveTo(W * .30, H * 1.05);
      g.bezierCurveTo(W * .42, H * .55, W * .55, H * .02, W * .76, H * .05);
      g.bezierCurveTo(W * .90, H * .07, W * 1.02, H * .35, W * 1.05, H * .62);
      g.lineTo(W * 1.05, H * 1.05); g.closePath();
      const pt = g.createLinearGradient(W * .38, H * .35, W * .95, H * .75);
      pt.addColorStop(0, '#9aa3cf'); pt.addColorStop(.28, '#5b6596'); pt.addColorStop(.7, '#2c3463'); pt.addColorStop(1, '#1b2147');
      g.shadowColor = 'rgba(150,160,220,.35)'; g.shadowBlur = W / 60;
      g.fillStyle = pt; g.fill();
      g.restore();
      // 꽃잎 위 결 — 가는 빛줄기
      g.save(); g.globalCompositeOperation = 'screen';
      const sh = g.createRadialGradient(W * .5, H * .55, 0, W * .5, H * .55, W * .32);
      sh.addColorStop(0, 'rgba(200,205,240,.35)'); sh.addColorStop(1, 'rgba(200,205,240,0)');
      g.fillStyle = sh; g.fillRect(0, 0, W, H); g.restore();
      // 왼쪽 언덕 — 아래 왼쪽을 덮는 짙은 남색, 꽃잎과 만나는 곳이 접힌 골
      g.save();
      g.beginPath();
      g.moveTo(-W * .02, H * .27);
      g.bezierCurveTo(W * .22, H * .20, W * .38, H * .40, W * .53, H * .72);
      g.quadraticCurveTo(W * .56, H * .79, W * .59, H * .72);              // 접힌 골 — 둥근 V
      g.bezierCurveTo(W * .66, H * .52, W * .74, H * .28, W * .86, H * .12);  // 꽃잎 오른쪽 그늘 — 위로 올라간다
      g.bezierCurveTo(W * .93, H * .04, W * 1.0, H * .02, W * 1.05, H * .02);
      g.lineTo(W * 1.05, H * 1.05); g.lineTo(-W * .02, H * 1.05); g.closePath();
      const hl = g.createLinearGradient(0, H * .25, W * .5, H);
      hl.addColorStop(0, '#1a2250'); hl.addColorStop(.6, '#111739'); hl.addColorStop(1, '#0b0f26');
      g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = W / 40;
      g.fillStyle = hl; g.fill();
      g.restore();
      // 가장자리 비네트
      const v = g.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, Math.hypot(W, H) * .6);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
      g.fillStyle = v; g.fillRect(0, 0, W, H);
  }},
  { id:'night', name:'인트로 · 밤', note:'어두운 바탕 · 흰 작도 선', draw(g, W, H){
      const cx = W / 2, cy = H * .46;
      const bg = g.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) * .62);
      bg.addColorStop(0, '#2a2024'); bg.addColorStop(.55, '#171214'); bg.addColorStop(1, '#110d0f');
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      grid(g, W, H, Math.round(W / 44), 'rgba(255,255,255,.05)', cx, cy);
      const s = Math.min(W * .34, H * .5) / LOGO_W, x = cx - LOGO_W * s / 2, y = cy - LOGO_H * s / 2;
      wire(g, x, y, s, { guide:'rgba(255,255,255,.2)', guideFar:'rgba(255,255,255,.07)', thin:Math.max(1, W / 1100),
        thick:Math.max(1.5, W / 640), s1:null, s2:null, dot:'rgba(234,169,182,.55)' });
      g.save(); g.shadowColor = 'rgba(234,169,182,.35)'; g.shadowBlur = W / 40;
      g.drawImage(logoForNight(), x, y, LOGO_W * s, LOGO_H * s); g.restore();
  }},
  { id:'day', name:'작도 · 낮', note:'종이 바탕 · 자두 작도 선', draw(g, W, H){
      const cx = W / 2, cy = H * .46;
      g.fillStyle = '#F8F4F5'; g.fillRect(0, 0, W, H);
      const blush = g.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) * .5);
      blush.addColorStop(0, 'rgba(234,169,182,.22)'); blush.addColorStop(1, 'rgba(234,169,182,0)');
      g.fillStyle = blush; g.fillRect(0, 0, W, H);
      grid(g, W, H, Math.round(W / 44), 'rgba(138,47,76,.06)', cx, cy);
      const s = Math.min(W * .34, H * .5) / LOGO_W, x = cx - LOGO_W * s / 2, y = cy - LOGO_H * s / 2;
      wire(g, x, y, s, { guide:'rgba(138,47,76,.22)', guideFar:'rgba(138,47,76,.08)', thin:Math.max(1, W / 1100),
        thick:Math.max(1.5, W / 640), s1:null, s2:null, dot:'rgba(176,64,84,.45)' });
      g.drawImage(LOGO, x, y, LOGO_W * s, LOGO_H * s);
  }},
  { id:'line', name:'선 · 여백', note:'큰 획만 크게 · 로고는 작게', draw(g, W, H){
      const bg = g.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#FBF8F9'); bg.addColorStop(1, '#F1E6E9');
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      // 마크의 선을 화면을 가로지를 만큼 크게 — 큰 획은 흐린 자두, 갈래는 분홍
      const big = W * 1.15 / LOGO_W;
      wire(g, W * .5 - LOGO_W * big * .55, H * .5 - 110 * big, big, { guide:'rgba(138,47,76,.07)', guideFar:'rgba(138,47,76,.04)',
        thin:Math.max(1, W / 1200), thick:Math.max(3, W / 260), s1:'rgba(138,47,76,.10)', s2:'rgba(234,169,182,.45)', dot:'rgba(138,47,76,.12)' });
      const s = Math.min(W * .17, H * .26) / LOGO_W;
      g.drawImage(LOGO, W / 2 - LOGO_W * s / 2, H * .44 - LOGO_H * s / 2, LOGO_W * s, LOGO_H * s);
  }},
];
let wpPick = (() => { try{ return localStorage.getItem('dock.wp') || 'mac'; }catch(e){ return 'mac'; } })();

function screenSize(){ return (cfg && cfg.screen && cfg.screen.w) ? cfg.screen : { w: screen.width * devicePixelRatio, h: screen.height * devicePixelRatio }; }

function renderWallpapers(){
  const sc = screenSize(), tw = 360, th = Math.round(tw * sc.h / sc.w);
  $('#wp-list').replaceChildren(...WALLPAPERS.map(d => {
    const b = document.createElement('button'); b.className = 'wp' + (d.id === wpPick ? ' on' : '');
    const c = document.createElement('canvas'); c.width = tw; c.height = th;
    const nm = document.createElement('b'); nm.textContent = d.name;
    const nt = document.createElement('s'); nt.textContent = d.note;
    b.append(c, nm, nt);
    b.onclick = () => { wpPick = d.id; try{ localStorage.setItem('dock.wp', d.id); }catch(e){} renderWallpapers(); };
    const go = () => d.draw(c.getContext('2d'), tw, th);
    LOGO.complete && LOGO.naturalWidth ? go() : LOGO.addEventListener('load', go, { once:true });
    return b;
  }));
}

function wpBusy(on){ const b = $('#wp-set'); b.disabled = on; b.textContent = on ? '만드는 중…' : '배경화면으로 설정'; }
$('#wp-set').onclick = () => {
  const d = WALLPAPERS.find(x => x.id === wpPick) || WALLPAPERS[0], sc = screenSize();
  if(!LOGO.complete || !LOGO.naturalWidth){ toast('로고를 아직 못 불러왔습니다 — 잠시 뒤에 다시 눌러 주세요'); return; }
  wpBusy(true);
  setTimeout(() => {      // 「만드는 중…」을 먼저 그리게 한 틈 뒤에
    const c = document.createElement('canvas'); c.width = sc.w; c.height = sc.h;
    d.draw(c.getContext('2d'), sc.w, sc.h);
    send({cmd:'wallpaper', png: c.toDataURL('image/png')});
    setTimeout(() => wpBusy(false), 8000);   // 앱이 답을 못 하면 단추를 풀어 준다
  }, 30);
};
