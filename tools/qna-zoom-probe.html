<!doctype html><meta charset="utf-8"><title>qna-zoom-probe</title>
<!-- 질의응답 사진을 누르면 크게 보이는가 (2026-09-14). 가짜 질문 하나에 사진을 달고 눌러 본다. 실 DB 0줄.
     node tools/serve.js
     chrome --headless=new --hide-scrollbars --virtual-time-budget=20000 --window-size=1200,800 --screenshot=out.png --dump-dom "http://127.0.0.1:8777/tools/qna-zoom-probe.html" | grep -o "RESULT.*" -->
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}</style>
<pre id="o" style="font:12px monospace;color:#fff;margin:0;padding:4px;">…</pre>
<script>
const fr=document.createElement('iframe'); fr.width=1200; fr.height=760; fr.src='/index.html';
document.body.appendChild(fr);
const o=document.getElementById('o'); let n=0;
const t=setInterval(async()=>{ n++; let ok=false;
  try{ ok = fr.contentWindow.eval('typeof teacherQnaHTML==="function" && typeof openPhoto==="function"'); }catch(_){}
  if(!ok){ if(n>150){clearInterval(t); o.textContent='RESULT timeout';} return; }
  clearInterval(t);
  const w=fr.contentWindow;
  let out; try{ out = await w.eval(`(async function(){
    const R = {};
    DATA.classes = [{id:'c1', name:'고1 0.5B'}];
    DATA.students = [{studentId:'s1', name:'김승우', classId:'c1'}];
    DATA.qnas = [{id:'q1', studentId:'s1', studentName:'김승우', date:'2026-09-14', question:'이 문제 풀이 부탁드려요', image:{url:'stamp.webp', fileId:'f1'}, status:'open'}];
    state.currentUser = {type:'teacher'}; state.view='teacher'; state.teacherTab='qna'; state.qnaSelectedId='q1'; state.qnaFilter='all';
    render(); await new Promise(r => setTimeout(r, 2500));
    const img = document.querySelector('.qn-img');
    R.hasImg = !!img; R.cursor = img ? getComputedStyle(img).cursor : '';
    img.click(); await new Promise(r => setTimeout(r, 200));
    const v = document.querySelector('.hw-view');
    R.opened = !!v; R.src = v ? v.querySelector('img').getAttribute('src') : '';
    document.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape', bubbles:true})); await new Promise(r => setTimeout(r, 200));
    R.closedByEsc = !document.querySelector('.hw-view');
    img.click(); await new Promise(r => setTimeout(r, 200));   // 스크린샷용으로 다시 연다
    return R;
  })()`); }catch(e){ o.textContent='RESULT ERROR '+(e&&e.stack||e); return; }
  o.textContent = 'RESULT ' + JSON.stringify(out);
}, 100);
</script>
