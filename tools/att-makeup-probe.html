<script>
const fr = document.createElement('iframe');
const Q = parent.location.search;
const W = Number((Q.match(/[?&]w=([0-9]+)/) || [])[1]) || 1280;
fr.width = W; fr.height = 900; fr.style.width = W + 'px'; fr.src = '/index.html';
document.body.appendChild(fr);
const o = document.getElementById('o');
let n = 0;
const t = setInterval(async () => {
  n++;

  if (!ready) { if (n > 200) { clearInterval(t); o.textContent = 'RESULT timeout'; } return; }
  clearInterval(t);
  const w = fr.contentWindow;
  let out;
  try {
    out = await w.eval(`(async function(){
  const R = {}; const 쓴것 = [];
  window.dbSet = async (k,v) => { 쓴것.push(k); return true; };

  window.dbDelete = async () => true;

  DATA.students = 이름.map((nm,i)=>({ studentId:'s'+i, name:nm, classId:CID, status:'재원', school:'프로브고', grade:'1학년' }));

  /* 결석 셋 — 영상 준 것(s1 D3) · 안 준 것(s2 D2 · s3 D1) / 지각 하나 영상 줌(s4 D1) */
  DATA.videos = [
    { id:'v1_s1', studentId:'s1', classId:CID, title:D3+' 결석 보충 영상', url:'https://youtu.be/dQw4w9WgXcQ', dueDate:d(4) },
    { id:'v1_s4', studentId:'s4', classId:CID, title:D1+' 지각 보충 영상', url:'https://youtu.be/9bZkp7q19f0', dueDate:d(6) },
  ];
  state.allRecords = {};
  DATA.students.forEach(s => {
    const att = [D3, D2, D1].map(dt => ({ date:dt, classId:CID, status:'출석', reason:'' }));
    state.allRecords[s.studentId] = { attendance: att, videoProgress:{} };
  });
  const 바꿈 = (sid, dt, st) => { state.allRecords[sid].attendance.find(a => a.date === dt).status = st; };
  바꿈('s1', D3, '결석'); 바꿈('s2', D2, '결석'); 바꿈('s3', D1, '결석'); 바꿈('s4', D1, '지각');
  state.allRecordsLoaded = true; state.allRecordsLoading = false;
  state.currentUser = { type:'teacher' }; state.view = 'teacher';

  if(${JSON.stringify(Q)}.includes('open=1')) state.attOpenDate = D3;
  render(); await new Promise(r=>setTimeout(r,200));
  R.초록 = document.querySelectorAll('.ag-m .mvmark').length;          // 2 — s1 결석 · s4 지각
  R.점선 = document.querySelectorAll('.ag-m.nomv').length;             // 2 — s2 · s3

  R.가로넘침 = document.documentElement.scrollWidth > window.innerWidth + 1;
  R.실DB로_나간것 = 쓴것;
  return R;
})()`);
  } catch (e) { out = { error: String(e && e.stack || e) }; }
  o.textContent = 'RESULT ' + JSON.stringify(out);
}, 100);
