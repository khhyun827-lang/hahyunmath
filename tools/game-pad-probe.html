<!doctype html><meta charset="utf-8"><title>game-pad-probe</title>
<!-- 똥피하기의 «엄지 자리» — 연습 페이지(game.html)를 폰 크기 iframe 에 띄워 사람이 바닥에서 얼마나 떠 있는지 잰다 (2026-09-14).
     node tools/serve.js
     chrome --headless=new --hide-scrollbars --virtual-time-budget=15000 --window-size=390,900 --screenshot=out.png --dump-dom "http://127.0.0.1:8777/tools/game-pad-probe.html" | grep -o "RESULT.*" -->
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}</style>
<pre id="o" style="font:12px monospace;color:#fff;margin:0;padding:4px;">…</pre>
<script>
const fr=document.createElement('iframe'); fr.width=390; fr.height=760; fr.src='/game.html';
document.body.appendChild(fr);
const o=document.getElementById('o'); let n=0;
const t=setInterval(()=>{ n++; let ok=false;
  try{ ok = fr.contentWindow.eval('typeof Game==="object" && typeof MODE_DODGE==="object" && typeof start==="function"'); }catch(_){}
  if(!ok){ if(n>150){clearInterval(t); o.textContent='RESULT timeout';} return; }
  clearInterval(t);
  const w=fr.contentWindow;
  const r = w.eval('mode = MODE_DODGE; start(); Game.started = true; ({h: Game.h, pad: Game.pad, py: Game.py, fromBottom: Game.h - Game.py})');
  setTimeout(()=>{ o.textContent = 'RESULT ' + JSON.stringify(r); }, 600);
}, 100);
</script>
