<!doctype html><meta charset="utf-8">
<title>bookshot</title>
<!-- 교재 목업을 «한 장»으로 앉힌다.
     책 자체는 사용자가 목업 도구로 뽑아 준 투명 PNG다 (책표지/mockupea_export*.png).
     여기서 하는 일은 배치와 바탕뿐이다 — 책의 몸을 CSS로 그리던 앞판은 버렸다.

     ⚠ 바탕은 페이지와 «똑같은» --paper 단색이어야 한다. 그라디언트를 깔면
        이미지의 네 변이 사각 테두리로 드러난다. 그림자는 PNG에 이미 구워져 있다.
     ⚠ 책 높이를 «눈으로» 맞춘다 — 목업마다 책이 차지하는 비율이 달라서
        같은 height를 줘도 책 크기가 어긋난다.

     굽는 법:
       node tools/serve.js
       chrome --headless=new --hide-scrollbars --force-device-scale-factor=2 \
         --virtual-time-budget=9000 --window-size=1280,740 \
         --screenshot=out.png http://127.0.0.1:8777/tools/make-book-mockup.html
     그 뒤 1760폭 JPG로 줄여 book-set.jpg로 둔다. -->
<style>
:root{ --paper:#FAF9F6; }
*{box-sizing:border-box;}
html,body{margin:0;background:var(--paper);}
.stage{width:1280px;height:740px;background:var(--paper);
  display:flex;align-items:center;justify-content:center;gap:0;}
.stage img{display:block;height:auto;}
/* 주기나 — 뒤. 개념서에 살짝 가린다 */
.b-jugina{width:452px;margin-right:-74px;transform:translateY(-8px);}
/* 개념서 — 앞 */
.b-gaenyeom{width:453px;transform:translateY(12px);}
</style>
<div class="stage">
  <img class="b-jugina"   src="/tools/mock-jugina.png"   alt="주기나 기출변형">
  <img class="b-gaenyeom" src="/tools/mock-gaenyeom.png" alt="개념서">
</div>
