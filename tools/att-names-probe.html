<!doctype html><meta charset="utf-8"><title>att-names-probe</title>
<!-- 지난 수업 확인 — 결석·지각·조퇴한 «이름»이 뜨는지 눈으로 본다 (2026-09-17).
     사용자 —「수업탭 - 출결 - 지난 수업 확인에서 결석이나 지각생에 대해 이름도 적어줬으면 좋겠어」.

       node tools/serve.js
       그리고 브라우저로 http://127.0.0.1:8777/tools/att-names-probe.html
       (`?w=390` 을 붙이면 폰 폭으로 잰다 — 이름이 길어지면 여기서 넘친다)

     🔴 **실 DB 0줄 · 읽기 0건** — dbSet/dbGet/dbSetDoc/logAudit 를 프레임 안에서 갈아 끼운다.
       class-prog-probe 와 같은 어법이다(09-04 사고를 다시 만들지 않으려는 것).
     ⚠ 이 프로브는 «그림»을 본다. 값이 맞는지는 tools/att-names-test.mjs 가 잰다. -->
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block}
pre{font:12px monospace;color:#333;margin:0;padding:4px;white-space:pre-wrap;}</style>
<pre id="o">…</pre>
<script>
const W = Number((parent.location.search.match(/[?&]w=([0-9]+)/) || [])[1]) || 1280;
const fr = document.createElement('iframe');
fr.width = W; fr.height = 1400; fr.style.width = W + 'px'; fr.src = '/index.html';
document.body.appendChild(fr);
const o = document.getElementById('o');
let n = 0;
const t = setInterval(async () => {
  n++;
  let ready = false;
  try { ready = fr.contentWindow.eval('typeof sessionPrevHTML==="function" && typeof render==="function" && typeof state!=="undefined"'); } catch (_) {}
  if (!ready) { if (n > 200) { clearInterval(t); o.textContent = 'RESULT timeout'; } return; }
  clearInterval(t);
  const w = fr.contentWindow;
  let out;
  try {
    out = await w.eval(`(async function(){
  const R = {}; const 쓴것 = [];
  window.dbSet = async (k,v) => { 쓴것.push(k); return true; };
  window.dbGet = async (k,d) => d;
  window.dbSetDoc = async (c,i,d) => { 쓴것.push(c+'/'+i); return true; };
  window.dbDelete = async () => true;
  window.logAudit = async () => {};
  window.showToast = () => {};
  window.loadAllRecordsIfNeeded = () => {};

  /* ── 흉내 반 하나 · 월·수·금 ─────────────────────────────────── */
  const CID = 'probe1', 지난날 = '2026-09-16', 오늘 = '2026-09-18';
  DATA.classes = [{ id:CID, name:'고1 프로브반', schedule:'월,수,금 19시~21시',
    period:'26.03~26.12', status:'진행중', kind:'정규' }];
  DATA.assignments = []; DATA.exams = [];

  /* ⚠ 이름 길이를 일부러 섞는다 — 세 글자·네 글자·긴 사유.
     폰 폭에서 줄이 어떻게 접히는지가 이 프로브의 절반이다. */
  const 판 = [
    ['s1','김가온','출석',''],
    ['s2','이나린','지각','버스가 늦었습니다'],
    ['s3','박다솔','결석',''],
    ['s4','최라온','조퇴','병원'],
    ['s5','정마루','출석',''],
    ['s6','남궁하루','지각',''],
    ['s7','황보시우','출석',''],
    ['s8','서연우','결석','독감 · 다음 주까지'],
    ['s9','한겨울','출석',''],
    ['s10','오여름','출석','']
  ];
  DATA.students = 판.map(([id,name])=>({ studentId:id, name, classId:CID, status:'재원',
    school:'프로브고', grade:'1학년' }));
  state.allRecords = {};
  판.forEach(([id,name,st,why])=>{
    state.allRecords[id] = { attendance:[{ date:지난날, classId:CID, status:st, reason:why }] };
  });
  state.allRecordsLoaded = true; state.allRecordsLoading = false;
  state.currentUser = { type:'teacher' }; state.view = 'teacher';
  state.sessionNotes = { [CID]: { [지난날]: '인수분해 공식에서 막히는 학생이 많았다. 다음 시간 예제부터 다시.' } };
  state.classProgLogs = { [CID]: { [지난날]: { book:'[2026] 쎈 수학(상)', detail:'p.30~44 · 2단원 마무리', subject:'공통수학1' } } };
  state.classProgLogLoading = {};

  /* ── 지난 수업 확인을 그린다 ─────────────────────────────────── */
  state.teacherTab = 'session'; state.sessionDate = 오늘;
  state.sessionClassId = CID; state.sessionStep = 'prev';
  render(); await new Promise(r=>setTimeout(r,150));

  const d = document;
  const 글 = el => (el && el.textContent || '').replace(/\s+/g,' ').trim();
  const 출결칸 = [...d.querySelectorAll('.cls-hw')].find(x=>/^출결/.test(글(x)));
  R.출결칸 = 글(출결칸);
  R.줄 = [...(출결칸 ? 출결칸.querySelectorAll('.badge') : [])].map(b=>{
    const 줄 = b.parentElement;
    return 글(b) + ' → ' + 글(줄).replace(글(b),'').trim();
  });
  R.출석한사람이_떴나 = /김가온|정마루|한겨울|오여름/.test(R.출결칸);

  /* 좁은 폭에서 넘치는가 */
  R.폭 = window.innerWidth;
  R.가로넘침 = document.documentElement.scrollWidth > window.innerWidth + 1;
  R.넘친요소 = [...d.querySelectorAll('.cls-hw, .cls-hw .badge')]
    .filter(e=>e.getBoundingClientRect().right > window.innerWidth + 1).map(e=>e.className);

  R.실DB로_나간것 = 쓴것;
  return R;
})()`);
  } catch (e) { out = { 터짐: String(e && e.message || e) }; }
  o.textContent = 'RESULT ' + JSON.stringify(out, null, 1);
}, 100);
</script>
