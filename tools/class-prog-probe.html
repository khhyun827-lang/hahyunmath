<!doctype html><meta charset="utf-8"><title>class-prog-probe</title>
<!-- 진도 기록(P-1)을 «확장 없이» 헤드리스 크롬으로 굴려 본다 (2026-09-12).
     실서비스(index.html)를 iframe 에 띄우고 **저장을 통째로 흉내로 바꾼 뒤**
     수업 › 2단계 진도 · 반 관리 › 진도 일지 · 지난 수업 확인을 차례로 그린다.

       node tools/serve.js
       chrome --headless=new --hide-scrollbars --virtual-time-budget=25000 --window-size=1280,2000 \
         --screenshot=out.png --dump-dom "http://127.0.0.1:8777/tools/class-prog-probe.html" \
         | grep -o 'RESULT [{].*' | sed 's|</pre>.*||'

     · 그냥 열면 **반 관리 › 진도 일지**가 찍힌다.
     · `?shot=session` 을 붙이면 **수업 › 2단계 진도**가 찍힌다.
     · `?w=390` 을 붙이면 그 폭으로 재서 `가로넘침`·`넘친요소` 를 함께 낸다(수업 중에 폰으로 쓴다).
       ⚠ `--window-size` 도 함께 줄여야 스크린샷이 그 폭으로 나온다.

     🔴 **실 DB 0줄 · 읽기 0건** — dbSet/dbGet/dbSetDoc/logAudit 를 프레임 안에서 갈아 끼운다.
       09-04에 「비었다」와 「못 읽었다」를 못 갈라 기록을 지운 사고가 있었다. 프로브가 진짜
       Firestore 를 건드리면 그 사고를 다시 만드는 길이 된다.
     ⚠ state/render 는 let/function 전역이라 프레임 안에서 eval 로 만진다 (figure-edit-probe 와 같다). -->
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block}
pre{font:12px monospace;color:#333;margin:0;padding:4px;white-space:pre-wrap;}</style>
<pre id="o">…</pre>
<script>
const fr = document.createElement('iframe');
/* ⚠ 폭은 URL 로 받는다 — `?w=390` 이면 좁은 폭에서 넘치는지 잰다.
   (이 줄을 셸로 짓다가 백슬래시가 깎여 `\d` 가 `d` 로 바뀌어 늘 1280 이 나왔다. 파일로 짓는다.) */
const W = Number((parent.location.search.match(/[?&]w=([0-9]+)/) || [])[1]) || 1280;
fr.width = W; fr.height = 1900; fr.style.width = W + 'px'; fr.src = '/index.html';
document.body.appendChild(fr);
const o = document.getElementById('o');
let n = 0;
const t = setInterval(async () => {
  n++;
  let ready = false;
  try { ready = fr.contentWindow.eval('typeof sessionProgHTML==="function" && typeof render==="function" && typeof state!=="undefined"'); } catch (_) {}
  if (!ready) { if (n > 200) { clearInterval(t); o.textContent = 'RESULT timeout'; } return; }
  clearInterval(t);
  const w = fr.contentWindow;
  let out;
  try {
    out = await w.eval(`(async function(){
  const R = {}; const 쓴것 = [];
  /* ── 실 DB 를 끊는다 ─────────────────────────────────────────── */
  window.dbSet = async (k,v) => { 쓴것.push(k); return true; };
  window.dbGet = async (k,d) => d;
  window.dbSetDoc = async (c,i,d) => { 쓴것.push(c+'/'+i); return true; };
  window.dbDelete = async () => true;
  window.logAudit = async () => {};
  window.showToast = () => {};
  window.loadAllRecordsIfNeeded = () => {};

  /* ── 흉내 반 하나 ────────────────────────────────────────────── */
  const CID = 'probe1';
  DATA.classes = [{ id:CID, name:'고1 프로브반', schedule:'월,수,금 19시~21시',
    period:'26.03~26.12', status:'진행중', kind:'정규',
    progress:{ subject:'공통수학1', unitsBySubject:{ 공통수학1:{} },
               booksBySubject:{ 공통수학1:['[2026] 쎈 수학(상)','개념원리 공통수학1'] } } }];
  DATA.students = []; DATA.assignments = []; DATA.exams = [];
  state.allRecords = {}; state.allRecordsLoaded = true; state.allRecordsLoading = false;
  state.currentUser = { type:'teacher' }; state.view = 'teacher';
  state.classProgLogs = {}; state.classProgLogLoading = {}; state.classProgDraft = null;
  state.classProgEditDate = ''; state.classProgBookAdd = false;

  /* 지난 회차가 보이는지 보려면 쌓인 것이 있어야 한다. */
  state.classProgLogs[CID] = {
    '2026-09-07': { book:'[2026] 쎈 수학(상)', detail:'p.20~29 · 유형 3~5', subject:'공통수학1' },
    '2026-09-09': { book:'[2026] 쎈 수학(상)', detail:'p.30~44 · 2단원 마무리 · 오답 10문항 숙제', subject:'공통수학1' },
    '2026-09-11': { book:'개념원리 공통수학1', detail:'p.51~60 · 인수분해 공식 세 개', subject:'공통수학1' }
  };

  const 글 = el => (el && el.textContent || '').replace(/\\s+/g,' ').trim();

  /* ── ① 수업 › 2단계 진도 ─────────────────────────────────────── */
  state.teacherTab = 'session'; state.sessionDate = '2026-09-14';
  state.sessionClassId = CID; state.sessionStep = 'prog';
  render(); await new Promise(r=>setTimeout(r,120));
  const d = document;
  R.수업_교재고르개 = !!d.querySelector('.prog-row select');
  R.수업_교재개수 = d.querySelectorAll('.prog-row select option').length;
  R.수업_교재더하기단추 = !![...d.querySelectorAll('.prog-row button')].find(b=>/교재/.test(b.textContent));
  R.수업_글칸 = !!d.getElementById('prog-detail');
  R.수업_글칸높이 = (()=>{ const e=d.getElementById('prog-detail'); return e ? Math.round(e.getBoundingClientRect().height) : 0; })();
  R.수업_지난회차 = [...d.querySelectorAll('.prog-past .r')].map(r=>글(r));
  R.수업_단원체크 = d.querySelectorAll('.cls-chap').length;
  R.수업_띠 = 글(d.querySelector('.actbar'));

  /* 글을 치고 교재를 고른 뒤 «단계를 옮기면» 저절로 저장되는가 */
  const ta = d.getElementById('prog-detail');
  ta.value = 'p.61~78 · 3단원 예제 전부 · 유형 7은 숙제로';
  ta.dispatchEvent(new Event('input', {bubbles:true}));
  const sel = d.querySelector('.prog-row select');
  sel.value = '개념원리 공통수학1';
  sel.dispatchEvent(new Event('change', {bubbles:true}));
  R.초안_들어감 = !!(state.classProgDraft && state.classProgDraft.detail);
  쓴것.length = 0;
  await goSessionStep('exam');
  R.넘어갈때_저장됨 = 쓴것.filter(x=>/^classprog:/.test(x));
  const 저장본 = (state.classProgLogs[CID]||{})['2026-09-14'];
  R.저장된_값 = 저장본 ? [저장본.book, 저장본.detail] : null;
  R.초안_비워짐 = state.classProgDraft === null;

  /* ── ② 지난 수업 확인 — 그날 진도가 보이는가 ──────────────────── */
  state.sessionStep = 'prev'; render(); await new Promise(r=>setTimeout(r,80));
  R.지난수업_카드 = [...d.querySelectorAll('.cls-hw .n')].map(글);
  R.지난수업_진도글 = (()=>{
    const ns = [...d.querySelectorAll('.cls-hw')];
    const c = ns.find(x=>/그날 진도/.test(x.textContent));
    return c ? 글(c).replace('그날 진도','').trim() : '(없음)';
  })();

  /* ── ③ 반 관리 › 진도 일지 ───────────────────────────────────── */
  state.teacherTab = 'classhub'; state.classHubTab = 'progress'; state.classHubId = CID;
  render(); await new Promise(r=>setTimeout(r,120));
  R.일지_줄수 = d.querySelectorAll('.prog-log .l').length;
  R.일지_줄 = [...d.querySelectorAll('.prog-log .l')].map(글);
  R.일지_적기단추 = !![...d.querySelectorAll('button')].find(b=>/진도 적기/.test(b.textContent));
  R.일지_교재칸_그대로 = d.querySelectorAll('.cb-item').length;

  /* 「＋ 진도 적기」를 눌러 폼이 서는가 */
  [...d.querySelectorAll('button')].find(b=>/진도 적기/.test(b.textContent)).click();
  await new Promise(r=>setTimeout(r,80));
  R.폼_섰나 = !!d.getElementById('prog-detail');
  R.폼_날짜고르개 = !!d.querySelector('.prog-log, input[type=date]');

  /* 찍을 화면을 고른다 — ?shot=session 이면 수업 › 2단계 진도로 되돌린다. */
  if(/shot=session/.test(parent.location.search)){
    state.teacherTab = 'session'; state.sessionStep = 'prog'; state.classProgEditDate = '';
    state.sessionClassId = CID; state.sessionDate = '2026-09-14';
    render(); await new Promise(r=>setTimeout(r,150));
  }

  /* 좁은 폭에서 넘치는 것이 있는가 — 가로 스크롤이 나면 수업 중에 못 쓴다. */
  R.가로넘침 = document.documentElement.scrollWidth > window.innerWidth + 1;
  R.넘친요소 = [...document.querySelectorAll('.prog-row,.prog-note,.prog-past,.prog-log,.prog-log .l')]
    .filter(e=>e.getBoundingClientRect().right > window.innerWidth + 1).map(e=>e.className);
  R.폭 = window.innerWidth;

  /* ── ④ 아무것도 실 DB 로 안 나갔는가 ─────────────────────────── */
  R.실DB로_나간것 = 쓴것.filter(x=>!/^classprog:/.test(x));
  return R;
})()`);
  } catch (e) { out = { 터짐: String(e && e.message || e) }; }
  o.textContent = 'RESULT ' + JSON.stringify(out);
}, 100);
</script>
