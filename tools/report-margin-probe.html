<!doctype html><meta charset="utf-8"><title>report-margin-probe</title>
<!-- 리포트 그림(여러 명 내려받기)의 «여백»과 직보 일정표 붓줄을 확장 없이 헤드리스 크롬으로 본다 (2026-09-14).
     실서비스를 iframe 에 띄우고 가짜 학생·기록으로 rptDocEl 을 .rpb-stage 에 세워 html2canvas 로 찍는다.
     실 DB 0줄(저장 함수를 안 부른다).

     node tools/serve.js
     chrome --headless=new --hide-scrollbars --virtual-time-budget=30000 --window-size=1000,1400 \
       --screenshot=out.png --dump-dom "http://127.0.0.1:8777/tools/report-margin-probe.html" | grep -o "RESULT.*" -->
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}
#img{display:block;margin:6px;max-width:980px;border:2px solid #c33;}</style>
<pre id="o" style="font:12px monospace;color:#fff;margin:0;padding:4px;white-space:pre-wrap;">…</pre>
<script>
const fr=document.createElement('iframe'); fr.width=1000; fr.height=330; fr.src='/index.html';
document.body.appendChild(fr);
const o=document.getElementById('o');
let n=0;
const t=setInterval(async()=>{
  n++;
  let ready=false;
  try{ ready = fr.contentWindow.eval('typeof rptDocEl==="function" && typeof render==="function"'); }catch(_){}
  if(!ready){ if(n>200){ clearInterval(t); o.textContent='RESULT timeout'; } return; }
  clearInterval(t);
  const w=fr.contentWindow;
  let out; try{ out = await w.eval(`(async function(){
    const R = {};
    DATA.classes = [{id:'c1', name:'고1 0.5B'}];
    DATA.students = [{studentId:'s1', name:'김승우', school:'광남고', grade:'1', classId:'c1'}];
    const rec = emptyRecord();
    rec.attendance = [{date:'2026-09-01', status:'출석'}, {date:'2026-09-03', status:'출석'}, {date:'2026-09-08', status:'지각'}];
    DATA.records = {s1: rec}; state.allRecords = {s1: rec};
    state.reportYm = '2026-09';
    state.currentUser = {type:'teacher'}; state.view='teacher'; state.teacherTab='settings'; state.settingsSubTab='examplan';
    state.season = {name:'2학기 중간', startedAt:'2026-09-01'};
    state.examPlan = {byKey:{}}; state.examPlan.byKey[curSeasonKey()] = {from:'2026-09-25', to:'2026-10-05', cells:{}};
    state.planBrush = {k:'jikbo', t:'2'};
    render();
    await new Promise(r => setTimeout(r, 2500));

    /* ① 붓줄 — 「가능하면」이 없고, 설명 글이 없고, 시간 칸에 글자를 넣어도 초점이 남는다 */
    const bar = [...document.querySelectorAll('.ist-bar')].find(b => b.textContent.includes('지우개'));
    R.brushButtons = [...bar.querySelectorAll('button')].map(b => b.textContent.trim());
    R.hasWarnText = bar.textContent.includes('바탕을 칠하는 것은');
    const inp = document.getElementById('pl-brush-t');
    inp.focus(); inp.value = '2시'; inp.setSelectionRange(2, 2);
    inp.dispatchEvent(new Event('input', {bubbles:true}));
    await new Promise(r => setTimeout(r, 50));
    R.focusAfterType = document.activeElement && document.activeElement.id;
    R.brushT = state.planBrush.t;

    /* ② 리포트 그림 — 무대에 세워 찍고 여백을 잰다 */
    await ensureHtml2CanvasLoaded();
    const stage = document.createElement('div'); stage.className = 'rpb-stage'; document.body.appendChild(stage);
    const doc = rptDocEl(DATA.students[0], rec);
    stage.appendChild(doc);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const cs = getComputedStyle(doc);
    R.docPadding = [cs.paddingLeft, cs.paddingRight, cs.paddingTop, cs.paddingBottom, cs.width];
    const cv = await html2canvas(doc, {scale: 1, backgroundColor: '#ffffff', logging: false});
    R.canvas = [cv.width, cv.height];
    /* 왼쪽에서 첫 «흰 아닌» 픽셀까지의 거리 — 여백 실측 */
    const ctx = cv.getContext('2d');
    const img = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let minX = cv.width;
    for(let y = 0; y < cv.height; y++) for(let x = 0; x < minX; x++){
      const i = (y * cv.width + x) * 4;
      if(img[i] < 240 || img[i+1] < 240 || img[i+2] < 240){ minX = x; break; }
    }
    R.leftInkAt = minX;
    R.dataUrl = cv.toDataURL('image/png');
    stage.remove();
    return R;
  })()`); }catch(e){ o.textContent='RESULT ERROR '+(e&&e.stack||e); return; }
  const img = document.createElement('img'); img.id='img'; img.src = out.dataUrl; document.body.appendChild(img);
  const {dataUrl, ...rest} = out;
  o.textContent = 'RESULT ' + JSON.stringify(rest);
}, 100);
</script>
