<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>달리기 연습 · 김하현수학연구소</title>
<meta name="theme-color" content="#FAF9F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="ds.css">
<style>
  /* 연습 페이지 — 학생 앱의 «하루 한 판»과 달리 몇 번이든 한다.
     🔴 점수를 어디에도 저장하지 않는다. 도장도 순위도 여기서는 없다 —
       연습이 실제 기록에 섞이면 그 순위를 아무도 못 믿는다.

     🔵 **구도를 폰에 맞춘다** (2026-09-02 · S-D-11 · 사용자가 시켰다).
       예전에는 위에 52px 막대, 아래에 90px 도움말을 «칸으로» 두고 남는 데를 게임에 줬다.
       폰에서는 그 142px가 화면의 5분의 1이다. 게임이 납작해지니 하늘만 넓어 보였다.
       이제 **캔버스가 화면을 다 쓰고**, 점수와 도움말은 그 «위에 떠 있다» —
       요즘 폰 게임이 다 이렇게 한다. */
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
    font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  /* ⚠ 폰의 100vh 는 주소창을 뺀 값이 아니라 «없다 치고»의 값이라 아래가 잘린다.
     dvh 가 실제로 보이는 높이다. 못 읽는 브라우저를 위해 vh 를 먼저 둔다. */
  #wrap{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;
    background:var(--card);overflow:hidden;}
  .stage{position:absolute;inset:0;}
  .stage canvas{display:block;touch-action:none;}

  /* ── 캔버스 «위에» 뜨는 것들 ──
     ⚠ pointer-events:none 이 없으면 이 띠가 손가락을 먹어 그 자리에서 조작이 안 된다 */
  .bar{position:absolute;top:0;left:0;right:0;z-index:2;
    height:calc(46px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 14px 0;
    display:flex;align-items:center;gap:8px;pointer-events:none;
    background:linear-gradient(180deg,rgba(250,249,246,.85) 0%,rgba(250,249,246,0) 100%);}
  .bar .t{font-size:12.5px;font-weight:700;}
  .bar .t s{text-decoration:none;color:var(--dim);font-weight:400;margin-left:6px;font-size:11px;}
  .bar .sc{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

  /* 도움말 — 접어 둔다. 펴 보는 것은 처음 한 번이면 된다 */
  .help{position:absolute;right:0;bottom:0;z-index:2;max-width:min(420px,92%);
    padding:0 12px calc(10px + env(safe-area-inset-bottom));}
  .help summary{list-style:none;display:inline-flex;align-items:center;gap:5px;float:right;
    font-size:11px;color:var(--sub);background:rgba(250,249,246,.92);
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;}
  .help summary::-webkit-details-marker{display:none;}
  .help[open] summary{float:none;margin-bottom:7px;}
  .help .in{background:rgba(250,249,246,.96);border:1px solid var(--line);
    border-radius:var(--r-md);padding:10px 12px;
    font-size:11.5px;color:var(--dim);line-height:1.8;}
  .help b{color:var(--sub);}
  .help .k{display:inline-block;min-width:20px;padding:1px 5px;border:1px solid var(--line);
    border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sub);
    background:var(--sunk);text-align:center;}

  /* 끝난 뒤 — 바로 다시 할 수 있어야 «연습»이다 */
  .over{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    background:rgba(250,249,246,.94);}
  .over .in{text-align:center;padding:0 20px;}
  .over .big{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;line-height:1.1;}
  .over .sub{margin-top:6px;font-size:12.5px;color:var(--sub);}
  .over .btns{margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .btn{font-family:inherit;font-size:13px;padding:10px 18px;border-radius:var(--r-md);
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .btn:active{transform:translateY(1px);}
</style>
</head>
<body>
<div id="wrap">
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="bar">
    <span class="t">달리기 연습<s id="which">3레인 러너</s></span>
    <span class="sc" id="sc">0</span>
  </div>
  <details class="help">
    <summary>조작법 · 장애물</summary>
    <div class="in">
      <b>PC</b> <span class="k">←</span> <span class="k">→</span> 레인 ·
      <span class="k">↑</span> <span class="k">Space</span> 점프 ·
      <span class="k">↓</span> 슬라이드<br>
      <b>폰</b> 옆으로 쓸기 = 레인 · 위로 = 점프 · 아래로 = 슬라이드 · 톡 누르면 점프<br>
      <b>자동차</b> 비켜 가기 · <b>물웅덩이</b> 뛰어넘기 ·
      <b>차단봉</b> 미끄러지기 · ★ 50점<br>
      여기 점수는 <b>어디에도 저장되지 않습니다</b> — 마음껏 연습하세요.
    </div>
  </details>
</div>

<!-- ⚠ ?v= 를 붙이는 까닭 — 브라우저가 game-core.js 를 캐시해서, 올려도 학생 화면에는
     옛 게임이 그대로 돈다(Ctrl+Shift+R 을 해야 바뀐다 — 학생에게 그걸 시킬 수는 없다).
     🔴 **game-core.js 를 고칠 때마다 이 날짜를 같이 올린다.** 두 파일 다. -->
<script src="game-core.js?v=2026-09-02b"></script>
<script>
  const cv = document.getElementById('cv');
  const scEl = document.getElementById('sc');
  const stage = document.getElementById('stage');
  let mode = MODE_RUNNER, best = 0;

  function start(){
    const old = stage.querySelector('.over');
    if(old) old.remove();
    scEl.textContent = '0';
    Game.mount(cv, { mode, onScore(s){ scEl.textContent = s; }, onEnd: done });
  }
  function done(score){
    if(score > best) best = score;
    const d = document.createElement('div');
    d.className = 'over';
    d.innerHTML = '<div class="in">' +
      '<div class="big">' + score.toLocaleString() + '</div>' +
      '<div class="sub">' + (score >= best ? '이번이 가장 높습니다' :
        '이 연습에서 가장 높은 점수 ' + best.toLocaleString()) + '</div>' +
      '<div class="btns">' +
        '<button class="btn p" id="again">다시 하기</button>' +
        '<button class="btn" id="swap">' +
          (mode === MODE_RUNNER ? '똥피하기로' : '달리기로') + '</button>' +
      '</div></div>';
    stage.appendChild(d);
    d.querySelector('#again').onclick = start;
    d.querySelector('#swap').onclick = () => {
      mode = (mode === MODE_RUNNER) ? MODE_DODGE : MODE_RUNNER;
      document.getElementById('which').textContent =
        mode === MODE_RUNNER ? '3레인 러너' : '똥피하기';
      start();
    };
  }
  /* 창 크기가 바뀌면 캔버스를 다시 잡는다 — 폰을 돌리면 반드시 일어난다.
     🔴 ⚠ **크기가 실제로 달라졌을 때만** 다시 시작한다 (2026-09-02).
       폰에서는 주소창이 접히기만 해도 resize 가 오고, 그때마다 판이 리셋되면
       달리는 중에 게임이 처음으로 돌아간다. */
  let rt = 0, lastSize = '';
  const sized = () => { const r = stage.getBoundingClientRect();
    return Math.round(r.width) + 'x' + Math.round(r.height); };
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const now = sized();
      if(now === lastSize) return;
      lastSize = now;
      if(!stage.querySelector('.over')) start();
    }, 250);
  });
  lastSize = sized();
  start();
</script>
</body>
</html>
